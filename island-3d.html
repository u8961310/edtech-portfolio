<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🏝️ 我的學習樂園島</title>
<meta name="description" content="國小資訊教育互動教材：六座主題小島拼成的 3D 學習樂園，點一格就進關卡。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* 3D 學習樂園島：資料在下方 ISLANDS，新增單元只要在那裡加一列 */
  :root { --ink:#3b2f2a; --card:#fffaf2; --accent:#d9480f; --muted:#6b5446; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; overflow:hidden;
    background: radial-gradient(ellipse at 50% 35%, #fffaf0 0%, #fbe9d2 60%, #f3d8b8 100%); -webkit-tap-highlight-color:transparent; }
  canvas { display:block; touch-action:none; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .panel { background:var(--card); border:3px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); }

  /* 上方列 */
  .bar { position:fixed; left:16px; right:16px; top:16px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; pointer-events:none; z-index:5; }
  .bar > * { pointer-events:auto; }
  .title { margin:0; padding:10px 20px; font-weight:900; font-size:24px; letter-spacing:1px; }
  .right { display:flex; gap:10px; }
  .stars, .teacher { padding:8px 16px; font-weight:900; font-size:22px; text-decoration:none; color:var(--ink); display:flex; align-items:center; gap:4px; }
  .stars small { font-size:15px; color:var(--muted); }
  .teacher { font-size:20px; }

  /* 下方切換 */
  .views { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; gap:6px; padding:6px; z-index:5; }
  .views button { white-space:nowrap; border:0; background:none; padding:8px 18px; border-radius:14px; font-size:20px; font-weight:900; }
  .views button[aria-pressed="true"] { background:var(--accent); color:#fff; }

  /* 3D 上的標籤 */
  #labels { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .5s; z-index:1; }
  #labels.on { opacity:1; }
  .lbl { position:absolute; left:0; top:0; white-space:nowrap; font-weight:900; will-change:transform; }
  .lbl.top { z-index:2; }
  .isl { display:flex; align-items:center; gap:6px; padding:4px 12px 4px 5px; font-size:16px; background:var(--card);
         border:2.5px solid var(--ink); border-radius:999px; box-shadow:0 3px 0 var(--ink); transform:translate(-50%,-100%); position:relative; }
  .isl i { font-style:normal; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:15px; background:var(--c); }
  .isl:after { content:""; position:absolute; left:50%; bottom:-9px; width:2.5px; height:9px; background:var(--ink); }
  .bdg { width:32px; height:32px; border-radius:50%; background:#fff; border:3px solid var(--c); display:grid; place-items:center;
         font-size:17px; box-shadow:0 2px 4px rgba(59,47,42,.3); position:relative; transform:translate(-50%,-100%) scale(.6); opacity:0; transition:opacity .3s, transform .3s; }
  body.near .bdg { opacity:1; transform:translate(-50%,-100%) scale(1); }
  .bdg s { position:absolute; right:-8px; top:-9px; font-size:13px; text-decoration:none; }
  .tip { transform:translate(-50%,-100%); background:var(--ink); color:#fff; padding:5px 12px; border-radius:12px; font-size:16px; display:none; }
  .tip.on { display:block; }
  .hint { font-size:40px; transform:translate(-50%,0); animation:tap 1.2s ease-in-out infinite; }
  @keyframes tap { 50% { translate:0 10px; scale:.92; } }

  /* 關卡卡片 */
  #card { position:fixed; right:16px; top:84px; width:300px; padding:20px; z-index:6; text-align:center; }
  #card[hidden], #list[hidden] { display:none; }
  #card .x, #list .x { position:absolute; right:10px; top:10px; width:40px; height:40px; border-radius:50%; border:2.5px solid var(--ink); background:#fff; font-size:18px; }
  .emo { width:96px; height:96px; margin:4px auto 10px; border-radius:50%; display:grid; place-items:center; font-size:52px; background:var(--c); border:3px solid var(--ink); }
  #card h2 { margin:0; font-size:30px; font-weight:900; }
  #card .full { margin:4px 0 12px; font-size:15px; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-bottom:16px; }
  .chips span { padding:4px 12px; border-radius:999px; background:#f6ead8; font-size:16px; }
  .go { display:block; padding:14px; border-radius:16px; background:var(--accent); color:#fff; font-size:26px; font-weight:900; text-decoration:none;
        border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); animation:pulse 1.6s ease-in-out infinite; }
  .go:active { translate:0 4px; box-shadow:0 1px 0 var(--ink); }
  @keyframes pulse { 50% { scale:1.04; } }
  .mini { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .mini button, .grid button { border:2.5px solid var(--ink); background:#fff; border-radius:16px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:2px; position:relative; }
  .mini b, .grid b { font-size:30px; line-height:1.2; }
  .mini span, .grid span { font-size:13px; }
  .mini s, .grid s { position:absolute; right:2px; top:0; text-decoration:none; font-size:14px; }

  /* 清單 */
  #list { position:fixed; inset:0; z-index:7; background:rgba(59,47,42,.35); display:grid; place-items:center; padding:16px; }
  #list .sheet { position:relative; width:min(760px, 100%); max-height:calc(100% - 20px); overflow:auto; padding:20px; }
  #list h2 { margin:0 0 6px; font-size:24px; }
  #list h3 { display:flex; align-items:center; gap:8px; margin:16px 0 8px; font-size:20px; }
  #list h3 i { font-style:normal; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--c); border:2.5px solid var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px; }
  .grid button:hover, .mini button:hover { background:#fff3e2; }
  .old { display:inline-block; margin-top:18px; color:var(--muted); font-size:15px; }

  #loader { position:fixed; inset:0; display:grid; place-items:center; font-size:26px; font-weight:900; z-index:9; transition:opacity .6s; pointer-events:none; }
  #loader.off { opacity:0; }
  #loader div { padding:14px 26px; }
  #fail { position:fixed; inset:0; display:none; place-items:center; z-index:10; text-align:center; font-size:22px; font-weight:900; }

  @media (max-width:640px) {
    .bar { left:10px; right:10px; top:10px; }
    .title { font-size:17px; padding:8px 12px; }
    .stars, .teacher { font-size:17px; padding:6px 10px; }
    .isl { font-size:13px; } .isl i { width:22px; height:22px; font-size:12px; }
    #card { left:10px; right:10px; top:auto; bottom:calc(84px + env(safe-area-inset-bottom)); width:auto; padding:16px; display:grid; grid-template-columns:84px 1fr; gap:4px 14px; text-align:left; align-items:center; }
    #card[hidden] { display:none; }
    #card .emo { width:76px; height:76px; font-size:42px; margin:0; grid-row:span 2; }
    #card h2 { font-size:24px; } #card .full { margin:0; font-size:13px; }
    #card .chips { grid-column:1 / -1; justify-content:flex-start; margin:6px 0 8px; }
    #card .go, #card .mini { grid-column:1 / -1; }
    .go { font-size:22px; padding:10px; }
  }
  @media (prefers-reduced-motion: reduce) { .hint, .go { animation:none; } }
</style>
</head>
<body>
<div id="labels"></div>

<header class="bar">
  <h1 class="panel title">🏝️ 我的學習樂園島</h1>
  <div class="right">
    <div class="panel stars" id="stars" title="玩過的關卡">⭐ 0</div>
    <a class="panel teacher" href="./portfolio.html" title="給老師看">👨‍🏫</a>
  </div>
</header>

<nav class="panel views" aria-label="檢視">
  <button id="vHome" aria-pressed="true">🌏 全景</button>
  <button id="vList" aria-pressed="false">📋 清單</button>
</nav>

<aside id="card" class="panel" hidden aria-live="polite"></aside>

<div id="list" hidden role="dialog" aria-label="全部關卡">
  <div class="sheet panel">
    <button class="x" aria-label="關閉">✖</button>
    <h2>📋 全部關卡</h2>
    <div id="listBody"></div>
    <a class="old" href="./list.html">🗂️ 卡片版</a>
  </div>
</div>

<div id="loader"><div class="panel">🧩 正在組合樂園…</div></div>
<div id="fail"><div class="panel" style="padding:24px">😢 這台電腦跑不動 3D<br><a href="./index.html">👉 改看插畫版</a></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { HorizontalTiltShiftShader } from 'three/addons/shaders/HorizontalTiltShiftShader.js';
import { VerticalTiltShiftShader } from 'three/addons/shaders/VerticalTiltShiftShader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { ISLANDS, UNITS, recText } from './island/data.js';

const doneCount = UNITS.filter(u => u.rec).length;
document.getElementById('stars').innerHTML = `⭐ ${doneCount}<small>/${UNITS.length}</small>`;

// ================= 3D 基本 =================
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = Math.min(innerWidth, innerHeight) < 700;
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  if (!renderer.getContext()) throw 0;
} catch { document.getElementById('loader').remove(); document.getElementById('fail').style.display = 'grid'; throw new Error('no webgl'); }
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // 島是靜態的：陰影只在開場和合併後算，不每格重算
renderer.shadowMap.needsUpdate = true;
document.body.prepend(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); document.getElementById('fail').style.display = 'grid'; });

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const C = {
  water:0x8fd3e6, plateSide:0xe9b98a, plateSide2:0xd59c6a,
  dirt:0xe7c08f, dirt2:0xc99a6b, grass:0xb6e39a, sand:0xfbe3b4, cream:0xfff6e6, wood:0xd59b62, woodDark:0xa86f3e,
  stone:0xece4d6, win:0x9fd8f0, door:0x9b6a44, leaf:[0x8fd37a,0x7cc96d,0xa7e08a], pine:[0x6fc28a,0x5fb47f],
  flower:[0xff8fb1,0xffd45c,0xffffff,0xc8a4ff,0xff9f6e], rock:0xd8d2c8,
};
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, innerWidth/innerHeight, 1, 220);
const HOME_T = new THREE.Vector3(0, -1.2, 1.4);
// 直向螢幕視野窄，依寬高比把鏡頭往後拉，讓六座島都入鏡
const homePos = () => { const a = innerWidth / innerHeight;
  if (a >= 1) return new THREE.Vector3(19.5, 33.5, 35.5);
  const k = Math.min(1.6, Math.max(1, .58 / a)); return new THREE.Vector3(19.5, 60, 50).sub(HOME_T).multiplyScalar(k).add(HOME_T); };
camera.position.copy(homePos());

const hemi = new THREE.HemisphereLight(0xfffaf0, 0xf0c9a0, 1.7); hemi.layers.enableAll(); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6); sun.layers.enableAll();
sun.position.set(-16, 28, 14); sun.castShadow = true;
sun.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left:-20, right:20, top:20, bottom:-20, near:1, far:90 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

const mats = new Map();
const mat = (c, o={}) => { const k = c + JSON.stringify(o); if (!mats.has(k)) mats.set(k, new THREE.MeshStandardMaterial({ color:c, roughness:.82, ...o })); return mats.get(k); };
const mesh = (geo, c, parent, x=0, y=0, z=0, o) => { const m = new THREE.Mesh(geo, typeof c === 'number' ? mat(c, o) : c); m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };
const pastel = (c, a=.3) => new THREE.Color(c).lerp(new THREE.Color(0xffffff), a).getHex();
const darker = (c, a=.25) => new THREE.Color(c).lerp(new THREE.Color(0x5a3a2a), a).getHex();
const hex = c => '#' + new THREE.Color(c).getHexString();

const geoCache = new Map();
function hexGeo(r, h, bevel=.05) {
  const k = `${r}|${h}|${bevel}`; if (geoCache.has(k)) return geoCache.get(k);
  const s = new THREE.Shape(), rr = r - bevel;
  for (let i=0;i<6;i++) { const a = Math.PI/6 + i*Math.PI/3; const x = rr*Math.cos(a), y = rr*Math.sin(a); i ? s.lineTo(x,y) : s.moveTo(x,y); }
  const g = new THREE.ExtrudeGeometry(s, { depth:Math.max(.001, h-2*bevel), bevelEnabled:true, bevelThickness:bevel, bevelSize:bevel, bevelSegments:3, curveSegments:1 });
  g.rotateX(-Math.PI/2); g.translate(0, bevel, 0); g.computeVertexNormals();
  geoCache.set(k, g); return g;
}
const B = (w,h,d) => new THREE.BoxGeometry(w,h,d);
const CY = (rt,rb,h,n=16,...rest) => new THREE.CylinderGeometry(rt,rb,h,n,...rest);
const SP = (r,w=16,h=12,...rest) => new THREE.SphereGeometry(r,w,h,...rest);
const CO = (r,h,n=16) => new THREE.ConeGeometry(r,h,n);

const SQ3 = Math.sqrt(3);
const toWorld = (q, r) => new THREE.Vector3(SQ3*(q + r/2), 0, 1.5*r);
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const ring = (cq, cr, k) => { if (!k) return [[cq,cr]]; const out = []; let q = cq + DIRS[4][0]*k, r = cr + DIRS[4][1]*k;
  for (let i=0;i<6;i++) for (let j=0;j<k;j++) { out.push([q,r]); q += DIRS[i][0]; r += DIRS[i][1]; } return out; };

// ================= 水面底盤 =================
const PLATE_R = 17.5;
mesh(hexGeo(PLATE_R, 1.6, .25), C.plateSide, scene, 0, -1.75, 0);
mesh(hexGeo(PLATE_R + .25, .35, .12), C.plateSide2, scene, 0, -1.9, 0);
{ const water = new THREE.Mesh(hexGeo(PLATE_R - .35, .2, .05), new THREE.MeshStandardMaterial({ color:C.water, roughness:.25, metalness:.05 }));
  water.position.y = -.25; water.receiveShadow = true; scene.add(water); }
const ripples = new THREE.InstancedMesh(new THREE.CapsuleGeometry(.04, .18, 2, 6), mat(0xd6f2fa, { roughness:.4 }), 50);
const ripData = [];
{ const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion();
  for (let i=0;i<50;i++) { const a = rnd()*Math.PI*2, d = 3 + rnd()*13; ripData.push({ x:Math.cos(a)*d, z:Math.sin(a)*d, rz:rnd()*.6, s:1+rnd()*.5, ph:rnd()*6 });
    q4.setFromEuler(new THREE.Euler(Math.PI/2, 0, ripData[i].rz)); m4.compose(new THREE.Vector3(ripData[i].x, -.04, ripData[i].z), q4, new THREE.Vector3(1, ripData[i].s, .5)); ripples.setMatrixAt(i, m4); }
  scene.add(ripples); }

// ================= 地塊與小物 =================
const foamGeo = new THREE.CircleGeometry(1.32, 6); foamGeo.rotateX(-Math.PI/2); foamGeo.rotateY(Math.PI/6);
const foamMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:.55, depthWrite:false });
function tile(root, q, r, { top=C.grass, lift=0, kind='grass' }={}) {
  const p = toWorld(q, r).sub(root.userData.center), g = new THREE.Group(); g.position.set(p.x, lift, p.z); root.add(g);
  const foam = new THREE.Mesh(foamGeo, foamMat); foam.position.y = -.035 - lift; foam.renderOrder = 1; g.add(foam);
  mesh(hexGeo(1.08, .32, .08), C.sand, g, 0, -.3, 0);
  mesh(hexGeo(.96, .55, .06), C.dirt, g, 0, -.25, 0);
  mesh(hexGeo(.93, .18, .05), C.dirt2, g, 0, -.32, 0);
  const tc = kind === 'stone' ? C.stone : new THREE.Color(top).offsetHSL(0, 0, [-.02, 0, .02][rnd()*3|0]).getHex(); // 只用 3 種深淺，材質才併得起來
  mesh(hexGeo(.99, .2, .07), tc, g, 0, .22, 0);
  g.userData.top = .42;
  g.userData.world = toWorld(q, r).setY(lift + .42);
  return g;
}
function tree(p, x, z, s=1, kind) {
  const t = p.userData.top; kind ??= rnd() < .5 ? 'pine' : 'round';
  mesh(CY(.05*s, .07*s, .3*s, 8), C.wood, p, x, t + .15*s, z);
  if (kind === 'pine') { const c = C.pine[rnd()*2|0];
    [[.3,.38,.38],[.24,.32,.58],[.16,.26,.76]].forEach(([r,h,y]) => mesh(CO(r*s, h*s, 9), c, p, x, t + y*s, z));
  } else { const c = C.leaf[rnd()*3|0];
    mesh(SP(.24*s, 14, 10), c, p, x, t + .45*s, z); mesh(SP(.17*s, 12, 8), c, p, x + .13*s, t + .38*s, z + .06*s); mesh(SP(.15*s, 12, 8), c, p, x - .1*s, t + .55*s, z - .05*s); }
}
function bush(p, x, z, s=1) { const c = C.leaf[rnd()*3|0]; mesh(SP(.12*s,10,8), c, p, x, p.userData.top+.06*s, z); mesh(SP(.09*s,10,8), c, p, x+.1*s, p.userData.top+.05*s, z+.03); }
function flowers(p, x, z, n=4) { for (let i=0;i<n;i++) { const a = rnd()*6.28, d = rnd()*.14;
  mesh(CY(.008,.008,.08,4), 0x6fbf5f, p, x+Math.cos(a)*d, p.userData.top+.04, z+Math.sin(a)*d);
  mesh(SP(.03,6,5), C.flower[rnd()*5|0], p, x+Math.cos(a)*d, p.userData.top+.09, z+Math.sin(a)*d); } }
function rock(p, x, z, s=1) { const m = mesh(new THREE.DodecahedronGeometry(.09*s, 0), C.rock, p, x, p.userData.top+.04*s, z); m.rotation.set(rnd(), rnd(), rnd()); m.scale.y = .7; }
function lamp(p, x, z) { mesh(CY(.02,.03,.55,8), 0x6b5a4e, p, x, p.userData.top+.27, z); mesh(SP(.06,10,8), 0xfff2b0, p, x, p.userData.top+.58, z, { emissive:0xffd77a, emissiveIntensity:.6 }); }
function bench(p, x, z, ry=0) { const g = new THREE.Group(); g.position.set(x, p.userData.top, z); g.rotation.y = ry; p.add(g);
  mesh(B(.34,.03,.1), C.wood, g, 0, .1, 0); mesh(B(.34,.08,.02), C.wood, g, 0, .17, -.05); [-.14,.14].forEach(a => mesh(B(.02,.1,.08), 0x6b5a4e, g, a, .05, 0)); }

function windowAt(g, x, y, z, ry=0) { const w = new THREE.Group(); w.position.set(x,y,z); w.rotation.y = ry; g.add(w);
  mesh(B(.15,.15,.02), 0xffffff, w); mesh(B(.11,.11,.025), C.win, w, 0, 0, .002, { roughness:.2 }); mesh(B(.11,.015,.03), 0xffffff, w); }
function house(p, color, x, z) {
  const g = new THREE.Group(); g.position.set(x, p.userData.top, z); g.rotation.y = rnd()*.6-.3; p.add(g);
  mesh(B(.62,.46,.5), C.cream, g, 0, .23, 0); mesh(B(.66,.05,.54), darker(C.cream,.1), g, 0, .02, 0);
  const s = new THREE.Shape(); s.moveTo(-.42,0); s.lineTo(.42,0); s.lineTo(0,.36); s.closePath();
  const rg = new THREE.ExtrudeGeometry(s, { depth:.64, bevelEnabled:true, bevelThickness:.02, bevelSize:.02, bevelSegments:2 }); rg.translate(0,0,-.32);
  mesh(rg, pastel(color,.15), g, 0, .46, 0);
  mesh(B(.1,.22,.1), 0xe9d8c4, g, .18, .74, -.08); mesh(B(.13,.04,.13), 0xd8c4ae, g, .18, .86, -.08);
  mesh(B(.15,.25,.03), C.door, g, 0, .125, .255); mesh(SP(.015,6,6), 0xffd45c, g, .045, .13, .275);
  windowAt(g, -.19, .28, .255); windowAt(g, .19, .28, .255); windowAt(g, .315, .26, 0, Math.PI/2);
  mesh(B(.2,.02,.1), darker(color,.1), g, 0, .27, .29);

function tower(p, color, x, z) {

// 六座主題島
const CENTERS = [[5,0],[0,5],[-5,5],[-5,0],[0,-5],[5,-5]];
const hubW = new THREE.Vector3();
ISLANDS.forEach((isl, ii) => {
  const [cq, cr] = CENTERS[ii], c = toWorld(cq, cr);
  const root = newRoot(c, 1 + ii, isl.id);
  isl.center = c;
  const need = isl.list.length;
  const r2 = ring(cq, cr, 2).sort((a,b) => toWorld(...b).length() - toWorld(...a).length());
  const slots = [...ring(cq, cr, 1), ...r2.slice(0, Math.max(0, need - 6) + 2)];

  const ct = tile(root, cq, cr, { top:pastel(isl.color,.45), lift:.25 });
  const top = ct.userData.top;
  mesh(CY(.42,.5,.25,6), C.stone, ct, 0, top+.12, 0).rotation.y = Math.PI/6;
  mesh(CY(.3,.36,1.3,20), C.cream, ct, 0, top+.9, 0);
  for (let y=0;y<3;y++) mesh(new THREE.TorusGeometry(.33-y*.02,.03,6,24), pastel(isl.color,.05), ct, 0, top+.5+y*.35, 0).rotation.x = Math.PI/2;
  for (let i=0;i<6;i++) { const a = i*Math.PI/3; windowAt(ct, Math.sin(a)*.32, top+1.15, Math.cos(a)*.32, a); }
  mesh(CY(.4,.4,.06,20), darker(C.cream,.1), ct, 0, top+1.58, 0); mesh(CO(.44,.62,20), pastel(isl.color,.1), ct, 0, top+1.92, 0);
  mesh(SP(.07,12,8), 0xffd45c, ct, 0, top+2.27, 0, { metalness:.3, roughness:.35 });
  isl.labelPos = new THREE.Vector3(c.x, top + .25 + 2.85, c.z);
  addLabel(`<div class="isl" style="--c:${hex(pastel(isl.color,.35))}"><i>${isl.icon}</i>${isl.name}</div>`, isl.labelPos).el.classList.add('top');
  hits.push({ local:ct.position.clone(), root, island:isl, world:ct.userData.world, height:2.6, top:[0, 0, .45], ground:.5, label:isl.labelPos });

  slots.forEach(([q,r], k) => {
    const t = tile(root, q, r, { lift:(k%3)*.05 });
    const u = isl.list[k];
    if (u) {
      const bi = (k + ii) % 3;
      BUILD[bi](t, isl.color, -.18, -.22);
      const pg = new THREE.Group(); pg.position.set(.38, t.userData.top, .32); pg.rotation.y = rnd()*1.2 - .6; t.add(pg);
      PROPS[u.prop](pg);
      flowers(t, -.5, .35, 3); if (rnd() < .6) bush(t, .5, -.35, .9); if (rnd() < .5) rock(t, -.6, -.05);
      const w = t.userData.world;
      u.world = w;
      u.badge = addLabel(`<div class="bdg" style="--c:${hex(isl.color)}">${u.emoji}${u.rec ? '<s>⭐</s>' : ''}</div>`, new THREE.Vector3(w.x - .18, w.y - .42 + BUILD_H[bi], w.z - .22));
      hits.push({ local:t.position.clone(), root, unit:u, world:w, height:[1.05, 1.85, .95][bi], top:[-.18, -.22, .38] });
    } else {
      tree(t, -.25, .15, 1.15); tree(t, .3, -.2, .95); tree(t, .25, .4, .75); rock(t, -.4, -.4, 1.3); flowers(t, 0, -.05, 4);
    }
  });

  // 木板橋（自己一個 root，開場時從家裡長出去）
  const dir = c.clone().sub(hubW).normalize();
  const a = hubW.clone().add(dir.clone().multiplyScalar(SQ3 + .9));
  const b = c.clone().sub(dir.clone().multiplyScalar(SQ3 + .9));
  const len = a.distanceTo(b), n = Math.floor(len / .2);
  const br = new THREE.Group(); br.position.copy(a); br.rotation.y = Math.atan2(dir.x, dir.z); scene.add(br);
  roots.push({ g:br, kind:'grow', delay:8 + ii*.5, id:'bridges' });
  for (let i=0;i<=n;i++) { const z = len*i/n, sag = Math.sin(Math.PI*i/n)*-.12;
    mesh(B(.62,.05,.15), i%2 ? C.wood : pastel(C.wood,.12), br, 0, .4+sag, z).rotation.y = (rnd()-.5)*.08; }
  for (let i=0;i<=4;i++) { const z = len*i/4, sag = Math.sin(Math.PI*i/4)*-.12; [-1,1].forEach(s => mesh(CY(.03,.035,.32,8), C.woodDark, br, .32*s, .55+sag, z)); }
  [-1,1].forEach(s => { const pts = []; for (let i=0;i<=16;i++) pts.push(new THREE.Vector3(.32*s, .68+Math.sin(Math.PI*i/16)*-.15, len*i/16));
    mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 32, .012, 5), 0xf5e6c8, br); });
});

  camera.lookAt(HOME_T); camera.updateMatrixWorld();

  // 分層：每個 root 一層（中央島、六座島、橋），其餘（底盤、水、船、浮標）是 base；雲交給 CSS

// ================= 開場動畫 =================
const easeBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
let introT0 = null, introDone = false;
const STEP = 170, DROP = 750;
function introFrame(now) {
  const t = now - introT0; let all = true;
  for (const r of roots) {
    const k = Math.min(1, Math.max(0, (t - r.delay*STEP) / DROP)); if (k < 1) all = false;
    if (r.kind === 'drop') { r.g.position.y = (1 - easeBack(k)) * 12; r.g.visible = k > 0; }
    else { r.g.scale.set(1, 1, Math.max(.001, ease(k))); r.g.visible = k > 0; }
  }
  return all;
}
function endIntro() {
  if (introDone) return;
  for (const r of roots) { r.g.visible = true; r.g.position.y = r.kind === 'drop' ? 0 : r.g.position.y; r.g.scale.set(1,1,1); }
  introDone = true; labelsEl.classList.add('on');
  mergeAll();
  renderer.shadowMap.needsUpdate = true; dirty = true;
}
// 開場動畫要各島分開動；落地後就把全部島和橋併成一包（同材質一個 mesh），繪圖次數大約剩 1/8
function mergeAll() {
  if (hubStar) scene.attach(hubStar);
  const groups = new Map();
  for (const { g } of roots) {
    g.updateMatrixWorld(true);
    g.traverse(o => {
      if (!o.isMesh) return;
      const geo = o.geometry.clone().applyMatrix4(o.matrixWorld); o.geometry.dispose();
      const key = o.material.uuid + (o.castShadow ? 's' : '');
      if (!groups.has(key)) groups.set(key, { m:o.material, cast:o.castShadow, rec:o.receiveShadow, order:o.renderOrder, list:[] });
      groups.get(key).list.push(geo);
    });
    scene.remove(g);
  }
  const merged = [];
  for (const { m, cast, rec, order, list } of groups.values()) {
    const mm = new THREE.Mesh(mergeGeometries(list, false), m); mm.castShadow = cast; mm.receiveShadow = rec; mm.renderOrder = order; scene.add(mm); merged.push(mm);
  }
  pickables = merged.filter(m => !m.material.transparent);
  window.__island.drawGroups = groups.size;

const v = new THREE.Vector3(), clock = new THREE.Clock();

    if (v.z > 1) { el.style.display = 'none'; continue; } el.style.display = '';
    el.style.transform = `translate(${(v.x+1)/2*innerWidth}px, ${(1-v.y)/2*innerHeight}px)`; }
}
// 省電模式：開場後量幾格速度，太慢（舊平板、沒顯卡）就關背景動畫、只在有操作時重畫

  screenOf(name) { const h = hits.find(h => (h.unit ? h.unit.short : h.island.name) === name); const p = h.world.clone().project(camera); return [(p.x+1)/2*innerWidth, (1-p.y)/2*innerHeight]; } };
// 網址加 ?fps 會在左下角顯示每秒幾格，給老師在學校電腦上檢查順不順
const fpsEl = location.search.includes('fps') ? Object.assign(document.body.appendChild(document.createElement('div')),
  { style:'position:fixed;left:10px;bottom:10px;z-index:20;background:#3b2f2a;color:#fff;padding:4px 10px;border-radius:8px;font:700 14px monospace' }) : null;
let fpsN = 0, fpsT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (fpsEl) { fpsN++; if (now - fpsT > 1000) { fpsEl.textContent = `${Math.round(fpsN * 1000 / (now - fpsT))} fps · ${lowPower ? '省電' : '一般'} · ${window.__island.drawGroups} 組`; fpsN = 0; fpsT = now; } }
  const t = clock.getElapsedTime();
  if (introDone && !lowPower && perf.n < 20) { if (perf.last) { perf.sum += now - perf.last; perf.n++; } perf.last = now;
    if (perf.n === 20 && perf.sum / 20 > 25) lowPower = true; }
  if (!introDone) { if (introFrame(now)) endIntro(); dirty = true; renderer.shadowMap.needsUpdate = true; }
  if (fly) { const k = Math.min(1, (now - fly.t0) / fly.dur), e = ease(k);

    for (const c of clouds) { c.g.position.x += c.sp * .016; if (c.g.position.x > 24) c.g.position.x = -24; }
    boat.position.y = -.2 + Math.sin(t*1.4)*.05; boat.rotation.z = Math.sin(t*1.1)*.05;
    buoys.forEach((b, i) => { b.position.y = -.05 + Math.sin(t*1.6 + i*2)*.05; b.rotation.z = Math.sin(t*1.3 + i)*.08; });
    for (let i=0;i<ripData.length;i++) { const d = ripData[i], k = .5 + .5*Math.sin(t*.9 + d.ph);

  composer.render();
  placeLabels();
}
