<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>示範關 - 小常識島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Baloo+2:wght@700;800&display=swap">
  <link rel="stylesheet" href="../css/smart-island.css">
  <style>
    /* ===== 場景範本：Gemini 照這個寫。場景樣式一律 sc- 開頭，不改 .sm- 樣式 ===== */
    .sc-q { position: absolute; left: 32px; top: 22px; width: 900px; padding: 14px 26px; }
    .sc-q .sm-zy { font-size: 40px; }
    .sc-opts { position: absolute; left: 32px; top: 170px; width: 900px; display: flex; gap: 24px; }
    .sc-opt { flex: 1; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--ink); }
    .sc-opt svg { width: 200px; height: 170px; }
    .sc-opt:hover { transform: translateY(-3px); }
    .sc-opt .sc-tag { font: 900 22px var(--f-num); width: 44px; height: 44px; border-radius: 50%; background: var(--violet); color: #fff; display: flex; align-items: center; justify-content: center; }
    .sc-petbox { position: absolute; left: 968px; top: 40px; width: 360px; height: 500px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
    .sc-petbox .sc-pet { width: 300px; height: 300px; }
    .sc-petbox .sc-pet svg { width: 100%; height: 100%; overflow: visible; }
    .sc-bubble { padding: 12px 18px; margin-bottom: 8px; font-size: 22px; font-weight: 700; }
  </style>
</head><body>
<script src="../js/smart-pet.js"></script>
<script src="../js/smart-ui.js"></script>
<script>
(function () {
  'use strict';
  var PIC = {
    mouse: '<svg viewBox="0 0 200 170"><path d="M100 20v28" stroke="#5C4870" stroke-width="5" fill="none"/><rect x="62" y="44" width="76" height="110" rx="38" fill="#fff" stroke="#3B2350" stroke-width="5"/><path d="M100 46v40M64 86h72" stroke="#3B2350" stroke-width="4"/><rect x="95" y="58" width="10" height="18" rx="5" fill="#6A45C9"/></svg>',
    keyboard: '<svg viewBox="0 0 200 170"><rect x="14" y="54" width="172" height="76" rx="12" fill="#fff" stroke="#3B2350" stroke-width="5"/>' +
      [0, 1, 2].map(function (r) { var s = ''; for (var c = 0; c < 8; c++) s += '<rect x="' + (26 + c * 19) + '" y="' + (64 + r * 19) + '" width="14" height="13" rx="3" fill="#ECE3FA" stroke="#5C4870" stroke-width="2"/>'; return s; }).join('') +
      '<rect x="60" y="110" width="80" height="12" rx="4" fill="#FFE1CB" stroke="#5C4870" stroke-width="2"/></svg>',
    screen: '<svg viewBox="0 0 200 170"><rect x="24" y="16" width="152" height="104" rx="10" fill="#fff" stroke="#3B2350" stroke-width="5"/><rect x="36" y="28" width="128" height="80" rx="4" fill="#9BD7F2"/><path d="M36 92 Q80 60 120 88 T164 80V108H36Z" fill="#7CC79A"/><circle cx="140" cy="48" r="10" fill="#FFD65E"/><path d="M100 120v22M66 150h68" stroke="#3B2350" stroke-width="6" stroke-linecap="round"/></svg>'
  };
  // 每題：題目（注音句）、正解、解說（答錯時說一句正確觀念）
  var QS = [
    { q: '滑鼠在哪裡？', ans: 'mouse', why: '滑鼠可以移動游標。' },
    { q: '鍵盤在哪裡？', ans: 'keyboard', why: '鍵盤用來打字。' },
    { q: '螢幕在哪裡？', ans: 'screen', why: '螢幕會顯示畫面。' }
  ];
  var ORDER = [['keyboard', 'mouse', 'screen'], ['screen', 'mouse', 'keyboard'], ['mouse', 'keyboard', 'screen']];   // 正解位置分散

  SmartIsland.mount({
    unit: 99, title: '示範關', grade: '1–2 年級',
    howto: '寵物買了新電腦！請你幫牠找出滑鼠。', zhuyin: true,
    teach: '外殼與寵物的示範，不上架',
    levels: [{ name: '找電腦設備', icon: SmartIsland.IC.isl }],
    scene: function (api) {
      var i = 0, review = [], alive = false;
      function ask() {
        var Q = QS[i];
        api.progress(i + 1, QS.length);
        api.field.innerHTML =
          '<div class="clay sc-q"><p class="' + (api.zy ? 'sm-zy' : '') + '">' + Q.q + '</p></div>' +
          '<div class="sc-opts">' + ORDER[i].map(function (k, n) {
            return '<button type="button" class="clay sc-opt" data-k="' + k + '" aria-label="選項 ' + (n + 1) + '"><span class="sc-tag">' + (n + 1) + '</span>' + PIC[k] + '</button>';
          }).join('') + '</div>' +
          '<div class="sc-petbox"><div class="clay sc-bubble">是哪一個呢？</div><div class="sc-pet">' + api.petSVG('normal', { q: true }) + '</div></div>';
      }
      return {
        start: function () {
          i = 0; review = []; alive = true; ask();
          api.field.onclick = function (e) {
            var b = e.target.closest('.sc-opt'); if (!b || !alive) return;
            var Q = QS[i], ok = b.dataset.k === Q.ans;
            review.push({ ok: ok, q: Q.q });
            api.feedback({ ok: ok, explain: ok ? '' : Q.why, zyExplain: true }).then(function () {
              if (!alive) return;
              i++;
              if (i < QS.length) { ask(); return; }
              var right = review.filter(function (r) { return r.ok; }).length;
              api.finish({ stars: right === QS.length ? 3 : right >= 2 ? 2 : 1, review: review,
                learned: '螢幕、鍵盤、滑鼠是電腦的好幫手',
                retry: right < QS.length ? '答錯的題目，再玩一次看看' : '' });
            });
          };
        },
        stop: function () { alive = false; api.field.onclick = null; }
      };
    }
  });
})();
</script>
</body></html>
