<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打字島共用核心示範</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@500;600&display=swap">
<link rel="stylesheet" href="../css/typing-island.css">
<style>
/* 示範場景（各關由 Gemini 換成射擊／怪獸對打）：帶字的蘋果往下掉，打對就消失，掉到草地線扣愛心 */
.demo-sky { position: absolute; inset: 0; background: linear-gradient(#D6EEFB, #EAF6FD 70%, #CDEBC0 70%); }
.demo-line { position: absolute; left: 0; right: 0; bottom: 18%; border-top: 3px dashed var(--berry-dk); }
.demo-line span { position: absolute; left: 12px; top: -26px; font-size: 16px; font-weight: 700; color: var(--berry-dk); }
.demo-t { position: absolute; width: 92px; height: 92px; margin-left: -46px; border-radius: 50%; background: #FF8F80; border: 3px solid #C9483B; display: grid; place-items: center; font-family: var(--f-zh); font-size: 40px; color: var(--ink-1); box-shadow: inset 0 -6px 0 rgba(0,0,0,.08); }
.ti-app[data-lang=en] .demo-t { font-family: Consolas, monospace; }
.demo-t.first { background: #FFF1B8; border-color: var(--sky-dk); outline: 4px dashed var(--sky-dk); outline-offset: 6px; }
.demo-pop { position: absolute; font-size: 22px; font-weight: 900; color: var(--leaf-dk); pointer-events: none; animation: demo-up .7s ease-out forwards; }
@keyframes demo-up { to { transform: translateY(-40px); opacity: 0; } }
</style>
</head>
<body>
<script src="passages.js"></script>
<script src="en-items.js"></script>
<script src="../js/typing-core.js"></script>
<script src="../js/typing-ui.js"></script>
<script>
TypingIsland.mount({
  unit: 'demo', title: '共用核心示範', subtitle: '掉落場景（範本）', langs: ['zh', 'en'], homeUrl: '../../index.html',
  scene: function (api) {
    var field = api.field, items = [], raf = 0, running = false, last = 0;
    var SPEED = { t1: 26, t2: 34, t3: 42 };   // 每秒下降 px
    field.innerHTML = '<div class="demo-sky"></div><div class="demo-line"><span>草地線：掉到這裡少一顆愛心</span></div>';

    function sync() {
      var want = api.upcoming(5), w = field.clientWidth;
      // 依序對齊：items[i] 對應 want[i]；多的刪、少的補在最上面
      while (items.length > want.length) items.pop().el.remove();
      want.forEach(function (u, i) {
        var it = items[i];
        if (!it || it.key !== u.passageIndex + ':' + u.index) {
          if (it) it.el.remove();
          var el = document.createElement('div');
          el.className = 'demo-t';
          el.textContent = u.display === ' ' ? '␣' : u.display;   // display 已含破音字選擇器
          field.appendChild(el);
          it = items[i] = { key: u.passageIndex + ':' + u.index, el: el, y: 10 };
        }
        if (i === 0 && it.y < 10) it.y = 10;   // 輪到要打的那顆一定在畫面裡
        it.x = w * (0.14 + 0.18 * i);
        it.el.classList.toggle('first', i === 0);
      });
    }
    function frame(now) {
      if (!running) return;
      var dt = Math.min(now - last, 100) / 1000; last = now;
      var floor = field.clientHeight * 0.82 - 46, v = SPEED[api.settings.tier];
      items.forEach(function (it, i) {
        it.y += v * dt * (i === 0 ? 1 : 0.8);
        if (it.y > floor) { it.y = 10; if (i === 0) api.loseLife(); }
        it.el.style.transform = 'translate(' + it.x + 'px,' + it.y + 'px)';
        it.el.style.left = '0'; it.el.style.top = '0';
      });
      raf = requestAnimationFrame(frame);
    }
    function pop(text) {
      var it = items[0]; if (!it) return;
      var p = document.createElement('div');
      p.className = 'demo-pop'; p.textContent = text;
      p.style.left = it.x + 'px'; p.style.top = (it.y + 30) + 'px';
      field.appendChild(p); setTimeout(function () { p.remove(); }, 800);
    }
    return {
      start: function () { sync(); },
      roundStart: function () { items.forEach(function (it) { it.el.remove(); }); items = []; sync(); },
      resume: function () { running = true; last = performance.now(); raf = requestAnimationFrame(frame); },
      pause: function () { running = false; cancelAnimationFrame(raf); },
      stop: function () { running = false; cancelAnimationFrame(raf); },
      hit: function (res) { pop('✓ +' + res.correct); for (var i = 0; i < res.correct && items.length; i++) items.shift().el.remove(); sync(); },
      miss: function () { if (items[0]) items[0].el.animate([{ transform: items[0].el.style.transform + ' translateX(-6px)' }, { transform: items[0].el.style.transform + ' translateX(6px)' }], { duration: 120, iterations: 2 }); },
      resize: function () { sync(); }
    };
  }
});
</script>
</body>
</html>
