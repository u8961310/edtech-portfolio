<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* 插畫版學習樂園島：圖由 tools/render-island.py 從 island-3d.html 算好，這頁只疊圖＋HTML 熱區，不跑 3D。
     關卡資料在 island/data.js；新增單元後要重跑產圖工具。 */
  @property --inv { syntax:'<number>'; inherits:true; initial-value:1; }
  :root { --ink:#3b2f2a; --card:#fffaf2; --accent:#d9480f; --muted:#6b5446; --sea:#fbe9d2; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; overflow:hidden;
    background: radial-gradient(ellipse at 50% 35%, #fffaf0 0%, #fbe9d2 60%, #f3d8b8 100%); -webkit-tap-highlight-color:transparent; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .panel { background:var(--card); border:3px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); }

  /* 舞台：圖層原尺寸排好，整塊用 transform 縮放平移 */
  #view { position:fixed; inset:0; touch-action:none; cursor:grab; }
  #view.dragging { cursor:grabbing; }
  #stage { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
  #stage.anim { transition:transform .9s cubic-bezier(.65,0,.35,1), --inv .9s cubic-bezier(.65,0,.35,1); }
  .layer { position:absolute; display:block; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  .intro .layer.drop { animation:drop .75s cubic-bezier(.34,1.56,.64,1) both; }
  .intro .layer.fade { animation:fade .6s ease-out both; }
  @keyframes drop { from { transform:translateY(-38%); opacity:0; } 30% { opacity:1; } }
  @keyframes fade { from { opacity:0; } }

  /* 熱區（SVG 多邊形，跟圖層同座標） */
  #hot { position:absolute; left:0; top:0; overflow:visible; }
  #hot polygon { fill:transparent; stroke:transparent; pointer-events:all; cursor:pointer; vector-effect:non-scaling-stroke; transition:fill .15s; }
  #hot polygon:hover, #hot polygon.hover { fill:rgba(255,255,255,.28); stroke:#fff; stroke-width:3; }
  #hot polygon.sel { fill:rgba(255,255,255,.22); stroke:#fff; stroke-width:4; animation:sel 1.2s ease-in-out infinite; }
  #hot polygon:focus { outline:none; }
  #hot polygon:focus-visible { stroke:var(--accent); stroke-width:5; }
  @keyframes sel { 50% { stroke-opacity:.35; } }

  /* 島名、圓章：放在舞台座標上，用 --inv 反向縮放，字永遠一樣大 */
  .pin { position:absolute; left:0; top:0; pointer-events:none; white-space:nowrap; font-weight:900;
         transform:translate(-50%,-100%) scale(var(--inv)); transform-origin:50% 100%; transition:opacity .35s; }
  .pins-off .pin { opacity:0; }
  .isl { display:flex; align-items:center; gap:6px; padding:4px 12px 4px 5px; font-size:16px; background:var(--card);
         border:2.5px solid var(--ink); border-radius:999px; box-shadow:0 3px 0 var(--ink); position:relative; }
  .isl i { font-style:normal; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:15px; background:var(--c); }
  .isl:after { content:""; position:absolute; left:50%; bottom:-9px; width:2.5px; height:9px; background:var(--ink); }
  .pin.top { z-index:2; }
  .isl[data-isl] { pointer-events:auto; cursor:pointer; }
  .isl[data-isl]:hover { background:#fff3e2; }
  .pin.bdg { opacity:0; }
  body.near .pin.bdg { opacity:1; }
  .bdg span { width:32px; height:32px; border-radius:50%; background:#fff; border:3px solid var(--c); display:grid; place-items:center;
         font-size:17px; box-shadow:0 2px 4px rgba(59,47,42,.3); position:relative; animation:bob 2.4s ease-in-out infinite; animation-delay:var(--d); }
  .bdg s { position:absolute; right:-8px; top:-9px; font-size:13px; text-decoration:none; }
  @keyframes bob { 50% { translate:0 -4px; } }
  /* 關卡圖示（island/data.js 的 ICON）：.fi＝Fluent 3D 圖檔、.kc＝自製鍵帽章（ㄅ／A／中）。各處尺寸分開寫：地圖章、提示、島卡片／清單、關卡卡片 */
  .fi { object-fit:contain; display:block; margin:auto; }
  .kc { display:grid; place-items:center; margin:auto; font-weight:900; font-style:normal; line-height:1; color:var(--ink);
        background:linear-gradient(#fffaf2,#f3e3c8); border:2px solid var(--ink); box-shadow:0 2px 0 var(--ink); }
  .bdg .fi { width:24px; height:24px; } .bdg .kc { width:22px; height:22px; font-size:14px; border-radius:6px; }
  .mini b .fi, .grid b .fi { width:40px; height:40px; } .mini b .kc, .grid b .kc { width:34px; height:34px; font-size:21px; border-radius:9px; margin:3px auto; }
  #card .emo .fi { width:64px; height:64px; } #card .emo .kc { width:54px; height:54px; font-size:32px; border-radius:13px; }
  .tip .fi, .tip .kc { display:inline-grid; vertical-align:-4px; width:20px; height:20px; font-size:12px; margin:0 2px 0 0; } .tip .kc { border-color:#fff; box-shadow:none; }
  .hint { font-size:40px; transform:translate(-50%,0) scale(var(--inv)); transform-origin:50% 0; }
  .hint b { display:block; animation:tap 1.2s ease-in-out infinite; }
  @keyframes tap { 50% { translate:0 10px; scale:.92; } }
  .tip { background:var(--ink); color:#fff; padding:5px 12px; border-radius:12px; font-size:16px; opacity:0; }
  .tip.on { opacity:1; }

  /* 雲（CSS 畫，慢慢飄） */
  .cloud { position:absolute; width:260px; height:90px; pointer-events:none; animation:drift var(--t) linear infinite alternate; transition:opacity .5s; filter:drop-shadow(0 18px 10px rgba(120,90,60,.12)); }
  .cloud:before, .cloud:after, .cloud i { content:""; position:absolute; background:#fff; border-radius:50%; }
  .cloud:before { width:120px; height:120px; left:50px; top:-40px; }
  .cloud:after { width:90px; height:90px; left:140px; top:-15px; }
  .cloud i { width:250px; height:70px; left:0; top:20px; border-radius:40px; }
  @keyframes drift { to { transform:translateX(var(--dx)); } }
  body.near .cloud { opacity:0; }

  /* 上方列、下方切換 */
  .bar { position:fixed; left:16px; right:16px; top:16px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; pointer-events:none; z-index:5; }
  .bar > * { pointer-events:auto; }
  .title { margin:0; padding:10px 20px; font-weight:900; font-size:24px; letter-spacing:1px; }
  .right { display:flex; gap:10px; }
  .stars, .teacher { padding:8px 16px; font-weight:900; font-size:22px; text-decoration:none; color:var(--ink); display:flex; align-items:center; gap:4px; }
  .stars small { font-size:15px; color:var(--muted); }
  .teacher { font-size:20px; }
  .scores-link small { font-size:15px; }
  .views { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; gap:6px; padding:6px; z-index:5; }
  .views button { white-space:nowrap; border:0; background:none; padding:8px 18px; border-radius:14px; font-size:20px; font-weight:900; }
  .views button[aria-pressed="true"] { background:var(--accent); color:#fff; }

  /* 關卡卡片 */
  #card { position:fixed; right:16px; top:84px; width:300px; padding:20px; z-index:6; text-align:center; }
  #card[hidden], #list[hidden] { display:none; }
  #card .x, #list .x { position:absolute; right:10px; top:10px; width:40px; height:40px; border-radius:50%; border:2.5px solid var(--ink); background:#fff; font-size:18px; }
  .emo { width:96px; height:96px; margin:4px auto 10px; border-radius:50%; display:grid; place-items:center; font-size:52px; background:var(--c); border:3px solid var(--ink); }
  #card h2 { margin:0; font-size:30px; font-weight:900; }
  #card .full { margin:4px 0 12px; font-size:15px; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-bottom:16px; }
  .chips span { padding:4px 12px; border-radius:999px; background:#f6ead8; font-size:16px; }
  .go { display:block; padding:14px; border-radius:16px; background:var(--accent); color:#fff; font-size:26px; font-weight:900; text-decoration:none;
        border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); animation:pulse 1.6s ease-in-out infinite; }
  .go:active { translate:0 4px; box-shadow:0 1px 0 var(--ink); }
  @keyframes pulse { 50% { scale:1.04; } }
  .mini { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .mini button, .grid button { border:2.5px solid var(--ink); background:#fff; border-radius:16px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:2px; position:relative; }
  .mini b, .grid b { font-size:30px; line-height:1.2; }
  .mini span, .grid span { font-size:13px; }
  .mini s, .grid s { position:absolute; right:2px; top:0; text-decoration:none; font-size:14px; }
  .grid button:hover, .mini button:hover { background:#fff3e2; }

  /* 清單 */
  #list { position:fixed; inset:0; z-index:7; background:rgba(59,47,42,.35); display:grid; place-items:center; padding:16px; }
  #list .sheet { position:relative; width:min(760px, 100%); max-height:calc(100% - 20px); overflow:auto; padding:20px; }
  #list h2 { margin:0 0 6px; font-size:24px; }
  #list h3 { display:flex; align-items:center; gap:8px; margin:16px 0 8px; font-size:20px; }
  #list h3 i { font-style:normal; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--c); border:2.5px solid var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px; }
  .more { display:flex; gap:18px; margin-top:18px; font-size:15px; }
  .more a { color:var(--muted); }

  #fail { position:fixed; inset:0; display:none; place-items:center; z-index:10; text-align:center; font-size:22px; font-weight:900; }

  /* ===== 首頁 B 方案（2026-11-22）：年級入口＋嚮導＋集章路線。邏輯在 island/grade.js ===== */
  @font-face { font-family:'Bpmf Huninn'; src:url('assets/fonts/bpmf-huninn-home.woff2') format('woff2'); font-display:swap; }
  :root { --ink-soft:#5e4c43; --orange-text:#b23c0b; --g12:#246b32; --g34:#1b62a3; --g56:#6a3fbf; --gall:#3b2f2a; }
  .zy { font-family:'Bpmf Huninn','Noto Sans TC',sans-serif; font-weight:400; letter-spacing:.04em; }
  .g12 { --gc:var(--g12); } .g34 { --gc:var(--g34); } .g56 { --gc:var(--g56); } .gall { --gc:var(--gall); }
  .stars b { font-size:22px; margin:0 2px; }
  .teacher small { font-size:16px; }
  .gpill { padding:8px 14px; font-weight:900; font-size:18px; display:flex; align-items:center; gap:8px; border-color:var(--gc, var(--ink)); }
  .gpill i { width:14px; height:14px; border-radius:50%; background:var(--gc, #fff); border:2px solid var(--ink); }
  .gpill small { font-size:14px; }

  /* 歡迎卡（選年級 → 選嚮導） */
  #wel { position:fixed; inset:0; z-index:8; display:grid; place-items:center; padding:16px; background:rgba(255,246,232,.62); backdrop-filter:blur(2px) saturate(.75); }
  #wel[hidden] { display:none; }
  #wel .sheet { position:relative; width:min(860px, 100%); max-height:calc(100% - 8px); overflow:auto; padding:26px 32px 20px; border-radius:28px; box-shadow:0 8px 0 var(--ink); }
  #wel .x { position:absolute; right:12px; top:12px; width:44px; height:44px; border-radius:50%; border:2.5px solid var(--ink); background:#fff; font-size:18px; }
  .steps { display:flex; gap:10px; align-items:center; margin-bottom:12px; font-size:14px; font-weight:700; color:var(--ink-soft); }
  .steps span { display:flex; align-items:center; gap:6px; }
  .steps i { font-style:normal; width:26px; height:26px; border-radius:50%; border:2.5px solid var(--ink); display:grid; place-items:center; font-size:13px; background:var(--card); color:var(--ink); }
  .steps .on { color:var(--ink); } .steps .on i { background:var(--ink); color:var(--card); }
  .steps .done i { background:var(--g12); color:#fff; }
  .steps .ln { width:36px; height:3px; background:var(--ink); border-radius:2px; opacity:.35; }
  .welcome { display:grid; grid-template-columns:210px 1fr; gap:26px; align-items:center; }
  .plinth { position:relative; height:230px; display:flex; align-items:flex-end; justify-content:center; }
  .plinth:before { content:""; position:absolute; bottom:6px; left:10px; right:10px; height:56px; background:#9fd36b; border:3px solid var(--ink); clip-path:polygon(18% 0,82% 0,100% 50%,82% 100%,18% 100%,0 50%); }
  .plinth .pet { position:relative; width:190px; height:190px; margin-bottom:20px; }
  .pet svg { width:100%; height:100%; display:block; overflow:visible; }
  #wel h2 { font-size:38px; margin:0 0 4px; line-height:1.35; }
  #wel .sub { margin:0 0 16px; font-size:15px; color:var(--ink-soft); line-height:1.6; }
  .ggrid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .gbtn { display:flex; align-items:center; gap:14px; text-align:left; min-height:88px; padding:10px 14px; background:var(--card); border:3px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); font-weight:700; }
  .gbtn:hover { background:#fff3e2; }
  .gbtn:active { translate:0 3px; box-shadow:0 2px 0 var(--ink); }
  .gbtn .gnum { flex:none; display:flex; align-items:baseline; justify-content:center; min-width:92px; height:60px; line-height:56px; border-radius:16px; color:#fff; font-weight:900; font-size:32px; background:var(--gc); border:3px solid var(--ink); }
  .gbtn .gnum em { font-style:normal; font-size:16px; margin-left:2px; }
  .gbtn.gall .gnum { font-size:22px; }
  .gbtn .glabel { display:flex; flex-direction:column; line-height:1.3; font-size:19px; }
  .gbtn .glabel small { font-size:14px; color:var(--ink-soft); font-weight:500; }
  .gbtn[aria-pressed="true"], .baby[aria-pressed="true"], .mine[aria-pressed="true"] { outline:4px solid var(--accent); outline-offset:3px; }
  .memo { margin:16px 0 0; padding-top:12px; border-top:2px dashed rgba(59,47,42,.35); font-size:14px; color:var(--ink-soft); }
  .mine { width:100%; display:flex; align-items:center; gap:16px; text-align:left; padding:10px 18px 10px 12px; margin-bottom:14px; background:#fff3df; border:3px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); }
  .mine .pet { width:92px; height:92px; flex:none; background:var(--card); border:3px solid var(--ink); border-radius:50%; padding:4px; }
  .mine strong { font-size:23px; display:block; }
  .mine span span { font-size:14px; color:var(--ink-soft); }
  .mine .ok { margin-left:auto; flex:none; padding:10px 20px; border-radius:16px; background:var(--accent); color:#fff; font-weight:900; font-size:19px; border:3px solid var(--ink); }
  .or { display:flex; align-items:center; gap:12px; margin:0 0 12px; font-size:14px; color:var(--ink-soft); font-weight:700; }
  .or:before, .or:after { content:""; flex:1; height:2px; background:rgba(59,47,42,.25); }
  .babies { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; }
  .baby { display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 6px 12px; background:var(--card); border:3px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); }
  .baby:hover, .mine:hover { background:#fff3e2; }
  .baby .pet { width:104px; height:104px; }
  .baby b { font-size:18px; } .baby small { font-size:13px; color:var(--ink-soft); }
  .backrow { margin-top:16px; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:14px; color:var(--ink-soft); }
  .backrow button { min-height:44px; padding:0 16px; border:2.5px solid var(--ink); border-radius:14px; background:var(--card); font-weight:700; font-size:15px; }

  /* 淡化層：不適合的關蓋一層奶油色（還是點得到）。島到島路線 2026-11-22 使用者要求拿掉 */
  #route { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  #route .veil { fill:rgba(255,250,242,.6); }
  .isl b.st { width:26px; height:26px; margin-left:-1px; border-radius:50%; display:grid; place-items:center; font-size:14px; background:var(--card); border:2.5px solid var(--ink); }
  .isl b.st.cur { background:var(--accent); color:#fff; } .isl b.st.full { background:var(--g12); color:#fff; }
  .isl small.pg { font-size:13px; font-weight:700; color:var(--ink-soft); }
  .isl.off { background:#fbf3e6; border-style:dashed; color:var(--ink-soft); box-shadow:none; }
  .isl.off i { opacity:.6; }
  .isl em.for { position:absolute; left:50%; top:100%; margin-top:13px; transform:translateX(-50%); font-style:normal; font-size:12px; font-weight:700; background:var(--card); border:2px dashed rgba(59,47,42,.6); border-radius:999px; padding:0 8px; color:var(--ink-soft); }
  .pin.stn span { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:15px; background:var(--card); border:3px solid var(--ink); box-shadow:0 2px 0 var(--ink); }
  .pin.stn.done span { background:var(--g12); color:#fff; }
  .pin.stn.next span { background:var(--accent); color:#fff; width:36px; height:36px; font-size:18px; }
  body.near .pin.stn { opacity:0; }
  .bdg span u { position:absolute; left:-9px; top:-9px; min-width:20px; height:20px; border-radius:10px; background:var(--accent); color:#fff; font-size:12px; text-decoration:none; display:grid; place-items:center; border:2px solid var(--ink); }

  /* 嚮導：寵物站在下一站旁邊，泡泡按了就打開那一關 */
  /* 小尺寸、往島外側站（.r 右邊／.l 左邊），只有泡泡和寵物本身接得到點擊，旁邊的島照樣點得到；✕ 收起泡泡、按寵物再打開 */
  .pin.guide { z-index:4; pointer-events:none; }
  .pin.guide.r { transform:translate(0, -100%) scale(var(--inv)); transform-origin:0 100%; }
  .pin.guide.l { transform:translate(-100%, -100%) scale(var(--inv)); transform-origin:100% 100%; }
  .gwrap { display:flex; align-items:center; gap:10px; }
  .r .gwrap { flex-direction:row-reverse; padding-left:20px; } .l .gwrap { padding-right:20px; }
  .gwrap button { pointer-events:auto; border:0; background:none; padding:0; }
  .gbub { position:relative; display:flex; align-items:center; gap:2px; background:var(--card); border:2.5px solid var(--ink); border-radius:14px; box-shadow:0 3px 0 var(--ink); }
  .gbub:after { content:""; position:absolute; top:50%; margin-top:-6px; width:12px; height:12px; background:var(--card); border-left:2.5px solid var(--ink); border-bottom:2.5px solid var(--ink); }
  .r .gbub:after { left:-8px; transform:rotate(45deg); } .l .gbub:after { right:-8px; transform:rotate(-135deg); }
  .gbub[hidden] { display:none; }
  .gbub .ggo { padding:4px 4px 4px 12px; text-align:left; }
  .gbub .zy { display:block; font-size:18px; line-height:1.35; white-space:nowrap; }
  .gbub small { display:block; font-size:12px; font-weight:700; color:var(--orange-text); }
  .gbub .gx { width:32px; height:32px; margin-right:4px; border-radius:50%; font-size:14px; color:var(--ink-soft); }

  @media (max-width:640px) {

    #card { left:10px; right:10px; top:auto; bottom:calc(84px + env(safe-area-inset-bottom)); width:auto; padding:16px; display:grid; grid-template-columns:84px 1fr; gap:4px 14px; text-align:left; align-items:center; }
    #card[hidden] { display:none; }

    .backrow span { display:none; }
    .gbub .zy { font-size:15px; } .gbub small { font-size:11px; } .gpet { width:46px; height:46px; }
    /* 泡泡搬到 #gdock 後，地圖上只剩寵物：跟桌機一樣站在下一站旁邊（.r／.l），不再疊在站點正上方壓到島名牌 */
    .gbub:after { display:none; }
    #gdock { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:5; }

<body class="pins-off">
<main id="view" aria-label="學習樂園島地圖"><div id="stage"></div></main>

  <div class="right">

    <div id="listBody"></div>
    <div class="more"><a href="./list.html">🗂️ 卡片版</a><a href="./island-3d.html">🧊 3D 版（電腦要夠力）</a></div>
  </div>
</div>

<div id="wel" hidden role="dialog" aria-modal="true" aria-label="選年級"><div class="sheet panel" id="welBody"></div></div>

<div id="fail"><div class="panel" style="padding:24px">😢 地圖載入失敗<br><a href="./list.html">👉 改看卡片版</a></div></div>

<script src="assets/js/smart-pet.js"></script>
<script type="module">
import { ISLANDS, UNITS, recText, hex, pastelHex, iconHtml } from './island/data.js';
import { GRADES, route, nextStop, fits, rangeOf, loadChoice, saveChoice, gradeFromUrl } from './island/grade.js';

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const view = $('view'), stage = $('stage'), card = $('card'), listEl = $('list');
const unitById = new Map(UNITS.map(u => [u.id, u])), islById = new Map(ISLANDS.map(i => [i.id, i]));
$('stars').innerHTML = `⭐ <span class="w">玩過</span><b>${UNITS.filter(u => u.rec).length}</b><small>／${UNITS.length}<span class="w"> 關</span></small>`;

// ================= 載入地圖（直向螢幕用直向那組圖） =================
let M, spotById, s0 = 1, cam = { s:1, x:0, y:0 }, selected = null, hintEl = null;
const mode = () => innerWidth < innerHeight ? 'port' : 'land';
let curMode = null;

async function build() {
  curMode = mode();
  try { M = await (await fetch(`./island/map-${curMode}.json`)).json(); }
  catch { $('fail').style.display = 'grid'; return; }
  spotById = new Map(M.spots.map(s => [s.kind + ':' + s.id, s]));
  stage.style.width = M.w + 'px'; stage.style.height = M.h + 'px';
  const step = 170;
  let html = M.layers.map(l => {
    const cls = l.id === 'base' ? 'fade' : l.id === 'bridges' ? 'fade' : 'drop';
    const delay = l.id === 'base' ? 0 : l.id === 'bridges' ? 8 * step : l.delay * step;
    return `<img class="layer ${cls}" src="./${l.file}" alt="" draggable="false" style="left:${l.x}px;top:${l.y}px;width:${l.w}px;height:${l.h}px;animation-delay:${delay}ms" ${l.id === 'base' ? 'fetchpriority="high"' : ''}>`;
  }).join('');
  // 雲
  html += [[.08,.12,180,'-60s',-1],[.72,.06,240,'-20s',1],[.85,.55,200,'-35s',-1]].map(([x,y,dx,t,dir]) =>
    `<div class="cloud" style="left:${x*M.w}px;top:${y*M.h}px;--dx:${dir*dx}px;--t:${50+dx/8}s;animation-delay:${t}"><i></i></div>`).join('');
  // 路線、淡化層（年級決定內容，applyGrade 畫）
  html += `<svg id="route" width="${M.w}" height="${M.h}" viewBox="0 0 ${M.w} ${M.h}" aria-hidden="true"></svg>`;
  // 熱區
  html += `<svg id="hot" width="${M.w}" height="${M.h}" viewBox="0 0 ${M.w} ${M.h}">${M.spots.map(s => {
    const name = s.kind === 'unit' ? unitById.get(s.id)?.full : islById.get(s.id)?.name;
    return `<polygon data-k="${s.kind}:${s.id}" points="${s.poly.map(p => p.join(',')).join(' ')}" tabindex="0" role="button" aria-label="${name}"></polygon>`;
  }).join('')}</svg>`;
  // 名牌、圓章
  html += `<div class="pin top" style="left:${M.hub[0]}px;top:${M.hub[1]}px"><div class="isl" style="--c:#ffe1a8"><i>🏠</i>我的家</div></div>`;
  for (const s of M.spots) {
    if (s.kind === 'island') { const i = islById.get(s.id);
      html += `<div class="pin top" style="left:${s.label[0]}px;top:${s.label[1]}px"><div class="isl" data-isl="${i.id}" role="button" tabindex="0" style="--c:${pastelHex(i.color,.35)}"><i>${i.icon}</i>${i.name}</div></div>`;
    } else { const u = unitById.get(s.id); if (!u) continue;
      html += `<div class="pin bdg" data-u="${u.id}" style="left:${s.badge[0]}px;top:${s.badge[1]}px"><span style="--c:${hex(u.isl.color)};--d:${(s.c[0] % 7) * -.3}s">${iconHtml(u)}${u.rec ? '<s>⭐</s>' : ''}</span></div>`; }
  }
  html += `<div id="gpins"></div>`;   // 站點數字、嚮導（applyGrade 畫）
  html += `<div class="pin hint" style="left:${M.hint[0]}px;top:${M.hint[1]}px"><b>👆</b></div>`;
  html += `<div class="pin top" id="tip" style="z-index:3"><div class="tip"></div></div>`;
  stage.innerHTML = html;
  hintEl = stage.querySelector('.hint');
  stage.querySelectorAll('.isl[data-isl]').forEach(el => { const go = () => openIsland(islById.get(el.dataset.isl)); el.addEventListener('click', e => { e.stopPropagation(); if (!moved) go(); }); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }); });
  bindSpots();

  fit();
  setCam(homeCam(), false);
  applyGrade();
  if (!reduce) { stage.classList.add('intro'); setTimeout(() => { stage.classList.remove('intro'); document.body.classList.remove('pins-off'); }, 2600); }
  else document.body.classList.remove('pins-off');
}

// ================= 鏡頭（transform）：s0＝整張圖剛好塞進畫面 =================
// 全景：以「所有島＋名牌」的範圍塞進畫面（扣掉上方標題列、下方切換鈕），底盤邊緣被裁掉沒關係
let box;
const MAX_S = 1.15;   // 最大放大到原圖 1.15 倍，再大就糊了
function fit() {
  const xs = [], ys = [];
  // 名牌不跟著地圖縮放（固定約 110px 寬），所以名牌中心也算進範圍，左右再多留半個名牌寬（LW）
  // 2026-11-19 加第 8 座對戰島（右前方）時，直向手機的名牌被切掉才補上
  for (const s of M.spots) { for (const p of s.poly) { xs.push(p[0]); ys.push(p[1]); } if (s.label) { xs.push(s.label[0]); ys.push(s.label[1] - 60); } }
  box = { x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys) };
  const top = innerWidth > 640 ? 90 : 70, bottom = 96, side = innerWidth > 640 ? 40 : 14, LW = 58;
  s0 = Math.min((innerWidth - side * 2 - LW * 2) / (box.x1 - box.x0), (innerHeight - top - bottom) / (box.y1 - box.y0));
  box.cy = top + (innerHeight - top - bottom) / 2;
}
const homeCam = () => ({ s:s0, x:innerWidth / 2 - (box.x0 + box.x1) / 2 * s0, y:box.cy - (box.y0 + box.y1) / 2 * s0 });
function setCam(c, animate = true) {
  cam = c;
  stage.classList.toggle('anim', animate && !reduce);
  stage.style.transform = `translate(${c.x}px, ${c.y}px) scale(${c.s})`;
  stage.style.setProperty('--inv', (1 / c.s).toFixed(4));
  document.body.classList.toggle('near', c.s > s0 * 1.35);
  guideSide();
}
// 把舞台上的點 (px, py) 移到畫面上某個位置，放大 k 倍
function focus(px, py, k) {
  const s = Math.min(s0 * k, MAX_S), desk = innerWidth > 640;
  const cx = desk && !card.hidden ? (innerWidth - 330) / 2 : innerWidth / 2;
  const cy = desk ? innerHeight * .52 : innerHeight * .34;
  setCam({ s, x:cx - px * s, y:cy - py * s });
}
function goHome() { closeCard(); setCam(homeCam()); setView('home'); }

// ================= 拖曳平移、滾輪縮放 =================
let drag = null, moved = false;
view.addEventListener('pointerdown', e => { if (e.button) return; drag = { x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y }; moved = false; });
addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 6) return;
  moved = true; view.classList.add('dragging');
  setCam({ s:cam.s, x:drag.cx + dx, y:drag.cy + dy }, false);
});
addEventListener('pointerup', () => { drag = null; view.classList.remove('dragging'); });
view.addEventListener('click', e => { if (!moved && e.target.tagName !== 'polygon' && selected) closeCard(); });
view.addEventListener('wheel', e => {
  e.preventDefault();
  const s = Math.min(Math.max(MAX_S, s0), Math.max(s0 * .9, cam.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
  const k = s / cam.s;
  setCam({ s, x:e.clientX - (e.clientX - cam.x) * k, y:e.clientY - (e.clientY - cam.y) * k }, false);
}, { passive:false });

// ================= 熱區：滑過、點擊 =================
function bindSpots() {
  const tip = $('tip'), tipEl = tip.firstChild;
  stage.querySelectorAll('#hot polygon').forEach(p => {
    const [kind, id] = p.dataset.k.split(':'), s = spotById.get(p.dataset.k);
    const open = () => { if (moved) return; kind === 'unit' ? openUnit(unitById.get(id)) : openIsland(islById.get(id)); };
    p.addEventListener('click', open);
    p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    p.addEventListener('pointerenter', e => {
      if (e.pointerType !== 'mouse') return;
      const u = kind === 'unit' ? unitById.get(id) : null, i = u ? null : islById.get(id);
      tipEl.innerHTML = u ? `${iconHtml(u)} ${u.short}` : `${i.icon} ${i.name}`;
      const at = u ? [s.badge[0], s.badge[1] - 46 / cam.s] : s.label;
      tip.style.left = at[0] + 'px'; tip.style.top = (u ? at[1] : at[1] - 48 / cam.s) + 'px';
      tipEl.classList.add('on');
    });
    p.addEventListener('pointerleave', () => tipEl.classList.remove('on'));
  });
}
function markSel(key) { stage.querySelectorAll('#hot polygon.sel').forEach(p => p.classList.remove('sel')); if (key) stage.querySelector(`#hot polygon[data-k="${key}"]`)?.classList.add('sel'); }
function dismissHint() { hintEl?.remove(); hintEl = null; }

// ================= 卡片 =================
function openUnit(u) {
  if (!u) return;
  selected = u; dismissHint();
  card.style.setProperty('--c', pastelHex(u.isl.color, .35));
  card.innerHTML = `<button class="x" aria-label="關閉">✖</button>
    <div class="emo">${iconHtml(u)}</div><h2>${u.short}</h2><p class="full">${u.full}</p>
    <div class="chips"><span>${u.isl.icon} ${u.isl.name}</span><span>${u.grade}</span><span>${recText(u)}</span></div>
    <a class="go" href="./${u.url}">🚀 出發</a>`;
  card.hidden = false;
  card.querySelector('.x').onclick = closeCard;
  const s = spotById.get('unit:' + u.id); markSel('unit:' + u.id);
  focus(s.c[0], s.c[1] - 30, curMode === 'port' ? 2.4 : 2.6);
}
function openIsland(isl) {
  selected = isl; dismissHint();
  card.style.setProperty('--c', pastelHex(isl.color, .35));
  card.innerHTML = `<button class="x" aria-label="關閉">✖</button>
    <div class="emo">${isl.icon}</div><h2>${isl.name}</h2>
    <div class="chips"><span>🎮 ${isl.list.length} 關</span><span>⭐ ${isl.list.filter(u => u.rec).length}</span></div>
    <div class="mini">${isl.list.map((u, i) => `<button data-i="${i}"><b>${iconHtml(u)}</b><span>${u.short}</span>${u.rec ? '<s>⭐</s>' : ''}</button>`).join('')}</div>`;
  card.hidden = false;
  card.querySelector('.x').onclick = closeCard;
  card.querySelectorAll('.mini button').forEach(b => b.onclick = () => openUnit(isl.list[+b.dataset.i]));
  const s = spotById.get('island:' + isl.id); markSel(null);
  focus(s.c[0], s.c[1], curMode === 'port' ? 1.8 : 1.9);
}
function closeCard() { selected = null; card.hidden = true; markSel(null); }
addEventListener('keydown', e => { if (e.key === 'Escape') { if (!listEl.hidden) closeList(); else closeCard(); } });

// ================= 清單 =================
// 依年級排：路線上的島照路線順序在前，其他島在後；每島裡適合的關在前，別的年級變淡沉到後面（都點得到）
function renderList() {
  const g = grade(), R = route(ISLANDS, g), rOf = new Map(R.map((r, k) => [r.isl.id, { ...r, n:k + 1 }])), nx = g === 'all' ? null : nextStop(ISLANDS, g);
  const order = g === 'all' ? ISLANDS : [...R.map(r => r.isl), ...ISLANDS.filter(i => !rOf.has(i.id))];
  $('listSeg').innerHTML = Object.values(GRADES).map(G => `<button class="g${G.key}" data-g="${G.key}" aria-pressed="${G.key === g}"><i></i>${G.key === 'all' ? '全部' : G.label}</button>`).join('');
  $('listNote').textContent = g === 'all' ? `${UNITS.length} 關都攤開。` : g ? `虛線框的是給別的年級，也可以玩。` : '先選年級，適合你的關會排在前面。';
  $('listBody').innerHTML = order.map(isl => {
    const r = rOf.get(isl.id), ii = ISLANDS.indexOf(isl);
    const us = isl.list.map((u, i) => ({ u, i, ok:fits(u, g) })).sort((a, b) => b.ok - a.ok);
    const st = r ? `<b class="st ${r.done === r.total ? 'full' : nx && nx.isl === isl ? 'cur' : ''}">${r.n}</b>` : `<i>${isl.icon}</i>`;
    return `<h3 class="${g && g !== 'all' && !r ? 'off' : ''}" style="--c:${pastelHex(isl.color,.35)}">${st}${r ? isl.icon + ' ' : ''}${isl.name}${r ? `<small>玩過 ${r.done}／${r.total}</small>` : g && g !== 'all' ? `<small>給 ${islGrades(isl)}</small>` : ''}</h3>
    <div class="grid">${us.map(({ u, i, ok }) => `<button class="${ok ? '' : 'dim'} ${u === nx ? 'nx' : ''}" data-ii="${ii}" data-i="${i}" aria-label="${u.full}${ok ? '' : '（' + u.grade + '）'}"><b>${iconHtml(u)}</b><span>${u.short}</span>${ok ? '' : `<em>${u.grade.replace(/^\S+\s/, '')}</em>`}${u.rec ? '<s>⭐</s>' : ''}</button>`).join('')}</div>`;
  }).join('');
  listEl.querySelectorAll('.grid button').forEach(b => b.onclick = () => { closeList(); openUnit(ISLANDS[+b.dataset.ii].list[+b.dataset.i]); });
  $('listSeg').querySelectorAll('button').forEach(b => b.onclick = () => { setGrade(b.dataset.g); renderList(); });
}
function setView(v) { $('vHome').setAttribute('aria-pressed', v === 'home'); $('vList').setAttribute('aria-pressed', v === 'list'); }
function openList() { renderList(); listEl.hidden = false; setView('list'); listEl.querySelector('.x').focus(); }
function closeList() { listEl.hidden = true; setView('home'); }
$('vList').onclick = openList;
$('vHome').onclick = goHome;
listEl.querySelector('.x').onclick = closeList;
listEl.addEventListener('click', e => { if (e.target === listEl) closeList(); });

// ================= 視窗大小：換方向就換一組圖，否則重新置中 =================
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  if (mode() !== curMode) { closeCard(); build(); return; }
  fit(); if (selected) (selected.list ? openIsland : openUnit)(selected); else setCam(homeCam(), false);
}, 150); });

// ================= 年級入口＋嚮導＋集章路線（首頁 B 方案 2026-11-22） =================
// 年級只記到今天（教室電腦很多班共用）；網址 ?grade=12|34|56|all 直接指定、不跳歡迎卡（投影用）
const urlG = gradeFromUrl(location.search);
let choice = urlG ? { g:urlG, guide:loadChoice(localStorage)?.guide || 'mine' } : loadChoice(localStorage);
const grade = () => choice?.g || null;
const PETS = ['bunny', 'turtle', 'cat', 'chick'];
const SP = window.SmartPet;
const myPet = () => { try { return SP?.current() || null; } catch { return null; } };
function petSvg(guide, mood = 'happy', stage = 0) {
  if (!SP) return '';
  const mine = myPet();
  if (guide === 'mine' && mine) return SP.svgOf(mine, mood);
  return SP.svg(PETS.includes(guide) ? guide : 'bunny', stage, mood);
}
function islGrades(isl) {
  const rs = isl.list.map(u => rangeOf(u.grade)), lo = Math.min(...rs.map(r => r[0])), hi = Math.max(...rs.map(r => r[1]));
  return lo === hi ? `${lo} 年級` : `${lo}–${hi} 年級`;
}
function setGrade(g, guide) {
  choice = saveChoice(localStorage, g, guide || choice?.guide || 'mine');
  applyGrade();
  if (!listEl.hidden) renderList();
}

function applyGrade() {
  if (!M) return;
  const g = grade(), G = GRADES[g], R = route(ISLANDS, g), nx = g && g !== 'all' ? nextStop(ISLANDS, g) : null;
  const rOf = new Map(R.map((r, k) => [r.isl.id, { ...r, n:k + 1 }]));
  // 右上角年級膠囊
  const gp = $('gpill'); gp.className = `panel gpill ${G ? 'g' + g : ''}`;
  gp.querySelector('span').textContent = G ? (g === 'all' ? '全部' : G.label) : '選年級';
  // 島名牌：路線上的島加數字章＋玩過幾關；不在路線上的變淡、標「給 X 年級」
  stage.querySelectorAll('.isl[data-isl]').forEach(el => {
    const isl = islById.get(el.dataset.isl), r = rOf.get(isl.id), off = !!G && g !== 'all' && !r;
    const cls = r && (r.done === r.total ? 'full' : nx && nx.isl === isl ? 'cur' : '');
    el.classList.toggle('off', off);
    el.innerHTML = `${r ? `<b class="st ${cls}">${r.done === r.total ? '✓' : r.n}</b>` : ''}<i>${isl.icon}</i>${isl.name}${r ? `<small class="pg">${r.done}/${r.total}</small>` : ''}${off ? `<em class="for">給 ${islGrades(isl)}</em>` : ''}`;
    el.setAttribute('aria-label', `${isl.name}${r ? `，第 ${r.n} 站，玩過 ${r.done}／${r.total} 關` : off ? `，給 ${islGrades(isl)}` : ''}`);
  });
  // 淡化層（不適合的關、不在這個年級的島）
  const veil = [];
  if (G && g !== 'all') for (const s of M.spots) {
    const bad = s.kind === 'unit' ? !fits(unitById.get(s.id) || {}, g) : !rOf.has(s.id);
    if (bad) veil.push(`<polygon class="veil" points="${s.poly.map(p => p.join(',')).join(' ')}"/>`);
  }
  $('route').innerHTML = veil.join('');
  // 目前這座島：遠看只標「下一站」橘點和玩過的 ✓（小島站點擠，不全標數字）；拉近時圓章左上角標第幾站
  let pins = '';
  stage.querySelectorAll('.bdg u').forEach(e => e.remove());
  const cur = nx && rOf.get(nx.isl.id);
  if (cur) cur.units.forEach((u, k) => {
    const s = spotById.get('unit:' + u.id); if (!s) return;
    if (u.rec || u === nx) pins += `<div class="pin stn ${u.rec ? 'done' : 'next'}" style="left:${s.badge[0]}px;top:${s.badge[1]}px"><span>${u.rec ? '✓' : k + 1}</span></div>`;
    stage.querySelector(`.bdg[data-u="${u.id}"] span`)?.insertAdjacentHTML('beforeend', `<u>${k + 1}</u>`);
  });
  // 泡泡注音的破音字（2026-11-22 依萌典核過）：字型預設讀音不對的詞，在泡泡裡補 IVS 選擇碼 U+E01E1（第 2 個讀音）。
  //   只改泡泡、不改 data.js（3D 版與產圖工具也讀短名）。新增關卡短名後照 zy_moe 做法再核一次。
  const zyFix = s => s.replace(/對稱|襪子|隊長/g, w => w + '\u{E01E1}');
  // 嚮導：站在下一站往島外那一側；全部玩過就在我的家旁邊慶祝
  if (G && g !== 'all' && SP) {
    const at = nx ? spotById.get('unit:' + nx.id)?.badge : M.hub;
    const side = at && at[0] >= M.hub[0] ? 'r' : 'l';
    if (at) pins += `<div class="pin guide ${side}" data-pref="${side}" style="left:${at[0]}px;top:${at[1] - 6}px"><div class="gwrap">
      <div class="gbub" ${guideFolded ? 'hidden' : ''}><button class="ggo" aria-label="${nx ? `下一站：${nx.short}，按這裡出發` : '全部玩過了'}"><span class="zy">${nx ? `下一站：${zyFix(nx.short)}！` : '全部玩過了！好棒！'}</span>${nx ? '<small>👆 按我出發</small>' : ''}</button><button class="gx" aria-label="收起提示">✕</button></div>
      <button class="gpet" aria-label="嚮導（按一下${guideFolded ? '打開' : '收起'}提示）">${petSvg(choice.guide, 'happy', nx ? 0 : 1)}</button></div></div>`;
  }
  $('gpins').innerHTML = pins;
  if (hintEl) hintEl.style.display = pins.includes('pin guide') ? 'none' : '';   // 有嚮導帶路就不用舊的 👆 提示（會卡在名牌後面）
  const gw =$('gpins').querySelector('.gwrap'), dock = $('gdock');
  dock.replaceChildren();
  if (gw) {
    const bub = gw.querySelector('.gbub');
    const stop = e => e.stopPropagation(), fold = v => { guideFolded = v; bub.hidden = v; };
    const docked = matchMedia('(max-width:640px)').matches;
    if (docked) dock.append(bub);   // 手機直向：泡泡放下方固定，寵物留在下一站（dock 在地圖外，不用管拖曳旗標）
    bub.querySelector('.ggo').addEventListener('click', e => { stop(e); if ((docked || !moved) && nx) openUnit(nx); });
    bub.querySelector('.gx').addEventListener('click', e => { stop(e); fold(true); });
    gw.querySelector('.gpet').addEventListener('click', e => { stop(e); if (!moved) fold(!guideFolded); });
  }
  guideSide();
}
let guideFolded = false;
// 嚮導預設站在島外側；那一側會超出螢幕就換邊（鏡頭每次移動都重算）
function guideSide() {
  const p = stage.querySelector('.pin.guide'); if (!p) return;
  const x = parseFloat(p.style.left) * cam.s + cam.x, w = p.querySelector('.gwrap').offsetWidth + 8;
  let side = p.dataset.pref;
  if (side === 'r' && x + w > innerWidth && x - w > 0) side = 'l';
  else if (side === 'l' && x - w < 0 && x + w < innerWidth) side = 'r';
  p.classList.toggle('r', side === 'r'); p.classList.toggle('l', side === 'l');
}

// 歡迎卡：第 1 步選年級，第 2 步選嚮導（「全部」跳過第 2 步）
const wel = $('wel'), welBody = $('welBody');
function openWel(step = 1, g = grade()) {
  closeCard(); closeList();
  const canClose = !!choice, x = canClose ? '<button class="x" aria-label="關閉">✖</button>' : '';
  if (step === 1) {
    const cnt = k => UNITS.filter(u => fits(u, k)).length;
    welBody.innerHTML = `${x}<div class="steps"><span class="on"><i>1</i>選年級</span><span class="ln"></span><span><i>2</i>選嚮導</span></div>
      <div class="welcome"><div class="plinth"><div class="pet">${petSvg(myPet() ? 'mine' : 'bunny', 'happy', 1)}</div></div><div>
      <h2 class="zy">嗨！你幾年級？</h2>
      <p class="sub">選好之後，地圖會幫你標出適合的關卡，其他關卡還是點得到。</p>
      <div class="ggrid">${['12', '34', '56'].map(k => `<button class="gbtn g${k}" data-g="${k}" aria-pressed="${k === g}"><span class="gnum">${GRADES[k].lo}–${GRADES[k].hi}<em>年級</em></span><span class="glabel">${'一三五'[k[0] / 2 | 0]}、${'二四六'[k[0] / 2 | 0]}年級<small>${cnt(k)} 關</small></span></button>`).join('')}
        <button class="gbtn gall" data-g="all" aria-pressed="${g === 'all'}"><span class="gnum">全部</span><span class="glabel">老師／全部看看<small>${UNITS.length} 關都攤開</small></span></button></div>
      </div></div>
      <p class="memo">🕒 這台電腦只記到今天；下一節換班時，按右上角的年級就能改。</p>`;
    welBody.querySelectorAll('.gbtn').forEach(b => b.onclick = () => {
      if (b.dataset.g === 'all') { setGrade('all'); closeWel(); setCam(homeCam()); }
      else openWel(2, b.dataset.g);
    });
  } else {
    const mine = myPet(), cg = choice?.guide || 'mine';
    welBody.innerHTML = `${x}<div class="steps"><span class="done"><i>✓</i>${GRADES[g].label}</span><span class="ln"></span><span class="on"><i>2</i>選嚮導</span></div>
      <h2 class="zy">選一隻寵物陪你逛樂園！</h2>
      <p class="sub">嚮導會站在下一站旁邊提醒你。</p>
      ${mine ? `<button class="mine" data-p="mine" aria-pressed="${cg === 'mine'}"><span class="pet">${petSvg('mine')}</span>
        <span><strong>用我的${mine.name}</strong><span>你在小常識島養的${SP.typeName(mine.type)}，現在是${SP.stageName(SP.stageOf(mine.snacks || 0))}</span></span><span class="ok">就是牠</span></button>
        <div class="or">或是帶一隻寵物寶寶出門</div>` : ''}
      <div class="babies">${SP ? SP.TYPES.map(t => `<button class="baby" data-p="${t.id}" aria-pressed="${cg === t.id}"><span class="pet">${SP.svg(t.id, 0, 'normal')}</span><b>${t.name}</b><small>${t.desc}</small></button>`).join('') : ''}</div>
      <div class="backrow"><button data-back>回上一步：改年級</button><span>按一隻就出發，牠會帶你去下一站</span></div>`;
    welBody.querySelector('[data-back]').onclick = () => openWel(1, g);
    welBody.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      setGrade(g, b.dataset.p); closeWel();
      const nx = nextStop(ISLANDS, g), s = nx && spotById.get('island:' + nx.isl.id);
      if (s) focus(s.c[0], s.c[1], 1.25); else setCam(homeCam());
    });
  }
  welBody.querySelector('.x')?.addEventListener('click', closeWel);
  wel.hidden = false;
  (welBody.querySelector('[aria-pressed="true"]') || welBody.querySelector('.gbtn, .mine, .baby'))?.focus();
}
function closeWel() { wel.hidden = true; }
$('gpill').onclick = () => openWel(1);
addEventListener('keydown', e => { if (e.key === 'Escape' && !wel.hidden && choice) closeWel(); });

window.__islandDebug = { spot:k => spotById.get(k), cam:() => cam, grade };
await build();
if (!choice) openWel(1);
</script>
<script defer src="assets/js/beacon.js"></script>
</body>
</html>
