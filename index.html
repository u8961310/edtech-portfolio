<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🏝️ 我的學習樂園島</title>
<meta name="description" content="國小資訊教育互動教材：六座主題小島拼成的學習樂園，點一格就進關卡。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* 插畫版學習樂園島：圖由 tools/render-island.py 從 island-3d.html 算好，這頁只疊圖＋HTML 熱區，不跑 3D。
     關卡資料在 island/data.js；新增單元後要重跑產圖工具。 */
  @property --inv { syntax:'<number>'; inherits:true; initial-value:1; }
  :root { --ink:#3b2f2a; --card:#fffaf2; --accent:#d9480f; --muted:#6b5446; --sea:#fbe9d2; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; overflow:hidden;
    background: radial-gradient(ellipse at 50% 35%, #fffaf0 0%, #fbe9d2 60%, #f3d8b8 100%); -webkit-tap-highlight-color:transparent; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .panel { background:var(--card); border:3px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); }

  /* 舞台：圖層原尺寸排好，整塊用 transform 縮放平移 */
  #view { position:fixed; inset:0; touch-action:none; cursor:grab; }
  #view.dragging { cursor:grabbing; }
  #stage { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
  #stage.anim { transition:transform .9s cubic-bezier(.65,0,.35,1), --inv .9s cubic-bezier(.65,0,.35,1); }
  .layer { position:absolute; display:block; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  .intro .layer.drop { animation:drop .75s cubic-bezier(.34,1.56,.64,1) both; }
  .intro .layer.fade { animation:fade .6s ease-out both; }
  @keyframes drop { from { transform:translateY(-38%); opacity:0; } 30% { opacity:1; } }
  @keyframes fade { from { opacity:0; } }

  /* 熱區（SVG 多邊形，跟圖層同座標） */
  #hot { position:absolute; left:0; top:0; overflow:visible; }
  #hot polygon { fill:transparent; stroke:transparent; pointer-events:all; cursor:pointer; vector-effect:non-scaling-stroke; transition:fill .15s; }
  #hot polygon:hover, #hot polygon.hover { fill:rgba(255,255,255,.28); stroke:#fff; stroke-width:3; }
  #hot polygon.sel { fill:rgba(255,255,255,.22); stroke:#fff; stroke-width:4; animation:sel 1.2s ease-in-out infinite; }
  #hot polygon:focus { outline:none; }
  #hot polygon:focus-visible { stroke:var(--accent); stroke-width:5; }
  @keyframes sel { 50% { stroke-opacity:.35; } }

  /* 島名、圓章：放在舞台座標上，用 --inv 反向縮放，字永遠一樣大 */
  .pin { position:absolute; left:0; top:0; pointer-events:none; white-space:nowrap; font-weight:900;
         transform:translate(-50%,-100%) scale(var(--inv)); transform-origin:50% 100%; transition:opacity .35s; }
  .pins-off .pin { opacity:0; }
  .isl { display:flex; align-items:center; gap:6px; padding:4px 12px 4px 5px; font-size:16px; background:var(--card);
         border:2.5px solid var(--ink); border-radius:999px; box-shadow:0 3px 0 var(--ink); position:relative; }
  .isl i { font-style:normal; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:15px; background:var(--c); }
  .isl:after { content:""; position:absolute; left:50%; bottom:-9px; width:2.5px; height:9px; background:var(--ink); }
  .pin.top { z-index:2; }
  .isl[data-isl] { pointer-events:auto; cursor:pointer; }
  .isl[data-isl]:hover { background:#fff3e2; }
  .pin.bdg { opacity:0; }
  body.near .pin.bdg { opacity:1; }
  .bdg span { width:32px; height:32px; border-radius:50%; background:#fff; border:3px solid var(--c); display:grid; place-items:center;
         font-size:17px; box-shadow:0 2px 4px rgba(59,47,42,.3); position:relative; animation:bob 2.4s ease-in-out infinite; animation-delay:var(--d); }
  .bdg s { position:absolute; right:-8px; top:-9px; font-size:13px; text-decoration:none; }
  @keyframes bob { 50% { translate:0 -4px; } }
  .hint { font-size:40px; transform:translate(-50%,0) scale(var(--inv)); transform-origin:50% 0; }
  .hint b { display:block; animation:tap 1.2s ease-in-out infinite; }
  @keyframes tap { 50% { translate:0 10px; scale:.92; } }
  .tip { background:var(--ink); color:#fff; padding:5px 12px; border-radius:12px; font-size:16px; opacity:0; }
  .tip.on { opacity:1; }

  /* 雲（CSS 畫，慢慢飄） */
  .cloud { position:absolute; width:260px; height:90px; pointer-events:none; animation:drift var(--t) linear infinite alternate; transition:opacity .5s; filter:drop-shadow(0 18px 10px rgba(120,90,60,.12)); }
  .cloud:before, .cloud:after, .cloud i { content:""; position:absolute; background:#fff; border-radius:50%; }
  .cloud:before { width:120px; height:120px; left:50px; top:-40px; }
  .cloud:after { width:90px; height:90px; left:140px; top:-15px; }
  .cloud i { width:250px; height:70px; left:0; top:20px; border-radius:40px; }
  @keyframes drift { to { transform:translateX(var(--dx)); } }
  body.near .cloud { opacity:0; }

  /* 上方列、下方切換 */
  .bar { position:fixed; left:16px; right:16px; top:16px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; pointer-events:none; z-index:5; }
  .bar > * { pointer-events:auto; }
  .title { margin:0; padding:10px 20px; font-weight:900; font-size:24px; letter-spacing:1px; }
  .right { display:flex; gap:10px; }
  .stars, .teacher { padding:8px 16px; font-weight:900; font-size:22px; text-decoration:none; color:var(--ink); display:flex; align-items:center; gap:4px; }
  .stars small { font-size:15px; color:var(--muted); }
  .teacher { font-size:20px; }
  .views { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; gap:6px; padding:6px; z-index:5; }
  .views button { white-space:nowrap; border:0; background:none; padding:8px 18px; border-radius:14px; font-size:20px; font-weight:900; }
  .views button[aria-pressed="true"] { background:var(--accent); color:#fff; }

  /* 關卡卡片 */
  #card { position:fixed; right:16px; top:84px; width:300px; padding:20px; z-index:6; text-align:center; }
  #card[hidden], #list[hidden] { display:none; }
  #card .x, #list .x { position:absolute; right:10px; top:10px; width:40px; height:40px; border-radius:50%; border:2.5px solid var(--ink); background:#fff; font-size:18px; }
  .emo { width:96px; height:96px; margin:4px auto 10px; border-radius:50%; display:grid; place-items:center; font-size:52px; background:var(--c); border:3px solid var(--ink); }
  #card h2 { margin:0; font-size:30px; font-weight:900; }
  #card .full { margin:4px 0 12px; font-size:15px; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-bottom:16px; }
  .chips span { padding:4px 12px; border-radius:999px; background:#f6ead8; font-size:16px; }
  .go { display:block; padding:14px; border-radius:16px; background:var(--accent); color:#fff; font-size:26px; font-weight:900; text-decoration:none;
        border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); animation:pulse 1.6s ease-in-out infinite; }
  .go:active { translate:0 4px; box-shadow:0 1px 0 var(--ink); }
  @keyframes pulse { 50% { scale:1.04; } }
  .mini { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .mini button, .grid button { border:2.5px solid var(--ink); background:#fff; border-radius:16px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:2px; position:relative; }
  .mini b, .grid b { font-size:30px; line-height:1.2; }
  .mini span, .grid span { font-size:13px; }
  .mini s, .grid s { position:absolute; right:2px; top:0; text-decoration:none; font-size:14px; }
  .grid button:hover, .mini button:hover { background:#fff3e2; }

  /* 清單 */
  #list { position:fixed; inset:0; z-index:7; background:rgba(59,47,42,.35); display:grid; place-items:center; padding:16px; }
  #list .sheet { position:relative; width:min(760px, 100%); max-height:calc(100% - 20px); overflow:auto; padding:20px; }
  #list h2 { margin:0 0 6px; font-size:24px; }
  #list h3 { display:flex; align-items:center; gap:8px; margin:16px 0 8px; font-size:20px; }
  #list h3 i { font-style:normal; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--c); border:2.5px solid var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px; }
  .more { display:flex; gap:18px; margin-top:18px; font-size:15px; }
  .more a { color:var(--muted); }

  #fail { position:fixed; inset:0; display:none; place-items:center; z-index:10; text-align:center; font-size:22px; font-weight:900; }

  @media (max-width:640px) {
    .bar { left:10px; right:10px; top:10px; }
    .title { font-size:17px; padding:8px 12px; }
    .stars, .teacher { font-size:17px; padding:6px 10px; }
    .isl { font-size:13px; } .isl i { width:22px; height:22px; font-size:12px; }
    #card { left:10px; right:10px; top:auto; bottom:calc(84px + env(safe-area-inset-bottom)); width:auto; padding:16px; display:grid; grid-template-columns:84px 1fr; gap:4px 14px; text-align:left; align-items:center; }
    #card[hidden] { display:none; }
    #card .emo { width:76px; height:76px; font-size:42px; margin:0; grid-row:span 2; }
    #card h2 { font-size:24px; } #card .full { margin:0; font-size:13px; }
    #card .chips { grid-column:1 / -1; justify-content:flex-start; margin:6px 0 8px; }
    #card .go, #card .mini { grid-column:1 / -1; }
    .go { font-size:22px; padding:10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .intro .layer, .bdg span, .hint b, .go, .cloud { animation:none !important; }
    #stage.anim { transition:none; }
  }
</style>
</head>
<body class="pins-off">
<main id="view" aria-label="學習樂園島地圖"><div id="stage"></div></main>

<header class="bar">
  <h1 class="panel title">🏝️ 我的學習樂園島</h1>
  <div class="right">
    <div class="panel stars" id="stars" title="玩過的關卡">⭐ 0</div>
    <a class="panel teacher" href="./portfolio.html" title="給老師看">👨‍🏫</a>
  </div>
</header>

<nav class="panel views" aria-label="檢視">
  <button id="vHome" aria-pressed="true">🌏 全景</button>
  <button id="vList" aria-pressed="false">📋 清單</button>
</nav>

<aside id="card" class="panel" hidden aria-live="polite"></aside>

<div id="list" hidden role="dialog" aria-label="全部關卡">
  <div class="sheet panel">
    <button class="x" aria-label="關閉">✖</button>
    <h2>📋 全部關卡</h2>
    <div id="listBody"></div>
    <div class="more"><a href="./list.html">🗂️ 卡片版</a><a href="./island-3d.html">🧊 3D 版（電腦要夠力）</a></div>
  </div>
</div>

<div id="fail"><div class="panel" style="padding:24px">😢 地圖載入失敗<br><a href="./list.html">👉 改看卡片版</a></div></div>

<script type="module">
import { ISLANDS, UNITS, recText, hex, pastelHex } from './island/data.js';

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const view = $('view'), stage = $('stage'), card = $('card'), listEl = $('list');
const unitById = new Map(UNITS.map(u => [u.id, u])), islById = new Map(ISLANDS.map(i => [i.id, i]));
$('stars').innerHTML = `⭐ ${UNITS.filter(u => u.rec).length}<small>/${UNITS.length}</small>`;

// ================= 載入地圖（直向螢幕用直向那組圖） =================
let M, spotById, s0 = 1, cam = { s:1, x:0, y:0 }, selected = null, hintEl = null;
const mode = () => innerWidth < innerHeight ? 'port' : 'land';
let curMode = null;

async function build() {
  curMode = mode();
  try { M = await (await fetch(`./island/map-${curMode}.json`)).json(); }
  catch { $('fail').style.display = 'grid'; return; }
  spotById = new Map(M.spots.map(s => [s.kind + ':' + s.id, s]));
  stage.style.width = M.w + 'px'; stage.style.height = M.h + 'px';
  const step = 170;
  let html = M.layers.map(l => {
    const cls = l.id === 'base' ? 'fade' : l.id === 'bridges' ? 'fade' : 'drop';
    const delay = l.id === 'base' ? 0 : l.id === 'bridges' ? 8 * step : l.delay * step;
    return `<img class="layer ${cls}" src="./${l.file}" alt="" draggable="false" style="left:${l.x}px;top:${l.y}px;width:${l.w}px;height:${l.h}px;animation-delay:${delay}ms" ${l.id === 'base' ? 'fetchpriority="high"' : ''}>`;
  }).join('');
  // 雲
  html += [[.08,.12,180,'-60s',-1],[.72,.06,240,'-20s',1],[.85,.55,200,'-35s',-1]].map(([x,y,dx,t,dir]) =>
    `<div class="cloud" style="left:${x*M.w}px;top:${y*M.h}px;--dx:${dir*dx}px;--t:${50+dx/8}s;animation-delay:${t}"><i></i></div>`).join('');
  // 熱區
  html += `<svg id="hot" width="${M.w}" height="${M.h}" viewBox="0 0 ${M.w} ${M.h}">${M.spots.map(s => {
    const name = s.kind === 'unit' ? unitById.get(s.id)?.full : islById.get(s.id)?.name;
    return `<polygon data-k="${s.kind}:${s.id}" points="${s.poly.map(p => p.join(',')).join(' ')}" tabindex="0" role="button" aria-label="${name}"></polygon>`;
  }).join('')}</svg>`;
  // 名牌、圓章
  html += `<div class="pin top" style="left:${M.hub[0]}px;top:${M.hub[1]}px"><div class="isl" style="--c:#ffe1a8"><i>🏠</i>我的家</div></div>`;
  for (const s of M.spots) {
    if (s.kind === 'island') { const i = islById.get(s.id);
      html += `<div class="pin top" style="left:${s.label[0]}px;top:${s.label[1]}px"><div class="isl" data-isl="${i.id}" role="button" tabindex="0" style="--c:${pastelHex(i.color,.35)}"><i>${i.icon}</i>${i.name}</div></div>`;
    } else { const u = unitById.get(s.id); if (!u) continue;
      html += `<div class="pin bdg" style="left:${s.badge[0]}px;top:${s.badge[1]}px"><span style="--c:${hex(u.isl.color)};--d:${(s.c[0] % 7) * -.3}s">${u.emoji}${u.rec ? '<s>⭐</s>' : ''}</span></div>`; }
  }
  html += `<div class="pin hint" style="left:${M.hint[0]}px;top:${M.hint[1]}px"><b>👆</b></div>`;
  html += `<div class="pin top" id="tip" style="z-index:3"><div class="tip"></div></div>`;
  stage.innerHTML = html;
  hintEl = stage.querySelector('.hint');
  stage.querySelectorAll('.isl[data-isl]').forEach(el => { const go = () => openIsland(islById.get(el.dataset.isl)); el.addEventListener('click', e => { e.stopPropagation(); if (!moved) go(); }); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }); });
  bindSpots();

  fit();
  setCam(homeCam(), false);
  if (!reduce) { stage.classList.add('intro'); setTimeout(() => { stage.classList.remove('intro'); document.body.classList.remove('pins-off'); }, 2600); }
  else document.body.classList.remove('pins-off');
}

// ================= 鏡頭（transform）：s0＝整張圖剛好塞進畫面 =================
// 全景：以「所有島＋名牌」的範圍塞進畫面（扣掉上方標題列、下方切換鈕），底盤邊緣被裁掉沒關係
let box;
const MAX_S = 1.15;   // 最大放大到原圖 1.15 倍，再大就糊了
function fit() {
  const xs = [], ys = [];
  for (const s of M.spots) { for (const p of s.poly) { xs.push(p[0]); ys.push(p[1]); } if (s.label) ys.push(s.label[1] - 60); }
  box = { x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys) };
  const top = innerWidth > 640 ? 90 : 70, bottom = 96, side = innerWidth > 640 ? 40 : 14;
  s0 = Math.min((innerWidth - side * 2) / (box.x1 - box.x0), (innerHeight - top - bottom) / (box.y1 - box.y0));
  box.cy = top + (innerHeight - top - bottom) / 2;
}
const homeCam = () => ({ s:s0, x:innerWidth / 2 - (box.x0 + box.x1) / 2 * s0, y:box.cy - (box.y0 + box.y1) / 2 * s0 });
function setCam(c, animate = true) {
  cam = c;
  stage.classList.toggle('anim', animate && !reduce);
  stage.style.transform = `translate(${c.x}px, ${c.y}px) scale(${c.s})`;
  stage.style.setProperty('--inv', (1 / c.s).toFixed(4));
  document.body.classList.toggle('near', c.s > s0 * 1.35);
}
// 把舞台上的點 (px, py) 移到畫面上某個位置，放大 k 倍
function focus(px, py, k) {
  const s = Math.min(s0 * k, MAX_S), desk = innerWidth > 640;
  const cx = desk && !card.hidden ? (innerWidth - 330) / 2 : innerWidth / 2;
  const cy = desk ? innerHeight * .52 : innerHeight * .34;
  setCam({ s, x:cx - px * s, y:cy - py * s });
}
function goHome() { closeCard(); setCam(homeCam()); setView('home'); }

// ================= 拖曳平移、滾輪縮放 =================
let drag = null, moved = false;
view.addEventListener('pointerdown', e => { if (e.button) return; drag = { x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y }; moved = false; });
addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 6) return;
  moved = true; view.classList.add('dragging');
  setCam({ s:cam.s, x:drag.cx + dx, y:drag.cy + dy }, false);
});
addEventListener('pointerup', () => { drag = null; view.classList.remove('dragging'); });
view.addEventListener('click', e => { if (!moved && e.target.tagName !== 'polygon' && selected) closeCard(); });
view.addEventListener('wheel', e => {
  e.preventDefault();
  const s = Math.min(Math.max(MAX_S, s0), Math.max(s0 * .9, cam.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
  const k = s / cam.s;
  setCam({ s, x:e.clientX - (e.clientX - cam.x) * k, y:e.clientY - (e.clientY - cam.y) * k }, false);
}, { passive:false });

// ================= 熱區：滑過、點擊 =================
function bindSpots() {
  const tip = $('tip'), tipEl = tip.firstChild;
  stage.querySelectorAll('#hot polygon').forEach(p => {
    const [kind, id] = p.dataset.k.split(':'), s = spotById.get(p.dataset.k);
    const open = () => { if (moved) return; kind === 'unit' ? openUnit(unitById.get(id)) : openIsland(islById.get(id)); };
    p.addEventListener('click', open);
    p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    p.addEventListener('pointerenter', e => {
      if (e.pointerType !== 'mouse') return;
      const u = kind === 'unit' ? unitById.get(id) : null, i = u ? null : islById.get(id);
      tipEl.textContent = u ? `${u.emoji} ${u.short}` : `${i.icon} ${i.name}`;
      const at = u ? [s.badge[0], s.badge[1] - 46 / cam.s] : s.label;
      tip.style.left = at[0] + 'px'; tip.style.top = (u ? at[1] : at[1] - 48 / cam.s) + 'px';
      tipEl.classList.add('on');
    });
    p.addEventListener('pointerleave', () => tipEl.classList.remove('on'));
  });
}
function markSel(key) { stage.querySelectorAll('#hot polygon.sel').forEach(p => p.classList.remove('sel')); if (key) stage.querySelector(`#hot polygon[data-k="${key}"]`)?.classList.add('sel'); }
function dismissHint() { hintEl?.remove(); hintEl = null; }

// ================= 卡片 =================
function openUnit(u) {
  if (!u) return;
  selected = u; dismissHint();
  card.style.setProperty('--c', pastelHex(u.isl.color, .35));
  card.innerHTML = `<button class="x" aria-label="關閉">✖</button>
    <div class="emo">${u.emoji}</div><h2>${u.short}</h2><p class="full">${u.full}</p>
    <div class="chips"><span>${u.isl.icon} ${u.isl.name}</span><span>${u.grade}</span><span>${recText(u)}</span></div>
    <a class="go" href="./${u.url}">🚀 出發</a>`;
  card.hidden = false;
  card.querySelector('.x').onclick = closeCard;
  const s = spotById.get('unit:' + u.id); markSel('unit:' + u.id);
  focus(s.c[0], s.c[1] - 30, curMode === 'port' ? 2.4 : 2.6);
}
function openIsland(isl) {
  selected = isl; dismissHint();
  card.style.setProperty('--c', pastelHex(isl.color, .35));
  card.innerHTML = `<button class="x" aria-label="關閉">✖</button>
    <div class="emo">${isl.icon}</div><h2>${isl.name}</h2>
    <div class="chips"><span>🎮 ${isl.list.length} 關</span><span>⭐ ${isl.list.filter(u => u.rec).length}</span></div>
    <div class="mini">${isl.list.map((u, i) => `<button data-i="${i}"><b>${u.emoji}</b><span>${u.short}</span>${u.rec ? '<s>⭐</s>' : ''}</button>`).join('')}</div>`;
  card.hidden = false;
  card.querySelector('.x').onclick = closeCard;
  card.querySelectorAll('.mini button').forEach(b => b.onclick = () => openUnit(isl.list[+b.dataset.i]));
  const s = spotById.get('island:' + isl.id); markSel(null);
  focus(s.c[0], s.c[1], curMode === 'port' ? 1.8 : 1.9);
}
function closeCard() { selected = null; card.hidden = true; markSel(null); }
addEventListener('keydown', e => { if (e.key === 'Escape') { if (!listEl.hidden) closeList(); else closeCard(); } });

// ================= 清單 =================
$('listBody').innerHTML = ISLANDS.map((isl, ii) => `
  <h3 style="--c:${pastelHex(isl.color,.35)}"><i>${isl.icon}</i>${isl.name}</h3>
  <div class="grid">${isl.list.map((u, i) => `<button data-ii="${ii}" data-i="${i}" aria-label="${u.full}"><b>${u.emoji}</b><span>${u.short}</span>${u.rec ? '<s>⭐</s>' : ''}</button>`).join('')}</div>`).join('');
listEl.querySelectorAll('.grid button').forEach(b => b.onclick = () => { closeList(); openUnit(ISLANDS[+b.dataset.ii].list[+b.dataset.i]); });
function setView(v) { $('vHome').setAttribute('aria-pressed', v === 'home'); $('vList').setAttribute('aria-pressed', v === 'list'); }
function openList() { listEl.hidden = false; setView('list'); listEl.querySelector('.x').focus(); }
function closeList() { listEl.hidden = true; setView('home'); }
$('vList').onclick = openList;
$('vHome').onclick = goHome;
listEl.querySelector('.x').onclick = closeList;
listEl.addEventListener('click', e => { if (e.target === listEl) closeList(); });

// ================= 視窗大小：換方向就換一組圖，否則重新置中 =================
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  if (mode() !== curMode) { closeCard(); build(); return; }
  fit(); if (selected) (selected.list ? openIsland : openUnit)(selected); else setCam(homeCam(), false);
}, 150); });

window.__islandDebug = { spot:k => spotById.get(k), cam:() => cam };
build();
</script>
</body>
</html>
