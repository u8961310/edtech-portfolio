<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>右鍵魔法師 - 滑鼠島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="../../assets/css/mouse-island.css">
  <style>
    /* 場景樣式：class 與 keyframes 一律以 sc- 開頭 */
    .sc-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #F6E7BE;
      user-select: none;
    }
    .sc-bg svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 上方 HUD：任務條與計數器 */
    .sc-hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
    .sc-mission {
      position: absolute;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 26px;
      background: #FFF8E4;
      border: 3px solid #6E4125;
      border-radius: 18px;
      box-shadow: 0 4px 0 #9A5F36;
      color: #33261B;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: .5px;
      white-space: nowrap;
    }
    .sc-mission-star {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
    }
    .sc-mission-tag {
      display: inline-block;
      padding: 2px 10px;
      margin-right: 4px;
      border-radius: 10px;
      background: #236F96;
      color: #FFF8E4;
      font-size: 16px;
      font-weight: 700;
      vertical-align: middle;
    }
    .sc-mission-em {
      color: #C2432A;
    }
    .sc-count {
      position: absolute;
      right: 24px;
      top: 16px;
      padding: 8px 18px;
      background: #FFF8E4;
      border: 2px solid #B9794A;
      border-radius: 14px;
      color: #33261B;
      font-size: 22px;
      font-weight: 700;
    }
    .sc-toast {
      position: absolute;
      right: 24px;
      top: 72px;
      padding: 8px 16px;
      background: #2F7A49;
      color: #FFF8E4;
      border: 2px solid #6E4125;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(51, 38, 27, .18);
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity .22s ease, transform .22s ease;
    }
    .sc-toast.sc-show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 道具容器層 */
    .sc-props {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }
    .sc-prop {
      position: absolute;
      pointer-events: auto;
      cursor: context-menu;
      user-select: none;
      border-radius: 22px;
    }
    .sc-prop-art {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .25s ease, opacity .25s ease, filter .25s ease;
    }
    .sc-prop-art > svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 6px 8px rgba(110, 65, 37, .24));
    }
    .sc-prop:hover .sc-prop-art {
      transform: translateY(-4px) scale(1.04);
    }

    /* 桌面道具小名牌（方便辨識與展示「重新命名」） */
    .sc-prop-label {
      position: absolute;
      left: 50%;
      top: calc(100% + 4px);
      transform: translateX(-50%);
      padding: 3px 12px;
      background: #FFF8E4;
      border: 2px solid #6E4125;
      border-radius: 10px;
      color: #33261B;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 2px 0 rgba(110, 65, 37, .2);
    }
    .sc-prop-label.sc-renamed {
      background: #236F96;
      color: #FFF8E4;
      border-color: #33261B;
      box-shadow: 0 0 0 3px #F2B134;
    }

    /* 彩虹目標光環（含深色外圈，對比清楚，緩慢旋轉 ≤ 0.5Hz） */
    .sc-rainbow-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 4px dashed #6E4125;
      box-shadow: 0 0 0 5px #F2B134, 0 0 18px 6px rgba(242, 177, 52, .65);
      pointer-events: none;
      animation: sc-ring-pulse 2.2s ease-in-out infinite;
    }
    .sc-rainbow-badge {
      position: absolute;
      left: 50%;
      top: -22px;
      transform: translateX(-50%);
      padding: 2px 10px;
      border-radius: 10px;
      background: #C2432A;
      color: #FFF8E4;
      border: 2px solid #33261B;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 左鍵彈一下 */
    .sc-prop.sc-left-bounce .sc-prop-art {
      animation: sc-bounce .42s ease;
    }

    /* 選對的魔法特效 */
    .sc-prop.sc-ok-grow .sc-prop-art {
      transform: scale(1.42);
    }
    .sc-prop.sc-ok-open .sc-prop-art {
      transform: scale(1.16) translateY(-10px);
      filter: drop-shadow(0 0 18px #F2B134);
    }
    .sc-prop.sc-ok-glow .sc-prop-art {
      transform: scale(1.14);
      filter: drop-shadow(0 0 22px #F2B134) brightness(1.12);
    }
    .sc-prop.sc-ok-color .sc-prop-art {
      transform: scale(1.12) rotate(-6deg);
      filter: hue-rotate(115deg) saturate(1.25);
    }
    .sc-prop.sc-ok-float .sc-prop-art {
      transform: translateY(-48px) rotate(-8deg) scale(1.08);
    }
    .sc-prop.sc-ok-pack .sc-prop-art {
      transform: scale(.15) translateY(55px) rotate(18deg);
      opacity: 0;
      transition: transform .55s ease-in, opacity .55s ease-in;
    }
    .sc-prop.sc-ok-delete .sc-prop-art {
      transform: scale(.1) rotate(220deg);
      opacity: 0;
      transition: transform .55s ease-in, opacity .55s ease-in;
    }
    .sc-prop.sc-ok-copy .sc-prop-art {
      transform: translateX(-28px) scale(1.06);
    }

    /* 選錯的搞笑魔法（1 秒內自動恢復） */
    .sc-prop.sc-funny-giant {
      z-index: 60;
    }
    .sc-prop.sc-funny-giant .sc-prop-art {
      transform: scale(2.45);
      transition: transform .22s cubic-bezier(.22, 1.4, .36, 1);
    }
    .sc-prop.sc-funny-fly {
      z-index: 60;
    }
    .sc-prop.sc-funny-fly .sc-prop-art {
      animation: sc-wild-fly .9s ease-in-out;
    }
    .sc-prop.sc-funny-spin {
      z-index: 60;
    }
    .sc-prop.sc-funny-spin .sc-prop-art {
      animation: sc-silly-spin .9s ease-in-out;
    }
    .sc-prop.sc-funny-jiggle {
      z-index: 60;
    }
    .sc-prop.sc-funny-jiggle .sc-prop-art {
      animation: sc-jiggle .9s ease-in-out;
    }
    .sc-funny-addon {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 150%;
      height: 150%;
      pointer-events: none;
    }
    .sc-funny-pop {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      transform: translateX(-50%);
      padding: 6px 14px;
      background: #FFF8E4;
      border: 3px solid #6E4125;
      border-radius: 14px;
      color: #33261B;
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(51, 38, 27, .2);
      pointer-events: none;
      z-index: 65;
    }

    /* 魔法特效層（星星爆開、複製分身、收納盒） */
    .sc-fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 45;
      overflow: hidden;
    }
    .sc-spark {
      position: absolute;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      animation: sc-spark-out .7s ease-out forwards;
    }
    .sc-clone-ghost {
      position: absolute;
      pointer-events: none;
      animation: sc-clone-pop .55s cubic-bezier(.22, 1.35, .36, 1) forwards;
    }
    .sc-clone-ghost svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 12px #F2B134);
    }
    .sc-chest-mini {
      position: absolute;
      width: 90px;
      height: 70px;
      margin: -35px 0 0 -45px;
      animation: sc-pop-in .22s ease-out;
    }

    /* 自製右鍵選單（電腦選單風格：白底、細灰框、陰影、每項 44px 高） */
    .sc-menu-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 80;
    }
    .sc-menu {
      position: absolute;
      min-width: 196px;
      padding: 6px 0;
      background: #FFFFFF;
      border: 1px solid #C6BEB4;
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(51, 38, 27, .22), 0 2px 6px rgba(51, 38, 27, .12);
      pointer-events: auto;
      user-select: none;
      animation: sc-menu-in .12s ease-out;
    }
    .sc-menu-head {
      padding: 4px 16px 6px;
      font-size: 13px;
      font-weight: 700;
      color: #6B5A48;
      border-bottom: 1px solid #EAE4DC;
      margin-bottom: 4px;
    }
    .sc-menu-item {
      height: 44px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #33261B;
      cursor: pointer;
      transition: background-color .1s ease, color .1s ease;
    }
    .sc-menu-item:hover,
    .sc-menu-item:focus-visible {
      background: #236F96;
      color: #FFF8E4;
      outline: none;
    }
    .sc-menu-ico {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }
    .sc-menu-sep {
      height: 1px;
      margin: 4px 10px;
      background: #E5DED4;
    }

    /* assist 模式：選單項目字放大到 22px */
    .sc-assist .sc-menu {
      min-width: 230px;
    }
    .sc-assist .sc-menu-item {
      height: 52px;
      font-size: 22px;
      padding: 0 20px;
    }
    .sc-assist .sc-menu-ico {
      width: 24px;
      height: 24px;
    }

    /* 動畫定義（皆低頻 ≤ 2Hz） */
    @keyframes sc-menu-in {
      from { opacity: 0; transform: scale(.94) translateY(-4px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes sc-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      35%      { transform: translateY(-18px) scale(1.06, .95); }
      70%      { transform: translateY(4px) scale(.96, 1.04); }
    }
    @keyframes sc-ring-pulse {
      0%, 100% { transform: scale(1); opacity: .95; }
      50%      { transform: scale(1.06); opacity: .75; }
    }
    @keyframes sc-wild-fly {
      0%   { transform: translate(0, 0) rotate(0deg); }
      25%  { transform: translate(-42px, -46px) rotate(-18deg); }
      55%  { transform: translate(48px, -58px) rotate(16deg); }
      80%  { transform: translate(-18px, -24px) rotate(-8deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    @keyframes sc-silly-spin {
      0%   { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(360deg) scale(1.18); }
      100% { transform: rotate(720deg) scale(1); }
    }
    @keyframes sc-jiggle {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20%      { transform: rotate(-14deg) scale(1.16); }
      45%      { transform: rotate(14deg) scale(1.2); }
      70%      { transform: rotate(-10deg) scale(1.12); }
    }
    @keyframes sc-spark-out {
      0%   { opacity: 1; transform: translate(0, 0) scale(.5) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--sc-dx), var(--sc-dy)) scale(1.15) rotate(90deg); }
    }
    @keyframes sc-clone-pop {
      0%   { opacity: 0; transform: translateX(0) scale(.4); }
      100% { opacity: 1; transform: translateX(46px) scale(1.04); }
    }
    @keyframes sc-pop-in {
      from { opacity: 0; transform: scale(.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* 尊重使用者的減少動態設定 */
    @media (prefers-reduced-motion: reduce) {
      .sc-prop-art,
      .sc-toast,
      .sc-menu,
      .sc-rainbow-ring,
      .sc-spark,
      .sc-clone-ghost,
      .sc-chest-mini,
      .sc-prop.sc-left-bounce .sc-prop-art,
      .sc-prop.sc-funny-fly .sc-prop-art,
      .sc-prop.sc-funny-spin .sc-prop-art,
      .sc-prop.sc-funny-jiggle .sc-prop-art {
        animation: none !important;
        transition: none !important;
      }
      .sc-prop:hover .sc-prop-art {
        transform: none;
      }
    }
  </style>
</head><body>

            });
          }

          /* 第三段：4 題電腦選單任務，4 題中隨機 1 題出現閃亮彩虹藥水（非刪除題） */
          var rbChoice = shuffle(['open', 'copy', 'rename'])[0];
          var used = {};
          function pickFrom(candidates) {
            var pool = candidates.filter(function (c) { return !used[c.itemId]; });
            var chosen = shuffle(pool.length ? pool : candidates)[0];
            used[chosen.itemId] = true;
            return chosen;
          }

          var qOpen = rbChoice === 'open'
            ? { itemId: 'rainbow', task: '開啟彩虹藥水看看', answer: 'open', isRainbow: true }
            : (function () {
                var c = pickFrom([
                  { itemId: 'book', task: '開啟魔法書看咒語' },
                  { itemId: 'lamp', task: '開啟星星燈照亮桌子' }
                ]);
                return { itemId: c.itemId, task: c.task, answer: 'open', isRainbow: false };
              })();

          var qCopy = rbChoice === 'copy'
            ? { itemId: 'rainbow', task: '再多一瓶彩虹藥水', answer: 'copy', isRainbow: true }
            : (function () {
                var c = pickFrom([
                  { itemId: 'potion', task: '再多一瓶藥水' },
                  { itemId: 'broom',  task: '再多一把飛天掃帚' }
                ]);
                return { itemId: c.itemId, task: c.task, answer: 'copy', isRainbow: false };
              })();

          var qRename = rbChoice === 'rename'
            ? { itemId: 'rainbow', task: '幫彩虹藥水改名字', answer: 'rename', newName: '七彩珍寶', isRainbow: true }
            : (function () {
                var c = pickFrom([
                  { itemId: 'book', task: '幫魔法書改名字', newName: '秘密咒語書' },
                  { itemId: 'wand', task: '幫魔杖改名字',   newName: '閃電魔杖' }
                ]);
                return { itemId: c.itemId, task: c.task, answer: 'rename', newName: c.newName, isRainbow: false };
              })();

          var delPick = pickFrom([
            { itemId: 'potion', task: '把空藥水瓶丟掉' },
            { itemId: 'hat',    task: '把舊魔法帽清掉' }
          ]);
          var qDelete = { itemId: delPick.itemId, task: delPick.task, answer: 'delete', isRainbow: false };

          var list = shuffle([qOpen, qCopy, qRename, qDelete]);
          return list.map(function (q, idx) {
            q.isPC = true;
            q.options = PC_OPTIONS;
            q.totalOnTable = idx < 2 ? 3 : 4;
            return q;
          });
        }

        /* 計算並套用道具尺寸與位置（避開寄寄區） */
        function getBaseSize(stage) {
          if (stage === 0) return 220;
          if (stage === 1) return 150;
          return 100;
        }

        function calcPropSize(stage, cfg) {
          var raw = Math.round(getBaseSize(stage) * cfg.size);
          if (stage === 0) return Math.min(250, Math.max(190, raw));
          if (stage === 1) return Math.min(200, Math.max(115, raw));
          return Math.min(144, Math.max(72, raw));
        }

        function positionProp(p) {
          var half = p.size / 2;
          /* 再次確保不踏入左下角寄寄區（x < 560 且 y > 400） */
          if (p.x - half < 560 && p.y + half + 24 > 396) {
            p.y = Math.min(p.y, 396 - half - 24);
          }
          p.el.style.width = p.size + 'px';
          p.el.style.height = p.size + 'px';
          p.el.style.left = Math.round(p.x - half) + 'px';
          p.el.style.top = Math.round(p.y - half) + 'px';
        }

        /* 更新上方任務條與計數 */
        function updateHud(q) {
          if (els.mission) {
            var badge = q.isRainbow ? '<span class="sc-mission-tag">彩虹任務</span>' : '';
            els.mission.innerHTML =
              '<span class="sc-mission-star">' + STAR_SVG + '</span>' +
              badge + '<span>任務：<span class="sc-mission-em">' + q.task + '</span></span>';
          }
          if (els.count) {
            els.count.textContent = '魔法 ' + qIndex + '／' + questions.length;
          }
        }

        function showToast(text) {
          if (!els.toast) return;
          els.toast.textContent = text;
          els.toast.classList.add('sc-show');
          api.later(function () {
            if (els.toast) els.toast.classList.remove('sc-show');
          }, 1250);
        }

        /* 星星爆開特效 */
        function spawnSparkles(cx, cy, count) {
          if (!els.fxLayer || prefersReducedMotion()) return;
          var n = count || 8;
          for (var i = 0; i < n; i++) {
            var sp = document.createElement('div');
            sp.className = 'sc-spark';
            sp.innerHTML = STAR_SVG;
            var angle = (Math.PI * 2 * i) / n + (Math.random() * .35 - .17);
            var dist = 54 + Math.random() * 44;
            sp.style.left = Math.round(cx) + 'px';
            sp.style.top = Math.round(cy) + 'px';
            sp.style.setProperty('--sc-dx', Math.round(Math.cos(angle) * dist) + 'px');
            sp.style.setProperty('--sc-dy', Math.round(Math.sin(angle) * dist) + 'px');
            els.fxLayer.appendChild(sp);
          }
        }

        /* 打開自製右鍵選單（精準避開邊界與左下角寄寄區） */
        function openContextMenu(prop, localPos) {
          closeMenu();
          var q = questions[qIndex];
          if (!q) return;   // 這段最後一題答完、等換段的空檔還被按右鍵（11-22 驗收修）
          var menu = document.createElement('div');
          menu.className = 'sc-menu';

          var head = document.createElement('div');
          head.className = 'sc-menu-head';
          head.textContent = ITEM_META[prop.itemId].name;
          menu.appendChild(head);

          q.options.forEach(function (opt) {
            if (opt.sepBefore) {
              var sep = document.createElement('div');
              sep.className = 'sc-menu-sep';
              menu.appendChild(sep);
            }
            var row = document.createElement('div');
            row.className = 'sc-menu-item';
            row.setAttribute('role', 'menuitem');
            row.setAttribute('tabindex', '0');
            row.innerHTML = menuIcon(opt.icon) + '<span>' + opt.label + '</span>';
            menu.appendChild(row);

            menuOffs.push(api.on(row, 'click', {
              ok: function () {
                if (busy) return;
                handleMenuPick(prop, opt, q);
              },
              wrong: function () {
                if (busy) return;
                api.sfx('boing');
                api.say('點左鍵選選單喔', { zy: false });
              }
            }));
          });

          els.menuLayer.appendChild(menu);
          openMenuEl = menu;

          /* 計算選單座標（localPos 是 prop 內的 px） */
          var half = prop.size / 2;
          var clickX = localPos && typeof localPos.x === 'number' ? (prop.x - half + localPos.x) : (prop.x + half * .35);
          var clickY = localPos && typeof localPos.y === 'number' ? (prop.y - half + localPos.y) : prop.y;
          var mw = menu.offsetWidth || 204;
          var mh = menu.offsetHeight || (q.options.length * 46 + 38);

          var mx = Math.min(Math.max(clickX + 8, 16), 1366 - mw - 16);
          var my = Math.min(Math.max(clickY + 6, 86), 581 - mh - 16);

          /* 確保選單不進入左下角寄寄區（x < 560 && y > 400） */
          if (mx < 568 && my + mh > 394) {
            if (clickY - mh - 8 >= 86) {
              my = clickY - mh - 8;
            } else {
              mx = Math.max(mx, 574);
            }
          }
          if (mx < 568 && my + mh > 394) {
            mx = 574;
          }

          menu.style.left = Math.round(mx) + 'px';
          menu.style.top = Math.round(my) + 'px';
          api.sfx('pop');
        }

        /* 處理選單點擊結果 */
        function handleMenuPick(prop, opt, q) {
          closeMenu();
          busy = true;

          if (opt.id === q.answer) {
            /* === 選對：魔法生效＋成就感特效 === */
            api.glow(prop.el, false);
            api.hit();
            api.sfx(q.isRainbow ? 'gem' : 'ok');
            spawnSparkles(prop.x, prop.y, q.isRainbow ? 12 : 8);

            applySuccessMagic(prop, opt.id, q);
            tryCollect(q);

            var doneCount = qIndex + 1;
            if (els.count) els.count.textContent = '魔法 ' + doneCount + '／' + questions.length;

            var isLastOfStage2 = curStage === 2 && doneCount >= questions.length;
            if (isLastOfStage2) {
              api.say('電腦上也可以這樣按喔', { zy: false });
            } else if (q.isRainbow) {
              api.say('哇！發現彩虹藥水！', { zy: false });
            } else {
              api.say('太棒了！魔法成功！', { zy: false });
            }

            api.later(function () {
              qIndex++;
              busy = false;
              if (qIndex >= questions.length) {
                api.stageDone();
              } else {
                spawnCurrentQuestion();
              }
            }, isLastOfStage2 ? 1200 : 880);
          } else {
            /* === 選錯：好笑的魔法，1 秒內自動恢復 === */
            var meta = ITEM_META[prop.itemId];
            prop.el.classList.add(meta.funnyCls);
            api.wob(prop.el);
            api.sfx('giggle');
            api.say(meta.say, { zy: false });

            var addonWrap = null;
            if (meta.addon && FUNNY_ADDONS[meta.addon]) {
              addonWrap = document.createElement('div');
              addonWrap.innerHTML = FUNNY_ADDONS[meta.addon];
              prop.artEl.appendChild(addonWrap.firstChild);
              addonWrap = prop.artEl.lastChild;
            }

            var pop = document.createElement('div');
            pop.className = 'sc-funny-pop';
            pop.textContent = meta.pop;
            prop.el.appendChild(pop);

            api.later(function () {
              prop.el.classList.remove(meta.funnyCls);
              if (addonWrap && addonWrap.parentNode) addonWrap.parentNode.removeChild(addonWrap);
              if (pop && pop.parentNode) pop.parentNode.removeChild(pop);
              busy = false;
              api.miss();
            }, 950);
          }
        }

        /* 各種選對魔法的視覺演出 */
        function applySuccessMagic(prop, actionId, q) {
          if (actionId === 'open') {
            prop.el.classList.add('sc-ok-open');
          } else if (actionId === 'grow') {
            prop.el.classList.add('sc-ok-grow');
          } else if (actionId === 'color') {
            prop.el.classList.add('sc-ok-color');
          } else if (actionId === 'glow') {
            prop.el.classList.add('sc-ok-glow');
          } else if (actionId === 'float') {
            prop.el.classList.add('sc-ok-float');
          } else if (actionId === 'pack') {
            var chest = document.createElement('div');
            chest.className = 'sc-chest-mini';
            chest.innerHTML = MINI_CHEST_SVG;
            chest.style.left = Math.round(prop.x) + 'px';
            chest.style.top = Math.round(Math.min(prop.y + 42, 360)) + 'px';
            els.fxLayer.appendChild(chest);
            prop.el.classList.add('sc-ok-pack');
          } else if (actionId === 'delete') {
            prop.el.classList.add('sc-ok-delete');
          } else if (actionId === 'copy') {
            prop.el.classList.add('sc-ok-copy');
            var clone = document.createElement('div');
            clone.className = 'sc-clone-ghost';
            clone.style.width = prop.size + 'px';
            clone.style.height = prop.size + 'px';
            clone.style.left = Math.round(prop.x - prop.size / 2) + 'px';
            clone.style.top = Math.round(prop.y - prop.size / 2) + 'px';
            clone.innerHTML = SVGS[prop.itemId];
            els.fxLayer.appendChild(clone);
          } else if (actionId === 'rename') {
            prop.el.classList.add('sc-ok-glow');
            if (prop.labelEl) {
              prop.labelEl.textContent = q.newName || '超級魔法道具';
              prop.labelEl.classList.add('sc-renamed');
            }
          }
        }

        /* 圖鑑收集：彩虹藥水只從彩虹目標收集；一般道具隨機收集 */
        function tryCollect(q) {
          if (q.isRainbow) {
            if (api.collect('rainbow')) {
              showToast('圖鑑新收集：彩虹藥水！');
            }
            return;
          }
          var got = api.collected() || [];
          var chance = (curStage === 0 && got.length === 0) ? 1 : 0.48;
          if (Math.random() < chance) {
            if (api.collect(q.itemId)) {
              showToast('圖鑑新收集：' + ITEM_META[q.itemId].name);
            }
          }
        }

        /* 建立單個魔法道具元素並掛上 api.on(..., 'right', ...) */
        function createProp(opts) {
          var el = document.createElement('div');
          el.className = 'sc-prop';

          var art = document.createElement('div');
          art.className = 'sc-prop-art';
          art.innerHTML = SVGS[opts.itemId];
          el.appendChild(art);

          if (opts.isRainbow) {
            var ring = document.createElement('div');
            ring.className = 'sc-rainbow-ring';
            el.appendChild(ring);
            var rbBadge = document.createElement('div');
            rbBadge.className = 'sc-rainbow-badge';
            rbBadge.textContent = '彩虹道具';
            el.appendChild(rbBadge);
          }

          var labelEl = null;
          if (opts.showLabel) {
            labelEl = document.createElement('div');
            labelEl.className = 'sc-prop-label';
            labelEl.textContent = ITEM_META[opts.itemId].name;
            el.appendChild(labelEl);
          }

          var p = {
            el: el,
            artEl: art,
            labelEl: labelEl,
            itemId: opts.itemId,
            isTarget: opts.isTarget,
            isRainbow: opts.isRainbow,
            x: opts.x,
            y: opts.y,
            size: opts.size,
            vx: opts.vx || 0,
            vy: opts.vy || 0,
            bounds: opts.bounds || null
          };

          positionProp(p);
          els.propsLayer.appendChild(el);
          props.push(p);

          propOffs.push(api.on(el, 'right', {
            ok: function (pos) {
              if (busy) return;
              if (!p.isTarget) {
                /* 第三段干擾道具：點到不算失手，只是沒效果並輕輕提示 */
                closeMenu();
                api.wob(el);
                api.sfx('boing');
                api.say('先找任務說的道具喔', { zy: false });
                return;
              }
              openContextMenu(p, pos);
            },
            wrong: function (which) {
              if (busy || which !== 'left') return;
              if (!p.isTarget) {
                /* 第三段干擾道具：點到不算失手 */
                closeMenu();
                api.wob(el);
                api.sfx('boing');
                api.say('先找任務說的道具喔', { zy: false });
                return;
              }
              closeMenu();
              el.classList.remove('sc-left-bounce');
              void el.offsetWidth;
              el.classList.add('sc-left-bounce');
              api.wob(el);
              api.sfx('boing');
              api.say('要按右邊的鍵喔', { zy: false });
              api.miss();
            }
          }));

          return p;
        }

        /* 生成目前這一題的所有道具 */
        function spawnCurrentQuestion() {
          clearProps();
          var cfg = api.cfg();
          assistOn = !!cfg.assist;
          api.field.classList.toggle('sc-assist', assistOn);

          var q = questions[qIndex];
          updateHud(q);

          var size = calcPropSize(curStage, cfg);
          var noMove = assistOn || prefersReducedMotion();

          if (curStage === 0) {
            /* 第一段：1 個大道具（魔法書），放在中間偏上、不動、先發光再示範 */
            targetProp = createProp({
              itemId: q.itemId,
              isTarget: true,
              isRainbow: false,
              showLabel: false,
              x: 700,
              y: 265,
              size: size,
              vx: 0,
              vy: 0
            });
            api.glow(targetProp.el, true);
            api.demo(targetProp.el, 'right');
            return;
          }

          if (curStage === 1) {
            /* 第二段：一次 1 個中等道具，慢慢左右浮動，完全高於 y=400 */
            var startX = 340 + Math.random() * 680;
            var startY = 230 + Math.random() * 52;
            var spd = noMove ? 0 : 34 * cfg.speed;
            targetProp = createProp({
              itemId: q.itemId,
              isTarget: true,
              isRainbow: false,
              showLabel: true,
              x: startX,
              y: startY,
              size: size,
              vx: (Math.random() < .5 ? -1 : 1) * spd,
              vy: 0,
              bounds: { minX: 240, maxX: 1126, minY: 220, maxY: 285 }
            });
            if (assistOn) api.glow(targetProp.el, true);
            return;
          }

          /* 第三段：3–4 個道具分散在互不重疊的桌面槽位，先找對道具再按右鍵 */
          var countOnTable = q.totalOnTable || 4;
          var distractorPool = shuffle(REGULAR_IDS.filter(function (id) { return id !== q.itemId; }));
          var chosenIds = [q.itemId].concat(distractorPool.slice(0, countOnTable - 1));
          var slots = shuffle(TABLE_SLOTS).slice(0, countOnTable);

          chosenIds.forEach(function (id, idx) {
            var sl = slots[idx];
            var isTgt = idx === 0;
            var sx = (sl.minX + sl.maxX) / 2;
            var sy = (sl.minY + sl.maxY) / 2;
            var sp = noMove ? 0 : (36 + Math.random() * 14) * cfg.speed;
            var ang = Math.random() * Math.PI * 2;
            var p = createProp({
              itemId: id,
              isTarget: isTgt,
              isRainbow: isTgt && q.isRainbow,
              showLabel: true,
              x: sx,
              y: sy,
              size: size,
              vx: Math.cos(ang) * sp,
              vy: Math.sin(ang) * sp * 0.7,
              bounds: sl
            });
            if (isTgt) targetProp = p;
          });

          if (assistOn && targetProp) api.glow(targetProp.el, true);
        }

        /* 慢速平順移動迴圈（開啟選單、busy、assist 或 reduced-motion 時自動暫停） */
        function startLoop() {
          var last = performance.now();
          function step(now) {
            var dt = Math.min(0.05, (now - last) / 1000);
            last = now;
            if (!openMenuEl && !busy && !assistOn && !prefersReducedMotion()) {
              props.forEach(function (p) {
                if (!p.bounds || (p.vx === 0 && p.vy === 0)) return;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                if (p.x < p.bounds.minX) { p.x = p.bounds.minX; p.vx = Math.abs(p.vx); }
                if (p.x > p.bounds.maxX) { p.x = p.bounds.maxX; p.vx = -Math.abs(p.vx); }
                if (p.y < p.bounds.minY) { p.y = p.bounds.minY; p.vy = Math.abs(p.vy); }
                if (p.y > p.bounds.maxY) { p.y = p.bounds.maxY; p.vy = -Math.abs(p.vy); }
                positionProp(p);
              });
            }
            raf = requestAnimationFrame(step);
          }
          raf = requestAnimationFrame(step);
        }

        /* === 回傳給 mouse-ui.js 的 scene 生命週期介面 === */
        return {
          start: function (stage, cfg) {
            clearAll();
            curStage = stage;
            qIndex = 0;
            assistOn = !!cfg.assist;
            questions = buildQuestions(stage);

            api.field.classList.toggle('sc-assist', assistOn);
            api.field.innerHTML =
              '<div class="sc-bg">' + BG_SVG + '</div>' +
              '<div class="sc-hud">' +
                '<div class="sc-mission"></div>' +
                '<div class="sc-count"></div>' +
                '<div class="sc-toast" aria-live="polite"></div>' +
              '</div>' +
              '<div class="sc-props"></div>' +
              '<div class="sc-fx"></div>' +
              '<div class="sc-menu-layer"></div>';

            els.bg = api.field.querySelector('.sc-bg');
            els.mission = api.field.querySelector('.sc-mission');
            els.count = api.field.querySelector('.sc-count');
            els.toast = api.field.querySelector('.sc-toast');
            els.propsLayer = api.field.querySelector('.sc-props');
            els.fxLayer = api.field.querySelector('.sc-fx');
            els.menuLayer = api.field.querySelector('.sc-menu-layer');

            /* 空白背景層是道具與選單的兄弟元素，不會跟道具／選單冒泡衝突 */
            sceneOffs.push(api.on(els.bg, 'right', {
              ok: function () {
                if (busy) return;
                if (openMenuEl) {
                  closeMenu();
                  return;
                }
                if (targetProp) {
                  api.wob(targetProp.el);
                  api.sfx('giggle');
                  api.say('要對準道具按右鍵喔', { zy: false });
                  api.miss();
                }
              },
              wrong: function () {
                if (busy) return;
                if (openMenuEl) {
                  closeMenu();
                  return;
                }
                if (targetProp) {
                  api.wob(targetProp.el);
                  api.sfx('giggle');
                  api.say('要對準道具按右鍵喔', { zy: false });
                  api.miss();
                }
              }
            }));

            spawnCurrentQuestion();
            startLoop();
          },

          hint: function (level) {
            if (!targetProp || busy) return;
            api.glow(targetProp.el, true);
            if (level === 2) {
              closeMenu();
              api.demo(targetProp.el, 'right');
            }
          },

          assist: function () {
            assistOn = true;
            api.field.classList.add('sc-assist');
            var cfg = api.cfg();
            props.forEach(function (p) {
              p.vx = 0;
              p.vy = 0;
            });
            if (targetProp) {
              targetProp.size = calcPropSize(curStage, cfg);
              positionProp(targetProp);
              api.glow(targetProp.el, true);
            }
          },

          stop: clearAll
        };
      }
    });
  })();
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
