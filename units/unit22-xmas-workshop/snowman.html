<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聖誕工坊大救援 — 堆雪人</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       字型設定（注音字型與標題字型）
       ========================================================= */
    @font-face {
      font-family: 'Bpmf Huninn';
      src: url('fonts/bpmf-huninn-xmas.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      --xmas-red: #c0392b;
      --xmas-dark-red: #8e1c14;
      --xmas-green: #1e7a4c;
      --xmas-dark-green: #124f31;
      --xmas-gold: #e6a817;
      --xmas-gold-light: #ffd54f;
      --xmas-navy: #142850;
      --xmas-cream: #fff8e6;
      --xmas-ink: #2a1b12;
      --font-bpmf: 'Bpmf Huninn', 'Noto Sans TC', sans-serif;
      --font-ui: 'Noto Sans TC', sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: var(--font-ui);
      font-synthesis: none;
      color: var(--xmas-ink);
      background: linear-gradient(180deg, #142850 0%, #24487a 14%, #8ec7ee 22%, #d8f1ff 60%, #f5fbff 100%);
      user-select: none;
    }

    /* 學生閱讀用的注音文字通用類別 */
    .bpmf {
      font-family: var(--font-bpmf);
      font-weight: 400;
      line-height: 1.55;
    }

    /* =========================================================
       飄雪背景層（可由 prefers-reduced-motion 停用）
       ========================================================= */
    .snow-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 40;
    }

    .snowflake {
      position: absolute;
      top: -24px;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(20, 40, 80, 0.25);
      opacity: 0.85;
      animation: snowfall linear infinite;
      will-change: transform;
    }

    @keyframes snowfall {
      0% { transform: translate3d(0, -10px, 0) rotate(0deg); }
      50% { transform: translate3d(18px, 50vh, 0) rotate(180deg); }
      100% { transform: translate3d(-12px, 106vh, 0) rotate(360deg); }
    }

    /* =========================================================
       頁面主容器（橫向 1280x800 滿版不捲動）
       ========================================================= */
    .app-shell {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      min-height: 680px;
      overflow: hidden;
    }

    /* =========================================================
       上方狀態列＋聖誕燈串
       ========================================================= */
    .top-bar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 70px;
      padding: 8px 16px 10px;
      background:
        repeating-linear-gradient(
          -45deg,
          rgba(192, 57, 43, 0.22) 0 14px,
          rgba(30, 122, 76, 0.22) 14px 28px
        ),
        linear-gradient(180deg, #142850 0%, #1c366b 100%);
      border-bottom: 4px solid var(--xmas-gold);
      box-shadow: 0 4px 12px rgba(20, 40, 80, 0.35);
      flex-shrink: 0;
    }

    /* 左上角固定預留 120×44px 空白給整合後「回首頁」按鈕 */
    .home-slot {
      width: 120px;
      height: 44px;
      flex-shrink: 0;
    }

    .top-left-group {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .page-title {
      margin: 0;
      font-family: var(--font-ui);
      font-weight: 900;
      font-size: 30px;
      letter-spacing: 2px;
      color: #fff8e6;
      text-shadow:
        0 2px 0 #c0392b,
        0 4px 0 #a02a1f,
        0 6px 0 #7a1c13,
        0 8px 12px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }

    /* 模式切換膠囊（任務模式 / 自由模式） */
    .mode-switch {
      display: inline-flex;
      padding: 4px;
      border-radius: 14px;
      background: rgba(10, 22, 48, 0.65);
      border: 2px solid var(--xmas-gold);
      gap: 4px;
      flex-shrink: 0;
    }

    .mode-btn {
      border: none;
      border-radius: 10px;
      padding: 4px 14px;
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.25;
      color: #fff8e6;
      background: transparent;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .mode-btn:hover {
      background: rgba(255, 248, 230, 0.16);
    }

    .mode-btn:active {
      transform: scale(0.96);
    }

    .mode-btn.active {
      background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%);
      color: #fff8e6;
      box-shadow: 0 3px 0 #7a1c13, inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .top-right-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .progress-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 12px;
      background: rgba(255, 248, 230, 0.95);
      border: 2px solid var(--xmas-gold);
      color: var(--xmas-navy);
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 17px;
      white-space: nowrap;
    }

    .progress-badge.unlocked {
      background: linear-gradient(180deg, #fff4c2 0%, #ffe074 100%);
      border-color: #c0392b;
      color: #7a1c13;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 2.5px solid #ffd54f;
      background: linear-gradient(180deg, #279b61 0%, #1e7a4c 100%);
      color: #fff8e6;
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 17px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 3px 0 #0e4227;
      transition: transform 0.12s ease, filter 0.12s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .nav-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0e4227;
    }

    .sound-btn {
      width: 46px;
      padding: 0;
      font-size: 20px;
      background: linear-gradient(180deg, #f3bd31 0%, #e6a817 100%);
      border-color: #fff8e6;
      color: #2a1b12;
      box-shadow: 0 3px 0 #996405;
    }

    .sound-btn:active {
      box-shadow: 0 1px 0 #996405;
    }

    /* 懸掛在頂部列下緣的彩色聖誕燈串 */
    .lights-garland {
      position: absolute;
      left: 0;
      right: 0;
      top: 66px;
      height: 26px;
      z-index: 18;
      pointer-events: none;
      overflow: hidden;
    }

    .bulb-a { animation: bulbTwinkle 1.8s ease-in-out infinite; }
    .bulb-b { animation: bulbTwinkle 1.8s ease-in-out 0.6s infinite; }
    .bulb-c { animation: bulbTwinkle 1.8s ease-in-out 1.2s infinite; }

    @keyframes bulbTwinkle {
      0%, 100% { opacity: 0.68; }
      50% { opacity: 1; }
    }

    /* =========================================================
       主遊戲三欄區
       ========================================================= */
    .workspace {
      position: relative;
      z-index: 10;
      flex: 1;
      display: grid;
      grid-template-columns: 336px 1fr 384px;
      gap: 14px;
      padding: 20px 14px 14px;
      min-height: 0;
    }

    /* 聖誕卡片共用樣式：雙層邊框＋紅綠格紋底紋＋角落冬青葉 */
    .xmas-card {
      position: relative;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      padding: 8px;
      background:
        repeating-linear-gradient(
          45deg,
          #c0392b 0 12px,
          #a3291d 12px 24px,
          #1e7a4c 24px 36px,
          #17633d 36px 48px
        );
      box-shadow: 0 8px 20px rgba(20, 40, 80, 0.25);
      min-height: 0;
    }

    .xmas-card-inner {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--xmas-cream);
      border: 3px solid var(--xmas-gold);
      border-radius: 14px;
      padding: 12px 14px;
      overflow: hidden;
      min-height: 0;
    }

    .holly-corner {
      position: absolute;
      width: 44px;
      height: 44px;
      pointer-events: none;
      z-index: 5;
    }

    .holly-corner svg {
      width: 100%;
      height: 100%;
    }

    .holly-tl { top: -8px; left: -8px; }
    .holly-tr { top: -8px; right: -8px; transform: scaleX(-1); }

    /* =========================================================
       左欄：任務卡 / 自由說明 ＋ 叮叮提示區
       ========================================================= */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 2px dashed rgba(192, 57, 43, 0.35);
      flex-shrink: 0;
    }

    .card-header-title {
      margin: 0;
      font-family: var(--font-ui);
      font-weight: 900;
      font-size: 21px;
      color: var(--xmas-dark-red);
      letter-spacing: 1px;
    }

    /* 6 張任務卡選擇鈕 */
    .mission-tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .mission-num-btn {
      position: relative;
      height: 40px;
      border-radius: 10px;
      border: 2px solid #d4b07c;
      background: #fffdf6;
      color: var(--xmas-navy);
      font-family: var(--font-ui);
      font-weight: 900;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .mission-num-btn:hover {
      background: #fff2cc;
      transform: translateY(-1px);
    }

    .mission-num-btn:active {
      transform: scale(0.95);
    }

    .mission-num-btn.active {
      background: var(--xmas-red);
      border-color: var(--xmas-dark-red);
      color: #fff8e6;
      box-shadow: 0 3px 0 #7a1c13;
    }

    .mission-num-btn.cleared {
      background: #e9f7ef;
      border-color: var(--xmas-green);
      color: var(--xmas-dark-green);
    }

    .mission-num-btn.cleared.active {
      background: var(--xmas-green);
      border-color: var(--xmas-dark-green);
      color: #fff8e6;
      box-shadow: 0 3px 0 #0d3d25;
    }

    .mission-star-mark {
      position: absolute;
      top: -6px;
      right: -4px;
      font-size: 14px;
      line-height: 1;
    }

    /* 任務卡內容盒（注音 24px 大字） */
    .mission-box {
      flex: 1;
      overflow-y: auto;
      background: #ffffff;
      border: 2.5px solid #e6c58b;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      min-height: 0;
    }

    .mission-subtitle {
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 17px;
      color: var(--xmas-green);
      margin: 0 0 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mission-checklist {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mission-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #fffaf0;
      border-left: 4px solid var(--xmas-red);
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.45;
      color: var(--xmas-ink);
    }

    .mission-item.item-wrong {
      background: #ffe8e6;
      border-left-color: #c0392b;
      animation: gentleShake 0.4s ease;
    }

    .mission-item.item-ok {
      background: #e8f8ef;
      border-left-color: #1e7a4c;
    }

    .mission-bullet {
      font-family: var(--font-ui);
      font-size: 18px;
      color: var(--xmas-gold);
      margin-top: 6px;
      flex-shrink: 0;
    }

    /* 自由模式說明盒 */
    .free-info-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      background: #ffffff;
      border: 2.5px solid #e6c58b;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      overflow-y: auto;
    }

    .free-info-text {
      margin: 0;
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.55;
      color: var(--xmas-ink);
    }

    .free-deco-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-top: 4px;
    }

    /* 叮叮對話區 */
    .dingding-area {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding-top: 6px;
      border-top: 2px dashed rgba(30, 122, 76, 0.3);
      flex-shrink: 0;
    }

    .dingding-avatar {
      width: 92px;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .dingding-avatar:hover {
      transform: scale(1.06) rotate(-2deg);
    }

    .dingding-avatar:active {
      transform: scale(0.95);
    }

    .dingding-avatar svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .speech-bubble {
      position: relative;
      flex: 1;
      background: #ffffff;
      border: 2.5px solid var(--xmas-green);
      border-radius: 14px;
      padding: 8px 10px;
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.4;
      color: var(--xmas-ink);
      min-height: 82px;
      display: flex;
      align-items: center;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      left: -10px;
      bottom: 20px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 10px solid var(--xmas-green);
    }

    .speech-bubble.mood-hint {
      background: #fff4e0;
      border-color: var(--xmas-red);
    }

    .speech-bubble.mood-hint::before {
      border-right-color: var(--xmas-red);
    }

    .speech-bubble.mood-cheer {
      background: #e9f9ef;
      border-color: var(--xmas-gold);
    }

    .speech-bubble.mood-cheer::before {
      border-right-color: var(--xmas-gold);
    }

    /* =========================================================
       中欄：白天雪地公園舞台＋底部操作按鈕
       ========================================================= */
    .stage-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }

    .park-stage {
      position: relative;
      flex: 1;
      border-radius: 22px;
      border: 4px solid #fff8e6;
      box-shadow:
        0 0 0 4px var(--xmas-gold),
        0 10px 24px rgba(20, 40, 80, 0.28);
      overflow: hidden;
      background: linear-gradient(180deg, #6bb7ec 0%, #b5e2fa 52%, #edf8ff 72%, #ffffff 100%);
      min-height: 0;
      transition: box-shadow 0.2s ease;
    }

    .park-stage.drop-active {
      box-shadow:
        0 0 0 5px #ffd54f,
        0 0 26px rgba(230, 168, 23, 0.75);
    }

    .park-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 舞台角落迷你裝飾（薑餅人＋聖誕襪標章） */
    .stage-corner-badge {
      position: absolute;
      top: 10px;
      left: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(20, 40, 80, 0.78);
      border: 2px solid var(--xmas-gold);
      color: #fff8e6;
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 16px;
      pointer-events: none;
    }

    /* 拖曳提示條 */
    .drop-hint-pill {
      position: absolute;
      top: 10px;
      right: 12px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 248, 230, 0.92);
      border: 2px solid var(--xmas-green);
      color: var(--xmas-dark-green);
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 16px;
      pointer-events: none;
    }

    /* 舞台上的雪球角色容器 */
    .snowball-stage-wrap {
      position: absolute;
      right: 10px;
      bottom: 8px;
      width: 108px;
      cursor: pointer;
      transition: transform 0.2s ease;
      z-index: 6;
    }

    .snowball-stage-wrap:hover {
      transform: scale(1.07);
    }

    .snowball-stage-wrap:active {
      transform: scale(0.95);
    }

    .snowball-stage-wrap svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .snowball-stage-wrap.cheer-hop {
      animation: happyHop 0.6s ease-in-out infinite;
    }

    /* 拍照快門白光特效 */
    .camera-flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
    }

    .camera-flash.flashing {
      animation: flashEffect 0.45s ease-out;
    }

    @keyframes flashEffect {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    /* 舞台彩帶層 */
    .confetti-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 15;
    }

    .confetti-piece {
      position: absolute;
      top: -16px;
      width: 12px;
      height: 18px;
      border-radius: 3px;
      animation: confettiFall 2.4s ease-out forwards;
    }

    @keyframes confettiFall {
      0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }
      100% { transform: translate3d(var(--dx, 30px), 520px, 0) rotate(680deg); opacity: 0; }
    }

    /* 雪人本體與配件動畫 */
    #snowman-group {
      transform-box: fill-box;
      transform-origin: center bottom;
      cursor: pointer;
    }

    #snowman-group.dancing {
      animation: snowmanDance 0.65s ease-in-out infinite;
    }

    #snowman-group.wiggle {
      animation: snowmanWiggle 0.42s ease;
    }

    .part-pop {
      transform-box: fill-box;
      transform-origin: center;
      animation: partPop 0.34s cubic-bezier(0.22, 1.45, 0.48, 1);
    }

    @keyframes partPop {
      0% { transform: scale(0.45); opacity: 0.3; }
      70% { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes snowmanDance {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      25% { transform: translateY(-14px) rotate(-5deg) scale(1.03, 0.98); }
      50% { transform: translateY(0) rotate(0deg) scale(1.04, 0.95); }
      75% { transform: translateY(-14px) rotate(5deg) scale(1.03, 0.98); }
    }

    @keyframes snowmanWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-6deg); }
      75% { transform: rotate(6deg); }
    }

    @keyframes happyHop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* 角色眨眼動畫（對應叮叮與雪球內建類別） */
    .eye-blink, .eye-blink-delay {
      transform-box: fill-box;
      transform-origin: center;
      animation: charBlink 4.2s infinite;
    }

    .eye-blink-delay {
      animation-delay: 1.5s;
    }

    @keyframes charBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }

    /* 舞台下方行動按鈕列（禮物盒與拐杖糖風格） */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .candy-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px;
      border: none;
      border-radius: 18px;
      background: repeating-linear-gradient(
        -45deg,
        #c0392b 0 10px,
        #fff8e6 10px 20px
      );
      box-shadow: 0 5px 0 #7a1c13, 0 8px 16px rgba(20, 40, 80, 0.25);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .candy-btn-inner {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 26px;
      border-radius: 13px;
      background: linear-gradient(180deg, #e04636 0%, #c0392b 100%);
      border: 2px solid #ffd54f;
      color: #fff8e6;
      font-family: var(--font-bpmf);
      font-size: 26px;
      line-height: 1.25;
      white-space: nowrap;
    }

    .candy-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .candy-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #7a1c13;
    }

    .gift-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 18px;
      border-radius: 16px;
      border: 3px solid var(--xmas-gold-light);
      background: linear-gradient(180deg, #279b61 0%, #1e7a4c 100%);
      color: #fff8e6;
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.25;
      cursor: pointer;
      box-shadow: 0 5px 0 #0e4227;
      transition: transform 0.12s ease, filter 0.12s ease;
      white-space: nowrap;
    }

    .gift-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.07);
    }

    .gift-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #0e4227;
    }

    .gift-btn.secondary {
      background: linear-gradient(180deg, #f5c342 0%, #e6a817 100%);
      border-color: #fff8e6;
      color: #2a1b12;
      box-shadow: 0 5px 0 #996405;
    }

    .gift-btn.secondary:active {
      box-shadow: 0 2px 0 #996405;
    }

    /* =========================================================
       右欄：配件百寶箱（分類頁籤＋大卡片選項）
       ========================================================= */
    .category-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .cat-tab {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 4px;
      border-radius: 12px;
      border: 2.5px solid #d7b786;
      background: #ffffff;
      color: var(--xmas-navy);
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.2;
      cursor: pointer;
      box-shadow: 0 3px 0 #c9a672;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .cat-tab:hover {
      background: #fff4d6;
      transform: translateY(-1px);
    }

    .cat-tab:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #c9a672;
    }

    .cat-tab.active {
      background: linear-gradient(180deg, #279b61 0%, #1e7a4c 100%);
      border-color: var(--xmas-gold);
      color: #fff8e6;
      box-shadow: 0 3px 0 #0e4227;
    }

    /* 檢查提示某部位有誤時的高亮提醒 */
    .cat-tab.hint-highlight {
      border-color: #c0392b;
      background: #ffe8e6;
      color: #8e1c14;
      animation: tabPulse 0.9s ease-in-out infinite;
    }

    .cat-tab.active.hint-highlight {
      background: linear-gradient(180deg, #e04636 0%, #c0392b 100%);
      color: #fff8e6;
      border-color: #ffd54f;
    }

    @keyframes tabPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.6); }
      50% { box-shadow: 0 0 0 6px rgba(192, 57, 43, 0); }
    }

    .cat-dot {
      position: absolute;
      top: 4px;
      right: 5px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--xmas-gold);
      border: 1.5px solid #8e1c14;
    }

    /* 配件選項網格 */
    .parts-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      align-content: start;
      overflow-y: auto;
      padding: 2px 4px 6px;
      min-height: 0;
    }

    .part-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 6px 8px;
      border-radius: 14px;
      border: 3px solid #e2c89c;
      background: #ffffff;
      cursor: grab;
      touch-action: none;
      box-shadow: 0 4px 0 #d4b07c;
      transition: transform 0.14s ease, border-color 0.14s ease, background-color 0.14s ease;
    }

    .part-card:hover {
      border-color: var(--xmas-gold);
      background: #fffdf2;
      transform: translateY(-2px);
    }

    .part-card:active {
      cursor: grabbing;
      transform: scale(0.97);
    }

    .part-card.selected {
      border-color: var(--xmas-red);
      background: linear-gradient(180deg, #fffdf0 0%, #fff0cc 100%);
      box-shadow: 0 0 0 2px var(--xmas-gold), 0 4px 0 #a3291d;
    }

    .part-thumb {
      width: 86px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      pointer-events: none;
    }

    .part-thumb svg {
      width: 100%;
      height: 100%;
    }

    .part-label {
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.25;
      color: var(--xmas-ink);
      text-align: center;
      pointer-events: none;
    }

    .selected-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--xmas-red);
      color: #fff8e6;
      font-family: var(--font-ui);
      font-weight: 900;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* 拖曳中的跟隨幽靈配件 */
    .drag-ghost {
      position: fixed;
      left: 0;
      top: 0;
      width: 112px;
      height: 92px;
      pointer-events: none;
      z-index: 200;
      transform: translate(-50%, -50%) scale(1.15);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 248, 230, 0.92);
      border: 3px solid var(--xmas-gold);
      border-radius: 16px;
      box-shadow: 0 12px 24px rgba(20, 40, 80, 0.35);
    }

    .drag-ghost svg {
      width: 96px;
      height: 78px;
    }

    /* =========================================================
       彈出視窗（過關慶祝 / 拍照預覽）
       關閉時必須 visibility: hidden + inert
       ========================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(20, 40, 80, 0.68);
      opacity: 1;
      visibility: visible;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .modal-backdrop.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .modal-card {
      position: relative;
      width: min(620px, 94vw);
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 24px;
      padding: 10px;
      background: repeating-linear-gradient(
        45deg,
        #c0392b 0 14px,
        #1e7a4c 14px 28px
      );
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .modal-inner {
      background: var(--xmas-cream);
      border: 4px solid var(--xmas-gold);
      border-radius: 18px;
      padding: 22px 24px;
      text-align: center;
    }

    .modal-title {
      margin: 0 0 10px;
      font-family: var(--font-ui);
      font-weight: 900;
      font-size: 32px;
      color: var(--xmas-red);
    }

    .modal-chars {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      margin: 6px 0 12px;
    }

    .modal-msg {
      margin: 0 0 16px;
      font-family: var(--font-bpmf);
      font-size: 26px;
      line-height: 1.5;
      color: var(--xmas-ink);
    }

    .modal-unlock-banner {
      display: inline-block;
      margin-bottom: 14px;
      padding: 8px 18px;
      border-radius: 14px;
      background: linear-gradient(180deg, #fff3b8 0%, #ffe074 100%);
      border: 2.5px solid #c0392b;
      font-family: var(--font-bpmf);
      font-size: 24px;
      color: #7a1c13;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .photo-preview-frame {
      background: #ffffff;
      border: 6px solid #ffffff;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(20, 40, 80, 0.25);
      margin: 0 auto 14px;
      max-width: 520px;
      overflow: hidden;
    }

    .photo-preview-frame img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hidden-el {
      display: none !important;
    }

    /* =========================================================
       直立螢幕響應式重排（手機直拿不水平捲動）
       ========================================================= */
    @media (orientation: portrait) {
      .app-shell {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }

      .top-bar {
        flex-wrap: wrap;
        height: auto;
        padding: 10px 12px 14px;
        gap: 8px;
      }

      .top-left-group {
        flex-wrap: wrap;
        gap: 8px;
      }

      .page-title {
        font-size: 24px;
      }

      .lights-garland {
        display: none;
      }

      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        padding: 12px;
        gap: 12px;
      }

      /* 直立時把雪地舞台放在最上面，接著任務卡與配件櫃 */
      .stage-column {
        order: 1;
      }

      .park-stage {
        height: 410px;
      }

      .left-panel {
        order: 2;
      }

      .right-panel {
        order: 3;
      }

      .parts-grid {
        grid-template-columns: repeat(3, 1fr);
        max-height: none;
      }

      .snowball-stage-wrap {
        width: 82px;
      }
    }

    @media (max-width: 1120px) and (orientation: landscape) {
      .workspace {
        grid-template-columns: 295px 1fr 330px;
        gap: 10px;
      }

      .page-title {
        font-size: 24px;
      }
    }

    /* =========================================================
       無障礙動態減弱設定（關掉所有動畫與飄雪，遊戲仍可玩）
       ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      .snow-layer,
      .confetti-layer {
        display: none !important;
      }

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
<a href="../../index.html" class="kogao-home-btn" style="position:fixed;top:10px;left:10px;z-index:99999;background:rgba(255,255,255,.92);border:2px solid #f59e0b;color:#b45309;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.15)">🏠 首頁</a>
  <!-- 飄雪特效層 -->
  <div class="snow-layer" id="snow-layer" aria-hidden="true"></div>

  <div class="app-shell">
    <!-- ==================== 上方狀態列 ==================== -->
    <header class="top-bar">

          <button type="button" class="mode-btn" id="btn-mode-free" role="tab" aria-selected="false"></button>

      <div class="top-right-group">

        <button type="button" class="nav-btn sound-btn" id="btn-sound-toggle" aria-label="切換音效">🔊</button>
      </div>
    </header>

    <!-- 懸掛聖誕彩燈串（Inline SVG） -->
    <div class="lights-garland" aria-hidden="true">
      <svg viewBox="0 0 1280 28" width="100%" height="28" preserveAspectRatio="none">
        <path d="M0,4 Q80,18 160,4 Q240,18 320,4 Q400,18 480,4 Q560,18 640,4 Q720,18 800,4 Q880,18 960,4 Q1040,18 1120,4 Q1200,18 1280,4" fill="none" stroke="#142850" stroke-width="2.5"/>
        <circle class="bulb-a" cx="80" cy="14" r="6" fill="#ff5252" stroke="#8e1c14" stroke-width="1.5"/>

    <!-- ==================== 主遊戲工作區 ==================== -->

          <div class="card-header">

          <!-- 任務模式內容 -->
          <div id="mission-panel-content" style="display:flex; flex-direction:column; flex:1; min-height:0;">
            <div class="mission-tabs" id="mission-tabs" role="tablist" aria-label="選擇任務卡"></div>

            <!-- 晴朗冬日藍天 -->

            <!-- 溫暖冬日太陽與白雲 -->
            <circle cx="548" cy="72" r="34" fill="#fff3b0" opacity="0.55"/>

            <!-- 遠景小松樹 -->

    /** 雪球拉著載有叮叮與禮物的雪橇 */
    function svgGift(color, shape, size = 104) {
      const fillMain = color === 'red' ? '#d93829' : '#1e874b';
      const fillLight = color === 'red' ? '#f26052' : '#32b369';
      const strokeDark = color === 'red' ? '#7d160e' : '#0e4727';
      const ribbon = color === 'red' ? '#ffd54f' : '#ff6b5c';
      const ribbonStroke = color === 'red' ? '#9e6c06' : '#8a1d14';

      if (shape === 'square') {
        return `
          <svg viewBox="0 0 110 110" width="${size}" height="${size}" aria-hidden="true">
            <!-- 方形蝴蝶結 -->
            <ellipse cx="42" cy="24" rx="14" ry="9" transform="rotate(-18 42 24)" fill="${ribbon}" stroke="${ribbonStroke}" stroke-width="2.5"/>
            <ellipse cx="68" cy="24" rx="14" ry="9" transform="rotate(18 68 24)" fill="${ribbon}" stroke="${ribbonStroke}" stroke-width="2.5"/>
            <circle cx="55" cy="26" r="6" fill="${ribbon}" stroke="${ribbonStroke}" stroke-width="2.5"/>
            <!-- 方形盒身 -->
            <rect x="18" y="30" width="74" height="66" rx="8" fill="${fillMain}" stroke="${strokeDark}" stroke-width="3.5"/>
            <rect x="14" y="28" width="82" height="18" rx="6" fill="${fillLight}" stroke="${strokeDark}" stroke-width="3.5"/>
            <!-- 十字緞帶 -->
            <rect x="47" y="28" width="16" height="68" fill="${ribbon}" stroke="${ribbonStroke}" stroke-width="2"/>
            <rect x="18" y="57" width="74" height="14" fill="${ribbon}" stroke="${ribbonStroke}" stroke-width="2"/>
          </svg>`;
      }
      return `
        <svg viewBox="0 0 110 110" width="${size}" height="${size}" aria-hidden="true">
          <!-- 圓形蝴蝶結 -->
          <ellipse cx="43" cy="20" rx="13" ry="8" transform="rotate(-20 43 20)" fill="${ribbon}" stroke="${ribbonStroke}" stroke-width="2.5"/>
          <ellipse cx="67" cy="20" rx="13" ry="8" transform="rotate(20 67 20)" fill="${ribbon}" stroke="${ribbonStroke}" stroke-width="2.5"/>
          <circle cx="55" cy="22" r="5.5" fill="${ribbon}" stroke="${ribbonStroke}" stroke-width="2.5"/>
          <!-- 圓形球盒 -->
          <circle cx="55" cy="61" r="37" fill="${fillMain}" stroke="${strokeDark}" stroke-width="3.5"/>
          <ellipse cx="42" cy="46" rx="12" ry="8" transform="rotate(-28 42 46)" fill="${fillLight}" opacity="0.75"/>
          <!-- 圓盒十字緞帶 -->
          <rect x="48" y="24" width="14" height="74" rx="4" fill="${ribbon}" stroke="${ribbonStroke}" stroke-width="2"/>

    /* =====================================================================
       五、安全儲存與音效合成（Web Audio API 原創音型）
       ===================================================================== */
    function safeStorageGet(key, fallback = null) {
      try {
        const val = window.localStorage.getItem(key);
        return val === null ? fallback : val;
      } catch (e) {
        return fallback;
      }
    }

    function safeStorageSet(key, value) {
      try {
        window.localStorage.setItem(key, value);
      } catch (e) {
        /* 隱私模式或停用儲存時安全忽略 */
      }
    }

    const SoundEngine = {
      ctx: null,
      enabled: safeStorageGet(STORAGE_KEYS.SOUND, '1') !== '0',

      ensureContext() {
        if (!this.enabled) return null;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          if (!this.ctx) {
            this.ctx = new AudioCtx();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          return this.ctx;
        } catch (e) {
          return null;
        }
      },

      tone(freq, duration, type = 'sine', startOffset = 0, gainPeak = 0.14) {
        const ctx = this.ensureContext();
        if (!ctx) return;
        const now = ctx.currentTime + startOffset;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(gainPeak, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      },

      playClick() {
        this.tone(540, 0.08, 'triangle', 0, 0.12);
      },

      playEquip(category) {
        const pitches = {
          hat: [440, 620],
          scarf: [392, 520],
          nose: [587, 740],
          eyes: [660, 880],
          arms: [349, 494],
          buttons: [523, 659]
        };
        const pair = pitches[category] || [480, 640];
        this.tone(pair[0], 0.09, 'triangle', 0, 0.14);
        this.tone(pair[1], 0.12, 'sine', 0.06, 0.13);
      },

      playWrong() {
        /* 溫和鼓勵的雙音提示，不刺耳 */
        this.tone(360, 0.14, 'triangle', 0, 0.13);
        this.tone(300, 0.2, 'triangle', 0.12, 0.12);
      },

      playWin() {
        /* 原創歡樂上行和弦鈴聲 */
        const notes = [523.25, 659.25, 783.99, 1046.5, 987.77, 1046.5];
        const times = [0, 0.09, 0.18, 0.28, 0.42, 0.52];
        notes.forEach((n, idx) => {
          this.tone(n, 0.24, 'triangle', times[idx], 0.15);
          this.tone(n * 2, 0.18, 'sine', times[idx], 0.05);
        });
      },

      playShutter() {

        this.tone(1100, 0.05, 'square', 0, 0.07);
        this.tone(720, 0.08, 'triangle', 0.05, 0.11);
        this.tone(980, 0.12, 'sine', 0.11, 0.1);
      },

      playGiggle() {
        this.tone(620, 0.07, 'sine', 0, 0.11);
        this.tone(780, 0.09, 'sine', 0.07, 0.12);
      }
    };

    function renderArmsSvg(id) {

      if (id === 'none') {
        return `
          <svg viewBox="0 0 100 80" aria-hidden="true">
            <circle cx="50" cy="40" r="24" fill="#f7efe2" stroke="#c0392b" stroke-width="4"/>
            <line x1="33" y1="23" x2="67" y2="57" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
          </svg>`;
      }
      const viewBoxes = {
        hat: '256 54 156 96',
        scarf: '266 196 122 108',
        nose: '302 140 82 54',
        eyes: '286 130 80 48',
        arms: '166 190 320 90',
        buttons: '296 232 60 94'
      };
      const builders = {
        hat: renderHatSvg,
        scarf: renderScarfSvg,
        nose: renderNoseSvg,
        eyes: renderEyesSvg,
        arms: renderArmsSvg,
        buttons: renderButtonsSvg
      };
      const content = builders[category](id);
      /* 縮圖也需要格紋 pattern 定義 */
      const defs = category === 'scarf' && id === 'plaid'
        ? `<defs><pattern id="plaidThumb" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#c0392b"/><rect x="0" y="6" width="16" height="4" fill="#1e7a4c"/><rect x="6" y="0" width="4" height="16" fill="#1e7a4c"/><rect x="0" y="13" width="16" height="2" fill="#ffd54f"/><rect x="13" y="0" width="2" height="16" fill="#ffd54f"/></pattern></defs>`
        : '';
      const fixedContent = defs ? content.replaceAll('url(#plaidPattern)', 'url(#plaidThumb)') : content;
      return `<svg viewBox="${viewBoxes[category]}" aria-hidden="true">${defs}${fixedContent}</svg>`;
    }

    /* =====================================================================
       十、配件點擊與 Pointer Events 拖曳互動
       ===================================================================== */
    function bindPartPointerInteraction(card, category, partId) {
      let startX = 0;
      let startY = 0;
      let isDragging = false;
      let ghostEl = null;
      let activePointerId = null;

      function cleanupDrag() {
        if (ghostEl && ghostEl.parentNode) {
          ghostEl.parentNode.removeChild(ghostEl);
        }
        ghostEl = null;
        isDragging = false;
        activePointerId = null;
        dom.parkStage.classList.remove('drop-active');
      }

      card.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        activePointerId = e.pointerId;
        startX = e.clientX;
        startY = e.clientY;
        isDragging = false;
        try {
          card.setPointerCapture(e.pointerId);
        } catch (err) {
          /* 忽略不支援 capture 的情況 */
        }
      });

      card.addEventListener('pointermove', (e) => {
        if (activePointerId !== e.pointerId) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (!isDragging && Math.hypot(dx, dy) > 8) {
          isDragging = true;
          ghostEl = document.createElement('div');
          ghostEl.className = 'drag-ghost';
          ghostEl.innerHTML = renderPartThumbnail(category, partId);
          document.body.appendChild(ghostEl);
        }

        if (isDragging && ghostEl) {
          ghostEl.style.left = e.clientX + 'px';
          ghostEl.style.top = e.clientY + 'px';

          const rect = dom.parkStage.getBoundingClientRect();
          const overStage =
            e.clientX >= rect.left &&
            e.clientX <= rect.right &&
            e.clientY >= rect.top &&
            e.clientY <= rect.bottom;
          dom.parkStage.classList.toggle('drop-active', overStage);
        }
      });

      card.addEventListener('pointerup', (e) => {
        if (activePointerId !== e.pointerId) return;
        try {
          card.releasePointerCapture(e.pointerId);
        } catch (err) {
          /* 安全忽略 */
        }

        if (!isDragging) {
          /* 單純點選就直接套上雪人 */
          equipPart(category, partId);
        } else {
          const rect = dom.parkStage.getBoundingClientRect();
          const overStage =
            e.clientX >= rect.left &&
            e.clientX <= rect.right &&
            e.clientY >= rect.top &&
            e.clientY <= rect.bottom;
          if (overStage) {
            equipPart(category, partId);
          }
        }
        cleanupDrag();
      });

      card.addEventListener('pointercancel', () => {
        cleanupDrag();
      });
    }

    /* =====================================================================
       十一、核心遊戲動作（裝配、切換模式、檢查過關、隨機、重置）
       ===================================================================== */
    function equipPart(category, partId) {
      state.snowman[category] = partId;
      state.wrongCategories.delete(category);
      stopCelebrationDance();
      SoundEngine.playEquip(category);
      renderSnowman(category);
      renderCategoryTabs();
      renderPartsGrid();

      if (state.mode === 'mission') {
        renderMissionCard();
      }
    }

    function resetSnowman(silent = false) {
      state.snowman = {
        hat: 'none',
        scarf: 'none',
        nose: 'none',
        eyes: 'none',
        arms: 'none',
        buttons: 'none'
      };
      state.wrongCategories.clear();
      stopCelebrationDance();
      renderSnowman();
      renderCategoryTabs();
      renderPartsGrid();
      if (state.mode === 'mission') {
        renderMissionCard();
      }
      if (!silent) {
        SoundEngine.playClick();
        setDingDing('happy', TEXT.dingdingReset);
      }
    }

    function randomizeSnowman() {
      CATEGORIES.forEach((cat) => {
        const pool = PARTS_DATA[cat.id].filter((p) => p.id !== 'none');
        const pick = pool[Math.floor(Math.random() * pool.length)];
        state.snowman[cat.id] = pick.id;
      });
      SoundEngine.playWin();
      renderSnowman('hat');
      renderCategoryTabs();
      renderPartsGrid();
      setDingDing('cheer', TEXT.dingdingRandom, 'mood-cheer');
      triggerSnowmanWiggle();
    }

    function selectMission(idx) {
      state.missionIndex = idx;
      state.wrongCategories.clear();
      resetSnowman(true);
      renderMissionTabs();
      renderMissionCard();
      setDingDing('happy', TEXT.dingdingWelcome);
    }

    function switchMode(newMode) {
      if (state.mode === newMode) return;
      SoundEngine.playClick();
      state.mode = newMode;
      state.wrongCategories.clear();
      stopCelebrationDance();

      const isMission = newMode === 'mission';
      dom.btnModeMission.classList.toggle('active', isMission);
      dom.btnModeMission.setAttribute('aria-selected', isMission ? 'true' : 'false');
      dom.btnModeFree.classList.toggle('active', !isMission);
      dom.btnModeFree.setAttribute('aria-selected', !isMission ? 'true' : 'false');

      dom.leftCardTitle.textContent = isMission ? TEXT.leftMissionTitle : TEXT.leftFreeTitle;
      dom.missionPanelContent.classList.toggle('hidden-el', !isMission);
      dom.freePanelContent.classList.toggle('hidden-el', isMission);
      dom.actionBarMission.classList.toggle('hidden-el', !isMission);
      dom.actionBarFree.classList.toggle('hidden-el', isMission);

      if (isMission) {
        renderMissionTabs();
        renderMissionCard();
        setDingDing('happy', TEXT.dingdingWelcome);
      } else {
        /* 進自由模式若雪人還沒任何配件，先幫它配好基本可愛樣子讓畫面更有驚喜 */
        const allEmpty = Object.values(state.snowman).every((v) => v === 'none');
        if (allEmpty) {
          state.snowman = {
            hat: 'santa-red',
            scarf: 'green',
            nose: 'carrot',
            eyes: 'coal',
            arms: 'branch',
            buttons: '2'
          };
          renderSnowman();
        }
        setDingDing('happy', TEXT.dingdingFree);
      }
      renderCategoryTabs();
      renderPartsGrid();
    }

    function checkMission() {
      const mission = MISSIONS[state.missionIndex];
      const results = {};
      const wrongList = [];

      mission.items.forEach((item) => {
        const current = state.snowman[item.part];
        const ok = current === item.value;
        results[item.part] = ok;
        if (!ok) {
          wrongList.push({
            part: item.part,
            missing: !current || current === 'none'
          });
        }
      });

      renderMissionCard(results);

      if (wrongList.length === 0) {
        /* 全部正確！過關慶祝 */
        state.wrongCategories.clear();
        renderCategoryTabs();

        const beforeCount = state.clearedMissions.size;
        state.clearedMissions.add(mission.id);
        const afterCount = state.clearedMissions.size;
        safeStorageSet(STORAGE_KEYS.CLEARED, JSON.stringify(Array.from(state.clearedMissions)));

        let justUnlocked = false;
        if (afterCount >= 3) {
          if (safeStorageGet(STORAGE_KEYS.DONE) !== '1' || (beforeCount < 3 && afterCount >= 3)) {
            justUnlocked = true;
          }
          safeStorageSet(STORAGE_KEYS.DONE, '1');
        }

        renderMissionTabs();
        renderMissionCard(results);
        updateProgressBadge();
        startCelebrationDance();
        spawnConfetti();
        SoundEngine.playWin();
        setDingDing('cheer', TEXT.winMsgNormal, 'mood-cheer');

        /* 稍微延遲開啟過關彈窗，讓學生先欣賞雪人跳舞與彩帶 */
        window.setTimeout(() => {
          openWinModal(justUnlocked);
        }, 700);
      } else {
        /* 有部位不符：由叮叮溫柔提示第一個不對的部位，並高亮該分類頁籤 */
        SoundEngine.playWrong();
        state.wrongCategories = new Set(wrongList.map((w) => w.part));
        const firstWrong = wrongList[0];
        state.activeCategory = firstWrong.part;
        renderCategoryTabs();
        renderPartsGrid();

        const hintMsg = firstWrong.missing
          ? TEXT.missingHints[firstWrong.part]
          : TEXT.wrongHints[firstWrong.part];
        setDingDing('think', hintMsg, 'mood-hint');
        triggerSnowmanWiggle();
      }
    }

    function startCelebrationDance() {
      dom.snowmanGroup.classList.add('dancing');
      setSnowballMood('cheer');
    }

    function stopCelebrationDance() {
      dom.snowmanGroup.classList.remove('dancing');
      setSnowballMood('happy');
    }

    function triggerSnowmanWiggle() {
      if (prefersReducedMotion()) return;
      dom.snowmanGroup.classList.remove('wiggle');
      void dom.snowmanGroup.getBoundingClientRect();
      dom.snowmanGroup.classList.add('wiggle');
    }

    /* =====================================================================
       十二、彈出視窗控制（關閉時必設 visibility: hidden + inert）
       ===================================================================== */
    function showModal(el) {
      el.classList.remove('is-hidden');
      el.removeAttribute('inert');
      el.setAttribute('aria-hidden', 'false');
    }

    function hideModal(el) {
      el.classList.add('is-hidden');
      el.setAttribute('inert', '');
      el.setAttribute('aria-hidden', 'true');
    }

    function openWinModal(justUnlocked) {
      const allCleared = state.clearedMissions.size >= MISSIONS.length;
      dom.winModalTitle.textContent = allCleared ? TEXT.winAllTitle : TEXT.winTitle;
      dom.winModalMsg.textContent = allCleared ? TEXT.winMsgAll : TEXT.winMsgNormal;

      dom.winModalChars.innerHTML =
        svgDingDing(102, 'cheer') +
        svgGift('red', 'square', 78) +
        svgSnowball(106, 'cheer');

      if (justUnlocked) {
        dom.winUnlockBanner.textContent = TEXT.unlockBanner;
        dom.winUnlockBanner.classList.remove('hidden-el');
      } else {
        dom.winUnlockBanner.classList.add('hidden-el');
      }

      if (allCleared) {
        dom.btnNextMissionLabel.textContent = TEXT.btnGoFree;
      } else {
        dom.btnNextMissionLabel.textContent = TEXT.btnNextMission;
      }

      showModal(dom.winModal);
    }

    /* =====================================================================
       十三、自由模式拍照與下載 PNG
       ===================================================================== */
    function buildSnapshotSvgString() {
      const parkInner = document.getElementById('park-svg').innerHTML;
      const ding = svgDingDing(96, 'cheer')
        .replace(/<svg[^>]*>/, '<g transform="translate(24, 378) scale(0.92)">')
        .replace(/<\/svg>/, '</g>');
      const snow = svgSnowball(104, 'cheer')
        .replace(/<svg[^>]*>/, '<g transform="translate(502, 372) scale(0.96)">')
        .replace(/<\/svg>/, '</g>');

      return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="960" height="840">
  <rect x="0" y="0" width="640" height="560" fill="#fff8e6"/>
  <g>${parkInner}</g>
  ${ding}
  ${snow}
  <!-- 拍立得風格聖誕底部相框 -->
  <rect x="0" y="514" width="640" height="46" fill="#fff8e6"/>
  <rect x="6" y="6" width="628" height="548" fill="none" stroke="#c0392b" stroke-width="10" rx="14"/>
  <rect x="14" y="14" width="612" height="532" fill="none" stroke="#e6a817" stroke-width="4" rx="10"/>
  <text x="320" y="544" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="22" fill="#8e1c14">聖誕工坊大救援・我的聖誕雪人・聖誕快樂</text>
</svg>`;
    }

    function takePhoto() {
      SoundEngine.playShutter();
      if (!prefersReducedMotion()) {
        dom.cameraFlash.classList.remove('flashing');
        void dom.cameraFlash.getBoundingClientRect();
        dom.cameraFlash.classList.add('flashing');
      }

      const svgStr = buildSnapshotSvgString();
      const svgDataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
      const img = new Image();

      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 960;
          canvas.height = 840;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff8e6';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          state.photoDataUrl = canvas.toDataURL('image/png');
        } catch (err) {
          state.photoDataUrl = svgDataUrl;
        }
        dom.photoPreviewImg.src = state.photoDataUrl;
        showModal(dom.photoModal);
      };

      img.onerror = () => {
        state.photoDataUrl = svgDataUrl;
        dom.photoPreviewImg.src = svgDataUrl;
        showModal(dom.photoModal);
      };

      img.src = svgDataUrl;
    }

    function downloadPhoto() {
      if (!state.photoDataUrl) return;
      SoundEngine.playClick();
      const link = document.createElement('a');
      link.href = state.photoDataUrl;
      link.download = state.photoDataUrl.startsWith('data:image/png')
        ? TEXT.photoFileName
        : '聖誕工坊-我的雪人.svg';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    /* =====================================================================
       十四、飄雪與過關彩帶粒子
       ===================================================================== */
    function initSnowfall() {
      if (prefersReducedMotion()) return;
      dom.snowLayer.innerHTML = '';
      const count = 24;
      for (let i = 0; i < count; i++) {
        const flake = document.createElement('span');
        flake.className = 'snowflake';
        flake.textContent = '❄';
        flake.style.left = (Math.random() * 100).toFixed(2) + '%';
        flake.style.fontSize = (12 + Math.random() * 14).toFixed(0) + 'px';
        flake.style.animationDuration = (7 + Math.random() * 8).toFixed(2) + 's';
        flake.style.animationDelay = (-Math.random() * 12).toFixed(2) + 's';
        dom.snowLayer.appendChild(flake);
      }
    }

    function spawnConfetti() {
      if (prefersReducedMotion()) return;
      dom.confettiLayer.innerHTML = '';
      const colors = ['#c0392b', '#1e7a4c', '#e6a817', '#ffd54f', '#5dade2', '#fff8e6'];
      for (let i = 0; i < 36; i++) {
        const p = document.createElement('span');
        p.className = 'confetti-piece';
        p.style.left = (8 + Math.random() * 84).toFixed(1) + '%';
        p.style.background = colors[i % colors.length];
        p.style.setProperty('--dx', ((Math.random() - 0.5) * 140).toFixed(0) + 'px');
        p.style.animationDelay = (Math.random() * 0.45).toFixed(2) + 's';
        dom.confettiLayer.appendChild(p);
      }
      window.setTimeout(() => {
        dom.confettiLayer.innerHTML = '';
      }, 3000);
    }

    /* =====================================================================
       十五、事件綁定與啟動
       ===================================================================== */
    function bindEvents() {
      dom.btnModeMission.addEventListener('click', () => switchMode('mission'));
      dom.btnModeFree.addEventListener('click', () => switchMode('free'));

      dom.btnSoundToggle.addEventListener('click', () => {
        SoundEngine.enabled = !SoundEngine.enabled;
        safeStorageSet(STORAGE_KEYS.SOUND, SoundEngine.enabled ? '1' : '0');
        updateSoundButton();
        if (SoundEngine.enabled) SoundEngine.playClick();
      });

      dom.btnCheck.addEventListener('click', checkMission);
      dom.btnResetMission.addEventListener('click', () => resetSnowman(false));
      dom.btnResetFree.addEventListener('click', () => resetSnowman(false));
      dom.btnRandom.addEventListener('click', randomizeSnowman);
      dom.btnPhoto.addEventListener('click', takePhoto);

      /* 點擊叮叮、雪球、雪人的趣味互動 */
      let dingTapIdx = 0;
      const onDingTap = () => {
        SoundEngine.playGiggle();
        const line = TEXT.dingdingTap[dingTapIdx % TEXT.dingdingTap.length];
        dingTapIdx++;
        setDingDing('happy', line);
      };
      dom.dingdingAvatar.addEventListener('click', onDingTap);
      dom.dingdingAvatar.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          onDingTap();
        }
      });

      let snowTapIdx = 0;
      const onSnowballTap = () => {
        SoundEngine.playGiggle();
        const line = TEXT.snowballTap[snowTapIdx % TEXT.snowballTap.length];
        snowTapIdx++;
        setDingDing('happy', line);
        setSnowballMood('cheer');
        window.setTimeout(() => {
          if (!dom.snowmanGroup.classList.contains('dancing')) {
            setSnowballMood('happy');
          }
        }, 900);
      };
      dom.snowballStage.addEventListener('click', onSnowballTap);
      dom.snowballStage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          onSnowballTap();
        }
      });

      dom.snowmanGroup.addEventListener('click', () => {
        SoundEngine.playGiggle();
        triggerSnowmanWiggle();
        setDingDing('happy', TEXT.snowmanTap);
      });

      /* 過關彈窗按鈕 */
      dom.btnNextMission.addEventListener('click', () => {
        SoundEngine.playClick();
        hideModal(dom.winModal);
        if (state.clearedMissions.size >= MISSIONS.length) {
          switchMode('free');
          return;
        }
        /* 找下一張尚未完成的任務卡 */
        let nextIdx = (state.missionIndex + 1) % MISSIONS.length;
        for (let step = 1; step <= MISSIONS.length; step++) {
          const candidate = (state.missionIndex + step) % MISSIONS.length;
          if (!state.clearedMissions.has(MISSIONS[candidate].id)) {
            nextIdx = candidate;
            break;
          }
        }
        selectMission(nextIdx);
      });

      dom.btnCloseWin.addEventListener('click', () => {
        SoundEngine.playClick();
        hideModal(dom.winModal);
      });

      /* 拍照預覽彈窗按鈕 */
      dom.btnDownloadPhoto.addEventListener('click', downloadPhoto);
      dom.btnClosePhoto.addEventListener('click', () => {
        SoundEngine.playClick();
        hideModal(dom.photoModal);
      });

      /* Esc 鍵關閉彈窗 */
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (!dom.winModal.classList.contains('is-hidden')) hideModal(dom.winModal);
          if (!dom.photoModal.classList.contains('is-hidden')) hideModal(dom.photoModal);
        }
      });
    }

    function boot() {
      initStaticTextAndDeco();
      initSnowfall();
      updateProgressBadge();
      renderMissionTabs();
      renderMissionCard();
      renderCategoryTabs();
      renderPartsGrid();
      renderSnowman();
      setDingDing('happy', TEXT.dingdingWelcome);
      bindEvents();
    }

    boot();
  </script>
<script defer src="../../assets/js/beacon.js"></script>
</body>
