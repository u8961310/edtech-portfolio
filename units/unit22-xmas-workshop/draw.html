<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聖誕卡片畫畫屋｜聖誕工坊大救援</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       字型與全域色票變數設定
       ============================================================ */
    @font-face {
      font-family: 'Bpmf Huninn';
      src: url('fonts/bpmf-huninn-xmas.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      --xmas-red: #c0392b;
      --xmas-red-dark: #8e1c14;
      --xmas-green: #1e7a4c;
      --xmas-green-dark: #135333;
      --xmas-gold: #e6a817;
      --xmas-gold-light: #ffe074;
      --xmas-navy: #142850;
      --xmas-navy-deep: #0b1834;
      --xmas-cream: #fff8e6;
      --xmas-cream-warm: #faeccf;
      --xmas-ink: #3b2316;
      --font-bpmf: 'Bpmf Huninn', 'Noto Sans TC', sans-serif;
      --font-ui: 'Noto Sans TC', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-synthesis: none;
      background: radial-gradient(circle at 50% 0%, #203d75 0%, var(--xmas-navy) 52%, var(--xmas-navy-deep) 100%);
      color: var(--xmas-ink);
      font-family: var(--font-bpmf);
      -webkit-tap-highlight-color: transparent;
    }

    /* 角色眨眼動畫 */
    .char-svg {
      display: block;
    }
    .eye-blink {
      transform-origin: center;
      transform-box: fill-box;
      animation: charBlink 4.6s infinite;
    }
    .eye-blink-delay {
      transform-origin: center;
      transform-box: fill-box;
      animation: charBlink 4.6s 1.8s infinite;
    }
    @keyframes charBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%, 97% { transform: scaleY(0.12); }
    }

    /* ============================================================
       背景裝飾：飄雪、星空與頂部聖誕燈串
       ============================================================ */
    .snow-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .snowflake {
      position: absolute;
      top: -24px;
      color: rgba(255, 248, 230, 0.85);
      user-select: none;
      animation: snowFall linear infinite;
    }

    @keyframes snowFall {
      0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.9; }
      90% { opacity: 0.85; }
      100% { transform: translateY(105vh) translateX(32px) rotate(360deg); opacity: 0; }
    }

    .lights-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 26px;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .lights-bar svg {
      width: 100%;
      height: 26px;
      display: block;
    }

    .bulb-a { animation: bulbGlow 1.8s ease-in-out infinite alternate; }
    .bulb-b { animation: bulbGlow 1.8s 0.6s ease-in-out infinite alternate; }
    .bulb-c { animation: bulbGlow 1.8s 1.2s ease-in-out infinite alternate; }

    @keyframes bulbGlow {
      0% { opacity: 0.55; }
      100% { opacity: 1; }
    }

    /* ============================================================
       主容器與頂部導覽列
       ============================================================ */
    .page-shell {
      position: relative;
      z-index: 2;
      max-width: 1360px;
      margin: 0 auto;
      padding: 14px 14px 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 54px;
      padding-top: 6px;
    }

    /* 左上角預留 120×44px 空白給整合首頁按鈕 */
    .home-slot-spacer {
      width: 120px;
      height: 44px;
      flex-shrink: 0;
      pointer-events: none;
    }

    .title-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex: 1;
      flex-wrap: wrap;
    }

    .page-title {
      margin: 0;
      font-family: var(--font-ui);
      font-weight: 900;
      font-size: clamp(24px, 2.5vw, 34px);
      letter-spacing: 2px;
      line-height: 1.15;
      color: var(--xmas-cream);
      text-shadow:
        0 2px 0 #c0392b,
        0 4px 0 #a02a1f,
        0 6px 0 #7a1c13,
        0 8px 12px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }

    .status-strip {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-chip {
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 700;
      color: var(--xmas-cream);
      background: rgba(14, 34, 70, 0.85);
      border: 2px solid var(--xmas-gold);
      border-radius: 999px;
      padding: 5px 13px;
      white-space: nowrap;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
    }

    .status-chip.done {
      background: var(--xmas-green);
      border-color: var(--xmas-gold-light);
      color: #fffef5;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 右上角按鈕 */
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 48px;
      padding: 0 14px;
      border-radius: 14px;
      border: 3px solid var(--xmas-gold);
      background: linear-gradient(180deg, #d84738 0%, var(--xmas-red) 55%, var(--xmas-red-dark) 100%);
      color: var(--xmas-cream);
      text-decoration: none;
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 4px 0 #64110b, 0 6px 12px rgba(0, 0, 0, 0.3);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .nav-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #64110b;
    }

    .sound-btn {
      width: 52px;
      padding: 0;
      font-family: var(--font-ui);
      font-size: 24px;
      background: linear-gradient(180deg, #28945d 0%, var(--xmas-green) 60%, var(--xmas-green-dark) 100%);
      box-shadow: 0 4px 0 #0b3821, 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .sound-btn.muted {
      background: linear-gradient(180deg, #64748b 0%, #475569 100%);
      border-color: #cbd5e1;
      box-shadow: 0 4px 0 #1e293b;
    }

    /* ============================================================
       聖誕卡片風格面板（雙層邊框＋角落冬青葉）
       ============================================================ */
    .xmas-card-panel {
      position: relative;
      background: var(--xmas-cream);
      border: 4px solid var(--xmas-red);
      border-radius: 20px;
      box-shadow:
        inset 0 0 0 3px var(--xmas-gold),
        0 8px 20px rgba(0, 0, 0, 0.35);
      padding: 12px;
    }

    .xmas-card-panel::after {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1.5px dashed rgba(230, 168, 23, 0.65);
      border-radius: 13px;
      pointer-events: none;
    }

    .holly-badge {
      position: absolute;
      pointer-events: none;
      z-index: 4;
      width: 44px;
      height: 44px;
    }

    .holly-badge svg {
      width: 100%;
      height: 100%;
    }

    .holly-tl { top: -14px; left: -14px; }
    .holly-tr { top: -14px; right: -14px; transform: scaleX(-1); }

    .panel-label {
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 900;
      color: var(--xmas-red-dark);
      background: #fdecc8;
      border: 2px solid var(--xmas-gold);
      border-radius: 10px;
      padding: 3px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      position: relative;
      z-index: 2;
    }

    /* ============================================================
       三欄橫向主工作區（1280×800 最佳化）
       ============================================================ */
    .workspace {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr) 268px;
      gap: 12px;
      align-items: start;
      flex: 1;
    }

    /* 左欄：畫畫工具＋粗細／大小＋角色夥伴 */
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tool-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      position: relative;
      z-index: 2;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      padding: 6px 12px;
      border-radius: 14px;
      border: 3px solid #d7b278;
      background: linear-gradient(180deg, #ffffff 0%, #fff4dc 100%);
      color: var(--xmas-ink);
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.1;
      cursor: pointer;
      box-shadow: 0 4px 0 #c59858;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      text-align: left;
    }

    .tool-btn:hover {
      background: linear-gradient(180deg, #fffdf7 0%, #ffeec6 100%);
      transform: translateY(-1px);
    }

    .tool-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #c59858;
    }

    .tool-btn.active {
      border-color: var(--xmas-gold);
      background: linear-gradient(180deg, #27945b 0%, var(--xmas-green) 100%);
      color: var(--xmas-cream);
      box-shadow: 0 4px 0 var(--xmas-green-dark), 0 0 0 2px #fff8e6 inset;
    }

    .tool-icon {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-ui);
      font-size: 24px;
    }

    .tool-icon svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    /* 粗細／大小選擇 */
    .size-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      position: relative;
      z-index: 2;
    }

    .size-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: 58px;
      padding: 4px 2px;
      border-radius: 12px;
      border: 3px solid #d7b278;
      background: #fffdf6;
      color: var(--xmas-ink);
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 3px 0 #c59858;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .size-btn:hover {
      background: #fff1cc;
    }

    .size-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #c59858;
    }

    .size-btn.active {
      border-color: var(--xmas-red);
      background: #ffe0d9;
      color: var(--xmas-red-dark);
      box-shadow: 0 3px 0 var(--xmas-red-dark);
    }

    .size-dot {
      border-radius: 50%;
      background: var(--xmas-ink);
      display: inline-block;
    }

    .size-btn.active .size-dot {
      background: var(--xmas-red);
    }

    /* 左下角色小幫手互動區 */
    .mascot-box {
      position: relative;
      z-index: 2;
      margin-top: 2px;
      padding: 8px;
      border-radius: 14px;
      border: 2px solid var(--xmas-gold);
      background:
        repeating-linear-gradient(
          45deg,
          rgba(30, 122, 76, 0.08) 0px,
          rgba(30, 122, 76, 0.08) 12px,
          rgba(192, 57, 43, 0.08) 12px,
          rgba(192, 57, 43, 0.08) 24px
        ),
        #fffaf0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .mascot-chars {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: transform 0.18s ease;
    }

    .mascot-chars:hover {
      transform: scale(1.04);
    }

    .mascot-chars.bounce {
      animation: charHop 0.45s ease;
    }

    @keyframes charHop {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px) scale(1.05); }
      70% { transform: translateY(2px); }
    }

    .speech-bubble {
      width: 100%;
      background: #ffffff;
      border: 2px solid var(--xmas-red);
      border-radius: 12px;
      padding: 6px 8px;
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.25;
      color: var(--xmas-ink);
      text-align: center;
    }

    /* ============================================================
       中央舞台：卡片底圖切換＋紅綠格紋畫布框＋動作列
       ============================================================ */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    /* 卡片底圖列 */
    .template-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      background: rgba(11, 24, 52, 0.72);
      border: 2px solid rgba(230, 168, 23, 0.75);
      border-radius: 16px;
      padding: 7px 10px;
    }

    .template-label {
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 700;
      color: var(--xmas-gold-light);
      margin-right: 2px;
      white-space: nowrap;
    }

    .tpl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 56px;
      padding: 6px 12px;
      border-radius: 13px;
      border: 3px solid var(--xmas-gold);
      background: linear-gradient(180deg, #fffdf6 0%, #f8e7c2 100%);
      color: var(--xmas-ink);
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 4px 0 #8d6108;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      white-space: nowrap;
    }

    .tpl-btn:hover {
      transform: translateY(-1px);
      background: #ffffff;
    }

    .tpl-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #8d6108;
    }

    .tpl-btn.active {
      background: linear-gradient(180deg, #d84738 0%, var(--xmas-red) 100%);
      color: var(--xmas-cream);
      border-color: var(--xmas-gold-light);
      box-shadow: 0 4px 0 #6e130c;
    }

    /* 畫布外框（紅綠聖誕格紋布＋金色相框） */
    .canvas-mat {
      position: relative;
      width: 100%;
      max-width: 900px;
      padding: 12px;
      border-radius: 22px;
      border: 4px solid var(--xmas-gold);
      background-color: #165b38;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(192, 57, 43, 0.42) 0px,
          rgba(192, 57, 43, 0.42) 18px,
          transparent 18px,
          transparent 44px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(192, 57, 43, 0.42) 0px,
          rgba(192, 57, 43, 0.42) 18px,
          transparent 18px,
          transparent 44px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(230, 168, 23, 0.35) 0px,
          rgba(230, 168, 23, 0.35) 2px,
          transparent 2px,
          transparent 44px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(230, 168, 23, 0.35) 0px,
          rgba(230, 168, 23, 0.35) 2px,
          transparent 2px,
          transparent 44px
        );
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.48), inset 0 0 0 3px rgba(255, 248, 230, 0.4);
    }

    .canvas-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 900 / 560;
      border-radius: 12px;
      overflow: hidden;
      background: var(--xmas-cream);
      border: 3px solid var(--xmas-cream);
      box-shadow: inset 0 0 0 2px rgba(142, 28, 20, 0.2);
    }

    .canvas-stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #drawCanvas {
      touch-action: none;
      user-select: none;
      cursor: crosshair;
      z-index: 1;
    }

    #previewCanvas {
      pointer-events: none;
      z-index: 2;
    }

    /* 下方動作按鈕列（拐杖糖斜紋＋禮物盒主按鈕） */
    .action-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 60px;
      padding: 8px 18px;
      border-radius: 16px;
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
      white-space: nowrap;
    }

    .action-btn:hover:not(:disabled) {
      filter: brightness(1.06);
      transform: translateY(-2px);
    }

    .action-btn:active:not(:disabled) {
      transform: translateY(3px);
    }

    .action-btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
      filter: grayscale(0.4);
    }

    /* 上一步按鈕（松樹綠） */
    .btn-undo {
      border: 3px solid var(--xmas-gold);
      background: linear-gradient(180deg, #27945b 0%, var(--xmas-green) 100%);
      color: var(--xmas-cream);
      box-shadow: 0 5px 0 var(--xmas-green-dark), 0 8px 14px rgba(0, 0, 0, 0.3);
    }
    .btn-undo:active:not(:disabled) {
      box-shadow: 0 1px 0 var(--xmas-green-dark);
    }

    .undo-count {
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 900;
      background: rgba(0, 0, 0, 0.26);
      padding: 2px 8px;
      border-radius: 999px;
      color: var(--xmas-gold-light);
    }

    /* 全部清除按鈕（拐杖糖紅白斜紋外框） */
    .btn-clear {
      border: 4px solid var(--xmas-red-dark);
      background:
        repeating-linear-gradient(
          -45deg,
          #c0392b 0px,
          #c0392b 10px,
          #fff8e6 10px,
          #fff8e6 20px
        );
      padding: 5px;
      box-shadow: 0 5px 0 #5e100a, 0 8px 14px rgba(0, 0, 0, 0.3);
    }

    .btn-clear-inner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--xmas-cream);
      color: var(--xmas-red-dark);
      border-radius: 10px;
      padding: 8px 14px;
      min-height: 46px;
    }

    .btn-clear:active:not(:disabled) {
      box-shadow: 0 1px 0 #5e100a;
    }

    /* 存成圖片按鈕（聖誕禮物盒造型） */
    .btn-save {
      position: relative;
      border: 3px solid var(--xmas-gold-light);
      background:
        linear-gradient(90deg, transparent 43%, rgba(255, 224, 116, 0.32) 43%, rgba(255, 224, 116, 0.32) 57%, transparent 57%),
        linear-gradient(180deg, #e04736 0%, var(--xmas-red) 55%, var(--xmas-red-dark) 100%);
      color: var(--xmas-cream);
      padding: 8px 24px;
      box-shadow: 0 5px 0 #66100a, 0 8px 18px rgba(0, 0, 0, 0.35);
    }

    .btn-save:active:not(:disabled) {
      box-shadow: 0 1px 0 #66100a;
    }

    /* ============================================================
       右欄：動態選項面板（色盤／彩虹筆／貼紙盤／文字輸入）
       ============================================================ */
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-section {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-section.hidden {
      display: none;
    }

    /* 12 色聖誕色盤 */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .color-swatch {
      width: 100%;
      aspect-ratio: 1 / 1;
      min-height: 48px;
      border-radius: 50%;
      border: 3px solid #fffdf8;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25), 0 0 0 2px #b68c4c;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      position: relative;
    }

    .color-swatch:hover {
      transform: scale(1.08);
    }

    .color-swatch:active {
      transform: scale(0.95);
    }

    .color-swatch.active {
      transform: scale(1.1);
      box-shadow: 0 0 0 3px var(--xmas-gold), 0 0 0 6px var(--xmas-red);
      z-index: 2;
    }

    /* 彩虹筆大按鈕 */
    .rainbow-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 58px;
      padding: 6px 10px;
      border-radius: 15px;
      border: 3px solid #ffffff;
      background: linear-gradient(90deg, #e74c3c 0%, #f39c12 22%, #f1c40f 40%, #2ecc71 60%, #3498db 80%, #9b59b6 100%);
      color: #ffffff;
      font-family: var(--font-bpmf);
      font-size: 24px;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
      cursor: pointer;
      box-shadow: 0 4px 0 #7b2d6f, 0 0 0 2px var(--xmas-gold);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .rainbow-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .rainbow-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #7b2d6f;
    }

    .rainbow-btn.active {
      box-shadow: 0 0 0 4px var(--xmas-red), 0 5px 14px rgba(192, 57, 43, 0.45);
      transform: scale(1.02);
    }

    /* 貼紙選擇網格（9 種） */
    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .sticker-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-height: 76px;
      padding: 5px 3px;
      border-radius: 13px;
      border: 3px solid #d7b278;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 3px 0 #c59858;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .sticker-btn:hover {
      background: #fff6db;
      transform: translateY(-1px);
    }

    .sticker-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #c59858;
    }

    .sticker-btn.active {
      border-color: var(--xmas-red);
      background: #ffe9d6;
      box-shadow: 0 3px 0 var(--xmas-red-dark), inset 0 0 0 2px var(--xmas-gold);
    }

    .sticker-thumb {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sticker-thumb svg {
      max-width: 100%;
      max-height: 100%;
      width: 44px;
      height: 44px;
    }

    .sticker-name {
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 700;
      color: var(--xmas-ink);
      line-height: 1.1;
    }

    /* 文字工具輸入區 */
    .text-input-box {
      width: 100%;
      min-height: 56px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 3px solid var(--xmas-green);
      background: #ffffff;
      color: var(--xmas-ink);
      font-family: var(--font-bpmf);
      font-size: 24px;
      outline: none;
    }

    .text-input-box:focus {
      border-color: var(--xmas-red);
      box-shadow: 0 0 0 3px rgba(230, 168, 23, 0.35);
    }

    .phrase-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .phrase-btn {
      min-height: 56px;
      padding: 6px 10px;
      border-radius: 12px;
      border: 2px solid var(--xmas-gold);
      background: #fffdf5;
      color: var(--xmas-ink);
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.1;
      cursor: pointer;
      box-shadow: 0 3px 0 #c59858;
      transition: transform 0.1s ease, background 0.1s ease;
    }

    .phrase-btn:hover {
      background: #ffefc4;
    }

    .phrase-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #c59858;
    }

    .tool-tip-card {
      background: #fff4d6;
      border: 2px dashed var(--xmas-gold);
      border-radius: 12px;
      padding: 10px;
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.3;
      color: var(--xmas-ink);
      text-align: center;
    }

    /* ============================================================
       浮動小提示（存圖／達成徽章慶祝）
       ============================================================ */
    .toast-banner {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      z-index: 40;
      background: linear-gradient(180deg, #27945b 0%, var(--xmas-green) 100%);
      color: var(--xmas-cream);
      border: 3px solid var(--xmas-gold-light);
      border-radius: 18px;
      padding: 10px 22px;
      font-family: var(--font-bpmf);
      font-size: 26px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
      text-align: center;
      max-width: 92vw;
    }

    .toast-banner.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* ============================================================
       彈出視窗（確認清除／換底圖／存圖完成預覽）
       關閉時加 visibility: hidden 與 inert
       ============================================================ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(11, 24, 52, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      position: relative;
      width: min(480px, 94vw);
      background: var(--xmas-cream);
      border: 5px solid var(--xmas-red);
      border-radius: 24px;
      box-shadow:
        inset 0 0 0 4px var(--xmas-gold),
        0 18px 40px rgba(0, 0, 0, 0.5);
      padding: 24px 22px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .modal-title {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 26px;
      font-weight: 900;
      color: var(--xmas-red-dark);
    }

    .modal-msg {
      margin: 0;
      font-family: var(--font-bpmf);
      font-size: 26px;
      line-height: 1.35;
      color: var(--xmas-ink);
    }

    .modal-preview-img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 12px;
      border: 3px solid var(--xmas-gold);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
      display: none;
    }

    .modal-preview-img.show {
      display: block;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
    }

    .modal-btn {
      min-height: 58px;
      min-width: 136px;
      padding: 8px 20px;
      border-radius: 15px;
      font-family: var(--font-bpmf);
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .modal-btn:active {
      transform: translateY(3px);
    }

    .modal-btn-cancel {
      border: 3px solid #bfa276;
      background: #ffffff;
      color: var(--xmas-ink);
      box-shadow: 0 4px 0 #a3855a;
    }

    .modal-btn-confirm {
      border: 3px solid var(--xmas-gold-light);
      background: linear-gradient(180deg, #df4837 0%, var(--xmas-red) 100%);
      color: var(--xmas-cream);
      box-shadow: 0 4px 0 var(--xmas-red-dark);
    }

    .modal-btn-ok {
      border: 3px solid var(--xmas-gold-light);
      background: linear-gradient(180deg, #27945b 0%, var(--xmas-green) 100%);
      color: var(--xmas-cream);
      box-shadow: 0 4px 0 var(--xmas-green-dark);
    }

    /* ============================================================
       較窄橫向視窗微調（1024px ~ 1240px）
       ============================================================ */
    @media (max-width: 1220px) and (orientation: landscape) {
      .workspace {
        grid-template-columns: 208px minmax(0, 1fr) 244px;
        gap: 10px;
      }
      .page-shell {
        padding: 10px;
      }
    }

    /* ============================================================
       手機直立重排版面（不可橫向捲動，畫布改直式）
       ============================================================ */
    @media (orientation: portrait) {
      .page-shell {
        padding: 12px 10px 24px;
        gap: 10px;
      }

      .top-bar {
        flex-wrap: wrap;
        row-gap: 8px;
      }

      .home-slot-spacer {
        width: 120px;
        height: 44px;
      }

      .title-group {
        order: 3;
        flex-basis: 100%;
        justify-content: center;
      }

      .top-actions {
        order: 2;
        margin-left: auto;
      }

      .workspace {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* 畫布放最前面方便直立作畫 */
      .center-stage {
        order: 1;
        width: 100%;
      }

      .canvas-mat {
        max-width: 100%;
        padding: 9px;
      }

      .canvas-stage {
        aspect-ratio: 560 / 740;
      }

      .left-panel {
        order: 2;
        width: 100%;
      }

      .right-panel {
        order: 3;
        width: 100%;
      }

      .tool-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .color-grid {
        grid-template-columns: repeat(6, 1fr);
      }

      .sticker-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .tpl-btn {
        flex: 1 1 calc(50% - 8px);
      }

      .action-bar {
        gap: 8px;
      }

      .action-btn {
        flex: 1 1 auto;
        padding: 8px 12px;
      }

      .mascot-box {
        flex-direction: row;
        justify-content: center;
        text-align: left;
      }

      .speech-bubble {
        text-align: left;
      }
    }

    /* ============================================================
       減少動態偏好支援（關閉飄雪與動畫，遊戲仍完全可玩）
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      .snow-layer {
        display: none;
      }
      .eye-blink,
      .eye-blink-delay,
      .bulb-a,
      .bulb-b,
      .bulb-c,
      .mascot-chars.bounce {
        animation: none !important;
      }
      * {
        transition-duration: 0.01ms !important;
      }
    }

    /* =====================================================================
       整合修（2026-11-19）：橫式矮螢幕（1366×768 筆電等）要一個畫面放得下，不用上下捲動。
       原本 830px 高：底圖列擠成兩排 138px、畫布只看寬度等比放大 516px、左側角色區 215px。
       ===================================================================== */
    @media (orientation: landscape) and (max-height: 820px) {
      .template-bar { flex-wrap: nowrap; overflow-x: auto; }
      .template-label { display: none; }
      .tpl-btn { min-height: 48px; padding: 4px 10px; }
      /* 畫布寬度同時受高度限制：可用高度 × 900/560，置中 */
      .canvas-mat {
        max-width: min(900px, calc((100vh - 280px) * 1.607 + 24px));
        margin-inline: auto;
      }
      .mascot-box { display: none; }
    }
  </style>
</head>
<body>
<a href="../../index.html" class="kogao-home-btn" style="position:fixed;top:10px;left:10px;z-index:99999;background:rgba(255,255,255,.92);border:2px solid #f59e0b;color:#b45309;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.15)">🏠 首頁</a>
  <!-- 背景飄雪層 -->
  <div class="snow-layer" id="snowLayer" aria-hidden="true"></div>

  <!-- 頂部聖誕燈串 -->
  <div class="lights-bar" aria-hidden="true">
    <svg viewBox="0 0 1280 28" preserveAspectRatio="none">
      <path d="M0,4 Q80,18 160,4 T320,4 T480,4 T640,4 T800,4 T960,4 T1120,4 T1280,4" fill="none" stroke="#1b4332" stroke-width="3"/>
      <g class="bulb-a">
        <circle cx="80" cy="14" r="6" fill="#ff595e"/>
        <circle cx="320" cy="10" r="6" fill="#ffca3a"/>
        <circle cx="560" cy="14" r="6" fill="#52b788"/>
        <circle cx="800" cy="10" r="6" fill="#ff595e"/>
        <circle cx="1040" cy="14" r="6" fill="#ffca3a"/>
      </g>
      <g class="bulb-b">
        <circle cx="160" cy="10" r="6" fill="#52b788"/>
        <circle cx="400" cy="14" r="6" fill="#ff595e"/>
        <circle cx="640" cy="10" r="6" fill="#fff8e6"/>
        <circle cx="880" cy="14" r="6" fill="#52b788"/>
        <circle cx="1120" cy="10" r="6" fill="#ff595e"/>
      </g>
      <g class="bulb-c">
        <circle cx="240" cy="14" r="6" fill="#fff8e6"/>
        <circle cx="480" cy="10" r="6" fill="#ffca3a"/>
        <circle cx="720" cy="14" r="6" fill="#ffca3a"/>
        <circle cx="960" cy="10" r="6" fill="#fff8e6"/>
        <circle cx="1200" cy="14" r="6" fill="#52b788"/>
      </g>
    </svg>
  </div>

  <!-- 主頁面架構 -->
  <div class="page-shell">
    <!-- 頂部導覽列：左上角保留 120×44px 空白、中間標題與狀態、右上角回地圖與音效 -->
    <header class="top-bar">
      <div class="home-slot-spacer" aria-hidden="true"></div>

      <div class="title-group">
        <h1 class="page-title" id="pageTitle">🎨 聖誕卡片畫畫屋</h1>
        <div class="status-strip">
          <span class="status-chip" id="strokeChip">✏ 0 筆</span>
          <span class="status-chip" id="badgeChip">⭐ 畫 30 筆或存圖拿徽章</span>
        </div>
      </div>

      <div class="top-actions">
        <a class="nav-btn" id="backMapBtn" href="index.html">🗺 回工坊地圖</a>
        <button class="nav-btn sound-btn" id="soundBtn" type="button" aria-label="切換音效開關">🔊</button>
      </div>
    </header>

    <!-- 三欄主工作區 -->
    <main class="workspace">
      <!-- 左側面板：工具選擇、粗細大小、叮叮雪球小幫手 -->
      <aside class="xmas-card-panel left-panel" aria-label="畫畫工具列">
        <div class="holly-badge holly-tl" id="hollyLeft"></div>

        <div>
          <div class="panel-label" id="lblTools">🎨 畫畫工具</div>
          <div class="tool-list" id="toolList"></div>
        </div>

        <div>
          <div class="panel-label" id="lblSizes">✏ 粗細大小</div>
          <div class="size-row" id="sizeRow"></div>
        </div>

        <div class="mascot-box">
          <div class="mascot-chars" id="mascotChars" role="button" tabindex="0" aria-label="點一點叮叮和雪球">
            <div id="dingdingSlot"></div>
            <div id="snowballSlot"></div>
          </div>
          <div class="speech-bubble" id="mascotSpeech">一起畫聖誕卡片吧！</div>
        </div>
      </aside>

      <!-- 中央舞台：卡片底圖、畫布、動作按鈕 -->
      <section class="center-stage" aria-label="卡片畫布區">
        <div class="template-bar" id="templateBar">
          <span class="template-label" id="lblTemplates">卡片底圖：</span>
        </div>

        <div class="canvas-mat">
          <div class="canvas-stage" id="canvasStage">
            <canvas id="drawCanvas" width="900" height="560" aria-label="聖誕卡片畫布"></canvas>
            <canvas id="previewCanvas" width="900" height="560" aria-hidden="true"></canvas>
          </div>
        </div>

        <div class="action-bar">
          <button class="action-btn btn-undo" id="undoBtn" type="button" disabled>
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <path d="M12,7 L4,14 L12,21 V16 C19,16 23,18 26,24 C25,15 20,11 12,11 Z" fill="#fff8e6" stroke="#135333" stroke-width="2" stroke-linejoin="round"/>
              </svg>
            </span>
            <span id="undoText">上一步</span>
            <span class="undo-count" id="undoCount">0</span>
          </button>

          <button class="action-btn btn-clear" id="clearBtn" type="button">
            <span class="btn-clear-inner">
              <span class="tool-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32">
                  <path d="M7,10 H25 L23,27 H9 Z" fill="#f7c8b8" stroke="#8e1c14" stroke-width="2.4" stroke-linejoin="round"/>
                  <path d="M5,10 H27 M12,6 H20 V10 H12 Z" fill="#c0392b" stroke="#8e1c14" stroke-width="2.2" stroke-linejoin="round"/>
                  <path d="M13,14 V23 M19,14 V23" stroke="#8e1c14" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
              </span>
              <span id="clearText">全部清除</span>
            </span>
          </button>

          <button class="action-btn btn-save" id="saveBtn" type="button">
            <span aria-hidden="true">🎁</span>
            <span id="saveText">存成圖片</span>
          </button>
        </div>
      </section>

      <!-- 右側面板：顏色盤＋彩虹筆／貼紙盤／文字輸入 -->
      <aside class="xmas-card-panel right-panel" aria-label="顏色與貼紙設定">
        <div class="holly-badge holly-tr" id="hollyRight"></div>

        <!-- 顏色與彩虹筆區（畫筆、油漆桶、文字時顯示） -->
        <div class="option-section" id="colorSection">
          <div class="panel-label" id="lblColors">🎨 聖誕色盤</div>
          <div class="color-grid" id="colorGrid"></div>
          <button class="rainbow-btn" id="rainbowBtn" type="button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32">
                <path d="M4,24 A12,12 0 0,1 28,24" fill="none" stroke="#ff595e" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M8,24 A8,8 0 0,1 24,24" fill="none" stroke="#ffca3a" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M12,24 A4,4 0 0,1 20,24" fill="none" stroke="#52b788" stroke-width="3.5" stroke-linecap="round"/>
              </svg>
            </span>
            <span id="rainbowText">彩虹筆</span>
          </button>
        </div>

        <!-- 貼紙區（選貼紙時顯示） -->
        <div class="option-section hidden" id="stickerSection">
          <div class="panel-label" id="lblStickers">⭐ 點一下蓋貼紙</div>
          <div class="sticker-grid" id="stickerGrid"></div>
        </div>

        <!-- 文字區（選文字時顯示） -->
        <div class="option-section hidden" id="textSection">
          <div class="panel-label" id="lblTextTool">✉ 寫祝福的話</div>
          <input class="text-input-box" id="stampTextInput" type="text" maxlength="16" value="聖誕快樂" aria-label="輸入要蓋在卡片上的文字">
          <div class="phrase-grid" id="phraseGrid"></div>
        </div>

        <!-- 橡皮擦說明區（選橡皮擦時顯示） -->
        <div class="option-section hidden" id="eraserSection">
          <div class="panel-label" id="lblEraserTool">✏ 橡皮擦說明</div>
          <div class="tool-tip-card" id="eraserTipText">滑動就能擦掉畫錯的地方，不會擦壞底圖喔！</div>
        </div>
      </aside>
    </main>
  </div>

  <!-- 浮動慶祝提示 -->
  <div class="toast-banner" id="toastBanner" role="status" aria-live="polite"></div>

  <!-- 確認與完成彈出視窗 -->
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true" inert>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="holly-badge holly-tl" id="hollyModalL"></div>
      <div class="holly-badge holly-tr" id="hollyModalR"></div>
      <h2 class="modal-title" id="modalTitle">確認一下</h2>
      <p class="modal-msg" id="modalMsg"></p>
      <img class="modal-preview-img" id="modalPreviewImg" alt="剛剛存下來的聖誕卡片">
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script>
    /* ============================================================
       區塊一：面向使用者的文字與設定常數（方便老師修改）
       ============================================================ */
    const STORAGE_KEY_DONE = 'edtech-unit22-draw-done';
    const STORAGE_KEY_MUTED = 'edtech-unit22-muted';
    const DONE_STROKE_THRESHOLD = 30; // 畫超過 30 筆（或第一次存圖）即達成
    const MAX_UNDO_STEPS = 25;        // 上一步最多保留 25 步（大於 20 步）

    const TEXTS = {
      pageTitle: '🎨 聖誕卡片畫畫屋',
      backMap: '🗺 回工坊地圖',
      lblTools: '🎨 畫畫工具',
      lblSizes: '✏ 粗細大小',
      lblTemplates: '卡片底圖：',
      lblColors: '🎨 聖誕色盤',
      lblStickers: '⭐ 點一下蓋貼紙',
      lblTextTool: '✉ 寫祝福的話',
      lblEraserTool: '橡皮擦小幫手',
      eraserTip: '塗一塗就能擦掉，底圖不會被擦壞喔！',
      rainbowLabel: '彩虹筆',
      undoLabel: '上一步',
      clearLabel: '全部清除',
      saveLabel: '存成圖片',

            <path d="M55,44 L22,48 C15,49 15,61 23,61 L40,61 L31,91 C29,99 42,102 46,94 L55,76 L64,94 C68,102 81,99 79,91 L70,61 L87,61 C95,61 95,49 88,48 L55,44 Z" fill="#b97236" stroke="#6b3d14" stroke-width="4" stroke-linejoin="round"/>
            <circle cx="55" cy="30" r="20" fill="#c67d3e" stroke="#6b3d14" stroke-width="4"/>
            <circle cx="48" cy="27" r="3.5" fill="#ffffff"/>
            <circle cx="62" cy="27" r="3.5" fill="#ffffff"/>
            <circle cx="48" cy="27" r="1.8" fill="#2b180e"/>
            <circle cx="62" cy="27" r="1.8" fill="#2b180e"/>
            <path d="M47,36 Q55,43 63,36" fill="none" stroke="#fff8e6" stroke-width="3.2" stroke-linecap="round"/>
            <circle cx="55" cy="56" r="4.5" fill="#c0392b" stroke="#fff8e6" stroke-width="1.5"/>

      {
