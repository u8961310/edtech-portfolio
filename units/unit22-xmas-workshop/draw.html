      },
      {
        id: 'snowball',
        name: '雪球',
        svg: () => svgSnowball(124, 'happy')
      }
    ];

    /* ============================================================
       區塊四：Web Audio API 原創即時音效引擎
       ============================================================ */
    const SoundEngine = (() => {
      let ctx = null;
      let muted = false;
      let noiseBuffer = null;
      let scratchSource = null;
      let scratchGain = null;
      let scratchFilter = null;
      let scratchActive = false;

      // 讀取靜音偏好
      try {
        muted = localStorage.getItem(STORAGE_KEY_MUTED) === '1';
      } catch (e) {
        muted = false;
      }

      function ensureContext() {
        try {
          if (!ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            ctx = new AudioCtx();
          }
          if (ctx.state === 'suspended') {
            ctx.resume().catch(() => {});
          }
          return ctx;
        } catch (e) {
          return null;
        }
      }

      function getNoiseBuffer(audioCtx) {
        if (noiseBuffer) return noiseBuffer;
        const length = audioCtx.sampleRate * 1.5;
        const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        noiseBuffer = buffer;
        return buffer;
      }

      function isMuted() {
        return muted;
      }

      function toggleMute() {
        muted = !muted;
        try {
          localStorage.setItem(STORAGE_KEY_MUTED, muted ? '1' : '0');
        } catch (e) {}
        if (muted) stopScratch();
        else playClick();
        return muted;
      }

      /* 畫畫時輕柔的紙筆沙沙聲 */
      function startScratch() {
        if (muted || scratchActive) return;
        const audioCtx = ensureContext();
        if (!audioCtx) return;
        try {
          const src = audioCtx.createBufferSource();
          src.buffer = getNoiseBuffer(audioCtx);
          src.loop = true;

          const filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 2100;
          filter.Q.value = 2.4;

          const gain = audioCtx.createGain();
          gain.gain.value = 0.0001;

          src.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          src.start();

          scratchSource = src;
          scratchFilter = filter;
          scratchGain = gain;
          scratchActive = true;
        } catch (e) {}
      }

      function updateScratch(speed) {
        if (muted || !scratchActive || !ctx || !scratchGain || !scratchFilter) return;
        try {
          const now = ctx.currentTime;
          const clamped = Math.min(1, Math.max(0, speed / 32));
          const targetVol = 0.004 + clamped * 0.032;
          scratchGain.gain.setTargetAtTime(targetVol, now, 0.025);
          scratchFilter.frequency.setTargetAtTime(1750 + clamped * 1150, now, 0.04);
        } catch (e) {}
      }

      function stopScratch() {
        if (!scratchActive) return;
        scratchActive = false;
        try {
          if (ctx && scratchGain) {
            const now = ctx.currentTime;
            scratchGain.gain.setTargetAtTime(0.0001, now, 0.02);
          }
          const srcRef = scratchSource;
          setTimeout(() => {
            try { if (srcRef) srcRef.stop(); } catch (e) {}
          }, 80);
        } catch (e) {}
        scratchSource = null;
        scratchGain = null;
        scratchFilter = null;
      }

      /* 單音合成小工具 */
      function playTone(freq, duration, type = 'sine', volume = 0.14, delay = 0, freqEnd = null) {
        if (muted) return;
        const audioCtx = ensureContext();
        if (!audioCtx) return;
        try {
          const now = audioCtx.currentTime + delay;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (freqEnd !== null) {
            osc.frequency.exponentialRampToValueAtTime(freqEnd, now + duration);
          }
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(volume, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.03);
        } catch (e) {}
      }

      /* 蓋貼紙清脆叮一聲 */
      function playDing() {
        playTone(1046.5, 0.28, 'sine', 0.16, 0);
        playTone(1567.98, 0.34, 'triangle', 0.11, 0.035);
      }

      /* 油漆桶填色水泡啵一聲 */
      function playFill() {
        playTone(300, 0.18, 'sine', 0.16, 0, 720);
        playTone(540, 0.12, 'triangle', 0.09, 0.06, 860);
      }

      /* 蓋文字輕快兩音 */
      function playStampText() {
        playTone(660, 0.11, 'triangle', 0.13, 0);
        playTone(880, 0.18, 'sine', 0.14, 0.055);
      }

      /* 按鈕輕點聲 */
      function playClick() {
        playTone(520, 0.075, 'triangle', 0.09, 0, 620);
      }

      /* 上一步倒退音 */
      function playUndo() {
        playTone(520, 0.12, 'sine', 0.11, 0, 340);
      }

      /* 清除掃帚柔和音 */
      function playClear() {
        playTone(460, 0.18, 'triangle', 0.12, 0, 220);
        playTone(320, 0.2, 'sine', 0.1, 0.06, 170);
      }

      /* 存圖／獲獎原創四音上行和弦（非任何現成歌曲） */
      function playCelebrate() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((n, idx) => {
          playTone(n, 0.32, 'triangle', 0.13, idx * 0.085);
        });
      }

      return {
        isMuted,
        toggleMute,
        startScratch,
        updateScratch,
        stopScratch,
        playDing,
        playFill,
        playStampText,
        playClick,
        playUndo,
        playClear,
        playCelebrate
      };
    })();

    /* ============================================================
       區塊五：狀態管理與畫布元件初始化
       ============================================================ */
    const drawCanvas = document.getElementById('drawCanvas');
    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = drawCanvas.getContext('2d', { willReadFrequently: true });
    const pCtx = previewCanvas.getContext('2d');

    // 離屏畫布：保存目前純淨底圖（讓橡皮擦還原底圖、不擦壞線稿）
    const baseCanvas = document.createElement('canvas');
    const baseCtx = baseCanvas.getContext('2d', { willReadFrequently: true });

    const state = {
      tool: 'brush',          // brush | fill | eraser | sticker | text
      sizeId: 'md',           // sm | md | lg
      color: COLOR_PALETTE[0].hex,
      rainbow: false,
      rainbowHue: 0,
      stickerId: 'star',
      templateId: 'tree',     // 預設開啟聖誕樹線稿，小朋友一進來就能塗色超好玩
      strokeCount: 0,
      done: false,
      undoStack: [],
      isDrawing: false,
      lastX: 0,
      lastY: 0,
      midX: 0,
      midY: 0,
      movedDuringStroke: false,
      pointerPos: null,
      sparkles: [],
      isPortrait: window.matchMedia('(orientation: portrait)').matches
    };

    const stickerImageCache = {};
    let modalConfirmCallback = null;
    let toastTimer = null;
    let sparkleAnimId = null;
    let cheerIndex = 0;

    /* 檢查 localStorage 是否已完成過 */
    function loadSavedProgress() {
      try {
        if (localStorage.getItem(STORAGE_KEY_DONE) === '1') {
          state.done = true;
        }
      } catch (e) {}
    }

    function markDone(showToast) {
      const wasDone = state.done;
      state.done = true;
      try {
        localStorage.setItem(STORAGE_KEY_DONE, '1');
      } catch (e) {}
      updateStatusUI();
      if (!wasDone && showToast) {
        SoundEngine.playCelebrate();
        showToastBanner(TEXTS.toastDone);
        setMascotMood('cheer', '你拿到聖誕小畫家徽章囉！');
      }
    }

    function incrementStrokeCount() {
      state.strokeCount += 1;
      updateStatusUI();
      if (state.strokeCount > DONE_STROKE_THRESHOLD && !state.done) {
        markDone(true);
      } else if (state.strokeCount % 10 === 0) {
        const msg = HELPER_TIPS.cheer[cheerIndex % HELPER_TIPS.cheer.length];
        cheerIndex += 1;
        setMascotMood('cheer', msg);
      }
    }

    /* ============================================================
       區塊六：卡片底圖繪製（全程式繪製，確保線稿封閉方便油漆桶填色）
       ============================================================ */
    function drawTemplateToContext(targetCtx, tplId, w, h) {
      targetCtx.save();
      targetCtx.setTransform(1, 0, 0, 1, 0, 0);

      if (tplId === 'cream') {
        drawCreamTemplate(targetCtx, w, h);
      } else if (tplId === 'window') {
        drawWindowTemplate(targetCtx, w, h);
      } else if (tplId === 'tree') {
        drawTreeTemplate(targetCtx, w, h);
      } else if (tplId === 'snowman') {
        drawSnowmanTemplate(targetCtx, w, h);
      }

      targetCtx.restore();
    }

    /* 底圖 1：空白奶油色卡片（附極淡典雅邊框） */
    function drawCreamTemplate(c, w, h) {
      c.fillStyle = '#fff8e6';
      c.fillRect(0, 0, w, h);

      // 外圈溫暖雙線框
      c.strokeStyle = '#e7c68a';
      c.lineWidth = 4;
      c.strokeRect(18, 18, w - 36, h - 36);

      c.strokeStyle = '#f2dcb2';
      c.lineWidth = 2;
      c.strokeRect(28, 28, w - 56, h - 56);

      // 四個角落小星星點綴
      const corners = [
        [42, 42], [w - 42, 42], [42, h - 42], [w - 42, h - 42]
      ];
      c.fillStyle = '#e8c47d';
      corners.forEach(([cx, cy]) => {
        drawMiniStar(c, cx, cy, 9, 4);
      });
    }

    /* 底圖 2：雪夜窗景（深藍星空、彎月、遠山松樹、木頭窗框與窗台積雪） */
    function drawWindowTemplate(c, w, h) {
      // 夜空漸層
      const sky = c.createLinearGradient(0, 0, 0, h * 0.78);
      sky.addColorStop(0, '#0f2042');
      sky.addColorStop(0.65, '#1c3b72');
      sky.addColorStop(1, '#315896');
      c.fillStyle = sky;
      c.fillRect(0, 0, w, h);

      // 彎月
      const mx = w * 0.78;
      const my = h * 0.2;
      const mr = Math.min(w, h) * 0.075;
      c.fillStyle = '#ffe98a';
      c.beginPath();
      c.arc(mx, my, mr, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#142b57';
      c.beginPath();
      c.arc(mx + mr * 0.36, my - mr * 0.14, mr * 0.86, 0, Math.PI * 2);
      c.fill();

      // 夜空小星星與細雪點
      c.fillStyle = '#fff8e6';
      for (let i = 0; i < 34; i++) {
        const sx = ((i * 197 + 43) % 94 + 3) / 100 * w;
        const sy = ((i * 131 + 19) % 62 + 5) / 100 * h;
        const sr = (i % 4 === 0) ? 3.2 : 1.8;
        c.beginPath();
        c.arc(sx, sy, sr, 0, Math.PI * 2);
        c.fill();
      }

      // 遠方雪坡
      c.fillStyle = '#d8ebfa';
      c.beginPath();
      c.moveTo(0, h * 0.72);
      c.quadraticCurveTo(w * 0.28, h * 0.61, w * 0.56, h * 0.71);
      c.quadraticCurveTo(w * 0.8, h * 0.78, w, h * 0.66);
      c.lineTo(w, h);
      c.lineTo(0, h);
      c.closePath();
      c.fill();

      // 遠方兩棵剪影覆雪小松樹
      drawSilhouettePine(c, w * 0.17, h * 0.74, Math.min(w, h) * 0.16);
      drawSilhouettePine(c, w * 0.84, h * 0.73, Math.min(w, h) * 0.19);

      // 室內暖色木頭窗框（外框＋十字格）
      const frameW = Math.round(Math.min(w, h) * 0.055);
      c.fillStyle = '#8b4e24';
      c.fillRect(0, 0, w, frameW);
      c.fillRect(0, 0, frameW, h);
      c.fillRect(w - frameW, 0, frameW, h);
      c.fillRect(0, h - frameW * 1.4, w, frameW * 1.4);

      // 窗框內邊高光
      c.strokeStyle = '#5c3114';
      c.lineWidth = 4;
      c.strokeRect(frameW, frameW, w - frameW * 2, h - frameW * 2.4);

      // 十字窗格（淡淡細木條，讓中間保留作畫空間）
      c.fillStyle = '#9c5a2c';
      const bar = Math.max(10, Math.round(frameW * 0.42));
      c.fillRect(w / 2 - bar / 2, frameW, bar, h - frameW * 2.4);
      c.fillRect(frameW, h * 0.47 - bar / 2, w - frameW * 2, bar);

      // 窗格角落積雪
      c.fillStyle = '#f2f9ff';
      c.beginPath();
      c.moveTo(frameW + 2, h - frameW * 1.4);
      c.quadraticCurveTo(w * 0.24, h - frameW * 1.95, w * 0.48, h - frameW * 1.4);
      c.closePath();
      c.fill();
      c.beginPath();
      c.moveTo(w * 0.52, h - frameW * 1.4);
      c.quadraticCurveTo(w * 0.76, h - frameW * 1.9, w - frameW - 2, h - frameW * 1.4);
      c.closePath();
      c.fill();

      // 窗台小聖誕冬青裝飾
      c.fillStyle = '#1e7a4c';
      c.beginPath();
      c.ellipse(w * 0.5 - 18, h - frameW * 0.7, 16, 7, -0.3, 0, Math.PI * 2);
      c.ellipse(w * 0.5 + 18, h - frameW * 0.7, 16, 7, 0.3, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#e55039';
      c.beginPath();
      c.arc(w * 0.5 - 5, h - frameW * 0.72, 5, 0, Math.PI * 2);
      c.arc(w * 0.5 + 5, h - frameW * 0.72, 5, 0, Math.PI * 2);
      c.arc(w * 0.5, h - frameW * 0.62, 5, 0, Math.PI * 2);
      c.fill();
    }

    function drawSilhouettePine(c, cx, baseY, size) {
      c.fillStyle = '#184b3c';
      for (let i = 0; i < 3; i++) {
        const yBot = baseY - i * size * 0.42;
        const yTop = yBot - size * 0.62;
        const halfW = size * (0.46 - i * 0.1);
        c.beginPath();
        c.moveTo(cx, yTop);
        c.lineTo(cx - halfW, yBot);
        c.lineTo(cx + halfW, yBot);
        c.closePath();
        c.fill();
      }
    }

    /* 底圖 3：聖誕樹輪廓線稿（每一塊區域完整封閉，方便油漆桶一鍵填色！） */
    function drawTreeTemplate(c, w, h) {
      c.fillStyle = '#fff8e6';
      c.fillRect(0, 0, w, h);

      const cx = w * 0.5;
      const scale = Math.min(w / 900, h / 560);
      const lineCol = '#5c4b3c';

      c.save();
      c.strokeStyle = lineCol;
      c.lineWidth = Math.max(3.5, 4 * scale);
      c.lineJoin = 'round';
      c.lineCap = 'round';

      // 雪地弧線（延伸到左右邊界，形成封閉的上下兩塊）
      const groundY = h * 0.84;
      c.beginPath();
      c.moveTo(0, groundY);
      c.quadraticCurveTo(w * 0.25, groundY - 22 * scale, w * 0.5, groundY - 8 * scale);
      c.quadraticCurveTo(w * 0.75, groundY + 12 * scale, w, groundY - 12 * scale);
      c.stroke();

      // 樹幹（封閉矩形）
      const trunkW = 68 * scale;
      const trunkH = 74 * scale;
      const trunkY = groundY - trunkH + 10 * scale;
      c.fillStyle = '#fff8e6';
      c.beginPath();
      c.rect(cx - trunkW / 2, trunkY, trunkW, trunkH);
      c.fill();
      c.stroke();

      // 三層聖誕樹（由下往上畫，每層各自先填奶油底再描封閉線，確保每層獨立可填色）
      const tiers = [
        { topY: h * 0.46, botY: trunkY + 8 * scale, halfW: 195 * scale },
        { topY: h * 0.30, botY: h * 0.55,          halfW: 152 * scale },
        { topY: h * 0.17, botY: h * 0.38,          halfW: 108 * scale }
      ];

      tiers.forEach((t) => {
        c.fillStyle = '#fff8e6';
        c.beginPath();
        c.moveTo(cx, t.topY);
        c.lineTo(cx + t.halfW, t.botY);
        c.quadraticCurveTo(cx, t.botY + 26 * scale, cx - t.halfW, t.botY);
        c.closePath();
        c.fill();
        c.stroke();
      });

      // 樹頂大星星（封閉多邊形）
      c.fillStyle = '#fff8e6';
      drawStrokeStar(c, cx, h * 0.13, 38 * scale, 16 * scale);

      // 樹上圓形裝飾球（每顆封閉可個別塗色）
      const balls = [
        [cx - 32 * scale, h * 0.31, 18 * scale],
        [cx + 36 * scale, h * 0.34, 18 * scale],
        [cx - 72 * scale, h * 0.49, 20 * scale],
        [cx + 4 * scale,  h * 0.47, 21 * scale],
        [cx + 76 * scale, h * 0.50, 20 * scale],
        [cx - 105 * scale, h * 0.67, 22 * scale],
        [cx - 24 * scale,  h * 0.65, 22 * scale],
        [cx + 58 * scale,  h * 0.68, 22 * scale],
        [cx + 124 * scale, h * 0.66, 19 * scale]
      ];
      balls.forEach(([bx, by, br]) => {
        c.fillStyle = '#fff8e6';
        c.beginPath();
        c.arc(bx, by, br, 0, Math.PI * 2);
        c.fill();
        c.stroke();
      });

      // 樹下左右兩個大禮物盒（封閉盒身＋緞帶，塗色超好玩）
      drawOutlineGift(c, cx - 195 * scale, groundY - 76 * scale, 96 * scale, 82 * scale);
      drawOutlineGift(c, cx + 105 * scale, groundY - 68 * scale, 86 * scale, 74 * scale);

      // 天空兩顆小星星輪廓
      drawStrokeStar(c, w * 0.16, h * 0.22, 22 * scale, 10 * scale);
      drawStrokeStar(c, w * 0.84, h * 0.24, 24 * scale, 11 * scale);

      c.restore();
    }

    function drawOutlineGift(c, x, y, gw, gh) {
      c.fillStyle = '#fff8e6';
      c.beginPath();
      c.rect(x, y, gw, gh);
      c.fill();
      c.stroke();

      // 十字緞帶
      const rw = gw * 0.2;
      c.beginPath();
      c.rect(x + gw / 2 - rw / 2, y, rw, gh);
      c.fill();
      c.stroke();

      c.beginPath();
      c.rect(x, y + gh * 0.36, gw, rw);
      c.fill();
      c.stroke();

      // 頂部蝴蝶結
      c.beginPath();
      c.ellipse(x + gw * 0.34, y - gw * 0.1, gw * 0.18, gw * 0.1, -0.3, 0, Math.PI * 2);
      c.fill();
      c.stroke();

      c.beginPath();
      c.ellipse(x + gw * 0.66, y - gw * 0.1, gw * 0.18, gw * 0.1, 0.3, 0, Math.PI * 2);
      c.fill();
      c.stroke();
    }

    /* 底圖 4：雪人輪廓線稿（每一塊區域完整封閉，方便油漆桶填色） */
    function drawSnowmanTemplate(c, w, h) {
      c.fillStyle = '#fff8e6';
      c.fillRect(0, 0, w, h);

      const cx = w * 0.48;
      const scale = Math.min(w / 900, h / 560);
      const lineCol = '#5c4b3c';

      c.save();
      c.strokeStyle = lineCol;
      c.lineWidth = Math.max(3.5, 4 * scale);
      c.lineJoin = 'round';
      c.lineCap = 'round';

      // 雪地線
      const groundY = h * 0.84;
      c.beginPath();
      c.moveTo(0, groundY - 8 * scale);
      c.quadraticCurveTo(w * 0.35, groundY - 26 * scale, w * 0.65, groundY - 6 * scale);
      c.quadraticCurveTo(w * 0.85, groundY + 6 * scale, w, groundY - 14 * scale);
      c.stroke();

      // 樹枝雙手
      const bodyY = h * 0.68;
      const bodyR = 112 * scale;
      c.beginPath();
      c.moveTo(cx - bodyR * 0.85, bodyY - 20 * scale);
      c.lineTo(cx - bodyR * 1.58, bodyY - 76 * scale);
      c.moveTo(cx - bodyR * 1.32, bodyY - 56 * scale);
      c.lineTo(cx - bodyR * 1.54, bodyY - 96 * scale);
      c.moveTo(cx + bodyR * 0.85, bodyY - 20 * scale);
      c.lineTo(cx + bodyR * 1.55, bodyY - 80 * scale);
      c.moveTo(cx + bodyR * 1.3, bodyY - 58 * scale);
      c.lineTo(cx + bodyR * 1.56, bodyY - 52 * scale);
      c.stroke();

      // 雪人圓滾滾身體
      c.fillStyle = '#fff8e6';
      c.beginPath();
      c.arc(cx, bodyY, bodyR, 0, Math.PI * 2);
      c.fill();
      c.stroke();

      // 身體三顆扣子（封閉圓）
      [-26, 12, 50].forEach((dy) => {
        c.beginPath();
        c.arc(cx, bodyY + dy * scale, 12 * scale, 0, Math.PI * 2);
        c.fill();
        c.stroke();
      });

      // 雪人頭部
      const headR = 76 * scale;
      const headY = bodyY - bodyR - headR * 0.62;
      c.beginPath();
      c.arc(cx, headY, headR, 0, Math.PI * 2);
      c.fill();
      c.stroke();

      // 暖暖圍巾（脖圍＋垂墜尾端，各自封閉）
      const neckY = headY + headR * 0.78;
      c.beginPath();
      c.roundRect(cx - 72 * scale, neckY - 12 * scale, 144 * scale, 30 * scale, 14 * scale);
      c.fill();
      c.stroke();

      c.beginPath();
      c.roundRect(cx + 28 * scale, neckY + 12 * scale, 34 * scale, 72 * scale, 10 * scale);
      c.fill();
      c.stroke();

      // 高禮帽（帽身＋緞帶＋帽簷）
      const hatBaseY = headY - headR * 0.76;
      c.beginPath();
      c.roundRect(cx - 56 * scale, hatBaseY - 74 * scale, 112 * scale, 74 * scale, 10 * scale);
      c.fill();
      c.stroke();

      c.beginPath();
      c.rect(cx - 56 * scale, hatBaseY - 26 * scale, 112 * scale, 22 * scale);
      c.fill();
      c.stroke();

      c.beginPath();
      c.roundRect(cx - 82 * scale, hatBaseY - 8 * scale, 164 * scale, 20 * scale, 10 * scale);
      c.fill();
      c.stroke();

      // 眼睛與微笑
      c.fillStyle = lineCol;
      c.beginPath();
      c.arc(cx - 24 * scale, headY - 12 * scale, 7 * scale, 0, Math.PI * 2);
      c.arc(cx + 24 * scale, headY - 12 * scale, 7 * scale, 0, Math.PI * 2);
      c.fill();

      c.beginPath();
      c.arc(cx, headY + 16 * scale, 26 * scale, 0.25 * Math.PI, 0.75 * Math.PI);
      c.stroke();

      // 胡蘿蔔鼻子（封閉三角形可塗橘色）
      c.fillStyle = '#fff8e6';
      c.beginPath();
      c.moveTo(cx, headY - 4 * scale);
      c.lineTo(cx + 58 * scale, headY + 8 * scale);
      c.lineTo(cx, headY + 16 * scale);
      c.closePath();
      c.fill();
      c.stroke();

      // 右側一棵可愛小聖誕樹輪廓
      const tx = w * 0.82;
      c.beginPath();
      c.rect(tx - 16 * scale, groundY - 40 * scale, 32 * scale, 40 * scale);
      c.fill();
      c.stroke();

      c.beginPath();
      c.moveTo(tx, groundY - 170 * scale);
      c.lineTo(tx + 72 * scale, groundY - 40 * scale);
      c.lineTo(tx - 72 * scale, groundY - 40 * scale);
      c.closePath();
      c.fill();
      c.stroke();

      // 左側小禮物盒輪廓
      drawOutlineGift(c, w * 0.08, groundY - 76 * scale, 82 * scale, 72 * scale);

      // 天空兩片雪花泡泡輪廓
      c.beginPath();
      c.arc(w * 0.16, h * 0.2, 20 * scale, 0, Math.PI * 2);
      c.fill();
      c.stroke();

      c.beginPath();
      c.arc(w * 0.82, h * 0.22, 22 * scale, 0, Math.PI * 2);
      c.fill();
      c.stroke();

      c.restore();
    }

    function drawMiniStar(c, cx, cy, outerR, innerR) {
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const angle = -Math.PI / 2 + (i * Math.PI) / 5;
        const r = i % 2 === 0 ? outerR : innerR;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) c.moveTo(x, y);
        else c.lineTo(x, y);
      }
      c.closePath();
      c.fill();
    }

    function drawStrokeStar(c, cx, cy, outerR, innerR) {
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const angle = -Math.PI / 2 + (i * Math.PI) / 5;
        const r = i % 2 === 0 ? outerR : innerR;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) c.moveTo(x, y);
        else c.lineTo(x, y);
      }
      c.closePath();
      c.fill();
      c.stroke();
    }

    /* 套用底圖並重置基準層 */
    function applyTemplate(tplId, recordUndo = false) {
      state.templateId = tplId;
      const w = drawCanvas.width;
      const h = drawCanvas.height;
      baseCanvas.width = w;
      baseCanvas.height = h;
      drawTemplateToContext(baseCtx, tplId, w, h);
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(baseCanvas, 0, 0);

      if (recordUndo) {
        pushUndoState();
      } else {
        state.undoStack = [ctx.getImageData(0, 0, w, h)];
        updateUndoUI();
      }
      renderTemplateButtons();
    }

    /* ============================================================
       區塊七：上一步（Undo）管理（至少保留 25 步）
       ============================================================ */
    function pushUndoState() {
      try {
        const snap = ctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
        state.undoStack.push(snap);
        // 保留初始狀態＋最多 MAX_UNDO_STEPS 步
        if (state.undoStack.length > MAX_UNDO_STEPS + 1) {
          state.undoStack.shift();
        }
        updateUndoUI();
      } catch (e) {}
    }

    function performUndo() {
      if (state.undoStack.length <= 1) return;
      state.undoStack.pop();
      const prev = state.undoStack[state.undoStack.length - 1];
      if (prev && prev.width === drawCanvas.width && prev.height === drawCanvas.height) {
        ctx.putImageData(prev, 0, 0);
      }
      SoundEngine.playUndo();
      updateUndoUI();
    }

    function updateUndoUI() {
      const steps = Math.max(0, state.undoStack.length - 1);
      const undoBtn = document.getElementById('undoBtn');
      const undoCount = document.getElementById('undoCount');
      undoBtn.disabled = steps === 0;
      undoCount.textContent = String(steps);
    }

    /* ============================================================
       區塊八：核心繪圖功能（畫筆、彩虹筆、橡皮擦、油漆桶、貼紙、文字）
       ============================================================ */
    function getCurrentSizeConfig() {
      return SIZES.find((s) => s.id === state.sizeId) || SIZES[1];
    }

    function getCanvasCoords(e) {
      const rect = drawCanvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (drawCanvas.width / rect.width),
        y: (e.clientY - rect.top) * (drawCanvas.height / rect.height)
      };
    }

    function hexToRgb(hex) {
      const clean = hex.replace('#', '');
      return [
        parseInt(clean.slice(0, 2), 16),
        parseInt(clean.slice(2, 4), 16),
        parseInt(clean.slice(4, 6), 16)
      ];
    }

    function hslToRgb(h, s, l) {
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;
      if (h < 60)      { r = c; g = x; b = 0; }
      else if (h < 120){ r = x; g = c; b = 0; }
      else if (h < 180){ r = 0; g = c; b = x; }
      else if (h < 240){ r = 0; g = x; b = c; }
      else if (h < 300){ r = x; g = 0; b = c; }
      else             { r = c; g = 0; b = x; }
      return [
        Math.round((r + m) * 255),
        Math.round((g + m) * 255),
        Math.round((b + m) * 255)
      ];
    }

    /* 橡皮擦：沿線段還原離屏底圖 baseCanvas，不擦壞線稿 */
    function eraseSegment(x0, y0, x1, y1, radius) {
      const dist = Math.hypot(x1 - x0, y1 - y0);
      const step = Math.max(2, radius * 0.35);
      const count = Math.max(1, Math.ceil(dist / step));

      ctx.save();
      ctx.beginPath();
      for (let i = 0; i <= count; i++) {
        const t = i / count;
        const px = x0 + (x1 - x0) * t;
        const py = y0 + (y1 - y0) * t;
        ctx.moveTo(px + radius, py);
        ctx.arc(px, py, radius, 0, Math.PI * 2);
      }
      ctx.clip();
      ctx.drawImage(baseCanvas, 0, 0);
      ctx.restore();
    }

    /* 畫筆：流暢線段＋支援連續變色彩虹筆 */
    function drawBrushSegment(x0, y0, x1, y1, sizePx) {
      const dist = Math.hypot(x1 - x0, y1 - y0);
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = sizePx;

      if (state.rainbow) {
        state.rainbowHue = (state.rainbowHue + Math.max(2, dist * 0.55)) % 360;
        ctx.strokeStyle = `hsl(${state.rainbowHue}, 92%, 52%)`;
      } else {
        ctx.strokeStyle = state.color;
      }

      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
      ctx.restore();
    }

    function drawBrushDot(x, y, sizePx) {
      ctx.save();
      if (state.rainbow) {
        state.rainbowHue = (state.rainbowHue + 18) % 360;
        ctx.fillStyle = `hsl(${state.rainbowHue}, 92%, 52%)`;
      } else {
        ctx.fillStyle = state.color;
      }
      ctx.beginPath();
      ctx.arc(x, y, sizePx / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    /* 油漆桶填色：高速掃描線 Flood Fill（支援單色與彩虹漸層填色！） */
    function performFloodFill(startX, startY) {
      const w = drawCanvas.width;
      const h = drawCanvas.height;
      const sx = Math.floor(startX);
      const sy = Math.floor(startY);
      if (sx < 0 || sx >= w || sy < 0 || sy >= h) return false;

      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      const startIdx = (sy * w + sx) * 4;
      const sr = data[startIdx];
      const sg = data[startIdx + 1];
      const sb = data[startIdx + 2];

      const [fr, fg, fb] = hexToRgb(state.color);

      // 若點到跟填色幾乎相同的顏色且不是彩虹模式，就不重複填
      if (
        !state.rainbow &&
        Math.abs(sr - fr) < 10 &&
        Math.abs(sg - fg) < 10 &&
        Math.abs(sb - fb) < 10
      ) {
        return false;
      }

      const tolerance = 46;
      const visited = new Uint8Array(w * h);

      function matchesStart(pos) {
        const i = pos * 4;
        return (
          Math.abs(data[i] - sr) <= tolerance &&
          Math.abs(data[i + 1] - sg) <= tolerance &&
          Math.abs(data[i + 2] - sb) <= tolerance
        );
      }

      const stack = [sx, sy];
      const baseHue = state.rainbowHue;
      if (state.rainbow) {
        state.rainbowHue = (state.rainbowHue + 45) % 360;
      }

      while (stack.length > 0) {
        const y = stack.pop();
        let x = stack.pop();
        let rowOffset = y * w;

        // 向左找到該掃描線的起點
        while (x >= 0 && !visited[rowOffset + x] && matchesStart(rowOffset + x)) {
          x--;
        }
        x++;

        let spanAbove = false;
        let spanBelow = false;

        while (x < w && !visited[rowOffset + x] && matchesStart(rowOffset + x)) {
          const pos = rowOffset + x;
          visited[pos] = 1;
          const idx = pos * 4;

          if (state.rainbow) {
            const hue = (baseHue + x * 0.45 + y * 0.35) % 360;
            const [rr, rg, rb] = hslToRgb(hue, 0.9, 0.56);
            data[idx] = rr;
            data[idx + 1] = rg;
            data[idx + 2] = rb;
            data[idx + 3] = 255;
          } else {
            data[idx] = fr;
            data[idx + 1] = fg;
            data[idx + 2] = fb;
            data[idx + 3] = 255;
          }

          if (y > 0) {
            const upPos = pos - w;
            const upMatch = !visited[upPos] && matchesStart(upPos);
            if (!spanAbove && upMatch) {
              stack.push(x, y - 1);
              spanAbove = true;
            } else if (spanAbove && !upMatch) {
              spanAbove = false;
            }
          }

          if (y < h - 1) {
            const downPos = pos + w;
            const downMatch = !visited[downPos] && matchesStart(downPos);
            if (!spanBelow && downMatch) {
              stack.push(x, y + 1);
              spanBelow = true;
            } else if (spanBelow && !downMatch) {
              spanBelow = false;
            }
          }

          x++;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      return true;
    }

    /* 預先載入 9 種 SVG 貼紙成 Image 物件（不污染 canvas，可順利 toDataURL） */
    function ensureSvgXmlns(svgString) {
      if (svgString.includes('xmlns=')) return svgString;
      return svgString.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    }

    function preloadStickers() {
      STICKER_DEFS.forEach((def) => {
        const img = new Image();
        const raw = ensureSvgXmlns(def.svg().trim());
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(raw);
        stickerImageCache[def.id] = img;
      });
    }

    /* 蓋上貼紙 */
    function stampSticker(x, y) {
      const img = stickerImageCache[state.stickerId];
      if (!img || !img.complete || img.naturalWidth === 0) return false;
      const targetSize = getCurrentSizeConfig().sticker;
      const ratio = img.naturalHeight / img.naturalWidth || 1;
      const drawW = targetSize;
      const drawH = targetSize * ratio;

      ctx.save();
      ctx.drawImage(img, x - drawW / 2, y - drawH / 2, drawW, drawH);
      ctx.restore();

      SoundEngine.playDing();
      spawnSparkles(x, y);
      pushUndoState();
      incrementStrokeCount();
      return true;
    }

    /* 蓋上祝福文字（注音字型＋奶油白立體外框） */
    function stampText(x, y) {
      const input = document.getElementById('stampTextInput');
      const rawText = (input.value || '').trim();
      if (!rawText) {
        showToastBanner(TEXTS.toastNeedText);
        input.focus();
        return false;
      }

      const fontSize = getCurrentSizeConfig().font;
      ctx.save();
      ctx.font = `${fontSize}px 'Bpmf Huninn', 'Noto Sans TC', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(6, Math.round(fontSize * 0.16));
      ctx.strokeStyle = '#fff8e6';

      if (state.rainbow) {
        // 彩虹模式：每個字輪流換色
        const chars = Array.from(rawText);
        const widths = chars.map((ch) => ctx.measureText(ch).width);
        const totalW = widths.reduce((a, b) => a + b, 0);
        let curX = x - totalW / 2;
        chars.forEach((ch, idx) => {
          const cw = widths[idx];
          const cxChar = curX + cw / 2;
          const hue = (state.rainbowHue + idx * 42) % 360;
          ctx.strokeText(ch, cxChar, y);
          ctx.fillStyle = `hsl(${hue}, 90%, 46%)`;
          ctx.fillText(ch, cxChar, y);
          curX += cw;
        });
        state.rainbowHue = (state.rainbowHue + 35) % 360;
      } else {
        ctx.strokeText(rawText, x, y);
        ctx.fillStyle = state.color;
        ctx.fillText(rawText, x, y);
      }

      ctx.restore();
      SoundEngine.playStampText();
      spawnSparkles(x, y);
      pushUndoState();
      incrementStrokeCount();
      return true;
    }

    /* ============================================================
       區塊九：預覽疊層（游標大小／貼紙落點／文字預覽＋星光粒子）
       ============================================================ */
    const reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

    function spawnSparkles(x, y) {
      if (reduceMotionQuery.matches) return;
      const colors = ['#ffd54f', '#ff6b6b', '#52b788', '#fff8e6', '#5cc8ff'];
      for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.4;
        const speed = 2.2 + Math.random() * 4.2;
        state.sparkles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: 4 + Math.random() * 5,
          life: 1,
          color: colors[i % colors.length]
        });
      }
      if (!sparkleAnimId) {
        sparkleAnimId = requestAnimationFrame(renderPreviewLoop);
      }
    }

    function renderPreviewLayer() {
      pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);

      // 繪製星光粒子
      if (state.sparkles.length > 0) {
        for (let i = state.sparkles.length - 1; i >= 0; i--) {
          const sp = state.sparkles[i];
          sp.x += sp.vx;
          sp.y += sp.vy;
          sp.vy += 0.12;
          sp.life -= 0.045;
          if (sp.life <= 0) {
            state.sparkles.splice(i, 1);
            continue;
          }
          pCtx.save();
          pCtx.globalAlpha = sp.life;
          pCtx.fillStyle = sp.color;
          drawMiniStar(pCtx, sp.x, sp.y, sp.r, sp.r * 0.45);
          pCtx.restore();
        }
      }

      // 繪製游標工具預覽
      if (!state.pointerPos) return;
      const { x, y } = state.pointerPos;
      const sizeCfg = getCurrentSizeConfig();

      if (state.tool === 'brush' || state.tool === 'eraser') {
        const r = (state.tool === 'brush' ? sizeCfg.brush : sizeCfg.eraser) / 2;
        pCtx.save();
        pCtx.beginPath();
        pCtx.arc(x, y, Math.max(4, r), 0, Math.PI * 2);
        pCtx.strokeStyle = state.tool === 'eraser' ? '#8e1c14' : (state.rainbow ? `hsl(${state.rainbowHue}, 90%, 50%)` : state.color);
        pCtx.lineWidth = 2.5;
        if (state.tool === 'eraser') pCtx.setLineDash([5, 4]);
        pCtx.stroke();
        pCtx.restore();
      } else if (state.tool === 'sticker') {
        const img = stickerImageCache[state.stickerId];
        if (img && img.complete && img.naturalWidth > 0) {
          const targetSize = sizeCfg.sticker;
          const ratio = img.naturalHeight / img.naturalWidth || 1;
          pCtx.save();
          pCtx.globalAlpha = 0.65;
          pCtx.drawImage(img, x - targetSize / 2, y - (targetSize * ratio) / 2, targetSize, targetSize * ratio);
          pCtx.restore();
        }
      } else if (state.tool === 'text') {
        const val = (document.getElementById('stampTextInput').value || '').trim();
        if (val) {
          pCtx.save();
          pCtx.globalAlpha = 0.65;
          pCtx.font = `${sizeCfg.font}px 'Bpmf Huninn', 'Noto Sans TC', sans-serif`;
          pCtx.textAlign = 'center';
          pCtx.textBaseline = 'middle';
          pCtx.lineJoin = 'round';
          pCtx.lineWidth = Math.max(5, Math.round(sizeCfg.font * 0.14));
          pCtx.strokeStyle = '#fff8e6';
          pCtx.strokeText(val, x, y);
          pCtx.fillStyle = state.rainbow ? '#e67e22' : state.color;
          pCtx.fillText(val, x, y);
          pCtx.restore();
        }
      }
    }

    function renderPreviewLoop() {
      renderPreviewLayer();
      if (state.sparkles.length > 0) {
        sparkleAnimId = requestAnimationFrame(renderPreviewLoop);
      } else {
        sparkleAnimId = null;
      }
    }

    /* ============================================================
       區塊十：Pointer Events 畫布互動（滑鼠與觸控共用）
       ============================================================ */
    function bindCanvasEvents() {
      drawCanvas.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
        e.preventDefault();
        const pos = getCanvasCoords(e);
        state.pointerPos = pos;

        if (state.tool === 'fill') {
          const filled = performFloodFill(pos.x, pos.y);
          if (filled) {
            SoundEngine.playFill();
            spawnSparkles(pos.x, pos.y);
            pushUndoState();
            incrementStrokeCount();
          }
          return;
        }

        if (state.tool === 'sticker') {
          stampSticker(pos.x, pos.y);
          return;
        }

        if (state.tool === 'text') {
          stampText(pos.x, pos.y);
          return;
        }

        // 畫筆或橡皮擦開始起筆
        try {
          drawCanvas.setPointerCapture(e.pointerId);
        } catch (err) {}
        state.isDrawing = true;
        state.lastX = pos.x;
        state.lastY = pos.y;
        state.movedDuringStroke = false;

        const sizeCfg = getCurrentSizeConfig();
        if (state.tool === 'brush') {
          drawBrushDot(pos.x, pos.y, sizeCfg.brush);
        } else if (state.tool === 'eraser') {
          eraseSegment(pos.x, pos.y, pos.x, pos.y, sizeCfg.eraser / 2);
        }

        SoundEngine.startScratch();
        SoundEngine.updateScratch(8);
        renderPreviewLayer();
      });

      drawCanvas.addEventListener('pointermove', (e) => {
        const pos = getCanvasCoords(e);
        state.pointerPos = pos;

        if (!state.isDrawing) {
          renderPreviewLayer();
          return;
        }

        e.preventDefault();
        const dist = Math.hypot(pos.x - state.lastX, pos.y - state.lastY);
        if (dist < 1.2) return;

        state.movedDuringStroke = true;
        const sizeCfg = getCurrentSizeConfig();

        if (state.tool === 'brush') {
          drawBrushSegment(state.lastX, state.lastY, pos.x, pos.y, sizeCfg.brush);
        } else if (state.tool === 'eraser') {
          eraseSegment(state.lastX, state.lastY, pos.x, pos.y, sizeCfg.eraser / 2);
        }

        SoundEngine.updateScratch(dist);
        state.lastX = pos.x;
        state.lastY = pos.y;
        renderPreviewLayer();
      });

      function endStroke(e) {
        if (!state.isDrawing) return;
        state.isDrawing = false;
        SoundEngine.stopScratch();
        try {
          if (e && e.pointerId !== undefined && drawCanvas.hasPointerCapture(e.pointerId)) {
            drawCanvas.releasePointerCapture(e.pointerId);
          }
        } catch (err) {}
        pushUndoState();
        incrementStrokeCount();
      }

      drawCanvas.addEventListener('pointerup', endStroke);
      drawCanvas.addEventListener('pointercancel', endStroke);
      drawCanvas.addEventListener('pointerleave', () => {
        if (!state.isDrawing) {
          state.pointerPos = null;
          renderPreviewLayer();
        }
      });

      // 鍵盤快捷鍵 Ctrl+Z 上一步
      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
          const activeTag = document.activeElement ? document.activeElement.tagName : '';
          if (activeTag !== 'INPUT' && activeTag !== 'TEXTAREA') {
            e.preventDefault();
            performUndo();
          }
        }
      });
    }

    /* ============================================================
       區塊十一：橫直向切換處理（橫向 900×560，手機直立 560×740）
       ============================================================ */
    function setCanvasResolutionForOrientation(preserveDrawing) {
      const portrait = window.matchMedia('(orientation: portrait)').matches;
      const targetW = portrait ? 560 : 900;
      const targetH = portrait ? 740 : 560;

      if (drawCanvas.width === targetW && drawCanvas.height === targetH) return;

      let tempCopy = null;
      const hasArtwork = preserveDrawing && state.undoStack.length > 1;
      if (hasArtwork) {
        tempCopy = document.createElement('canvas');
        tempCopy.width = drawCanvas.width;
        tempCopy.height = drawCanvas.height;
        tempCopy.getContext('2d').drawImage(drawCanvas, 0, 0);
      }

      drawCanvas.width = targetW;
      drawCanvas.height = targetH;
      previewCanvas.width = targetW;
      previewCanvas.height = targetH;
      baseCanvas.width = targetW;
      baseCanvas.height = targetH;

      drawTemplateToContext(baseCtx, state.templateId, targetW, targetH);
      ctx.clearRect(0, 0, targetW, targetH);
      ctx.drawImage(baseCanvas, 0, 0);

      if (tempCopy) {
        // 等比例置中保留學生原本的畫作
        const scale = Math.min(targetW / tempCopy.width, targetH / tempCopy.height);
        const dw = tempCopy.width * scale;
        const dh = tempCopy.height * scale;
        ctx.drawImage(tempCopy, (targetW - dw) / 2, (targetH - dh) / 2, dw, dh);
      }

      state.undoStack = [ctx.getImageData(0, 0, targetW, targetH)];
      state.isPortrait = portrait;
      updateUndoUI();
    }

    /* ============================================================
       區塊十二：存成圖片、彈窗與介面渲染
       ============================================================ */
    function saveCardAsImage() {
      try {
        const dataUrl = drawCanvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = TEXTS.downloadFileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        SoundEngine.playCelebrate();
        markDone(false);
        showToastBanner(TEXTS.toastSaved);
        setMascotMood('cheer', '存圖成功囉！畫得太讚了！');

        openInfoModal(TEXTS.saveModalTitle, TEXTS.saveModalMsg, dataUrl);
      } catch (e) {
        showToastBanner('圖片儲存時發生小狀況，請再點一次試試看！');
      }
    }

    function openConfirmModal(title, msg, onConfirm) {
      const backdrop = document.getElementById('modalBackdrop');
      const titleEl = document.getElementById('modalTitle');
      const msgEl = document.getElementById('modalMsg');
      const previewImg = document.getElementById('modalPreviewImg');
      const actions = document.getElementById('modalActions');

      titleEl.textContent = title;
      msgEl.textContent = msg;
      previewImg.classList.remove('show');
      previewImg.removeAttribute('src');

      actions.innerHTML = '';
      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'modal-btn modal-btn-cancel';
      cancelBtn.textContent = TEXTS.btnCancel;
      cancelBtn.addEventListener('click', () => {
        SoundEngine.playClick();
        closeModal();
      });

      const confirmBtn = document.createElement('button');
      confirmBtn.type = 'button';
      confirmBtn.className = 'modal-btn modal-btn-confirm';
      confirmBtn.textContent = TEXTS.btnConfirm;
      confirmBtn.addEventListener('click', () => {
        closeModal();
        if (typeof onConfirm === 'function') onConfirm();
      });

      actions.appendChild(cancelBtn);
      actions.appendChild(confirmBtn);

      backdrop.removeAttribute('inert');
      backdrop.setAttribute('aria-hidden', 'false');
      backdrop.classList.add('open');
      modalConfirmCallback = onConfirm;
    }

    function openInfoModal(title, msg, imgSrc) {
      const backdrop = document.getElementById('modalBackdrop');
      const titleEl = document.getElementById('modalTitle');
      const msgEl = document.getElementById('modalMsg');
      const previewImg = document.getElementById('modalPreviewImg');
      const actions = document.getElementById('modalActions');

      titleEl.textContent = title;
      msgEl.textContent = msg;
      if (imgSrc) {
        previewImg.src = imgSrc;
        previewImg.classList.add('show');
      } else {
        previewImg.classList.remove('show');
      }

      actions.innerHTML = '';
      const okBtn = document.createElement('button');
      okBtn.type = 'button';
      okBtn.className = 'modal-btn modal-btn-ok';
      okBtn.textContent = TEXTS.btnKeepDrawing;
      okBtn.addEventListener('click', () => {
        SoundEngine.playClick();
        closeModal();
      });
      actions.appendChild(okBtn);

      backdrop.removeAttribute('inert');
      backdrop.setAttribute('aria-hidden', 'false');
      backdrop.classList.add('open');
      modalConfirmCallback = null;
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      backdrop.classList.remove('open');
      backdrop.setAttribute('aria-hidden', 'true');
      backdrop.setAttribute('inert', '');
      modalConfirmCallback = null;
    }

    function showToastBanner(text) {
      const banner = document.getElementById('toastBanner');
      banner.textContent = text;
      banner.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.remove('show');
      }, 2800);
    }

    function setMascotMood(mood, speech) {
      document.getElementById('dingdingSlot').innerHTML = svgDingDing(74, mood);
      document.getElementById('snowballSlot').innerHTML = svgSnowball(78, mood);
      if (speech) {
        document.getElementById('mascotSpeech').textContent = speech;
      }
      const chars = document.getElementById('mascotChars');
      chars.classList.remove('bounce');
      void chars.offsetWidth;
      chars.classList.add('bounce');
    }

    function updateStatusUI() {
      const strokeChip = document.getElementById('strokeChip');
      const badgeChip = document.getElementById('badgeChip');
      strokeChip.textContent = `✏ ${state.strokeCount} ${TEXTS.strokeUnit}`;
      if (state.done) {
        badgeChip.textContent = TEXTS.badgeDone;
        badgeChip.classList.add('done');
      } else {
        badgeChip.textContent = TEXTS.badgePending;
        badgeChip.classList.remove('done');
      }
    }

    function updateSoundButtonUI() {
      const btn = document.getElementById('soundBtn');
      const isMuted = SoundEngine.isMuted();
      btn.textContent = isMuted ? '🔇' : '🔊';
      btn.classList.toggle('muted', isMuted);
      btn.setAttribute('aria-pressed', String(!isMuted));
    }

    function renderToolButtons() {
      const container = document.getElementById('toolList');
      container.innerHTML = '';
      TOOLS.forEach((t) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tool-btn' + (state.tool === t.id ? ' active' : '');
        btn.innerHTML = `<span class="tool-icon" aria-hidden="true">${svgToolIcon(t.id)}</span><span>${t.label}</span>`;
        btn.addEventListener('click', () => {
          SoundEngine.playClick();
          selectTool(t.id);
        });
        container.appendChild(btn);
      });
    }

    function selectTool(toolId) {
      state.tool = toolId;
      renderToolButtons();
      renderSizeButtons();
      updateRightPanelSections();
      drawCanvas.style.cursor = toolId === 'fill' ? 'pointer' : 'crosshair';
      const tip = HELPER_TIPS[toolId];
      if (tip) {
        document.getElementById('mascotSpeech').textContent = tip;
      }
      renderPreviewLayer();
    }

    function updateRightPanelSections() {
      const colorSec = document.getElementById('colorSection');
      const stickerSec = document.getElementById('stickerSection');
      const textSec = document.getElementById('textSection');
      const eraserSec = document.getElementById('eraserSection');

      const showColor = state.tool === 'brush' || state.tool === 'fill' || state.tool === 'text';
      colorSec.classList.toggle('hidden', !showColor);
      stickerSec.classList.toggle('hidden', state.tool !== 'sticker');
      textSec.classList.toggle('hidden', state.tool !== 'text');
      eraserSec.classList.toggle('hidden', state.tool !== 'eraser');
    }

    function renderSizeButtons() {
      const row = document.getElementById('sizeRow');
      row.innerHTML = '';
      const isScaleWord = state.tool === 'sticker' || state.tool === 'text';
      const labels = isScaleWord ? ['小', '中', '大'] : ['細', '中', '粗'];

      SIZES.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'size-btn' + (state.sizeId === s.id ? ' active' : '');
        btn.innerHTML = `
          <span class="size-dot" style="width:${s.dot}px;height:${s.dot}px;" aria-hidden="true"></span>
          <span>${labels[idx]}</span>
        `;
        btn.addEventListener('click', () => {
          SoundEngine.playClick();
          state.sizeId = s.id;
          renderSizeButtons();
          renderPreviewLayer();
        });
        row.appendChild(btn);
      });
    }

    function renderTemplateButtons() {
      const bar = document.getElementById('templateBar');
      bar.innerHTML = `<span class="template-label" id="lblTemplates">${TEXTS.lblTemplates}</span>`;
      TEMPLATES.forEach((tpl) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tpl-btn' + (state.templateId === tpl.id ? ' active' : '');
        btn.textContent = tpl.label;
        btn.addEventListener('click', () => {
          SoundEngine.playClick();
          if (tpl.id === state.templateId) return;
          if (state.undoStack.length > 1) {
            openConfirmModal(TEXTS.confirmTemplateTitle, TEXTS.confirmTemplateMsg, () => {
              SoundEngine.playClear();
              applyTemplate(tpl.id, true);
              setMascotMood('happy', `換成「${tpl.label}」囉！`);
            });
          } else {
            applyTemplate(tpl.id, false);
            setMascotMood('happy', `換成「${tpl.label}」囉！`);
          }
        });
        bar.appendChild(btn);
      });
    }

    function renderColorPalette() {
      const grid = document.getElementById('colorGrid');
      grid.innerHTML = '';
      COLOR_PALETTE.forEach((c) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'color-swatch' + (!state.rainbow && state.color === c.hex ? ' active' : '');
        btn.style.backgroundColor = c.hex;
        btn.title = c.name;
        btn.setAttribute('aria-label', c.name);
        btn.addEventListener('click', () => {
          SoundEngine.playClick();
          state.color = c.hex;
          state.rainbow = false;
          renderColorPalette();
          renderPreviewLayer();
        });
        grid.appendChild(btn);
      });

      const rainbowBtn = document.getElementById('rainbowBtn');
      rainbowBtn.classList.toggle('active', state.rainbow);
    }

    function renderStickerGrid() {
      const grid = document.getElementById('stickerGrid');
      grid.innerHTML = '';
      STICKER_DEFS.forEach((def) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sticker-btn' + (state.stickerId === def.id ? ' active' : '');
        btn.innerHTML = `
          <span class="sticker-thumb" aria-hidden="true">${def.svg()}</span>
          <span class="sticker-name">${def.name}</span>
        `;
        btn.addEventListener('click', () => {
          SoundEngine.playClick();
          state.stickerId = def.id;
          renderStickerGrid();
          renderPreviewLayer();
        });
        grid.appendChild(btn);
      });
    }

    function renderQuickPhrases() {
      const grid = document.getElementById('phraseGrid');
      grid.innerHTML = '';
      QUICK_PHRASES.forEach((phrase) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'phrase-btn';
        btn.textContent = phrase;
        btn.addEventListener('click', () => {
          SoundEngine.playClick();
          document.getElementById('stampTextInput').value = phrase;
          renderPreviewLayer();
        });
        grid.appendChild(btn);
      });
    }

    /* 飄雪背景生成 */
    function initSnowflakes() {
      if (reduceMotionQuery.matches) return;
      const layer = document.getElementById('snowLayer');
      const count = 24;
      for (let i = 0; i < count; i++) {
        const flake = document.createElement('span');
        flake.className = 'snowflake';
        flake.textContent = '❄';
        flake.style.left = `${(i * 4.3 + Math.random() * 3) % 100}%`;
        flake.style.fontSize = `${12 + (i % 4) * 5}px`;
        flake.style.animationDuration = `${7 + (i % 6) * 2.1}s`;
        flake.style.animationDelay = `-${(i * 0.9) % 10}s`;
        layer.appendChild(flake);
      }
    }

    /* ============================================================
       區塊十三：程式啟動入口
       ============================================================ */
    function initApp() {
      // 填入靜態文字常數
      document.getElementById('pageTitle').textContent = TEXTS.pageTitle;
      document.getElementById('backMapBtn').textContent = TEXTS.backMap;
      document.getElementById('lblTools').textContent = TEXTS.lblTools;
      document.getElementById('lblSizes').textContent = TEXTS.lblSizes;
      document.getElementById('lblColors').textContent = TEXTS.lblColors;
      document.getElementById('lblStickers').textContent = TEXTS.lblStickers;
      document.getElementById('lblTextTool').textContent = TEXTS.lblTextTool;
      document.getElementById('lblEraserTool').textContent = TEXTS.lblEraserTool;
      document.getElementById('eraserTipText').textContent = TEXTS.eraserTip;
      document.getElementById('rainbowText').textContent = TEXTS.rainbowLabel;
      document.getElementById('undoText').textContent = TEXTS.undoLabel;
      document.getElementById('clearText').textContent = TEXTS.clearLabel;
      document.getElementById('saveText').textContent = TEXTS.saveLabel;
      document.getElementById('stampTextInput').value = TEXTS.defaultStampText;

      // 放置冬青葉角落裝飾與原創角色叮叮、雪球
      document.getElementById('hollyLeft').innerHTML = svgHollyCorner();
      document.getElementById('hollyRight').innerHTML = svgHollyCorner();
      document.getElementById('hollyModalL').innerHTML = svgHollyCorner();
      document.getElementById('hollyModalR').innerHTML = svgHollyCorner();
      setMascotMood('happy', HELPER_TIPS.welcome);

      // 載入進度與貼紙快取
      loadSavedProgress();
      preloadStickers();
      initSnowflakes();

      // 依目前螢幕方向設定畫布解析度並畫上預設底圖
      setCanvasResolutionForOrientation(false);
      applyTemplate(state.templateId, false);

      // 渲染所有互動介面
      updateStatusUI();
      updateSoundButtonUI();
      renderToolButtons();
      renderSizeButtons();
      renderTemplateButtons();
      renderColorPalette();
      renderStickerGrid();
      renderQuickPhrases();
      updateRightPanelSections();
      bindCanvasEvents();

      // 綁定功能按鈕事件
      document.getElementById('soundBtn').addEventListener('click', () => {
        SoundEngine.toggleMute();
        updateSoundButtonUI();
      });

      document.getElementById('rainbowBtn').addEventListener('click', () => {
        SoundEngine.playClick();
        state.rainbow = true;
        renderColorPalette();
        setMascotMood('cheer', '彩虹魔法啟動！畫畫會變色喔！');
      });

      document.getElementById('undoBtn').addEventListener('click', performUndo);

      document.getElementById('clearBtn').addEventListener('click', () => {
        SoundEngine.playClick();
        openConfirmModal(TEXTS.confirmClearTitle, TEXTS.confirmClearMsg, () => {
          SoundEngine.playClear();
          ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
          ctx.drawImage(baseCanvas, 0, 0);
          pushUndoState();
          setMascotMood('happy', '畫布清空囉，再畫一張更棒的！');
        });
      });

      document.getElementById('saveBtn').addEventListener('click', saveCardAsImage);

      // 點擊角色互動
      const mascotChars = document.getElementById('mascotChars');
      function handleMascotTap() {
        SoundEngine.playDing();
        const msg = HELPER_TIPS.cheer[cheerIndex % HELPER_TIPS.cheer.length];
        cheerIndex += 1;
        setMascotMood('cheer', msg);
      }
      mascotChars.addEventListener('click', handleMascotTap);
      mascotChars.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handleMascotTap();
        }
      });

      // 點彈窗背板關閉
      document.getElementById('modalBackdrop').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
          SoundEngine.playClick();
          closeModal();
        }
      });

      // 監聽螢幕方向切換（橫式 900×560 ↔ 手機直立 560×740）
      const portraitMedia = window.matchMedia('(orientation: portrait)');
      const onOrientationChange = () => setCanvasResolutionForOrientation(true);
      if (portraitMedia.addEventListener) {
        portraitMedia.addEventListener('change', onOrientationChange);
      } else if (portraitMedia.addListener) {
        portraitMedia.addListener(onOrientationChange);
      }
    }

    initApp();
  </script>
<script defer src="../../assets/js/beacon.js"></script>
