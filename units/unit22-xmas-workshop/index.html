<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聖誕工坊大救援｜聖誕工坊地圖</title>
  <!-- 外部字型：僅引入規定之 Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       字型定義與色票變數
       ========================================================= */
    @font-face {
      font-family: 'Bpmf Huninn';
      src: url('fonts/bpmf-huninn-xmas.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      --xmas-red: #c0392b;
      --xmas-deep-red: #8e1c14;
      --xmas-green: #1e7a4c;
      --xmas-dark-green: #124d2f;
      --xmas-gold: #e6a817;
      --xmas-bright-gold: #ffd54f;
      --xmas-night: #142850;
      --xmas-night-deep: #0c1a38;
      --xmas-cream: #fff8e6;
      --xmas-ink: #3a1f16;
      --font-bpmf: 'Bpmf Huninn', 'Noto Sans TC', sans-serif;
      --font-ui: 'Noto Sans TC', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: var(--font-bpmf);
      font-weight: 400;
      font-synthesis: none; /* 避免瀏覽器強制加粗導致注音糊掉 */
      color: var(--xmas-ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(230, 168, 23, 0.16) 0%, transparent 36%),
        radial-gradient(circle at 82% 14%, rgba(255, 248, 230, 0.12) 0%, transparent 34%),
        linear-gradient(180deg, var(--xmas-night-deep) 0%, var(--xmas-night) 52%, #1a3566 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================================
       背景飄雪畫布與上方聖誕燈串
       ========================================================= */
    #snowCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .light-strand {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 36px;
      z-index: 15;
      pointer-events: none;
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding: 0 8px;
      overflow: hidden;
    }

    .light-strand::before {
      content: '';
      position: absolute;
      top: 5px;
      left: -2%;
      width: 104%;
      height: 10px;
      border-bottom: 3px solid #163d28;
      border-radius: 50%;
    }

    .bulb-btn {
      position: relative;
      top: 7px;
      width: 16px;
      height: 22px;
      border: none;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s ease;
    }

    .bulb-btn:hover {
      transform: scale(1.25);
    }

    .bulb-cap {
      width: 8px;
      height: 5px;
      background: #1a4d30;
      border-radius: 2px 2px 0 0;
    }

    .bulb-glass {
      width: 13px;
      height: 15px;
      border-radius: 50% 50% 45% 45%;
      animation: bulbTwinkle 2.4s ease-in-out infinite;
    }

    .bulb-red .bulb-glass {
      background: #ff5e52;
      box-shadow: 0 0 10px 2px rgba(255, 94, 82, 0.85);
    }

    .bulb-gold .bulb-glass {
      background: #ffe066;
      box-shadow: 0 0 10px 2px rgba(255, 224, 102, 0.9);
      animation-delay: 0.6s;
    }

    .bulb-green .bulb-glass {
      background: #42d684;
      box-shadow: 0 0 10px 2px rgba(66, 214, 132, 0.85);
      animation-delay: 1.2s;
    }

    .bulb-cream .bulb-glass {
      background: #fff8e6;
      box-shadow: 0 0 10px 2px rgba(255, 248, 230, 0.9);
      animation-delay: 1.8s;
    }

    .bulb-btn.flash .bulb-glass {
      transform: scale(1.35);
      box-shadow: 0 0 18px 6px rgba(255, 248, 230, 0.98);
    }

    @keyframes bulbTwinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.58; }
    }

    /* =========================================================
       頁面主容器（橫向寬螢幕 1280×800 為主版面）
       ========================================================= */
    .page-shell {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 1340px;
      padding: 22px 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-height: 100vh;
    }

    /* =========================================================
       頂部列：左上 120×44px 留白 + 主標題 + 右上控制按鈕
       ========================================================= */
    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 54px;
    }

    /* 依規範：左上角保留 120×44px 空白給整合時放「回首頁」按鈕 */
    .home-btn-spacer {
      width: 120px;
      height: 44px;
      flex-shrink: 0;
      pointer-events: none;
    }

    .title-wrap {
      flex: 1;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .main-title {
      font-family: var(--font-ui);
      font-weight: 900;
      font-size: clamp(32px, 3.2vw, 44px);
      line-height: 1.15;
      letter-spacing: 0.06em;
      color: #fff8e6;
      /* 規範指定的實心立體厚度陰影（不使用漸層透明字或 drop-shadow） */
      text-shadow:
        0 2px 0 #c0392b,
        0 4px 0 #a02a1f,
        0 6px 0 #7a1c13,
        0 8px 12px rgba(0, 0, 0, 0.35);
    }

    .title-icon {
      font-size: clamp(26px, 2.5vw, 34px);
      line-height: 1;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* 禮物盒／拐杖糖風格節慶按鈕 */
    .xmas-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 48px;
      padding: 0 18px;
      border-radius: 14px;
      border: 3px solid var(--xmas-cream);
      font-family: var(--font-bpmf);
      font-size: 24px;
      font-weight: 400;
      line-height: 1;
      color: var(--xmas-cream);
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background-color 0.14s ease;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 拐杖糖紅白斜紋邊框按鈕 */
    .btn-candy {
      background:
        linear-gradient(180deg, #d64536 0%, var(--xmas-red) 62%, var(--xmas-deep-red) 100%);
      box-shadow:
        0 0 0 3px var(--xmas-deep-red),
        0 4px 0 var(--xmas-deep-red),
        0 6px 12px rgba(0, 0, 0, 0.35);
      border: 3px solid transparent;
      background-clip: padding-box;
    }

    .btn-candy::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 16px;
      background: repeating-linear-gradient(
        -45deg,
        #fff8e6 0px,
        #fff8e6 7px,
        #c0392b 7px,
        #c0392b 14px
      );
      z-index: -1;
    }

    /* 禮物盒綠金按鈕 */
    .btn-gift {
      background: linear-gradient(180deg, #27995f 0%, var(--xmas-green) 65%, var(--xmas-dark-green) 100%);
      border-color: var(--xmas-bright-gold);
      box-shadow:
        0 4px 0 #0d3a22,
        0 6px 12px rgba(0, 0, 0, 0.35);
    }

    .xmas-btn:hover {
      transform: translateY(-2px);
    }

    .xmas-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--xmas-deep-red), 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .xmas-btn:focus-visible {
      outline: 4px solid var(--xmas-bright-gold);
      outline-offset: 3px;
    }

    /* =========================================================
       角色迎賓列：叮叮 ＋ 聖誕卡片對話框 ＋ 雪球
       ========================================================= */
    .welcome-strip {
      width: 100%;
      max-width: 1180px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 0 6px;
    }

    .char-btn {
      position: relative;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.16s ease;
    }

    .char-btn:hover {
      transform: translateY(-4px) scale(1.04);
    }

    .char-btn:active {
      transform: scale(0.95);
    }

    .char-btn:focus-visible {
      outline: 3px solid var(--xmas-bright-gold);
      border-radius: 18px;
    }

    .char-tag {
      margin-top: -10px;
      padding: 2px 12px;
      border-radius: 999px;
      background: var(--xmas-deep-red);
      border: 2px solid var(--xmas-bright-gold);
      color: var(--xmas-cream);
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 16px;
      line-height: 1.25;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
    }

    .char-tag-green {
      background: var(--xmas-green);
    }

    .char-figure {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: charWave 2.8s ease-in-out infinite;
      transform-origin: bottom center;
    }

    .char-figure-delay {
      animation-delay: 0.7s;
    }

    .char-btn.cheer-hop .char-figure {
      animation: cheerJump 0.55s ease-out;
    }

    @keyframes charWave {
      0%, 100% { transform: rotate(-2.5deg) translateY(0); }
      50% { transform: rotate(2.8deg) translateY(-3px); }
    }

    @keyframes cheerJump {
      0% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-14px) scale(1.08); }
      70% { transform: translateY(2px) scale(0.97); }
      100% { transform: translateY(0) scale(1); }
    }

    /* 角色眨眼動畫（對應 svgDingDing / svgSnowball 內的 class） */
    .char-svg .eye-blink,
    .char-svg .eye-blink-delay {
      transform-box: fill-box;
      transform-origin: center;
      animation: eyeBlink 4.6s infinite;
    }

    .char-svg .eye-blink-delay {
      animation-delay: 1.9s;
    }

    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }

    /* 聖誕卡片風格對話框（雙層邊框＋角落冬青葉＋紅綠格紋底紋） */
    .xmas-card {
      position: relative;
      background: var(--xmas-cream);
      border-radius: 20px;
      border: 4px solid var(--xmas-red);
      box-shadow:
        inset 0 0 0 4px var(--xmas-cream),
        inset 0 0 0 7px var(--xmas-gold),
        0 8px 20px rgba(0, 0, 0, 0.32);
    }

    .welcome-card {
      flex: 1;
      min-height: 88px;
      padding: 14px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      /* 局部淡雅紅綠格紋底紋 */
      background-image:
        linear-gradient(90deg, rgba(192, 57, 43, 0.05) 50%, transparent 50%),
        linear-gradient(rgba(30, 122, 76, 0.05) 50%, transparent 50%);
      background-size: 28px 28px;
      background-color: var(--xmas-cream);
    }

    .card-holly {
      position: absolute;
      width: 44px;
      height: 44px;
      pointer-events: none;
      z-index: 2;
    }

    .card-holly svg {
      width: 100%;
      height: 100%;
    }

    .card-holly.tl {
      top: -6px;
      left: -6px;
    }

    .card-holly.br {
      bottom: -6px;
      right: -6px;
      transform: rotate(180deg);
    }

    .welcome-text {
      position: relative;
      z-index: 3;
      font-family: var(--font-bpmf);
      font-size: 25px;
      line-height: 1.45;
      color: var(--xmas-ink);
    }

    .welcome-sub {
      position: relative;
      z-index: 3;
      margin-top: 2px;
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 16px;
      color: var(--xmas-green);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .progress-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(230, 168, 23, 0.22);
      border: 1.5px solid var(--xmas-gold);
      color: #6b3f04;
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: 700;
    }

    /* =========================================================
       俯視聖誕工坊小鎮地圖（橫向主畫面）
       ========================================================= */
    .map-section {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 0 8px;
    }

    .map-frame {
      position: relative;
      /* 在 1280×800 及 1366×768 皆可一屏完整顯示，並維持精準地圖比例 */
      width: min(1220px, 96vw, calc((100vh - 220px) * 1220 / 540));
      min-width: 820px;
      aspect-ratio: 1220 / 540;
      flex-shrink: 0;
      border-radius: 26px;
      padding: 8px;
      /* 拐杖糖斜紋外框 */
      background: repeating-linear-gradient(
        -45deg,
        #c0392b 0px,
        #c0392b 14px,
        #fff8e6 14px,
        #fff8e6 26px,
        #1e7a4c 26px,
        #1e7a4c 40px,
        #fff8e6 40px,
        #fff8e6 52px
      );
      box-shadow:
        0 0 0 3px var(--xmas-gold),
        0 14px 32px rgba(0, 0, 0, 0.45);
    }

    .map-stage {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      border: 3px solid var(--xmas-gold);
      background: #142850;
      overflow: visible;
    }

    .map-bg-wrap {
      position: absolute;
      inset: 0;
      border-radius: 17px;
      overflow: hidden;
      z-index: 1;
    }

    .map-bg-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 地圖內可點小彩蛋物件（薑餅人、聖誕襪、禮物盒堆） */
    .deco-spot {
      position: absolute;
      z-index: 4;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.16s ease;
    }

    .deco-spot:hover {
      transform: translate(-50%, -56%) scale(1.12);
    }

    .deco-spot:active {
      transform: translate(-50%, -48%) scale(0.94);
    }

    .deco-spot.pop {
      animation: decoPop 0.48s ease-out;
    }

    @keyframes decoPop {
      0% { transform: translate(-50%, -50%) scale(1); }
      40% { transform: translate(-50%, -68%) scale(1.22) rotate(-6deg); }
      70% { transform: translate(-50%, -52%) scale(1.06) rotate(5deg); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    /* =========================================================
       地圖上 6 棟可點擊建築節點
       ========================================================= */
    .building-node {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s cubic-bezier(0.22, 1.35, 0.36, 1), z-index 0s;
    }

    .building-node:hover,
    .building-node:focus-visible {
      z-index: 25;
      transform: translate(-50%, -56%) scale(1.06);
    }

    .building-node:active {
      transform: translate(-50%, -50%) scale(0.97);
    }

    .building-node:focus-visible .building-plate {
      outline: 4px solid var(--xmas-bright-gold);
      outline-offset: 2px;
    }

    /* 建築發光底環（移上時亮起） */
    .building-glow {
      position: absolute;
      bottom: 34px;
      left: 50%;
      width: 146px;
      height: 46px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 224, 102, 0.72) 0%, rgba(255, 224, 102, 0) 72%);
      opacity: 0.28;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 0;
    }

    .building-node.is-main .building-glow {
      width: 210px;
      height: 60px;
      opacity: 0.65;
      background: radial-gradient(ellipse at center, rgba(255, 213, 79, 0.92) 0%, rgba(230, 168, 23, 0.28) 48%, rgba(255, 213, 79, 0) 76%);
      animation: mainGlowPulse 2.4s ease-in-out infinite;
    }

    @keyframes mainGlowPulse {
      0%, 100% { opacity: 0.58; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.95; transform: translateX(-50%) scale(1.08); }
    }

    .building-node:hover .building-glow,
    .building-node:focus-visible .building-glow {
      opacity: 1;
      transform: translateX(-50%) scale(1.16);
    }

    .building-art {
      position: relative;
      z-index: 2;
      width: clamp(118px, 11vw, 148px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transition: transform 0.22s cubic-bezier(0.22, 1.4, 0.36, 1);
    }

    .building-node.is-main .building-art {
      width: clamp(166px, 15.5vw, 206px);
    }

    .building-node:hover .building-art,
    .building-node:focus-visible .building-art {
      animation: buildingBounce 0.45s ease;
    }

    @keyframes buildingBounce {
      0% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-8px) scale(1.05); }
      75% { transform: translateY(2px) scale(0.99); }
      100% { transform: translateY(0) scale(1); }
    }

    .building-art svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 主線冒險金牌標示 */
    .main-quest-ribbon {
      position: relative;
      z-index: 4;
      margin-bottom: -8px;
      padding: 3px 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffdd6b 0%, var(--xmas-gold) 100%);
      border: 2.5px solid var(--xmas-deep-red);
      color: #5c1908;
      font-family: var(--font-ui);
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }

    /* 建築名牌（注音字型，至少 24px） */
    .building-plate {
      position: relative;
      z-index: 3;
      margin-top: -6px;
      padding: 4px 14px;
      border-radius: 12px;
      background: var(--xmas-cream);
      border: 3px solid var(--xmas-red);
      box-shadow:
        inset 0 0 0 2px var(--xmas-gold),
        0 4px 0 var(--xmas-deep-red),
        0 6px 12px rgba(0, 0, 0, 0.38);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: background-color 0.16s ease, border-color 0.16s ease;
    }

    .building-node.is-main .building-plate {
      background: linear-gradient(180deg, #fff8e6 0%, #ffefc2 100%);
      border-color: var(--xmas-deep-red);
      border-width: 3.5px;
      padding: 5px 18px;
    }

    .building-node:hover .building-plate,
    .building-node:focus-visible .building-plate {
      background: #fffdf5;
      border-color: var(--xmas-gold);
    }

    .plate-name {
      font-family: var(--font-bpmf);
      font-size: 24px;
      font-weight: 400;
      line-height: 1.2;
      color: var(--xmas-ink);
    }

    /* 完成小星星（畫畫屋、聖誕樹、雪人） */
    .done-star {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
      animation: starPulse 2s ease-in-out infinite;
    }

    @keyframes starPulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.18) rotate(8deg); }
    }

    /* 分數／步數徽章（Noto Sans TC >= 16px，讀不到就不產生） */
    .score-badge {
      position: relative;
      z-index: 4;
      margin-top: 5px;
      padding: 2px 11px;
      border-radius: 999px;
      background: var(--xmas-night);
      border: 2px solid var(--xmas-bright-gold);
      color: var(--xmas-cream);
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 16px;
      line-height: 1.3;
      white-space: nowrap;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
    }

    .building-node.is-main .score-badge {
      background: var(--xmas-deep-red);
      border-color: var(--xmas-bright-gold);
      color: #fff8e6;
    }

    /* 滑鼠移上建築時顯示的一句介紹氣泡（平時 visibility:hidden） */
    .building-tooltip {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      min-width: 220px;
      max-width: 300px;
      padding: 8px 16px;
      border-radius: 14px;
      background: var(--xmas-cream);
      border: 3px solid var(--xmas-green);
      box-shadow:
        inset 0 0 0 2px var(--xmas-gold),
        0 8px 18px rgba(0, 0, 0, 0.4);
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.35;
      color: var(--xmas-ink);
      text-align: center;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
      z-index: 30;
    }

    .building-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 9px 9px 0 9px;
      border-style: solid;
      border-color: var(--xmas-green) transparent transparent transparent;
    }

    /* 上排靠上方的建築可讓氣泡往上自然超出地圖邊框，不被裁切 */
    .building-node:hover .building-tooltip,
    .building-node:focus-visible .building-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* 點擊彩蛋冒出的金色浮動小星星 */
    .sparkle-fx {
      position: fixed;
      pointer-events: none;
      z-index: 60;
      font-size: 22px;
      animation: sparkleFloat 0.85s ease-out forwards;
    }

    @keyframes sparkleFloat {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.7); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25); }
    }

    /* =========================================================
       手機直立專用：上下排列的 6 張大聖誕卡片（橫向時隱藏）
       ========================================================= */
    .portrait-list {
      display: none;
      width: 100%;
      flex-direction: column;
      gap: 14px;
      padding: 4px 0 24px;
    }

    .portrait-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 20px;
      background: var(--xmas-cream);
      border: 4px solid var(--xmas-red);
      box-shadow:
        inset 0 0 0 3px var(--xmas-cream),
        inset 0 0 0 6px var(--xmas-gold),
        0 6px 14px rgba(0, 0, 0, 0.35);
      text-decoration: none;
      color: var(--xmas-ink);
      cursor: pointer;
      transition: transform 0.14s ease;
    }

    .portrait-card.is-main {
      background: linear-gradient(135deg, #fff8e6 0%, #ffefc2 100%);
      border-color: var(--xmas-deep-red);
    }

    .portrait-card:active {
      transform: scale(0.98);
    }

    .portrait-thumb {
      width: 92px;
      height: 86px;
      flex-shrink: 0;
      border-radius: 14px;
      background: linear-gradient(180deg, #1b3668 0%, #2a528a 60%, #e7f2fa 60%, #fff8e6 100%);
      border: 2.5px solid var(--xmas-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .portrait-thumb svg {
      width: 82px;
      height: auto;
      max-height: 76px;
    }

    .portrait-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .portrait-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .portrait-name {
      font-family: var(--font-bpmf);
      font-size: 26px;
      line-height: 1.25;
      color: var(--xmas-ink);
    }

    .portrait-desc {
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.35;
      color: #573324;
    }

    .portrait-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .portrait-go {
      flex-shrink: 0;
      padding: 8px 12px;
      border-radius: 12px;
      background: var(--xmas-green);
      border: 2px solid var(--xmas-bright-gold);
      color: var(--xmas-cream);
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1;
    }

    .portrait-card.is-main .portrait-go {
      background: var(--xmas-red);
    }

    /* =========================================================
       說明彈出視窗（關閉時使用 visibility:hidden 與 inert）
       ========================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(10, 20, 44, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .modal-backdrop.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .modal-card {
      width: min(640px, 94vw);
      max-height: 88vh;
      overflow-y: auto;
      padding: 28px 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .modal-title {
      font-family: var(--font-ui);
      font-weight: 900;
      font-size: 28px;
      color: var(--xmas-deep-red);
    }

    .modal-body {
      font-family: var(--font-bpmf);
      font-size: 24px;
      line-height: 1.55;
      color: var(--xmas-ink);
      text-align: left;
      width: 100%;
    }

    .modal-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-gifts {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    /* =========================================================
       較窄橫向視窗微調（如 1024×768 教室投影）
       ========================================================= */
    @media (max-width: 1120px) and (orientation: landscape) {
      .map-frame {
        min-width: 0;
        width: 96vw;
      }

      .welcome-card {
        padding: 10px 30px;
      }

      .building-art {
        width: clamp(98px, 11vw, 132px);
      }

      .building-node.is-main .building-art {
        width: clamp(136px, 15vw, 178px);
      }
    }

    /* =========================================================
       手機直立版面重排（次要情境，不可橫向捲動）
       ========================================================= */
    @media (orientation: portrait) {
      .page-shell {
        padding: 24px 12px 20px;
        gap: 12px;
      }

      .top-bar {
        flex-wrap: wrap;
        justify-content: space-between;
        row-gap: 10px;
      }

      .home-btn-spacer {
        width: 120px;
        height: 44px;
        order: 1;
      }

      .top-controls {
        order: 2;
      }

      .title-wrap {
        order: 3;
        flex-basis: 100%;
      }

      .main-title {
        font-size: clamp(28px, 7.5vw, 38px);
      }

      .xmas-btn {
        height: 44px;
        padding: 0 12px;
        font-size: 24px;
      }

      .welcome-strip {
        flex-wrap: wrap;
        gap: 8px;
      }

      .welcome-card {
        order: 3;
        flex-basis: 100%;
        padding: 14px 20px;
      }

      .char-btn {
        transform: scale(0.9);
      }

      /* 隱藏俯視地圖，改呈現 6 張大卡片 */
      .map-section {
        display: none;
      }

      .portrait-list {
        display: flex;
      }

      .portrait-card {
        flex-wrap: wrap;
      }

      .portrait-go {
        margin-left: auto;
      }
    }

    /* =========================================================
       尊重系統減少動態偏好（關閉動畫與飄雪，功能仍正常）
       ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }

      #snowCanvas {
        display: none;
      }
    }

    /* 整合修（2026-11-19）：地圖寬度用「視窗高 − 220px」反推，但上方實際佔 ~240px，
       1366×768 筆電要捲 18px；橫式矮螢幕改扣 240px */
    @media (orientation: landscape) and (max-height: 820px) {
      .map-frame { width: min(1220px, 96vw, calc((100vh - 240px) * 1220 / 540)); }
    }
  </style>
</head>

    /* =========================================================================
       4. 原創 Web Audio API 音效合成器（不使用任何外部音檔或既有歌曲）
       ========================================================================= */
    const SoundFX = (() => {
      let ctx = null;
      let enabled = true;
      /* 五聲音階頻率（滑過 6 棟建築宛如雪地風鈴） */
      const pentatonic = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];

      function ensureContext() {
        if (!enabled) return null;
        try {
          if (!ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            ctx = new AudioCtx();
          }
          if (ctx.state === 'suspended') {
            ctx.resume().catch(() => {});
          }
          return ctx;
        } catch (err) {
          return null;
        }
      }

      function playTone(freq, startOffset, duration, type, volume) {
        const audio = ensureContext();
        if (!audio) return;
        const now = audio.currentTime + startOffset;
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(audio.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      return {
        isEnabled: () => enabled,
        toggle() {
          enabled = !enabled;
          if (enabled) {
            playTone(659.25, 0, 0.12, 'triangle', 0.14);
            playTone(987.77, 0.08, 0.18, 'sine', 0.14);
          }
          return enabled;
        },
        playHover(index = 0) {
          const f = pentatonic[index % pentatonic.length];
          playTone(f, 0, 0.16, 'sine', 0.09);
          playTone(f * 2, 0, 0.09, 'triangle', 0.03);
        },
        playEnter() {
          playTone(523.25, 0, 0.11, 'triangle', 0.15);
          playTone(659.25, 0.07, 0.12, 'triangle', 0.15);
          playTone(783.99, 0.14, 0.14, 'triangle', 0.16);
          playTone(1046.5, 0.21, 0.26, 'sine', 0.17);
        },
        playGreet() {
          playTone(783.99, 0, 0.12, 'sine', 0.12);
          playTone(987.77, 0.07, 0.14, 'triangle', 0.12);
          playTone(1174.66, 0.14, 0.22, 'sine', 0.11);
        },
        playSparkle() {
          playTone(880, 0, 0.1, 'sine', 0.1);
          playTone(1318.5, 0.06, 0.16, 'sine', 0.1);
        }
      };
    })();

    /* =========================================================================
       5. 安全讀取 localStorage（僅讀取，絕不寫入）
       ========================================================================= */
    function safeReadStorage(key) {
      try {
        return window.localStorage.getItem(key);
      } catch (err) {
        return null;
      }
    }

    function readBuildingBadge(building) {
      const raw = safeReadStorage(building.storageKey);
      if (raw === null || String(raw).trim() === '') {
        return { hasStar: false, badgeText: '' };
      }
      if (building.badgeType === 'score') {
        const num = parseInt(raw, 10);
        if (!Number.isNaN(num) && num >= 0 && num <= 12) {
          return { hasStar: false, badgeText: GAME_TEXTS.badgeFormat.score(num) };
        }
        return { hasStar: false, badgeText: '' };
      }
      if (building.badgeType === 'catchBest') {
        const num = parseInt(raw, 10);
        if (!Number.isNaN(num) && num >= 0) {
          return { hasStar: false, badgeText: GAME_TEXTS.badgeFormat.catchBest(num) };
        }
        return { hasStar: false, badgeText: '' };
      }
      if (building.badgeType === 'memoryBest') {
        const num = parseInt(raw, 10);
        if (!Number.isNaN(num) && num > 0) {
          return { hasStar: false, badgeText: GAME_TEXTS.badgeFormat.memoryBest(num) };
        }
        return { hasStar: false, badgeText: '' };
      }
      if (building.badgeType === 'done') {
        return { hasStar: String(raw).trim() === '1', badgeText: '' };
      }
      return { hasStar: false, badgeText: '' };
    }

    /* 產生點擊驚喜的小星星特效 */
    function burstSparkles(clientX, clientY) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const icons = ['⭐', '❄', '⭐'];
      icons.forEach((icon, idx) => {
        const el = document.createElement('span');
        el.className = 'sparkle-fx';
        el.textContent = icon;
        el.style.left = `${clientX}px`;
        el.style.top = `${clientY}px`;
        const angle = (-135 + idx * 45) * (Math.PI / 180);
        el.style.setProperty('--dx', `${Math.round(Math.cos(angle) * 44)}px`);
        el.style.setProperty('--dy', `${Math.round(Math.sin(angle) * 48 - 14)}px`);
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
      });
    }

    /* 初始化頂部燈串 */
    function initLightStrand() {
      const strand = document.getElementById('lightStrand');
      const colors = ['bulb-red', 'bulb-gold', 'bulb-green', 'bulb-cream'];
      const count = 24;
      let html = '';
      for (let i = 0; i < count; i++) {
        const colorCls = colors[i % colors.length];
        html += `<button type="button" class="bulb-btn ${colorCls}" tabindex="-1" aria-hidden="true"><span class="bulb-cap"></span><span class="bulb-glass"></span></button>`;
      }
      strand.innerHTML = html;

      strand.addEventListener('click', (e) => {
        const btn = e.target.closest('.bulb-btn');
        if (!btn) return;
        btn.classList.add('flash');
        SoundFX.playSparkle();
        burstSparkles(e.clientX, e.clientY);
        setGreeting(GAME_TEXTS.decoLines.bulb, 2600);
        setTimeout(() => btn.classList.remove('flash'), 350);
      });
    }

      document.getElementById('helpBtnText').textContent = GAME_TEXTS.helpBtn;
      document.getElementById('modalTitle').textContent = GAME_TEXTS.modalTitle;
      closeModalBtn.textContent = GAME_TEXTS.modalCloseBtn;

      document.querySelectorAll('[data-holly="1"]').forEach((node) => {
        node.innerHTML = svgHollyCorner();
      });

      dingDingHolder.innerHTML = svgDingDing(94, 'happy');
      snowballHolder.innerHTML = svgSnowball(98, 'happy');

      /* 說明彈窗條目與底部禮物插畫 */
      const guideList = document.getElementById('modalGuideList');
      guideList.innerHTML = GAME_TEXTS.modalGuides.map((line) => `<li>${line}</li>`).join('');
      document.getElementById('modalGifts').innerHTML =
        svgGift('red', 'square', 62) + svgGift('green', 'round', 62);
    }

    /* 角色點擊互動（歡呼跳躍＋台詞輪替） */
    function setupCharacterInteractions() {
      dingDingBtn.addEventListener('click', (e) => {
        SoundFX.playGreet();
        dingDingHolder.innerHTML = svgDingDing(94, 'cheer');
        dingDingBtn.classList.remove('cheer-hop');
        void dingDingBtn.offsetWidth;
        dingDingBtn.classList.add('cheer-hop');
        burstSparkles(e.clientX || 120, e.clientY || 140);

        const msg = GAME_TEXTS.dingDingLines[state.dingDingIdx % GAME_TEXTS.dingDingLines.length];
        state.dingDingIdx += 1;
        setGreeting(msg, 3400);

        setTimeout(() => {
          dingDingHolder.innerHTML = svgDingDing(94, 'happy');
        }, 1200);
      });

      snowballBtn.addEventListener('click', (e) => {
        SoundFX.playGreet();
        snowballHolder.innerHTML = svgSnowball(98, 'cheer');
        snowballBtn.classList.remove('cheer-hop');
        void snowballBtn.offsetWidth;
        snowballBtn.classList.add('cheer-hop');
        burstSparkles(e.clientX || window.innerWidth - 120, e.clientY || 140);

        const msg = GAME_TEXTS.snowballLines[state.snowballIdx % GAME_TEXTS.snowballLines.length];
        state.snowballIdx += 1;
        setGreeting(msg, 3400);

        setTimeout(() => {
          snowballHolder.innerHTML = svgSnowball(98, 'happy');
        }, 1200);
      });
    }

    /* 點擊建築時播放原創出發音效再跳轉 */
    function handleBuildingClick(event, href) {
      /* 若使用者按住 Ctrl / Shift / Alt / Meta 鍵，尊重瀏覽器原生開新分頁行為 */
      if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || event.button !== 0) {
        return;
      }
      event.preventDefault();
      SoundFX.playEnter();
      const delay = SoundFX.isEnabled() ? 180 : 30;
      setTimeout(() => {
        window.location.href = href;
      }, delay);
    }

    /* 渲染地圖上的 6 棟建築、彩蛋小物件，以及手機直立大卡片 */
    function renderMapAndCards() {
      let mapHtml = '';
      let portraitHtml = '';
      let visitedCount = 0;

      /* 地圖互動彩蛋：薑餅人、聖誕襪木樁、禮物堆 */
      const mapDecos = [
        { key: 'gingerbread', x: 35, y: 55, label: '點一下可愛薑餅人', svg: svgGingerbread() },
        { key: 'stocking', x: 65, y: 55, label: '點一下聖誕襪木樁', svg: svgStockingPost() },
        {
          key: 'gifts',
          x: 61,
          y: 37,
          label: '點一下聖誕禮物堆',
          svg: `<div style="display:flex;align-items:flex-end;gap:0;">${svgGift('red', 'square', 40)}${svgGift('green', 'round', 34)}</div>`
        }
      ];

      mapDecos.forEach((deco) => {
        mapHtml += `
          <button type="button" class="deco-spot" data-deco="${deco.key}"
            style="left:${deco.x}%; top:${deco.y}%;" aria-label="${deco.label}">
            ${deco.svg}
          </button>`;
      });

      /* 6 棟建築節點與手機卡片 */
      BUILDINGS.forEach((b) => {
        const badge = readBuildingBadge(b);
        if (badge.hasStar || badge.badgeText) {
          visitedCount += 1;
        }

        const artSvg = svgBuildingArt(b.id);
        const mainRibbon = b.isMain ? `<span class="main-quest-ribbon">${GAME_TEXTS.mainQuestLabel}</span>` : '';
        const starHtml = badge.hasStar
          ? `<span class="done-star" title="${GAME_TEXTS.badgeFormat.doneStarTitle}" aria-label="${GAME_TEXTS.badgeFormat.doneStarTitle}">⭐</span>`
          : '';
        const scoreBadgeHtml = badge.badgeText
          ? `<span class="score-badge">${badge.badgeText}</span>`
          : '';

        /* 橫向俯視地圖建築節點 */
        mapHtml += `
          <a href="${b.href}" class="building-node ${b.isMain ? 'is-main' : ''}"
             data-building="${b.id}" data-note="${b.noteIndex}"
             style="left:${b.posX}%; top:${b.posY}%;">
            <span class="building-tooltip" aria-hidden="true">${b.desc}</span>
            <span class="building-glow" aria-hidden="true"></span>
            ${mainRibbon}
            <div class="building-art">${artSvg}</div>
            <div class="building-plate">
              <span class="plate-name">${b.name}</span>
              ${starHtml}
            </div>
            ${scoreBadgeHtml}
          </a>`;

        /* 手機直立大卡片 */
        portraitHtml += `
          <a href="${b.href}" class="portrait-card ${b.isMain ? 'is-main' : ''}" data-building="${b.id}">
            <div class="portrait-thumb">${artSvg}</div>
            <div class="portrait-info">
              <div class="portrait-head">
                <span class="portrait-name">${b.name}</span>
                ${starHtml}
              </div>
              <p class="portrait-desc">${b.shortDesc}</p>
              <div class="portrait-meta">
                ${mainRibbon}
                ${scoreBadgeHtml}
              </div>
            </div>
            <span class="portrait-go" aria-hidden="true">${GAME_TEXTS.goBtnText}</span>
          </a>`;
      });

      mapObjectsLayer.innerHTML = mapHtml;
      portraitList.innerHTML = portraitHtml;

      /* 若有讀到任何工坊紀錄，於對話卡下方顯示溫馨進度提示（讀不到則顯示探索小提示） */
      if (visitedCount > 0) {
        welcomeSubEl.innerHTML = `<span class="progress-pill">🎄 已探索 ${visitedCount} / ${BUILDINGS.length} 個工坊景點</span><span>${GAME_TEXTS.defaultSubHint}</span>`;
      } else {
        welcomeSubEl.textContent = GAME_TEXTS.defaultSubHint;
      }

      /* 綁定地圖建築滑鼠／鍵盤／點擊互動 */
      mapObjectsLayer.querySelectorAll('.building-node').forEach((node) => {
        const b = BUILDINGS.find((item) => item.id === node.dataset.building);
        if (!b) return;

        const onEnter = () => {
          state.hoverBuildingId = b.id;
          setGreeting(`${b.name}：${b.desc}`);
          SoundFX.playHover(b.noteIndex);
        };

        const onLeave = () => {
          if (state.hoverBuildingId === b.id) {
            state.hoverBuildingId = null;
            setGreeting(GAME_TEXTS.defaultGreeting);
          }
        };

        node.addEventListener('pointerenter', onEnter);
        node.addEventListener('focus', onEnter);
        node.addEventListener('pointerleave', onLeave);
        node.addEventListener('blur', onLeave);
        node.addEventListener('click', (e) => handleBuildingClick(e, b.href));
      });

      /* 綁定手機直立卡片點擊音效 */
      portraitList.querySelectorAll('.portrait-card').forEach((card) => {
        const b = BUILDINGS.find((item) => item.id === card.dataset.building);
        if (!b) return;
        card.addEventListener('click', (e) => handleBuildingClick(e, b.href));
      });

      /* 綁定地圖小彩蛋點擊互動 */
      mapObjectsLayer.querySelectorAll('.deco-spot').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const key = btn.dataset.deco;
          SoundFX.playSparkle();
          btn.classList.remove('pop');
          void btn.offsetWidth;
          btn.classList.add('pop');
          burstSparkles(e.clientX, e.clientY);
          if (GAME_TEXTS.decoLines[key]) {
            setGreeting(GAME_TEXTS.decoLines[key], 3000);
          }
        });
      });
    }

    /* =========================================================================
       7. 音效開關與說明彈窗控制（關閉時加 visibility:hidden 與 inert）
       ========================================================================= */
    function setupTopControls() {
      soundBtn.addEventListener('click', () => {
        const isOn = SoundFX.toggle();
        soundIcon.textContent = isOn ? '🔊' : '🔇';
        soundText.textContent = isOn ? GAME_TEXTS.soundOnLabel : GAME_TEXTS.soundOffLabel;
        soundBtn.setAttribute('aria-pressed', String(isOn));
      });

      function openModal() {
        SoundFX.playGreet();
        helpModal.classList.remove('is-hidden');
        helpModal.removeAttribute('inert');
        helpModal.setAttribute('aria-hidden', 'false');
        closeModalBtn.focus();
      }

      function closeModal() {
        SoundFX.playHover(2);
        helpModal.classList.add('is-hidden');
        helpModal.setAttribute('inert', '');
        helpModal.setAttribute('aria-hidden', 'true');
        helpBtn.focus();
      }

      helpBtn.addEventListener('click', openModal);
      closeModalBtn.addEventListener('click', closeModal);
      helpModal.addEventListener('click', (e) => {
        if (e.target === helpModal) closeModal();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !helpModal.classList.contains('is-hidden')) {
          closeModal();
        }
      });
    }

    /* =========================================================================
       8. 背景飄雪動畫（自動尊重 prefers-reduced-motion）
       ========================================================================= */
    function initSnowfall() {
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (reducedMotion.matches) return;

      const canvas = document.getElementById('snowCanvas');
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      let width = 0;
      let height = 0;
      let flakes = [];
      let rafId = null;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        const count = Math.min(72, Math.max(36, Math.floor(width / 22)));
        flakes = Array.from({ length: count }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: 1.8 + Math.random() * 3.4,
          speedY: 0.45 + Math.random() * 0.95,
          sway: Math.random() * Math.PI * 2,
          swaySpeed: 0.008 + Math.random() * 0.015,
          alpha: 0.45 + Math.random() * 0.5
        }));
      }

      function tick() {
        if (reducedMotion.matches) {
          ctx.clearRect(0, 0, width, height);
          return;
        }
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < flakes.length; i++) {
          const f = flakes[i];
          f.y += f.speedY;
          f.sway += f.swaySpeed;
          f.x += Math.sin(f.sway) * 0.45;
          if (f.y > height + 8) {
            f.y = -8;
            f.x = Math.random() * width;
          }
          if (f.x > width + 8) f.x = -8;
          if (f.x < -8) f.x = width + 8;

          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 248, 230, ${f.alpha})`;
          ctx.fill();
        }
        rafId = window.requestAnimationFrame(tick);
      }

      resize();
      tick();
      window.addEventListener('resize', resize);
      reducedMotion.addEventListener('change', () => {
        if (reducedMotion.matches && rafId) {
          window.cancelAnimationFrame(rafId);
          ctx.clearRect(0, 0, width, height);
        } else if (!reducedMotion.matches) {
          resize();
          tick();
        }
      });
    }

    /* =========================================================================
       9. 啟動初始化
       ========================================================================= */
    function initApp() {
      initLightStrand();
      initStaticDecorations();
      setupCharacterInteractions();
      renderMapAndCards();
      setupTopControls();
      initSnowfall();
    }

    initApp();
  </script>
