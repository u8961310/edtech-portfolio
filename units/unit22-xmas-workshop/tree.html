<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>裝飾聖誕樹｜聖誕工坊大救援</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    /* =====================================================================
       字型設定：注音字型（學生閱讀）＋ Noto Sans TC（標題與短標籤）
       ===================================================================== */
    @font-face {
      font-family: 'Bpmf Huninn';
      src: url('fonts/bpmf-huninn-xmas.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      --xmas-red: #c0392b;
      --xmas-dark-red: #8e1c14;
      --xmas-green: #1e7a4c;
      --xmas-dark-green: #114d2f;
      --xmas-gold: #e6a817;
      --xmas-gold-light: #ffe074;
      --xmas-navy: #142850;
      --xmas-navy-deep: #0b1733;
      --xmas-cream: #fff8e6;
      --xmas-ink: #3b1e12;
      --font-zhuyin: 'Bpmf Huninn', 'Noto Sans TC', sans-serif;
      --font-ui: 'Noto Sans TC', sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-synthesis: none;
      font-family: var(--font-zhuyin);
      color: var(--xmas-ink);
      background:
        radial-gradient(circle at 20% 15%, rgba(230, 168, 23, 0.16) 0%, transparent 40%),
        radial-gradient(circle at 82% 22%, rgba(255, 248, 230, 0.12) 0%, transparent 36%),
        linear-gradient(180deg, #0d1d3d 0%, var(--xmas-navy) 55%, #1c3768 100%);
    }

    body.lights-off {
      background:
        radial-gradient(circle at 50% 45%, rgba(25, 48, 92, 0.35) 0%, transparent 60%),
        linear-gradient(180deg, #050b1c 0%, #09132b 65%, #0e1c3b 100%);
    }

    /* =====================================================================
       背景飄雪層（不阻擋操作）
       ===================================================================== */
    .snow-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .snowflake {
      position: absolute;
      top: -24px;
      color: #fff8e6;
      opacity: 0.72;
      font-family: var(--font-ui);
      animation: snowfall linear infinite;
      will-change: transform;
    }

    @keyframes snowfall {
      0% {
        transform: translate3d(0, -10px, 0) rotate(0deg);
      }
      50% {
        transform: translate3d(18px, 50vh, 0) rotate(180deg);
      }
      100% {
        transform: translate3d(-12px, 106vh, 0) rotate(360deg);
      }
    }

    /* =====================================================================
       頂部裝飾燈串
       ===================================================================== */
    .top-garland-wrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 36px;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .top-garland-wrap svg {
      width: 100%;
      height: 36px;
      display: block;
    }

    .top-bulb {
      animation: bulbTwinkle 2.2s ease-in-out infinite alternate;
    }

    .top-bulb:nth-child(even) {
      animation-delay: 1.1s;
    }

    @keyframes bulbTwinkle {
      0% { opacity: 0.65; }
      100% { opacity: 1; }
    }

    /* =====================================================================
       整體橫向寬螢幕主版面（1280×800 為主）
       ===================================================================== */
    .app-shell {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 1440px;
      height: 100vh;
      min-height: 700px;
      margin: 0 auto;
      padding: 12px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 頂部列：左上 120×44px 空白、中央標題＋計數、右上地圖與音效 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      min-height: 58px;
    }

    .home-spacer {
      width: 120px;
      height: 44px;
      flex-shrink: 0;
    }

    .title-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
      flex-wrap: wrap;
    }

    .page-title {
      margin: 0;
      font-family: var(--font-ui);
      font-weight: 900;
      font-size: clamp(28px, 3vw, 40px);
      line-height: 1.15;
      letter-spacing: 0.04em;
      color: var(--xmas-cream);
      text-shadow:
        0 2px 0 #c0392b,
        0 4px 0 #a02a1f,
        0 6px 0 #7a1c13,
        0 8px 12px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(11, 23, 51, 0.85);
      border: 2.5px solid var(--xmas-gold);
      color: var(--xmas-cream);
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 18px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .count-pill.done {
      background: var(--xmas-green);
      border-color: var(--xmas-gold-light);
      color: var(--xmas-cream);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* =====================================================================
       聖誕按鈕樣式（禮物盒風＆拐杖糖斜紋風）
       ===================================================================== */
    .xmas-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 6px 18px;
      border-radius: 14px;
      border: 3px solid var(--xmas-gold);
      background: linear-gradient(180deg, #d64535 0%, var(--xmas-red) 100%);
      color: var(--xmas-cream);
      font-family: var(--font-zhuyin);
      font-size: 24px;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--xmas-dark-red), 0 6px 14px rgba(0, 0, 0, 0.3);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .xmas-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--xmas-dark-red), 0 8px 18px rgba(0, 0, 0, 0.35);
    }

    .xmas-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--xmas-dark-red), 0 3px 8px rgba(0, 0, 0, 0.3);
    }

    .xmas-btn:focus-visible {
      outline: 3px solid var(--xmas-gold-light);
      outline-offset: 2px;
    }

    /* 禮物盒松樹綠按鈕 */
    .xmas-btn.gift-green {
      background: linear-gradient(180deg, #27945d 0%, var(--xmas-green) 100%);
      border-color: var(--xmas-gold-light);
      box-shadow: 0 4px 0 var(--xmas-dark-green), 0 6px 14px rgba(0, 0, 0, 0.3);
    }

    .xmas-btn.gift-green:hover {
      box-shadow: 0 6px 0 var(--xmas-dark-green), 0 8px 18px rgba(0, 0, 0, 0.35);
    }

    .xmas-btn.gift-green:active {
      box-shadow: 0 2px 0 var(--xmas-dark-green);
    }

    /* 夜空星光按鈕（關燈／開燈） */
    .xmas-btn.night-btn {
      background: linear-gradient(180deg, #224482 0%, #142850 100%);
      border-color: var(--xmas-gold);
      box-shadow: 0 4px 0 #09132b, 0 6px 14px rgba(0, 0, 0, 0.3);
    }

    .xmas-btn.night-btn.is-dark {
      background: linear-gradient(180deg, #f3be2b 0%, #d48f0c 100%);
      color: #2c1406;
      border-color: var(--xmas-cream);
      box-shadow: 0 4px 0 #8a5a04, 0 6px 16px rgba(255, 224, 116, 0.35);
    }

    /* 拐杖糖紅白斜紋邊框按鈕 */
    .xmas-btn.candy-btn {
      border: 4px solid transparent;
      background:
        linear-gradient(180deg, #b82b1f 0%, var(--xmas-dark-red) 100%) padding-box,
        repeating-linear-gradient(
          -45deg,
          #fff8e6 0px,
          #fff8e6 9px,
          #c0392b 9px,
          #c0392b 18px
        ) border-box;
      box-shadow: 0 4px 0 #59100b, 0 6px 14px rgba(0, 0, 0, 0.3);
    }

    .xmas-btn.candy-btn:hover {
      box-shadow: 0 6px 0 #59100b, 0 8px 18px rgba(0, 0, 0, 0.35);
    }

    .xmas-btn.candy-btn:active {
      box-shadow: 0 2px 0 #59100b;
    }

    /* 音效小圓角方塊按鈕 */
    .sound-btn {
      width: 50px;
      min-width: 50px;
      height: 48px;
      padding: 0;
      font-family: var(--font-ui);
      font-size: 24px;
    }

    /* =====================================================================
       主遊戲區：左裝飾品盒 ＋ 右聖誕樹大舞台
       ===================================================================== */
    .game-main {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 16px;
      align-items: stretch;
    }

    /* 左側：聖誕卡片風格裝飾品盒 */
    .tray-card {
      position: relative;
      width: 392px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--xmas-cream);
      border-radius: 22px;
      border: 4px solid var(--xmas-dark-red);
      box-shadow:
        inset 0 0 0 4px var(--xmas-cream),
        inset 0 0 0 7px var(--xmas-gold),
        0 10px 26px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      transition: box-shadow 0.18s ease, transform 0.18s ease;
    }

    .tray-card.recycle-hover {
      border-color: #e74c3c;
      box-shadow:
        inset 0 0 0 4px #ffe4df,
        inset 0 0 0 8px #c0392b,
        0 0 0 4px rgba(255, 224, 116, 0.85),
        0 12px 28px rgba(192, 57, 43, 0.45);
    }

    /* 卡片頂部紅綠格紋標題帶 */
    .tray-header {
      position: relative;
      padding: 12px 18px 10px;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(192, 57, 43, 0.92) 0px,
          rgba(192, 57, 43, 0.92) 26px,
          rgba(142, 28, 20, 0.92) 26px,
          rgba(142, 28, 20, 0.92) 34px,
          rgba(30, 122, 76, 0.92) 34px,
          rgba(30, 122, 76, 0.92) 56px,
          rgba(20, 92, 56, 0.92) 56px,
          rgba(20, 92, 56, 0.92) 64px
        ),
        var(--xmas-dark-red);
      border-bottom: 3px solid var(--xmas-gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .tray-title {
      margin: 0;
      padding: 2px 12px;
      border-radius: 10px;
      background: rgba(20, 40, 80, 0.88);
      border: 2px solid var(--xmas-gold-light);
      color: var(--xmas-cream);
      font-family: var(--font-ui);
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 0.04em;
    }

    .tray-badge {
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--xmas-cream);
      color: var(--xmas-dark-red);
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 16px;
      border: 2px solid var(--xmas-gold);
    }

    /* 裝飾盒角落冬青葉 */
    .holly-tl, .holly-br {
      position: absolute;
      pointer-events: none;
      z-index: 4;
      width: 48px;
      height: 48px;
    }

    .holly-tl {
      top: -6px;
      left: -6px;
    }

    .holly-br {
      bottom: -6px;
      right: -6px;
      transform: rotate(180deg);
    }

    .holly-tl svg, .holly-br svg {
      width: 48px;
      height: 48px;
    }

    /* 裝飾品捲動內容區 */
    .tray-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tray-scroll::-webkit-scrollbar {
      width: 8px;
    }

    .tray-scroll::-webkit-scrollbar-track {
      background: rgba(142, 28, 20, 0.08);
      border-radius: 8px;
    }

    .tray-scroll::-webkit-scrollbar-thumb {
      background: rgba(192, 57, 43, 0.45);
      border-radius: 8px;
    }

    .tray-section-label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 6px;
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 16px;
      color: var(--xmas-dark-red);
      padding-left: 4px;
      border-left: 5px solid var(--xmas-green);
    }

    .tray-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .tray-grid.cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .ornament-slot {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 7px 4px 6px;
      border-radius: 14px;
      background: #ffffff;
      border: 2.5px solid #e4cfa3;
      box-shadow: 0 3px 0 #d4b982;
      cursor: grab;
      touch-action: none;
      transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .ornament-slot:hover {
      transform: translateY(-2px);
      border-color: var(--xmas-gold);
      background: #fffdf5;
      box-shadow: 0 5px 0 #cfa03a;
    }

    .ornament-slot:active {
      cursor: grabbing;
      transform: scale(0.95);
    }

    .ornament-slot.selected {
      border-color: var(--xmas-red);
      background: #fff3d6;
      box-shadow: 0 0 0 3px rgba(230, 168, 23, 0.55), 0 3px 0 var(--xmas-red);
    }

    .ornament-slot svg {
      width: 48px;
      height: 48px;
      pointer-events: none;
      display: block;
    }

    .ornament-slot.special-slot {
      background: linear-gradient(180deg, #fffdf4 0%, #fff1c9 100%);
      border-color: var(--xmas-gold);
    }

    .slot-name {
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 16px;
      line-height: 1.15;
      color: var(--xmas-ink);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }

    /* 裝飾盒底部操作小提示（給學生讀，24px 注音字型） */
    .tray-tip {
      flex-shrink: 0;
      padding: 8px 14px;
      background: #f8ebd0;
      border-top: 2px dashed var(--xmas-gold);
      font-family: var(--font-zhuyin);
      font-size: 24px;
      line-height: 1.3;
      color: var(--xmas-dark-red);
      text-align: center;
    }

    /* 拖回刪除提示遮罩 */
    .recycle-banner {
      position: absolute;
      inset: 10px;
      border-radius: 16px;
      background: rgba(192, 57, 43, 0.92);
      border: 4px dashed var(--xmas-gold-light);
      color: var(--xmas-cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-zhuyin);
      font-size: 28px;
      text-align: center;
      padding: 16px;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.14s ease;
    }

    .tray-card.recycle-hover .recycle-banner {
      opacity: 1;
      visibility: visible;
    }

    /* =====================================================================
       右側：聖誕樹主舞台＋底部控制列
       ===================================================================== */
    .stage-column {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tree-stage-card {
      position: relative;
      flex: 1;
      min-height: 0;
      border-radius: 24px;
      border: 4px solid var(--xmas-gold);
      background: #10244a;
      box-shadow:
        inset 0 0 0 3px rgba(255, 248, 230, 0.2),
        0 12px 28px rgba(0, 0, 0, 0.42);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #tree-scene-svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* 樹上與樹下已放置裝飾品的互動游標與微動畫 */
    .placed-item {
      cursor: grab;
      touch-action: none;
    }

    .placed-item:hover {
      opacity: 0.94;
    }

    .placed-item.dragging-source {
      opacity: 0.25;
    }

    .placed-pop {
      animation: popBounce 0.34s cubic-bezier(0.22, 1.35, 0.36, 1);
    }

    @keyframes popBounce {
      0% { transform: scale(0.45); }
      65% { transform: scale(1.14); }
      100% { transform: scale(1); }
    }

    /* 樹頂插槽呼吸提示 */
    .top-slot-pulse {
      animation: starSlotPulse 1.8s ease-in-out infinite alternate;
    }

    @keyframes starSlotPulse {
      0% { opacity: 0.45; }
      100% { opacity: 0.95; }
    }

    /* 燈串與星星閃爍 */
    .bulb-glow-a {
      animation: lightBlink 1.5s ease-in-out infinite alternate;
    }

    .bulb-glow-b {
      animation: lightBlink 1.5s ease-in-out 0.75s infinite alternate;
    }

    @keyframes lightBlink {
      0% { opacity: 0.52; }
      100% { opacity: 1; }
    }

    /* 角色眨眼動畫（對應 svgDingDing / svgSnowball 的 class） */
    .char-svg .eye-blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: eyeBlink 4.2s ease-in-out infinite;
    }

    .char-svg .eye-blink-delay {
      transform-box: fill-box;
      transform-origin: center;
      animation: eyeBlink 4.6s ease-in-out 1.4s infinite;
    }

    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.12); }
    }

    /* 舞台右下角：雪球與叮叮夥伴角 */
    .buddy-corner {
      position: absolute;
      right: 12px;
      bottom: 8px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      z-index: 6;
      pointer-events: none;
    }

    .buddy-btn {
      pointer-events: auto;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }

    .buddy-btn:hover {
      transform: translateY(-4px) scale(1.04);
    }

    .buddy-btn.jump {
      animation: buddyJump 0.55s ease-in-out 2;
    }

    @keyframes buddyJump {
      0%, 100% { transform: translateY(0); }
      45% { transform: translateY(-16px); }
    }

    /* 叮叮／雪球即時語音氣泡 */
    .stage-toast {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 8;
      max-width: 90%;
      padding: 8px 20px;
      border-radius: 18px;
      background: var(--xmas-cream);
      border: 3px solid var(--xmas-gold);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      color: var(--xmas-dark-red);
      font-family: var(--font-zhuyin);
      font-size: 24px;
      line-height: 1.3;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    }

    .stage-toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* 底部操作列 */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    /* 拖曳浮動預覽 */
    .drag-ghost {
      position: fixed;
      left: 0;
      top: 0;
      pointer-events: none;
      z-index: 999;
      visibility: hidden;
      transform: translate(-50%, -50%) scale(1.12);
      will-change: left, top;
    }

    .drag-ghost.active {
      visibility: visible;
    }

    /* =====================================================================
       彈出視窗（叮叮慶祝 / 全部清除確認 / 拍照預覽）
       關閉時一律 visibility: hidden + inert
       ===================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(7, 16, 38, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 520px;
      background: var(--xmas-cream);
      border-radius: 24px;
      border: 5px solid var(--xmas-red);
      box-shadow:
        inset 0 0 0 4px var(--xmas-cream),
        inset 0 0 0 8px var(--xmas-gold),
        0 18px 40px rgba(0, 0, 0, 0.45);
      padding: 26px 26px 22px;
      text-align: center;
      transform: scale(0.92);
      transition: transform 0.22s cubic-bezier(0.2, 1.25, 0.35, 1);
    }

    .modal-backdrop.open .modal-card {
      transform: scale(1);
    }

    .modal-title {
      margin: 4px 0 10px;
      font-family: var(--font-ui);
      font-weight: 900;
      font-size: 30px;
      color: var(--xmas-dark-red);
    }

    .modal-body-text {
      margin: 0 0 18px;
      font-family: var(--font-zhuyin);
      font-size: 26px;
      line-height: 1.45;
      color: var(--xmas-ink);
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .cheer-characters {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .photo-preview-frame {
      background: #ffffff;
      border: 4px solid var(--xmas-gold);
      border-radius: 14px;
      padding: 8px;
      margin: 0 auto 16px;
      max-width: 360px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    }

    .photo-preview-frame img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    /* =====================================================================
       手機／平板直立版重排（不影響橫向主版面，絕不橫向捲動）
       ===================================================================== */
    @media (orientation: portrait) {
      .app-shell {
        height: auto;
        min-height: 100vh;
        padding: 10px 10px 18px;
        gap: 10px;
      }

      .top-bar {
        flex-wrap: wrap;
        row-gap: 8px;
      }

      .title-group {
        order: 3;
        flex-basis: 100%;
        justify-content: center;
      }

      .game-main {
        flex-direction: column;
      }

      .stage-column {
        order: 1;
      }

      .tree-stage-card {
        aspect-ratio: 760 / 640;
        flex: none;
        width: 100%;
      }

      .tray-card {
        order: 2;
        width: 100%;
        flex: none;
      }

      .tray-scroll {
        overflow-y: visible;
      }

      .tray-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .buddy-corner {
        right: 6px;
        bottom: 4px;
      }

      .buddy-corner svg {
        width: 66px;
        height: auto;
      }
    }

    @media (max-width: 1080px) and (orientation: landscape) {
      .tray-card {
        width: 336px;
      }

      .ornament-slot svg {
        width: 42px;
        height: 42px;
      }
    }

    /* =====================================================================
       減少動態偏好支援（關閉飄雪與裝飾動畫，遊戲仍完整可玩）
       ===================================================================== */
    @media (prefers-reduced-motion: reduce) {
      .snow-layer {
        display: none;
      }
      .snowflake,
      .top-bulb,
      .placed-pop,
      .top-slot-pulse,
      .bulb-glow-a,
      .bulb-glow-b,
      .char-svg .eye-blink,
      .char-svg .eye-blink-delay,
      .buddy-btn.jump {
        animation: none !important;
      }
      * {
        transition-duration: 0.01ms !important;
      }
    }

    /* 整合修（2026-11-19）：.app-shell 寫死 min-height 700px，1366×768 筆電要捲 43px；
       橫式矮螢幕改成剛好一個視窗高，樹與裝飾盒跟著縮 */
    @media (orientation: landscape) and (max-height: 820px) {
      .app-shell { min-height: 100vh; height: 100vh; }
    }
  </style>
</head>

    /* =====================================================================
       3. 原創 Web Audio API 音效引擎（不引用外部音檔、不用現成旋律）
       ===================================================================== */
    const SoundFX = (() => {
      let ctx = null;
      let muted = false;

      try {
        muted = localStorage.getItem('edtech-unit22-sound') === '0';
      } catch (e) {
        muted = false;
      }

      function ensureCtx() {
        if (muted) return null;
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();
        }
        if (ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function playTone(freq, startOffset, duration, type = 'triangle', volume = 0.16, slideTo = null) {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime + startOffset;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) {

        }
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

    /** 放入角落冬青葉與角色插畫 */
    function renderStaticDecor() {
      const hollyIds = [
        'holly-tray-tl', 'holly-tray-br',

      }

      // 產生樹頂點亮時的魔法小星芒
      layerMagicTwinkles.innerHTML = TREE_TWINKLES.map((pt, idx) => {

        return `
          <g class="${cls}" transform="translate(${pt.x}, ${pt.y})">
            <circle cx="0" cy="0" r="14" fill="url(#glowGold)"/>
            <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#fffbe0"/>
          </g>`;
      }).join('');
    }

    function updateBuddies(mood = 'happy') {
      buddyDing.innerHTML = svgDingDing(88, mood);
      buddySnow.innerHTML = svgSnowball(92, mood);
    }

    function jumpBuddies() {
      buddyDing.classList.remove('jump');
      buddySnow.classList.remove('jump');

      buddySnow.classList.add('jump');

    /** 產生左側裝飾品盒格子 */
    function renderTray() {
      const mount = (containerId, list, isSpecial = false) => {
        const wrap = document.getElementById(containerId);
        wrap.innerHTML = list.map((item) => `
          <div class="ornament-slot ${isSpecial ? 'special-slot' : ''}"
               role="button"
               tabindex="0"
               data-tray-type="${item.type}"
               aria-label="拖曳${item.label}到聖誕樹">
            ${buildPreviewSVG(item.type, 48)}
            <span class="slot-name">${item.label}</span>
          </div>
        `).join('');
      };

      mount('tray-special', CATALOG.special, true);
      mount('tray-ornaments', CATALOG.ornaments, false);
      mount('tray-gifts', CATALOG.gifts, false);
    }

    /* =====================================================================
       7. 幾何與落點判斷（SVG 座標轉換與聖誕樹區域判定）
       ===================================================================== */
    function clientToSvgPoint(clientX, clientY) {
      const pt = svgEl.createSVGPoint();
      pt.x = clientX;
      pt.y = clientY;
      const ctm = svgEl.getScreenCTM();
      if (!ctm) return { x: 380, y: 320 };
      const res = pt.matrixTransform(ctm.inverse());
      return { x: res.x, y: res.y };
    }

    function isNearTopStar(x, y) {
      const dx = x - 380;
      const dy = y - 92;
      return Math.hypot(dx, dy) <= 68;
    }

    function isOnTree(x, y) {
      if (y < 104 || y > 498) return false;
      const progress = (y - 104) / (498 - 104);
      const halfWidth = 34 + progress * 196;
      return Math.abs(x - 380) <= halfWidth;
    }

    function isInGiftZone(x, y) {
      return y >= 455 && y <= 622 && x >= 108 && x <= 652;
    }

    function isOverTray(clientX, clientY) {
      const rect = trayCard.getBoundingClientRect();
      return (
        clientX >= rect.left - 8 &&
        clientX <= rect.right + 8 &&
        clientY >= rect.top - 8 &&
        clientY <= rect.bottom + 8
      );
    }

    /** 取得指定 Y 座標最靠近的燈串軌道（優先找還沒掛的） */
    function pickGarlandTrack(y) {
      const missing = GARLAND_TRACKS.filter((t) => !state.garlands.includes(t.id));
      if (missing.length === 0) return -1;
      let best = missing[0];
      let bestDist = Infinity;
      missing.forEach((t) => {
        const midY = (t.y1 + t.cy) / 2;
        const d = Math.abs(y - midY);
        if (d < bestDist) {
          bestDist = d;
          best = t;
        }
      });
      return best.id;
    }

    /** 計算二次貝茲曲線上的點座標（畫燈串燈泡用） */
    function quadPoint(t, x1, y1, cx, cy, x2, y2) {
      const mt = 1 - t;
      return {
        x: mt * mt * x1 + 2 * mt * t * cx + t * t * x2,
        y: mt * mt * y1 + 2 * mt * t * cy + t * t * y2
      };
    }

    /** 計算樹下禮物落點（放在別的禮物上方時可自然堆疊） */
    function resolveGiftPosition(x, y, ignoreId = null) {
      const clampedX = Math.max(150, Math.min(610, x));
      let targetY = Math.max(516, Math.min(586, y));

      // 尋找下方相近的禮物盒，支援可愛堆疊（最多往上疊一層）
      const below = state.gifts.filter(
        (g) => g.id !== ignoreId && Math.abs(g.x - clampedX) < 52 && g.y >= targetY - 14
      );
      if (below.length > 0 && y < 548) {
        const topMost = Math.min(...below.map((g) => g.y));
        targetY = Math.max(478, topMost - 44);
      }
      return { x: clampedX, y: targetY };
    }

    /* =====================================================================
       8. 場景重繪（依目前狀態更新所有 SVG 圖層與計數器）
       ===================================================================== */
    function getTotalDecorationCount() {
      return (
        state.items.length +
        state.gifts.length +
        state.garlands.length +
        (state.hasTopStar ? 1 : 0)
      );
    }

    function renderScene(popId = null) {
      const theme = GARLAND_THEMES[state.garlandThemeIdx];
      const isLit = state.hasTopStar || state.lightsOff || state.garlands.length > 0;

      // 1. 樹頂大星插槽顯示與否
      topStarSlot.setAttribute('opacity', state.hasTopStar ? '0' : '1');
      layerMagicTwinkles.setAttribute('opacity', state.hasTopStar ? (state.lightsOff ? '1' : '0.88') : '0');

      // 2. 關燈夜色暗幕
      layerNightDim.setAttribute('opacity', state.lightsOff ? '0.74' : '0');
      document.body.classList.toggle('lights-off', state.lightsOff);
      btnLights.textContent = state.lightsOff ? TEXTS.lightsOnBtn : TEXTS.lightsOffBtn;
      btnLights.classList.toggle('is-dark', state.lightsOff);

      // 3. 樹下禮物盒（依 Y 由後往前排，堆疊更有前後層次）
      const sortedGifts = [...state.gifts].sort((a, b) => a.y - b.y);
      layerGifts.innerHTML = sortedGifts.map((g) => {
        const popCls = g.id === popId ? 'placed-pop' : '';
        return `
          <g class="placed-item" data-kind="gift" data-id="${g.id}" transform="translate(${g.x.toFixed(1)}, ${g.y.toFixed(1)})">
            <g class="${popCls}">
              <ellipse cx="0" cy="30" rx="32" ry="9" fill="rgba(25, 10, 4, 0.34)"/>
              ${getItemInnerSVG(g.type, { giftSize: 78 })}
            </g>
          </g>`;
      }).join('');

      // 4. 樹上一般裝飾品（非小星星，放夜色暗幕下方）
      const normalItems = state.items.filter((it) => it.type !== 'smallStar');
      layerOrnaments.innerHTML = normalItems.map((it) => {
        const popCls = it.id === popId ? 'placed-pop' : '';
        return `
          <g class="placed-item" data-kind="item" data-id="${it.id}" transform="translate(${it.x.toFixed(1)}, ${it.y.toFixed(1)}) rotate(${it.rot})">
            <g class="${popCls}">
              ${getItemInnerSVG(it.type)}
            </g>
          </g>`;
      }).join('');

      // 5. 燈串層（在夜色暗幕上方，關燈時超亮麗！）
      layerGlowGarlands.innerHTML = state.garlands.map((trackId) => {
        const tr = GARLAND_TRACKS[trackId];
        let bulbsHtml = '';
        for (let i = 0; i < tr.bulbs; i++) {
          const ratio = (i + 0.5) / tr.bulbs;
          const pt = quadPoint(ratio, tr.x1, tr.y1, tr.cx, tr.cy, tr.x2, tr.y2);
          const color = theme.colors[(i + trackId) % theme.colors.length];
          const glowId = theme.glows[(i + trackId) % theme.glows.length];
          const blinkCls = (i + trackId) % 2 === 0 ? 'bulb-glow-a' : 'bulb-glow-b';
          const glowR = state.lightsOff ? 22 : (state.hasTopStar ? 18 : 14);
          bulbsHtml += `
            <g class="${isLit ? blinkCls : ''}" transform="translate(${pt.x.toFixed(1)}, ${pt.y.toFixed(1)})">
              <circle cx="0" cy="0" r="${glowR}" fill="url(#${glowId})" opacity="${state.lightsOff ? '1' : '0.85'}"/>
              <circle cx="0" cy="0" r="6.2" fill="${color}" stroke="#fff8e6" stroke-width="1.4"/>
              <circle cx="-1.8" cy="-1.8" r="2" fill="#ffffff" opacity="0.9"/>
            </g>`;
        }
        return `
          <g class="placed-item" data-kind="garland" data-id="${trackId}">
            <path d="M${tr.x1},${tr.y1} Q${tr.cx},${tr.cy} ${tr.x2},${tr.y2}"
                  fill="none" stroke="transparent" stroke-width="24"/>
            <path d="M${tr.x1},${tr.y1} Q${tr.cx},${tr.cy} ${tr.x2},${tr.y2}"
                  fill="none" stroke="${state.lightsOff ? '#285c42' : '#123d27'}" stroke-width="4.5" stroke-linecap="round"/>
            ${bulbsHtml}
          </g>`;
      }).join('');

      // 6. 樹上小星星（在夜色暗幕上方，關燈時也會發光！）
      const smallStars = state.items.filter((it) => it.type === 'smallStar');
      layerGlowStars.innerHTML = smallStars.map((it) => {
        const popCls = it.id === popId ? 'placed-pop' : '';
        return `
          <g class="placed-item" data-kind="item" data-id="${it.id}" transform="translate(${it.x.toFixed(1)}, ${it.y.toFixed(1)}) rotate(${it.rot})">
            <g class="${popCls}">
              ${getItemInnerSVG('smallStar', { withGlow: state.lightsOff || state.hasTopStar })}
            </g>
          </g>`;
      }).join('');

      // 7. 樹頂大星星（在夜色暗幕上方，最耀眼！）
      if (state.hasTopStar) {
        const popCls = popId === 'topStar' ? 'placed-pop' : '';
        layerTopStar.innerHTML = `
          <g class="placed-item" data-kind="topStar" data-id="topStar" transform="translate(380, 90)">
            <g class="${popCls}">
              ${getItemInnerSVG('topStar', { withGlow: true, isTop: true })}
            </g>
          </g>`;
      } else {
        layerTopStar.innerHTML = '';
      }

      // 8. 更新進度數字與達成檢查
      const total = getTotalDecorationCount();
      countText.textContent = TEXTS.countProgress(total, GOAL_COUNT);
      countPill.classList.toggle('done', total >= GOAL_COUNT || state.doneSaved);

      if (total >= GOAL_COUNT) {
        if (!state.doneSaved) {
          state.doneSaved = true;
          try {
            localStorage.setItem(STORAGE_DONE_KEY, '1');
          } catch (e) {}
        }
        if (!state.cheeredThisRun) {
          state.cheeredThisRun = true;
          triggerGoalCelebration();
        }
      }
    }

    /** 播放短暫金色星花粒子 */
    function spawnSparkleFx(x, y) {
      const rays = [0, 45, 90, 135, 180, 225, 270, 315];
      const fxGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      fxGroup.setAttribute('transform', `translate(${x.toFixed(1)}, ${y.toFixed(1)})`);
      fxGroup.innerHTML = rays.map((deg) => {
        const rad = (deg * Math.PI) / 180;
        const x1 = (Math.cos(rad) * 10).toFixed(1);
        const y1 = (Math.sin(rad) * 10).toFixed(1);
        const x2 = (Math.cos(rad) * 28).toFixed(1);
        const y2 = (Math.sin(rad) * 28).toFixed(1);
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ffe074" stroke-width="3.5" stroke-linecap="round"/>`;
      }).join('');
      layerFx.appendChild(fxGroup);
      setTimeout(() => {
        if (fxGroup.parentNode) fxGroup.parentNode.removeChild(fxGroup);
      }, 360);
    }

    /** 顯示頂部溫馨提示氣泡 */
    function showToast(msg, duration = 2600) {
      stageToast.textContent = msg;
      stageToast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        stageToast.classList.remove('show');
      }, duration);
    }

    /** 達成 8 個以上裝飾的歡呼慶祝 */
    function triggerGoalCelebration() {
      SoundFX.playCheer();
      updateBuddies('cheer');
      jumpBuddies();
      spawnSparkleFx(380, 96);
      spawnSparkleFx(280, 290);
      spawnSparkleFx(480, 310);
      openModal(modalCheer);
    }

    /* =====================================================================
       9. 統一 Pointer Events 拖曳與點擊放置系統（滑鼠與觸控皆流暢）
       ===================================================================== */
    let dragState = null;

    function selectTrayType(type) {
      state.selectedType = state.selectedType === type ? null : type;
      document.querySelectorAll('.ornament-slot').forEach((slot) => {
        slot.classList.toggle('selected', slot.dataset.trayType === state.selectedType);
      });
      trayTip.textContent = state.selectedType ? TEXTS.trayTipSelected : TEXTS.trayTipDefault;
    }

    function clearTraySelection() {
      if (!state.selectedType) return;
      state.selectedType = null;
      document.querySelectorAll('.ornament-slot.selected').forEach((s) => s.classList.remove('selected'));
      trayTip.textContent = TEXTS.trayTipDefault;
    }

    function showGarlandPreview(trackId) {
      if (trackId < 0) {
        garlandPreviewLayer.setAttribute('opacity', '0');
        return;
      }
      const tr = GARLAND_TRACKS[trackId];
      garlandPreviewLayer.innerHTML = `
        <path d="M${tr.x1},${tr.y1} Q${tr.cx},${tr.cy} ${tr.x2},${tr.y2}"
              fill="none" stroke="#ffe074" stroke-width="8" stroke-dasharray="10 8" stroke-linecap="round"/>
      `;
      garlandPreviewLayer.setAttribute('opacity', '0.9');
    }

    function hideGarlandPreview() {
      garlandPreviewLayer.setAttribute('opacity', '0');
    }

    /** 開始從裝飾品盒拖曳 */
    function startTrayDrag(e, type) {
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      SoundFX.playPick();

      const def = CATALOG_MAP[type];
      const ghostSize = def.category === 'gift' ? 84 : 66;
      dragGhost.innerHTML = buildPreviewSVG(type, ghostSize);
      dragGhost.style.left = `${e.clientX}px`;
      dragGhost.style.top = `${e.clientY}px`;

      dragState = {
        source: 'tray',
        type,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        moved: false
      };
    }

    /** 開始拖動樹上或樹下已放好的裝飾 */
    function startPlacedDrag(e, el) {
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      clearTraySelection();
      SoundFX.playPick();

      const kind = el.dataset.kind;
      const rawId = el.dataset.id;
      let type = 'topStar';
      let id = rawId;

      if (kind === 'item') {
        id = Number(rawId);
        const found = state.items.find((it) => it.id === id);
        if (!found) return;
        type = found.type;
      } else if (kind === 'gift') {
        id = Number(rawId);
        const found = state.gifts.find((g) => g.id === id);
        if (!found) return;
        type = found.type;
      } else if (kind === 'garland') {
        id = Number(rawId);
        type = 'garland';
      }

      const def = CATALOG_MAP[type];
      const ghostSize = def && def.category === 'gift' ? 84 : 66;
      dragGhost.innerHTML = buildPreviewSVG(type, ghostSize);
      dragGhost.style.left = `${e.clientX}px`;
      dragGhost.style.top = `${e.clientY}px`;
      dragGhost.classList.add('active');
      el.classList.add('dragging-source');

      dragState = {
        source: 'placed',
        kind,
        id,
        type,
        sourceEl: el,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        moved: true
      };
    }

    /** 執行從裝飾品盒放置到指定 SVG 座標 */
    function placeNewItemAt(type, pt) {
      const def = CATALOG_MAP[type];
      if (!def) return;

      // 1. 樹頂大星（或小星星靠近樹頂）
      if (type === 'topStar' || (type === 'smallStar' && isNearTopStar(pt.x, pt.y))) {
        if (isNearTopStar(pt.x, pt.y) || (type === 'topStar' && isOnTree(pt.x, pt.y))) {
          state.hasTopStar = true;
          SoundFX.playStarTop();
          spawnSparkleFx(380, 90);
          spawnSparkleFx(310, 210);
          spawnSparkleFx(450, 210);
          updateBuddies('cheer');
          jumpBuddies();
          showToast(TEXTS.toastStarTop);
          renderScene('topStar');
          return;
        }
        if (type === 'topStar') {
          showToast(TEXTS.toastNeedTree);
          return;
        }
      }

      // 2. 發光燈串（自動沿樹畫一圈）
      if (type === 'garland') {
        if (isOnTree(pt.x, pt.y) || isNearTopStar(pt.x, pt.y)) {
          const trackId = pickGarlandTrack(pt.y);
          if (trackId >= 0) {
            state.garlands.push(trackId);
            state.garlands.sort((a, b) => a - b);
            SoundFX.playGarland();
            const tr = GARLAND_TRACKS[trackId];
            spawnSparkleFx(tr.cx, (tr.y1 + tr.cy) / 2);
            showToast(TEXTS.toastGarlandAdded);
            renderScene();
          } else {
            state.garlandThemeIdx = (state.garlandThemeIdx + 1) % GARLAND_THEMES.length;
            SoundFX.playGarland();
            spawnSparkleFx(380, 310);
            showToast(TEXTS.toastGarlandTheme(GARLAND_THEMES[state.garlandThemeIdx].name));
            renderScene();
          }
          return;
        }
        showToast(TEXTS.toastNeedTree);
        return;
      }

      // 3. 樹下禮物盒（或把小禮物拖到樹下變成紅方禮物）
      if (def.category === 'gift' || (type === 'miniGift' && isInGiftZone(pt.x, pt.y) && !isOnTree(pt.x, pt.y))) {
        if (isInGiftZone(pt.x, pt.y)) {
          const giftType = def.category === 'gift' ? type : 'gift-red-square';
          const pos = resolveGiftPosition(pt.x, pt.y);
          const id = state.nextId++;
          state.gifts.push({ id, type: giftType, x: pos.x, y: pos.y });
          SoundFX.playGiftDrop();
          spawnSparkleFx(pos.x, pos.y - 10);
          showToast(TEXTS.toastGiftPlaced, 1800);
          renderScene(id);
          return;
        }
        if (def.category === 'gift') {
          showToast(TEXTS.toastNeedGiftZone);
          return;
        }
      }

      // 4. 一般樹上掛飾（彩球、小星星、鈴鐺、拐杖糖、薑餅人、蝴蝶結、小禮物）
      if (isOnTree(pt.x, pt.y)) {
        const id = state.nextId++;
        const rot = Math.round((Math.random() - 0.5) * 16);
        state.items.push({ id, type, x: pt.x, y: pt.y, rot });
        SoundFX.playPlace();
        spawnSparkleFx(pt.x, pt.y);
        renderScene(id);
      } else {
        showToast(TEXTS.toastNeedTree);
      }
    }

    /** 處理拖曳移動 */
    window.addEventListener('pointermove', (e) => {
      if (!dragState || e.pointerId !== dragState.pointerId) return;

      const dist = Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY);
      if (!dragState.moved && dist > 6) {
        dragState.moved = true;
        clearTraySelection();
        dragGhost.classList.add('active');
      }

      if (!dragState.moved) return;

      dragGhost.style.left = `${e.clientX}px`;
      dragGhost.style.top = `${e.clientY}px`;

      // 拖回左側盒子時亮起回收提示
      if (dragState.source === 'placed') {
        trayCard.classList.toggle('recycle-hover', isOverTray(e.clientX, e.clientY));
      }

      // 拖燈串進入樹身時預覽目標弧線
      if (dragState.type === 'garland' && dragState.source === 'tray') {
        const pt = clientToSvgPoint(e.clientX, e.clientY);
        if (isOnTree(pt.x, pt.y)) {
          showGarlandPreview(pickGarlandTrack(pt.y));
        } else {
          hideGarlandPreview();
        }
      }

      // 拖星星靠近樹頂時讓樹頂插槽更醒目
      if (dragState.type === 'topStar' || dragState.type === 'smallStar') {
        const pt = clientToSvgPoint(e.clientX, e.clientY);
        if (!state.hasTopStar) {
          topStarSlot.setAttribute('transform', isNearTopStar(pt.x, pt.y) ? 'translate(380, 90) scale(1.22)' : 'translate(380, 90)');
        }
      }
    });

    /** 處理拖曳放開 */
    function finishDrag(e, cancelled = false) {
      if (!dragState || e.pointerId !== dragState.pointerId) return;

      const current = dragState;
      dragState = null;
      dragGhost.classList.remove('active');
      trayCard.classList.remove('recycle-hover');
      hideGarlandPreview();
      topStarSlot.setAttribute('transform', 'translate(380, 90)');
      if (current.sourceEl) {
        current.sourceEl.classList.remove('dragging-source');
      }

      if (cancelled) return;

      // 從裝飾盒只點了一下（沒有拖曳）：進入點選輔助模式，或若點燈串／樹頂大星直接方便操作
      if (current.source === 'tray' && !current.moved) {
        selectTrayType(current.type);
        return;
      }

      const pt = clientToSvgPoint(e.clientX, e.clientY);

      // 情況 A：從裝飾盒拖出來放置
      if (current.source === 'tray') {
        if (isOverTray(e.clientX, e.clientY)) return;
        placeNewItemAt(current.type, pt);
        return;
      }

      // 情況 B：拖動樹上／樹下既有的裝飾品
      if (current.source === 'placed') {
        // 拖回盒子 → 刪除
        if (isOverTray(e.clientX, e.clientY)) {
          if (current.kind === 'item') {
            state.items = state.items.filter((it) => it.id !== current.id);
          } else if (current.kind === 'gift') {
            state.gifts = state.gifts.filter((g) => g.id !== current.id);
          } else if (current.kind === 'garland') {
            state.garlands = state.garlands.filter((tid) => tid !== current.id);
          } else if (current.kind === 'topStar') {
            state.hasTopStar = false;
          }
          SoundFX.playRemove();
          showToast(TEXTS.toastRemoved, 1800);
          renderScene();
          return;
        }

        // 重新定位
        if (current.kind === 'item') {
          const item = state.items.find((it) => it.id === current.id);
          if (!item) return;
          if (item.type === 'smallStar' && isNearTopStar(pt.x, pt.y) && !state.hasTopStar) {
            state.items = state.items.filter((it) => it.id !== item.id);
            state.hasTopStar = true;
            SoundFX.playStarTop();
            spawnSparkleFx(380, 90);
            showToast(TEXTS.toastStarTop);
            renderScene('topStar');
          } else if (isOnTree(pt.x, pt.y)) {
            item.x = pt.x;
            item.y = pt.y;
            SoundFX.playPlace();
            renderScene(item.id);
          } else {
            // 沒放到樹上也沒拖回盒子，溫柔保留在原位
            renderScene();
          }
        } else if (current.kind === 'gift') {
          const gift = state.gifts.find((g) => g.id === current.id);
          if (!gift) return;
          if (isInGiftZone(pt.x, pt.y)) {
            const pos = resolveGiftPosition(pt.x, pt.y, gift.id);
            gift.x = pos.x;
            gift.y = pos.y;
            SoundFX.playGiftDrop();
            renderScene(gift.id);
          } else {
            renderScene();
          }
        } else if (current.kind === 'garland') {
          // 燈串若放開在樹的另一層且該層空的，可以換層
          const targetTrack = pickGarlandTrack(pt.y);
          if (isOnTree(pt.x, pt.y) && targetTrack >= 0) {
            state.garlands = state.garlands.filter((tid) => tid !== current.id);
            state.garlands.push(targetTrack);
            state.garlands.sort((a, b) => a - b);
            SoundFX.playGarland();
          }
          renderScene();
        } else if (current.kind === 'topStar') {
          // 樹頂大星放回樹頂保持點亮
          renderScene();
        }
      }
    }

    window.addEventListener('pointerup', (e) => finishDrag(e, false));
    window.addEventListener('pointercancel', (e) => finishDrag(e, true));

    // 綁定裝飾品盒事件（支援拖曳與鍵盤選取）
    trayCard.addEventListener('pointerdown', (e) => {
      const slot = e.target.closest('.ornament-slot');
      if (!slot) return;
      startTrayDrag(e, slot.dataset.trayType);
    });

    trayCard.addEventListener('keydown', (e) => {
      const slot = e.target.closest('.ornament-slot');
      if (!slot) return;
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectTrayType(slot.dataset.trayType);
      }
    });

    // 綁定聖誕樹畫布事件（拖動既有裝飾 / 點擊放置已選中的裝飾）
    svgEl.addEventListener('pointerdown', (e) => {
      const placed = e.target.closest('.placed-item');
      if (placed && !state.selectedType) {
        startPlacedDrag(e, placed);
        return;
      }
      if (state.selectedType) {
        e.preventDefault();
        const pt = clientToSvgPoint(e.clientX, e.clientY);
        placeNewItemAt(state.selectedType, pt);
      }
    });

    /* =====================================================================
       10. 彈出視窗開關管理（關閉時一律加 visibility:hidden + inert）
       ===================================================================== */
    function openModal(el) {
      el.removeAttribute('inert');
      el.classList.add('open');
    }

    function closeModal(el) {
      el.classList.remove('open');
      el.setAttribute('inert', '');
    }

    /* =====================================================================
       11. 拍照功能（將 SVG 序列化繪製至高解析度 Canvas，輸出相框 PNG）
       ===================================================================== */
    function takeTreePhoto() {
      SoundFX.playShutter();
      clearTraySelection();

      // 複製整個聖誕樹 SVG 並補上乾淨樣式，確保匯出無跨域或動畫閃爍問題
      const clone = svgEl.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.setAttribute('width', '760');
      clone.setAttribute('height', '640');

      // 拍照時若尚未放樹頂大星，隱藏虛線提示框讓照片更美觀
      const cloneSlot = clone.querySelector('#top-star-slot');
      if (cloneSlot && !state.hasTopStar) {
        cloneSlot.setAttribute('opacity', '0');
      }

      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(clone);
      const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      const img = new Image();
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 1600;
          canvas.height = 1420;
          const ctx = canvas.getContext('2d');

          // 繪製奶油白聖誕賀卡相框底
          ctx.fillStyle = '#fff8e6';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // 雙層紅金相框邊線
          ctx.strokeStyle = '#c0392b';
          ctx.lineWidth = 18;
          ctx.strokeRect(16, 16, canvas.width - 32, canvas.height - 32);
          ctx.strokeStyle = '#e6a817';
          ctx.lineWidth = 6;
          ctx.strokeRect(32, 32, canvas.width - 64, canvas.height - 64);

          // 畫入 2 倍高解析聖誕樹場景
          ctx.drawImage(img, 40, 40, 1520, 1280);

          // 照片下方題字
          ctx.fillStyle = '#8e1c14';
          ctx.font = 'bold 42px "Noto Sans TC", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(TEXTS.photoBannerText, canvas.width / 2, 1368);

          const dataUrl = canvas.toDataURL('image/png');
          photoPreviewImg.src = dataUrl;
          btnPhotoDownload.href = dataUrl;

          // 自動觸發下載一次
          const a = document.createElement('a');
          a.href = dataUrl;
          a.download = 'christmas-tree.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          openModal(modalPhoto);
        } catch (err) {
          showToast('拍照時發生小狀況，請再試一次喔！');
        } finally {
          URL.revokeObjectURL(url);
        }
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        showToast('拍照時發生小狀況，請再試一次喔！');
      };
      img.src = url;
    }

    /* =====================================================================
       12. 按鈕事件綁定與啟動
       ===================================================================== */
    btnSound.addEventListener('click', () => {
      const isMuted = SoundFX.toggle();
      btnSound.textContent = isMuted ? '🔇' : '🔊';
    });

    btnLights.addEventListener('click', () => {
      state.lightsOff = !state.lightsOff;
      SoundFX.playSwitchLight(state.lightsOff);
      renderScene();
      showToast(state.lightsOff ? TEXTS.toastLightsDark : TEXTS.toastLightsBright);
    });

    btnPhoto.addEventListener('click', () => {
      takeTreePhoto();
    });

    btnClear.addEventListener('click', () => {
      if (getTotalDecorationCount() === 0) {
        SoundFX.playPick();
        showToast(TEXTS.toastNothingClear);
        return;
      }
      SoundFX.playPick();
      openModal(modalClear);
    });

    document.getElementById('btn-clear-cancel').addEventListener('click', () => {
      SoundFX.playPick();
      closeModal(modalClear);
    });

    document.getElementById('btn-clear-confirm').addEventListener('click', () => {
      state.items = [];
      state.gifts = [];
      state.garlands = [];
      state.hasTopStar = false;
      state.cheeredThisRun = false;
      clearTraySelection();
      updateBuddies('happy');
      SoundFX.playRemove();
      closeModal(modalClear);
      renderScene();
      showToast(TEXTS.toastCleared);
    });

    document.getElementById('btn-cheer-ok').addEventListener('click', () => {
      SoundFX.playPick();
      closeModal(modalCheer);
    });

    document.getElementById('btn-photo-close').addEventListener('click', () => {
      SoundFX.playPick();
      closeModal(modalPhoto);
    });

    // 點擊彈窗外部深色背景也可關閉
    [modalClear, modalCheer, modalPhoto].forEach((modal) => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeModal(modal);
        }
      });
    });

    // 點擊叮叮與雪球會跳起來說溫馨小提示
    buddyDing.addEventListener('click', () => {
      SoundFX.playPlace();
      jumpBuddies();
      const msg = TEXTS.dingDingChats[state.dingChatIdx % TEXTS.dingDingChats.length];
      state.dingChatIdx += 1;
      showToast(msg, 3200);
    });

    buddySnow.addEventListener('click', () => {
      SoundFX.playPlace();
      jumpBuddies();
      const msg = TEXTS.snowballChats[state.snowChatIdx % TEXTS.snowballChats.length];
      state.snowChatIdx += 1;
      showToast(msg, 3200);
    });

    // 啟動初始化
    applyTexts();
    renderStaticDecor();
    renderTray();
    renderScene();
  </script>
<script defer src="../../assets/js/beacon.js"></script>
</body>
