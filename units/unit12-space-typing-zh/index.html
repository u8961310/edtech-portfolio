<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中打特攻 - 打字島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@500;600&display=swap">
  <link rel="stylesheet" href="../../assets/css/typing-island.css">
  <style>
    /* =========================================================
       中打特攻：晴朗藍天紙飛機射擊場景（繪本剪紙風）
       所有樣式皆以 sc- 開頭，不動共用 .ti- 樣式
       ========================================================= */
    .sc-root,
    .sc-root * {
      box-sizing: border-box;
      user-select: none;
    }

    .sc-root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink-1, #3B2A20);
      background: linear-gradient(180deg, #C7E6F7 0%, var(--sky-soft, #D6EEFB) 52%, #EBF5FB 82%, var(--card, #FFF8E6) 100%);
    }

    /* 淡紙張點紋質感 */
    .sc-paper-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.32;
      background-image: radial-gradient(rgba(94, 72, 56, 0.14) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* 右上角剪紙小太陽 */
    .sc-sun {
      position: absolute;
      top: 10px;
      right: 22px;
      width: 68px;
      height: 68px;
      pointer-events: none;
      filter: drop-shadow(0 3px 0 rgba(201, 166, 107, 0.35));
    }

    /* 背景飄動剪紙雲層 */
    .sc-bg-clouds {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .sc-bg-cloud {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0.85;
      filter: drop-shadow(0 3px 0 rgba(201, 166, 107, 0.2));
      will-change: transform;
    }

    /* 底部剪紙雲海與雲層扣血線 */
    .sc-cloud-sea {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 24%;
      pointer-events: none;
      z-index: 4;
    }
    .sc-cloud-sea svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .sc-cloud-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 0;
      border-top: 3px dashed var(--berry-dk, #B3262B);
      opacity: 0.78;
      pointer-events: none;
      z-index: 5;
    }
    .sc-cloud-tag {
      position: absolute;
      left: 14px;
      top: -28px;
      padding: 2px 10px;
      border-radius: 9px 7px 10px 6px;
      background: var(--card, #FFF8E6);
      border: 2px solid var(--kraft, #E4CC9C);
      box-shadow: 0 2px 0 rgba(94, 72, 56, 0.14);
      font-size: 13px;
      font-weight: 700;
      color: #8F1D22;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .sc-cloud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--berry, #E5484D);
      display: inline-block;
    }

    /* 動態圖層：氣球、橡果彈、特效、小狐狸 */
    .sc-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .sc-layer-balloons { z-index: 10; }
    .sc-layer-fx       { z-index: 16; }
    .sc-layer-plane    { z-index: 20; }

    /* =========================================================
       帶字紙氣球
       ========================================================= */
    .sc-balloon {
      position: absolute;
      top: 0;
      left: 0;
      width: 96px;
      height: 108px;
      margin-left: -48px;
      will-change: transform, opacity;
      z-index: 10;
    }

    .sc-balloon-body {
      position: relative;
      width: 96px;
      height: 92px;
      filter: drop-shadow(0 4px 0 rgba(94, 72, 56, 0.16));
    }

    .sc-balloon-svg {
      position: absolute;
      inset: 0;
      width: 96px;
      height: 108px;
      overflow: visible;
    }

    /* 氣球中央高對比米白字卡（對比 12.9:1） */
    .sc-char-card {
      position: absolute;
      left: 10px;
      top: 9px;
      width: 76px;
      height: 70px;
      border-radius: 48% 52% 49% 51% / 47% 50% 50% 53%;
      background: var(--card, #FFF8E6);
      border: 2px solid rgba(94, 72, 56, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 -3px 0 rgba(201, 166, 107, 0.25);
    }

    .sc-char {
      font-family: var(--f-zh, "Bpmf Huninn", "Noto Sans TC", sans-serif);
      font-size: 46px;
      font-weight: 500;
      line-height: 1;
      color: var(--ink-1, #3B2A20);
      white-space: nowrap;
      text-align: center;
    }

    /* 英打字型切換 */
    .sc-root.sc-lang-en .sc-char {
      font-family: Consolas, monospace;
      font-weight: 700;
    }

    /* 依階級調整字級（皆 ≥ 40px，含注音清楚可讀） */
    .sc-root.sc-tier-t1 .sc-char { font-size: 46px; }
    .sc-root.sc-tier-t2 .sc-char { font-size: 44px; }
    .sc-root.sc-tier-t3 .sc-char { font-size: 40px; }

    /* 非目前目標：略顯樸素，不搶焦點 */
    .sc-balloon:not(.sc-balloon-active) {
      opacity: 0.92;
    }
    .sc-balloon:not(.sc-balloon-active) .sc-char-card {
      background: var(--card-2, #FDF1D8);
    }

    /* 目前要打的氣球：天藍粗框＋虛線瞄準圈 */
    .sc-balloon.sc-balloon-active {
      z-index: 14;
      opacity: 1;
    }
    .sc-balloon.sc-balloon-active .sc-balloon-body {
      filter: drop-shadow(0 5px 0 rgba(31, 107, 156, 0.24));
    }
    .sc-balloon.sc-balloon-active .sc-char-card {
      background: var(--card, #FFF8E6);
      border: 3px solid var(--sky-dk, #1F6B9C);
    }

    .sc-aim-ring {
      position: absolute;
      left: -8px;
      top: -8px;
      width: 112px;
      height: 106px;
      border-radius: 50% 48% 51% 49% / 49% 51% 49% 51%;
      border: 3.5px dashed var(--sky-dk, #1F6B9C);
      opacity: 0;
      pointer-events: none;
    }
    .sc-balloon.sc-balloon-active .sc-aim-ring {
      opacity: 1;
    }

    /* 瞄準準星小點（上下左右 4 個） */
    .sc-aim-tick {
      position: absolute;
      background: var(--sky-dk, #1F6B9C);
      border-radius: 3px;
    }
    .sc-aim-tick-t { width: 4px; height: 10px; left: 50%; top: -7px; margin-left: -2px; }
    .sc-aim-tick-b { width: 4px; height: 10px; left: 50%; bottom: -7px; margin-left: -2px; }
    .sc-aim-tick-l { width: 10px; height: 4px; left: -7px; top: 50%; margin-top: -2px; }
    .sc-aim-tick-r { width: 10px; height: 4px; right: -7px; top: 50%; margin-top: -2px; }

    /* 打錯視覺：柔紅邊框＋小 ✗ 徽章（無滿版閃紅） */
    .sc-balloon.sc-balloon-miss .sc-char-card {
      border-color: var(--berry, #E5484D);
      background: #FFF1EE;
    }
    .sc-miss-badge {
      position: absolute;
      right: -4px;
      top: -4px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--berry, #E5484D);
      color: #FFF8E6;
      border: 2.5px solid var(--card, #FFF8E6);
      font-size: 16px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 0 rgba(94, 72, 56, 0.22);
      opacity: 0;
      z-index: 15;
    }
    .sc-balloon.sc-balloon-miss .sc-miss-badge {
      opacity: 1;
    }

    /* =========================================================
       小狐狸駕駛紙飛機
       ========================================================= */
    .sc-fox-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 116px;
      height: 82px;
      margin-left: -58px;
      will-change: transform;
    }

    .sc-fox-svg {
      width: 116px;
      height: 82px;
      display: block;
      filter: drop-shadow(0 4px 0 rgba(94, 72, 56, 0.2));
    }

    /* 飛行護目鏡預設隱藏，每連擊 10 下戴上 */
    .sc-goggles {
      opacity: 0;
    }
    .sc-fox-wrap.sc-goggles-on .sc-goggles {
      opacity: 1;
    }

    /* 連擊 10 下對話框「好準！」 */
    .sc-speech {
      position: absolute;
      left: 98px;
      top: -8px;
      padding: 6px 12px;
      border-radius: 14px 12px 14px 4px;
      background: var(--butter-soft, #FFF1B8);
      border: 2.5px solid var(--kraft-2, #C9A66B);
      box-shadow: 0 3px 0 rgba(94, 72, 56, 0.18);
      color: var(--ink-1, #3B2A20);
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
    }
    .sc-speech::before {
      content: "";
      position: absolute;
      left: -8px;
      bottom: 8px;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 8px solid var(--kraft-2, #C9A66B);
    }
    .sc-speech::after {
      content: "";
      position: absolute;
      left: -5px;
      bottom: 9px;
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-right: 7px solid var(--butter-soft, #FFF1B8);
    }

    /* 小狐狸靠畫面右側時，對話框自動翻到左側 */
    .sc-speech.sc-speech-left {
      left: auto;
      right: 98px;
      border-radius: 12px 14px 4px 14px;
    }
    .sc-speech.sc-speech-left::before {
      left: auto;
      right: -8px;
      border-right: none;
      border-left: 8px solid var(--kraft-2, #C9A66B);
    }
    .sc-speech.sc-speech-left::after {
      left: auto;
      right: -5px;
      border-right: none;
      border-left: 7px solid var(--butter-soft, #FFF1B8);
    }

    /* =========================================================
       橡果彈、爆破紙片、+1 飄字、雲層「噗」
       ========================================================= */
    .sc-acorn {
      position: absolute;
      top: 0;
      left: 0;
      width: 24px;
      height: 28px;
      margin-left: -12px;
      margin-top: -14px;
      will-change: transform, opacity;
      filter: drop-shadow(0 2px 0 rgba(94, 72, 56, 0.25));
    }

    .sc-scrap {
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 3px 6px 2px 5px;
      border: 1.5px solid rgba(59, 42, 32, 0.22);
      will-change: transform, opacity;
    }

    .sc-pop {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: center;
      font-family: "Fredoka", "Noto Sans TC", sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--leaf-dk, #2D7A38);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 12px;
      background: rgba(255, 248, 230, 0.92);
      border: 2px solid var(--leaf, #7CCB6F);
      box-shadow: 0 2px 0 rgba(45, 122, 56, 0.2);
      will-change: transform, opacity;
    }

    .sc-puff {
      position: absolute;
      top: 0;
      left: 0;
      width: 74px;
      height: 46px;
      margin-left: -37px;
      margin-top: -34px;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform, opacity;
    }
    .sc-puff-text {
      position: relative;
      z-index: 2;
      font-size: 18px;
      font-weight: 900;
      color: var(--berry-dk, #B3262B);
      letter-spacing: 1px;
    }
    .sc-puff-svg {
      position: absolute;
      inset: 0;
      width: 74px;
      height: 46px;
    }

    /* 暫停時強制鎖定所有 CSS 過渡與動畫 */
    .sc-root.sc-paused,
    .sc-root.sc-paused * {
      animation-play-state: paused !important;
      transition: none !important;
    }

    /* 護眼無障礙：減少動態偏好 */
    @media (prefers-reduced-motion: reduce) {
      .sc-root * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head><body>
  <script src="../../assets/typing/passages.js"></script>
  <script src="../../assets/typing/en-items.js"></script>
  <script src="../../assets/js/typing-core.js"></script>
  <script src="../../assets/js/typing-ui.js"></script>
  <script>
    TypingIsland.mount({
      unit: 12,
      title: '中打特攻',
      subtitle: '射擊類・中打',
      langs: ['zh'],
      homeUrl: '../../index.html',
      scene: function (api) {
        'use strict';

        /* =========================================================
           集中常數設定（速度、數量、顏色、時間參數）
           ========================================================= */
        var SCENE_CONFIG = {
          // 各階級畫面同時目標數：初階 3、進階 4、高階 5
          COUNT: { t1: 3, t2: 4, t3: 5 },
          // 各階級由頂端飄到雲層線的秒數（初階 ≥ 14 秒、進階 ≥ 10 秒、高階 ≥ 7 秒）
          FALL_SECONDS: { t1: 15.0, t2: 10.5, t3: 7.5 },
          // 非目前要打的氣球速度比例：慢慢飄，最多只降到 NON_TARGET_MAX_DROP，輪到它時還有大半段時間
          NON_TARGET_SPEED_RATIO: 0.35,
          NON_TARGET_MAX_DROP: 0.35,
          // 氣球從上方滑進畫面的進場速度倍率
          ENTRY_GLIDE_SPEED: 140,
          // 回合開始時氣球陸續飄入的間隔秒數
          STAGGER_INIT_SEC: 0.85,
          // 打中補新氣球時的微錯開秒數
          STAGGER_REFILL_SEC: 0.22,
          // 氣球尺寸與雲層線高度比例
          BALLOON_W: 96,
          BALLOON_H: 90,
          CLOUD_LINE_RATIO: 0.80,
          // 氣球水平左右微幅飄擺
          SWAY_AMP: 9,
          SWAY_SPEED: 1.3,
          // 小狐狸紙飛機水平追蹤速度、起跳高度與時間
          PLANE_FOLLOW_RATE: 10,
          PLANE_HOP_PX: 13,
          PLANE_HOP_SEC: 0.28,
          // 橡果彈飛行秒數
          ACORN_SEC: 0.12,
          // 氣球爆破小紙片數量與持續秒數
          SCRAP_COUNT: 9,
          SCRAP_SEC: 0.65,
          // reduced-motion 時氣球淡出秒數
          REDUCED_FADE_SEC: 0.26,
          // 打對飄字「✓ +1」與雲層「噗」持續秒數
          POP_SEC: 0.72,
          PUFF_SEC: 0.85,
          // 打錯溫和晃動秒數（1 個完整來回 ≈ 2.1Hz，遠低於 3 次/秒）與 ✗ 顯示秒數
          MISS_SHAKE_SEC: 0.48,
          MISS_SHAKE_AMP: 5,
          MISS_BADGE_SEC: 0.72,
          // 連擊里程碑：每 10 下戴上護目鏡並說「好準！」2 秒
          COMBO_STEP: 10,
          COMBO_CELEBRATE_SEC: 2.0,
          // 單幀時間差上限（秒）
          MAX_DT: 0.1,
          // 柔和繪本剪紙氣球色票（中央另有高對比 #FFF8E6 字卡配 #3B2A20 字）
          BALLOON_PALETTE: [
            { fill: '#FFE28A', stroke: '#C99635', knot: '#D9A73E', scraps: ['#FFD966', '#FFF1B8', '#FF9E7A'] },
            { fill: '#FFB79C', stroke: '#C96B4B', knot: '#D97B5A', scraps: ['#FF9E7A', '#FFDCCB', '#FFD966'] },
            { fill: '#B6E3AA', stroke: '#55964B', knot: '#68AB5D', scraps: ['#7CCB6F', '#D8F2D0', '#FFD966'] },
            { fill: '#D7CBF2', stroke: '#8474B3', knot: '#9686C4', scraps: ['#C6B6EA', '#EBE5FA', '#FF9E7A'] },
            { fill: '#F7D8A8', stroke: '#BF8D4C', knot: '#CE9D5C', scraps: ['#E4CC9C', '#FFF1B8', '#7CCB6F'] }
          ],
          // 目前目標氣球專用天藍重點色
          ACTIVE_BALLOON: { fill: '#D6EEFB', stroke: '#1F6B9C', knot: '#1F6B9C' }
        };

        /* =========================================================
           內部狀態（全部由單一 requestAnimationFrame 迴圈驅動，零 setTimeout）
           ========================================================= */
        var field = api.field;
        var reducedMql = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
        var running = false;
        var rafId = 0;
        var lastTime = 0;
        var elapsed = 0;

        var items = [];         // 畫面上的氣球，永遠與 api.upcoming 對齊
        var acorns = [];        // 飛行中的橡果彈
        var scraps = [];        // 氣球爆破小紙片
        var fadeOuts = [];      // reduced-motion 時的淡出氣球殘影
        var pops = [];          // 打對飄字（✓ +1 與小星星）
        var puffs = [];         // 雲層線「噗」雲煙
        var bgClouds = [];      // 遠景飄動雲朵

        var colorCursor = 0;
        var lastMilestone = 0;
        var gogglesTimer = 0;   // 護目鏡與「好準！」剩餘顯示秒數
        var planeX = 0;
        var planeTargetX = 0;
        var planeTilt = 0;
        var planeHopTimer = 0;
        var planeMissTimer = 0;
        var lastFieldW = 0;
        var lastFieldH = 0;

        // DOM 節點參照
        var rootEl, cloudLineEl, balloonLayer, fxLayer, planeLayer, foxWrapEl, speechEl;

        /* =========================================================
           工具函式
           ========================================================= */
        function isReducedMotion() {
          return !!(reducedMql && reducedMql.matches);
        }

        function getTier() {
          var t = (api.settings && api.settings.tier) || 't1';
          return SCENE_CONFIG.COUNT[t] ? t : 't1';
        }

        function getMaxCount() {
          return SCENE_CONFIG.COUNT[getTier()];
        }

        // 動態量測場景容器寬高（絕不寫死尺寸）
        function getSize() {
          var w = field.clientWidth || lastFieldW || 800;
          var h = field.clientHeight || lastFieldH || 300;
          if (field.clientWidth > 0) lastFieldW = field.clientWidth;
          if (field.clientHeight > 0) lastFieldH = field.clientHeight;
          return { w: w, h: h };
        }

        // 顯示國字一律使用 display（含破音字 IVS 選擇器），空白顯示成 ␣
        function formatDisplay(u) {
          if (!u || u.display == null) return '';
          return u.display === ' ' ? '␣' : u.display;
        }

        // 依軌道編號計算水平基準位置（避免氣球重疊或超出邊界）
        function laneToX(laneIndex, totalLanes, width) {
          var pad = Math.min(Math.max(width * 0.11, SCENE_CONFIG.BALLOON_W * 0.65), width * 0.24);
          if (totalLanes <= 1) return width * 0.5;
          var span = Math.max(40, width - pad * 2);
          return pad + (span * laneIndex) / (totalLanes - 1);
        }

        // 挑一個尚未被佔用的軌道（偏向交替分佈，讓紙飛機左右滑動更好玩）
        function pickFreeLane(totalLanes, avoidLane) {
          var used = {};
          for (var i = 0; i < items.length; i++) {
            used[items[i].lane] = true;
          }
          var free = [];
          for (var l = 0; l < totalLanes; l++) {
            if (!used[l]) free.push(l);
          }
          if (!free.length) return 0;
          if (free.length > 1 && avoidLane != null) {
            var filtered = free.filter(function (l) { return l !== avoidLane; });
            if (filtered.length) free = filtered;
          }
          return free[Math.floor(Math.random() * free.length)];
        }

        // 同步語系與階級樣式
        function applySettingsClasses() {
          if (!rootEl) return;
          var isEn = !!(api.settings && api.settings.lang === 'en');
          var tier = getTier();
          rootEl.classList.toggle('sc-lang-en', isEn);
          rootEl.classList.toggle('sc-tier-t1', tier === 't1');
          rootEl.classList.toggle('sc-tier-t2', tier === 't2');
          rootEl.classList.toggle('sc-tier-t3', tier === 't3');
        }

        /* =========================================================
           SVG 繪製：剪紙太陽、背景雲、雲海、氣球、小狐狸紙飛機、橡果、星星、「噗」
           ========================================================= */
        function buildSunSvg() {
          return (
            '<svg viewBox="0 0 80 80" width="68" height="68" aria-hidden="true">' +
              '<g fill="#FFD966" stroke="#C9A66B" stroke-width="1.8" stroke-linejoin="round">' +
                '<polygon points="40,4 45,16 35,16"/>' +
                '<polygon points="40,76 45,64 35,64"/>' +

        /* =========================================================
           建立靜態場景骨架（只放進 api.field 裡）
           ========================================================= */
        function buildSceneDom() {
          field.innerHTML = '';
          rootEl = document.createElement('div');
          rootEl.className = 'sc-root';
          rootEl.innerHTML =
            '<div class="sc-paper-grain"></div>' +
            '<div class="sc-sun">' + buildSunSvg() + '</div>' +
            '<div class="sc-bg-clouds"></div>' +
            '<div class="sc-cloud-sea">' + buildCloudSeaSvg() + '</div>' +
            '<div class="sc-cloud-line"><span class="sc-cloud-tag"><span class="sc-cloud-dot"></span>雲層線：飄到這裡少一顆愛心</span></div>' +
            '<div class="sc-layer sc-layer-balloons"></div>' +
            '<div class="sc-layer sc-layer-fx"></div>' +
            '<div class="sc-layer sc-layer-plane"></div>';

          field.appendChild(rootEl);

          cloudLineEl = rootEl.querySelector('.sc-cloud-line');
          balloonLayer = rootEl.querySelector('.sc-layer-balloons');
          fxLayer = rootEl.querySelector('.sc-layer-fx');
          planeLayer = rootEl.querySelector('.sc-layer-plane');

          // 建立 3 朵遠景飄動剪紙雲
          var bgCloudLayer = rootEl.querySelector('.sc-bg-clouds');
          var cloudSpecs = [
            { rx: 0.14, ry: 0.14, scale: 0.95, speed: 9 },
            { rx: 0.52, ry: 0.24, scale: 0.78, speed: 6.5 },
            { rx: 0.80, ry: 0.12, scale: 0.86, speed: 8 }
          ];
          bgClouds = [];
          var sz = getSize();
          cloudSpecs.forEach(function (spec) {
            var el = document.createElement('div');
            el.className = 'sc-bg-cloud';
            el.innerHTML = buildBgCloudSvg(spec.scale);
            bgCloudLayer.appendChild(el);
            bgClouds.push({
              el: el,
              x: sz.w * spec.rx,
              ry: spec.ry,
              w: Math.round(112 * spec.scale),
              speed: spec.speed
            });
          });

          // 建立小狐狸紙飛機與「好準！」對話框
          foxWrapEl = document.createElement('div');
          foxWrapEl.className = 'sc-fox-wrap';
          foxWrapEl.innerHTML =
            buildFoxPlaneSvg() +
            '<div class="sc-speech">' + buildStarSvg(16, '#FFD966') + '<span>好準！</span></div>';
          planeLayer.appendChild(foxWrapEl);
          speechEl = foxWrapEl.querySelector('.sc-speech');

          planeX = sz.w * 0.5;
          planeTargetX = planeX;
          applySettingsClasses();
          layoutStatic();
        }

        function layoutStatic() {
          var sz = getSize();
          var cloudY = Math.round(sz.h * SCENE_CONFIG.CLOUD_LINE_RATIO);
          if (cloudLineEl) {
            cloudLineEl.style.top = cloudY + 'px';
          }
          for (var i = 0; i < bgClouds.length; i++) {
            var c = bgClouds[i];
            c.el.style.transform = 'translate3d(' + Math.round(c.x) + 'px,' + Math.round(sz.h * c.ry) + 'px,0)';
          }
        }

        /* =========================================================
           氣球建立、對齊 upcoming、特效生成
           ========================================================= */
        function createBalloon(u, lane, totalLanes, delaySec, startY) {
          var sz = getSize();
          var palette = SCENE_CONFIG.BALLOON_PALETTE[colorCursor % SCENE_CONFIG.BALLOON_PALETTE.length];
          colorCursor++;

          var el = document.createElement('div');
          el.className = 'sc-balloon';
          el.innerHTML =
            '<div class="sc-balloon-body">' +
              '<div class="sc-aim-ring">' +
                '<span class="sc-aim-tick sc-aim-tick-t"></span>' +
                '<span class="sc-aim-tick sc-aim-tick-b"></span>' +
                '<span class="sc-aim-tick sc-aim-tick-l"></span>' +
                '<span class="sc-aim-tick sc-aim-tick-r"></span>' +
              '</div>' +
              '<div class="sc-svg-slot">' + buildBalloonSvg(palette, false) + '</div>' +
              '<div class="sc-char-card"><span class="sc-char"></span></div>' +
              '<div class="sc-miss-badge">✗</div>' +
            '</div>';

          var charEl = el.querySelector('.sc-char');
          charEl.textContent = formatDisplay(u);
          balloonLayer.appendChild(el);

          var baseX = laneToX(lane, totalLanes, sz.w);
          return {
            key: u.passageIndex + ':' + u.index,
            el: el,
            svgSlot: el.querySelector('.sc-svg-slot'),
            charEl: charEl,
            palette: palette,
            isActive: false,
            lane: lane,
            baseX: baseX,
            x: baseX,
            y: startY,
            swayPhase: Math.random() * Math.PI * 2,
            enterDelay: delaySec,
            entering: true,
            fadeIn: 0,
            missTimer: 0,
            missBadgeTimer: 0
          };
        }

        function setBalloonActive(it, active) {
          if (it.isActive === active) return;
          it.isActive = active;
          it.el.classList.toggle('sc-balloon-active', active);
          it.svgSlot.innerHTML = buildBalloonSvg(it.palette, active);
        }

        // 對齊畫面氣球與 api.upcoming(maxCount)
        function syncBalloons(isRoundInit, avoidLane) {
          applySettingsClasses();
          var maxCount = getMaxCount();
          var want = api.upcoming(maxCount) || [];
          var sz = getSize();

          // 先記錄目前畫面上還留著的氣球
          var existingMap = {};
          for (var i = 0; i < items.length; i++) {
            existingMap[items[i].key] = items[i];
          }

          var nextItems = [];
          var usedKeys = {};
          var newIndex = 0;

          // 第一輪：保留仍存在於 want 的氣球
          for (var j = 0; j < want.length; j++) {
            var k = want[j].passageIndex + ':' + want[j].index;
            if (existingMap[k] && !usedKeys[k]) {
              usedKeys[k] = true;
            }
          }

          // 移除不在 want 中的舊氣球
          for (var r = 0; r < items.length; r++) {
            if (!usedKeys[items[r].key]) {
              items[r].el.remove();
            }
          }
          items = items.filter(function (it) { return !!usedKeys[it.key]; });

          // 第二輪：依 want 順序組裝，缺的從上方補入
          for (var idx = 0; idx < want.length; idx++) {
            var u = want[idx];
            var key = u.passageIndex + ':' + u.index;
            var it = existingMap[key];

            if (it && usedKeys[key]) {
              // 確認顯示文字最新（永遠用 display）
              var txt = formatDisplay(u);
              if (it.charEl.textContent !== txt) it.charEl.textContent = txt;
              it.baseX = laneToX(it.lane, maxCount, sz.w);
              nextItems.push(it);
            } else {
              var lane = pickFreeLane(maxCount, avoidLane);
              var delay = isRoundInit
                ? (idx * SCENE_CONFIG.STAGGER_INIT_SEC)
                : (newIndex * SCENE_CONFIG.STAGGER_REFILL_SEC);
              var startY = isReducedMotion()
                ? 10
                : -(SCENE_CONFIG.BALLOON_H * (idx === 0 && isRoundInit ? 0.45 : 0.78));
              var created = createBalloon(u, lane, maxCount, delay, startY);
              items.push(created); // 讓下一個 pickFreeLane 知道此軌道已被佔用
              nextItems.push(created);
              newIndex++;
            }
          }

          items = nextItems;

          // 標記目前目標（index 0），確保它不會被延遲卡在畫面外
          for (var m = 0; m < items.length; m++) {
            var b = items[m];
            var active = (m === 0);
            setBalloonActive(b, active);
            if (active) {
              b.enterDelay = 0;
              if (isReducedMotion() && b.y < 10) b.y = 10;
            }
          }
        }

        // 發射橡果彈
        function spawnAcorn(targetX, targetY) {
          if (isReducedMotion()) return;
          var sz = getSize();
          var startX = planeX;
          var startY = Math.round(sz.h * SCENE_CONFIG.CLOUD_LINE_RATIO) - 34;

          var el = document.createElement('div');
          el.className = 'sc-acorn';
          el.innerHTML = buildAcornSvg();
          fxLayer.appendChild(el);

          var angle = Math.atan2(targetY - startY, targetX - startX) * (180 / Math.PI) + 90;
          acorns.push({
            el: el,
            sx: startX,
            sy: startY,
            tx: targetX,
            ty: targetY,
            angle: angle,
            t: 0,
            dur: SCENE_CONFIG.ACORN_SEC
          });
        }

        // 氣球破裂成彩色小紙片（reduced-motion 時改為氣球淡出、無粒子）
        function spawnBurst(balloon) {
          var cx = balloon.x;
          var cy = balloon.y + SCENE_CONFIG.BALLOON_H * 0.46;

          if (isReducedMotion()) {
            // 複製成靜態淡出氣球，不產生粒子
            var ghost = balloon.el.cloneNode(true);
            ghost.style.zIndex = '12';
            fxLayer.appendChild(ghost);
            fadeOuts.push({ el: ghost, t: 0, dur: SCENE_CONFIG.REDUCED_FADE_SEC });
            return;
          }

          var paletteScraps = balloon.palette.scraps;
          for (var i = 0; i < SCENE_CONFIG.SCRAP_COUNT; i++) {
            var angle = (Math.PI * 2 * i) / SCENE_CONFIG.SCRAP_COUNT + (Math.random() - 0.5) * 0.45;
            var speed = 65 + Math.random() * 95;
            var w = 8 + Math.round(Math.random() * 7);
            var h = 6 + Math.round(Math.random() * 6);
            var el = document.createElement('div');
            el.className = 'sc-scrap';
            el.style.width = w + 'px';
            el.style.height = h + 'px';
            el.style.background = paletteScraps[i % paletteScraps.length];
            fxLayer.appendChild(el);

            scraps.push({
              el: el,
              x: cx,
              y: cy,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 35,
              rot: Math.random() * 360,
              vrot: (Math.random() - 0.5) * 340,
              t: 0,
              dur: SCENE_CONFIG.SCRAP_SEC * (0.85 + Math.random() * 0.3)
            });
          }
        }

        // 打對開心回饋：「✓ +N」與小星星（偏置不擋住下一個字）
        function spawnHitPop(x, y, correctCount) {
          var sz = getSize();
          var safeX = Math.max(54, Math.min(sz.w - 54, x));
          var safeY = Math.max(16, y - 6);
          var el = document.createElement('div');
          el.className = 'sc-pop';
          el.innerHTML = buildStarSvg(16, '#FFD966') + '<span>✓ +' + correctCount + '</span>';
          fxLayer.appendChild(el);

          pops.push({
            el: el,
            x: safeX,
            y: safeY,
            t: 0,
            dur: SCENE_CONFIG.POP_SEC
          });
        }

        // 氣球碰雲層線時在雲層線畫一個小小的「噗」
        function spawnCloudPuff(x) {
          var sz = getSize();
          var cloudY = Math.round(sz.h * SCENE_CONFIG.CLOUD_LINE_RATIO);
          var safeX = Math.max(44, Math.min(sz.w - 44, x));
          var el = document.createElement('div');
          el.className = 'sc-puff';
          el.innerHTML = buildPuffSvg() + '<span class="sc-puff-text">噗</span>';
          fxLayer.appendChild(el);

          puffs.push({
            el: el,
            x: safeX,
            y: cloudY,
            t: 0,
            dur: SCENE_CONFIG.PUFF_SEC
          });
        }

        // 清除所有動態元素（回合開始時呼叫）
        function clearDynamicObjects() {
          items.forEach(function (it) { it.el.remove(); });
          acorns.forEach(function (a) { a.el.remove(); });
          scraps.forEach(function (s) { s.el.remove(); });
          fadeOuts.forEach(function (f) { f.el.remove(); });
          pops.forEach(function (p) { p.el.remove(); });
          puffs.forEach(function (u) { u.el.remove(); });
          items = [];
          acorns = [];
          scraps = [];
          fadeOuts = [];
          pops = [];
          puffs = [];
          gogglesTimer = 0;
          planeHopTimer = 0;
          planeMissTimer = 0;
          lastMilestone = 0;
          if (foxWrapEl) foxWrapEl.classList.remove('sc-goggles-on');
          if (speechEl) speechEl.style.opacity = '0';
        }

        /* =========================================================
           主更新與繪製（由 dt 驅動，確保任何螢幕幀率一致）
           ========================================================= */
        function update(dt) {
          elapsed += dt;
          var sz = getSize();
          var reduced = isReducedMotion();
          var cloudY = sz.h * SCENE_CONFIG.CLOUD_LINE_RATIO;
          var topY = 8;
          var floorY = Math.max(topY + 40, cloudY - SCENE_CONFIG.BALLOON_H * 0.90);
          var travelDist = floorY - topY;
          var fallSec = SCENE_CONFIG.FALL_SECONDS[getTier()];
          var baseSpeed = travelDist / fallSec;

          // 1. 遠景白雲緩慢飄動
          if (!reduced) {
            for (var c = 0; c < bgClouds.length; c++) {
              var cl = bgClouds[c];
              cl.x += cl.speed * dt;
              if (cl.x > sz.w + 20) cl.x = -cl.w - 20;
            }
          }

          // 2. 更新所有氣球位置與狀態
          var lifeLostThisFrame = false;
          for (var i = 0; i < items.length; i++) {
            var it = items[i];

            // 陸續飄入延遲倒數
            if (it.enterDelay > 0) {
              it.enterDelay = Math.max(0, it.enterDelay - dt);
              continue;
            }

            // 淡入係數
            if (it.fadeIn < 1) {
              it.fadeIn = Math.min(1, it.fadeIn + dt * 3.6);
            }

            // 從上方滑入畫面，進到頂部區後轉為正規下落速度
            if (it.entering && it.y < topY && !reduced) {
              it.y += SCENE_CONFIG.ENTRY_GLIDE_SPEED * dt;
              if (it.y >= topY) {
                it.y = topY;
                it.entering = false;
              }
            } else {
              it.entering = false;
              var speed = baseSpeed * (i === 0 ? 1 : SCENE_CONFIG.NON_TARGET_SPEED_RATIO);
              it.y += speed * dt;
            }

            // 氣球到達雲層線
            if (i === 0) {
              if (it.y >= floorY) {
                spawnCloudPuff(it.x);
                // 目標氣球重置回到頂端重新飄落（若愛心歸零共用核心會自動結束回合）
                it.y = reduced ? topY : -(SCENE_CONFIG.BALLOON_H * 0.42);
                it.entering = !reduced;
                it.fadeIn = reduced ? 0 : 1;
                lifeLostThisFrame = true;
              }
            } else {
              // 非目前目標在雲層線上方稍微懸浮等待輪到自己，不提前誤扣愛心
              var waitFloor = topY + travelDist * SCENE_CONFIG.NON_TARGET_MAX_DROP;
              if (it.y > waitFloor) it.y = waitFloor;
            }

            // 水平微擺與打錯輕晃
            var sway = reduced ? 0 : Math.sin(elapsed * SCENE_CONFIG.SWAY_SPEED + it.swayPhase) * SCENE_CONFIG.SWAY_AMP;
            var shake = 0;
            if (it.missTimer > 0) {
              it.missTimer = Math.max(0, it.missTimer - dt);
              if (!reduced) {
                var p = 1 - (it.missTimer / SCENE_CONFIG.MISS_SHAKE_SEC);
                shake = Math.sin(p * Math.PI * 2) * SCENE_CONFIG.MISS_SHAKE_AMP * (1 - p * 0.4);
              }
            }
            if (it.missBadgeTimer > 0) {
              it.missBadgeTimer = Math.max(0, it.missBadgeTimer - dt);
              if (it.missBadgeTimer === 0) {
                it.el.classList.remove('sc-balloon-miss');
              }
            }

            var margin = SCENE_CONFIG.BALLOON_W * 0.52;
            it.x = Math.max(margin, Math.min(sz.w - margin, it.baseX + sway + shake));
          }

          if (lifeLostThisFrame) {
            api.loseLife();
          }

          // 3. 小狐狸紙飛機左右追蹤目前目標氣球
          if (items.length > 0) {
            planeTargetX = items[0].x;
          } else {
            planeTargetX = sz.w * 0.5;
          }
          var planeMargin = 64;
          planeTargetX = Math.max(planeMargin, Math.min(sz.w - planeMargin, planeTargetX));

          if (reduced) {
            planeX = planeTargetX;
            planeTilt = 0;
          } else {
            var dx = planeTargetX - planeX;
            var step = dx * Math.min(1, SCENE_CONFIG.PLANE_FOLLOW_RATE * dt);
            planeX += step;
            planeTilt = Math.max(-10, Math.min(10, dx * 0.045));
          }

          if (planeHopTimer > 0) planeHopTimer = Math.max(0, planeHopTimer - dt);
          if (planeMissTimer > 0) planeMissTimer = Math.max(0, planeMissTimer - dt);

          // 4. 連擊每 10 下：護目鏡與「好準！」2 秒倒數
          if (gogglesTimer > 0) {
            gogglesTimer = Math.max(0, gogglesTimer - dt);
            if (gogglesTimer === 0) {
              foxWrapEl.classList.remove('sc-goggles-on');
            }
          }

          // 5. 更新飛行中的橡果彈
          for (var a = acorns.length - 1; a >= 0; a--) {
            var ac = acorns[a];
            ac.t += dt;
            if (ac.t >= ac.dur) {
              ac.el.remove();
              acorns.splice(a, 1);
            }
          }

          // 6. 更新氣球爆破小紙片
          for (var s = scraps.length - 1; s >= 0; s--) {
            var sc = scraps[s];
            sc.t += dt;
            if (sc.t >= sc.dur) {
              sc.el.remove();
              scraps.splice(s, 1);
            } else {
              sc.vy += 210 * dt;
              sc.x += sc.vx * dt;
              sc.y += sc.vy * dt;
              sc.rot += sc.vrot * dt;
            }
          }

          // 7. 更新 reduced-motion 淡出氣球
          for (var f = fadeOuts.length - 1; f >= 0; f--) {
            var fo = fadeOuts[f];
            fo.t += dt;
            if (fo.t >= fo.dur) {
              fo.el.remove();
              fadeOuts.splice(f, 1);
            }
          }

          // 8. 更新打對飄字
          for (var pIdx = pops.length - 1; pIdx >= 0; pIdx--) {
            var pop = pops[pIdx];
            pop.t += dt;
            if (pop.t >= pop.dur) {
              pop.el.remove();
              pops.splice(pIdx, 1);
            }
          }

          // 9. 更新雲層「噗」雲煙
          for (var uIdx = puffs.length - 1; uIdx >= 0; uIdx--) {
            var pf = puffs[uIdx];
            pf.t += dt;
            if (pf.t >= pf.dur) {
              pf.el.remove();
              puffs.splice(uIdx, 1);
            }
          }
        }

        function render() {
          var sz = getSize();
          var reduced = isReducedMotion();
          var cloudY = Math.round(sz.h * SCENE_CONFIG.CLOUD_LINE_RATIO);

          // 雲層線與遠景雲
          cloudLineEl.style.top = cloudY + 'px';
          for (var c = 0; c < bgClouds.length; c++) {
            var cl = bgClouds[c];
            cl.el.style.transform = 'translate3d(' + Math.round(cl.x) + 'px,' + Math.round(sz.h * cl.ry) + 'px,0)';
          }

          // 氣球位置與透明度
          for (var i = 0; i < items.length; i++) {
            var it = items[i];
            if (it.enterDelay > 0) {
              it.el.style.opacity = '0';
              it.el.style.transform = 'translate3d(' + Math.round(it.x) + 'px,' + Math.round(it.y) + 'px,0)';
              continue;
            }
            var baseOpacity = it.isActive ? 1 : 0.92;
            it.el.style.opacity = String((baseOpacity * it.fadeIn).toFixed(3));
            it.el.style.transform = 'translate3d(' + it.x.toFixed(1) + 'px,' + it.y.toFixed(1) + 'px,0)';
          }

          // 小狐狸紙飛機位置、起跳與傾斜
          var planeBaseY = Math.min(sz.h - 76, cloudY - 30);
          var hopOffset = 0;
          if (!reduced && planeHopTimer > 0) {
            var hp = 1 - (planeHopTimer / SCENE_CONFIG.PLANE_HOP_SEC);
            hopOffset = -Math.sin(hp * Math.PI) * SCENE_CONFIG.PLANE_HOP_PX;
          }
          var missShift = 0;
          if (!reduced && planeMissTimer > 0) {
            var mp = 1 - (planeMissTimer / SCENE_CONFIG.MISS_SHAKE_SEC);
            missShift = Math.sin(mp * Math.PI * 2) * 3.5;
          }
          var tilt = reduced ? 0 : planeTilt;
          foxWrapEl.style.transform =
            'translate3d(' + (planeX + missShift).toFixed(1) + 'px,' + (planeBaseY + hopOffset).toFixed(1) + 'px,0) rotate(' + tilt.toFixed(1) + 'deg)';

          // 連擊對話框「好準！」顯示與左右防溢位翻轉
          if (gogglesTimer > 0) {
            var fade = gogglesTimer < 0.25 ? (gogglesTimer / 0.25) : 1;
            speechEl.style.opacity = fade.toFixed(2);
            speechEl.classList.toggle('sc-speech-left', planeX > sz.w * 0.74);
          } else {
            speechEl.style.opacity = '0';
          }

          // 橡果彈
          for (var a = 0; a < acorns.length; a++) {
            var ac = acorns[a];
            var ap = Math.min(1, ac.t / ac.dur);
            var ax = ac.sx + (ac.tx - ac.sx) * ap;
            var ay = ac.sy + (ac.ty - ac.sy) * ap;
            ac.el.style.transform = 'translate3d(' + ax.toFixed(1) + 'px,' + ay.toFixed(1) + 'px,0) rotate(' + ac.angle.toFixed(1) + 'deg)';
            ac.el.style.opacity = String((1 - ap * 0.15).toFixed(2));
          }

          // 爆破小紙片
          for (var s = 0; s < scraps.length; s++) {
            var sc = scraps[s];
            var sp = Math.min(1, sc.t / sc.dur);
            sc.el.style.transform = 'translate3d(' + sc.x.toFixed(1) + 'px,' + sc.y.toFixed(1) + 'px,0) rotate(' + sc.rot.toFixed(0) + 'deg)';
            sc.el.style.opacity = String((1 - sp).toFixed(2));
          }

          // reduced-motion 淡出氣球
          for (var f = 0; f < fadeOuts.length; f++) {
            var fo = fadeOuts[f];
            var fp = Math.min(1, fo.t / fo.dur);
            fo.el.style.opacity = String((1 - fp).toFixed(2));
          }

          // 打對飄字
          for (var pIdx = 0; pIdx < pops.length; pIdx++) {
            var pop = pops[pIdx];
            var pp = Math.min(1, pop.t / pop.dur);
            var lift = reduced ? 0 : (-32 * pp);
            pop.el.style.transform = 'translate3d(' + (pop.x - 32).toFixed(1) + 'px,' + (pop.y + lift).toFixed(1) + 'px,0)';
            pop.el.style.opacity = String((1 - pp * pp).toFixed(2));
          }

          // 雲層線「噗」
          for (var uIdx = 0; uIdx < puffs.length; uIdx++) {
            var pf = puffs[uIdx];
            var up = Math.min(1, pf.t / pf.dur);
            var scVal = reduced ? 1 : (0.78 + Math.sin(Math.min(1, up * 2.2) * Math.PI * 0.5) * 0.3);
            var alpha = up > 0.6 ? (1 - (up - 0.6) / 0.4) : 1;
            pf.el.style.transform = 'translate3d(' + pf.x.toFixed(1) + 'px,' + pf.y.toFixed(1) + 'px,0) scale(' + scVal.toFixed(2) + ')';
            pf.el.style.opacity = String(Math.max(0, alpha).toFixed(2));
          }
        }

        function loop(now) {
          if (!running) return;
          var dt = Math.min(Math.max(now - lastTime, 0), SCENE_CONFIG.MAX_DT * 1000) / 1000;
          lastTime = now;

          // 若容器尺寸在動畫途中改變，自動重排軌道
          if (field.clientWidth > 0 && (field.clientWidth !== lastFieldW || field.clientHeight !== lastFieldH)) {
            handleResize();
          }

          update(dt);
          render();
          rafId = requestAnimationFrame(loop);
        }

        function handleResize() {
          var sz = getSize();
          var maxCount = getMaxCount();
          var cloudY = sz.h * SCENE_CONFIG.CLOUD_LINE_RATIO;
          var maxBalloonY = Math.max(12, cloudY - SCENE_CONFIG.BALLOON_H * 0.92);

          for (var i = 0; i < items.length; i++) {
            var it = items[i];
            if (it.lane >= maxCount) it.lane = i % maxCount;
            it.baseX = laneToX(it.lane, maxCount, sz.w);
            it.x = it.baseX;
            if (it.y > maxBalloonY) it.y = maxBalloonY;
          }
          planeX = Math.max(64, Math.min(sz.w - 64, planeX || sz.w * 0.5));
          layoutStatic();
          render();
        }

        /* =========================================================
           回傳給 TypingIsland 共用核心的生命週期介面
           ========================================================= */
        return {
          start: function () {
            buildSceneDom();
            syncBalloons(true);
            render();
          },

          roundStart: function () {
            if (!rootEl) buildSceneDom();
            clearDynamicObjects();
            var sz = getSize();
            planeX = sz.w * 0.5;
            planeTargetX = planeX;
            syncBalloons(true);
            render();
          },

          resume: function () {
            if (running) return;
            if (!rootEl) buildSceneDom();
            running = true;
            rootEl.classList.remove('sc-paused');
            lastTime = performance.now();
            rafId = requestAnimationFrame(loop);
          },

          pause: function () {
            running = false;
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = 0;
            }
            if (rootEl) rootEl.classList.add('sc-paused');
          },

          stop: function () {
            running = false;
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = 0;
            }
            if (rootEl) rootEl.classList.add('sc-paused');
          },

          hit: function (res) {
            var count = (res && res.correct) ? res.correct : 1;
            var lastFreedLane = null;
            var popX = planeX;
            var popY = 48;

            // 移走最前面被打對的氣球，並發射橡果彈與紙片爆破
            for (var i = 0; i < count && items.length > 0; i++) {
              var popped = items.shift();
              lastFreedLane = popped.lane;
              popX = popped.x;
              popY = popped.y;
              spawnAcorn(popped.x, popped.y + SCENE_CONFIG.BALLOON_H * 0.45);
              spawnBurst(popped);
              popped.el.remove();
            }

            spawnHitPop(popX, popY, count);
            planeHopTimer = SCENE_CONFIG.PLANE_HOP_SEC;

            // 連擊每滿 10 下，小狐狸戴上飛行護目鏡並說「好準！」2 秒
            var combo = (res && typeof res.combo === 'number') ? res.combo : api.combo();
            if (combo >= SCENE_CONFIG.COMBO_STEP) {
              var milestone = Math.floor(combo / SCENE_CONFIG.COMBO_STEP);
              if (milestone > lastMilestone) {
                lastMilestone = milestone;
                gogglesTimer = SCENE_CONFIG.COMBO_CELEBRATE_SEC;
                foxWrapEl.classList.add('sc-goggles-on');
              }
            } else {
              lastMilestone = 0;
            }

            // 立即對齊 upcoming 補上新氣球
            syncBalloons(false, lastFreedLane);
            render();
          },

          miss: function () {
            lastMilestone = 0;
            if (items[0]) {
              items[0].missTimer = SCENE_CONFIG.MISS_SHAKE_SEC;
              items[0].missBadgeTimer = SCENE_CONFIG.MISS_BADGE_SEC;
              items[0].el.classList.add('sc-balloon-miss');
            }
            planeMissTimer = SCENE_CONFIG.MISS_SHAKE_SEC;
            render();
          },

          resize: function () {
            if (!rootEl) return;
            handleResize();
          }
        };
      }
    });
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
