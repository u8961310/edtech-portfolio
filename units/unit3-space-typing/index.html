<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>太空打字防衛戰 - 打字島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@500;600&display=swap">
  <link rel="stylesheet" href="../../assets/css/typing-island.css">
  <style>
    /* 太空打字防衛戰：黃昏紙劇場剪紙風格（所有 class 一律以 sc- 開頭） */
    .sc-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      /* 黃昏紙劇場：淡薰衣草紫過渡到淡桃米色紙張底（護眼不刺眼、不用暗底） */
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 248, 230, 0.55) 0%, rgba(255, 248, 230, 0) 42%),
        radial-gradient(circle at 82% 24%, rgba(255, 241, 184, 0.42) 0%, rgba(255, 241, 184, 0) 40%),
        linear-gradient(180deg, #E5DCF2 0%, #EFE0EC 42%, #FDE5D2 78%, var(--paper, #F7E8CB) 100%);
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    }

    /* 細緻的紙纖維紋理層 */
    .sc-paper-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image:
        radial-gradient(rgba(116, 96, 78, 0.14) 1px, transparent 1px),
        radial-gradient(rgba(255, 248, 230, 0.45) 1px, transparent 1px);
      background-size: 22px 22px, 15px 15px;
      background-position: 0 0, 7px 9px;
    }

    /* 背景裝飾圖層（剪紙星球、靜態星星貼紙、雲層） */
    .sc-bg-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .sc-planet-saturn {
      position: absolute;
      left: 5%;
      top: 7%;
      width: 118px;
      height: 76px;
      filter: drop-shadow(2px 4px 0 rgba(59, 42, 32, 0.1));
    }

    .sc-planet-mini {
      position: absolute;
      right: 7%;
      top: 9%;
      width: 68px;
      height: 68px;
      filter: drop-shadow(2px 4px 0 rgba(59, 42, 32, 0.1));
    }

    .sc-planet-tiny {
      position: absolute;
      left: 36%;
      top: 11%;
      width: 34px;
      height: 34px;
      opacity: 0.88;
      filter: drop-shadow(1px 3px 0 rgba(59, 42, 32, 0.08));
    }

    /* 靜態小星星貼紙（不閃爍，維持護眼紙貼質感） */
    .sc-sticker-star {
      position: absolute;
      pointer-events: none;
      filter: drop-shadow(1px 2px 0 rgba(59, 42, 32, 0.12));
    }

    /* 底部剪紙月球表面 */
    .sc-moon-layer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 25%;
      min-height: 64px;
      pointer-events: none;
      z-index: 2;
    }

    .sc-moon-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 月球防線（流星碰到底線扣一顆愛心） */
    .sc-defense-line {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 2.5px dashed rgba(179, 38, 43, 0.65);
      pointer-events: none;
      z-index: 3;
    }

    .sc-defense-tag {
      position: absolute;
      left: 12px;
      top: -26px;
      padding: 2px 10px;
      border-radius: 8px 10px 8px 6px;
      background: var(--card, #FFF8E6);
      border: 2px solid var(--kraft-2, #C9A66B);
      color: var(--berry-dk, #B3262B);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      box-shadow: 0 2px 0 rgba(59, 42, 32, 0.1);
    }

    /* 隕石坑與小煙層 */
    .sc-crater-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .sc-crater {
      position: absolute;
      width: 44px;
      height: 16px;
      margin-left: -22px;
      margin-top: -8px;
      border-radius: 50%;
      background: #D8BE93;
      border: 2px solid var(--kraft-2, #C9A66B);
      box-shadow: inset 0 4px 0 rgba(94, 72, 56, 0.24), 0 1px 0 rgba(255, 248, 230, 0.7);
    }

    /* 光束 SVG 畫布（彩色紙帶光束） */
    .sc-beam-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    /* 紙流星目標層 */
    .sc-meteor-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* 單顆紙流星容器（中心點定位） */
    .sc-meteor {
      position: absolute;
      left: 0;
      top: 0;
      width: 78px;
      height: 78px;
      margin-left: -39px;
      margin-top: -39px;
      will-change: transform, opacity;
    }

    /* 流星背後短短的剪紙紙條尾巴 */
    .sc-meteor-tail {
      position: absolute;
      left: 50%;
      bottom: 70%;
      width: 34px;
      height: 44px;
      margin-left: -17px;
      z-index: 1;
      pointer-events: none;
    }

    .sc-tail-strip {
      position: absolute;
      bottom: 0;
      border-radius: 4px 4px 2px 2px;
      opacity: 0.82;
    }

    .sc-tail-a {
      left: 5px;
      width: 11px;
      height: 36px;
      background: linear-gradient(180deg, rgba(255, 220, 203, 0.08) 0%, var(--peach-soft, #FFDCCB) 55%, var(--peach, #FF9E7A) 100%);
      transform: rotate(-7deg);
      transform-origin: bottom center;
    }

    .sc-tail-b {
      right: 5px;
      width: 10px;
      height: 30px;
      background: linear-gradient(180deg, rgba(255, 241, 184, 0.08) 0%, var(--butter-soft, #FFF1B8) 55%, var(--butter, #FFD966) 100%);
      transform: rotate(8deg);
      transform-origin: bottom center;
    }

    .sc-meteor-active .sc-tail-a {
      height: 44px;
      background: linear-gradient(180deg, rgba(214, 238, 251, 0.1) 0%, var(--sky-soft, #D6EEFB) 52%, var(--sky-dk, #1F6B9C) 100%);
    }

    .sc-meteor-active .sc-tail-b {
      height: 36px;
      background: linear-gradient(180deg, rgba(255, 217, 102, 0.1) 0%, var(--butter-soft, #FFF1B8) 50%, var(--peach, #FF9E7A) 100%);
    }

    /* 背後剪紙圓角星輪廓 */
    .sc-meteor-star {
      position: absolute;
      inset: -7px;
      z-index: 1;
      pointer-events: none;
    }

    /* 紙流星主體卡紙圓片 */
    .sc-meteor-body {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      border-radius: 50% 48% 51% 49% / 49% 51% 48% 50%;
      background: var(--card, #FFF8E6);
      border: 3px solid var(--kraft-2, #C9A66B);
      box-shadow: 0 5px 0 rgba(59, 42, 32, 0.12), inset 0 -4px 0 rgba(201, 166, 107, 0.26);
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    /* 目前要打的目標：天藍粗框＋天藍虛線瞄準圈＋高對比奶油淺底 */
    .sc-meteor-active .sc-meteor-body {
      background: var(--butter-soft, #FFF1B8);
      border: 4px solid var(--sky-dk, #1F6B9C);
      outline: 3.5px dashed var(--sky-dk, #1F6B9C);
      outline-offset: 6px;
      box-shadow: 0 6px 0 rgba(31, 107, 156, 0.2), inset 0 -5px 0 rgba(214, 238, 251, 0.7);
    }

    /* 目前目標的瞄準小角標 */
    .sc-aim-tag {
      display: none;
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      padding: 1px 7px;
      border-radius: 99px;
      background: var(--sky-dk, #1F6B9C);
      color: var(--card, #FFF8E6);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
      box-shadow: 0 2px 0 rgba(59, 42, 32, 0.16);
    }

    .sc-meteor-active .sc-aim-tag {
      display: block;
    }

    /* 打錯時的柔和紅框＋✗ 徽章（對錯一律同時有符號） */
    .sc-meteor-miss .sc-meteor-body {
      background: #FFEBE8;
      border-color: var(--berry-dk, #B3262B);
      outline-color: var(--berry-dk, #B3262B);
    }

    .sc-miss-badge {
      display: none;
      position: absolute;
      right: -8px;
      top: -6px;
      z-index: 5;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--berry-dk, #B3262B);
      color: var(--card, #FFF8E6);
      font-size: 16px;
      font-weight: 900;
      line-height: 26px;
      text-align: center;
      border: 2px solid var(--card, #FFF8E6);
      box-shadow: 0 2px 0 rgba(59, 42, 32, 0.2);
    }

    .sc-meteor-miss .sc-miss-badge {
      display: block;
    }

    /* 目標文字：深棕字配淺底（對比度 > 11:1） */
    .sc-meteor-char {
      position: relative;
      z-index: 3;
      color: var(--ink-1, #3B2A20);
      font-family: var(--f-zh, 'Noto Sans TC', sans-serif);
      font-size: 44px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
    }

    /* 英打指定 Fredoka / Consolas 等寬友善字體，至少 44px */
    .sc-stage[data-lang="en"] .sc-meteor-char {
      font-family: 'Fredoka', Consolas, monospace;
      font-size: 46px;
      font-weight: 600;
    }

    /* 空白字元 ␣ 加上淡框幫助低年級辨識 */
    .sc-meteor-char.sc-char-space {
      padding: 0 6px 2px;
      border-radius: 8px;
      background: rgba(31, 107, 156, 0.1);
    }

    /* 小狐狸紙捲火箭砲台 */
    .sc-cannon {
      position: absolute;
      left: 0;
      top: 0;
      width: 96px;
      height: 86px;
      margin-left: -48px;
      margin-top: -66px;
      pointer-events: none;
      z-index: 6;
      will-change: transform;
      filter: drop-shadow(0 4px 0 rgba(59, 42, 32, 0.14));
    }

    /* 連擊每 10 下：月球小外星朋友舉牌「好厲害！」 */
    .sc-alien {
      position: absolute;
      bottom: 6px;
      width: 142px;
      height: 102px;
      pointer-events: none;
      z-index: 7;
      opacity: 0;
      will-change: transform, opacity;
      filter: drop-shadow(0 4px 0 rgba(59, 42, 32, 0.15));
    }

    /* 星星紙屑、煙霧與 +1 浮字圖層（不擋住目標字） */
    .sc-fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
    }

    .sc-particle {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .sc-smoke {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      background: #F0E3CC;
      border: 2px solid var(--kraft-2, #C9A66B);
      pointer-events: none;
      will-change: transform, opacity;
    }

    .sc-pop {
      position: absolute;
      left: 0;
      top: 0;
      padding: 2px 10px;
      border-radius: 10px 8px 10px 8px;
      background: var(--card, #FFF8E6);
      border: 2px solid var(--leaf-dk, #2D7A38);
      color: var(--leaf-dk, #2D7A38);
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      box-shadow: 0 3px 0 rgba(59, 42, 32, 0.12);
      will-change: transform, opacity;
    }

    /* 暫停時強制凍結任何潛在樣式過渡 */
    .sc-stage.sc-paused * {
      animation-play-state: paused !important;
      transition: none !important;
    }

    /* 系統偏好減少動態時關閉任何過渡效果 */
    @media (prefers-reduced-motion: reduce) {
      .sc-stage * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head><body>
  <script src="../../assets/typing/passages.js"></script>
  <script src="../../assets/typing/en-items.js"></script>
  <script src="../../assets/js/typing-core.js"></script>
  <script src="../../assets/js/typing-ui.js"></script>
  <script>
    /* 太空打字防衛戰：集中管理所有速度、數量、版面比例與視覺常數 */
    var SCENE_CONFIG = {
      /* 各階級同時在畫面上的紙流星數量（約束 6：初階 3、進階 4、高階 5） */
      TARGET_COUNT: { t1: 3, t2: 4, t3: 5 },
      /* 各階級從頂部掉到月球防線的總秒數（約束 6：初階 ≥14 秒、進階 10 秒、高階 7 秒） */
      FALL_SECONDS: { t1: 15, t2: 10, t3: 7 },
      /* 尚未輪到的目標速度比例與最大前進行程（約束 9：速度 1/3、最多走全程 1/3） */
      WAITING_SPEED_RATIO: 1 / 3,
      WAITING_MAX_PROGRESS: 1 / 3,
      /* 單幀時間差上限（約束 4：0.1 秒） */
      MAX_DT: 0.1,
      /* 場景動態比例（依 api.field 實際寬高即時計算，不寫死容器尺寸） */
      LAYOUT: {
        FLOOR_RATIO: 0.78,      // 月球防線位於場景高度的 78%
        MARGIN_X_RATIO: 0.11,   // 左右安全邊距佔寬度 11%
        METEOR_SIZE: 78,        // 紙流星基準直徑（px）
        METEOR_SIZE_SM: 70,     // 高度較窄時紙流星直徑（仍完整容納 ≥44px 字）
        COMPACT_HEIGHT: 245,    // 啟動緊湊尺寸的高度門檻
        CANNON_OFFSET_Y: 8,     // 小狐狸砲台貼齊月球表面的微調位移
        MAX_CRATERS: 8          // 月球表面最多保留的隕石坑數量
      },
      /* 動畫與回饋秒數（全部由 rAF 驅動，pause 時立刻凍結） */
      TIMING: {
        BEAM_DURATION: 0.25,        // 彩色紙帶光束持續 0.25 秒
        HIT_FADE_DURATION: 0.26,    // reduced-motion 模式打對淡出秒數
        SPAWN_FADE_DURATION: 0.24,  // 目標出生淡入秒數
        MISS_DURATION: 0.42,        // 打錯輕晃與 ✗ 提示持續秒數
        MISS_CYCLES: 1.5,           // 0.42 秒內輕晃 1.5 週期（約 2.4 次/秒，低於 3 次/秒）
        MISS_SHAKE_PX: 7,           // 打錯水平輕晃幅度
        CANNON_JUMP_DURATION: 0.28, // 打對時小狐狸砲台開心彈跳秒數
        CANNON_FOLLOW_SPEED: 11,    // 砲台水平平滑追蹤係數
        POP_DURATION: 0.68,         // +1 浮字存活秒數
        PARTICLE_MIN_LIFE: 0.42,    // 星星紙屑最短存活秒數
        PARTICLE_MAX_LIFE: 0.68,    // 星星紙屑最長存活秒數
        SMOKE_DURATION: 0.85,       // 撞擊小煙存活秒數
        ALIEN_DURATION: 2.0,        // 小外星朋友舉牌總停留秒數
        ALIEN_POP_TIME: 0.26        // 小外星朋友探頭與縮回各佔秒數
      },
      /* 粒子與連擊參數 */
      FX: {
        PARTICLE_COUNT: 9,          // 每顆流星碎成的星星紙屑數
        SMOKE_PUFFS: 3,             // 撞擊月球冒出的小煙朵數
        ALIEN_COMBO_STEP: 10        // 每 10 連擊召喚一次小外星朋友
      },
      /* 依循 system.md 色票（不另發明刺眼霓虹主色） */
      COLORS: {
        BEAM_RIBBONS: ['#1F6B9C', '#FFD966', '#FF9E7A', '#7CCB6F'],
        STAR_PARTICLES: ['#FFD966', '#FF9E7A', '#7CCB6F', '#D6EEFB', '#FFF8E6'],
        STAR_STROKE: '#5E4838'
      }
    };

    TypingIsland.mount({
      unit: 3,
      title: '太空打字防衛戰',
      subtitle: '射擊類・英打',
      langs: ['en'],
      homeUrl: '../../index.html',
      scene: function (api) {
        var SVG_NS = 'http://www.w3.org/2000/svg';
        var field = api.field;

        /* 場景狀態變數（全部集中管理，pause／stop 皆可安全凍結） */
        var initialized = false;
        var running = false;
        var rafId = 0;
        var lastTime = 0;

        /* DOM 圖層參考 */
        var stageEl = null;
        var defenseLineEl = null;
        var craterLayerEl = null;
        var beamSvgEl = null;
        var meteorLayerEl = null;
        var cannonEl = null;
        var alienEl = null;
        var fxLayerEl = null;

        /* 遊戲實體狀態 */
        var targets = [];       // 場上對齊 api.upcoming 的紙流星清單
        var beams = [];         // 彩色紙帶光束清單
        var particles = [];     // 星星紙屑粒子清單
        var ghosts = [];        // reduced-motion 模式打對淡出殘影
        var pops = [];          // +1 開心浮字清單
        var smokes = [];        // 撞擊月球小煙清單
        var craters = [];       // 月球表面小坑清單
        var lastUsedLane = -1;  // 避免連續新流星擠在同一軌道

        /* 小狐狸砲台與小外星朋友狀態 */
        var cannon = { x: 0, targetX: 0, jumpTimer: 0, missTimer: 0 };
        var alien = { active: false, elapsed: 0, side: 'right' };

        /* 偵測系統無障礙「減少動態」設定 */
        var reducedMotionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
        function isReducedMotion() {
          return !!(reducedMotionQuery && reducedMotionQuery.matches);
        }

        /* 取得目前難度設定（預設防呆回退到 t1） */
        function getTier() {
          var t = api.settings && api.settings.tier;
          return SCENE_CONFIG.TARGET_COUNT[t] ? t : 't1';
        }

        /* 動態量測 api.field 尺寸與關鍵座標，絕不寫死寬高 */
        function getMetrics() {
          var w = Math.max(field.clientWidth || 0, 320);
          var h = Math.max(field.clientHeight || 0, 180);
          var meteorSize = h < SCENE_CONFIG.LAYOUT.COMPACT_HEIGHT
            ? SCENE_CONFIG.LAYOUT.METEOR_SIZE_SM
            : SCENE_CONFIG.LAYOUT.METEOR_SIZE;
          var radius = meteorSize / 2;
          var floorY = Math.round(h * SCENE_CONFIG.LAYOUT.FLOOR_RATIO);
          var startY = Math.min(Math.max(radius + 8, h * 0.15), floorY - radius - 24);
          var endY = Math.max(startY + 24, floorY - radius + 4);
          var cannonY = floorY + SCENE_CONFIG.LAYOUT.CANNON_OFFSET_Y;
          return {
            w: w,
            h: h,
            meteorSize: meteorSize,
            radius: radius,
            floorY: floorY,
            startY: startY,
            endY: endY,
            cannonY: cannonY
          };
        }

        /* 建立背景剪紙場景（土星、圓圓小行星、靜態星星貼紙、月球表面、小狐狸砲台、小外星人） */
        function initDom() {
          if (initialized) return;
          initialized = true;
          field.innerHTML = '';

          stageEl = document.createElement('div');
          stageEl.className = 'sc-stage';

          /* 紙張紋理層 */
          var grain = document.createElement('div');
          grain.className = 'sc-paper-grain';
          stageEl.appendChild(grain);

          /* 背景剪紙裝飾層：土星環、圓圓小行星、不閃爍小星星貼紙 */
          var bg = document.createElement('div');
          bg.className = 'sc-bg-layer';
          bg.innerHTML =
            /* 左上剪紙土星 */
            '<svg class="sc-planet-saturn" viewBox="0 0 120 78" aria-hidden="true">' +
              '<ellipse cx="60" cy="41" rx="54" ry="15" transform="rotate(-14 60 41)" fill="none" stroke="#FFF8E6" stroke-width="11"/>' +
              '<ellipse cx="60" cy="41" rx="54" ry="15" transform="rotate(-14 60 41)" fill="none" stroke="#FF9E7A" stroke-width="6"/>' +
              '<circle cx="60" cy="39" r="24" fill="#FFF1B8" stroke="#FFF8E6" stroke-width="4"/>' +
              '<circle cx="60" cy="39" r="22" fill="#F8DE95" stroke="#C9A66B" stroke-width="2"/>' +
              '<path d="M40 34 Q60 28 80 34" fill="none" stroke="#E4CC9C" stroke-width="3" stroke-linecap="round"/>' +

        /* 產生靜態剪紙小星星貼紙 SVG 字串（無閃爍） */
        function makeStickerStarSvg(left, top, size, fill, rot) {
          return (
            '<svg class="sc-sticker-star" style="left:' + left + ';top:' + top + ';width:' + size + 'px;height:' + size + 'px;transform:rotate(' + rot + 'deg);" viewBox="0 0 24 24" aria-hidden="true">' +
              '<path d="M12 2.5 L14.8 8.5 L21.3 9.3 L16.5 13.8 L17.8 20.2 L12 17 L6.2 20.2 L7.5 13.8 L2.7 9.3 L9.2 8.5 Z" fill="' + fill + '" stroke="#FFF8E6" stroke-width="2" stroke-linejoin="round"/>' +
            '</svg>'
          );
        }

        /* 產生紙流星背後剪紙星形輪廓 SVG */
        function makeMeteorStarBg(isActive) {
          var fill = isActive ? '#D6EEFB' : '#F2E0BE';
          var stroke = isActive ? '#1F6B9C' : '#C9A66B';
          return (
            '<svg class="sc-meteor-star" viewBox="0 0 100 100" aria-hidden="true">' +
              '<path d="M50 4 L61 20 L80 15 L79 35 L96 46 L81 59 L86 78 L66 78 L56 96 L43 81 L24 86 L25 66 L7 56 L22 43 L17 24 L37 24 Z" fill="' + fill + '" stroke="' + stroke + '" stroke-width="2" stroke-linejoin="round" opacity="0.88"/>' +
            '</svg>'
          );
        }

        /* 挑選一個尚未被場上其他流星佔用的水平軌道，確保字絕對不重疊 */
        function pickLane(count) {
          var used = {};
          for (var i = 0; i < targets.length; i++) {
            used[targets[i].lane] = true;
          }
          var free = [];
          for (var lane = 0; lane < count; lane++) {
            if (!used[lane]) free.push(lane);
          }
          if (!free.length) {
            return Math.floor(Math.random() * count);
          }
          /* 若有多個空軌道，盡量避免跟剛出生的上一顆完全同一軌，讓小狐狸砲台左右滑動更好玩 */
          var candidates = free.length > 1
            ? free.filter(function (l) { return l !== lastUsedLane; })
            : free;
          var chosen = candidates[Math.floor(Math.random() * candidates.length)];
          lastUsedLane = chosen;
          return chosen;
        }

        /* 計算指定軌道對應的實際水平 x 像素座標 */
        function laneToX(lane, count, jitter, width) {
          var margin = width * SCENE_CONFIG.LAYOUT.MARGIN_X_RATIO;
          var usable = Math.max(width - margin * 2, 80);
          var base = margin + usable * ((lane + 0.5) / Math.max(count, 1));
          var maxJitter = Math.min(usable / Math.max(count, 1) * 0.12, 16);
          return base + jitter * maxJitter;
        }

        /* 建立單顆紙流星 DOM 元件（顯示字一律用 u.display，空白顯示 ␣） */
        function createMeteorElement(u, isActive) {
          var el = document.createElement('div');
          el.className = 'sc-meteor' + (isActive ? ' sc-meteor-active' : '');

          var tail = document.createElement('div');
          tail.className = 'sc-meteor-tail';
          tail.innerHTML = '<span class="sc-tail-strip sc-tail-a"></span><span class="sc-tail-strip sc-tail-b"></span>';
          el.appendChild(tail);

          var starWrap = document.createElement('div');
          starWrap.innerHTML = makeMeteorStarBg(isActive);
          el.appendChild(starWrap.firstChild);

          var body = document.createElement('div');
          body.className = 'sc-meteor-body';

          var charSpan = document.createElement('span');
          var rawDisplay = typeof u.display === 'string' ? u.display : '';
          var shownText = rawDisplay === ' ' ? '␣' : rawDisplay;
          charSpan.className = 'sc-meteor-char' + (rawDisplay === ' ' ? ' sc-char-space' : '');
          charSpan.textContent = shownText; // 用 textContent 保留原樣大小寫與 IVS，安全顯示標點
          body.appendChild(charSpan);
          el.appendChild(body);

          var aimTag = document.createElement('span');
          aimTag.className = 'sc-aim-tag';
          aimTag.textContent = '瞄準';
          el.appendChild(aimTag);

          var missBadge = document.createElement('span');
          missBadge.className = 'sc-miss-badge';
          missBadge.setAttribute('aria-hidden', 'true');
          missBadge.textContent = '✗';
          el.appendChild(missBadge);

          meteorLayerEl.appendChild(el);
          return el;
        }

        /* 切換紙流星是否為目前要打的目標（同步更新天藍虛線框與星形背板色） */
        function setMeteorActive(it, active) {
          if (it.active === active) return;
          it.active = active;
          it.el.classList.toggle('sc-meteor-active', active);
          var oldStar = it.el.querySelector('.sc-meteor-star');
          if (oldStar) {
            var tmp = document.createElement('div');
            tmp.innerHTML = makeMeteorStarBg(active);
            it.el.replaceChild(tmp.firstChild, oldStar);
          }
        }

        /* 與共用程式的 api.upcoming(n) 嚴格對齊紙流星清單 */
        function syncTargets() {
          var tier = getTier();
          var count = SCENE_CONFIG.TARGET_COUNT[tier];
          var want = api.upcoming(count) || [];
          var m = getMetrics();

          /* 先移掉多出來的尾巴目標 */
          while (targets.length > want.length) {
            var removed = targets.pop();
            if (removed && removed.el) removed.el.remove();
          }

          /* 逐一比對 key，對齊或補上新紙流星 */
          for (var i = 0; i < want.length; i++) {
            var u = want[i];
            var key = u.passageIndex + ':' + u.index;
            var it = targets[i];
            if (!it || it.key !== key) {
              if (it && it.el) it.el.remove();
              var lane = pickLane(count);
              var jitter = (Math.random() * 2 - 1);
              var isFirst = (i === 0);
              var el = createMeteorElement(u, isFirst);
              it = {
                key: key,
                el: el,
                lane: lane,
                laneCount: count,
                jitter: jitter,
                x: laneToX(lane, count, jitter, m.w),
                progress: isFirst ? 0 : Math.random() * 0.04,
                spawnTimer: SCENE_CONFIG.TIMING.SPAWN_FADE_DURATION,
                missTimer: 0,
                active: isFirst
              };
              targets[i] = it;
            } else {
              /* 階級或寬度變化時維持合理軌道與最新座標 */
              it.laneCount = count;
              if (it.lane >= count) it.lane = it.lane % count;
              it.x = laneToX(it.lane, count, it.jitter, m.w);
              setMeteorActive(it, i === 0);
            }
          }

          /* 讓小狐狸砲台瞄準目前的第 0 顆目標 */
          if (targets[0]) {
            cannon.targetX = targets[0].x;
          } else {
            cannon.targetX = m.w * 0.5;
          }
        }

        /* 清空上一回合留下的全部動態元素（約束 11） */
        function clearRoundEntities() {
          for (var i = 0; i < targets.length; i++) targets[i].el.remove();
          targets = [];

          for (var b = 0; b < beams.length; b++) beams[b].group.remove();
          beams = [];

          for (var p = 0; p < particles.length; p++) particles[p].el.remove();
          particles = [];

          for (var g = 0; g < ghosts.length; g++) ghosts[g].el.remove();
          ghosts = [];

          for (var f = 0; f < pops.length; f++) pops[f].el.remove();
          pops = [];

          for (var s = 0; s < smokes.length; s++) smokes[s].el.remove();
          smokes = [];

          for (var c = 0; c < craters.length; c++) craters[c].el.remove();
          craters = [];

          lastUsedLane = -1;
          cannon.jumpTimer = 0;
          cannon.missTimer = 0;
          alien.active = false;
          alien.elapsed = 0;
          if (alienEl) {
            alienEl.style.opacity = '0';
            alienEl.style.transform = 'translate3d(0, 110px, 0)';
          }
        }

        /* 產生一道彩色紙帶光束（0.25 秒，非刺眼雷射，rAF 驅動） */
        function spawnPaperBeam(fromX, fromY, toX, toY) {
          var group = document.createElementNS(SVG_NS, 'g');
          var lines = [];
          var colors = SCENE_CONFIG.COLORS.BEAM_RIBBONS;
          var dx = toX - fromX;
          var dy = toY - fromY;
          var len = Math.max(Math.hypot(dx, dy), 1);
          var nx = -dy / len;
          var ny = dx / len;

          for (var i = 0; i < colors.length; i++) {
            var offset = (i - (colors.length - 1) / 2) * 5.2;
            var line = document.createElementNS(SVG_NS, 'line');
            line.setAttribute('x1', (fromX + nx * offset).toFixed(1));
            line.setAttribute('y1', (fromY + ny * offset).toFixed(1));
            line.setAttribute('x2', (toX + nx * offset).toFixed(1));
            line.setAttribute('y2', (toY + ny * offset).toFixed(1));
            line.setAttribute('stroke', colors[i]);
            line.setAttribute('stroke-width', '4.2');
            line.setAttribute('stroke-linecap', 'round');
            group.appendChild(line);
            lines.push({ el: line, offset: offset });
          }

          beamSvgEl.appendChild(group);
          beams.push({
            group: group,
            lines: lines,
            fromX: fromX,
            fromY: fromY,
            toX: toX,
            toY: toY,
            nx: nx,
            ny: ny,
            elapsed: 0,
            duration: SCENE_CONFIG.TIMING.BEAM_DURATION
          });
        }

        /* 產生打對後的剪紙星星紙屑（reduced-motion 時不產生粒子） */
        function spawnStarConfetti(x, y) {
          if (isReducedMotion()) return;
          var count = SCENE_CONFIG.FX.PARTICLE_COUNT;
          var colors = SCENE_CONFIG.COLORS.STAR_PARTICLES;

          for (var i = 0; i < count; i++) {
            var el = document.createElement('div');
            el.className = 'sc-particle';
            var size = 12 + Math.random() * 10;
            var color = colors[i % colors.length];
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.innerHTML =
              '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" aria-hidden="true">' +
                '<path d="M12 2 L14.9 8.4 L21.8 9.2 L16.7 13.9 L18 20.8 L12 17.3 L6 20.8 L7.3 13.9 L2.2 9.2 L9.1 8.4 Z" fill="' + color + '" stroke="' + SCENE_CONFIG.COLORS.STAR_STROKE + '" stroke-width="1.6" stroke-linejoin="round"/>' +
              '</svg>';
            fxLayerEl.appendChild(el);

            var angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.45;
            var speed = 65 + Math.random() * 95;
            var life = SCENE_CONFIG.TIMING.PARTICLE_MIN_LIFE +
              Math.random() * (SCENE_CONFIG.TIMING.PARTICLE_MAX_LIFE - SCENE_CONFIG.TIMING.PARTICLE_MIN_LIFE);

            particles.push({
              el: el,
              x: x,
              y: y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 35,
              rot: Math.random() * 360,
              vrot: (Math.random() - 0.5) * 320,
              elapsed: 0,
              life: life
            });
          }
        }

        /* reduced-motion 模式：打對時改用溫和原地淡出，不晃動也沒有粒子 */
        function spawnFadeGhost(el, x, y, size) {
          var clone = el.cloneNode(true);
          clone.classList.remove('sc-meteor-miss');
          clone.style.width = size + 'px';
          clone.style.height = size + 'px';
          clone.style.marginLeft = (-size / 2) + 'px';
          clone.style.marginTop = (-size / 2) + 'px';
          clone.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
          fxLayerEl.appendChild(clone);
          ghosts.push({
            el: clone,
            elapsed: 0,
            duration: SCENE_CONFIG.TIMING.HIT_FADE_DURATION
          });
        }

        /* 產生打對時的 +1 開心浮字（放在目標上方偏側，避免遮擋下一個字） */
        function spawnScorePop(x, y, text) {
          var el = document.createElement('div');
          el.className = 'sc-pop';
          el.textContent = text;
          fxLayerEl.appendChild(el);
          pops.push({
            el: el,
            x: x,
            y: Math.max(24, y - 34),
            elapsed: 0,
            duration: SCENE_CONFIG.TIMING.POP_DURATION
          });
        }

        /* 流星落到月球表面：留下小坑並冒出一朵剪紙小煙 */
        function spawnImpactCraterAndSmoke(xRatio, m) {
          /* 月球表面小坑（以相對寬度比例儲存，resize 時不跑位） */
          var craterEl = document.createElement('div');
          craterEl.className = 'sc-crater';
          var yOffset = 10 + Math.random() * 14;
          craterLayerEl.appendChild(craterEl);
          craters.push({ el: craterEl, xRatio: xRatio, yOffset: yOffset });
          if (craters.length > SCENE_CONFIG.LAYOUT.MAX_CRATERS) {
            craters.shift().el.remove();
          }

          /* 冒出剪紙小煙（reduced-motion 改為 1 朵靜態淡出） */
          var puffs = isReducedMotion() ? 1 : SCENE_CONFIG.FX.SMOKE_PUFFS;
          var px = xRatio * m.w;
          var py = m.floorY + 6;
          for (var i = 0; i < puffs; i++) {
            var puffEl = document.createElement('div');
            puffEl.className = 'sc-smoke';
            var size = 18 + i * 7;
            puffEl.style.width = size + 'px';
            puffEl.style.height = size + 'px';
            puffEl.style.marginLeft = (-size / 2) + 'px';
            puffEl.style.marginTop = (-size / 2) + 'px';
            fxLayerEl.appendChild(puffEl);

            smokes.push({
              el: puffEl,
              x: px + (i - (puffs - 1) / 2) * 14,
              y: py,
              vx: (i - (puffs - 1) / 2) * 16,
              vy: -(24 + i * 8),
              elapsed: 0,
              duration: SCENE_CONFIG.TIMING.SMOKE_DURATION
            });
          }
        }

        /* 召喚月球上的小外星朋友舉牌「好厲害！」（停留 2 秒，避開砲台那一側） */
        function triggerAlienCelebrate() {
          var m = getMetrics();
          alien.active = true;
          alien.elapsed = 0;
          alien.side = cannon.x > m.w * 0.5 ? 'left' : 'right';
        }

        /* 依據目前狀態將所有元素繪製到正確位置（包含 resize 與暫停靜止畫面） */
        function renderAll() {
          var m = getMetrics();
          var reduced = isReducedMotion();

          /* 月球防線高度 */
          defenseLineEl.style.top = m.floorY + 'px';

          /* 繪製所有紙流星 */
          for (var i = 0; i < targets.length; i++) {
            var it = targets[i];
            it.x = laneToX(it.lane, it.laneCount, it.jitter, m.w);
            var y = m.startY + (m.endY - m.startY) * it.progress;

            var shakeX = 0;
            if (it.missTimer > 0 && !reduced) {
              var missProg = 1 - it.missTimer / SCENE_CONFIG.TIMING.MISS_DURATION;
              shakeX = Math.sin(missProg * Math.PI * 2 * SCENE_CONFIG.TIMING.MISS_CYCLES) *
                SCENE_CONFIG.TIMING.MISS_SHAKE_PX * (1 - missProg * 0.4);
            }

            var scale = it.active ? 1 : 0.91;
            var opacity = it.spawnTimer > 0
              ? Math.max(0, 1 - it.spawnTimer / SCENE_CONFIG.TIMING.SPAWN_FADE_DURATION)
              : 1;

            it.el.style.width = m.meteorSize + 'px';
            it.el.style.height = m.meteorSize + 'px';
            it.el.style.marginLeft = (-m.radius) + 'px';
            it.el.style.marginTop = (-m.radius) + 'px';
            it.el.style.opacity = opacity.toFixed(3);
            it.el.style.transform =
              'translate3d(' + (it.x + shakeX).toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) scale(' + scale + ')';
            it.el.classList.toggle('sc-meteor-miss', it.missTimer > 0);
          }

          /* 繪製小狐狸紙捲小火箭砲台 */
          var jumpY = 0;
          if (cannon.jumpTimer > 0 && !reduced) {
            var jp = 1 - cannon.jumpTimer / SCENE_CONFIG.TIMING.CANNON_JUMP_DURATION;
            jumpY = -Math.sin(jp * Math.PI) * 11;
          }
          var cannonShake = 0;
          if (cannon.missTimer > 0 && !reduced) {
            var mp = 1 - cannon.missTimer / SCENE_CONFIG.TIMING.MISS_DURATION;
            cannonShake = Math.sin(mp * Math.PI * 2 * SCENE_CONFIG.TIMING.MISS_CYCLES) * 4;
          }
          cannonEl.style.transform =
            'translate3d(' + (cannon.x + cannonShake).toFixed(1) + 'px,' + (m.cannonY + jumpY).toFixed(1) + 'px,0)';

          /* 繪製月球表面小坑 */
          for (var c = 0; c < craters.length; c++) {
            var cr = craters[c];
            cr.el.style.left = (cr.xRatio * m.w).toFixed(1) + 'px';
            cr.el.style.top = (m.floorY + cr.yOffset).toFixed(1) + 'px';
          }

          /* 繪製月球小外星朋友舉牌 */
          if (alien.active) {
            var dur = SCENE_CONFIG.TIMING.ALIEN_DURATION;
            var popT = SCENE_CONFIG.TIMING.ALIEN_POP_TIME;
            var showRatio = 1;
            if (alien.elapsed < popT) {
              showRatio = alien.elapsed / popT;
            } else if (alien.elapsed > dur - popT) {
              showRatio = Math.max(0, (dur - alien.elapsed) / popT);
            }

            alienEl.style.left = alien.side === 'left' ? '18px' : 'auto';
            alienEl.style.right = alien.side === 'right' ? '18px' : 'auto';
            if (reduced) {
              alienEl.style.opacity = showRatio.toFixed(3);
              alienEl.style.transform = 'translate3d(0, 0, 0)';
            } else {
              var slideY = (1 - showRatio) * 96;
              alienEl.style.opacity = Math.min(1, showRatio * 1.4).toFixed(3);
              alienEl.style.transform = 'translate3d(0,' + slideY.toFixed(1) + 'px,0)';
            }
          } else {
            alienEl.style.opacity = '0';
          }
        }

        /* 單一 rAF 主迴圈：所有位置、粒子、光束、煙霧與 2 秒舉牌皆由 dt 驅動 */
        function tick(now) {
          if (!running) return;
          var dt = Math.min(Math.max((now - lastTime) / 1000, 0), SCENE_CONFIG.MAX_DT);
          lastTime = now;

          var m = getMetrics();
          var tier = getTier();
          var fallSpeed = 1 / SCENE_CONFIG.FALL_SECONDS[tier]; // 每秒進度增量（0 -> 1）
          var reduced = isReducedMotion();

          /* 1. 更新紙流星掉落進度（未輪到的速度 1/3、最多走 1/3 全程） */
          for (var i = 0; i < targets.length; i++) {
            var it = targets[i];
            if (it.spawnTimer > 0) {
              it.spawnTimer = Math.max(0, it.spawnTimer - dt);
            }
            if (it.missTimer > 0) {
              it.missTimer = Math.max(0, it.missTimer - dt);
            }

            if (i === 0) {
              it.progress += fallSpeed * dt;
              if (it.progress >= 1) {
                /* 流星撞到月球防線：留下小坑＋小煙，呼叫 api.loseLife()，流星回到上方重新落下 */
                var hitXRatio = Math.min(0.92, Math.max(0.08, it.x / m.w));
                spawnImpactCraterAndSmoke(hitXRatio, m);
                it.progress = 0;
                it.spawnTimer = SCENE_CONFIG.TIMING.SPAWN_FADE_DURATION;
                api.loseLife();
                /* 若愛心歸零共用程式會在 loseLife() 內呼叫 pause()／stop()，立刻中止本幀 */
                if (!running) return;
              }
            } else {
              it.progress += fallSpeed * SCENE_CONFIG.WAITING_SPEED_RATIO * dt;
              if (it.progress > SCENE_CONFIG.WAITING_MAX_PROGRESS) {
                it.progress = SCENE_CONFIG.WAITING_MAX_PROGRESS;
              }
            }
          }

          /* 2. 更新小狐狸火箭砲台左右追蹤與跳躍狀態 */
          if (targets[0]) {
            cannon.targetX = targets[0].x;
          }
          if (reduced) {
            cannon.x = cannon.targetX;
          } else {
            cannon.x += (cannon.targetX - cannon.x) * Math.min(1, dt * SCENE_CONFIG.TIMING.CANNON_FOLLOW_SPEED);
          }
          if (cannon.jumpTimer > 0) cannon.jumpTimer = Math.max(0, cannon.jumpTimer - dt);
          if (cannon.missTimer > 0) cannon.missTimer = Math.max(0, cannon.missTimer - dt);

          /* 3. 更新彩色紙帶光束（0.25 秒） */
          for (var b = beams.length - 1; b >= 0; b--) {
            var bm = beams[b];
            bm.elapsed += dt;
            var bp = bm.elapsed / bm.duration;
            if (bp >= 1) {
              bm.group.remove();
              beams.splice(b, 1);
            } else {
              var extend = reduced ? 1 : Math.min(1, bp / 0.32);
              var alpha = bp < 0.35 ? 0.92 : Math.max(0, 0.92 * (1 - (bp - 0.35) / 0.65));
              bm.group.setAttribute('opacity', alpha.toFixed(3));
              for (var l = 0; l < bm.lines.length; l++) {
                var ln = bm.lines[l];
                var curX = bm.fromX + (bm.toX - bm.fromX) * extend + bm.nx * ln.offset;
                var curY = bm.fromY + (bm.toY - bm.fromY) * extend + bm.ny * ln.offset;
                ln.el.setAttribute('x2', curX.toFixed(1));
                ln.el.setAttribute('y2', curY.toFixed(1));
              }
            }
          }

          /* 4. 更新剪紙星星紙屑粒子 */
          for (var p = particles.length - 1; p >= 0; p--) {
            var pt = particles[p];
            pt.elapsed += dt;
            if (pt.elapsed >= pt.life) {
              pt.el.remove();
              particles.splice(p, 1);
            } else {
              pt.vy += 170 * dt; // 溫和重力感
              pt.x += pt.vx * dt;
              pt.y += pt.vy * dt;
              pt.rot += pt.vrot * dt;
              var pr = 1 - pt.elapsed / pt.life;
              pt.el.style.opacity = pr.toFixed(3);
              pt.el.style.transform =
                'translate3d(' + pt.x.toFixed(1) + 'px,' + pt.y.toFixed(1) + 'px,0) rotate(' + pt.rot.toFixed(1) + 'deg) scale(' + (0.55 + pr * 0.55).toFixed(2) + ')';
            }
          }

          /* 5. 更新 reduced-motion 淡出殘影 */
          for (var g = ghosts.length - 1; g >= 0; g--) {
            var gh = ghosts[g];
            gh.elapsed += dt;
            if (gh.elapsed >= gh.duration) {
              gh.el.remove();
              ghosts.splice(g, 1);
            } else {
              gh.el.style.opacity = (1 - gh.elapsed / gh.duration).toFixed(3);
            }
          }

          /* 6. 更新 +1 開心浮字 */
          for (var f = pops.length - 1; f >= 0; f--) {
            var po = pops[f];
            po.elapsed += dt;
            if (po.elapsed >= po.duration) {
              po.el.remove();
              pops.splice(f, 1);
            } else {
              var fp = po.elapsed / po.duration;
              var lift = reduced ? 0 : fp * 34;
              po.el.style.opacity = (1 - fp).toFixed(3);
              po.el.style.transform =
                'translate3d(' + po.x.toFixed(1) + 'px,' + (po.y - lift).toFixed(1) + 'px,0) translateX(-50%)';
            }
          }

          /* 7. 更新撞擊月球小煙 */
          for (var s = smokes.length - 1; s >= 0; s--) {
            var sm = smokes[s];
            sm.elapsed += dt;
            if (sm.elapsed >= sm.duration) {
              sm.el.remove();
              smokes.splice(s, 1);
            } else {
              var sp = sm.elapsed / sm.duration;
              if (!reduced) {
                sm.x += sm.vx * dt;
                sm.y += sm.vy * dt;
              }
              var smScale = reduced ? 1 : (0.85 + sp * 0.75);
              sm.el.style.opacity = (0.85 * (1 - sp)).toFixed(3);
              sm.el.style.transform =
                'translate3d(' + sm.x.toFixed(1) + 'px,' + sm.y.toFixed(1) + 'px,0) scale(' + smScale.toFixed(2) + ')';
            }
          }

          /* 8. 更新小外星朋友舉牌計時（2 秒後消失） */
          if (alien.active) {
            alien.elapsed += dt;
            if (alien.elapsed >= SCENE_CONFIG.TIMING.ALIEN_DURATION) {
              alien.active = false;
              alien.elapsed = 0;
            }
          }

          renderAll();
          rafId = requestAnimationFrame(tick);
        }

        /* 停止動畫迴圈的共用小幫手 */
        function haltLoop() {
          running = false;
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = 0;
          }
          if (stageEl) {
            stageEl.classList.add('sc-paused');
          }
        }

        return {
          /* 第一回合開始前呼叫一次：建立場景靜態元素 */
          start: function () {
            initDom();
            var lang = (api.settings && api.settings.lang) ? api.settings.lang : 'en';
            stageEl.setAttribute('data-lang', lang);
          },

          /* 每回合開始：清空上一回合元素並從 api.upcoming 重新建立紙流星 */
          roundStart: function () {
            initDom();
            var lang = (api.settings && api.settings.lang) ? api.settings.lang : 'en';
            stageEl.setAttribute('data-lang', lang);
            clearRoundEntities();
            syncTargets();
            var m = getMetrics();
            cannon.x = targets[0] ? targets[0].x : m.w * 0.5;
            cannon.targetX = cannon.x;
            renderAll();
          },

          /* 恢復動畫迴圈 */
          resume: function () {
            if (!initialized) initDom();
            if (running) return;
            running = true;
            stageEl.classList.remove('sc-paused');
            lastTime = performance.now();
            rafId = requestAnimationFrame(tick);
          },

          /* 暫停：立即停掉所有動畫（無任何 setTimeout / setInterval 殘留） */
          pause: function () {
            haltLoop();
          },

          /* 整局結束：停掉一切動畫 */
          stop: function () {
            haltLoop();
          },

          /* 打對：射出彩色紙帶光束、星星紙屑、砲台跳一下、+1、每 10 連擊外星朋友舉牌 */
          hit: function (res) {
            var m = getMetrics();
            var count = (res && res.correct) ? res.correct : 1;
            var reduced = isReducedMotion();
            var nozzleY = m.cannonY - 58;

            for (var i = 0; i < count && targets.length > 0; i++) {
              var hitTarget = targets.shift();
              var hitY = m.startY + (m.endY - m.startY) * hitTarget.progress;

              /* 從火箭砲口射出彩色紙帶光束（0.25 秒） */
              spawnPaperBeam(cannon.x, nozzleY, hitTarget.x, hitY);

              if (reduced) {
                spawnFadeGhost(hitTarget.el, hitTarget.x, hitY, m.meteorSize);
              } else {
                spawnStarConfetti(hitTarget.x, hitY);
              }

              if (i === 0) {
                spawnScorePop(hitTarget.x, hitY, '✓ +' + count);
              }

              hitTarget.el.remove();
            }

            /* 小狐狸火箭砲台開心跳一下 */
            if (!reduced) {
              cannon.jumpTimer = SCENE_CONFIG.TIMING.CANNON_JUMP_DURATION;
            }

            /* 連擊每滿 10 下，月球上的小外星朋友跳出來舉牌「好厲害！」 */
            var combo = (res && typeof res.combo === 'number') ? res.combo : api.combo();
            var prevCombo = Math.max(0, combo - count);
            var step = SCENE_CONFIG.FX.ALIEN_COMBO_STEP;
            if (combo > 0 && Math.floor(combo / step) > Math.floor(prevCombo / step)) {
              triggerAlienCelebrate();
            }

            syncTargets();
            renderAll();
          },

          /* 打錯：目標輕輕晃動並顯示柔和紅框＋✗，絕不整個場景閃紅 */
          miss: function () {
            if (targets[0]) {
              targets[0].missTimer = SCENE_CONFIG.TIMING.MISS_DURATION;
            }
            cannon.missTimer = SCENE_CONFIG.TIMING.MISS_DURATION;
            renderAll();
          },

          /* 視窗大小改變：即時重算寬高與所有物件位置 */
          resize: function () {
            if (!initialized) return;
            syncTargets();
            renderAll();
          }
        };
      }
    });
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
