<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太空打字防衛戰 - 英文打字</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        background: #000;
        color: #fff;
    }

    /* ===== Starry Background ===== */
    #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: radial-gradient(ellipse at center bottom, #1e1b4b 0%, #0c0a4a 30%, #000 100%);
    }
    .stars {
        position: absolute;
        inset: 0;
        background-image:
            radial-gradient(1px 1px at 20% 30%, white, transparent),
            radial-gradient(1px 1px at 60% 70%, white, transparent),
            radial-gradient(1px 1px at 80% 10%, white, transparent),
            radial-gradient(2px 2px at 30% 60%, white, transparent),
            radial-gradient(1px 1px at 90% 80%, white, transparent),
            radial-gradient(1px 1px at 50% 50%, white, transparent),
            radial-gradient(2px 2px at 70% 20%, #93c5fd, transparent),
            radial-gradient(1px 1px at 10% 90%, white, transparent),
            radial-gradient(1px 1px at 40% 20%, #fde047, transparent),
            radial-gradient(2px 2px at 85% 45%, white, transparent);
        background-size: 100% 100%;
        animation: stars-drift 60s linear infinite;
        opacity: 0.8;
    }
    @keyframes stars-drift {
        from { transform: translateY(0); }
        to { transform: translateY(-50px); }
    }

    /* ===== Screen Layout ===== */
    .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 50;
    }
    .hidden { display: none !important; }

    /* ===== Title ===== */
    .title-emoji {
        font-size: clamp(70px, 14vw, 140px);
        animation: float 3s ease-in-out infinite;
        text-shadow: 0 0 30px rgba(96,165,250,0.6);
    }
    @keyframes float {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(-15px) rotate(3deg); }
    }
    .title-text {
        font-size: clamp(36px, 6vw, 60px);
        font-weight: 900;
        color: #fde047;
        text-shadow: 0 0 20px rgba(253,224,71,0.5), 4px 4px 0 #1e3a8a;
        margin: 12px 0 4px;
        text-align: center;
    }
    .subtitle {
        font-size: clamp(16px, 2vw, 22px);
        color: #93c5fd;
        font-weight: 700;
        margin-bottom: 28px;
        text-align: center;
    }

    /* ===== Big Button ===== */
    .big-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(22px, 3vw, 32px);
        font-weight: 900;
        padding: 18px 48px;
        background: linear-gradient(180deg, #60a5fa, #2563eb);
        color: white;
        border: 3px solid #93c5fd;
        border-radius: 999px;
        box-shadow: 0 6px 0 #1d4ed8, 0 0 30px rgba(96,165,250,0.4);
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s;
        text-shadow: 2px 2px 0 #1e40af;
        margin: 8px;
    }
    .big-btn:hover { transform: translateY(-2px); }
    .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1d4ed8, 0 0 20px rgba(96,165,250,0.4); }
    .big-btn.gold {
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        border-color: #fde047;
        box-shadow: 0 6px 0 #b45309, 0 0 30px rgba(251,191,36,0.4);
        text-shadow: 2px 2px 0 #92400e;
    }
    .big-btn.gold:active { box-shadow: 0 2px 0 #b45309; }

    /* ===== Skill Tags on Start Screen ===== */
    .skill-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 28px;
    }
    .skill-chip {
        background: rgba(96,165,250,0.18);
        border: 2px solid #60a5fa;
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 16px;
        color: #dbeafe;
        text-align: center;
        min-width: 130px;
    }

    /* ===== HUD ===== */
    #hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: clamp(18px, 2.2vw, 24px);
        font-weight: 900;
        z-index: 40;
        pointer-events: none;
    }
    .hud-box {
        background: rgba(30,58,138,0.6);
        border: 2px solid #60a5fa;
        padding: 6px 16px;
        border-radius: 999px;
        backdrop-filter: blur(6px);
        color: #fef3c7;
        text-shadow: 1px 1px 0 #000;
    }
    .hud-box.warning {
        background: rgba(220,38,38,0.6);
        border-color: #fca5a5;
        animation: pulse 0.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    /* ===== Game Area ===== */
    #game-area {
        position: absolute;
        inset: 0;
        overflow: hidden;
    }

    /* ===== Earth (bottom defender) ===== */
    .earth {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        font-size: clamp(80px, 14vw, 140px);
        z-index: 5;
        filter: drop-shadow(0 -4px 12px rgba(96,165,250,0.4));
        animation: earth-rotate 30s linear infinite;
    }
    @keyframes earth-rotate {
        0%, 100% { transform: translateX(-50%) rotate(-3deg); }
        50% { transform: translateX(-50%) rotate(3deg); }
    }
    .earth.hit { animation: earth-shake 0.4s ease-in-out; }
    @keyframes earth-shake {
        0%, 100% { transform: translateX(-50%) translateY(0); }
        25% { transform: translateX(-50%) translateY(-15px) rotate(-8deg); }
        75% { transform: translateX(-50%) translateY(-5px) rotate(8deg); }
    }

    /* Cannon turret above earth */
    .turret {
        position: absolute;
        bottom: clamp(60px, 11vw, 120px);
        left: 50%;
        transform: translateX(-50%);
        font-size: clamp(36px, 5vw, 56px);
        z-index: 6;
    }

    /* ===== Alien ===== */
    .alien {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
        transition: filter 0.15s;
        will-change: top;
    }
    .alien-body {
        font-size: clamp(50px, 8vw, 72px);
        filter: drop-shadow(0 0 12px rgba(167,139,250,0.6));
        animation: alien-bob 1.5s ease-in-out infinite;
    }
    @keyframes alien-bob {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(-4px) rotate(3deg); }
    }
    .alien-word {
        font-family: 'Press Start 2P', monospace;
        background: rgba(0,0,0,0.7);
        border: 3px solid #60a5fa;
        border-radius: 8px;
        padding: 8px 14px;
        margin-top: 6px;
        font-size: clamp(20px, 3vw, 32px);
        font-weight: 900;
        letter-spacing: 4px;
        color: #fff;
        text-shadow: 2px 2px 0 #000;
        white-space: nowrap;
        box-shadow: 0 4px 0 #1d4ed8;
    }
    .alien.active .alien-word {
        border-color: #fde047;
        box-shadow: 0 0 20px #fde047, 0 4px 0 #ca8a04;
        animation: lock-pulse 0.8s ease-in-out infinite;
    }
    .alien.active .alien-body {
        filter: drop-shadow(0 0 18px #fde047);
    }
    @keyframes lock-pulse {
        0%, 100% { box-shadow: 0 0 20px #fde047, 0 4px 0 #ca8a04; }
        50% { box-shadow: 0 0 35px #fde047, 0 4px 0 #ca8a04; }
    }
    .alien-word .typed {
        color: #4ade80;
        text-shadow: 0 0 8px #22c55e, 2px 2px 0 #000;
    }
    .alien-word .pending {
        color: #fff;
    }
    .alien-word .next {
        color: #fde047;
        animation: next-blink 0.6s ease-in-out infinite;
    }
    @keyframes next-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }

    .alien.dying {
        animation: alien-die 0.5s ease-out forwards;
        pointer-events: none;
    }
    @keyframes alien-die {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; filter: brightness(3); }
        100% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    }

    /* ===== Laser Beam ===== */
    .laser {
        position: absolute;
        width: 6px;
        background: linear-gradient(180deg, transparent, #fde047 20%, #fbbf24 50%, #fde047 80%, transparent);
        transform-origin: bottom center;
        z-index: 8;
        filter: drop-shadow(0 0 8px #fde047);
        pointer-events: none;
        animation: laser-flash 0.18s ease-out forwards;
    }
    @keyframes laser-flash {
        0% { opacity: 1; transform: translateX(-50%) scaleY(0); transform-origin: bottom; }
        50% { opacity: 1; }
        100% { opacity: 0; }
    }

    /* ===== Particles ===== */
    .particle {
        position: absolute;
        font-size: 22px;
        pointer-events: none;
        animation: particle-pop 0.8s ease-out forwards;
        z-index: 15;
    }
    @keyframes particle-pop {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(0.3) translate(var(--dx), var(--dy)); opacity: 0; }
    }

    .score-popup {
        position: absolute;
        font-size: clamp(24px, 3vw, 36px);
        font-weight: 900;
        color: #fde047;
        text-shadow: 3px 3px 0 #b45309, 0 0 10px rgba(0,0,0,0.5);
        pointer-events: none;
        animation: score-rise 0.9s ease-out forwards;
        z-index: 20;
        transform: translate(-50%, -50%);
        font-family: 'Press Start 2P', monospace;
    }
    @keyframes score-rise {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
        20% { transform: translate(-50%, -80%) scale(1.2); opacity: 1; }
        100% { transform: translate(-50%, -180%) scale(1); opacity: 0; }
    }

    /* ===== Hint ===== */
    .hint-banner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(30,58,138,0.95);
        border: 4px solid #60a5fa;
        padding: 32px 48px;
        border-radius: 24px;
        box-shadow: 0 0 40px rgba(96,165,250,0.5);
        text-align: center;
        z-index: 60;
        animation: hint-pop 0.4s ease-out;
    }
    @keyframes hint-pop {
        from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
        to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .hint-emoji { font-size: clamp(50px, 8vw, 80px); margin-bottom: 8px; }
    .hint-text { font-size: clamp(24px, 3.5vw, 36px); font-weight: 900; color: #fde047; }
    .hint-sub { font-size: clamp(14px, 1.8vw, 18px); color: #dbeafe; margin-top: 6px; }

    /* ===== Level Title ===== */
    .level-title {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(40px, 7vw, 72px);
        font-weight: 900;
        color: #fde047;
        text-shadow: 4px 4px 0 #b45309, 0 0 30px rgba(253,224,71,0.6);
        z-index: 70;
        pointer-events: none;
        animation: level-title-anim 2.2s ease-out forwards;
        text-align: center;
        white-space: nowrap;
    }
    @keyframes level-title-anim {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
        25% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
    }

    .level-sub {
        position: absolute;
        top: 52%;
        left: 50%;
        transform: translateX(-50%);
        font-size: clamp(18px, 2.5vw, 26px);
        font-weight: 700;
        color: #93c5fd;
        z-index: 70;
        pointer-events: none;
        animation: level-title-anim 2.2s ease-out forwards;
        text-align: center;
    }

    /* ===== Earth damaged flash ===== */
    .danger-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at bottom center, rgba(239,68,68,0.4) 0%, transparent 50%);
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 4;
    }
    .danger-overlay.flash { animation: danger-flash 0.5s ease-out; }
    @keyframes danger-flash {
        0% { opacity: 0; }
        50% { opacity: 1; }
        100% { opacity: 0; }
    }

    /* ===== Certificate ===== */
    .certificate {
        background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 100%);
        border: 6px solid #fbbf24;
        border-radius: 24px;
        padding: 32px 48px;
        max-width: 600px;
        text-align: center;
        box-shadow: 0 0 60px rgba(251,191,36,0.4);
        position: relative;
        color: #fef3c7;
    }
    .cert-corner { position: absolute; font-size: 40px; }
    .cert-corner.tl { top: 8px; left: 12px; }
    .cert-corner.tr { top: 8px; right: 12px; }
    .cert-corner.bl { bottom: 8px; left: 12px; }
    .cert-corner.br { bottom: 8px; right: 12px; }
    .cert-title { font-size: clamp(28px, 4vw, 40px); font-weight: 900; color: #fde047; margin-bottom: 8px; text-shadow: 3px 3px 0 #1e3a8a; }
    .cert-body { font-size: clamp(18px, 2vw, 22px); color: #dbeafe; line-height: 1.8; margin: 16px 0; }
    .cert-stat { font-size: clamp(24px, 3vw, 32px); font-weight: 900; color: #fbbf24; margin: 8px 0; }
    .cert-stat-sub { font-size: clamp(16px, 2vw, 20px); color: #93c5fd; }
    .cert-rank { font-size: clamp(20px, 2.5vw, 28px); font-weight: 900; color: #fde047; margin-top: 16px; }

    @media print {
        body * { visibility: hidden; }
        body { background: white; }
        #end-screen .certificate, #end-screen .certificate * { visibility: visible; }
        #end-screen .certificate {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            background: white; color: #1e3a8a; border-color: #1e3a8a;
        }
        #end-screen .cert-title, #end-screen .cert-rank { color: #b45309; text-shadow: none; }
        #end-screen .cert-body, #end-screen .cert-stat, #end-screen .cert-stat-sub { color: #1e3a8a; }
    }
</style>
</head>
<body>

<div id="app">
    <div class="stars"></div>
    <div class="danger-overlay" id="danger-overlay"></div>

    <!-- ===== Start Screen ===== -->
    <div id="start-screen" class="screen">
        <div class="title-emoji">🛸🌍</div>
        <h1 class="title-text">太空打字防衛戰</h1>
        <p class="subtitle">外星人來了！用英文鍵盤保衛地球！</p>
        <button class="big-btn gold" onclick="startGame()">🚀 開始任務</button>
        <div class="skill-row">
            <div class="skill-chip">🔤 第 1 關<br>單一字母</div>
            <div class="skill-chip">🔡 第 2 關<br>2 字母短詞</div>
            <div class="skill-chip">📖 第 3 關<br>3 字母單字</div>
        </div>
    </div>

    <!-- ===== Game Screen ===== -->
    <div id="game-screen" class="hidden">
        <div id="hud">
            <div class="hud-box" id="hud-lives">❤️❤️❤️</div>
            <div class="hud-box" id="hud-level">第 1 關</div>
            <div class="hud-box" id="hud-score">⭐ 0</div>
        </div>
        <div id="game-area">
            <div class="turret" id="turret">🔫</div>
            <div class="earth" id="earth">🌍</div>
        </div>
    </div>

    <!-- ===== End Screen ===== -->
    <div id="end-screen" class="screen hidden" style="overflow-y: auto;">
        <div class="certificate">
            <span class="cert-corner tl">⭐</span>
            <span class="cert-corner tr">⭐</span>
            <span class="cert-corner bl">⭐</span>
            <span class="cert-corner br">⭐</span>
            <div style="font-size: 64px;" id="cert-trophy">🏆</div>
            <div class="cert-title" id="cert-title">太空打字勇者證書</div>
            <div class="cert-body">
                恭喜勇者完成<br>
                <strong>地球防衛任務</strong>
            </div>
            <div class="cert-stat">⭐ <span id="cert-score">0</span> 分</div>
            <div class="cert-stat-sub">擊落外星人 <span id="cert-kills">0</span> 隻 · 準確率 <span id="cert-acc">0</span>%</div>
            <div class="cert-rank" id="cert-rank">🥈 稱號：地球小衛兵</div>
            <div style="margin-top: 16px; font-size: 14px; color: #93c5fd;" id="cert-date"></div>
        </div>
        <div style="margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
            <button class="big-btn gold" onclick="location.reload()">🔄 再次出擊</button>
            <button class="big-btn" onclick="window.print()">🖨️ 列印證書</button>
        </div>
    </div>
</div>

<script>
'use strict';

// ============================================================
// Audio
// ============================================================
let audioCtx = null;
function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}
function beep(freq, duration, type = 'square', volume = 0.12) {
    try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
    } catch (e) { /* audio unavailable */ }
}
function laserSound() {
    try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1200, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
    } catch (e) { /* audio unavailable */ }
}
const SFX = {
    type: () => beep(900, 0.05, 'square', 0.08),
    laser: () => laserSound(),
    boom: () => { laserSound(); setTimeout(() => beep(200, 0.2, 'sawtooth', 0.15), 50); },
    miss: () => beep(150, 0.1, 'sawtooth', 0.06),
    damage: () => { beep(220, 0.4, 'sawtooth', 0.2); setTimeout(() => beep(180, 0.3, 'sawtooth', 0.15), 100); },
    levelUp: () => [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'sine', 0.1), i * 80)),
    win: () => [523, 659, 784, 1047, 1319, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'sine', 0.12), i * 120)),
    lose: () => [400, 300, 200, 100].forEach((f, i) => setTimeout(() => beep(f, 0.25, 'sawtooth', 0.15), i * 200)),
};

// ============================================================
// Game State
// ============================================================
const state = {
    level: 1,
    lives: 3,
    score: 0,
    killsThisLevel: 0,
    totalKills: 0,
    correctKeys: 0,
    totalKeys: 0,
    aliens: [],
    spawnTimer: null,
    rafId: null,
    playing: false,
};

const LEVELS = {
    1: {
        label: '第 1 關 · 字母轟炸',
        sub: '按一個字母擊落外星人',
        words: 'abcdefghijklmnopqrstuvwxyz'.split(''),
        target: 8,
        spawnMs: 2800,
        fallSpeed: 0.045,  // px per ms
    },
    2: {
        label: '第 2 關 · 短字突襲',
        sub: '輸入 2 字母擊落',
        words: ['it','go','up','hi','am','is','of','at','in','to','on','no','we','he','me','my','do','if','so','as'],
        target: 8,
        spawnMs: 3200,
        fallSpeed: 0.055,
    },
    3: {
        label: '第 3 關 · 真實單字',
        sub: '輸入 3 字母單字',
        words: ['cat','dog','run','sun','bee','fox','pig','bug','sky','bus','egg','top','red','fun','hat','cup','box','toy','car','bag'],
        target: 8,
        spawnMs: 3600,
        fallSpeed: 0.065,
    },
};

const ALIEN_EMOJIS = ['👾','👽','🛸','👻','🤖','😈'];

// ============================================================
// Element Helpers
// ============================================================
const $ = (id) => document.getElementById(id);
const gameArea = () => $('game-area');

function particles(x, y, emojis, count = 8) {
    for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
        const dist = 70 + Math.random() * 50;
        p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        gameArea().appendChild(p);
        setTimeout(() => p.remove(), 800);
    }
}

function scorePopup(x, y, text) {
    const d = document.createElement('div');
    d.className = 'score-popup';
    d.textContent = text;
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    gameArea().appendChild(d);
    setTimeout(() => d.remove(), 900);
}

function showHint(emoji, text, sub, duration = 2400) {
    const banner = document.createElement('div');
    banner.className = 'hint-banner';
    banner.innerHTML = `<div class="hint-emoji">${emoji}</div><div class="hint-text">${text}</div><div class="hint-sub">${sub}</div>`;
    gameArea().appendChild(banner);
    setTimeout(() => {
        banner.style.transition = 'opacity 0.3s';
        banner.style.opacity = '0';
        setTimeout(() => banner.remove(), 300);
    }, duration);
}

function showLevelTitle(text, sub) {
    const t = document.createElement('div');
    t.className = 'level-title';
    t.textContent = text;
    const s = document.createElement('div');
    s.className = 'level-sub';
    s.textContent = sub;
    gameArea().appendChild(t);
    gameArea().appendChild(s);
    setTimeout(() => { t.remove(); s.remove(); }, 2200);
}

function updateHud() {
    $('hud-lives').textContent = '❤️'.repeat(state.lives) + '🖤'.repeat(3 - state.lives);
    $('hud-score').textContent = '⭐ ' + state.score;
    $('hud-level').textContent = `第 ${state.level} 關 (${state.killsThisLevel}/${LEVELS[state.level].target})`;
    if (state.lives === 1) $('hud-lives').classList.add('warning');
    else $('hud-lives').classList.remove('warning');
}

// ============================================================
// Aliens
// ============================================================
function spawnAlien() {
    if (!state.playing) return;
    const lvl = LEVELS[state.level];
    const word = lvl.words[Math.floor(Math.random() * lvl.words.length)];

    // Avoid spawning a word whose first letter conflicts with active alien's next letter
    // (prevents accidental targeting confusion)
    if (state.aliens.some(a => a.word.toLowerCase() === word.toLowerCase())) {
        // duplicate, try once more
        return setTimeout(spawnAlien, 200);
    }

    const margin = 80;
    const x = margin + Math.random() * (window.innerWidth - margin * 2);
    const y = -80;
    const emoji = ALIEN_EMOJIS[Math.floor(Math.random() * ALIEN_EMOJIS.length)];

    const el = document.createElement('div');
    el.className = 'alien';
    el.innerHTML = `<div class="alien-body">${emoji}</div><div class="alien-word"></div>`;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    gameArea().appendChild(el);

    const alien = {
        el,
        word: word.toLowerCase(),
        typed: '',
        x, y,
        speed: lvl.fallSpeed * (0.85 + Math.random() * 0.3),
        wordEl: el.querySelector('.alien-word'),
        dying: false,
    };
    state.aliens.push(alien);
    renderAlienWord(alien);
    refreshActiveAlien();
}

function renderAlienWord(alien) {
    const typed = alien.typed;
    const word = alien.word;
    let html = '';
    for (let i = 0; i < word.length; i++) {
        const ch = word[i].toUpperCase();
        if (i < typed.length) html += `<span class="typed">${ch}</span>`;
        else if (i === typed.length) html += `<span class="next">${ch}</span>`;
        else html += `<span class="pending">${ch}</span>`;
    }
    alien.wordEl.innerHTML = html;
}

function refreshActiveAlien() {
    // Active alien = lowest one on screen (closest to Earth) that isn't dying
    const alive = state.aliens.filter(a => !a.dying);
    if (alive.length === 0) return;
    let lowest = alive[0];
    alive.forEach(a => { if (a.y > lowest.y) lowest = a; });
    state.aliens.forEach(a => a.el.classList.toggle('active', a === lowest && !a.dying));
}

// ============================================================
// Update Loop (alien fall)
// ============================================================
let lastFrame = 0;
function loop(timestamp) {
    if (!state.playing) return;
    const dt = lastFrame ? timestamp - lastFrame : 16;
    lastFrame = timestamp;

    const earthTop = window.innerHeight - parseFloat(getComputedStyle($('earth')).fontSize) - 20;

    state.aliens.forEach(a => {
        if (a.dying) return;
        a.y += a.speed * dt;
        a.el.style.top = a.y + 'px';

        // Reached earth?
        if (a.y >= earthTop) {
            a.dying = true;
            alienReachesEarth(a);
        }
    });

    state.rafId = requestAnimationFrame(loop);
}

function alienReachesEarth(alien) {
    alien.el.remove();
    state.aliens = state.aliens.filter(a => a !== alien);
    state.lives--;
    SFX.damage();
    const earth = $('earth');
    earth.classList.remove('hit');
    void earth.offsetWidth;
    earth.classList.add('hit');
    const overlay = $('danger-overlay');
    overlay.classList.remove('flash');
    void overlay.offsetWidth;
    overlay.classList.add('flash');
    updateHud();
    refreshActiveAlien();
    if (state.lives <= 0) {
        endGame(false);
    }
}

// ============================================================
// Key Handler
// ============================================================
function handleKey(e) {
    if (!state.playing) return;
    if (e.key.length !== 1) return;
    const key = e.key.toLowerCase();
    if (!/^[a-z]$/.test(key)) return;
    state.totalKeys++;

    // Find active alien (lowest non-dying)
    const alive = state.aliens.filter(a => !a.dying);
    if (alive.length === 0) {
        SFX.miss();
        return;
    }
    let target = alive[0];
    alive.forEach(a => { if (a.y > target.y) target = a; });

    const expected = target.word[target.typed.length];
    if (key === expected) {
        state.correctKeys++;
        target.typed += key;
        SFX.type();
        renderAlienWord(target);
        fireLaser(target);
        if (target.typed.length >= target.word.length) {
            killAlien(target);
        }
    } else {
        SFX.miss();
        target.el.style.filter = 'brightness(1.5) hue-rotate(-30deg)';
        setTimeout(() => target.el.style.filter = '', 120);
    }
}

function fireLaser(target) {
    const turret = $('turret');
    const tr = turret.getBoundingClientRect();
    const ax = target.x;
    const ay = target.y;
    const startX = tr.left + tr.width / 2;
    const startY = tr.top + tr.height / 2;
    const dx = ax - startX;
    const dy = ay - startY;
    const length = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI + 90; // +90 because laser is vertical

    const laser = document.createElement('div');
    laser.className = 'laser';
    laser.style.left = startX + 'px';
    laser.style.top = (startY - length) + 'px';
    laser.style.height = length + 'px';
    laser.style.transform = `rotate(${angle}deg)`;
    laser.style.transformOrigin = `center ${length}px`;
    gameArea().appendChild(laser);
    SFX.laser();
    setTimeout(() => laser.remove(), 200);
}

function killAlien(alien) {
    alien.dying = true;
    alien.el.classList.add('dying');
    state.aliens = state.aliens.filter(a => a !== alien);
    SFX.boom();
    particles(alien.x, alien.y, ['💥','✨','⭐','🌟'], 10);
    const bonus = (alien.word.length * 10);
    state.score += bonus;
    state.killsThisLevel++;
    state.totalKills++;
    scorePopup(alien.x, alien.y, `+${bonus}`);
    setTimeout(() => alien.el.remove(), 500);
    updateHud();
    refreshActiveAlien();
    checkLevelClear();
}

// ============================================================
// Level Flow
// ============================================================
function checkLevelClear() {
    if (state.killsThisLevel >= LEVELS[state.level].target) {
        nextLevel();
    }
}

function nextLevel() {
    state.playing = false;
    clearInterval(state.spawnTimer);
    // Clear remaining aliens
    state.aliens.forEach(a => a.el.remove());
    state.aliens = [];

    if (state.level >= 3) {
        endGame(true);
        return;
    }

    state.level++;
    state.killsThisLevel = 0;
    SFX.levelUp();
    setTimeout(() => {
        startLevel();
    }, 800);
}

function startLevel() {
    const lvl = LEVELS[state.level];
    showLevelTitle(lvl.label, lvl.sub);
    updateHud();

    setTimeout(() => {
        state.playing = true;
        state.spawnTimer = setInterval(spawnAlien, lvl.spawnMs);
        spawnAlien();
        lastFrame = 0;
        state.rafId = requestAnimationFrame(loop);
    }, 2000);
}

// ============================================================
// Start / End
// ============================================================
function startGame() {
    state.level = 1;
    state.lives = 3;
    state.score = 0;
    state.killsThisLevel = 0;
    state.totalKills = 0;
    state.correctKeys = 0;
    state.totalKeys = 0;
    state.aliens = [];

    $('start-screen').classList.add('hidden');
    $('game-screen').classList.remove('hidden');
    getAudio();
    startLevel();
}

function endGame(isVictory) {
    state.playing = false;
    clearInterval(state.spawnTimer);
    cancelAnimationFrame(state.rafId);
    state.aliens.forEach(a => a.el.remove());
    state.aliens = [];

    try {
        const prev = parseInt(localStorage.getItem('edtech-unit3-score') || '0', 10);
        if (state.score > prev) localStorage.setItem('edtech-unit3-score', state.score);
    } catch (e) { /* localStorage unavailable */ }

    $('game-screen').classList.add('hidden');
    $('end-screen').classList.remove('hidden');

    const accuracy = state.totalKeys > 0 ? Math.round((state.correctKeys / state.totalKeys) * 100) : 100;
    $('cert-score').textContent = state.score;
    $('cert-kills').textContent = state.totalKills;
    $('cert-acc').textContent = accuracy;

    const today = new Date();
    $('cert-date').textContent = `${today.getFullYear() - 1911} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日 頒發`;

    if (isVictory) {
        SFX.win();
        $('cert-trophy').textContent = '👑';
        $('cert-title').textContent = '太空打字勇者證書';
        if (accuracy >= 90) {
            $('cert-rank').textContent = '🏆 稱號：黃金太空指揮官';
        } else if (accuracy >= 75) {
            $('cert-rank').textContent = '🥇 稱號：神準雷射射手';
        } else {
            $('cert-rank').textContent = '🥈 稱號：地球小衛兵';
        }
    } else {
        SFX.lose();
        $('cert-trophy').textContent = '💪';
        $('cert-title').textContent = '太空勇敢挑戰';
        $('cert-rank').textContent = '🥉 稱號：勇敢練習小新兵';
    }
}

// ============================================================
// Listeners
// ============================================================
document.addEventListener('keydown', handleKey);
window.addEventListener('resize', () => {
    // Keep aliens within bounds on resize
    state.aliens.forEach(a => {
        if (a.x > window.innerWidth - 60) {
            a.x = window.innerWidth - 60;
            a.el.style.left = a.x + 'px';
        }
    });
});
</script>
