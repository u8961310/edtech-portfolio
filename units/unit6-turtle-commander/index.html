<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烏龜小指揮官 - 運算思維入門</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<script defer src="../../assets/fullscreen.js"></script>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; overflow-x: hidden; }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        background: linear-gradient(180deg, #ccfbf1 0%, #5eead4 100%);
        color: #134e4a;
        min-height: 100vh;
    }

    .screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .hidden { display: none !important; }

    /* ===== Title ===== */
    .title-emoji {
        font-size: clamp(80px, 14vw, 140px);
        animation: turtle-walk 2s ease-in-out infinite;
    }
    @keyframes turtle-walk {
        0%, 100% { transform: translateX(-10px) rotate(-5deg); }
        50% { transform: translateX(10px) rotate(5deg); }
    }
    .title-text {
        font-size: clamp(34px, 5.5vw, 52px);
        font-weight: 900;
        color: #134e4a;
        text-shadow: 4px 4px 0 #fff, 6px 6px 0 #0f766e44;
        margin: 8px 0 4px;
        text-align: center;
    }
    .subtitle {
        font-size: clamp(16px, 2vw, 22px);
        color: #0f766e;
        font-weight: 700;
        margin-bottom: 24px;
        text-align: center;
    }

    /* ===== Big Button ===== */
    .big-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(20px, 2.6vw, 28px);
        font-weight: 900;
        padding: 14px 32px;
        background: linear-gradient(180deg, #4ade80, #16a34a);
        color: white;
        border: none;
        border-radius: 999px;
        box-shadow: 0 5px 0 #15803d, 0 8px 16px rgba(0,0,0,0.15);
        cursor: pointer;
        transition: transform 0.1s;
        text-shadow: 2px 2px 0 #14532d;
        margin: 6px;
    }
    .big-btn:hover { transform: translateY(-2px); }
    .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #15803d; }
    .big-btn.gold {
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        box-shadow: 0 5px 0 #b45309;
        text-shadow: 2px 2px 0 #92400e;
    }
    .big-btn.gold:active { box-shadow: 0 2px 0 #b45309; }
    .big-btn.gray {
        background: linear-gradient(180deg, #d1d5db, #9ca3af);
        box-shadow: 0 5px 0 #4b5563;
        text-shadow: 2px 2px 0 #4b5563;
    }

    /* ===== Game Layout (viewport-bounded) ===== */
    #game-screen {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 8px 12px 10px;
        gap: 6px;
        overflow: hidden;
    }
    .game-top {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 720px;
        flex-shrink: 0;
    }
    .info-box {
        background: rgba(255,255,255,0.85);
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 900;
        font-size: clamp(14px, 1.7vw, 18px);
        color: #134e4a;
        border: 2px solid #14b8a6;
    }
    .top-back {
        background: transparent;
        border: 2px solid #134e4a;
        color: #134e4a;
        font-family: 'Noto Sans TC', sans-serif;
        font-weight: 700;
        font-size: 14px;
        padding: 5px 12px;
        border-radius: 999px;
        cursor: pointer;
    }
    .top-back:hover { background: rgba(20,184,166,0.15); }
    .grid-area {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
    }
    .info-box.carrots { color: #b45309; border-color: #fbbf24; }

    /* ===== Grid ===== */
    .grid-wrap {
        background: white;
        border: 3px solid #134e4a;
        border-radius: 12px;
        padding: 5px;
        box-shadow: 0 5px 0 #14b8a6, 0 8px 12px rgba(0,0,0,0.15);
        max-width: 100%;
        max-height: 100%;
    }
    #grid {
        display: grid;
        gap: 2px;
        background: #14b8a6;
        border-radius: 6px;
        padding: 2px;
        position: relative;
    }
    .cell {
        background: #ecfdf5;
        background-image:
            linear-gradient(45deg, #d1fae5 25%, transparent 25%),
            linear-gradient(-45deg, #d1fae5 25%, transparent 25%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px;
        position: relative;
        aspect-ratio: 1 / 1;
        border-radius: 4px;
    }
    .cell.wall {
        background: linear-gradient(135deg, #78350f, #92400e);
        background-image:
            linear-gradient(45deg, #57321a 25%, transparent 25%),
            linear-gradient(-45deg, #57321a 25%, transparent 25%);
        background-size: 12px 12px;
        background-position: 0 0, 0 6px;
        box-shadow: inset 0 0 0 2px #3f1e08;
    }
    .cell .marker {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(24px, 5vw, 40px);
        animation: bob 2s ease-in-out infinite;
    }
    @keyframes bob {
        0%, 100% { transform: translate(-50%, -50%) translateY(0); }
        50% { transform: translate(-50%, -50%) translateY(-4px); }
    }
    .cell.start .marker {
        font-size: clamp(14px, 2.5vw, 20px);
        animation: none;
        color: #14532d;
        font-weight: 900;
    }

    /* ===== Turtle ===== */
    .turtle {
        position: absolute;
        font-size: clamp(28px, 5.5vw, 44px);
        z-index: 10;
        transition: top 0.4s ease-in-out, left 0.4s ease-in-out;
        pointer-events: none;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .turtle.bump { animation: bump 0.35s ease-out; }
    @keyframes bump {
        0% { transform: scale(1); }
        50% { transform: scale(0.85) translateY(4px); }
        100% { transform: scale(1); }
    }

    /* ===== Command Queue ===== */
    .queue-wrap {
        background: white;
        border: 3px solid #134e4a;
        border-radius: 12px;
        padding: 6px 12px;
        min-height: 52px;
        width: 100%;
        max-width: 600px;
        box-shadow: 0 3px 0 #14b8a6;
        flex-shrink: 0;
    }
    .queue-label {
        font-size: 12px;
        color: #0f766e;
        font-weight: 700;
        margin-bottom: 3px;
    }
    .queue {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
        min-height: 36px;
    }
    .queue-empty {
        color: #94a3b8;
        font-size: 14px;
        font-weight: 700;
    }
    .cmd-chip {
        background: linear-gradient(180deg, #fef3c7, #fde68a);
        border: 2px solid #f59e0b;
        border-radius: 8px;
        padding: 4px 10px;
        font-size: clamp(20px, 3vw, 28px);
        box-shadow: 0 2px 0 #b45309;
        font-weight: 900;
        position: relative;
    }
    .cmd-chip.current {
        background: linear-gradient(180deg, #4ade80, #16a34a);
        border-color: #14532d;
        box-shadow: 0 0 12px #4ade80, 0 2px 0 #14532d;
        color: white;
    }

    /* ===== Direction Buttons ===== */
    .controls {
        display: grid;
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(3, 52px);
        gap: 4px;
    }
    .controls .dir-btn {
        font-size: clamp(22px, 3vw, 28px);
        border: 2px solid #134e4a;
        background: linear-gradient(180deg, #67e8f9, #06b6d4);
        color: white;
        border-radius: 10px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 3px 0 #0e7490;
        transition: transform 0.1s;
        text-shadow: 2px 2px 0 #155e75;
    }
    .controls .dir-btn:hover { transform: translateY(-2px); }
    .controls .dir-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0e7490; }
    .controls .empty { visibility: hidden; }

    .action-buttons {
        display: flex;
        flex-direction: column;
        gap: 6px;
        justify-content: center;
    }
    .run-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(16px, 2vw, 22px);
        font-weight: 900;
        padding: 10px 22px;
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        border: 2px solid #b45309;
        color: white;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 4px 0 #92400e;
        text-shadow: 2px 2px 0 #92400e;
        transition: transform 0.1s;
        white-space: nowrap;
    }
    .run-btn:hover { transform: translateY(-2px); }
    .run-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #92400e; }
    .undo-btn, .reset-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(13px, 1.6vw, 16px);
        font-weight: 900;
        padding: 6px 14px;
        background: linear-gradient(180deg, #fca5a5, #ef4444);
        border: 2px solid #991b1b;
        color: white;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 3px 0 #991b1b;
        text-shadow: 2px 2px 0 #991b1b;
        white-space: nowrap;
    }
    .undo-btn:active, .reset-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #991b1b; }

    .control-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
    }

    /* ===== Particles ===== */
    .particle {
        position: absolute;
        font-size: 20px;
        pointer-events: none;
        z-index: 12;
        animation: particle-pop 0.7s ease-out forwards;
    }
    @keyframes particle-pop {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(0.3) translate(var(--dx), var(--dy)); opacity: 0; }
    }

    /* ===== Result Banner ===== */
    .banner {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 80;
        animation: fade-in 0.3s ease-out;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .banner-card {
        background: linear-gradient(135deg, #ecfdf5, #d1fae5);
        border: 8px solid #14b8a6;
        border-radius: 24px;
        padding: 28px 40px;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 16px 32px rgba(0,0,0,0.3);
    }
    .banner-trophy { font-size: clamp(64px, 12vw, 96px); }
    .banner-title { font-size: clamp(28px, 4vw, 40px); font-weight: 900; color: #134e4a; margin: 6px 0; }
    .banner-stars { font-size: clamp(40px, 6vw, 56px); margin: 8px 0; letter-spacing: 8px; }
    .banner-msg { font-size: clamp(16px, 2vw, 20px); font-weight: 700; color: #0f766e; }
    .banner-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    .banner.fail .banner-card {
        background: linear-gradient(135deg, #fef2f2, #fecaca);
        border-color: #ef4444;
    }
    .banner.fail .banner-title { color: #991b1b; }
    .banner.fail .banner-msg { color: #b91c1c; }

    /* ===== Certificate ===== */
    .certificate {
        background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
        border: 8px solid #14b8a6;
        border-radius: 24px;
        padding: 32px 40px;
        max-width: 600px;
        text-align: center;
        box-shadow: 0 16px 32px rgba(0,0,0,0.2);
        position: relative;
    }
    .cert-corner { position: absolute; font-size: 36px; }
    .cert-corner.tl { top: 8px; left: 12px; }
    .cert-corner.tr { top: 8px; right: 12px; }
    .cert-corner.bl { bottom: 8px; left: 12px; }
    .cert-corner.br { bottom: 8px; right: 12px; }
    .cert-title { font-size: clamp(28px, 4vw, 40px); font-weight: 900; color: #134e4a; margin-bottom: 8px; }
    .cert-body { font-size: clamp(18px, 2vw, 22px); color: #0f766e; line-height: 1.8; margin: 16px 0; }
    .cert-stat {
        font-size: clamp(22px, 3.5vw, 32px);
        letter-spacing: 1px;
        margin: 8px 0;
        word-break: break-word;
        line-height: 1.4;
        padding: 0 8px;
    }
    .cert-stat .lvl-line {
        display: inline-block;
        margin: 2px 6px;
        white-space: nowrap;
    }
    .cert-stat .lvl-label {
        font-size: 0.55em;
        color: #0f766e;
        margin-right: 4px;
        font-weight: 900;
    }
    .cert-rank { font-size: clamp(20px, 2.5vw, 28px); font-weight: 900; color: #134e4a; margin-top: 16px; }

    @media print {
        body * { visibility: hidden; }
        #end-screen .certificate, #end-screen .certificate * { visibility: visible; }
        #end-screen .certificate { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    }
</style>
</head>
<body>

<!-- ===== Start Screen ===== -->
<div id="start-screen" class="screen">
    <div class="title-emoji">🐢</div>
    <h1 class="title-text">烏龜小指揮官</h1>
    <p class="subtitle">用箭頭指揮烏龜，吃到所有胡蘿蔔！</p>
    <button class="big-btn gold" onclick="startGame()">▶ 開始挑戰</button>
    <div style="margin-top: 24px; max-width: 500px; background: rgba(255,255,255,0.7); padding: 16px 24px; border-radius: 16px; font-size: 16px; line-height: 1.8; font-weight: 700; color: #0f766e;">
        💡 <strong>怎麼玩</strong><br>
        1. 點箭頭按鈕加入指令<br>
        2. 按 ▶ 執行，烏龜會照著走<br>
        3. 吃到所有 🥕 就過關！
    </div>
</div>

<!-- ===== Game Screen ===== -->
<div id="game-screen" class="hidden">
    <div class="game-top">
        <button class="top-back" onclick="backToStart()">← 主畫面</button>
        <div class="info-box" id="level-info">第 1 關</div>
        <div class="info-box carrots" id="carrot-info">🥕 0 / 1</div>
        <div class="info-box" id="cmd-info">指令：0</div>
    </div>

    <div class="grid-area">
        <div class="grid-wrap">
            <div id="grid"></div>
        </div>
    </div>

    <div class="queue-wrap">
        <div class="queue-label">📜 你的指令序列</div>
        <div class="queue" id="queue">
            <span class="queue-empty">（還沒輸入指令）</span>
        </div>
    </div>

    <div class="control-row">
        <div class="controls">
            <div class="empty"></div>
            <button class="dir-btn" data-dir="up">⬆️</button>
            <div class="empty"></div>
            <button class="dir-btn" data-dir="left">⬅️</button>
            <div class="empty"></div>
            <button class="dir-btn" data-dir="right">➡️</button>
            <div class="empty"></div>
            <button class="dir-btn" data-dir="down">⬇️</button>
            <div class="empty"></div>
        </div>

        <div class="action-buttons">
            <button class="run-btn" id="run-btn" onclick="runCommands()">▶ 執行</button>
            <button class="undo-btn" onclick="undoCommand()">↶ 取消</button>
            <button class="reset-btn" onclick="resetQueue()">🗑️ 清空</button>
        </div>
    </div>
</div>

<!-- ===== End Screen ===== -->
<div id="end-screen" class="screen hidden">
    <div class="certificate">
        <span class="cert-corner tl">🐢</span>
        <span class="cert-corner tr">🥕</span>
        <span class="cert-corner bl">🥕</span>
        <span class="cert-corner br">🐢</span>
        <div style="font-size: 64px;" id="cert-trophy">🏆</div>
        <div class="cert-title">烏龜指揮官證書</div>
        <div class="cert-body">
            恭喜小指揮官完成<br>
            <strong>所有關卡的挑戰！</strong>
        </div>
        <div class="cert-stat" id="cert-stars">⭐⭐⭐</div>
        <div class="cert-rank" id="cert-rank">🥇 稱號：超棒小指揮</div>
        <div style="margin-top: 16px; font-size: 14px; color: #0f766e;" id="cert-date"></div>
    </div>
    <div style="margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
        <button class="big-btn" onclick="location.reload()">🔄 再玩一次</button>
        <button class="big-btn gold" onclick="window.print()">🖨️ 列印證書</button>
    </div>
</div>

<script>
'use strict';

// ============================================================
// Audio
// ============================================================
let audioCtx = null;
function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}
function beep(freq, duration, type = 'sine', volume = 0.1) {
    try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
    } catch (e) { /* audio unavailable */ }
}
const SFX = {
    step: () => beep(700, 0.08, 'square'),
    bump: () => beep(150, 0.2, 'sawtooth', 0.15),
    eat: () => { beep(800, 0.08); setTimeout(() => beep(1200, 0.1), 60); },
    addCmd: () => beep(600, 0.06, 'square'),
    win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.15), i * 100)),
    fail: () => [400, 300, 200].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'sawtooth'), i * 150)),
};

// ============================================================
// Levels
// ============================================================
const LEVELS = [
    {
        title: '第 1 關 · 直直走',
        cols: 6, rows: 3,
        start: { x: 0, y: 1 },
        carrots: [{ x: 5, y: 1 }],
        walls: [],
        minSteps: 5,
    },
    {
        title: '第 2 關 · 右轉下',
        cols: 6, rows: 4,
        start: { x: 0, y: 0 },
        carrots: [{ x: 4, y: 3 }],
        walls: [],
        minSteps: 7,
    },
    {
        title: '第 3 關 · 繞過牆',
        cols: 6, rows: 4,
        start: { x: 0, y: 1 },
        carrots: [{ x: 5, y: 1 }],
        walls: [{ x: 2, y: 1 }, { x: 3, y: 1 }],
        minSteps: 7,
    },
    {
        title: '第 4 關 · 雙轉折',
        cols: 6, rows: 5,
        start: { x: 0, y: 0 },
        carrots: [{ x: 5, y: 4 }],
        walls: [{ x: 2, y: 1 }, { x: 2, y: 2 }, { x: 3, y: 2 }, { x: 3, y: 3 }],
        minSteps: 9,
    },
    {
        title: '第 5 關 · 雙胡蘿蔔',
        cols: 6, rows: 4,
        start: { x: 0, y: 3 },
        carrots: [{ x: 2, y: 0 }, { x: 5, y: 3 }],
        walls: [{ x: 3, y: 1 }, { x: 3, y: 2 }],
        minSteps: 11,
    },
];

const DIR_DELTA = {
    up: { dx: 0, dy: -1 },
    down: { dx: 0, dy: 1 },
    left: { dx: -1, dy: 0 },
    right: { dx: 1, dy: 0 },
};
const DIR_EMOJI = { up: '⬆️', down: '⬇️', left: '⬅️', right: '➡️' };

// ============================================================
// State
// ============================================================
const state = {
    levelIdx: 0,
    queue: [],            // ['up','right',...]
    running: false,
    turtleX: 0,
    turtleY: 0,
    carrotsCollected: new Set(),
    totalStars: 0,
    levelStars: [],       // stars earned per level
};

const $ = (id) => document.getElementById(id);

// ============================================================
// Build grid
// ============================================================
function buildGrid() {
    const level = LEVELS[state.levelIdx];
    const grid = $('grid');
    grid.innerHTML = '';

    // Cells
    for (let y = 0; y < level.rows; y++) {
        for (let x = 0; x < level.cols; x++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.x = x;
            cell.dataset.y = y;
            if (level.walls.some(w => w.x === x && w.y === y)) cell.classList.add('wall');
            if (level.start.x === x && level.start.y === y) {
                cell.classList.add('start');
                const m = document.createElement('div');
                m.className = 'marker';
                m.textContent = 'START';
                cell.appendChild(m);
            }
            if (level.carrots.some(c => c.x === x && c.y === y)) {
                const m = document.createElement('div');
                m.className = 'marker';
                m.dataset.carrot = `${x},${y}`;
                m.textContent = '🥕';
                cell.appendChild(m);
            }
            grid.appendChild(cell);
        }
    }

    // Turtle
    const turtle = document.createElement('div');
    turtle.className = 'turtle';
    turtle.id = 'turtle';
    turtle.textContent = '🐢';
    grid.appendChild(turtle);

    state.turtleX = level.start.x;
    state.turtleY = level.start.y;
    state.carrotsCollected = new Set();
    sizeGrid();
    placeTurtle();
}

// Auto-fit grid to .grid-area (the flex:1 remaining space)
function sizeGrid() {
    const level = LEVELS[state.levelIdx];
    const grid = $('grid');
    const area = grid.closest('.grid-area');
    if (!area || area.clientWidth === 0) return;

    const wrapBorder = 3 * 2;   // .grid-wrap border
    const wrapPad = 5 * 2;      // .grid-wrap padding
    const gridPad = 2 * 2;      // #grid padding
    const gap = 2;

    const availW = area.clientWidth - wrapBorder - wrapPad - gridPad - (level.cols - 1) * gap;
    const availH = area.clientHeight - wrapBorder - wrapPad - gridPad - (level.rows - 1) * gap;
    const cellByW = availW / level.cols;
    const cellByH = availH / level.rows;
    const cell = Math.max(28, Math.floor(Math.min(cellByW, cellByH, 64)));

    grid.style.gridTemplateColumns = `repeat(${level.cols}, ${cell}px)`;
    grid.style.gridTemplateRows = `repeat(${level.rows}, ${cell}px)`;
    grid.style.width = (level.cols * cell + (level.cols - 1) * gap + gridPad) + 'px';
    grid.style.height = (level.rows * cell + (level.rows - 1) * gap + gridPad) + 'px';
}

function placeTurtle() {
    const turtle = $('turtle');
    const grid = $('grid');
    const level = LEVELS[state.levelIdx];
    const gridPad = 2;
    const gap = 2;
    const cellW = (grid.offsetWidth - gridPad * 2 - (level.cols - 1) * gap) / level.cols;
    const cellH = (grid.offsetHeight - gridPad * 2 - (level.rows - 1) * gap) / level.rows;
    turtle.style.width = cellW + 'px';
    turtle.style.height = cellH + 'px';
    turtle.style.left = (gridPad + state.turtleX * (cellW + gap)) + 'px';
    turtle.style.top = (gridPad + state.turtleY * (cellH + gap)) + 'px';
}

window.addEventListener('resize', () => {
    if (!$('game-screen').classList.contains('hidden')) {
        sizeGrid();
        placeTurtle();
    }
});

// ============================================================
// Queue
// ============================================================
function renderQueue(activeIdx = -1) {
    const q = $('queue');
    if (state.queue.length === 0) {
        q.innerHTML = '<span class="queue-empty">（還沒輸入指令）</span>';
    } else {
        q.innerHTML = '';
        state.queue.forEach((dir, i) => {
            const chip = document.createElement('div');
            chip.className = 'cmd-chip' + (i === activeIdx ? ' current' : '');
            chip.textContent = DIR_EMOJI[dir];
            q.appendChild(chip);
        });
    }
    $('cmd-info').textContent = `指令：${state.queue.length}`;
}

function addCommand(dir) {
    if (state.running) return;
    if (state.queue.length >= 30) return;
    state.queue.push(dir);
    SFX.addCmd();
    renderQueue();
}

function undoCommand() {
    if (state.running) return;
    state.queue.pop();
    SFX.bump();
    renderQueue();
}

function resetQueue() {
    if (state.running) return;
    state.queue = [];
    SFX.bump();
    renderQueue();
    resetLevel();
}

function resetLevel() {
    const level = LEVELS[state.levelIdx];
    state.turtleX = level.start.x;
    state.turtleY = level.start.y;
    state.carrotsCollected = new Set();
    placeTurtle();
    // Restore eaten carrot markers
    const grid = $('grid');
    level.carrots.forEach(c => {
        const key = `${c.x},${c.y}`;
        let m = grid.querySelector(`[data-carrot="${key}"]`);
        if (!m) {
            const cell = grid.querySelector(`.cell[data-x="${c.x}"][data-y="${c.y}"]`);
            if (cell) {
                m = document.createElement('div');
                m.className = 'marker';
                m.dataset.carrot = key;
                m.textContent = '🥕';
                cell.appendChild(m);
            }
        }
    });
    updateCarrotInfo();
}

function updateCarrotInfo() {
    const level = LEVELS[state.levelIdx];
    $('carrot-info').textContent = `🥕 ${state.carrotsCollected.size} / ${level.carrots.length}`;
}

// ============================================================
// Run
// ============================================================
async function runCommands() {
    if (state.running || state.queue.length === 0) return;
    state.running = true;
    resetLevel();
    const level = LEVELS[state.levelIdx];

    for (let i = 0; i < state.queue.length; i++) {
        renderQueue(i);
        const dir = state.queue[i];
        const { dx, dy } = DIR_DELTA[dir];
        const nx = state.turtleX + dx;
        const ny = state.turtleY + dy;

        const outOfBounds = nx < 0 || nx >= level.cols || ny < 0 || ny >= level.rows;
        const hitWall = level.walls.some(w => w.x === nx && w.y === ny);

        if (outOfBounds || hitWall) {
            // Bump animation
            const t = $('turtle');
            t.classList.remove('bump');
            void t.offsetWidth;
            t.classList.add('bump');
            SFX.bump();
            await sleep(420);
        } else {
            state.turtleX = nx;
            state.turtleY = ny;
            placeTurtle();
            SFX.step();
            await sleep(450);

            // Check carrot
            const key = `${nx},${ny}`;
            if (level.carrots.some(c => c.x === nx && c.y === ny) && !state.carrotsCollected.has(key)) {
                state.carrotsCollected.add(key);
                eatCarrot(nx, ny);
                updateCarrotInfo();
                await sleep(300);
            }
        }
    }

    renderQueue(-1);
    state.running = false;

    // Check win condition
    if (state.carrotsCollected.size === level.carrots.length) {
        levelClear();
    } else {
        levelFail();
    }
}

function eatCarrot(x, y) {
    const grid = $('grid');
    const marker = grid.querySelector(`[data-carrot="${x},${y}"]`);
    if (!marker) return;
    const rect = marker.getBoundingClientRect();
    const gridRect = grid.getBoundingClientRect();
    const cx = rect.left - gridRect.left + rect.width / 2;
    const cy = rect.top - gridRect.top + rect.height / 2;
    marker.remove();
    SFX.eat();
    for (let i = 0; i < 8; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = ['✨','⭐','🌟','💫'][i % 4];
        p.style.left = cx + 'px';
        p.style.top = cy + 'px';
        const angle = (Math.PI * 2 * i) / 8;
        const dist = 40 + Math.random() * 30;
        p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        grid.appendChild(p);
        setTimeout(() => p.remove(), 700);
    }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============================================================
// Clear / Fail
// ============================================================
function calcStars() {
    const level = LEVELS[state.levelIdx];
    const used = state.queue.length;
    if (used <= level.minSteps) return 3;
    if (used <= level.minSteps + 2) return 2;
    return 1;
}

function levelClear() {
    const stars = calcStars();
    state.totalStars += stars;
    state.levelStars[state.levelIdx] = stars;
    SFX.win();
    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.id = 'banner';
    const isLast = state.levelIdx >= LEVELS.length - 1;
    const minNote = state.queue.length > LEVELS[state.levelIdx].minSteps
        ? `<div style="font-size: 14px; color: #0f766e; margin-top: 4px;">💡 最少 ${LEVELS[state.levelIdx].minSteps} 步可以 3 星！</div>` : '';
    banner.innerHTML = `
        <div class="banner-card">
            <div class="banner-trophy">🎉</div>
            <div class="banner-title">過關！</div>
            <div class="banner-stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
            <div class="banner-msg">你用了 ${state.queue.length} 個指令</div>
            ${minNote}
            <div class="banner-actions">
                ${isLast
                    ? '<button class="big-btn gold" onclick="finishAllLevels()">🏆 領取證書</button>'
                    : '<button class="big-btn" onclick="nextLevel()">▶ 下一關</button>'}
                <button class="big-btn gray" onclick="closeBanner(); resetQueue();">🔄 再試一次</button>
            </div>
        </div>
    `;
    document.body.appendChild(banner);
}

function levelFail() {
    SFX.fail();
    const banner = document.createElement('div');
    banner.className = 'banner fail';
    banner.id = 'banner';
    banner.innerHTML = `
        <div class="banner-card">
            <div class="banner-trophy">🤔</div>
            <div class="banner-title">差一點！</div>
            <div class="banner-msg">還沒吃到全部胡蘿蔔，改一改指令再試試</div>
            <div class="banner-actions">
                <button class="big-btn" onclick="closeBanner()">📝 修改指令</button>
                <button class="big-btn gray" onclick="closeBanner(); resetQueue();">🗑️ 全部清空</button>
            </div>
        </div>
    `;
    document.body.appendChild(banner);
}

function closeBanner() {
    const b = $('banner');
    if (b) b.remove();
}

function nextLevel() {
    closeBanner();
    state.levelIdx++;
    state.queue = [];
    $('level-info').textContent = LEVELS[state.levelIdx].title;
    buildGrid();
    renderQueue();
    setTimeout(() => { sizeGrid(); placeTurtle(); }, 50);
}

function finishAllLevels() {
    closeBanner();
    try {
        const prev = parseInt(localStorage.getItem('edtech-unit6-score') || '0', 10);
        if (state.totalStars > prev) localStorage.setItem('edtech-unit6-score', state.totalStars);
    } catch (e) { /* localStorage unavailable */ }

    $('game-screen').classList.add('hidden');
    $('end-screen').classList.remove('hidden');

    const maxStars = LEVELS.length * 3;
    let starsHtml = '';
    for (let i = 0; i < LEVELS.length; i++) {
        const s = state.levelStars[i] || 0;
        starsHtml += `<span class="lvl-line"><span class="lvl-label">第${i+1}關</span>${'⭐'.repeat(s)}${'☆'.repeat(3 - s)}</span>`;
    }
    $('cert-stars').innerHTML = starsHtml;

    if (state.totalStars === maxStars) {
        $('cert-trophy').textContent = '👑';
        $('cert-rank').textContent = '🏆 稱號：完美指揮官大師';
    } else if (state.totalStars >= maxStars * 0.8) {
        $('cert-trophy').textContent = '🥇';
        $('cert-rank').textContent = '🥇 稱號：神準小指揮';
    } else if (state.totalStars >= maxStars * 0.6) {
        $('cert-trophy').textContent = '🥈';
        $('cert-rank').textContent = '🥈 稱號：勇敢小指揮';
    } else {
        $('cert-trophy').textContent = '💪';
        $('cert-rank').textContent = '🥉 稱號：努力練習小新兵';
    }

    const today = new Date();
    $('cert-date').textContent = `${today.getFullYear() - 1911} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日 頒發`;
}

// ============================================================
// Flow
// ============================================================
function startGame() {
    state.levelIdx = 0;
    state.queue = [];
    state.totalStars = 0;
    state.levelStars = [];
    $('start-screen').classList.add('hidden');
    $('end-screen').classList.add('hidden');
    $('game-screen').classList.remove('hidden');
    $('level-info').textContent = LEVELS[0].title;
    buildGrid();
    renderQueue();
    getAudio();
    setTimeout(() => { sizeGrid(); placeTurtle(); }, 50);
}

function backToStart() {
    closeBanner();
    $('game-screen').classList.add('hidden');
    $('end-screen').classList.add('hidden');
    $('start-screen').classList.remove('hidden');
}

// ============================================================
// Listeners
// ============================================================
document.querySelectorAll('.dir-btn').forEach(btn => {
    btn.addEventListener('click', () => addCommand(btn.dataset.dir));
});

// Dev shortcut: F8 → instantly trigger end-of-game certificate with sample stars
document.addEventListener('keydown', (e) => {
    if (e.key === 'F8') {
        e.preventDefault();
        state.levelStars = [3, 3, 2, 3, 2];
        state.totalStars = 13;
        $('start-screen').classList.add('hidden');
        $('game-screen').classList.add('hidden');
        finishAllLevels();
    }
});
</script>
