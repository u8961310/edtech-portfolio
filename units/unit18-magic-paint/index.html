<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>魔法畫畫屋 - 畫畫島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@600;700&display=swap">
  <link rel="stylesheet" href="../../assets/css/art-island.css">
  <style>
    /* ===== 魔法畫畫屋場景樣式（一律以 sc- 開頭，不覆寫 .ai- 共用樣式） ===== */
    .sc-tools {
      position: absolute;
      left: 20px;
      top: 8px;
      width: 244px;
      bottom: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-sizing: border-box;
    }
    .sc-sec-title {
      margin: 0;
      font: 700 16px/1.2 var(--f-ui);
      color: var(--ink-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 筆刷粗細按鈕 */
    .sc-sizes {
      display: flex;
      gap: 8px;
    }
    .sc-size {
      position: relative;
      flex: 1;
      height: 48px;
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-shadow: 0 4px 0 var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: transform 0.08s ease;
    }
    .sc-size:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }
    .sc-size i {
      display: block;
      border-radius: 50%;
      background: var(--ink);
    }

    /* 畫筆／彩虹筆／橡皮擦模式鈕 */
    .sc-modes {
      display: flex;
      gap: 7px;
    }
    .sc-mode {
      position: relative;
      flex: 1;
      height: 58px;
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-shadow: 0 4px 0 var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      padding: 4px 2px;
      color: var(--ink);
      font: 700 16px/1 var(--f-ui);
      white-space: nowrap;
      transition: transform 0.08s ease;
    }
    .sc-mode:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }
    .sc-mode svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* 彩虹筆視覺識別條 */
    .sc-mode-rainbow {
      background: linear-gradient(180deg, var(--card) 72%, #FFE8EC 100%);
    }

    /* 選中狀態：淺藍底＋藍框＋外圈 2px 藍＋右上角 ✓ 小圓 */
    .sc-on {
      background: var(--blue-soft) !important;
      border-color: var(--blue) !important;
      color: var(--blue) !important;
      box-shadow: 0 0 0 2px var(--blue), 0 4px 0 var(--ink) !important;
    }
    .sc-on::after {
      content: "✓";
      position: absolute;
      top: -8px;
      right: -8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--blue);
      color: #FFFFFF;
      border: 2px solid #FFFFFF;
      font: 900 13px/18px var(--f-ui);
      text-align: center;
      pointer-events: none;
    }

    /* 12 色色盤（4×3，每顆 46×46px） */
    .sc-colors {
      display: grid;
      grid-template-columns: repeat(4, 46px);
      gap: 7px;
      justify-content: space-between;
    }
    .sc-sw {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 11px;
      border: 3px solid var(--ink);
      box-shadow: 0 3px 0 var(--ink);
      cursor: pointer;
      padding: 0;
      transition: transform 0.08s ease;
    }
    .sc-sw:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }
    /* 色塊選中保留原本顏料色，加白藍外圈＋右上角 ✓ */
    .sc-sw.sc-sw-on {
      box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 6px var(--blue);
    }
    .sc-sw.sc-sw-on::after {
      content: "✓";
      position: absolute;
      top: -7px;
      right: -7px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--blue);
      color: #FFFFFF;
      border: 2px solid #FFFFFF;
      font: 900 12px/16px var(--f-ui);
      text-align: center;
      pointer-events: none;
    }

    /* 復原／清除按鈕列 */
    .sc-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    .sc-actions .ai-btn {
      flex: 1;
      min-height: 50px;
      padding: 0 6px;
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }
    .sc-actions .ai-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .sc-clear-arm {
      background: var(--bad-soft) !important;
      border-color: var(--bad) !important;
      color: #8E1F29 !important;
    }

    /* 中央大白畫布（主角最大） */
    .sc-board {
      position: absolute;
      left: 280px;
      top: 8px;
      width: 772px;
      height: 472px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .sc-board .ai-tape {
      pointer-events: none;
      z-index: 6;
    }
    .sc-canvas-hidden {
      visibility: hidden;
    }
    .sc-fx-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 766px;
      height: 466px;
      pointer-events: none;
      z-index: 3;
    }
    .sc-stamp-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 766px;
      height: 466px;
      z-index: 4;
      display: none;
      touch-action: none;
      cursor: crosshair;
    }
    .sc-stamp-layer.sc-active {
      display: block;
    }

    /* 畫布下方主題印章列 */
    .sc-stamps-bar {
      position: absolute;
      left: 280px;
      top: 492px;
      width: 772px;
      height: 87px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-sizing: border-box;
    }
    .sc-stamps-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 82px;
      gap: 2px;
      color: var(--ink-2);
      font: 700 17px/1.2 var(--f-ui);
      white-space: nowrap;
    }
    .sc-stamps-label svg {
      width: 26px;
      height: 26px;
    }
    .sc-stamps-list {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .sc-stamp-btn {
      position: relative;
      height: 64px;
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 14px;
      box-shadow: 0 4px 0 var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 12px;
      cursor: pointer;
      color: var(--ink);
      font: 700 20px/1 var(--f-title);
      white-space: nowrap;
      transition: transform 0.08s ease;
    }
    .sc-stamp-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }
    .sc-stamp-btn svg {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    /* 右側面板：小精靈提示＋變魔法＋完成 */
    .sc-side {
      position: absolute;
      left: 1070px;
      right: 20px;
      top: 8px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sc-guide {
      flex: 1;
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      box-sizing: border-box;
      overflow: hidden;
    }
    .sc-theme-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--sun-soft);
      border: 2.5px solid var(--ink);
      font: 700 17px/1.2 var(--f-title);
      color: var(--ink);
      white-space: nowrap;
    }
    .sc-mascot {
      width: 112px;
      height: 98px;
      flex-shrink: 0;
    }
    .sc-mascot svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sc-guide-msg {
      margin: 0;
      width: 100%;
      min-height: 76px;
      padding: 8px 6px;
      border-radius: 12px;
      background: var(--lagoon);
      border: 2.5px solid var(--ink);
      color: var(--ink);
      font-size: 20px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .sc-stats {
      margin-top: auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font: 700 17px/1.2 var(--f-ui);
      color: var(--ink-2);
      white-space: nowrap;
    }
    .sc-stats .ai-num {
      font-size: 20px;
      color: var(--blue);
    }

    /* 變魔法大按鈕 */
    .sc-magic {
      height: 88px;
      padding: 0 14px;
      background: var(--blue-soft);
      color: var(--ink);
      border-color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font: 900 28px/1 var(--f-title);
      white-space: nowrap;
    }
    .sc-magic svg {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }
    .sc-magic.sc-magic-playing {
      background: var(--blue);
      color: #FFFFFF;
      border-color: var(--ink);
    }

    /* 完成大按鈕 */
    .sc-done {
      height: 82px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font: 900 30px/1 var(--f-title);
      white-space: nowrap;
    }
    .sc-done svg {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
    }

    /* 瞬間回饋小動畫（護眼不閃爍，reduced-motion 時停用） */
    @keyframes sc-hop {
      0%, 100% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-9px) scale(1.05); }
    }
    @keyframes sc-wiggle {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-6px) rotate(-4deg); }
      75% { transform: translateX(6px) rotate(4deg); }
    }
    .sc-anim-hop {
      animation: sc-hop 0.42s ease-out 1;
    }
    .sc-anim-wiggle {
      animation: sc-wiggle 0.36s ease-in-out 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .sc-anim-hop,
      .sc-anim-wiggle {
        animation: none !important;
      }
      .sc-size,
      .sc-mode,
      .sc-sw,
      .sc-stamp-btn {
        transition: none !important;
      }
    }
  </style>

    /* =====================================================================
     * 工具函式：色彩轉換、座標換算、筆畫與印章繪製
     * ===================================================================== */
    function hslToHex(h, s, l) {
      h = ((h % 360) + 360) % 360;
      s /= 100;
      l /= 100;
      var c = (1 - Math.abs(2 * l - 1)) * s;
      var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      var m = l - c / 2;
      var r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; }
      else if (h < 120) { r = x; g = c; }
      else if (h < 180) { g = c; b = x; }
      else if (h < 240) { g = x; b = c; }
      else if (h < 300) { r = x; b = c; }
      else { r = c; b = x; }
      var toHex = function (v) {
        var s2 = Math.round((v + m) * 255).toString(16);
        return s2.length === 1 ? '0' + s2 : s2;
      };
      return '#' + toHex(r) + toHex(g) + toHex(b);
    }

      return {
        x: (e.clientX - rect.left) * (SCENE_CONFIG.CANVAS_W / rect.width),
        y: (e.clientY - rect.top) * (SCENE_CONFIG.CANVAS_H / rect.height)
      };
    }

    function computePathCenter(path) {

      for (var i = 0; i < path.length; i++) {
        if (path[i].x < minX) minX = path[i].x;
        if (path[i].x > maxX) maxX = path[i].x;
        if (path[i].y < minY) minY = path[i].y;
        if (path[i].y > maxY) maxY = path[i].y;
      }
      return { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2 };
    }

      var path = item.path;
      if (!path || !path.length) return;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = item.size;

      if (item.isRainbow) {
        var baseHue = (item.startHue || 0) + (hueShift || 0);
        if (path.length === 1) {
          ctx.fillStyle = hslToHex(baseHue, 92, 52);
          ctx.beginPath();
          ctx.arc(path[0].x, path[0].y, item.size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          for (var i = 1; i < path.length; i++) {
            var segHue = baseHue + i * SCENE_CONFIG.RAINBOW_STEP_DEG;
            ctx.strokeStyle = hslToHex(segHue, 92, 52);
            ctx.beginPath();
            ctx.moveTo(path[i - 1].x, path[i - 1].y);
            ctx.lineTo(path[i].x, path[i].y);
            ctx.stroke();
          }
        }
      } else {
        var col = item.tool === 'eraser' ? '#FFFFFF' : item.color;
        if (path.length === 1) {
          ctx.fillStyle = col;
          ctx.beginPath();
          ctx.arc(path[0].x, path[0].y, item.size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.strokeStyle = col;
          ctx.beginPath();
          ctx.moveTo(path[0].x, path[0].y);
          for (var j = 1; j < path.length; j++) {

          }
          ctx.stroke();
        }

    /* =====================================================================
     * 掛載畫畫島關卡（欄位與【本關設定】一字不差）
     * ===================================================================== */
    ArtIsland.mount({
      unit: 18,
      title: '魔法畫畫屋',
      grade: '1–2 年級',
      howto: '選一張主題卡，畫完按魔法，畫就會動起來！',
      zhuyin: true,
      teach: '用圖畫表達想法、感受創作樂趣｜生活課程 4-I-2',
      submit: false,
      allOpen: true,   // 主題卡不用一張張解鎖（整合時加，2026-11-21）
      hero: HERO_SVG,
      levels: SCENE_CONFIG.THEMES.map(function (th, idx) {
        return { name: th.name, thumb: LEVEL_THUMBS[idx] };
      }),
      scene: function (api) {
        /* 場景執行期狀態（每次 start 與 stop 皆會歸零清理） */
        var cv = null;
        var fxCanvas = null;
        var fxCtx = null;
        var stampLayer = null;
        var currentTheme = null;
        var items = []; // 記錄全部筆畫與印章，支援精準復原與魔法動畫
        var mode = 'pen'; // 'pen' | 'rainbow' | 'eraser' | 'stamp'
        var selectedSizeIdx = SCENE_CONFIG.DEFAULT_SIZE_INDEX;
        var selectedColorIdx = SCENE_CONFIG.DEFAULT_COLOR_INDEX;
        var activeStampId = null;
        var rainbowHue = 0;

        /* 彩虹筆即時預覽狀態 */
        var isRainbowDrawing = false;
        var rainbowStartHue = 0;
        var rainbowLivePath = [];

        /* 魔法與印章動畫／計時器句柄 */
        var isMagicPlaying = false;
        var magicRafId = 0;
        var popRafId = 0;
        var magicReducedTimer = 0;
        var clearArmTimer = 0;
        var clearArmed = false;
        var stampHoverPos = null;

        /* 預先綁定的全域收尾事件（stop 時必移除） */
        var docUpHandler = null;
        var docMoveHandler = null;
        var reducedMotion = false;

        /* 讀取系統減少動態設定 */
        function checkReducedMotion() {
          return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        }

        /* 清除全部動畫、計時器與 document 監聽 */
        function clearTimersAndListeners() {
          if (magicRafId) { cancelAnimationFrame(magicRafId); magicRafId = 0; }
          if (popRafId) { cancelAnimationFrame(popRafId); popRafId = 0; }
          if (magicReducedTimer) { clearTimeout(magicReducedTimer); magicReducedTimer = 0; }
          if (clearArmTimer) { clearTimeout(clearArmTimer); clearArmTimer = 0; }
          if (docUpHandler) {
            document.removeEventListener('pointerup', docUpHandler);
            document.removeEventListener('pointercancel', docUpHandler);
            docUpHandler = null;
          }
          if (docMoveHandler) {
            document.removeEventListener('pointermove', docMoveHandler);
            docMoveHandler = null;
          }
        }

        /* 把 items 完整重繪到主畫布（確保彩虹筆、橡皮擦、印章順序一致） */
        function redrawMainCanvas() {
          if (!cv || !cv.ctx) return;
          var ctx = cv.ctx;
          ctx.save();
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, SCENE_CONFIG.CANVAS_W, SCENE_CONFIG.CANVAS_H);
          ctx.restore();
          for (var i = 0; i < items.length; i++) {
            var it = items[i];
            if (it.type === 'stroke') {
              drawStrokeItem(ctx, it, 0);
            } else if (it.type === 'stamp') {
              drawStampItem(ctx, it.stampId, it.x, it.y, { size: it.size });
            }
          }
        }

        /* 更新右側計數與小精靈狀態 */
        function updateStats() {
          var strokeCount = 0;
          var stampCount = 0;
          for (var i = 0; i < items.length; i++) {
            if (items[i].type === 'stroke') strokeCount++;
            else if (items[i].type === 'stamp') stampCount++;
          }
          var sEl = api.field.querySelector('.sc-stat-strokes');
          var tEl = api.field.querySelector('.sc-stat-stamps');
          if (sEl) sEl.textContent = String(strokeCount);
          if (tEl) tEl.textContent = String(stampCount);
        }

        function setGuide(text, mood, animClass) {
          var msgEl = api.field.querySelector('.sc-guide-msg');
          var masEl = api.field.querySelector('.sc-mascot');
          if (msgEl && text) msgEl.textContent = text;
          if (masEl) {
            if (mood) masEl.innerHTML = getMascotSvg(mood);
            if (animClass && !reducedMotion) {
              masEl.classList.remove('sc-anim-hop', 'sc-anim-wiggle');
              void masEl.offsetWidth;
              masEl.classList.add(animClass);
            }
          }
        }

        /* 解除「再按清除」二次確認狀態 */
        function resetClearArm() {
          if (clearArmTimer) { clearTimeout(clearArmTimer); clearArmTimer = 0; }
          clearArmed = false;
          var btn = api.field.querySelector('.sc-clear');
          if (btn) {
            btn.classList.remove('sc-clear-arm');
            btn.innerHTML = UI_ICONS.clear + '<span>清除</span>';
          }
        }

        /* 同步目前工具設定到 api.canvas 與按鈕高亮狀態 */
        function applyToolState() {
          if (!cv) return;
          var sizePx = SCENE_CONFIG.BRUSH_SIZES[selectedSizeIdx].px;
          var colorHex = SCENE_CONFIG.COLORS[selectedColorIdx].hex;

          if (mode === 'stamp') {
            stampLayer.classList.add('sc-active');
          } else {
            stampLayer.classList.remove('sc-active');
            stampHoverPos = null;
            if (!isMagicPlaying && fxCtx) {
              fxCtx.clearRect(0, 0, SCENE_CONFIG.CANVAS_W, SCENE_CONFIG.CANVAS_H);
            }
          }

          if (mode === 'eraser') {
            cv.setTool('eraser');
            cv.setSize(Math.max(Math.round(sizePx * SCENE_CONFIG.ERASER_SCALE), SCENE_CONFIG.ERASER_MIN_PX));
          } else if (mode === 'rainbow') {
            cv.setTool('pen');
            cv.setSize(sizePx);
            cv.setColor(hslToHex(rainbowHue, 92, 52));
          } else {
            cv.setTool('pen');
            cv.setSize(sizePx);
            cv.setColor(colorHex);
          }

          /* 更新左側工具按鈕選中外觀 */
          api.field.querySelectorAll('.sc-size').forEach(function (b, idx) {
            var on = idx === selectedSizeIdx;
            b.classList.toggle('sc-on', on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
          api.field.querySelectorAll('.sc-mode').forEach(function (b) {
            var on = b.dataset.mode === mode;
            b.classList.toggle('sc-on', on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
          api.field.querySelectorAll('.sc-sw').forEach(function (b, idx) {
            var on = mode === 'pen' && idx === selectedColorIdx;
            b.classList.toggle('sc-sw-on', on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
          api.field.querySelectorAll('.sc-stamp-btn').forEach(function (b) {
            var on = mode === 'stamp' && b.dataset.stamp === activeStampId;
            b.classList.toggle('sc-on', on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
        }

        /* 停止魔法動畫並恢復原畫顯示（原畫完全不變） */
        function stopMagic(restorePrompt) {
          if (magicRafId) { cancelAnimationFrame(magicRafId); magicRafId = 0; }
          if (magicReducedTimer) { clearTimeout(magicReducedTimer); magicReducedTimer = 0; }
          if (!isMagicPlaying) return;
          isMagicPlaying = false;
          if (cv && cv.el) cv.el.classList.remove('sc-canvas-hidden');
          if (fxCtx) fxCtx.clearRect(0, 0, SCENE_CONFIG.CANVAS_W, SCENE_CONFIG.CANVAS_H);
          var magicBtn = api.field.querySelector('.sc-magic');
          if (magicBtn) {
            magicBtn.classList.remove('sc-magic-playing');
            magicBtn.innerHTML = UI_ICONS.wand + '<span>變魔法！</span>';
          }
          if (restorePrompt && currentTheme) {
            setGuide('再畫幾筆或再變一次！', 'normal');
          }
        }

        /* 蓋印章瞬間的可愛「波！」小星星回饋 */
        function playStampPop(x, y, stampId) {
          if (reducedMotion || !fxCtx || isMagicPlaying) return;
          if (popRafId) { cancelAnimationFrame(popRafId); popRafId = 0; }
          var startTs = performance.now();
          var sparks = [];
          for (var k = 0; k < 6; k++) {
            var ang = (k / 6) * Math.PI * 2 + 0.3;
            sparks.push({ ang: ang, dist: 38 + (k % 2) * 14, col: k % 2 === 0 ? '#FFB627' : '#2160C4' });
          }
          function step(now) {
            var p = (now - startTs) / SCENE_CONFIG.STAMP_POP_MS;
            fxCtx.clearRect(0, 0, SCENE_CONFIG.CANVAS_W, SCENE_CONFIG.CANVAS_H);
            if (p >= 1) {
              popRafId = 0;
              if (mode === 'stamp' && stampHoverPos) drawStampGhost();
              return;
            }
            var ease = 1 - Math.pow(1 - p, 3);
            var alpha = 1 - p;
            fxCtx.save();
            fxCtx.globalAlpha = alpha;
            for (var i = 0; i < sparks.length; i++) {
              var sx = x + Math.cos(sparks[i].ang) * sparks[i].dist * ease;
              var sy = y + Math.sin(sparks[i].ang) * sparks[i].dist * ease;
              drawMiniStar(fxCtx, sx, sy, 8 * (1 - p * 0.4), sparks[i].col);
            }
            fxCtx.restore();
            /* 印章本身微微放大彈跳一次 */
            var popScale = 1 + Math.sin(p * Math.PI) * 0.16;
            drawStampItem(fxCtx, stampId, x, y, { size: SCENE_CONFIG.STAMP_BASE_SIZE, scale: popScale });
            popRafId = requestAnimationFrame(step);
          }
          popRafId = requestAnimationFrame(step);
        }

        /* 畫一顆小五角星（供魔法粒子與蓋印章特效用） */
        function drawMiniStar(ctx, x, y, r, color) {
          ctx.save();
          ctx.translate(x, y);
          ctx.fillStyle = color;
          ctx.strokeStyle = '#1F2A4D';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (var i = 0; i < 10; i++) {
            var rad = (i * Math.PI) / 5 - Math.PI / 2;
            var rr = i % 2 === 0 ? r : r * 0.48;
            if (i === 0) ctx.moveTo(Math.cos(rad) * rr, Math.sin(rad) * rr);
            else ctx.lineTo(Math.cos(rad) * rr, Math.sin(rad) * rr);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        /* 滑鼠移動時在印章層顯示半透明對準預覽 */
        function drawStampGhost() {
          if (!fxCtx || isMagicPlaying || popRafId || mode !== 'stamp' || !activeStampId || !stampHoverPos) return;
          fxCtx.clearRect(0, 0, SCENE_CONFIG.CANVAS_W, SCENE_CONFIG.CANVAS_H);
          fxCtx.save();
          fxCtx.globalAlpha = 0.45;
          drawStampItem(fxCtx, activeStampId, stampHoverPos.x, stampHoverPos.y, { size: SCENE_CONFIG.STAMP_BASE_SIZE });
          fxCtx.restore();
        }

        /* 施展魔法：另用透明 fxCanvas 重畫每一筆與印章並加上生動動畫，3 秒後停回原畫 */
        function triggerMagic() {
          resetClearArm();
          if (isMagicPlaying) {
            stopMagic(true);
            return;
          }
          if (items.length === 0) {
            setGuide('先畫一筆再變魔法喔！', 'curious', 'sc-anim-wiggle');
            return;
          }
          if (popRafId) { cancelAnimationFrame(popRafId); popRafId = 0; }
          isMagicPlaying = true;

          var magicBtn = api.field.querySelector('.sc-magic');
          if (magicBtn) {
            magicBtn.classList.add('sc-magic-playing');
            magicBtn.innerHTML = UI_ICONS.wand + '<span>魔法中…</span>';
          }
          setGuide(currentTheme.magicMsg, 'magic', 'sc-anim-hop');

          /* 若開啟減少動態，只呈現溫和靜態小星星點綴後結束 */
          if (reducedMotion) {
            fxCtx.clearRect(0, 0, SCENE_CONFIG.CANVAS_W, SCENE_CONFIG.CANVAS_H);
            for (var r = 0; r < 10; r++) {
              drawMiniStar(
                fxCtx,
                70 + ((r * 73) % (SCENE_CONFIG.CANVAS_W - 140)),
                50 + ((r * 89) % (SCENE_CONFIG.CANVAS_H - 100)),
                11,
                r % 2 === 0 ? '#FFB627' : '#2160C4'
              );
            }
            magicReducedTimer = setTimeout(function () {
              magicReducedTimer = 0;
              stopMagic(true);
            }, SCENE_CONFIG.MAGIC_REDUCED_MS);
            return;
          }

          /* 動畫進行中暫時隱藏原畫（不修改原畫），由上方透明 fxCanvas 演出動畫 */
          cv.el.classList.add('sc-canvas-hidden');

          /* 預先建立 16 顆溫柔升起旋轉的魔法小星星 */
          var particles = [];
          for (var p = 0; p < 16; p++) {
            particles.push({
              x: 48 + Math.random() * (SCENE_CONFIG.CANVAS_W - 96),
              y: 60 + Math.random() * (SCENE_CONFIG.CANVAS_H - 90),
              vy: 16 + Math.random() * 24,
              sway: (Math.random() - 0.5) * 28,
              r: 7 + Math.random() * 6,
              phase: Math.random() * Math.PI * 2,
              col: p % 3 === 0 ? '#FFB627' : (p % 3 === 1 ? '#29B6F6' : '#F06292')
            });
          }

          var startTs = performance.now();
          var duration = SCENE_CONFIG.MAGIC_DURATION_MS;

          function animate(now) {
            var elapsed = now - startTs;
            var progress = elapsed / duration;
            if (progress >= 1) {
              magicRafId = 0;
              stopMagic(true);
              return;
            }
            var t = elapsed / 1000;
            /* 頭尾 0.35 秒平滑進出包絡線，結束瞬間無縫對齊原畫位置 */
            var env = 1;
            if (t < 0.35) env = t / 0.35;
            else if (t > 2.65) env = Math.max(0, (3 - t) / 0.35);

            fxCtx.clearRect(0, 0, SCENE_CONFIG.CANVAS_W, SCENE_CONFIG.CANVAS_H);

            /* 逐筆重畫孩子的筆畫與印章並加入對應動畫 */
            for (var i = 0; i < items.length; i++) {
              var it = items[i];
              var phase = i * 1.15;
              if (it.type === 'stroke') {
                if (it.tool === 'eraser') {
                  drawStrokeItem(fxCtx, it, 0);
                } else {
                  var bounceY = -Math.abs(Math.sin(t * 3.8 + phase)) * 13 * env;
                  var swayRot = Math.sin(t * 3.1 + phase) * 0.065 * env;
                  var breathe = 1 + Math.sin(t * 4.4 + phase) * 0.035 * env;
                  fxCtx.save();
                  fxCtx.translate(it.cx, it.cy + bounceY);
                  fxCtx.rotate(swayRot);
                  fxCtx.scale(breathe, breathe);
                  fxCtx.translate(-it.cx, -it.cy);
                  drawStrokeItem(fxCtx, it, it.isRainbow ? t * 140 : 0);
                  fxCtx.restore();
                }
              } else if (it.type === 'stamp') {
                /* 依印章類型給予專屬動態：游動、眨眼、彈跳、搖擺、飄浮 */
                var blinkNow = ((t + phase * 0.25) % 1.35) > 1.18;
                var dx = 0, dy = 0, rot = 0, sc = 1;
                if (it.stampId === 'fish') {
                  dx = Math.sin(t * 3.2 + phase) * 26 * env;
                  dy = Math.sin(t * 5.2 + phase) * 7 * env;
                  rot = Math.cos(t * 3.2 + phase) * 0.09 * env;
                } else if (it.stampId === 'seaweed') {
                  rot = Math.sin(t * 4.0 + phase) * 0.14 * env;
                } else if (it.stampId === 'bubble' || it.stampId === 'cloud') {
                  dx = Math.sin(t * 2.2 + phase) * 14 * env;
                  dy = Math.sin(t * 3.0 + phase) * 10 * env;
                  sc = 1 + Math.sin(t * 3.6 + phase) * 0.06 * env;
                } else if (it.stampId === 'drop') {
                  dy = Math.sin(t * 4.8 + phase) * 14 * env;
                } else if (it.stampId === 'umbrella' || it.stampId === 'tree') {
                  rot = Math.sin(t * 3.6 + phase) * 0.13 * env;
                  dy = -Math.abs(Math.sin(t * 3.6 + phase)) * 7 * env;
                } else if (it.stampId === 'sun') {
                  rot = Math.sin(t * 3.0 + phase) * 0.12 * env;
                  sc = 1 + Math.sin(t * 4.2 + phase) * 0.06 * env;
                } else {
                  /* 房子、貓、狗、兔：開心彈跳＋微搖 */
                  dy = -Math.abs(Math.sin(t * 4.2 + phase)) * 16 * env;
                  rot = Math.sin(t * 4.2 + phase) * 0.08 * env;
                }
                drawStampItem(fxCtx, it.stampId, it.x, it.y, {
                  size: it.size,
                  dx: dx,
                  dy: dy,
                  rot: rot,
                  scale: sc,
                  blink: blinkNow,
                  t: t * env
                });
              }
            }

            /* 溫柔飄起的魔法小星星 */
            for (var sIdx = 0; sIdx < particles.length; sIdx++) {
              var pt = particles[sIdx];
              var px = pt.x + Math.sin(t * 2.2 + pt.phase) * pt.sway;
              var py = pt.y - pt.vy * t;
              var pAlpha = Math.sin(progress * Math.PI) * 0.9;
              fxCtx.save();
              fxCtx.globalAlpha = Math.max(0, pAlpha);
              drawMiniStar(fxCtx, px, py, pt.r * (0.85 + 0.2 * Math.sin(t * 4 + pt.phase)), pt.col);
              fxCtx.restore();
            }

            magicRafId = requestAnimationFrame(animate);
          }

          magicRafId = requestAnimationFrame(animate);
        }

        /* 組合個人化稱讚句子（強調孩子的創作與想法，不評像不像） */
        function buildPraise() {
          var hasRainbow = false;
          var stampCount = 0;
          for (var i = 0; i < items.length; i++) {
            if (items[i].type === 'stroke' && items[i].isRainbow) hasRainbow = true;
            if (items[i].type === 'stamp') stampCount++;
          }
          if (items.length === 0) {
            return '謝謝你來到魔法畫畫屋！下次也可以多畫幾筆喔！';
          }
          if (hasRainbow && stampCount > 0) {
            return '你用了彩虹筆又蓋了可愛印章，這張「' + currentTheme.name + '」充滿魔法！';
          }
          if (hasRainbow) {
            return '閃亮的彩虹筆讓「' + currentTheme.name + '」變得像童話故事一樣棒！';
          }
          if (stampCount >= 3) {
            return '你幫「' + currentTheme.name + '」排了好多可愛印章，畫面好熱鬧！';
          }
          return currentTheme.praiseBase;
        }

        return {
          start: function (levelIndex) {
            /* 每次進入關卡先清空殘留狀態 */
            clearTimersAndListeners();
            reducedMotion = checkReducedMotion();
            currentTheme = SCENE_CONFIG.THEMES[levelIndex] || SCENE_CONFIG.THEMES[0];
            items = [];
            mode = 'pen';
            selectedSizeIdx = SCENE_CONFIG.DEFAULT_SIZE_INDEX;
            selectedColorIdx = SCENE_CONFIG.DEFAULT_COLOR_INDEX;
            activeStampId = null;
            rainbowHue = 0;
            isRainbowDrawing = false;
            rainbowLivePath = [];
            isMagicPlaying = false;
            clearArmed = false;
            stampHoverPos = null;

            api.quest(currentTheme.quest);

            /* 建立三欄貼紙畫冊版面（1366×595 一屏不捲動） */
            var sizesHtml = SCENE_CONFIG.BRUSH_SIZES.map(function (sz, idx) {
              return (
                '<button type="button" class="sc-size" data-size-idx="' + idx + '" aria-label="' + sz.label + '">' +
                  '<i style="width:' + sz.dot + 'px;height:' + sz.dot + 'px"></i>' +
                '</button>'
              );
            }).join('');

            var colorsHtml = SCENE_CONFIG.COLORS.map(function (c, idx) {
              return (
                '<button type="button" class="sc-sw" data-color-idx="' + idx + '" style="background:' + c.hex + '" aria-label="' + c.name + '"></button>'
              );
            }).join('');

            var stampsHtml = currentTheme.stamps.map(function (st) {
              return (
                '<button type="button" class="sc-stamp-btn" data-stamp="' + st.id + '" aria-label="印章：' + st.label + '">' +
                  STAMP_SVGS[st.id] +
                  '<span>' + st.label + '</span>' +
                '</button>'
              );
            }).join('');

            api.field.innerHTML =
              '<div class="ai-panel sc-tools">' +
                '<h3 class="sc-sec-title">筆刷粗細</h3>' +
                '<div class="sc-sizes">' + sizesHtml + '</div>' +
                '<h3 class="sc-sec-title">畫筆工具</h3>' +
                '<div class="sc-modes">' +
                  '<button type="button" class="sc-mode" data-mode="pen" aria-label="畫筆">' + UI_ICONS.pen + '<span>畫筆</span></button>' +
                  '<button type="button" class="sc-mode sc-mode-rainbow" data-mode="rainbow" aria-label="彩虹筆">' + UI_ICONS.rainbow + '<span>彩虹</span></button>' +
                  '<button type="button" class="sc-mode" data-mode="eraser" aria-label="橡皮擦">' + UI_ICONS.eraser + '<span>擦擦</span></button>' +
                '</div>' +
                '<h3 class="sc-sec-title">選顏色</h3>' +
                '<div class="sc-colors">' + colorsHtml + '</div>' +
                '<div class="sc-actions">' +
                  '<button type="button" class="ai-btn sc-undo" aria-label="復原上一筆">' + UI_ICONS.undo + '<span>復原</span></button>' +
                  '<button type="button" class="ai-btn sc-clear" aria-label="清除畫布">' + UI_ICONS.clear + '<span>清除</span></button>' +
                '</div>' +
              '</div>' +

              '<div class="ai-board sc-board">' +
                '<span class="ai-tape" style="left:110px;top:-10px;transform:rotate(-4deg)"></span>' +
                '<span class="ai-tape" style="right:110px;top:-10px;transform:rotate(3deg)"></span>' +
                '<canvas class="sc-fx-canvas" width="' + SCENE_CONFIG.CANVAS_W + '" height="' + SCENE_CONFIG.CANVAS_H + '"></canvas>' +
                '<div class="sc-stamp-layer" aria-label="印章蓋章區"></div>' +
              '</div>' +

              '<div class="ai-panel sc-stamps-bar">' +
                '<div class="sc-stamps-label">' + UI_ICONS.stamp + '<span>蓋印章</span></div>' +
                '<div class="sc-stamps-list">' + stampsHtml + '</div>' +
              '</div>' +

              '<div class="sc-side">' +
                '<div class="ai-panel sc-guide">' +
                  '<div class="sc-theme-pill">' + currentTheme.name + '</div>' +
                  '<div class="sc-mascot">' + getMascotSvg('normal') + '</div>' +
                  '<p class="sc-guide-msg ai-zy">' + currentTheme.prompt + '</p>' +
                  '<div class="sc-stats">' +
                    '<span>畫了 <b class="ai-num sc-stat-strokes">0</b> 筆</span>' +
                    '<span>·</span>' +
                    '<span><b class="ai-num sc-stat-stamps">0</b> 印章</span>' +
                  '</div>' +
                '</div>' +
                '<button type="button" class="ai-btn sc-magic">' + UI_ICONS.wand + '<span>變魔法！</span></button>' +
                '<button type="button" class="ai-btn go sc-done">' + UI_ICONS.check + '<span>完成</span></button>' +
              '</div>';

            var board = api.field.querySelector('.sc-board');
            fxCanvas = api.field.querySelector('.sc-fx-canvas');
            fxCtx = fxCanvas.getContext('2d');
            stampLayer = api.field.querySelector('.sc-stamp-layer');

            /* 使用共用 api.canvas 建立主畫布 */
            cv = api.canvas(board, {
              width: SCENE_CONFIG.CANVAS_W,
              height: SCENE_CONFIG.CANVAS_H,
              color: SCENE_CONFIG.COLORS[selectedColorIdx].hex,
              size: SCENE_CONFIG.BRUSH_SIZES[selectedSizeIdx].px
            });

            /* 記錄每一筆手繪資料，供彩虹重繪、復原與魔法動畫使用 */
            cv.onStroke(function (st) {
              if (!st || !st.path || !st.path.length) return;
              var copiedPath = st.path.map(function (p) { return { x: p.x, y: p.y }; });
              var center = computePathCenter(copiedPath);
              var isRb = mode === 'rainbow' && st.tool !== 'eraser';
              var item = {
                type: 'stroke',
                path: copiedPath,
                tool: st.tool || (mode === 'eraser' ? 'eraser' : 'pen'),
                color: st.color || SCENE_CONFIG.COLORS[selectedColorIdx].hex,
                size: st.size || SCENE_CONFIG.BRUSH_SIZES[selectedSizeIdx].px,
                isRainbow: isRb,
                startHue: isRb ? rainbowStartHue : 0,
                cx: center.cx,
                cy: center.cy
              };
              items.push(item);

              if (isRb) {
                isRainbowDrawing = false;
                rainbowLivePath = [];
                rainbowHue = (rainbowStartHue + copiedPath.length * SCENE_CONFIG.RAINBOW_STEP_DEG) % 360;
                cv.setColor(hslToHex(rainbowHue, 92, 52));
                if (!isMagicPlaying) {
                  fxCtx.clearRect(0, 0, SCENE_CONFIG.CANVAS_W, SCENE_CONFIG.CANVAS_H);
                }
              }

              redrawMainCanvas();
              updateStats();
              resetClearArm();
            });

            /* 彩虹筆拖曳即時漸變預覽（不阻擋 api.canvas 運作） */
            cv.el.addEventListener('pointerdown', function (e) {
              if (!e.isPrimary) return;
              if (isMagicPlaying) stopMagic(false);
              resetClearArm();
              if (mode !== 'rainbow') return;
              isRainbowDrawing = true;
              rainbowStartHue = rainbowHue;
              var pt = getCanvasPoint(cv.el, e);
              rainbowLivePath = [pt];
              var sz = SCENE_CONFIG.BRUSH_SIZES[selectedSizeIdx].px;
              fxCtx.clearRect(0, 0, SCENE_CONFIG.CANVAS_W, SCENE_CONFIG.CANVAS_H);
              drawStrokeItem(fxCtx, {
                path: rainbowLivePath,
                size: sz,
                isRainbow: true,
                startHue: rainbowStartHue
              }, 0);
            });

            docMoveHandler = function (e) {
              if (!isRainbowDrawing || !e.isPrimary || !cv || !cv.el) return;
              var pt = getCanvasPoint(cv.el, e);
              rainbowLivePath.push(pt);
              var sz = SCENE_CONFIG.BRUSH_SIZES[selectedSizeIdx].px;
              var segIdx = rainbowLivePath.length - 1;
              var prev = rainbowLivePath[segIdx - 1];
              var segHue = rainbowStartHue + segIdx * SCENE_CONFIG.RAINBOW_STEP_DEG;
              cv.setColor(hslToHex(segHue, 92, 52));
              fxCtx.save();
              fxCtx.lineCap = 'round';
              fxCtx.lineJoin = 'round';
              fxCtx.lineWidth = sz;
              fxCtx.strokeStyle = hslToHex(segHue, 92, 52);
              fxCtx.beginPath();
              fxCtx.moveTo(prev.x, prev.y);
              fxCtx.lineTo(pt.x, pt.y);
              fxCtx.stroke();
              fxCtx.restore();
            };

            docUpHandler = function (e) {
              if (!isRainbowDrawing || !e.isPrimary) return;
              isRainbowDrawing = false;
              rainbowLivePath = [];
              if (!isMagicPlaying && fxCtx) {
                fxCtx.clearRect(0, 0, SCENE_CONFIG.CANVAS_W, SCENE_CONFIG.CANVAS_H);
              }
            };

            document.addEventListener('pointermove', docMoveHandler);
            document.addEventListener('pointerup', docUpHandler);
            document.addEventListener('pointercancel', docUpHandler);

            /* 印章層 pointer events（支援滑鼠＋平板手指直接點擊蓋章） */
            stampLayer.addEventListener('pointerdown', function (e) {
              if (!e.isPrimary || mode !== 'stamp' || !activeStampId) return;
              e.preventDefault();
              if (isMagicPlaying) stopMagic(false);
              resetClearArm();
              var pt = getCanvasPoint(stampLayer, e);
              var stampItem = {
                type: 'stamp',
                stampId: activeStampId,
                x: pt.x,
                y: pt.y,
                size: SCENE_CONFIG.STAMP_BASE_SIZE
              };
              items.push(stampItem);
              redrawMainCanvas();
              updateStats();
              playStampPop(pt.x, pt.y, activeStampId);
              setGuide('蓋好囉！還可以多蓋！', 'normal', 'sc-anim-hop');
            });

            stampLayer.addEventListener('pointermove', function (e) {
              if (e.pointerType !== 'mouse' || mode !== 'stamp' || !activeStampId) return;
              stampHoverPos = getCanvasPoint(stampLayer, e);
              drawStampGhost();
            });

            stampLayer.addEventListener('pointerleave', function () {
              stampHoverPos = null;
              if (!isMagicPlaying && !popRafId && fxCtx) {
                fxCtx.clearRect(0, 0, SCENE_CONFIG.CANVAS_W, SCENE_CONFIG.CANVAS_H);
              }
            });

            /* 統一事件委派：工具列、色盤、印章列、變魔法、完成 */
            api.field.onclick = function (e) {
              var btn;

              if ((btn = e.target.closest('.sc-size'))) {
                stopMagic(false);
                resetClearArm();
                selectedSizeIdx = Number(btn.dataset.sizeIdx);
                if (mode === 'stamp') mode = 'pen';
                applyToolState();
                return;
              }

              if ((btn = e.target.closest('.sc-mode'))) {
                stopMagic(false);
                resetClearArm();
                mode = btn.dataset.mode;
                activeStampId = null;
                applyToolState();
                if (mode === 'rainbow') setGuide('彩虹筆會變出七彩喔！', 'normal');
                else if (mode === 'eraser') setGuide('輕輕擦掉想改的地方！', 'normal');
                else setGuide(currentTheme.prompt, 'normal');
                return;
              }

              if ((btn = e.target.closest('.sc-sw'))) {
                stopMagic(false);
                resetClearArm();
                selectedColorIdx = Number(btn.dataset.colorIdx);
                mode = 'pen';
                activeStampId = null;
                applyToolState();
                return;
              }

              if ((btn = e.target.closest('.sc-stamp-btn'))) {
                stopMagic(false);
                resetClearArm();
                var sid = btn.dataset.stamp;
                if (mode === 'stamp' && activeStampId === sid) {
                  /* 再點一次已選中印章，切回畫筆 */
                  mode = 'pen';
                  activeStampId = null;
                  setGuide(currentTheme.prompt, 'normal');
                } else {
                  mode = 'stamp';
                  activeStampId = sid;
                  setGuide('點白紙就能蓋印章！', 'normal');
                }
                applyToolState();
                return;
              }

              if (e.target.closest('.sc-undo')) {
                stopMagic(false);
                resetClearArm();
                if (items.length > 0) {
                  var popped = items.pop();
                  if (popped.type === 'stroke') cv.undo();
                  redrawMainCanvas();
                  updateStats();
                  setGuide('已經退回上一步囉！', 'normal');
                }
                return;
              }

              if (e.target.closest('.sc-clear')) {
                stopMagic(false);
                if (items.length === 0) return;
                if (items.length >= SCENE_CONFIG.CLEAR_CONFIRM_THRESHOLD && !clearArmed) {
                  clearArmed = true;
                  var clrBtn = api.field.querySelector('.sc-clear');
                  clrBtn.classList.add('sc-clear-arm');
                  clrBtn.innerHTML = UI_ICONS.clear + '<span>再按清</span>';
                  setGuide('要整張重畫嗎？再按一次！', 'curious');
                  clearArmTimer = setTimeout(resetClearArm, SCENE_CONFIG.CLEAR_ARM_TIMEOUT_MS);
                  return;
                }
                resetClearArm();
                items = [];
                cv.clear();
                redrawMainCanvas();
                updateStats();
                setGuide('白紙變乾淨囉！重新畫！', 'normal');
                return;
              }

              if (e.target.closest('.sc-magic')) {
                triggerMagic();
                return;
              }

              if (e.target.closest('.sc-done')) {
                stopMagic(false);
                resetClearArm();
                redrawMainCanvas();
                api.finish({
                  stars: SCENE_CONFIG.FINISH_STARS,
                  image: cv.el,
                  praise: buildPraise(),
                  caption: currentTheme.name
                });
              }
            };

            applyToolState();
            updateStats();
          },

          stop: function () {
            clearTimersAndListeners();
            isMagicPlaying = false;
            isRainbowDrawing = false;
            clearArmed = false;
            items = [];
            cv = null;
            fxCanvas = null;
            fxCtx = null;
            stampLayer = null;
            api.field.onclick = null;
            api.field.innerHTML = '';
          }
        };
      }
    });
  })();
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
