<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法簡約畫畫屋 - 兒童聲光畫圖板 4.0</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Playful Rounded Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #ffe4e6 0%, #fef08a 100%);
            overscroll-behavior: none; /* 防止手機拉動重新整理 */
        }

        /* 畫布彩虹外框 */
        .canvas-frame {
            border: 8px solid;
            border-image: linear-gradient(to right, #ff6b6b, #feca57, #1dd1a1, #54a0ff, #5f27cd) 1;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        /* 超大泡泡按鈕特效 */
        .giant-btn {
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .giant-btn:active {
            transform: scale(0.88);
        }
        .giant-btn.active {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
            border-color: #ec4899 !important;
        }

        /* 魔法動起來按鈕特殊霓虹呼吸光芒 */
        .magic-glowing-btn {
            animation: glowPulse 1.5s infinite alternate;
        }
        @keyframes glowPulse {
            0% {
                box-shadow: 0 0 5px #ec4899, 0 0 10px #f43f5e;
            }
            100% {
                box-shadow: 0 0 20px #a855f7, 0 0 25px #ec4899;
                transform: scale(1.03);
            }
        }

        /* 隱藏預設的觸控反饋，確保繪圖流暢 */
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 select-none">
<a href="../../index.html" class="kogao-home-btn" style="position:fixed;top:10px;left:10px;z-index:99999;background:rgba(255,255,255,.92);border:2px solid #f59e0b;color:#b45309;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.15)">🏠 首頁</a>

    <header class="w-full max-w-4xl mx-auto flex justify-between items-center bg-white/90 p-3 rounded-2xl shadow-sm border-2 border-orange-200 mb-2">
        <div class="flex items-center space-x-2">
            <span class="text-3xl animate-bounce">🎨</span>
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold text-pink-500 font-['Fredoka_One']">魔法畫畫屋</h1>
                <p id="sub-title-desc" class="text-[10px] text-slate-500">點顏色畫畫、蓋印章，還可以讓畫作動起來喔！🌟</p>
            </div>
        </div>

        <div class="flex items-center space-x-1.5 md:space-x-2">
            <!-- 核心亮點：魔法動起來按鈕 -->
            <button id="btn-magic-move" onclick="toggleMagicMove()" class="magic-glowing-btn giant-btn bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white font-extrabold px-3 py-2 rounded-xl text-sm flex items-center space-x-1 shadow-lg">
                <span id="magic-btn-emoji">✨</span> <span id="magic-btn-text">魔法動起來</span>
            </button>
            <button id="btn-clear" onclick="clearCanvas()" class="giant-btn bg-red-400 border-b-4 border-red-600 text-white font-extrabold px-3 py-2 rounded-xl text-sm flex items-center space-x-1 shadow">
                <span>🗑️</span> <span class="hidden md:inline">重畫</span>
            </button>
            <button id="btn-save" onclick="saveArt()" class="giant-btn bg-emerald-400 border-b-4 border-emerald-600 text-white font-extrabold px-3 py-2 rounded-xl text-sm flex items-center space-x-1 shadow">
                <span>📸</span> <span class="hidden md:inline">儲存</span>
            </button>
        </div>
    </header>

    <main class="w-full max-w-4xl mx-auto flex-grow flex flex-col justify-center items-center relative my-2">
        <div class="canvas-frame w-full aspect-[4/3] rounded-2xl overflow-hidden relative bg-white">
            <!-- 真正的塗鴉 canvas -->
            <canvas id="paint-canvas" class="absolute inset-0 w-full h-full z-0"></canvas>
            <!-- 特效 overlay canvas (畫星星粒子等) -->
            <canvas id="particle-canvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none"></canvas>
        </div>
    </main>

    <footer class="w-full max-w-4xl mx-auto bg-white/95 p-3 rounded-3xl border-2 border-orange-200 shadow-lg space-y-3">
        
        <!-- 當魔法啟動時，顯示的超萌提示 -->
        <div id="magic-instructions" class="hidden text-center py-2 bg-purple-50 rounded-xl border border-purple-200 animate-pulse">
            <p class="text-sm font-extrabold text-purple-600">✨ 哇！你的畫作復活了！點擊畫面可以「召喚」更多分身喔！ 🦖🎈</p>
        </div>

        <div id="drawing-tools-container" class="space-y-3 transition-opacity duration-300">
            <!-- 第一排：超大顏色選擇與畫筆 -->
            <div class="flex flex-wrap justify-center items-center gap-2">
                <span class="text-xs font-bold text-slate-400 mr-1">畫筆：</span>
                
                <!-- 繽紛 9 色調色盤 -->
                <button onclick="selectColor('#ef4444')" class="color-btn giant-btn w-9 h-9 md:w-11 md:h-11 rounded-full border-4 border-slate-200 active" style="background-color: #ef4444;" title="紅色"></button>
                <button onclick="selectColor('#f97316')" class="color-btn giant-btn w-9 h-9 md:w-11 md:h-11 rounded-full border-4 border-slate-200" style="background-color: #f97316;" title="橘色"></button>
                <button onclick="selectColor('#eab308')" class="color-btn giant-btn w-9 h-9 md:w-11 md:h-11 rounded-full border-4 border-slate-200" style="background-color: #eab308;" title="黃色"></button>
                <button onclick="selectColor('#22c55e')" class="color-btn giant-btn w-9 h-9 md:w-11 md:h-11 rounded-full border-4 border-slate-200" style="background-color: #22c55e;" title="綠色"></button>
                <button onclick="selectColor('#3b82f6')" class="color-btn giant-btn w-9 h-9 md:w-11 md:h-11 rounded-full border-4 border-slate-200" style="background-color: #3b82f6;" title="藍色"></button>
                <button onclick="selectColor('#a855f7')" class="color-btn giant-btn w-9 h-9 md:w-11 md:h-11 rounded-full border-4 border-slate-200" style="background-color: #a855f7;" title="紫色"></button>
                <button onclick="selectColor('#ec4899')" class="color-btn giant-btn w-9 h-9 md:w-11 md:h-11 rounded-full border-4 border-slate-200" style="background-color: #ec4899;" title="粉色"></button>
                <button onclick="selectColor('#78350f')" class="color-btn giant-btn w-9 h-9 md:w-11 md:h-11 rounded-full border-4 border-slate-200" style="background-color: #78350f;" title="咖啡色"></button>
                <button onclick="selectColor('#1e293b')" class="color-btn giant-btn w-9 h-9 md:w-11 md:h-11 rounded-full border-4 border-slate-200" style="background-color: #1e293b;" title="黑色"></button>
                
                <!-- 魔法筆 -->
                <button id="brush-rainbow" onclick="selectBrush('rainbow')" class="brush-btn giant-btn px-3 py-2 bg-slate-100 rounded-xl border-2 border-slate-200 text-sm font-extrabold flex items-center space-x-1">
                    <span>🌈</span> <span>七彩</span>
                </button>
                <button id="brush-sparkle" onclick="selectBrush('sparkle')" class="brush-btn giant-btn px-3 py-2 bg-slate-100 rounded-xl border-2 border-slate-200 text-sm font-extrabold flex items-center space-x-1">
                    <span>✨</span> <span>星星</span>
                </button>
                
                <!-- 橡皮擦 -->
                <button id="btn-eraser" onclick="selectEraser()" class="color-btn giant-btn w-9 h-9 md:w-11 md:h-11 rounded-full bg-slate-100 border-4 border-slate-200 flex items-center justify-center text-xl shadow-inner" title="擦布">🧹</button>
            </div>

            <!-- 第二排：筆刷粗細與貼紙 -->
            <div class="flex flex-wrap justify-between items-center border-t border-dashed border-orange-200 pt-2 gap-2">
                
                <!-- 粗細：小貓、小狗、大熊 -->
                <div class="flex items-center space-x-1">
                    <span class="text-xs font-bold text-slate-400 mr-1">大小：</span>
                    <button id="size-small" onclick="selectSize(8, 'small')" class="size-btn giant-btn px-2.5 py-1 bg-pink-50 text-pink-600 rounded-lg text-xs font-bold border border-pink-200">
                        🐱 細
                    </button>
                    <button id="size-medium" onclick="selectSize(18, 'medium')" class="size-btn giant-btn px-2.5 py-1 bg-pink-100 text-pink-700 rounded-lg text-xs font-bold border border-pink-300 active">
                        🐶 中
                    </button>
                    <button id="size-large" onclick="selectSize(36, 'large')" class="size-btn giant-btn px-2.5 py-1 bg-pink-50 text-pink-600 rounded-lg text-xs font-bold border border-pink-200">
                        🐻 粗
                    </button>
                </div>

                <!-- 貼紙：三個最愛 -->
                <div class="flex items-center space-x-1">
                    <span class="text-xs font-bold text-slate-400 mr-1">貼紙：</span>
                    <button onclick="selectStamp('🦖')" class="stamp-btn giant-btn w-10 h-10 bg-orange-50 hover:bg-orange-100 rounded-xl text-2xl flex items-center justify-center border border-orange-200">🦖</button>
                    <button onclick="selectStamp('💖')" class="stamp-btn giant-btn w-10 h-10 bg-orange-50 hover:bg-orange-100 rounded-xl text-2xl flex items-center justify-center border border-orange-200">💖</button>
                    <button onclick="selectStamp('⭐')" class="stamp-btn giant-btn w-10 h-10 bg-orange-50 hover:bg-orange-100 rounded-xl text-2xl flex items-center justify-center border border-orange-200">⭐</button>
                </div>
            </div>
        </div>
    </footer>

    <!-- 彈出通知層 -->
    <div id="popup-notice" class="fixed top-6 left-1/2 transform -translate-x-1/2 bg-pink-500 border-4 border-white text-white px-6 py-3 rounded-2xl font-bold text-base z-50 shadow-lg pointer-events-none opacity-0 transition-opacity duration-300">
        儲存成功囉！✨
    </div>

    <script>
        // --- 1. 極簡 Web Audio API 音樂鋼琴聲系統 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playNote(frequency, type = 'sine', duration = 0.3, volume = 0.1) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = type;
                osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (err) {
                console.log("Audio deferred", err);
            }
        }

        // 溫柔和諧的五聲音階 (Do Re Mi Sol La)
        const PENTATONIC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
        
        function playSoundByY(y, height) {
            const ratio = 1 - (y / height); // 越往上音越高
            const index = Math.floor(ratio * PENTATONIC.length);
            const clamped = Math.max(0, Math.min(PENTATONIC.length - 1, index));
            playNote(PENTATONIC[clamped], 'sine', 0.2, 0.05);
        }

        // --- 2. 畫布繪製狀態與初始化 ---
        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const pCanvas = document.getElementById('particle-canvas');
        const pCtx = pCanvas.getContext('2d');

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // 當前配置
        let config = {
            mode: 'draw',      // 'draw' 或是 'animate' 魔法動起來模式
            brush: 'normal',   // normal, rainbow, sparkle
            color: '#ef4444',  // 當前顏色
            eraser: false,     // 擦布模式
            size: 18,          // 預設中等
            stamp: null        // 貼紙
        };

        // 粒子系統 (星星特效)
        let particles = [];
        
        // 魔法動畫專用：儲存原圖、裁剪圖片及分身物件
        let backupCanvas = null; // 備份原圖用的 offscreen canvas
        let croppedDrawing = null; // 裁剪並去背後的小貼圖 canvas
        let bouncingClones = []; // 所有分身
        let magicSummonCount = 0; // 召喚分身數（給首頁徽章分數）

        // 核心：自適應大小並保持畫作
        function resizeCanvas() {
            // 如果是在動畫模式下，不希望重新定義大小打亂狀態
            if (config.mode === 'animate') return;

            const rect = canvas.getBoundingClientRect();
            
            if (canvas.width === 0) {
                canvas.width = rect.width;
                canvas.height = rect.height;
                pCanvas.width = rect.width;
                pCanvas.height = rect.height;
                clearCanvasDirectly();
            } else {
                // 調整視窗，先備份原本的畫作
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                tempCtx.drawImage(canvas, 0, 0);

                canvas.width = rect.width;
                canvas.height = rect.height;
                pCanvas.width = rect.width;
                pCanvas.height = rect.height;

                // 重新塗白並還原畫作
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
            }
        }

        function clearCanvasDirectly() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function clearCanvas() {
            if (config.mode === 'animate') {
                // 如果在動畫中，重畫會回到畫畫模式
                toggleMagicMove();
            }
            clearCanvasDirectly();
            playNote(180, 'sawtooth', 0.3, 0.1); // 可愛清除聲
            showNotice("畫板乾淨溜溜囉！✨");
        }

        // --- STREAMING_CHUNK: Pointer Events 萬能觸控與滑鼠事件處理 ---
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            return { x, y };
        }

        function startDrawing(e) {
            e.preventDefault();
            canvas.setPointerCapture(e.pointerId); // 鎖定觸控焦點

            const coords = getCoordinates(e);

            // 【特殊情況】如果是魔法動起來模式，點擊就是「召喚新分身」
            if (config.mode === 'animate') {
                spawnCloneAt(coords.x, coords.y);
                return;
            }

            // 如果選了貼紙，點擊就是貼上
            if (config.stamp) {
                placeStamp(coords.x, coords.y);
                return;
            }

            isDrawing = true;
            lastX = coords.x;
            lastY = coords.y;

            playSoundByY(coords.y, canvas.height);
            draw(e);
        }

        function draw(e) {
            if (!isDrawing || config.mode === 'animate') return;
            e.preventDefault();

            const coords = getCoordinates(e);
            const x = coords.x;
            const y = coords.y;

            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = config.size;

            if (config.eraser) {
                ctx.strokeStyle = '#ffffff'; // 擦布就是塗白色
            } else if (config.brush === 'rainbow') {
                const hue = (Date.now() / 8) % 360;
                ctx.strokeStyle = `hsl(${hue}, 90%, 60%)`;
            } else {
                ctx.strokeStyle = config.color;
            }

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();

            if (config.brush === 'sparkle' && !config.eraser) {
                createSparkle(x, y, config.color);
            }

            if (Math.abs(x - lastX) > 15 || Math.abs(y - lastY) > 15) {
                playSoundByY(y, canvas.height);
            }

            lastX = x;
            lastY = y;
        }

        function stopDrawing(e) {
            if (isDrawing) {
                isDrawing = false;
                canvas.releasePointerCapture(e.pointerId);
            }
        }

        canvas.addEventListener('pointerdown', startDrawing);
        canvas.addEventListener('pointermove', draw);
        canvas.addEventListener('pointerup', stopDrawing);
        canvas.addEventListener('pointercancel', stopDrawing);

        // --- STREAMING_CHUNK: 可愛星星特效引擎 ---
        function createSparkle(x, y, color) {
            for (let i = 0; i < 2; i++) {
                particles.push({
                    x: x,
                    y: y,
                    size: Math.random() * 8 + 4,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    color: color,
                    alpha: 1
                });
            }
        }

        function drawParticles() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                pCtx.save();
                pCtx.globalAlpha = p.alpha;
                pCtx.fillStyle = p.color;

                // 繪製閃爍四角星
                pCtx.beginPath();
                pCtx.moveTo(p.x, p.y - p.size);
                pCtx.quadraticCurveTo(p.x, p.y, p.x + p.size, p.y);
                pCtx.quadraticCurveTo(p.x, p.y, p.x, p.y + p.size);
                pCtx.quadraticCurveTo(p.x, p.y, p.x - p.size, p.y);
                pCtx.quadraticCurveTo(p.x, p.y, p.x, p.y - p.size);
                pCtx.fill();
                pCtx.restore();
            }

            requestAnimationFrame(drawParticles);
        }

        drawParticles();

        // --- STREAMING_CHUNK: 貼紙蓋章功能 ---
        function selectStamp(emoji) {
            if (config.mode === 'animate') {
                toggleMagicMove(); // 如果在動畫中，切換成貼紙會自動結束動畫
            }
            config.stamp = emoji;
            config.eraser = false;

            document.querySelectorAll('.stamp-btn').forEach(btn => {
                if (btn.innerText === emoji) {
                    btn.classList.add('border-pink-500', 'bg-pink-100', 'scale-110');
                } else {
                    btn.classList.remove('border-pink-500', 'bg-pink-100', 'scale-110');
                }
            });

            document.querySelectorAll('.color-btn, .brush-btn').forEach(btn => {
                btn.classList.remove('active', 'border-pink-500');
            });
            playNote(400, 'sine', 0.1);
        }

        function placeStamp(x, y) {
            if (!config.stamp) return;

            ctx.save();
            ctx.font = '60px Microsoft JhengHei, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(config.stamp, x, y);
            ctx.restore();

            for (let i = 0; i < 6; i++) {
                createSparkle(x, y, '#ff007f');
            }

            playNote(600, 'sine', 0.15, 0.15);
        }

        function resetStampSelection() {
            config.stamp = null;
            document.querySelectorAll('.stamp-btn').forEach(btn => {
                btn.classList.remove('border-pink-500', 'bg-pink-100', 'scale-110');
            });
        }

        // --- STREAMING_CHUNK: 顏色與筆刷切換 ---
        function selectColor(colorHex) {
            if (config.mode === 'animate') {
                toggleMagicMove(); // 如果在動畫中，切換顏色會自動結束動畫
            }
            config.color = colorHex;
            config.brush = 'normal';
            config.eraser = false;
            resetStampSelection();

            document.querySelectorAll('.color-btn').forEach(btn => {
                if (btn.style.backgroundColor === colorHex) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            document.getElementById('btn-eraser').classList.remove('active', 'border-pink-500');
            document.querySelectorAll('.brush-btn').forEach(btn => btn.classList.remove('active'));

            playNote(350, 'sine', 0.1);
        }

        function selectBrush(brushName) {
            if (config.mode === 'animate') {
                toggleMagicMove();
            }
            config.brush = brushName;
            config.eraser = false;
            resetStampSelection();

            document.querySelectorAll('.brush-btn').forEach(btn => {
                if (btn.id === `brush-${brushName}`) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-eraser').classList.remove('active', 'border-pink-500');

            playNote(500, 'sine', 0.1);
        }

        function selectEraser() {
            if (config.mode === 'animate') {
                toggleMagicMove();
            }
            config.eraser = true;
            resetStampSelection();

            document.getElementById('btn-eraser').classList.add('active', 'border-pink-500');
            document.querySelectorAll('.color-btn').forEach(btn => {
                if (btn.id !== 'btn-eraser') btn.classList.remove('active');
            });
            document.querySelectorAll('.brush-btn').forEach(btn => btn.classList.remove('active'));

            playNote(220, 'triangle', 0.1);
        }

        function selectSize(px, idName) {
            config.size = px;
            
            document.querySelectorAll('.size-btn').forEach(btn => {
                if (btn.id === `size-${idName}`) {
                    btn.classList.add('active', 'bg-pink-100', 'text-pink-700');
                } else {
                    btn.classList.remove('active', 'bg-pink-100', 'text-pink-700');
                    btn.classList.add('bg-pink-50', 'text-pink-600');
                }
            });
            playNote(440, 'sine', 0.1);
        }

        // --- STREAMING_CHUNK: 儲存與訊息彈窗 ---
        function saveArt() {
            playNote(523, 'sine', 0.1);
            setTimeout(() => playNote(659, 'sine', 0.1), 80);
            setTimeout(() => playNote(784, 'sine', 0.25), 160);

            setTimeout(() => {
                // 如果目前在動畫模式，我們儲存備份的原始畫作，而不是正在飛的畫面
                let dataURL;
                if (config.mode === 'animate' && backupCanvas) {
                    dataURL = backupCanvas.toDataURL("image/png");
                } else {
                    dataURL = canvas.toDataURL("image/png");
                }
                
                const link = document.createElement('a');
                link.download = `我的魔法畫作-${Date.now()}.png`;
                link.href = dataURL;
                link.click();
                showNotice("📸 畫作已經存進電腦裡囉！");
            }, 200);
        }

        function showNotice(msg) {
            const popup = document.getElementById('popup-notice');
            popup.innerText = msg;
            popup.style.opacity = '1';
            setTimeout(() => {
                popup.style.opacity = '0';
            }, 2000);
        }

        // --- STREAMING_CHUNK: 核心「魔法動起來」演算法與引擎 ---
        
        // 1. 自動辨識畫作，裁切並去背
        function cropAndExtractDrawing() {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            
            let minX = canvas.width, maxX = 0, minY = canvas.height, maxY = 0;
            let hasContent = false;

            // 掃描非白色像素 (當前底色預設為白)
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const idx = (y * canvas.width + x) * 4;
                    const r = data[idx];
                    const g = data[idx+1];
                    const b = data[idx+2];
                    const a = data[idx+3];

                    // 只要有一點點色彩且非純白(留有小誤差，>245 視為白)
                    if (a > 10 && (r < 245 || g < 245 || b < 245)) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                        hasContent = true;
                    }
                }
            }

            if (!hasContent) return null;

            // 邊緣微調填充 (10px 緩衝)
            const pad = 10;
            minX = Math.max(0, minX - pad);
            minY = Math.max(0, minY - pad);
            maxX = Math.min(canvas.width, maxX + pad);
            maxY = Math.min(canvas.height, maxY + pad);

            const w = maxX - minX;
            const h = maxY - minY;

            // 建立 offscreen canvas 保存裁剪出來的圖像
            const offscreen = document.createElement('canvas');
            offscreen.width = w;
            offscreen.height = h;
            const oCtx = offscreen.getContext('2d');
            oCtx.drawImage(canvas, minX, minY, w, h, 0, 0, w, h);

            // 為裁剪出來的圖案做白色去背
            const oImgData = oCtx.getImageData(0, 0, w, h);
            const oData = oImgData.data;
            for (let i = 0; i < oData.length; i += 4) {
                const r = oData[i];
                const g = oData[i+1];
                const b = oData[i+2];
                // 如果是白色，把透明度設為 0
                if (r > 245 && g > 245 && b > 245) {
                    oData[i+3] = 0;
                }
            }
            oCtx.putImageData(oImgData, 0, 0);

            return {
                img: offscreen,
                width: w,
                height: h
            };
        }

        // 2. 切換「魔法動起來」與「回去畫畫」模式
        function toggleMagicMove() {
            if (config.mode === 'draw') {
                // 試著擷取畫布內容
                const extracted = cropAndExtractDrawing();
                if (!extracted) {
                    showNotice("💡 要先畫畫，魔法才會發生喔！🦕");
                    playNote(150, 'triangle', 0.2);
                    return;
                }

                // 備份原始畫布 (以便之後還原)
                backupCanvas = document.createElement('canvas');
                backupCanvas.width = canvas.width;
                backupCanvas.height = canvas.height;
                backupCanvas.getContext('2d').drawImage(canvas, 0, 0);

                croppedDrawing = extracted;
                config.mode = 'animate';

                // 初始化多個分身
                bouncingClones = [];
                const count = Math.min(5, Math.max(2, Math.floor(600 / Math.max(extracted.width, extracted.height)))); // 根據大小決定初始分身數量
                for (let i = 0; i < count; i++) {
                    bouncingClones.push({
                        x: Math.random() * (canvas.width - 150) + 75,
                        y: Math.random() * (canvas.height - 150) + 75,
                        vx: (Math.random() - 0.5) * 5,
                        vy: (Math.random() - 0.5) * 5,
                        scale: 0.3 + Math.random() * 0.4,
                        rotation: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.04,
                        width: extracted.width,
                        height: extracted.height,
                        img: extracted.img
                    });
                }

                // 更新 UI 狀態
                document.getElementById('magic-btn-emoji').innerText = '✏️';
                document.getElementById('magic-btn-text').innerText = '回去畫畫';
                document.getElementById('sub-title-desc').innerText = '哇！你的畫作變出好多分身在跳舞！點擊畫面可以召喚更多喔！🎈';
                
                // 隱藏工具區，顯示特殊提示
                document.getElementById('drawing-tools-container').classList.add('hidden');
                document.getElementById('magic-instructions').classList.remove('hidden');

                playNote(523, 'sine', 0.2);
                setTimeout(() => playNote(659, 'sine', 0.2), 100);
                setTimeout(() => playNote(784, 'sine', 0.3), 200);

                // 啟動物理引擎動畫循環
                animatePhysics();
            } else {
                // 回去畫畫模式
                config.mode = 'draw';

                // 還原原始畫作
                if (backupCanvas) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(backupCanvas, 0, 0);
                }

                // 還原 UI 狀態
                document.getElementById('magic-btn-emoji').innerText = '✨';
                document.getElementById('magic-btn-text').innerText = '魔法動起來';
                document.getElementById('sub-title-desc').innerText = '點顏色就能畫畫，還有好聽的音樂喔！🌟';
                
                document.getElementById('drawing-tools-container').classList.remove('hidden');
                document.getElementById('magic-instructions').classList.add('hidden');

                playNote(392, 'sine', 0.15);
                setTimeout(() => playNote(261, 'sine', 0.25), 80);
            }
        }

        // 3. 在點擊滑鼠/觸控位置召喚新分身
        function spawnCloneAt(x, y) {
            if (!croppedDrawing) return;
            magicSummonCount++;
            { const _p = parseInt(localStorage.getItem('edtech-unit18-score')||'0',10); if (magicSummonCount > _p) localStorage.setItem('edtech-unit18-score', magicSummonCount); }

            bouncingClones.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10, // 飛出去的速度稍微快一點
                vy: (Math.random() - 0.5) * 10,
                scale: 0.2 + Math.random() * 0.4,
                rotation: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.1,
                width: croppedDrawing.width,
                height: croppedDrawing.height,
                img: croppedDrawing.img
            });

            // 爆開星星特效
            for (let i = 0; i < 8; i++) {
                createSparkle(x, y, '#feca57');
            }

            playNote(600 + Math.random() * 200, 'sine', 0.15, 0.12);
        }

        // 4. 動態物理彈跳與繪製循環
        function animatePhysics() {
            if (config.mode !== 'animate') return;

            // 1. 清空主畫布 (填上純白底)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 逐一更新分身並繪製
            bouncingClones.forEach(c => {
                c.x += c.vx;
                c.y += c.vy;
                c.rotation += c.vRot;

                const halfW = (c.width * c.scale) / 2;
                const halfH = (c.height * c.scale) / 2;

                // 左右邊框彈回
                if (c.x - halfW < 0) {
                    c.vx *= -1;
                    c.x = halfW;
                    playBounceSound(c.y);
                } else if (c.x + halfW > canvas.width) {
                    c.vx *= -1;
                    c.x = canvas.width - halfW;
                    playBounceSound(c.y);
                }

                // 上下邊框彈回
                if (c.y - halfH < 0) {
                    c.vy *= -1;
                    c.y = halfH;
                    playBounceSound(c.y);
                } else if (c.y + halfH > canvas.height) {
                    c.vy *= -1;
                    c.y = canvas.height - halfH;
                    playBounceSound(c.y);
                }

                // 繪製含有旋轉、縮放的分身
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.rotate(c.rotation);
                ctx.scale(c.scale, c.scale);
                ctx.drawImage(c.img, -c.width / 2, -c.height / 2);
                ctx.restore();
            });

            // 持續動畫循環
            requestAnimationFrame(animatePhysics);
        }

        // 彈跳時發出鋼琴琴音
        function playBounceSound(y) {
            playSoundByY(y, canvas.height);
        }


        // --- 3. 啟動與視窗調整監聽 ---
        window.onload = function() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // 音訊鎖解鎖
            document.body.addEventListener('pointerdown', () => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }, { once: true });
        };
    </script>
