    .sc-neg {

      background: #FFF9F2;
    }
    .sc-desk-bg {

      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .sc-desk-tip {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);

      line-height: 1.3;
    }

      height: 24px;
      flex: 0 0 auto;
    }

      padding: 4px;

    .sc-hotspot svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .sc-hotspot:hover:not(:disabled) {
      transform: translateY(-4px);
      background: rgba(255, 240, 196, .55);
      border-color: var(--orange);
      box-shadow: 0 8px 16px rgba(59, 35, 80, .14);

      transform: translateY(1px);
    }
    .sc-hotspot:focus-visible {
      outline: 4px solid var(--violet);
      outline-offset: 3px;
    }
    .sc-hotspot:disabled {
      cursor: default;
    }
    .sc-hotspot.is-ok {
      background: var(--ok-soft);
      border-color: var(--ok);
      box-shadow: 0 6px 0 rgba(24, 107, 65, .28);
      animation: sc-pop .32s ease-out;
    }
    .sc-hotspot.is-bad {
      background: var(--bad-soft);
      border-color: var(--bad);
      box-shadow: 0 6px 0 rgba(180, 55, 43, .28);
      animation: sc-shake .32s ease-out;
    }

      left: 50%;
      bottom: -14px;
      width: 22px;
      height: 22px;

      align-items: center;

      white-space: nowrap;
      font-weight: 700;
      line-height: 1.45;

    .sc-line.sm-zy {

    .sc-pet-wrap {

      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--ink);

      font-size: 20px;
      white-space: nowrap;
      display: inline-flex;

      height: 18px;

    @keyframes sc-pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
    @keyframes sc-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      65% { transform: translateX(7px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .sc-hotspot, .sc-opt { transition: none !important; }

    }

          '<rect x="20" y="70" width="24" height="44" rx="12" fill="#FF8F3F" stroke="#3B2350" stroke-width="4.5"/>' +
          '<rect x="96" y="70" width="24" height="44" rx="12" fill="#FF8F3F" stroke="#3B2350" stroke-width="4.5"/>' +
          '<rect x="38" y="76" width="9" height="32" rx="4.5" fill="#FFF0C4" stroke="#3B2350" stroke-width="3"/>' +
          '<rect x="93" y="76" width="9" height="32" rx="4.5" fill="#FFF0C4" stroke="#3B2350" stroke-width="3"/>' +
        '</svg>',

      speaker:
        '<svg viewBox="0 0 130 138">' +
          '<rect x="22" y="14" width="76" height="110" rx="15" fill="#FFF9F2" stroke="#3B2350" stroke-width="4.5"/>' +
          '<circle cx="60" cy="44" r="14" fill="#ECE3FA" stroke="#3B2350" stroke-width="4"/>' +
          '<circle cx="60" cy="44" r="5" fill="#6A45C9"/>' +
          '<circle cx="60" cy="88" r="22" fill="#FFE1CB" stroke="#3B2350" stroke-width="4"/>' +
          '<circle cx="60" cy="88" r="8" fill="#FF8F3F" stroke="#3B2350" stroke-width="2.5"/>' +
          '<path d="M107 46c8 8 8 22 0 30M116 36c13 14 13 36 0 50" fill="none" stroke="#6A45C9" stroke-width="4" stroke-linecap="round"/>' +
        '</svg>',

      screen:
        '<svg viewBox="0 0 290 190">' +
          '<rect x="14" y="8" width="262" height="142" rx="16" fill="#FFF9F2" stroke="#3B2350" stroke-width="5"/>' +
          '<rect x="28" y="22" width="234" height="114" rx="8" fill="#9BD7F2" stroke="#3B2350" stroke-width="3.5"/>' +
          '<path d="M30 114 Q100 72 162 108 T260 96 V134 H30 Z" fill="#7CC79A"/>' +
          '<circle cx="222" cy="48" r="14" fill="#FFD65E"/>' +
          '<rect x="44" y="36" width="24" height="24" rx="6" fill="#FFF9F2" stroke="#3B2350" stroke-width="2.5"/>' +
          '<rect x="44" y="68" width="24" height="24" rx="6" fill="#FFF0C4" stroke="#3B2350" stroke-width="2.5"/>' +
          '<rect x="128" y="150" width="34" height="26" rx="4" fill="#ECE3FA" stroke="#3B2350" stroke-width="4.5"/>' +
          '<rect x="92" y="172" width="106" height="12" rx="6" fill="#FFF9F2" stroke="#3B2350" stroke-width="4.5"/>' +
        '</svg>',

      keyboard:
        '<svg viewBox="0 0 300 112">' +
          '<rect x="8" y="10" width="284" height="92" rx="14" fill="#FFF9F2" stroke="#3B2350" stroke-width="5"/>' +
          (function () {
            var s = '', r, c;
            for (r = 0; r < 3; r++) {
              for (c = 0; c < 11; c++) {
                s += '<rect x="' + (22 + c * 23.5) + '" y="' + (22 + r * 20) + '" width="18" height="14" rx="3.5" fill="' +
                  ((r === 1 && c === 5) ? '#FFE1CB' : '#ECE3FA') + '" stroke="#5C4870" stroke-width="2"/>';
              }
            }
            return s;
          })() +
          '<rect x="82" y="82" width="136" height="12" rx="5" fill="#FF8F3F" stroke="#3B2350" stroke-width="2.5"/>' +
        '</svg>',

      mouse:
        '<svg viewBox="0 0 118 106">' +
          '<path d="M59 4c0 10 12 10 12 18" fill="none" stroke="#5C4870" stroke-width="4.5" stroke-linecap="round"/>' +
          '<rect x="28" y="20" width="62" height="80" rx="31" fill="#FFF9F2" stroke="#3B2350" stroke-width="4.5"/>' +
          '<path d="M59 22v30M30 52h58" stroke="#3B2350" stroke-width="4"/>' +
          '<rect x="54" y="30" width="10" height="16" rx="5" fill="#FF8F3F" stroke="#3B2350" stroke-width="2.5"/>' +
          '<circle cx="74" cy="76" r="5" fill="#ECE3FA"/>' +
        '</svg>',

      host:
        '<svg viewBox="0 0 148 266">' +
          '<rect x="14" y="10" width="120" height="246" rx="18" fill="#FFF9F2" stroke="#3B2350" stroke-width="5"/>' +
          '<rect x="30" y="30" width="88" height="22" rx="6" fill="#ECE3FA" stroke="#3B2350" stroke-width="3.5"/>' +
          '<rect x="30" y="64" width="52" height="12" rx="4" fill="#D4C4F4" stroke="#3B2350" stroke-width="2.5"/>' +
          '<circle cx="104" cy="70" r="6" fill="#186B41"/>' +
          '<circle cx="74" cy="122" r="22" fill="#FFE1CB" stroke="#FF8F3F" stroke-width="4"/>' +
          '<circle cx="74" cy="122" r="14" fill="#FF8F3F" stroke="#3B2350" stroke-width="3.5"/>' +
          '<path d="M74 114v8" stroke="#FFF9F2" stroke-width="3.5" stroke-linecap="round"/>' +
          '<rect x="32" y="172" width="84" height="10" rx="5" fill="#D4C4F4"/>' +
          '<rect x="32" y="192" width="84" height="10" rx="5" fill="#D4C4F4"/>' +
          '<rect x="32" y="212" width="84" height="10" rx="5" fill="#D4C4F4"/>' +
          '<rect x="32" y="232" width="84" height="10" rx="5" fill="#D4C4F4"/>' +
        '</svg>'
    };

    // 小圖示 SVG（提示手勢、名牌星星）
    var MINI_SVG = {
      tap: '<svg viewBox="0 0 24 24" fill="none" stroke="#3B2350" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M12 3v3M5.5 6.5l2 2M18.5 6.5l-2 2"/>' +
        '<path d="M10 11v6l-2-1.5a1.5 1.5 0 0 0-2 2.2l4 3.8h6a3 3 0 0 0 3-3v-4a2 2 0 0 0-2-2h-3V9.5a1.5 1.5 0 0 0-4 0V11z" fill="#FF8F3F"/>' +
      '</svg>',
      star: '<svg viewBox="0 0 24 24" fill="#FFC233" stroke="#A8670E" stroke-width="2" stroke-linejoin="round">' +
        '<polygon points="12,2.5 15,8.6 21.6,9.5 16.8,14.2 18,20.8 12,17.6 6,20.8 7.2,14.2 2.4,9.5 9,8.6"/>' +
      '</svg>'
    };

    // 工具：依文字建立安全顯示字串
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 工具：計算本關星星數（對齊 SCENE_CONFIG.STARS）
    function calcStars(rightCount) {
      if (rightCount >= SCENE_CONFIG.STARS.three) return 3;
      if (rightCount >= SCENE_CONFIG.STARS.two) return 2;
      return 1;
    }

    // 掛載小常識島第 29 關
    SmartIsland.mount({
      unit: 29,
      title: '寵物的新電腦',
      grade: '1–2 年級',
      howto: '寵物買了新電腦！請你幫牠找出滑鼠。',
      zhuyin: true,
      teach: '認識常見的資訊設備與用途｜資E1 認識常見的資訊系統',
      levels: SCENE_CONFIG.LEVELS.map(function (lv, idx) {
        return { name: lv.name, icon: LEVEL_ICONS[idx] };
      }),

      scene: function (api) {
        var alive = false;
        var locked = false;
        var runToken = 0; // 用於作廢離開關卡後才 resolve 的 Promise
        var levelIdx = 0;
        var qIdx = 0;
        var review = [];
        var timers = [];
        var keyHandler = null;

        // 清除所有計時器與鍵盤監聽
        function cleanup() {
          alive = false;
          locked = false;
          runToken += 1;
          while (timers.length) {
            clearTimeout(timers.pop());
          }
          api.field.onclick = null;
          if (keyHandler) {
            document.removeEventListener('keydown', keyHandler);
            keyHandler = null;
          }
        }

        // 取得寵物名字（安全預設）
        function getPetName() {
          var p = api.pet ? api.pet() : null;
          return (p && p.name) ? p.name : '小雲';
        }

        // 渲染右側寵物陪伴區
        function buildPetBox(lines, mood, opts) {
          var petName = getPetName();
          var zyCls = api.zy ? ' sm-zy' : '';
          var lineHtml = lines.map(function (line) {
            var txt = line.replace(/\{PET\}/g, petName);
            return '<span class="sc-line' + zyCls + '">' + escapeHTML(txt) + '</span>';
          }).join('');

          return (
            '<div class="sc-petbox">' +
              '<div class="clay sc-bubble" aria-live="polite">' +
                '<div class="sc-bubble-lines">' + lineHtml + '</div>' +
              '</div>' +
              '<div class="sc-pet-wrap">' +
                '<div class="sc-pet-shadow"></div>' +
                '<div class="sc-pet">' + api.petSVG(mood, opts) + '</div>' +
              '</div>' +
              '<div class="sc-petname">' + MINI_SVG.star + '<span>' + escapeHTML(petName) + '</span></div>' +
            '</div>'
          );
        }

        // 更新寵物表情與泡泡（作答瞬間給予即時情緒回饋）
        function updatePet(lines, mood, opts) {
          var box = api.field.querySelector('.sc-petbox');
          if (!box) return;
          box.outerHTML = buildPetBox(lines, mood, opts);
        }

        // 渲染第 1 關（書桌場景）
        function renderDeskLevel(lv, Q) {
          var zyCls = api.zy ? ' sm-zy' : '';
          var hotspots = SCENE_CONFIG.DESK_ITEMS.map(function (item) {
            return (
              '<button type="button" class="sc-hotspot" data-key="' + item.key + '" ' +
                'style="left:' + item.x + 'px;top:' + item.y + 'px;width:' + item.w + 'px;height:' + item.h + 'px;" ' +
                'aria-label="' + item.posLabel + '">' +
                DESK_DEVICE_SVG[item.key] +
              '</button>'
            );
          }).join('');

          api.field.innerHTML =
            '<div class="sc-stage">' +
              '<div class="clay sc-q">' +
                '<span class="sc-q-num">' + (qIdx + 1) + '</span>' +
                '<p class="sc-q-text' + zyCls + '">' + (Q.qHtml || escapeHTML(Q.q)) + '</p>' +
              '</div>' +
              '<div class="clay sc-desk-wrap">' +
                DESK_BG_SVG +
                hotspots +
                '<div class="sc-desk-tip">' +
                  MINI_SVG.tap +
                  '<span class="' + (api.zy ? 'sm-zy' : '') + '">點一點書桌上的設備</span>' +
                '</div>' +
              '</div>' +
              buildPetBox(Q.petLines, 'normal', { q: true }) +
            '</div>';
        }

        // 渲染第 2、3 關（3 張大圖卡）
        function renderCardLevel(lv, Q) {
          var zyCls = api.zy ? ' sm-zy' : '';
          var cards = Q.options.map(function (opt, idx) {
            return (
              '<button type="button" class="clay sc-opt" data-idx="' + idx + '" aria-label="選項 ' + (idx + 1) + '：' + escapeHTML(opt.text) + '">' +
                '<span class="sc-tag">' + (idx + 1) + '</span>' +
                '<div class="sc-pic">' + (PIC[opt.pic] || '') + '</div>' +
                '<span class="sc-label' + zyCls + '">' + escapeHTML(opt.text) + '</span>' +
              '</button>'
            );
          }).join('');

          api.field.innerHTML =
            '<div class="sc-stage">' +
              '<div class="clay sc-q">' +
                '<span class="sc-q-num">' + (qIdx + 1) + '</span>' +
                '<p class="sc-q-text' + zyCls + '">' + (Q.qHtml || escapeHTML(Q.q)) + '</p>' +
              '</div>' +
              '<div class="sc-opts">' + cards + '</div>' +
              buildPetBox(Q.petLines, 'normal', { q: true }) +
            '</div>';
        }

        // 出目前這一題
        function ask() {
          var lv = SCENE_CONFIG.LEVELS[levelIdx];
          var Q = lv.questions[qIdx];
          locked = false;
          api.progress(qIdx + 1, lv.questions.length);

          if (lv.mode === 'desk') {
            renderDeskLevel(lv, Q);
          } else {
            renderCardLevel(lv, Q);
          }
        }

        // 鎖定場上所有作答按鈕（防止連點兩次）
        function lockButtons() {
          var btns = api.field.querySelectorAll('.sc-hotspot, .sc-opt');
          for (var i = 0; i < btns.length; i++) {
            btns[i].disabled = true;
          }
        }

        // 在被點選的按鈕上加上 ✓ / ✗ 徽章
        function markButton(btn, ok) {
          btn.classList.add(ok ? 'is-ok' : 'is-bad');
          var badge = document.createElement('span');
          badge.className = 'sc-mark ' + (ok ? 'ok' : 'bad');
          badge.setAttribute('aria-hidden', 'true');
          badge.textContent = ok ? '✓' : '✗';
          btn.appendChild(badge);
        }

        // 進入回饋與下一題（寬鬆過關：答錯也能繼續，整關完成一定呼叫 api.finish）
        function commitAnswer(btn, ok, explainText) {
          var lv = SCENE_CONFIG.LEVELS[levelIdx];
          var Q = lv.questions[qIdx];
          var myToken = runToken;

          locked = true;
          lockButtons();
          markButton(btn, ok);

          if (ok) {
            updatePet(['答對了，太棒了！'], 'happy', { spark: true });
          } else {
            updatePet(['原來是這樣，', '記起來！'], 'worried', { sweat: true });
          }

          review.push({ ok: ok, q: Q.q });

          // 短暫停頓 260ms 讓孩子看見場上 ✓/✗ 與寵物表情，再跳出共用回饋卡
          var tid = setTimeout(function () {
            if (!alive || myToken !== runToken) return;
            api.feedback({
              ok: ok,
              explain: explainText,
              zyExplain: true
            }).then(function () {
              if (!alive || myToken !== runToken) return;
              qIdx += 1;
              if (qIdx < lv.questions.length) {
                ask();
                return;
              }
              var rightCount = review.filter(function (r) { return r.ok; }).length;
              var allRight = rightCount === lv.questions.length;
              api.finish({
                stars: calcStars(rightCount),
                review: review,
                learned: lv.learned,
                retry: allRight ? '' : lv.retry
              });
            });
          }, 260);
          timers.push(tid);
        }

        // 處理第 1 關點擊書桌設備
        function handleDeskClick(btn) {
          var lv = SCENE_CONFIG.LEVELS[levelIdx];
          var Q = lv.questions[qIdx];
          var targetKey = Q.options[Q.ans].pic;
          var clickedKey = btn.dataset.key;
          var ok = clickedKey === targetKey;

          var clickedItem = null;
          for (var i = 0; i < SCENE_CONFIG.DESK_ITEMS.length; i++) {
            if (SCENE_CONFIG.DESK_ITEMS[i].key === clickedKey) {
              clickedItem = SCENE_CONFIG.DESK_ITEMS[i];
              break;
            }
          }
          var explainText = ok
            ? Q.explain
            : ('這是' + (clickedItem ? clickedItem.name : '別的設備') + '喔！' + Q.explain);

          commitAnswer(btn, ok, explainText);
        }

        // 處理第 2、3 關點擊圖卡
        function handleCardClick(btn) {
          var lv = SCENE_CONFIG.LEVELS[levelIdx];
          var Q = lv.questions[qIdx];
          var idx = parseInt(btn.dataset.idx, 10);
          var ok = idx === Q.ans;
          commitAnswer(btn, ok, Q.explain);
        }

        return {
          start: function (idx) {
            cleanup();
            levelIdx = (typeof idx === 'number' && SCENE_CONFIG.LEVELS[idx]) ? idx : 0;
            qIdx = 0;
            review = [];
            alive = true;
            api.field.innerHTML = '';
            ask();

            // 場景統一點擊代理
            api.field.onclick = function (e) {
              if (!alive || locked) return;
              var lv = SCENE_CONFIG.LEVELS[levelIdx];
              if (lv.mode === 'desk') {
                var spot = e.target.closest('.sc-hotspot');
                if (spot && !spot.disabled) handleDeskClick(spot);
              } else {
                var opt = e.target.closest('.sc-opt');
                if (opt && !opt.disabled) handleCardClick(opt);
              }
            };

            // 鍵盤 1 / 2 / 3 快捷作答（僅第 2、3 關卡片模式，離開時移除）
            keyHandler = function (e) {
              if (!alive || locked) return;
              var lv = SCENE_CONFIG.LEVELS[levelIdx];
              if (lv.mode !== 'cards') return;
              if (e.key === '1' || e.key === '2' || e.key === '3') {
                var n = parseInt(e.key, 10) - 1;
                var btn = api.field.querySelector('.sc-opt[data-idx="' + n + '"]');
                if (btn && !btn.disabled) handleCardClick(btn);
              }
            };
            document.addEventListener('keydown', keyHandler);
          },

          stop: function () {
            cleanup();
          }
        };
      }
    });
  })();
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
