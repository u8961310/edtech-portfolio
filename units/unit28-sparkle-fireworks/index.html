<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>閃亮亮煙火畫 - 畫畫島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@600;700&display=swap">
  <link rel="stylesheet" href="../../assets/css/art-island.css">
  <style>
    /* ===== 本關場景樣式（一律以 sc- 開頭，不修改任何 .ai- 共用樣式） ===== */
    .sc-tools {
      position: absolute;
      left: 18px;
      top: 8px;
      width: 244px;
      bottom: 14px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      box-sizing: border-box;
    }
    .sc-sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font: 700 16px var(--f-ui);
      color: var(--ink-2);
      line-height: 1.2;
    }
    .sc-sec-note {
      font: 700 14px var(--f-ui);
      color: var(--blue);
      white-space: nowrap;
    }

    /* 6 支魔法筆網格 */
    .sc-brushes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .sc-brush {
      position: relative;
      min-height: 48px;
      padding: 4px 6px;
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-shadow: 0 3px 0 var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font: 700 16px var(--f-ui);
      color: var(--ink);
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .sc-brush:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }
    .sc-brush svg {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
    }

    /* 被選到的共用狀態（藍底、藍框、外圈 2px 藍、右上角藍色 ✓） */
    .sc-on {
      background: var(--blue-soft) !important;
      border-color: var(--blue) !important;
      box-shadow: 0 0 0 2px var(--blue), 0 3px 0 var(--blue) !important;
      color: var(--ink);
    }
    .sc-chk {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--blue);
      border: 2px solid #fff;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
    }
    .sc-chk svg {
      width: 13px;
      height: 13px;
    }
    .sc-on .sc-chk {
      display: flex;
    }

    /* 色盤區（12 色，每顆 44x44）與貼紙子選單（同高度，切換不跳動） */
    .sc-mid-area {
      min-height: 146px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .sc-colors {
      display: grid;
      grid-template-columns: repeat(4, 44px);
      justify-content: space-between;
      gap: 6px;
    }
    .sc-colors.sc-muted {
      opacity: 0.48;
    }
    .sc-sw {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 3px solid var(--ink);
      box-shadow: 0 2px 0 var(--ink);
      cursor: pointer;
      padding: 0;
    }
    .sc-sw.sc-on {
      background: unset !important;
      border-color: var(--ink) !important;
      box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--blue) !important;
    }
    .sc-sw .sc-chk {
      top: -9px;
      right: -9px;
      width: 20px;
      height: 20px;
    }
    .sc-rainbow-pill {
      margin-top: 6px;
      padding: 4px 8px;
      border-radius: 10px;
      background: var(--blue-soft);
      border: 2px solid var(--blue);
      color: var(--blue);
      font: 700 14px var(--f-ui);
      text-align: center;
      white-space: nowrap;
      display: none;
    }
    .sc-rainbow-pill.sc-show {
      display: block;
    }

    /* 會動貼紙 4 種選擇按鈕 */
    .sc-stickers {
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .sc-stickers.sc-show {
      display: grid;
    }
    .sc-sticker-btn {
      position: relative;
      height: 66px;
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-shadow: 0 3px 0 var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font: 700 16px var(--f-ui);
      color: var(--ink);
      white-space: nowrap;
      cursor: pointer;
    }
    .sc-sticker-btn svg {
      width: 30px;
      height: 30px;
    }

    /* 筆刷 3 種粗細 */
    .sc-sizes {
      display: flex;
      gap: 7px;
    }
    .sc-size {
      position: relative;
      flex: 1;
      height: 46px;
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-shadow: 0 3px 0 var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font: 700 16px var(--f-ui);
      color: var(--ink);
      white-space: nowrap;
      cursor: pointer;
    }
    .sc-size i {
      display: block;
      border-radius: 50%;
      background: var(--ink);
    }

    /* 復原與清除 */
    .sc-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    .sc-actions .ai-btn {
      flex: 1;
      min-height: 46px;
      padding: 0 6px;
      font-size: 17px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .sc-actions svg {
      width: 19px;
      height: 19px;
      flex: 0 0 19px;
    }

    /* 中央畫布區（外層放膠帶，內層 .ai-board 放三層 canvas） */
    .sc-board-wrap {
      position: absolute;
      left: 278px;
      top: 10px;
      width: 786px;
      height: 572px;
    }
    .sc-board-wrap .ai-tape {
      pointer-events: none;
      z-index: 5;
    }
    .sc-board {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      padding: 0;
      box-sizing: border-box;
    }
    .sc-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .sc-layer-fx {
      touch-action: none;
      cursor: crosshair;
      z-index: 3;
    }
    .sc-layer-draw {
      z-index: 2;
      pointer-events: none;
    }
    .sc-layer-bg {
      z-index: 1;
      pointer-events: none;
    }

    /* 右側面板（吉祥物、放煙火秀、音效開關、完成） */
    .sc-side {
      position: absolute;
      left: 1080px;
      right: 18px;
      top: 8px;
      bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sc-mascot-card {
      flex: 1;
      padding: 12px 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      overflow: hidden;
    }
    .sc-mascot-svg {
      width: 108px;
      height: 104px;
      flex: 0 0 auto;
    }
    .sc-mascot-svg.sc-hop {
      animation: sc-hop 0.42s ease;
    }
    .sc-mascot-svg.sc-shake {
      animation: sc-shake 0.38s ease;
    }
    .sc-eyes {
      transform-origin: 60px 62px;
      animation: sc-blink 4.8s infinite;
    }
    .sc-bubble {
      width: 100%;
      min-height: 86px;
      padding: 10px 10px;
      background: var(--sun-soft);
      border: 3px solid var(--ink);
      border-radius: 14px;
      color: var(--ink);
      font-size: 22px;
      line-height: 1.55;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    /* 放煙火秀按鈕 */
    .sc-show-btn {
      min-height: 66px;
      padding: 0 12px;
      font: 900 23px var(--f-title);
      background: var(--blue-soft);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }
    .sc-show-btn svg {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
    }
    .sc-show-btn.sc-playing {
      background: var(--sun-soft);
      border-color: var(--blue);
      box-shadow: 0 0 0 2px var(--blue), 0 4px 0 var(--ink);
    }
    .sc-show-btn.sc-shake {
      animation: sc-shake 0.36s ease;
    }

    /* 音效開關按鈕 */
    .sc-sound-btn {
      position: relative;
      min-height: 54px;
      padding: 0 12px;
      font: 700 19px var(--f-ui);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }
    .sc-sound-btn svg {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
    }

    /* 完成大按鈕 */
    .sc-done {
      min-height: 76px;
      font: 900 30px var(--f-title);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .sc-done svg {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
    }

    /* 可愛短回饋動畫（護眼：低頻率、不閃爍） */
    @keyframes sc-blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%, 97% { transform: scaleY(0.12); }
    }
    @keyframes sc-hop {
      0% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-10px) scale(1.06); }
      70% { transform: translateY(2px) scale(0.97); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes sc-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      55% { transform: translateX(6px); }
      80% { transform: translateX(-3px); }
    }

    /* 尊重系統減少動態偏好 */
    @media (prefers-reduced-motion: reduce) {
      .sc-eyes,
      .sc-mascot-svg.sc-hop,
      .sc-mascot-svg.sc-shake,
      .sc-show-btn.sc-shake {
        animation: none !important;
      }
      .sc-brush {
        transition: none !important;
      }
    }
  </style>
</head><body>

          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, t);
          osc.frequency.exponentialRampToValueAtTime(920, t + 0.065);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.09, t + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.075);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.08);
        }

        // 貼紙蓋上可愛雙音
        function playStickerSound() {
          if (!soundEnabled) return;
          var ctx = ensureAudio();
          if (!ctx) return;
          var t = ctx.currentTime;
          [659.25, 880.0].forEach(function (freq, idx) {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t + idx * 0.06);
            gain.gain.setValueAtTime(0.001, t + idx * 0.06);
            gain.gain.linearRampToValueAtTime(0.08, t + idx * 0.06 + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.06 + 0.14);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t + idx * 0.06);
            osc.stop(t + idx * 0.06 + 0.15);
          });
        }

        /* -----------------------------------------------------------------
         * 2. 四種背景繪製（只畫在背景層 bgCanvas，不干擾作畫層）

        function drawBackground(lvId) {
          bgCtx.clearRect(0, 0, W, H);

          if (lvId === 'night') {
            // 星空夜晚：深藍漸層、彎月、遠山、繁星

              bgCtx.beginPath();
              bgCtx.arc(sx, sy, sr, 0, Math.PI * 2);

            }

            // 溫柔彎月
            bgCtx.save();
            bgCtx.fillStyle = '#FFE588';
            bgCtx.beginPath();
            bgCtx.arc(684, 84, 34, 0, Math.PI * 2);
            bgCtx.fill();
            bgCtx.fillStyle = '#111F4E';
            bgCtx.beginPath();
            bgCtx.arc(698, 76, 30, 0, Math.PI * 2);

            // 下方柔和山丘剪影

            var backRoofs = [
              [0, 115, 76], [70, 130, 60], [126, 108, 92], [212, 128, 70],

            bgCtx.beginPath();

            bgCtx.moveTo(620, H - 146);
            bgCtx.lineTo(644, H - 60);
            bgCtx.stroke();

            // 前景城市屋頂剪影
            var frontRoofs = [
              { x: 0, w: 68, h: 86, roof: 'flat' },
              { x: 64, w: 72, h: 108, roof: 'gable' },
              { x: 132, w: 84, h: 78, roof: 'flat' },
              { x: 212, w: 66, h: 124, roof: 'spire' },
              { x: 274, w: 96, h: 82, roof: 'flat' },
              { x: 366, w: 76, h: 102, roof: 'gable' },
              { x: 438, w: 88, h: 74, roof: 'flat' },
              { x: 522, w: 72, h: 98, roof: 'flat' },

            ];
            bgCtx.fillStyle = '#0D132B';

            // 上方淡淡水波光束
            bgCtx.save();

            [110, 310, 540].forEach(function (rx) {

              bgCtx.closePath();

            // 海底柔和沙丘
            bgCtx.fillStyle = '#072D38';
            bgCtx.beginPath();
            bgCtx.moveTo(0, H);

        /* -----------------------------------------------------------------
         * 3. 向量繪製工具（四芒星、貼紙、泡泡圈、霓虹線段）
         * ----------------------------------------------------------------- */
        function drawFourStar(ctx, x, y, r, color, strokeColor) {
          ctx.save();
          ctx.translate(x, y);
          ctx.beginPath();
          for (var i = 0; i < 8; i++) {
            var rad = (i % 2 === 0) ? r : r * 0.34;
            var ang = (i * Math.PI) / 4;
            var px = Math.cos(ang) * rad;
            var py = Math.sin(ang) * rad;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fillStyle = color;
          ctx.fill();
          if (strokeColor) {
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 1.2;
            ctx.stroke();
          }
          ctx.restore();
        }

        // 畫出 4 種可愛貼紙（用於動畫層與最後印上作畫層）
        function drawStickerShape(ctx, type, x, y, scale, rot, accentColor) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rot || 0);
          ctx.scale(scale || 1, scale || 1);
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';

          if (type === 'rocket') {
            // 尾焰
            ctx.fillStyle = '#FF702A';
            ctx.strokeStyle = '#1F2A4D';
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.moveTo(-7, 15);
            ctx.lineTo(0, 29);
            ctx.lineTo(7, 15);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // 尾翼
            ctx.fillStyle = '#FFB627';
            ctx.beginPath();
            ctx.moveTo(-12, 4); ctx.lineTo(-22, 16); ctx.lineTo(-10, 16); ctx.closePath();
            ctx.moveTo(12, 4); ctx.lineTo(22, 16); ctx.lineTo(10, 16); ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // 機身
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.moveTo(0, -28);
            ctx.quadraticCurveTo(16, -12, 13, 16);
            ctx.lineTo(-13, 16);
            ctx.quadraticCurveTo(-16, -12, 0, -28);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // 機頭色帽
            ctx.fillStyle = accentColor || '#FF4D6D';
            ctx.beginPath();
            ctx.moveTo(0, -28);
            ctx.quadraticCurveTo(9, -18, 10.5, -10);
            ctx.lineTo(-10.5, -10);
            ctx.quadraticCurveTo(-9, -18, 0, -28);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // 圓窗
            ctx.fillStyle = '#4CC9F0';
            ctx.beginPath();
            ctx.arc(0, 1, 6.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(-2, -1, 2, 0, Math.PI * 2);
            ctx.fill();
          } else if (type === 'star') {
            ctx.fillStyle = '#FFD93D';
            ctx.strokeStyle = '#1F2A4D';
            ctx.lineWidth = 2.8;
            ctx.beginPath();
            for (var i = 0; i < 10; i++) {
              var r = (i % 2 === 0) ? 26 : 12;
              var a = (i * Math.PI) / 5 - Math.PI / 2;
              var sx = Math.cos(a) * r;
              var sy = Math.sin(a) * r;
              if (i === 0) ctx.moveTo(sx, sy);
              else ctx.lineTo(sx, sy);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // 可愛臉蛋
            ctx.fillStyle = '#1F2A4D';
            ctx.beginPath();
            ctx.arc(-5.5, -1, 2.4, 0, Math.PI * 2);
            ctx.arc(5.5, -1, 2.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FF8FAB';
            ctx.beginPath();
            ctx.ellipse(-9.5, 3, 3, 1.8, 0, 0, Math.PI * 2);
            ctx.ellipse(9.5, 3, 3, 1.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1F2A4D';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(0, 2.5, 4.2, 0.2, Math.PI - 0.2);
            ctx.stroke();
          } else if (type === 'heart') {
            ctx.fillStyle = (accentColor && accentColor !== '#FFFFFF') ? accentColor : '#FF5C93';
            ctx.strokeStyle = '#1F2A4D';
            ctx.lineWidth = 2.8;
            ctx.beginPath();
            ctx.moveTo(0, 22);
            ctx.bezierCurveTo(-28, 6, -28, -18, -12, -20);
            ctx.bezierCurveTo(-4, -21, 0, -14, 0, -11);
            ctx.bezierCurveTo(0, -14, 4, -21, 12, -20);
            ctx.bezierCurveTo(28, -18, 28, 6, 0, 22);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // 高光與微笑
            ctx.strokeStyle = 'rgba(255,255,255,0.85)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(-11, -9, 5, Math.PI * 1.05, Math.PI * 1.55);
            ctx.stroke();
            ctx.fillStyle = '#1F2A4D';
            ctx.beginPath();
            ctx.arc(-6, -1, 2.2, 0, Math.PI * 2);
            ctx.arc(6, -1, 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1F2A4D';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(0, 2, 4, 0.2, Math.PI - 0.2);
            ctx.stroke();
          } else if (type === 'meteor') {
            // 彩虹星尾（向左上延伸）
            var tailColors = ['#FF5E8A', '#FFB800', '#38BDF8'];
            tailColors.forEach(function (tc, idx) {
              ctx.strokeStyle = tc;
              ctx.lineWidth = 5 - idx * 0.8;
              ctx.beginPath();
              ctx.moveTo(-6 + idx * 3, -6 - idx * 2);
              ctx.lineTo(-34 + idx * 4, -28 + idx * 5);
              ctx.stroke();
            });
            // 星頭
            ctx.fillStyle = '#FFF04D';
            ctx.strokeStyle = '#1F2A4D';
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            for (var j = 0; j < 10; j++) {
              var mr = (j % 2 === 0) ? 18 : 8.5;
              var ma = (j * Math.PI) / 5 - Math.PI / 2;
              var mx = Math.cos(ma) * mr + 4;
              var my = Math.sin(ma) * mr + 4;
              if (j === 0) ctx.moveTo(mx, my);
              else ctx.lineTo(mx, my);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#1F2A4D';
            ctx.beginPath();
            ctx.arc(1, 3, 2, 0, Math.PI * 2);
            ctx.arc(7.5, 3, 2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // 在作畫層印下霓虹線段（深底＝發光粗線；白底＝實色描邊）
        function drawNeonSegment(ctx, p1, p2, color, px, isLightBg) {
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (isLightBg) {
            // 白紙畫板：改成實色描邊，對比清晰
            var edgeCol = (color === '#FFFFFF') ? '#2160C4' : mixHex(color, '#1F2A4D', 0.28);
            var coreCol = (color === '#FFFFFF') ? '#DCE9FB' : mixHex(color, '#FFFFFF', 0.25);
            ctx.strokeStyle = edgeCol;
            ctx.lineWidth = px * 1.25;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();

            ctx.strokeStyle = coreCol;
            ctx.lineWidth = px * 0.58;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          } else {
            // 深色背景：發光霓虹燈管效果
            ctx.shadowColor = color;
            ctx.shadowBlur = px * 1.65;
            ctx.strokeStyle = color;
            ctx.lineWidth = px;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();

            ctx.shadowBlur = px * 0.5;
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = Math.max(2.2, px * 0.34);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
          ctx.restore();
        }

        // 在作畫層印下泡泡破掉的小圓圈
        function stampBubbleRing(x, y, r, color) {
          var c = getVisibleColor(color, level.isLightBg);
          drawCtx.save();
          drawCtx.strokeStyle = c;
          drawCtx.globalAlpha = level.isLightBg ? 0.85 : 0.72;
          drawCtx.lineWidth = 2.2;
          drawCtx.beginPath();
          drawCtx.arc(x, y, r, 0, Math.PI * 2);
          drawCtx.stroke();
          // 小高光弧線
          drawCtx.strokeStyle = level.isLightBg ? '#FFFFFF' : 'rgba(255,255,255,0.85)';
          drawCtx.lineWidth = 1.6;
          drawCtx.beginPath();
          drawCtx.arc(x, y, Math.max(2, r * 0.62), Math.PI * 1.1, Math.PI * 1.55);
          drawCtx.stroke();
          drawCtx.restore();
        }

        // 在作畫層印下煙火落點彩色小點
        function stampFireworkDot(x, y, r, color) {
          var c = getVisibleColor(color, level.isLightBg);
          drawCtx.save();
          drawCtx.fillStyle = c;
          drawCtx.beginPath();
          drawCtx.arc(x, y, r, 0, Math.PI * 2);
          drawCtx.fill();
          drawCtx.restore();
        }

        // 在作畫層印下亮粉淡淡的亮點
        function stampGlitterMark(x, y, r, color) {
          var c = getVisibleColor(color, level.isLightBg);
          drawCtx.save();
          drawCtx.globalAlpha = level.isLightBg ? 0.75 : 0.62;
          drawFourStar(drawCtx, x, y, r, c, level.isLightBg ? 'rgba(31,42,77,0.22)' : null);
          drawCtx.restore();
        }

        /* -----------------------------------------------------------------
         * 4. 粒子系統（上限 400、無粒子時自動停掉 rAF）
         * ----------------------------------------------------------------- */
        function pushParticle(p) {
          if (particles.length >= SCENE_CONFIG.MAX_PARTICLES) {
            var dropped = particles.shift();
            // 若被淘汰的粒子原本要留印記且屬於有效筆畫，直接定格留下印記
            if (dropped && dropped.leaveMark && activeStrokeIds[dropped.strokeId]) {
              commitParticleMark(dropped);
            }
          }
          particles.push(p);
          ensureLoop();
        }

        function commitParticleMark(p) {
          if (!p.leaveMark || !activeStrokeIds[p.strokeId]) return;
          if (p.kind === 'spark') {
            stampFireworkDot(p.x, p.y, Math.max(1.8, p.size * 0.85), p.color);
          } else if (p.kind === 'glitter') {
            stampGlitterMark(p.x, p.y, p.size * 0.72, p.color);
          } else if (p.kind === 'bubble') {
            stampBubbleRing(p.x, p.y, p.size, p.color);
          }
        }

        // 引爆一朵放射狀煙火（30–60 顆火花）
        function spawnFireworkBurst(x, y, baseColor, count, strokeId, leaveMark) {
          var palette = [baseColor, '#FFF04D', '#FFFFFF', mixHex(baseColor, '#FFB800', 0.45)];
          if (level.isLightBg) {
            palette = [getVisibleColor(baseColor, true), '#FF5E8A', '#FFB800', '#1EC8FF'];
          }
          // 減少動態模式：直接印出漂亮放射狀小點，不播粒子動畫
          if (isReducedMotion()) {
            if (leaveMark && activeStrokeIds[strokeId]) {
              for (var rIdx = 0; rIdx < count; rIdx++) {
                var ra = (rIdx / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
                var dist = 14 + Math.random() * 44;
                stampFireworkDot(
                  x + Math.cos(ra) * dist,
                  y + Math.sin(ra) * dist,
                  2 + Math.random() * 2.2,
                  palette[rIdx % palette.length]
                );
              }
            }
            return;
          }

          playBoom();
          for (var i = 0; i < count; i++) {
            var ang = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.25;
            var spd = 48 + Math.random() * 145;
            var life = 0.58 + Math.random() * 0.42;
            pushParticle({
              kind: 'spark',
              x: x,
              y: y,
              px: x,
              py: y,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd - 22,
              gravity: 155,
              drag: 0.965,
              size: 2.2 + Math.random() * 2.4,
              color: palette[i % palette.length],
              age: 0,
              life: life,
              strokeId: strokeId,
              leaveMark: !!leaveMark
            });
          }
        }

        // 泡泡破掉瞬間的小水花
        function spawnPopSplash(x, y, color) {
          if (isReducedMotion()) return;
          for (var i = 0; i < 4; i++) {
            var ang = (i / 4) * Math.PI * 2 + 0.4;
            pushParticle({
              kind: 'splash',
              x: x,
              y: y,
              vx: Math.cos(ang) * 44,
              vy: Math.sin(ang) * 44,
              size: 3.5,
              color: getVisibleColor(color, level.isLightBg),
              age: 0,
              life: 0.16,
              strokeId: 0,
              leaveMark: false
            });
          }
        }

        // 把還沒落定的煙火／貼紙／粒子立即印到作畫層（按完成時呼叫，避免漏圖）
        function flushPendingMarks() {
          var now = performance.now();
          while (pendingBursts.length > 0) {
            var b = pendingBursts.shift();
            if (b.leaveMark && activeStrokeIds[b.strokeId]) {
              for (var k = 0; k < b.count; k++) {
                var a = (k / b.count) * Math.PI * 2;
                var d = 14 + (k % 5) * 9;
                stampFireworkDot(b.x + Math.cos(a) * d, b.y + Math.sin(a) * d, 2.5, b.color);
              }
            }
          }
          while (animatingStickers.length > 0) {
            var st = animatingStickers.shift();
            if (activeStrokeIds[st.strokeId]) {
              drawStickerShape(drawCtx, st.type, st.tx, st.ty, st.scale, 0, st.color);
            }
          }
          for (var i = 0; i < particles.length; i++) {
            if (particles[i].leaveMark && activeStrokeIds[particles[i].strokeId]) {
              commitParticleMark(particles[i]);
              particles[i].leaveMark = false;
            }
          }
          if (now) { /* 保留語意乾淨 */ }
        }

        /* -----------------------------------------------------------------
         * 5. 動畫主迴圈（只在有動態時執行，閒置立即停止）
         * ----------------------------------------------------------------- */
        function hasActiveAnimation() {
          return (
            particles.length > 0 ||
            pendingBursts.length > 0 ||
            animatingStickers.length > 0 ||
            (isDrawing && currentBrush === 'firework' && currentPoints.length > 0) ||
            showState !== null
          );
        }

        function ensureLoop() {
          if (rafId !== null) return;
          lastFrameTime = performance.now();
          rafId = window.requestAnimationFrame(tick);
        }

        function tick(now) {
          var dt = Math.min(0.05, Math.max(0.001, (now - lastFrameTime) / 1000));
          lastFrameTime = now;
          fxCtx.clearRect(0, 0, W, H);

          // A. 正在畫煙火引線時，在特效層畫出發亮引線
          if (isDrawing && currentBrush === 'firework' && currentPoints.length > 0) {
            drawFuseLine(currentPoints, currentColor);
          }

          // B. 依序觸發排隊中的煙火炸點（放開引線後）
          for (var bi = pendingBursts.length - 1; bi >= 0; bi--) {
            var burst = pendingBursts[bi];
            if (burst.remainingLine && burst.remainingLine.length > 1) {
              drawFuseLine(burst.remainingLine, burst.color);
            }
            if (now >= burst.triggerAt) {
              pendingBursts.splice(bi, 1);
              if (!burst.leaveMark || activeStrokeIds[burst.strokeId]) {
                spawnFireworkBurst(burst.x, burst.y, burst.color, burst.count, burst.strokeId, burst.leaveMark);
              }
            }
          }

          // C. 放煙火秀（3 秒內沿著畫過的線依序冒出火花，不動作品本身）
          if (showState) {
            var elapsed = now - showState.startTime;
            while (showState.nextIdx < showState.events.length && elapsed >= showState.events[showState.nextIdx].at) {
              var ev = showState.events[showState.nextIdx++];
              spawnShowSparkCluster(ev.x, ev.y, ev.color);
            }
            if (elapsed >= SCENE_CONFIG.SHOW_DURATION_MS) {
              finishFireworkShowUI();
              showState = null;
            }
          }

          // D. 更新與繪製正在播入場動畫的會動貼紙
          for (var si = animatingStickers.length - 1; si >= 0; si--) {
            var st = animatingStickers[si];
            st.age += dt;
            var t = Math.min(1, st.age / st.dur);
            var ease = 1 - Math.pow(1 - t, 3);
            var sx = st.tx, sy = st.ty, sc = st.scale, rot = 0;

            if (st.type === 'rocket') {
              // 火箭從下方往上飛一段再停住
              sy = st.ty + (1 - ease) * 48;
              sc = st.scale * (0.85 + 0.15 * ease);
            } else if (st.type === 'star') {
              // 星星原地轉一圈並輕微放大彈回
              rot = ease * Math.PI * 2;
              sc = st.scale * (1 + Math.sin(t * Math.PI) * 0.25);
            } else if (st.type === 'heart') {
              // 愛心開心跳兩下
              var bounce = Math.abs(Math.sin(t * Math.PI * 2)) * (1 - t * 0.4);
              sy = st.ty - bounce * 18;
              sc = st.scale * (1 + bounce * 0.22);
            } else if (st.type === 'meteor') {
              // 流星從左上斜劃到定位
              sx = st.tx - (1 - ease) * 68;
              sy = st.ty - (1 - ease) * 52;
            }

            drawStickerShape(fxCtx, st.type, sx, sy, sc, rot, st.color);

            if (t >= 1) {
              animatingStickers.splice(si, 1);
              // 動畫結束，正式留在作畫層！
              if (activeStrokeIds[st.strokeId]) {
                drawStickerShape(drawCtx, st.type, st.tx, st.ty, st.scale, 0, st.color);
              }
            }
          }

          // E. 更新與繪製所有粒子
          for (var i = particles.length - 1; i >= 0; i--) {
            var p = particles[i];
            p.age += dt;
            if (p.age >= p.life) {
              particles.splice(i, 1);
              if (p.kind === 'bubble') {
                if (p.leaveMark && activeStrokeIds[p.strokeId]) {
                  stampBubbleRing(p.x, p.y, p.size, p.color);
                }
                spawnPopSplash(p.x, p.y, p.color);
                playPop();
              } else if (p.leaveMark && activeStrokeIds[p.strokeId]) {
                commitParticleMark(p);
              }
              continue;
            }

            var progress = p.age / p.life;
            var alpha = 1 - progress;

            if (p.kind === 'spark') {
              p.px = p.x;
              p.py = p.y;
              p.vx *= Math.pow(p.drag, dt * 60);
              p.vy = p.vy * Math.pow(p.drag, dt * 60) + p.gravity * dt;
              p.x += p.vx * dt;
              p.y += p.vy * dt;

              fxCtx.save();
              fxCtx.globalAlpha = Math.max(0.15, alpha);
              fxCtx.strokeStyle = p.color;
              fxCtx.lineWidth = p.size;
              fxCtx.lineCap = 'round';
              fxCtx.beginPath();
              fxCtx.moveTo(p.px, p.py);
              fxCtx.lineTo(p.x, p.y);
              fxCtx.stroke();
              fxCtx.fillStyle = level.isLightBg ? p.color : '#FFFFFF';
              fxCtx.beginPath();
              fxCtx.arc(p.x, p.y, p.size * 0.55, 0, Math.PI * 2);
              fxCtx.fill();
              fxCtx.restore();
            } else if (p.kind === 'glitter') {
              // 閃爍頻率 <= 2.2Hz（護眼），閃 2–3 下
              var wave = 0.35 + 0.65 * Math.abs(Math.sin(p.age * Math.PI * SCENE_CONFIG.GLITTER_BLINK_HZ + p.phase));
              fxCtx.save();
              fxCtx.globalAlpha = Math.max(0.1, alpha * wave);
              drawFourStar(
                fxCtx,
                p.x,
                p.y,
                p.size * (0.75 + 0.35 * wave),
                getVisibleColor(p.color, level.isLightBg),
                level.isLightBg ? 'rgba(31,42,77,0.28)' : null
              );
              fxCtx.restore();
            } else if (p.kind === 'bubble') {
              p.y += p.vy * dt;
              p.x += Math.sin(p.age * 4.5 + p.phase) * 16 * dt;
              var bc = getVisibleColor(p.color, level.isLightBg);
              fxCtx.save();
              fxCtx.globalAlpha = 0.85;
              fxCtx.fillStyle = level.isLightBg ? 'rgba(220,233,251,0.35)' : 'rgba(255,255,255,0.16)';
              fxCtx.strokeStyle = bc;
              fxCtx.lineWidth = 2.2;
              fxCtx.beginPath();
              fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              fxCtx.fill();
              fxCtx.stroke();
              // 泡泡高光點
              fxCtx.fillStyle = '#FFFFFF';
              fxCtx.beginPath();
              fxCtx.arc(p.x - p.size * 0.32, p.y - p.size * 0.32, Math.max(1.5, p.size * 0.22), 0, Math.PI * 2);
              fxCtx.fill();
              fxCtx.restore();
            } else if (p.kind === 'trail') {
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              fxCtx.save();
              fxCtx.globalAlpha = alpha * 0.85;
              fxCtx.fillStyle = p.color;
              fxCtx.beginPath();
              fxCtx.arc(p.x, p.y, p.size * (0.5 + 0.5 * alpha), 0, Math.PI * 2);
              fxCtx.fill();
              fxCtx.restore();
            } else if (p.kind === 'splash') {
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              fxCtx.save();
              fxCtx.globalAlpha = alpha;
              fxCtx.strokeStyle = p.color;
              fxCtx.lineWidth = 2;
              fxCtx.beginPath();
              fxCtx.moveTo(p.x, p.y);
              fxCtx.lineTo(p.x - p.vx * 0.05, p.y - p.vy * 0.05);
              fxCtx.stroke();
              fxCtx.restore();
            }
          }

          if (hasActiveAnimation()) {
            rafId = window.requestAnimationFrame(tick);
          } else {
            fxCtx.clearRect(0, 0, W, H);
            rafId = null;
          }
        }

        // 畫煙火發亮引線
        function drawFuseLine(pts, color) {
          if (pts.length < 1) return;
          var lineCol = level.isLightBg ? getVisibleColor(color, true) : '#FFE680';
          fxCtx.save();
          fxCtx.lineCap = 'round';
          fxCtx.lineJoin = 'round';
          fxCtx.strokeStyle = lineCol;
          fxCtx.lineWidth = 4;
          if (!level.isLightBg) {
            fxCtx.shadowColor = color;
            fxCtx.shadowBlur = 12;
          }
          fxCtx.beginPath();
          fxCtx.moveTo(pts[0].x, pts[0].y);
          for (var i = 1; i < pts.length; i++) {
            fxCtx.lineTo(pts[i].x, pts[i].y);
          }
          fxCtx.stroke();
          // 引線尾端發光星點
          var tip = pts[pts.length - 1];
          drawFourStar(fxCtx, tip.x, tip.y, 9, '#FFF04D', level.isLightBg ? '#1F2A4D' : null);
          fxCtx.restore();
        }

        // 煙火秀專用小簇閃亮火花（不留在作品裡）
        function spawnShowSparkCluster(x, y, baseColor) {
          var cols = [baseColor, '#FFF04D', '#FF5E8A', '#38BDF8', '#6CE83B'];
          playDing();
          var n = 14;
          for (var i = 0; i < n; i++) {
            var a = (i / n) * Math.PI * 2 + Math.random() * 0.3;
            var sp = 35 + Math.random() * 90;
            pushParticle({
              kind: 'spark',
              x: x,
              y: y,
              px: x,
              py: y,
              vx: Math.cos(a) * sp,
              vy: Math.sin(a) * sp - 15,
              gravity: 110,
              drag: 0.96,
              size: 2.2 + Math.random() * 1.6,
              color: getVisibleColor(cols[i % cols.length], level.isLightBg),
              age: 0,
              life: 0.55 + Math.random() * 0.3,
              strokeId: 0,
              leaveMark: false
            });
          }
          // 補一顆閃爍亮星（頻率 <= 2.2Hz）
          pushParticle({
            kind: 'glitter',
            x: x,
            y: y,
            size: 11,
            color: getVisibleColor(baseColor, level.isLightBg),
            phase: Math.random() * Math.PI,
            age: 0,
            life: 0.85,
            strokeId: 0,
            leaveMark: false
          });
        }

        /* -----------------------------------------------------------------
         * 6. 吉祥物互動與回饋
         * ----------------------------------------------------------------- */
        function say(text, animClass) {
          if (elBubble) elBubble.textContent = text;
          if (elMascot && animClass && !isReducedMotion()) {
            elMascot.classList.remove('sc-hop', 'sc-shake');
            void elMascot.offsetWidth;
            elMascot.classList.add(animClass);
          }
        }

        function maybeCheer() {
          if (history.length > 0 && (history.length === 1 || history.length % 3 === 0)) {
            var idx = Math.floor(Math.random() * SCENE_CONFIG.CHEERS.length);
            say(SCENE_CONFIG.CHEERS[idx], 'sc-hop');
          }
        }

        /* -----------------------------------------------------------------
         * 7. 歷史紀錄（復原／清除）
         * ----------------------------------------------------------------- */
        function pushHistorySnapshot(strokeId) {
          try {
            var snap = drawCtx.getImageData(0, 0, W, H);
            history.push({ id: strokeId, img: snap });
            if (history.length > SCENE_CONFIG.MAX_HISTORY) {
              history.shift();
            }
          } catch (e) { /* 防禦處理 */ }
          activeStrokeIds[strokeId] = true;
        }

        function undoStroke() {
          if (history.length === 0) {
            say('畫布已經乾乾淨淨啦！', 'sc-hop');
            return;
          }
          var last = history.pop();
          delete activeStrokeIds[last.id];

          // 同步取消該筆尚未落地的排程與貼紙
          pendingBursts = pendingBursts.filter(function (b) { return b.strokeId !== last.id; });
          animatingStickers = animatingStickers.filter(function (s) { return s.strokeId !== last.id; });
          particles.forEach(function (p) {
            if (p.strokeId === last.id) p.leaveMark = false;
          });
          strokePaths = strokePaths.filter(function (sp) { return sp.id !== last.id; });

          drawCtx.putImageData(last.img, 0, 0);
          playDing();
        }

        function clearAll() {
          history = [];
          strokePaths = [];
          activeStrokeIds = {};
          particles = [];
          pendingBursts = [];
          animatingStickers = [];
          showState = null;
          finishFireworkShowUI();
          drawCtx.clearRect(0, 0, W, H);
          fxCtx.clearRect(0, 0, W, H);
          say(SCENE_CONFIG.MSG_WELCOME, 'sc-hop');
        }

        /* -----------------------------------------------------------------
         * 8. 畫布 Pointer Events（滑鼠＋觸控同一套，換算舞台縮放）
         * ----------------------------------------------------------------- */
        function getCanvasPoint(e) {
          var rect = fxCanvas.getBoundingClientRect();
          if (!rect.width || !rect.height) return { x: 0, y: 0 };
          return {
            x: (e.clientX - rect.left) * (W / rect.width),
            y: (e.clientY - rect.top) * (H / rect.height)
          };
        }

        function distBetween(a, b) {
          var dx = a.x - b.x;
          var dy = a.y - b.y;
          return Math.sqrt(dx * dx + dy * dy);
        }

        function onPointerDown(e) {
          if (activePointerId !== null) return; // 防止多指同時誤觸
          e.preventDefault();
          activePointerId = e.pointerId;
          try { fxCanvas.setPointerCapture(e.pointerId); } catch (err) {}

          var pt = getCanvasPoint(e);
          currentStrokeId = ++strokeSeq;
          pushHistorySnapshot(currentStrokeId);

          // 貼紙模式：點一下立刻蓋上會動貼紙
          if (currentBrush === 'sticker') {
            var szObj = getSizeObj();
            strokePaths.push({
              id: currentStrokeId,
              points: [pt],
              color: currentColor
            });
            playStickerSound();
            if (isReducedMotion()) {
              drawStickerShape(drawCtx, currentSticker, pt.x, pt.y, szObj.stickerScale, 0, currentColor);
            } else {
              animatingStickers.push({
                type: currentSticker,
                tx: pt.x,
                ty: pt.y,
                scale: szObj.stickerScale,
                color: currentColor,
                age: 0,
                dur: 0.56,
                strokeId: currentStrokeId
              });
              // 蓋貼紙時冒幾顆可愛小星點
              for (var k = 0; k < 6; k++) {
                var ka = (k / 6) * Math.PI * 2;
                pushParticle({
                  kind: 'trail',
                  x: pt.x,
                  y: pt.y,
                  vx: Math.cos(ka) * 52,
                  vy: Math.sin(ka) * 52,
                  size: 4,
                  color: (k % 2 === 0) ? '#FFB627' : '#FF5E8A',
                  age: 0,
                  life: 0.38,
                  strokeId: 0,
                  leaveMark: false
                });
              }
              ensureLoop();
            }
            maybeCheer();
            activePointerId = null;
            return;
          }

          isDrawing = true;
          currentPoints = [pt];
          lastPt = pt;
          lastEmitPt = pt;

          // 按下瞬間就產生第一筆回饋
          handleBrushStep(pt, pt, true);
        }

        function onPointerMove(e) {
          if (!isDrawing || e.pointerId !== activePointerId) return;
          e.preventDefault();
          var pt = getCanvasPoint(e);
          if (lastPt && distBetween(lastPt, pt) < 2.5) return;

          currentPoints.push(pt);
          handleBrushStep(lastPt, pt, false);
          lastPt = pt;
        }

        function onPointerUp(e) {
          if (e.pointerId !== activePointerId) return;
          activePointerId = null;
          if (!isDrawing) return;
          isDrawing = false;

          // 儲存這條線段（供「放煙火秀」重播火花用）
          if (currentPoints.length > 0) {
            strokePaths.push({
              id: currentStrokeId,
              points: samplePath(currentPoints, 52),
              color: currentBrush === 'rainbow' ? ('hsl(' + Math.round(rainbowHue) + ',92%,56%)') : currentColor
            });
          }

          // 煙火筆放開後：沿整條引線依序「砰」炸開成放射火花！
          if (currentBrush === 'firework' && currentPoints.length > 0) {
            scheduleFireworkAlongLine(currentPoints, currentColor, currentStrokeId);
          }

          currentPoints = [];
          lastPt = null;
          lastEmitPt = null;
          maybeCheer();
        }

        // 各魔法筆移動一步的效果處理
        function handleBrushStep(p1, p2, isFirst) {
          var sz = getSizeObj();
          var px = sz.px;

          if (currentBrush === 'firework') {
            // 煙火筆畫的時候是發亮引線，尾端冒小小嘶嘶火花
            if (!isReducedMotion() && (isFirst || distBetween(lastEmitPt, p2) > 10)) {
              lastEmitPt = p2;
              pushParticle({
                kind: 'trail',
                x: p2.x,
                y: p2.y,
                vx: (Math.random() - 0.5) * 48,
                vy: (Math.random() - 0.5) * 48 - 10,
                size: 3,
                color: level.isLightBg ? '#FF702A' : '#FFF04D',
                age: 0,
                life: 0.26,
                strokeId: 0,
                leaveMark: false
              });
              playDing();
            }
            ensureLoop();
          } else if (currentBrush === 'glitter') {
            // 亮粉筆：畫出柔美彩線，旁邊不停灑會閃爍的小星星
            var gCol = getVisibleColor(currentColor, level.isLightBg);
            drawCtx.save();
            drawCtx.lineCap = 'round';
            drawCtx.strokeStyle = gCol;
            drawCtx.globalAlpha = level.isLightBg ? 0.55 : 0.45;
            drawCtx.lineWidth = px * 0.72;
            drawCtx.beginPath();
            drawCtx.moveTo(p1.x, p1.y);
            drawCtx.lineTo(p2.x, p2.y);
            drawCtx.stroke();
            drawCtx.restore();

            if (isFirst || distBetween(lastEmitPt, p2) >= 12) {
              lastEmitPt = p2;
              var spread = px * 1.45 + 10;
              var gx = p2.x + (Math.random() - 0.5) * spread * 2;
              var gy = p2.y + (Math.random() - 0.5) * spread * 2;
              var gr = 6 + Math.random() * (px * 0.45);
              if (isReducedMotion()) {
                stampGlitterMark(gx, gy, gr * 0.72, currentColor);
              } else {
                pushParticle({
                  kind: 'glitter',
                  x: gx,
                  y: gy,
                  size: gr,
                  color: currentColor,
                  phase: Math.random() * Math.PI * 2,
                  age: 0,
                  life: 0.95 + Math.random() * 0.4, // 閃 2–3 下後留亮點
                  strokeId: currentStrokeId,
                  leaveMark: true
                });
              }
              playDing();
            }
          } else if (currentBrush === 'neon') {
            // 霓虹筆：深底發光粗線、白底實色描邊
            drawNeonSegment(drawCtx, p1, p2, currentColor, px, level.isLightBg);
            if (!isReducedMotion() && (isFirst || distBetween(lastEmitPt, p2) >= 24)) {
              lastEmitPt = p2;
              pushParticle({
                kind: 'trail',
                x: p2.x,
                y: p2.y,
                vx: (Math.random() - 0.5) * 32,
                vy: (Math.random() - 0.5) * 32,
                size: 2.8,
                color: getVisibleColor(currentColor, level.isLightBg),
                age: 0,
                life: 0.25,
                strokeId: 0,
                leaveMark: false
              });
              playDing();
            }
          } else if (currentBrush === 'bubble') {
            // 泡泡筆：沿線冒半透明泡泡往上飄，破掉留小圓圈
            if (isFirst || distBetween(lastEmitPt, p2) >= 18) {
              lastEmitPt = p2;
              var br = (px * 0.55) + 5 + Math.random() * 8;
              var bx = p2.x + (Math.random() - 0.5) * 14;
              var by = p2.y + (Math.random() - 0.5) * 10;
              if (isReducedMotion()) {
                stampBubbleRing(bx, by, br, currentColor);
                playPop();
              } else {
                pushParticle({
                  kind: 'bubble',
                  x: bx,
                  y: by,
                  vy: -(28 + Math.random() * 26),
                  size: br,
                  color: currentColor,
                  phase: Math.random() * Math.PI * 2,
                  age: 0,
                  life: 0.62 + Math.random() * 0.52,
                  strokeId: currentStrokeId,
                  leaveMark: true
                });
                playDing();
              }
            }
          } else if (currentBrush === 'rainbow') {
            // 彩虹筆：顏色沿筆畫一路漸變，後面拖彩色殘影
            var stepDist = distBetween(p1, p2);
            rainbowHue = (rainbowHue + Math.max(2.5, stepDist * 0.85)) % 360;
            var rCol = 'hsl(' + Math.round(rainbowHue) + ', 92%, ' + (level.isLightBg ? '50%' : '58%') + ')';

            drawCtx.save();
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.strokeStyle = rCol;
            drawCtx.lineWidth = px * 1.05;
            if (!level.isLightBg) {
              drawCtx.shadowColor = rCol;
              drawCtx.shadowBlur = 8;
            }
            drawCtx.beginPath();
            drawCtx.moveTo(p1.x, p1.y);
            drawCtx.lineTo(p2.x, p2.y);
            drawCtx.stroke();
            drawCtx.restore();

            if (!isReducedMotion() && (isFirst || distBetween(lastEmitPt, p2) >= 10)) {
              lastEmitPt = p2;
              pushParticle({
                kind: 'trail',
                x: p2.x + (Math.random() - 0.5) * px,
                y: p2.y + (Math.random() - 0.5) * px,
                vx: (Math.random() - 0.5) * 26,
                vy: (Math.random() - 0.5) * 26,
                size: 3.5 + Math.random() * 3.5,
                color: rCol,
                age: 0,
                life: 0.44,
                strokeId: 0,
                leaveMark: false
              });
              playDing();
            }
          }
        }

        // 等距採樣路徑點（供煙火引線爆點與煙火秀使用）
        function samplePath(pts, spacing) {
          if (pts.length <= 1) return pts.slice();
          var out = [pts[0]];
          var acc = 0;
          for (var i = 1; i < pts.length; i++) {
            acc += distBetween(pts[i - 1], pts[i]);
            if (acc >= spacing) {
              out.push(pts[i]);
              acc = 0;
            }
          }
          var endPt = pts[pts.length - 1];
          if (distBetween(out[out.length - 1], endPt) > spacing * 0.45) {
            out.push(endPt);
          }
          return out;
        }

        // 沿煙火筆路徑安排依序炸開
        function scheduleFireworkAlongLine(pts, color, strokeId) {
          var spots = samplePath(pts, 72);
          if (spots.length > 9) {
            // 線畫很長時均勻抽樣至最多 9 朵，兼顧流暢度與震撼感
            var trimmed = [];
            for (var k = 0; k < 9; k++) {
              trimmed.push(spots[Math.floor((k / 8) * (spots.length - 1))]);
            }
            spots = trimmed;
          }
          var baseCount = getSizeObj().sparkCount; // 34 / 46 / 58 顆（符合 30–60 顆）
          var perBurst = spots.length <= 2 ? baseCount : Math.max(30, Math.round(baseCount * 0.78));
          var now = performance.now();

          if (isReducedMotion()) {
            spots.forEach(function (sp) {
              spawnFireworkBurst(sp.x, sp.y, color, perBurst, strokeId, true);
            });
            return;
          }

          spots.forEach(function (sp, idx) {
            pendingBursts.push({
              x: sp.x,
              y: sp.y,
              color: color,
              count: perBurst,
              strokeId: strokeId,
              leaveMark: true,
              triggerAt: now + idx * 125,
              remainingLine: idx === 0 ? pts.slice() : null
            });
          });
          ensureLoop();
        }

        /* -----------------------------------------------------------------
         * 9. 「放煙火秀」按鈕功能（3 秒依序沿線冒火花，作品本身不變）
         * ----------------------------------------------------------------- */
        function startFireworkShow() {
          if (strokePaths.length === 0) {
            say(SCENE_CONFIG.MSG_EMPTY, 'sc-shake');
            if (elShowBtn && !isReducedMotion()) {
              elShowBtn.classList.remove('sc-shake');
              void elShowBtn.offsetWidth;
              elShowBtn.classList.add('sc-shake');
            }
            return;
          }
          if (showState) return; // 播放中不重複啟動

          say(SCENE_CONFIG.MSG_SHOW, 'sc-hop');

          if (isReducedMotion()) {
            // 減少動態模式：溫和提示不放閃動動畫
            playStickerSound();
            return;
          }

          // 收集所有筆畫的採樣點，依孩子作畫順序排在 0~2200ms 內依序綻放
          var rawSpots = [];
          strokePaths.forEach(function (sp) {
            sp.points.forEach(function (pt) {
              rawSpots.push({ x: pt.x, y: pt.y, color: sp.color });
            });
          });
          // 控制總爆發次數最多 22 次，畫面華麗又不超載
          var maxEvents = 22;
          var chosen = [];
          if (rawSpots.length <= maxEvents) {
            chosen = rawSpots;
          } else {
            for (var i = 0; i < maxEvents; i++) {
              chosen.push(rawSpots[Math.floor((i / (maxEvents - 1)) * (rawSpots.length - 1))]);
            }
          }
          var spanMs = 2150;
          var events = chosen.map(function (c, idx) {
            return {
              x: c.x,
              y: c.y,
              color: c.color,
              at: chosen.length === 1 ? 0 : Math.round((idx / (chosen.length - 1)) * spanMs)
            };
          });

          showState = {
            startTime: performance.now(),
            events: events,
            nextIdx: 0
          };
          if (elShowBtn) {
            elShowBtn.classList.add('sc-playing');
            elShowBtn.querySelector('span').textContent = '煙火綻放中';
          }
          playBoom();
          ensureLoop();
        }

        function finishFireworkShowUI() {
          if (elShowBtn) {
            elShowBtn.classList.remove('sc-playing');
            elShowBtn.querySelector('span').textContent = '放煙火秀';
          }
        }

        /* -----------------------------------------------------------------
         * 10. UI 更新與完成輸出（背景＋作畫層合成 canvas）
         * ----------------------------------------------------------------- */
        function updateBrushUI() {
          var isSticker = currentBrush === 'sticker';
          var isRainbow = currentBrush === 'rainbow';

          if (elMidTitle) {
            elMidTitle.textContent = isSticker ? '選貼紙' : '選顏色';
          }
          if (elSizeTitle) {
            elSizeTitle.textContent = isSticker ? '貼紙大小' : '筆刷粗細';
          }
          if (elColors) {
            elColors.style.display = isSticker ? 'none' : 'grid';
            elColors.classList.toggle('sc-muted', isRainbow);
          }
          if (elRainbowPill) {
            elRainbowPill.classList.toggle('sc-show', isRainbow);
          }
          if (elStickers) {
            elStickers.classList.toggle('sc-show', isSticker);
          }
        }

        function updateSoundBtnUI() {
          if (!elSoundBtn) return;
          elSoundBtn.classList.toggle('sc-on', soundEnabled);
          elSoundBtn.setAttribute('aria-pressed', soundEnabled ? 'true' : 'false');
          elSoundBtn.innerHTML =
            (soundEnabled ? ICONS.soundOn : ICONS.soundOff) +
            '<span>' + (soundEnabled ? '音效：開' : '音效：關') + '</span>' +
            CHECK_SVG;
        }

        function handleFinish() {
          if (history.length === 0) {
            // 唯一不呼叫 finish 的情況：畫布完全空白
            say(SCENE_CONFIG.MSG_EMPTY, 'sc-shake');
            return;
          }
          // 確保還在空中或排隊的煙火／貼紙印記全部定格進作品裡
          flushPendingMarks();

          // 合成「背景層＋作畫層」成一張最終作品 canvas
          var out = document.createElement('canvas');
          out.width = W;
          out.height = H;
          var octx = out.getContext('2d');
          octx.drawImage(bgCanvas, 0, 0);
          octx.drawImage(drawCanvas, 0, 0);

          api.finish({
            stars: 1,
            image: out,
            praise: level.praise,
            caption: level.name + '煙火畫'
          });
        }

        /* -----------------------------------------------------------------
         * 11. 徹底清理函式（stop() 與每次 start() 開頭都呼叫）
         * ----------------------------------------------------------------- */
        function cleanup() {
          if (rafId !== null) {
            window.cancelAnimationFrame(rafId);
            rafId = null;
          }
          while (timers.length > 0) {
            window.clearTimeout(timers.pop());
          }
          if (fxCanvas) {
            fxCanvas.removeEventListener('pointerdown', onPointerDown);
            fxCanvas.removeEventListener('pointermove', onPointerMove);
            fxCanvas.removeEventListener('pointerup', onPointerUp);
            fxCanvas.removeEventListener('pointercancel', onPointerUp);
          }
          if (audioCtx) {
            audioCtx.close().catch(function () {});
            audioCtx = null;
          }
          api.field.onclick = null;

          isDrawing = false;
          activePointerId = null;
          particles = [];
          pendingBursts = [];
          animatingStickers = [];
          showState = null;
          history = [];
          strokePaths = [];
          activeStrokeIds = {};
          soundEnabled = false;

          bgCanvas = bgCtx = drawCanvas = drawCtx = fxCanvas = fxCtx = null;
          elBubble = elMascot = elShowBtn = elSoundBtn = null;
          elColors = elStickers = elRainbowPill = elMidTitle = elSizeTitle = null;
        }

        /* -----------------------------------------------------------------
         * 12. 場景介面：start(levelIndex) 與 stop()
         * ----------------------------------------------------------------- */
        return {
          start: function (levelIndex) {
            cleanup();

            level = SCENE_CONFIG.LEVELS[levelIndex] || SCENE_CONFIG.LEVELS[0];
            currentBrush = 'firework';
            currentColor = SCENE_CONFIG.COLORS[0].hex;
            currentSizeIdx = 1;
            currentSticker = 'rocket';
            rainbowHue = 0;
            strokeSeq = 0;
            soundEnabled = false; // 音效預設關閉

            api.quest(level.quest);

            // 組裝場景 HTML（全部放進 api.field）
            var brushesHtml = SCENE_CONFIG.BRUSHES.map(function (b) {
              return (
                '<button type="button" class="sc-brush' + (b.id === currentBrush ? ' sc-on' : '') + '" data-brush="' + b.id + '">' +
                  ICONS[b.id] + '<span>' + b.name + '</span>' + CHECK_SVG +
                '</button>'
              );
            }).join('');

            var colorsHtml = SCENE_CONFIG.COLORS.map(function (c, idx) {
              return (
                '<button type="button" class="sc-sw' + (idx === 0 ? ' sc-on' : '') + '" data-color="' + c.hex + '" style="background:' + c.hex + '" aria-label="' + c.name + '" title="' + c.name + '">' +
                  CHECK_SVG +
                '</button>'
              );
            }).join('');

            var stickersHtml = SCENE_CONFIG.STICKERS.map(function (st, idx) {
              return (
                '<button type="button" class="sc-sticker-btn' + (idx === 0 ? ' sc-on' : '') + '" data-sticker="' + st.id + '">' +
                  ICONS[st.id] + '<span>' + st.name + '</span>' + CHECK_SVG +
                '</button>'
              );
            }).join('');

            var sizesHtml = SCENE_CONFIG.SIZES.map(function (sz, idx) {
              return (
                '<button type="button" class="sc-size' + (idx === currentSizeIdx ? ' sc-on' : '') + '" data-size-idx="' + idx + '" aria-label="粗細 ' + sz.label + '">' +
                  '<i style="width:' + sz.dot + 'px;height:' + sz.dot + 'px"></i><span>' + sz.label + '</span>' + CHECK_SVG +
                '</button>'
              );
            }).join('');

            api.field.innerHTML =
              // 左側魔法筆工具面板
              '<div class="ai-panel sc-tools">' +
                '<div class="sc-sec-head"><span>魔法筆</span></div>' +
                '<div class="sc-brushes">' + brushesHtml + '</div>' +
                '<div class="sc-sec-head"><span class="sc-mid-title">選顏色</span></div>' +
                '<div class="sc-mid-area">' +
                  '<div class="sc-colors">' + colorsHtml + '</div>' +
                  '<div class="sc-rainbow-pill">彩虹筆會自動變色喔！</div>' +
                  '<div class="sc-stickers">' + stickersHtml + '</div>' +
                '</div>' +
                '<div class="sc-sec-head"><span class="sc-size-title">筆刷粗細</span></div>' +
                '<div class="sc-sizes">' + sizesHtml + '</div>' +
                '<div class="sc-actions">' +
                  '<button type="button" class="ai-btn sc-undo">' + ICONS.undo + '<span>復原</span></button>' +
                  '<button type="button" class="ai-btn sc-clear">' + ICONS.clear + '<span>清除</span></button>' +
                '</div>' +
              '</div>' +

              // 中央三層畫布（外貼兩條黃色膠帶）
              '<div class="sc-board-wrap">' +
                '<span class="ai-tape" style="left:64px;top:-11px;transform:rotate(-4deg)"></span>' +
                '<span class="ai-tape" style="right:64px;top:-11px;transform:rotate(4deg)"></span>' +
                '<div class="ai-board sc-board">' +
                  '<canvas class="sc-layer sc-layer-bg" width="' + W + '" height="' + H + '"></canvas>' +
                  '<canvas class="sc-layer sc-layer-draw" width="' + W + '" height="' + H + '"></canvas>' +
                  '<canvas class="sc-layer sc-layer-fx" width="' + W + '" height="' + H + '"></canvas>' +
                '</div>' +
              '</div>' +

              // 右側吉祥物與操作區
              '<div class="sc-side">' +
                '<div class="ai-panel sc-mascot-card">' +
                  MASCOT_SVG +
                  '<div class="sc-bubble ai-zy">' + SCENE_CONFIG.MSG_WELCOME + '</div>' +
                '</div>' +
                '<button type="button" class="ai-btn sc-show-btn">' + ICONS.sparkle + '<span>放煙火秀</span></button>' +
                '<button type="button" class="ai-btn sc-sound-btn" aria-pressed="false"></button>' +
                '<button type="button" class="ai-btn go sc-done">' + ICONS.done + '<span>完成</span></button>' +
              '</div>';

            // 取得三層畫布與介面元素
            bgCanvas = api.field.querySelector('.sc-layer-bg');
            drawCanvas = api.field.querySelector('.sc-layer-draw');
            fxCanvas = api.field.querySelector('.sc-layer-fx');
            bgCtx = bgCanvas.getContext('2d');
            drawCtx = drawCanvas.getContext('2d');
            fxCtx = fxCanvas.getContext('2d');

            elBubble = api.field.querySelector('.sc-bubble');
            elMascot = api.field.querySelector('.sc-mascot-svg');
            elShowBtn = api.field.querySelector('.sc-show-btn');
            elSoundBtn = api.field.querySelector('.sc-sound-btn');
            elColors = api.field.querySelector('.sc-colors');
            elStickers = api.field.querySelector('.sc-stickers');
            elRainbowPill = api.field.querySelector('.sc-rainbow-pill');
            elMidTitle = api.field.querySelector('.sc-mid-title');
            elSizeTitle = api.field.querySelector('.sc-size-title');

            // 繪製本關背景並同步初始 UI
            drawBackground(level.id);
            updateBrushUI();
            updateSoundBtnUI();

            // 綁定畫布 Pointer Events
            fxCanvas.addEventListener('pointerdown', onPointerDown);
            fxCanvas.addEventListener('pointermove', onPointerMove);
            fxCanvas.addEventListener('pointerup', onPointerUp);
            fxCanvas.addEventListener('pointercancel', onPointerUp);

            // 統一代理場景內按鈕點擊
            api.field.onclick = function (e) {
              var btn;
              if ((btn = e.target.closest('.sc-brush'))) {
                currentBrush = btn.dataset.brush;
                markSelected('.sc-brush', btn);
                updateBrushUI();
                var found = SCENE_CONFIG.BRUSHES.filter(function (x) { return x.id === currentBrush; })[0];
                if (found) say(found.tip, 'sc-hop');
                playDing();
              } else if ((btn = e.target.closest('.sc-sw'))) {
                currentColor = btn.dataset.color;
                markSelected('.sc-sw', btn);
                playDing();
              } else if ((btn = e.target.closest('.sc-sticker-btn'))) {
                currentSticker = btn.dataset.sticker;
                markSelected('.sc-sticker-btn', btn);
                playDing();
              } else if ((btn = e.target.closest('.sc-size'))) {
                currentSizeIdx = Number(btn.dataset.sizeIdx);
                markSelected('.sc-size', btn);
                playDing();
              } else if (e.target.closest('.sc-undo')) {
                undoStroke();
              } else if (e.target.closest('.sc-clear')) {
                clearAll();
              } else if (e.target.closest('.sc-show-btn')) {
                startFireworkShow();
              } else if (e.target.closest('.sc-sound-btn')) {
                soundEnabled = !soundEnabled;
                if (soundEnabled) {
                  ensureAudio(); // 只在使用者按下開關後才建立 AudioContext
                  playDing();
                  say(SCENE_CONFIG.MSG_SOUND_ON, 'sc-hop');
                } else {
                  say(SCENE_CONFIG.MSG_SOUND_OFF);
                }
                updateSoundBtnUI();
              } else if (e.target.closest('.sc-done')) {
                handleFinish();
              }
            };

            function markSelected(sel, target) {
              api.field.querySelectorAll(sel).forEach(function (el) {
                el.classList.toggle('sc-on', el === target);
              });
            }
          },

          stop: function () {
            cleanup();
          }
        };
      }
    });
  })();
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
</body></html>
