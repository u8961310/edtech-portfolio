<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>敲敲蛋寶寶 - 滑鼠島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="../../assets/css/mouse-island.css">
  <style>
    /* 場景樣式：class 一律以 sc- 開頭（共用語音字型 mi-zy 由外殼提供） */
    .sc-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(#BFE1EA 0 112px, #F6E7BE 112px 100%);
      overflow: hidden;
      user-select: none;
    }
    .sc-wave {
      position: absolute;
      left: 0;
      right: 0;
      top: 96px;
      height: 30px;
      background: radial-gradient(circle at 22px -6px, transparent 22px, #FFF8E4 23px, #FFF8E4 28px, transparent 29px) 0 0 / 44px 30px repeat-x;
      opacity: .92;
      pointer-events: none;
    }
    .sc-deco {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .sc-nest {
      position: absolute;
      width: 290px;
      height: 104px;
      margin: -52px 0 0 -145px;
      pointer-events: none;
      z-index: 2;
    }
    .sc-nest svg { width: 100%; height: 100%; display: block; }

    /* 右上角進度計數牌（羊皮紙底＋木頭色框，文字深色高對比） */
    .sc-count {
      position: absolute;
      right: 24px;
      top: 14px;
      z-index: 20;
      padding: 6px 18px;
      background: #FFF8E4;
      color: #33261B;
      border: 3px solid #B9794A;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 3px 0 rgba(110, 65, 37, .22);
      pointer-events: none;
    }

    /* 蛋外層只管位置與大小，不佔用 transform，讓 api.wob／api.glow 穩定作用 */
    .sc-egg {
      position: absolute;
      z-index: 8;
      cursor: pointer;
      touch-action: manipulation;
      border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
      transition: width .28s ease, height .28s ease, margin .28s ease;
    }
    .sc-egg-dim {
      opacity: .92;
    }
    .sc-egg-active {
      z-index: 10;
    }
    .sc-egg-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-origin: 50% 88%;
    }
    .sc-egg-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* 蛋內表情與裂縫層切換 */
    .sc-egg-crack,
    .sc-egg-laugh,
    .sc-egg-blink,
    .sc-egg-stars {
      opacity: 0;
      transition: opacity .15s ease;
      pointer-events: none;
    }
    .sc-egg-cracked .sc-egg-crack { opacity: 1; }
    .sc-egg-laughing .sc-egg-laugh { opacity: 1; }
    .sc-egg-blinking .sc-egg-blink { opacity: 1; }
    .sc-egg-rainbow .sc-egg-stars { opacity: 1; }

    /* 敲第一下的輕彈回饋 */
    .sc-egg-knock .sc-egg-inner {
      animation: sc-knock .22s ease;
    }
    @keyframes sc-knock {
      0%   { transform: scale(1, 1); }
      40%  { transform: scale(1.07, .93) rotate(-5deg); }
      75%  { transform: scale(.96, 1.04) rotate(4deg); }
      100% { transform: scale(1, 1); }
    }

    /* 只按一下失手時的咯咯笑氣泡（對比 13.8:1） */
    .sc-egg-msg {
      position: absolute;
      left: 50%;
      top: -46px;
      transform: translateX(-50%) scale(.85);
      padding: 4px 12px;
      background: #FFF8E4;
      color: #33261B;
      border: 2.5px solid #6E4125;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 3px 0 rgba(110, 65, 37, .2);
      transition: opacity .18s ease, transform .18s ease;
      z-index: 15;
    }
    .sc-egg-laughing .sc-egg-msg {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* 彩虹蛋小星星柔和閃耀（每秒 0.8 次，低於 3 次上限） */
    .sc-egg-rainbow .sc-egg-stars {
      animation: sc-twinkle 1.25s ease-in-out infinite;
    }
    @keyframes sc-twinkle {
      0%, 100% { opacity: 1; }
      50%      { opacity: .45; }
    }

    /* 蛋殼破開上下飛散 */
    .sc-egg-hatched {
      pointer-events: none;
    }
    .sc-egg-hatched .sc-shell-top {
      transform-box: fill-box;
      transform-origin: center;
      animation: sc-top-fly .55s ease-out forwards;
    }
    .sc-egg-hatched .sc-shell-bot {
      transform-box: fill-box;
      transform-origin: center;
      animation: sc-bot-drop .55s ease-out forwards;
    }
    .sc-egg-hatched .sc-egg-shadow {
      opacity: 0;
      transition: opacity .3s;
    }
    @keyframes sc-top-fly {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      100% { transform: translate(-22px, -54px) rotate(-32deg); opacity: 0; }
    }
    @keyframes sc-bot-drop {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      100% { transform: translate(14px, 24px) rotate(18deg); opacity: 0; }
    }

    /* 破殼金色星星爆開 */
    .sc-sparks {
      position: absolute;
      width: 140px;
      height: 140px;
      margin: -70px 0 0 -70px;
      pointer-events: none;
      z-index: 14;
    }
    .sc-spark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      margin: -11px 0 0 -11px;
      animation: sc-spark-out .65s ease-out forwards;
    }
    @keyframes sc-spark-out {
      0%   { transform: translate(0, 0) scale(.4); opacity: 1; }
      70%  { opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.05); opacity: 0; }
    }

    /* 孵出來的小動物：先蹦出來揮手跳，再走到右側排隊 */
    .sc-baby {
      position: absolute;
      width: 140px;          /* 使用者 11-22：動物偏小 → 78 改 140（排隊時 100） */
      height: 140px;
      margin: -70px 0 0 -70px;
      z-index: 12;
      pointer-events: none;
      transition: left .75s cubic-bezier(.32, .82, .38, 1), top .75s cubic-bezier(.32, .82, .38, 1), width .55s ease, height .55s ease, margin .55s ease;
    }
    .sc-baby-body {
      width: 100%;
      height: 100%;
      transform-origin: 50% 85%;
    }
    .sc-baby-body svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sc-baby-pop .sc-baby-body {
      animation: sc-baby-jump .62s cubic-bezier(.22, 1.3, .45, 1) forwards;
    }
    @keyframes sc-baby-jump {
      0%   { transform: scale(.25) translateY(24px); opacity: 0; }
      45%  { transform: scale(1.14) translateY(-22px) rotate(-7deg); opacity: 1; }
      72%  { transform: scale(.96) translateY(0) rotate(6deg); opacity: 1; }
      100% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; }
    }
    .sc-baby-walk .sc-baby-body {
      animation: sc-baby-waddle .36s ease-in-out 2;
    }
    @keyframes sc-baby-waddle {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25%      { transform: translateY(-7px) rotate(-7deg); }
      75%      { transform: translateY(-7px) rotate(7deg); }
    }
    .sc-baby-cheer .sc-baby-body {
      animation: sc-baby-hurray .48s ease-in-out 2;
    }
    @keyframes sc-baby-hurray {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-18px) scale(1.08); }
    }
    .sc-baby-name {
      position: absolute;
      left: 50%;
      bottom: -30px;
      transform: translateX(-50%);
      padding: 2px 10px;
      background: #FFF8E4;
      color: #33261B;
      border: 2px solid #B9794A;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 2px 0 rgba(110, 65, 37, .18);
    }

    /* 尊重系統減少動態偏好設定：關閉位移與閃爍，直接呈現結果 */
    @media (prefers-reduced-motion: reduce) {
      .sc-egg,
      .sc-baby { transition: none !important; }
      .sc-egg-knock .sc-egg-inner,
      .sc-egg-rainbow .sc-egg-stars,
      .sc-egg-hatched .sc-shell-top,
      .sc-egg-hatched .sc-shell-bot,
      .sc-spark,
      .sc-baby-pop .sc-baby-body,
      .sc-baby-walk .sc-baby-body,
      .sc-baby-cheer .sc-baby-body {
        animation: none !important;
      }
      .sc-egg-hatched .sc-shell-top,
      .sc-egg-hatched .sc-shell-bot {
        opacity: 0;
      }
    }
  </style>
</head><body>

          });

          // 第三段：每 4 顆目標蛋固定出現 1 顆彩虹蛋
          if (cfg.stage === 2) {
            stage3RainbowCounter++;
            if (stage3RainbowCounter % 4 === 0) {
              egg.isRainbow = true;
              egg.el.classList.add('sc-egg-rainbow');
              egg.inner.innerHTML = makeEggSvg(egg.themeIdx, true);
              api.say('哇！彩虹蛋！');
            }
          }

          var mult = assistActive ? Math.max(cfg.size, 1.4) : cfg.size;
          applyEggSize(egg, mult);
          if (forceGlow) api.glow(egg.el, true);
        }

        function createEgg(x, y, plan, cfg, themeIdx) {
          var el = document.createElement('div');
          el.className = 'sc-egg';
          el.style.left = x + 'px';
          el.style.top = y + 'px';

          var inner = document.createElement('div');
          inner.className = 'sc-egg-inner';
          inner.innerHTML = makeEggSvg(themeIdx, false);
          el.appendChild(inner);

          var msg = document.createElement('div');
          msg.className = 'sc-egg-msg mi-zy';
          msg.textContent = '嘻嘻嘻～';
          el.appendChild(msg);

          var egg = {
            el: el,
            inner: inner,
            x: x,
            y: y,
            baseW: plan.w,
            baseH: plan.h,
            themeIdx: themeIdx,
            isRainbow: false,
            hatched: false,
            phase: Math.random() * Math.PI * 2,
            lastBlink: 0
          };
          applyEggSize(egg, assistActive ? Math.max(cfg.size, 1.4) : cfg.size);
          api.field.appendChild(el);
          eggs.push(egg);

          // 操作偵測一律交由 api.on('dblclick')
          var off = api.on(el, 'dblclick', {
            first: function () {
              if (egg.hatched) return;
              // 第三段干擾蛋：點到只會眨眼，不算失手
              if (egg !== currentEgg) {
                triggerBlink(egg);
                return;
              }
              egg.el.classList.remove('sc-egg-laughing');
              egg.el.classList.add('sc-egg-cracked');
              egg.el.classList.remove('sc-egg-knock');
              void egg.el.offsetWidth;
              egg.el.classList.add('sc-egg-knock');
              api.sfx('pop');
            },
            single: function () {
              if (egg.hatched) return;
              if (egg !== currentEgg) {
                triggerBlink(egg);
                return;
              }
              // 只按一下就停：收起裂紋、搞笑咯咯笑、晃兩下，再 api.miss()
              egg.el.classList.remove('sc-egg-cracked');
              egg.el.classList.add('sc-egg-laughing');
              api.wob(egg.el);
              api.sfx('giggle');
              api.miss();
              var myRun = runId;
              api.later(function () {
                if (myRun !== runId) return;
                egg.el.classList.remove('sc-egg-laughing');
              }, 950);
            },
            ok: function () {
              if (egg.hatched) return;
              if (egg !== currentEgg) {
                triggerBlink(egg);
                return;
              }
              hatchEgg(egg);
            }
          });
          offs.push(off);
          return egg;
        }

        function hatchEgg(egg) {
          egg.hatched = true;
          currentEgg = null;
          api.glow(egg.el, false);
          egg.el.classList.remove('sc-egg-laughing', 'sc-egg-cracked', 'sc-egg-active');
          egg.el.classList.add('sc-egg-hatched');
          egg.inner.style.transform = '';

          var animalId = pickAnimalId(egg.isRainbow);
          var isNew = api.collect(animalId);
          api.hit();
          api.sfx(egg.isRainbow || isNew ? 'gem' : 'ok');
          if (egg.isRainbow) api.say('彩虹獨角獸出來了！');

          spawnSparks(egg.x, egg.y);
          spawnBaby(egg, animalId);

          doneCount++;
          updateCount();

          var myRun = runId;
          var curStage = api.stage();

          // 蛋殼動畫結束後移除該蛋節點
          api.later(function () {
            if (myRun !== runId) return;
            if (egg.el.parentNode) egg.el.parentNode.removeChild(egg.el);
          }, 600);

          if (doneCount >= totalCount) {
            // 第三段結尾：右側排好隊的小動物一起跳躍歡呼
            if (curStage === 2) {
              api.later(function () {
                if (myRun !== runId) return;
                api.say('太棒了！全部敲開了！');
                babies.forEach(function (b) { b.classList.add('sc-baby-cheer'); });
                api.sfx('gem');
                // 學習能力連回真的電腦：雙擊是用來「打開」東西（11-22 驗收補）
                api.later(function () {
                  if (myRun !== runId) return;
                  api.say('電腦上按兩下，可以打開資料夾！');
                }, 1300);
                api.later(function () {
                  if (myRun !== runId) return;
                  api.stageDone();
                }, 3600);
              }, 1100);
            } else {
              api.later(function () {
                if (myRun !== runId) return;
                api.stageDone();
              }, 1100);
            }
            return;
          }

          // 繼續同一段的下一顆目標蛋
          api.later(function () {
            if (myRun !== runId) return;
            var latestCfg = api.cfg();
            if (curStage === 1) {
              spawnStage2Next(latestCfg);
            } else if (curStage === 2) {
              var remain = eggs.filter(function (item) { return !item.hatched; });
              if (remain.length) {
                var next = remain[Math.floor(Math.random() * remain.length)];
                makeTargetActive(next, latestCfg, true);
              }
            }
          }, 720);
        }

        var stage2Queue = [];
        function spawnStage2Next(cfg) {
          var spot = stage2Queue.shift() || STAGE2_SPOTS[0];
          var jx = Math.round((Math.random() - .5) * 34);
          var jy = Math.round((Math.random() - .5) * 28);
          var egg = createEgg(spot.x + jx, spot.y + jy, PLAN[1], cfg, doneCount);
          makeTargetActive(egg, cfg, false);
        }

        function startWobbleLoop() {
          var last = performance.now();
          function loop(now) {
            var dt = Math.min(.05, (now - last) / 1000);
            last = now;
            var cfg = api.cfg();
            var p = PLAN[cfg.stage];
            if (currentEgg && !currentEgg.hatched && p.wobbleAmp > 0 && !assistActive && !cfg.assist && !prefersReduced()) {
              currentEgg.phase += dt * p.wobbleSpeed * cfg.speed;
              var deg = Math.sin(currentEgg.phase) * p.wobbleAmp;
              currentEgg.inner.style.transform = 'rotate(' + deg.toFixed(2) + 'deg)';
            } else if (currentEgg && !currentEgg.hatched) {
              currentEgg.inner.style.transform = '';
            }
            rafId = requestAnimationFrame(loop);
          }
          rafId = requestAnimationFrame(loop);
        }

        return {
          start: function (stage, cfg) {
            clear();
            assistActive = !!cfg.assist;
            doneCount = 0;
            totalCount = PLAN[stage].n;

            api.field.innerHTML =
              '<div class="sc-bg">' + DECO_SVG + '<div class="sc-wave"></div></div>' +
              '<div class="sc-count mi-zy"></div>';
            updateCount();

            if (stage === 0) {
              // 第一段：稻草巢＋1 顆不動大蛋，先 glow 再播 dblclick 示範，畫面乾淨無干擾物
              var nest = document.createElement('div');
              nest.className = 'sc-nest';
              nest.style.left = '730px';
              nest.style.top = '326px';
              nest.innerHTML = NEST_SVG;
              api.field.appendChild(nest);

              var egg1 = createEgg(730, 236, PLAN[0], cfg, 0);
              makeTargetActive(egg1, cfg, true);
              api.demo(egg1.el, 'dblclick');
            } else if (stage === 1) {
              // 第二段：4 顆蛋一次出現一顆，輕輕左右搖，不主動提示
              stage2Queue = shuffle(STAGE2_SPOTS);
              spawnStage2Next(cfg);
            } else {
              // 第三段：5 顆蛋同時在畫面上，只有發光的那顆要敲，其餘為干擾物
              var spots = shuffle(STAGE3_SPOTS);
              for (var i = 0; i < 5; i++) {
                var sx = spots[i].x + Math.round((Math.random() - .5) * 30);
                var sy = spots[i].y + Math.round((Math.random() - .5) * 28);
                createEgg(sx, sy, PLAN[2], cfg, i);
              }
              var first = eggs[Math.floor(Math.random() * eggs.length)];
              makeTargetActive(first, cfg, true);
            }

            startWobbleLoop();
          },

          hint: function (level) {
            if (!currentEgg || currentEgg.hatched) return;
            api.glow(currentEgg.el, true);
            if (level === 1) {
              api.wob(currentEgg.el);
            } else if (level === 2) {
              api.demo(currentEgg.el, 'dblclick');
            }
          },

          assist: function () {
            assistActive = true;
            if (!currentEgg || currentEgg.hatched) return;
            var mult = Math.max(api.cfg().size, 1.4);
            applyEggSize(currentEgg, mult);
            currentEgg.inner.style.transform = '';
          },

          stop: clear
        };
      }
    });
  })();
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
</body></html>
