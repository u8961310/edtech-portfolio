<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分類大隊長 - 練習觀察特徵</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    :root { --c: #92400e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; overflow-x: hidden; }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        background:
            radial-gradient(circle at 20% 80%, #fde68a99 0%, transparent 55%),
            radial-gradient(circle at 80% 20%, #fcd34d88 0%, transparent 55%),
            linear-gradient(180deg, #fffbeb 0%, #fef3c7 60%, #fde68a 100%);
        color: #451a03;
        min-height: 100vh;
        touch-action: none;
    }

    .screen {
        min-height: 100vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 20px;
    }
    .hidden { display: none !important; }

    /* ===== Start screen ===== */
    .title-emoji {
        font-size: clamp(80px, 14vw, 140px);
        animation: bounce 1.8s ease-in-out infinite;
        filter: drop-shadow(0 6px 8px #92400e55);
    }
    @keyframes bounce {
        0%, 100% { transform: translateY(0) rotate(-6deg); }
        50% { transform: translateY(-16px) rotate(6deg); }
    }
    .title-text {
        font-size: clamp(34px, 6vw, 54px);
        font-weight: 900;
        color: var(--c);
        text-shadow: 4px 4px 0 #fef3c7, 6px 6px 0 #92400e33;
        margin: 6px 0 4px;
        text-align: center;
    }
    .subtitle {
        font-size: clamp(16px, 2.2vw, 22px);
        color: #78350f;
        font-weight: 700;
        margin-bottom: 22px;
        text-align: center;
    }
    .intro-card {
        background: rgba(255,255,255,0.7);
        border: 3px solid var(--c);
        border-radius: 20px;
        padding: 16px 22px;
        max-width: 540px;
        margin: 0 auto 22px;
        text-align: left;
        line-height: 1.9;
        font-size: clamp(14px, 1.8vw, 17px);
        color: #451a03;
        box-shadow: 0 6px 0 #92400e22;
    }
    .intro-card strong { color: var(--c); }
    .intro-card .kb {
        display: inline-block;
        background: #fef3c7;
        border: 2px solid var(--c);
        border-radius: 6px;
        padding: 1px 8px;
        font-weight: 900;
        color: var(--c);
        margin: 0 2px;
    }

    /* ===== Big Button ===== */
    .big-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(20px, 2.6vw, 28px);
        font-weight: 900;
        padding: 14px 32px;
        background: linear-gradient(180deg, #d97706, var(--c));
        color: white;
        border: none;
        border-radius: 999px;
        box-shadow: 0 5px 0 #78350f, 0 8px 20px rgba(146,64,14,0.4);
        cursor: pointer;
        transition: transform 0.1s;
        text-shadow: 2px 2px 0 #78350f;
        margin: 6px;
    }
    .big-btn:hover { transform: translateY(-2px); }
    .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #78350f; }
    .big-btn.gold {
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        box-shadow: 0 5px 0 #b45309;
    }
    .big-btn.gold:active { box-shadow: 0 2px 0 #b45309; }
    .big-btn.gray {
        background: linear-gradient(180deg, #a8a29e, #78716c);
        box-shadow: 0 5px 0 #44403c;
        text-shadow: 2px 2px 0 #44403c;
    }

    /* ===== Game Screen ===== */
    #game-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 12px 16px;
        gap: 10px;
    }
    .game-top {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 760px;
    }
    .info-box {
        background: rgba(255,255,255,0.7);
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 900;
        font-size: clamp(13px, 1.6vw, 17px);
        color: var(--c);
        border: 2px solid var(--c);
    }
    .top-back {
        background: transparent;
        border: 2px solid var(--c);
        color: var(--c);
        font-family: 'Noto Sans TC', sans-serif;
        font-weight: 700;
        font-size: 14px;
        padding: 4px 14px;
        border-radius: 999px;
        cursor: pointer;
        text-decoration: none;
    }
    .level-title {
        font-size: clamp(16px, 2.2vw, 22px);
        font-weight: 900;
        color: var(--c);
        text-align: center;
        margin: 2px 0;
    }
    .hint-text {
        text-align: center;
        color: #78350f;
        font-size: clamp(13px, 1.7vw, 16px);
        font-weight: 700;
        background: rgba(255,255,255,0.55);
        padding: 6px 16px;
        border-radius: 999px;
        max-width: 600px;
        margin: 0 auto;
        min-height: 30px;
    }

    /* ===== Arena (sky) ===== */
    .arena {
        position: relative;
        width: 100%;
        max-width: 760px;
        height: clamp(280px, 50vh, 420px);
        background:
            radial-gradient(ellipse at 50% 0%, #fef9c3aa, transparent 70%),
            linear-gradient(180deg, #fef3c7 0%, #fde68a 100%);
        border-radius: 22px;
        border: 3px solid var(--c);
        box-shadow: 0 6px 0 #78350f, inset 0 -8px 20px #92400e22;
        overflow: hidden;
        touch-action: none;
    }
    .arena::before {
        content: '';
        position: absolute; inset: 0;
        background-image:
            radial-gradient(circle at 18% 22%, #ffffff66 0 4px, transparent 5px),
            radial-gradient(circle at 70% 30%, #ffffff44 0 5px, transparent 6px),
            radial-gradient(circle at 45% 55%, #ffffff44 0 3px, transparent 4px),
            radial-gradient(circle at 85% 70%, #ffffff44 0 4px, transparent 5px);
        pointer-events: none;
    }

    .item {
        position: absolute;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        line-height: 1;
        cursor: grab;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
        transform-origin: center;
        will-change: transform, left, top;
        animation: itemSpin 4s linear infinite;
        touch-action: none;
        z-index: 5;
    }
    .item.dragging {
        cursor: grabbing;
        animation: none;
        z-index: 20;
        transform: scale(1.2);
        filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4));
    }
    .item.wrong {
        animation: itemShake 0.5s ease;
    }
    .item.flying {
        animation: none;
        transition: left 0.45s cubic-bezier(.5,1.6,.5,1), top 0.45s cubic-bezier(.5,1.6,.5,1), transform 0.45s;
        z-index: 15;
    }
    @keyframes itemSpin {
        0%, 100% { transform: rotate(-8deg); }
        50% { transform: rotate(8deg); }
    }
    @keyframes itemShake {
        0%, 100% { transform: translateX(0) rotate(0); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25)); }
        20% { transform: translateX(-10px) rotate(-12deg); filter: drop-shadow(0 0 12px #ef4444); }
        40% { transform: translateX(10px) rotate(12deg); filter: drop-shadow(0 0 12px #ef4444); }
        60% { transform: translateX(-8px) rotate(-8deg); filter: drop-shadow(0 0 12px #ef4444); }
        80% { transform: translateX(8px) rotate(8deg); filter: drop-shadow(0 0 12px #ef4444); }
    }

    /* ===== Baskets row ===== */
    .baskets {
        width: 100%;
        max-width: 760px;
        display: grid;
        gap: 10px;
        padding: 10px 4px 0;
    }
    .baskets[data-count="2"] { grid-template-columns: 1fr 1fr; }
    .baskets[data-count="3"] { grid-template-columns: repeat(3, 1fr); }
    .baskets[data-count="4"] { grid-template-columns: repeat(4, 1fr); }
    .basket {
        background: linear-gradient(180deg, #fcd34d, #f59e0b);
        border: 3px solid var(--c);
        border-radius: 16px 16px 22px 22px;
        padding: 10px 6px;
        text-align: center;
        box-shadow: 0 4px 0 #78350f, inset 0 -8px 14px #92400e33;
        transition: transform 0.2s, box-shadow 0.2s;
        position: relative;
        min-height: 90px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
    }
    .basket.target {
        background: linear-gradient(180deg, #fef08a, #fde047);
        box-shadow: 0 4px 0 #78350f, 0 0 24px #fef08a, inset 0 -8px 14px #92400e33;
    }
    .basket.pop { animation: basketPop 0.4s ease; }
    @keyframes basketPop {
        0%, 100% { transform: scale(1); }
        40% { transform: scale(1.15); }
    }
    .basket-emoji {
        font-size: clamp(32px, 5vw, 44px);
        line-height: 1;
    }
    .basket-name {
        font-size: clamp(14px, 1.8vw, 18px);
        font-weight: 900;
        color: var(--c);
    }
    .basket-key {
        position: absolute;
        top: 4px;
        right: 6px;
        background: var(--c);
        color: #fef3c7;
        font-size: 12px;
        font-weight: 900;
        padding: 2px 8px;
        border-radius: 999px;
        line-height: 1.2;
    }

    /* ===== Banner ===== */
    .banner {
        position: fixed; inset: 0;
        background: rgba(69,26,3,0.55);
        display: flex; align-items: center; justify-content: center;
        z-index: 100;
        animation: bannerFade 0.25s ease-out;
    }
    @keyframes bannerFade { from { opacity: 0; } to { opacity: 1; } }
    .banner-card {
        background: linear-gradient(180deg, #fefce8, #fef3c7);
        border: 3px solid var(--c);
        padding: 26px 32px;
        border-radius: 22px;
        text-align: center;
        max-width: 90%;
        box-shadow: 0 12px 0 #78350f, 0 16px 40px rgba(0,0,0,0.4);

    .banner-trophy { font-size: 64px; line-height: 1; }
    .banner-title {
        font-size: clamp(22px, 3.2vw, 32px);
        font-weight: 900;
        color: var(--c);
        margin: 8px 0 4px;
    }
    .banner-stars {
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: 6px;
        margin: 6px 0;
    }
    .banner-msg {
        color: #78350f;
        font-size: clamp(14px, 1.8vw, 17px);
        font-weight: 700;
        margin: 4px 0;
    }
    .banner-actions {
        margin-top: 14px;
        display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    }

    /* ===== Certificate ===== */
    .certificate {
        background: linear-gradient(180deg, #fefce8, #fef3c7);
        border: 6px double var(--c);
        border-radius: 24px;
        padding: 36px 32px;
        text-align: center;
        max-width: 540px;
        position: relative;
        color: var(--c);
        box-shadow: 0 16px 40px rgba(146,64,14,0.3);
    }
    .cert-corner { position: absolute; font-size: 36px; }
    .cert-corner.tl { top: 8px; left: 12px; }
    .cert-corner.tr { top: 8px; right: 12px; }
    .cert-corner.bl { bottom: 8px; left: 12px; }
    .cert-corner.br { bottom: 8px; right: 12px; }
    .cert-title { font-size: clamp(28px, 4vw, 40px); font-weight: 900; color: var(--c); margin-bottom: 8px; }
    .cert-body { font-size: clamp(17px, 2vw, 21px); color: #78350f; line-height: 1.8; margin: 14px 0; }
    .cert-stat {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: center;
        margin: 10px 0;
    }
    .cert-stat .lvl-line {
        display: flex;
        gap: 8px;
        font-size: clamp(15px, 1.8vw, 18px);
        font-weight: 700;
        color: #78350f;
    }
    .cert-stat .lvl-label {
        min-width: 64px;
        text-align: right;
        color: var(--c);
    }
    .cert-rank { font-size: clamp(20px, 2.5vw, 28px); font-weight: 900; color: var(--c); margin-top: 14px; }

    /* ===== Print ===== */
    @media print {
        body { background: white; color: black; }
        #start-screen, #game-screen, .banner { display: none !important; }
        #end-screen { min-height: auto; padding: 0; }
        #end-screen > div:not(.certificate) { display: none !important; }
        .certificate { box-shadow: none; border-color: var(--c); }
    }
</style>
</head>

<div id="start-screen" class="screen">

        <strong>🎯 怎麼玩</strong><br>

<script>
'use strict';

// ============================================================
// Audio
// ============================================================
let audioCtx = null;
function getAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    return audioCtx;
}
function beep(freq, dur, type = 'sine', vol = 0.1) {
    try {
        const ctx = getAudio(); if (!ctx) return;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(vol, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(g).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
    } catch(e) {}
}
const SFX = {
    correct() {
        beep(880, 0.08, 'sine', 0.1);
        setTimeout(() => beep(1175, 0.14, 'sine', 0.1), 70);
    },
    wrong() {
        beep(220, 0.12, 'square', 0.12);
        setTimeout(() => beep(150, 0.18, 'square', 0.1), 120);
    },
    miss() {
        beep(180, 0.18, 'sawtooth', 0.08);
    },
    levelClear() {
        beep(660, 0.1, 'triangle', 0.1);
        setTimeout(() => beep(880, 0.1, 'triangle', 0.1), 110);
        setTimeout(() => beep(1100, 0.2, 'triangle', 0.12), 220);
    },
    finale() {
        const notes = [523, 659, 784, 1047, 1319];
        notes.forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle', 0.12), i * 130));
    },
};

// ============================================================
// State
// ============================================================
const state = {
    levelIdx: 0,
    spawnQueue: [],     // items waiting to spawn
    activeItems: [],    // currently in the arena (DOM + data)
    sortedCount: 0,     // correctly sorted
    levelTotal: 0,
    levelWrong: 0,
    levelMissed: 0,
    levelStars: [],
    totalStars: 0,
    running: false,
    rafId: null,
    lastSpawnTime: 0,
    dragItem: null,
    dragOffsetX: 0,
    dragOffsetY: 0,
};

function $(id) { return document.getElementById(id); }

// ============================================================
// Render Baskets
// ============================================================
function renderBaskets() {
    const level = LEVELS[state.levelIdx];
    const container = $('baskets');
    container.setAttribute('data-count', String(level.baskets.length));
    container.innerHTML = '';
    level.baskets.forEach((b, i) => {
        const el = document.createElement('div');
        el.className = 'basket';
        el.dataset.id = b.id;
        el.dataset.index = i;
        el.innerHTML = `
            <div class="basket-key">${b.keyHint}</div>
            <div class="basket-emoji">${b.emoji}</div>
            <div class="basket-name">${b.name}</div>
        `;
        container.appendChild(el);
    });
}

function renderHud() {
    const level = LEVELS[state.levelIdx];
    $('level-info').textContent = `第 ${state.levelIdx + 1} 關`;
    $('level-title').textContent = level.title;
    $('star-info').textContent = `⭐ ${state.totalStars}`;
    $('miss-info').textContent = `失誤 ${state.levelWrong + state.levelMissed}`;
    const remain = state.spawnQueue.length + state.activeItems.length;
    $('remain-info').textContent = `剩 ${remain}`;

    // Hint per level
    const hints = {
        0: '把水果丟左邊，文具丟右邊 🍎✏️',
        1: '三個籃子：水果、動物、文具',
        2: '看顏色！紅黃藍要分清楚 🟥🟨🟦',
        3: '看大小！小蟲、中型動物、大型動物',
        4: 'BOSS 關：吃的、玩的、學的、穿的，仔細想 ✨',
    };
    $('hint-text').textContent = hints[state.levelIdx] || '';
}

// ============================================================
// Item lifecycle
// ============================================================
function spawnItem() {
    if (state.spawnQueue.length === 0) return;
    const data = state.spawnQueue.shift();
    const arena = $('arena');
    const w = arena.clientWidth;
    const itemW = 64;
    const maxX = Math.max(20, w - itemW - 20);
    const x = 20 + Math.random() * (maxX - 20);

    const el = document.createElement('div');
    el.className = 'item';
    el.textContent = data.emoji;
    el.style.left = x + 'px';
    el.style.top = '-70px';
    arena.appendChild(el);

    const item = {
        el,
        cat: data.cat,
        emoji: data.emoji,
        x,
        y: -70,
        vy: LEVELS[state.levelIdx].fallSpeed,
        dragging: false,
        removed: false,
    };
    state.activeItems.push(item);

    // Pointer events for drag
    el.addEventListener('pointerdown', (e) => onPointerDown(e, item));
}

function onPointerDown(e, item) {
    if (item.removed) return;
    e.preventDefault();
    state.dragItem = item;
    item.dragging = true;
    item.el.classList.add('dragging');
    item.el.style.pointerEvents = 'none'; // so elementFromPoint sees baskets

    const arena = $('arena');
    const rect = arena.getBoundingClientRect();
    const pointerX = e.clientX - rect.left;
    const pointerY = e.clientY - rect.top;
    state.dragOffsetX = pointerX - item.x;
    state.dragOffsetY = pointerY - item.y;

    try { item.el.setPointerCapture(e.pointerId); } catch(_) {}
}

function onPointerMove(e) {
    if (!state.dragItem) return;
    const item = state.dragItem;
    if (item.removed) return;
    const arena = $('arena');
    const rect = arena.getBoundingClientRect();
    const pointerX = e.clientX - rect.left;
    const pointerY = e.clientY - rect.top;
    item.x = pointerX - state.dragOffsetX;
    item.y = pointerY - state.dragOffsetY;
    item.el.style.left = item.x + 'px';
    item.el.style.top = item.y + 'px';
}

function onPointerUp(e) {
    if (!state.dragItem) return;
    const item = state.dragItem;
    const droppedEl = document.elementFromPoint(e.clientX, e.clientY);
    const basket = droppedEl ? droppedEl.closest('.basket') : null;

    item.el.classList.remove('dragging');
    item.el.style.pointerEvents = '';
    item.dragging = false;
    state.dragItem = null;

    if (basket) {
        handleDrop(item, basket.dataset.id);
    } else {
        // Released in arena: keep falling from current y
    }
}

// ============================================================
// Drop handling
// ============================================================
function handleDrop(item, basketId) {
    if (item.removed) return;
    if (item.cat === basketId) {
        correctDrop(item, basketId);
    } else {
        wrongDrop(item);
    }
}

function correctDrop(item, basketId) {
    item.removed = true;
    SFX.correct();
    const basket = document.querySelector(`.basket[data-id="${basketId}"]`);
    if (basket) {
        basket.classList.add('pop');
        setTimeout(() => basket.classList.remove('pop'), 400);
    }

    // Animate flying into basket
    const arena = $('arena');
    const arenaRect = arena.getBoundingClientRect();
    if (basket) {
        const br = basket.getBoundingClientRect();
        const targetX = br.left + br.width / 2 - arenaRect.left - 32;
        const targetY = br.top + br.height / 2 - arenaRect.top - 32;
        item.el.classList.add('flying');
        item.el.style.left = targetX + 'px';
        item.el.style.top = targetY + 'px';
        item.el.style.transform = 'scale(0.2)';
        item.el.style.opacity = '0';
    }

    setTimeout(() => removeItem(item), 460);
    state.sortedCount++;
    checkLevelDone();
}

function wrongDrop(item) {
    item.removed = true;
    state.levelWrong++;
    SFX.wrong();
    item.el.classList.add('wrong');
    setTimeout(() => {
        item.el.style.transition = 'opacity 0.3s, transform 0.3s';
        item.el.style.opacity = '0';
        item.el.style.transform = 'scale(0.6)';
        setTimeout(() => removeItem(item), 320);
    }, 500);
    renderHud();
    checkLevelDone();
}

function removeItem(item) {
    if (item.el && item.el.parentNode) item.el.parentNode.removeChild(item.el);
    state.activeItems = state.activeItems.filter(it => it !== item);
}

// ============================================================
// Keyboard shortcut: send lowest item to basket N
// ============================================================
function sendLowestToBasket(basketIndex) {
    const level = LEVELS[state.levelIdx];
    if (basketIndex < 0 || basketIndex >= level.baskets.length) return;
    // Find lowest (max y) non-removed non-dragging item
    let target = null;
    state.activeItems.forEach(it => {
        if (it.removed || it.dragging) return;
        if (!target || it.y > target.y) target = it;
    });
    if (!target) return;
    const basketId = level.baskets[basketIndex].id;
    // Highlight target basket briefly
    const basketEl = document.querySelectorAll('.basket')[basketIndex];
    if (basketEl) {
        basketEl.classList.add('target');
        setTimeout(() => basketEl.classList.remove('target'), 300);
    }
    handleDrop(target, basketId);
}

// ============================================================
// Game loop
// ============================================================
function tick(now) {
    if (!state.running) return;
    const arena = $('arena');
    const h = arena.clientHeight;
    const level = LEVELS[state.levelIdx];

    // Spawn timing
    if (!state.lastSpawnTime) state.lastSpawnTime = now;
    if (state.spawnQueue.length > 0 && (now - state.lastSpawnTime) >= level.spawnInterval) {
        // Only spawn if active items count is reasonable (so screen isn't crowded)
        if (state.activeItems.length < 3) {
            spawnItem();
            state.lastSpawnTime = now;
        }
    }

    // Update positions
    for (const item of state.activeItems) {
        if (item.removed || item.dragging) continue;
        item.y += item.vy;
        item.el.style.top = item.y + 'px';
        if (item.y > h + 10) {
            // Missed
            item.removed = true;
            state.levelMissed++;
            SFX.miss();
            removeItem(item);
            renderHud();
            checkLevelDone();
        }
    }

    renderHud();
    state.rafId = requestAnimationFrame(tick);
}

// ============================================================
// Level flow
// ============================================================
function startLevel() {
    const level = LEVELS[state.levelIdx];
    state.spawnQueue = level.items.map(it => ({ ...it }));
    // Shuffle spawn order
    for (let i = state.spawnQueue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.spawnQueue[i], state.spawnQueue[j]] = [state.spawnQueue[j], state.spawnQueue[i]];
    }
    state.activeItems = [];
    state.sortedCount = 0;
    state.levelTotal = level.items.length;
    state.levelWrong = 0;
    state.levelMissed = 0;
    state.lastSpawnTime = 0;
    $('arena').innerHTML = '';
    renderBaskets();
    renderHud();
    state.running = true;
    state.rafId = requestAnimationFrame(tick);
}

function checkLevelDone() {
    if (state.spawnQueue.length === 0 && state.activeItems.length === 0) {
        levelComplete();
    }
}

function calcStars(wrong, missed) {
    const total = wrong + missed;
    if (total === 0) return 3;
    if (total <= 2) return 2;
    return 1;
}

function levelComplete() {
    if (!state.running) return;
    state.running = false;
    if (state.rafId) cancelAnimationFrame(state.rafId);

    const stars = calcStars(state.levelWrong, state.levelMissed);
    state.totalStars += stars;
    state.levelStars[state.levelIdx] = stars;
    SFX.levelClear();

    const isLast = state.levelIdx >= LEVELS.length - 1;
    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.id = 'banner';
    const missNote = (state.levelWrong + state.levelMissed) === 0
        ? '<div style="font-size: 14px; color: #15803d; margin-top: 4px;">完美分類！眼力一流 ✨</div>'
        : `<div style="font-size: 14px; color: #78350f; margin-top: 4px;">分錯 ${state.levelWrong} 個 · 漏掉 ${state.levelMissed} 個</div>`;
    banner.innerHTML = `
        <div class="banner-card">
            <div class="banner-trophy">🎉</div>
            <div class="banner-title">完成 ${LEVELS[state.levelIdx].title.split('：')[1] || ''}！</div>
            <div class="banner-stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
            <div class="banner-msg">獲得 ${stars} 顆星星</div>
            ${missNote}
            <div class="banner-actions">
                ${isLast
                    ? '<button class="big-btn gold" onclick="finishAll()">🏆 領取證書</button>'
                    : '<button class="big-btn" onclick="nextLevel()">▶ 下一關</button>'}
            </div>
        </div>
    `;
    document.body.appendChild(banner);
}

function closeBanner() {
    const b = $('banner');
    if (b) b.remove();
}

function nextLevel() {
    closeBanner();
    state.levelIdx++;
    startLevel();
}

function finishAll() {
    closeBanner();
    SFX.finale();
    try {
        const prev = parseInt(localStorage.getItem('edtech-unit10-score') || '0', 10);
        if (state.totalStars > prev) localStorage.setItem('edtech-unit10-score', state.totalStars);
    } catch(e) {}

    $('game-screen').classList.add('hidden');
    $('end-screen').classList.remove('hidden');

    let starsHtml = '';
    for (let i = 0; i < LEVELS.length; i++) {
        const s = state.levelStars[i] || 0;
        starsHtml += `<span class="lvl-line"><span class="lvl-label">第${i+1}關</span>${'⭐'.repeat(s)}${'☆'.repeat(3 - s)}</span>`;
    }
    $('cert-stars').innerHTML = starsHtml;

    const total = state.totalStars;
    if (total >= 15) {
        $('cert-trophy').textContent = '👑';
        $('cert-rank').textContent = '👑 稱號：分類大宗師';
    } else if (total >= 13) {
        $('cert-trophy').textContent = '🥇';
        $('cert-rank').textContent = '🥇 稱號：分類達人';
    } else if (total >= 9) {
        $('cert-trophy').textContent = '🥈';
        $('cert-rank').textContent = '🥈 稱號：觀察小高手';
    } else {
        $('cert-trophy').textContent = '💪';
        $('cert-rank').textContent = '💪 稱號：練習中';
    }

    const today = new Date();
    $('cert-date').textContent = `${today.getFullYear() - 1911} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日 頒發`;
}

// ============================================================
// Flow control
// ============================================================
function startGame() {
    state.levelIdx = 0;
    state.totalStars = 0;
    state.levelStars = [];
    $('start-screen').classList.add('hidden');
    $('end-screen').classList.add('hidden');
    $('game-screen').classList.remove('hidden');
    getAudio();
    startLevel();
}

// ============================================================
// Listeners (global)
// ============================================================
document.addEventListener('pointermove', onPointerMove);
document.addEventListener('pointerup', onPointerUp);
document.addEventListener('pointercancel', onPointerUp);

document.addEventListener('keydown', (e) => {
    // Dev shortcut: F8 jump to certificate
    if (e.key === 'F8') {
        e.preventDefault();
        state.levelStars = [3, 3, 2, 3, 2];
        state.totalStars = 13;
        $('start-screen').classList.add('hidden');
        $('game-screen').classList.add('hidden');
        state.running = false;
        if (state.rafId) cancelAnimationFrame(state.rafId);
        finishAll();
        return;
    }

    if ($('game-screen').classList.contains('hidden')) return;
    if (!state.running) return;

    if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        sendLowestToBasket(parseInt(e.key, 10) - 1);
    }
});

// Prevent page scroll while dragging on touch
document.addEventListener('touchmove', (e) => {
    if (state.dragItem) e.preventDefault();
}, { passive: false });
</script>
</body>
