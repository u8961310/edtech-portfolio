<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鍵盤打地鼠 - 一年級鍵盤入門</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<script defer src="../../assets/fullscreen.js"></script>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; min-height: 100%; }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        background: linear-gradient(180deg, #fef3c7 0%, #fcd34d 100%);
        color: #78350f;
        min-height: 100vh;
    }

    .screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .hidden { display: none !important; }

    /* ===== Title ===== */
    .title-emoji {
        font-size: clamp(80px, 16vw, 160px);
        animation: jump 1s ease-in-out infinite;
    }
    @keyframes jump {
        0%, 100% { transform: translateY(0) rotate(-5deg); }
        50% { transform: translateY(-25px) rotate(5deg); }
    }
    .title-text {
        font-size: clamp(36px, 6vw, 56px);
        font-weight: 900;
        text-shadow: 4px 4px 0 #fff, 6px 6px 0 #92400e44;
        margin: 8px 0;
        text-align: center;
    }
    .subtitle {
        font-size: clamp(18px, 2.5vw, 22px);
        color: #92400e;
        font-weight: 700;
        margin-bottom: 24px;
        text-align: center;
    }

    /* ===== Big Button ===== */
    .big-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(22px, 3vw, 30px);
        font-weight: 900;
        padding: 16px 36px;
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        color: white;
        border: none;
        border-radius: 999px;
        box-shadow: 0 6px 0 #b45309, 0 10px 20px rgba(0,0,0,0.2);
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s;
        text-shadow: 2px 2px 0 #92400e;
        margin: 8px;
    }
    .big-btn:hover { transform: translateY(-2px); }
    .big-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #b45309, 0 5px 10px rgba(0,0,0,0.15); }
    .big-btn.secondary {
        background: linear-gradient(180deg, #60a5fa, #3b82f6);
        box-shadow: 0 6px 0 #1d4ed8, 0 10px 20px rgba(0,0,0,0.2);
        text-shadow: 2px 2px 0 #1e40af;
    }
    .big-btn.green {
        background: linear-gradient(180deg, #4ade80, #16a34a);
        box-shadow: 0 6px 0 #15803d, 0 10px 20px rgba(0,0,0,0.2);
        text-shadow: 2px 2px 0 #14532d;
    }
    .big-btn.purple {
        background: linear-gradient(180deg, #c084fc, #9333ea);
        box-shadow: 0 6px 0 #6b21a8, 0 10px 20px rgba(0,0,0,0.2);
        text-shadow: 2px 2px 0 #581c87;
    }

    /* Mode selection */
    .mode-grid {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 20px 0;
    }
    .mode-card {
        background: white;
        border: 4px solid #fbbf24;
        border-radius: 24px;
        padding: 24px;
        cursor: pointer;
        text-align: center;
        min-width: 180px;
        transition: transform 0.15s;
        box-shadow: 0 6px 0 #f59e0b;
    }
    .mode-card:hover { transform: translateY(-4px); }
    .mode-card:active { transform: translateY(2px); box-shadow: 0 4px 0 #f59e0b; }
    .mode-card .mode-emoji { font-size: 64px; margin-bottom: 8px; }
    .mode-card .mode-name { font-size: 24px; font-weight: 900; color: #78350f; }
    .mode-card .mode-desc { font-size: 14px; color: #92400e; margin-top: 4px; }

    /* ===== HUD ===== */
    #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: clamp(20px, 2.5vw, 26px);
        font-weight: 900;
        z-index: 50;
        pointer-events: none;
    }
    .hud-box {
        background: rgba(255,255,255,0.9);
        padding: 8px 20px;
        border-radius: 999px;
        box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }
    .hud-box.warning { background: #fecaca; color: #b91c1c; animation: pulse 0.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    /* ===== Game Screen Layout (viewport-bounded) ===== */
    #game-screen {
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    #game-screen > .screen {
        flex: 1;
        min-height: 0;
        padding: 72px 16px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }

    /* ===== Game Field ===== */
    #game-field {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: clamp(8px, 1.5vw, 16px);
        width: min(460px, 92vw, 68vh);
        aspect-ratio: 1 / 1;
        margin: 0 auto;
    }

    .hole {
        position: relative;
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at center bottom, #57534e 0%, #44403c 50%, #1c1917 100%);
        border-radius: 50% / 35%;
        box-shadow: inset 0 6px 16px rgba(0,0,0,0.6), 0 4px 8px rgba(0,0,0,0.2);
        overflow: visible;
    }
    .hole::after {
        content: '';
        position: absolute;
        left: 5%;
        right: 5%;
        bottom: -4%;
        height: 14%;
        background: linear-gradient(180deg, #a16207, #78350f);
        border-radius: 50%;
        z-index: 1;
    }

    .mole {
        position: absolute;
        left: 50%;
        bottom: 5%;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 4;
        opacity: 0;
        transform: translateX(-50%) translateY(40%) scale(0.7);
        transition: opacity 0.18s ease-out, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: none;
    }
    .mole.up {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
    }
    .mole.hit {
        animation: mole-hit 0.4s ease-out forwards;
    }
    @keyframes mole-hit {
        0% { transform: translateX(-50%) scale(1) rotate(0); }
        30% { transform: translateX(-50%) scale(1.3) rotate(-15deg); }
        100% { transform: translateX(-50%) scale(0.5) rotate(360deg); opacity: 0; }
    }
    .mole-emoji {
        font-size: clamp(50px, 9vw, 80px);
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }
    .mole-sign {
        background: white;
        border: 4px solid #ef4444;
        border-radius: 12px;
        padding: 4px 14px;
        margin-top: -16px;
        font-size: clamp(28px, 5vw, 42px);
        font-weight: 900;
        color: #b91c1c;
        box-shadow: 0 4px 0 #991b1b;
        z-index: 3;
        min-width: 50px;
        text-align: center;
        line-height: 1;
    }
    .mole-sign.arrow { color: #1d4ed8; border-color: #3b82f6; box-shadow: 0 4px 0 #1e40af; font-size: clamp(36px, 6vw, 52px); }

    /* Hit feedback overlay (per hole) */
    .hole .feedback {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        font-size: clamp(40px, 7vw, 64px);
        z-index: 5;
        pointer-events: none;
    }
    .hole .feedback.show {
        animation: feedback-pop 0.6s ease-out forwards;
    }
    @keyframes feedback-pop {
        0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
        50% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
        100% { transform: translate(-50%, -150%) scale(1); opacity: 0; }
    }

    /* Wrong key shake (preserves mole's up-state transform) */
    .shake { animation: shake 0.25s ease-in-out; }
    @keyframes shake {
        0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
        25% { transform: translateX(calc(-50% - 8px)) translateY(0) scale(1); }
        75% { transform: translateX(calc(-50% + 8px)) translateY(0) scale(1); }
    }

    /* Countdown overlay */
    .countdown {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(150px, 25vw, 280px);
        font-weight: 900;
        color: #fbbf24;
        text-shadow: 8px 8px 0 #b45309, 12px 12px 0 rgba(0,0,0,0.4);
        z-index: 100;
        animation: countdown-pop 1s ease-out forwards;
    }
    @keyframes countdown-pop {
        0% { transform: scale(0.3); opacity: 0; }
        40% { transform: scale(1); opacity: 1; }
        80% { transform: scale(1); opacity: 1; }
        100% { transform: scale(1.5); opacity: 0; }
    }

    /* Keyboard hint footer */
    .hint-bar {
        margin: 0;
        padding: 10px 20px;
        background: rgba(255,255,255,0.85);
        border-radius: 14px;
        font-size: clamp(14px, 1.8vw, 18px);
        font-weight: 700;
        color: #78350f;
        text-align: center;
        max-width: 600px;
        flex-shrink: 0;
    }
    .key-icon {
        display: inline-block;
        background: white;
        border: 2px solid #78350f;
        border-radius: 6px;
        padding: 2px 8px;
        margin: 0 2px;
        font-family: monospace;
        font-weight: 900;
        box-shadow: 0 2px 0 #78350f;
    }

    /* ===== Certificate ===== */
    .certificate {
        background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
        border: 8px solid #f59e0b;
        border-radius: 24px;
        padding: 32px 48px;
        max-width: 600px;
        text-align: center;
        box-shadow: 0 16px 32px rgba(0,0,0,0.2);
        position: relative;
        margin: 16px;
    }
    .cert-corner { position: absolute; font-size: 40px; }
    .cert-corner.tl { top: 8px; left: 12px; }
    .cert-corner.tr { top: 8px; right: 12px; }
    .cert-corner.bl { bottom: 8px; left: 12px; }
    .cert-corner.br { bottom: 8px; right: 12px; }
    .cert-title { font-size: clamp(28px, 4vw, 40px); font-weight: 900; color: #92400e; margin-bottom: 8px; }
    .cert-body { font-size: clamp(18px, 2vw, 22px); color: #78350f; line-height: 1.8; margin: 16px 0; }
    .cert-stat { font-size: clamp(24px, 3vw, 32px); font-weight: 900; color: #b91c1c; margin: 8px 0; }
    .cert-rank { font-size: clamp(20px, 2.5vw, 28px); font-weight: 900; color: #7c2d12; margin-top: 16px; }

    @media print {
        body * { visibility: hidden; }
        #end-screen .certificate, #end-screen .certificate * { visibility: visible; }
        #end-screen .certificate { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    }
</style>
</head>
<body>

<!-- ===== Start Screen ===== -->
<div id="start-screen" class="screen">
    <div class="title-emoji">🐹⌨️</div>
    <h1 class="title-text">鍵盤打地鼠</h1>
    <p class="subtitle">地鼠冒出來，按對鍵就打中！</p>

    <p style="font-size: clamp(18px, 2vw, 22px); font-weight: 900; color: #92400e; margin: 16px 0 8px;">選一個關卡 👇</p>
    <div class="mode-grid">
        <div class="mode-card" onclick="startGame('number')">
            <div class="mode-emoji">🔢</div>
            <div class="mode-name">數字關</div>
            <div class="mode-desc">按 1 ～ 9</div>
        </div>
        <div class="mode-card" onclick="startGame('arrow')">
            <div class="mode-emoji">⬆️⬇️</div>
            <div class="mode-name">方向關</div>
            <div class="mode-desc">按 ↑ ↓ ← →</div>
        </div>
        <div class="mode-card" onclick="startGame('letter')">
            <div class="mode-emoji">🔡</div>
            <div class="mode-name">字母關</div>
            <div class="mode-desc">按 A ～ Z</div>
        </div>
    </div>

    <div class="hint-bar" style="margin-top: 24px;">
        💡 看到地鼠舉著字牌，就在鍵盤上找到那個鍵按下去！
    </div>
</div>

<!-- ===== Game Screen ===== -->
<div id="game-screen" class="hidden">
    <div id="hud">
        <div class="hud-box" id="hud-time">⏱️ 60</div>
        <div class="hud-box" id="hud-mode">🔢 數字關</div>
        <div class="hud-box" id="hud-score">⭐ 0</div>
    </div>
    <div class="screen">
        <div id="game-field"></div>
        <div class="hint-bar" id="hint-bar">
            看到地鼠 → 按下牌子上的<span class="key-icon">鍵</span>
        </div>
    </div>
</div>

<!-- ===== End Screen ===== -->
<div id="end-screen" class="screen hidden">
    <div class="certificate">
        <span class="cert-corner tl">⭐</span>
        <span class="cert-corner tr">⭐</span>
        <span class="cert-corner bl">⭐</span>
        <span class="cert-corner br">⭐</span>
        <div style="font-size: 64px;" id="cert-trophy">🏆</div>
        <div class="cert-title" id="cert-title">鍵盤達人證書</div>
        <div class="cert-body">
            恭喜完成<br>
            <strong id="cert-mode">鍵盤打地鼠</strong>
        </div>
        <div class="cert-stat">⭐ <span id="cert-score">0</span> 分</div>
        <div class="cert-stat" style="font-size: clamp(18px, 2vw, 22px); color: #78350f;">
            打中 <span id="cert-hits">0</span> 隻 · 準確率 <span id="cert-acc">0</span>%
        </div>
        <div class="cert-rank" id="cert-rank">🥈 稱號：鍵盤小學徒</div>
        <div style="margin-top: 16px; font-size: 14px; color: #78350f;" id="cert-date"></div>
    </div>
    <div style="margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
        <button class="big-btn green" onclick="location.reload()">🔄 再玩一次</button>
        <button class="big-btn secondary" onclick="window.print()">🖨️ 列印證書</button>
    </div>
</div>

<script>
'use strict';

// ============================================================
// Audio Engine
// ============================================================
let audioCtx = null;
function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}
function beep(freq, duration, type = 'square', volume = 0.15) {
    try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
    } catch (e) { /* audio unavailable */ }
}
const SFX = {
    hit: () => { beep(900, 0.06, 'square'); setTimeout(() => beep(1300, 0.1, 'sine'), 60); },
    miss: () => beep(180, 0.15, 'sawtooth', 0.1),
    pop: () => beep(440, 0.08, 'sine', 0.1),
    win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'sine'), i * 100)),
    tick: () => beep(1200, 0.04, 'square', 0.08),
};

// ============================================================
// Game State
// ============================================================
const state = {
    mode: 'number',
    score: 0,
    hits: 0,
    misses: 0,
    timeLeft: 60,
    playing: false,
    moles: new Map(),
    spawnTimer: null,
    countdownTimer: null,
    elapsed: 0,
};

const POOLS = {
    number: ['1','2','3','4','5','6','7','8','9'],
    arrow: ['↑','↓','←','→'],
    letter: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
};

const MODE_LABELS = {
    number: '🔢 數字關',
    arrow: '⬆️ 方向關',
    letter: '🔡 字母關',
};

const KEY_TO_CHAR = {
    'ArrowUp': '↑', 'ArrowDown': '↓', 'ArrowLeft': '←', 'ArrowRight': '→',
};

// ============================================================
// Field Setup
// ============================================================
function buildField() {
    const field = document.getElementById('game-field');
    field.innerHTML = '';
    for (let i = 0; i < 9; i++) {
        const hole = document.createElement('div');
        hole.className = 'hole';
        hole.dataset.idx = i;
        const fb = document.createElement('div');
        fb.className = 'feedback';
        hole.appendChild(fb);
        field.appendChild(hole);
    }
}

// ============================================================
// Mole Spawning
// ============================================================
function spawnMole() {
    if (!state.playing) return;
    const field = document.getElementById('game-field');
    const holes = field.querySelectorAll('.hole');
    const empty = [...holes].filter(h => !state.moles.has(h.dataset.idx));
    if (empty.length === 0) return;

    const hole = empty[Math.floor(Math.random() * empty.length)];
    const pool = POOLS[state.mode];
    const char = pool[Math.floor(Math.random() * pool.length)];

    const mole = document.createElement('div');
    mole.className = 'mole';
    mole.innerHTML = `<div class="mole-sign ${state.mode === 'arrow' ? 'arrow' : ''}">${char}</div><div class="mole-emoji">🐹</div>`;
    hole.appendChild(mole);

    const record = { char, mole, hole, hit: false };
    state.moles.set(hole.dataset.idx, record);

    requestAnimationFrame(() => {
        mole.classList.add('up');
        SFX.pop();
    });

    // Lifetime ramps down as time passes: 2.5s → 1.2s
    const progress = Math.min(1, state.elapsed / 50);
    const lifetime = 2500 - progress * 1300;

    setTimeout(() => {
        if (record.hit) return;
        mole.classList.remove('up');
        setTimeout(() => {
            mole.remove();
            state.moles.delete(hole.dataset.idx);
        }, 300);
    }, lifetime);
}

// ============================================================
// Key Handling
// ============================================================
function normalizeKey(e) {
    if (KEY_TO_CHAR[e.key]) return KEY_TO_CHAR[e.key];
    if (e.key.length === 1) return e.key.toUpperCase();
    return null;
}

function handleKey(e) {
    if (!state.playing) return;
    const char = normalizeKey(e);
    if (!char) return;

    // Find first matching mole
    let matched = null;
    for (const [idx, rec] of state.moles) {
        if (rec.hit) continue;
        if (rec.char === char) {
            matched = rec;
            break;
        }
    }

    if (matched) {
        e.preventDefault();
        whackMole(matched);
    } else {
        // Wrong key - only show shake if any mole is up (avoids feedback when no moles)
        if (state.moles.size > 0) {
            state.misses++;
            SFX.miss();
            const visibleMoles = [...state.moles.values()].filter(r => !r.hit);
            visibleMoles.forEach(rec => {
                rec.mole.classList.remove('shake');
                void rec.mole.offsetWidth;
                rec.mole.classList.add('shake');
            });
        }
    }
}

function whackMole(rec) {
    rec.hit = true;
    state.hits++;
    state.score += 10;
    SFX.hit();
    rec.mole.classList.add('hit');
    const fb = rec.hole.querySelector('.feedback');
    fb.textContent = ['💥','✨','💯','🎉'][Math.floor(Math.random()*4)];
    fb.classList.remove('show');
    void fb.offsetWidth;
    fb.classList.add('show');
    setTimeout(() => {
        rec.mole.remove();
        state.moles.delete(rec.hole.dataset.idx);
    }, 400);
    updateHud();
}

// ============================================================
// HUD & Timer
// ============================================================
function updateHud() {
    document.getElementById('hud-score').textContent = '⭐ ' + state.score;
    const t = document.getElementById('hud-time');
    t.textContent = '⏱️ ' + state.timeLeft;
    if (state.timeLeft <= 10) t.classList.add('warning');
    else t.classList.remove('warning');
}

// ============================================================
// Countdown / Start
// ============================================================
function showCountdown(callback) {
    const seq = ['3', '2', '1', '開始！'];
    let i = 0;
    function step() {
        const c = document.createElement('div');
        c.className = 'countdown';
        c.textContent = seq[i];
        document.body.appendChild(c);
        SFX.tick();
        setTimeout(() => c.remove(), 900);
        i++;
        if (i < seq.length) {
            setTimeout(step, 900);
        } else {
            setTimeout(callback, 900);
        }
    }
    step();
}

function startGame(mode) {
    state.mode = mode;
    state.score = 0;
    state.hits = 0;
    state.misses = 0;
    state.timeLeft = 60;
    state.elapsed = 0;
    state.moles.clear();

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    document.getElementById('hud-mode').textContent = MODE_LABELS[mode];
    document.getElementById('hud-mode').classList.remove('warning');
    document.getElementById('hud-time').classList.remove('warning');

    buildField();
    updateHud();
    updateHintBar();
    getAudio();

    showCountdown(() => {
        state.playing = true;
        // Spawn loop: starts slow, accelerates
        function scheduleNext() {
            if (!state.playing) return;
            const progress = Math.min(1, state.elapsed / 50);
            const interval = 1400 - progress * 600;
            state.spawnTimer = setTimeout(() => {
                spawnMole();
                scheduleNext();
            }, interval);
        }
        spawnMole();
        scheduleNext();

        state.countdownTimer = setInterval(() => {
            state.timeLeft--;
            state.elapsed++;
            if (state.timeLeft <= 5 && state.timeLeft > 0) SFX.tick();
            if (state.timeLeft <= 0) {
                endGame();
                return;
            }
            updateHud();
        }, 1000);
    });
}

function updateHintBar() {
    const bar = document.getElementById('hint-bar');
    if (state.mode === 'number') {
        bar.innerHTML = '💡 看到地鼠 → 按上面那排數字 <span class="key-icon">1</span>～<span class="key-icon">9</span>';
    } else if (state.mode === 'arrow') {
        bar.innerHTML = '💡 看到地鼠 → 按方向鍵 <span class="key-icon">↑</span><span class="key-icon">↓</span><span class="key-icon">←</span><span class="key-icon">→</span>';
    } else {
        bar.innerHTML = '💡 看到地鼠 → 按字母鍵 <span class="key-icon">A</span>～<span class="key-icon">Z</span>（大小寫都可以）';
    }
}

// ============================================================
// End
// ============================================================
function endGame() {
    state.playing = false;
    clearTimeout(state.spawnTimer);
    clearInterval(state.countdownTimer);
    state.moles.forEach(rec => rec.mole.remove());
    state.moles.clear();

    try {
        const prev = parseInt(localStorage.getItem('edtech-unit4-score') || '0', 10);
        if (state.score > prev) localStorage.setItem('edtech-unit4-score', state.score);
    } catch (e) { /* localStorage unavailable */ }

    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.remove('hidden');

    const total = state.hits + state.misses;
    const accuracy = total > 0 ? Math.round((state.hits / total) * 100) : 100;

    document.getElementById('cert-score').textContent = state.score;
    document.getElementById('cert-hits').textContent = state.hits;
    document.getElementById('cert-acc').textContent = accuracy;
    document.getElementById('cert-mode').textContent = `鍵盤打地鼠 · ${MODE_LABELS[state.mode]}`;

    const today = new Date();
    document.getElementById('cert-date').textContent =
        `${today.getFullYear() - 1911} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日 頒發`;

    SFX.win();

    if (state.score >= 200 && accuracy >= 80) {
        document.getElementById('cert-trophy').textContent = '👑';
        document.getElementById('cert-rank').textContent = '🏆 稱號：黃金鍵盤大師';
    } else if (state.score >= 120) {
        document.getElementById('cert-trophy').textContent = '🥇';
        document.getElementById('cert-rank').textContent = '🥇 稱號：神速鍵盤勇者';
    } else if (state.score >= 50) {
        document.getElementById('cert-trophy').textContent = '🥈';
        document.getElementById('cert-rank').textContent = '🥈 稱號：鍵盤小學徒';
    } else {
        document.getElementById('cert-trophy').textContent = '💪';
        document.getElementById('cert-rank').textContent = '🥉 稱號：努力小新手';
    }
}

// ============================================================
// Listeners
// ============================================================
document.addEventListener('keydown', handleKey);

// Prevent space/arrow scrolling during play
document.addEventListener('keydown', (e) => {
    if (state.playing && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
        e.preventDefault();
    }
});
</script>
