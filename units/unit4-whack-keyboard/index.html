<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鍵盤怪獸冒冒頭 - 打字島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@500;600&display=swap">
  <link rel="stylesheet" href="../../assets/css/typing-island.css">
  <style>
    /* =====================================================================
       鍵盤怪獸冒冒頭 — 繪本剪紙風場景樣式（所有 class 一律使用 sc- 前綴）
       ===================================================================== */
    .sc-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      user-select: none;
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      color: var(--ink-1, #3B2A20);
      background: linear-gradient(180deg, #E2F1FA 0%, #F4F5E8 58%, #CBE5B3 58%, #9FD183 100%);
    }

    /* 暫停時凍結一切 CSS 動態，確保畫面完全靜止 */
    .sc-stage.sc-paused *,
    .sc-stage.sc-paused *::before,
    .sc-stage.sc-paused *::after {
      animation-play-state: paused !important;
      transition: none !important;
    }

    /* 背景裝飾圖層（剪紙天空、雲朵、小丘、草地） */
    .sc-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .sc-bg svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 細緻紙紋點點感（極淡不影響對比） */
    .sc-paper-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image: radial-gradient(rgba(94, 72, 56, 0.16) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    /* 左上角小紙片標示（溫和引導） */
    .sc-badge-tip {
      position: absolute;
      top: 10px;
      left: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--card, #FFF8E6);
      border: 2px solid var(--kraft, #E4CC9C);
      border-radius: 10px 14px 8px 12px;
      box-shadow: var(--sh, 0 3px 0 rgba(94, 72, 56, 0.14));
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-2, #5E4838);
      pointer-events: none;
      z-index: 8;
    }
    .sc-badge-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--sky-dk, #1F6B9C);
      flex: none;
    }

    /* 右上角：怪獸大王血條卡片 */
    .sc-boss-card {
      position: absolute;
      top: 10px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px 7px 9px;
      background: var(--card, #FFF8E6);
      border: 2.5px solid var(--kraft-2, #C9A66B);
      border-radius: 14px 10px 16px 10px;
      box-shadow: var(--sh, 0 4px 0 rgba(94, 72, 56, 0.16));
      z-index: 12;
      min-width: 226px;
      pointer-events: none;
    }
    .sc-boss-avatar {
      width: 42px;
      height: 42px;
      border-radius: 10px 12px 8px 11px;
      background: var(--butter-soft, #FFF1B8);
      border: 2px solid var(--kraft, #E4CC9C);
      display: grid;
      place-items: center;
      flex: none;
      overflow: hidden;
    }
    .sc-boss-avatar svg {
      width: 38px;
      height: 38px;
    }
    .sc-boss-info {
      flex: 1;
      min-width: 150px;
    }
    .sc-boss-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .sc-boss-name {
      font-size: 14px;
      font-weight: 900;
      color: var(--ink-1, #3B2A20);
      white-space: nowrap;
    }
    .sc-boss-hp-text {
      font-family: 'Fredoka', 'Bahnschrift', sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      font-weight: 600;
      color: var(--berry-dk, #B3262B);
    }
    .sc-boss-bar-bg {
      width: 100%;
      height: 11px;
      border-radius: 999px;
      background: var(--card-2, #FDF1D8);
      border: 2px solid var(--kraft-2, #C9A66B);
      overflow: hidden;
    }
    .sc-boss-bar-fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--berry, #E5484D), var(--peach, #FF9E7A));
      transform-origin: left center;
    }

    /* 大王投降揮白旗小舞台（放在右上血條下方，不遮擋下方木牌字） */
    .sc-boss-surrender {
      position: absolute;
      top: 70px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px 6px 8px;
      background: var(--butter-soft, #FFF1B8);
      border: 2.5px solid var(--peach-dk, #D9531F);
      border-radius: 14px 8px 14px 12px;
      box-shadow: 0 4px 0 rgba(94, 72, 56, 0.16);
      z-index: 16;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-6px) scale(0.95);
    }
    .sc-boss-surrender-svg {
      width: 58px;
      height: 46px;
      flex: none;
    }
    .sc-boss-surrender-msg {
      font-size: 14px;
      font-weight: 900;
      color: var(--ink-1, #3B2A20);
      line-height: 1.25;
    }
    .sc-boss-surrender-sub {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--leaf-dk, #2D7A38);
    }

    /* 土洞排與角色層 */
    .sc-holes-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* 單一土洞定位容器 */
    .sc-hole-slot {
      position: absolute;
      bottom: 14px;
      height: 224px;
      pointer-events: none;
    }

    /* 土洞後壁（深土洞凹槽） */
    .sc-hole-back {
      position: absolute;
      left: 50%;
      bottom: 4px;
      transform: translateX(-50%);
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 62%, #473222 0%, #6A4B34 74%, #825E41 100%);
      border: 3px solid #593E2A;
      box-shadow: inset 0 6px 8px rgba(32, 20, 12, 0.45);
      z-index: 1;
    }

    /* 洞口上方裁切盒：讓怪獸真的從洞裡冒出與縮回，同時左右足夠寬不裁切木牌 */
    .sc-hole-clip {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      height: 206px;
      overflow: hidden;
      z-index: 2;
    }

    /* 土洞前唇草緣（蓋在裁切盒底緣，做出剪紙前後層次） */
    .sc-hole-front {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      height: 22px;
      pointer-events: none;
      z-index: 4;
    }
    .sc-hole-front svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 怪獸與舉牌組件 */
    .sc-monster-unit {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 144px;
      margin-left: -72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: center bottom;
      will-change: transform, opacity;
    }

    /* 預備怪獸：較樸素、略透明 */
    .sc-monster-unit.sc-is-peek {
      opacity: 0.78;
    }

    /* 木牌外框（目前目標用天藍粗框＋天藍虛線瞄準圈） */
    .sc-sign-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: -10px;
      z-index: 3;
    }

    .sc-sign {
      position: relative;
      min-width: 82px;
      height: 70px;
      padding: 0 12px;
      border-radius: 12px 16px 10px 14px;
      background: var(--card, #FFF8E6);
      border: 3.5px solid var(--sky-dk, #1F6B9C);
      box-shadow: 0 4px 0 rgba(31, 107, 156, 0.28), inset 0 -4px 0 var(--card-2, #FDF1D8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--ink-1, #3B2A20);
      line-height: 1;
    }

    /* 目前目標的天藍虛線瞄準圈 */
    .sc-is-active .sc-sign::after {
      content: '';
      position: absolute;
      inset: -8px;
      border: 3px dashed var(--sky-dk, #1F6B9C);
      border-radius: 17px 21px 15px 19px;
      pointer-events: none;
    }

    /* 預備目標的樸素木牌 */
    .sc-is-peek .sc-sign {
      min-width: 60px;
      height: 46px;
      padding: 0 10px;
      background: var(--card-2, #FDF1D8);
      border: 2px solid var(--kraft-2, #C9A66B);
      box-shadow: 0 2px 0 rgba(94, 72, 56, 0.14);
    }

    .sc-peek-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-3, #74604E);
      background: var(--paper, #F7E8CB);
      border: 1.5px solid var(--kraft, #E4CC9C);
      border-radius: 8px;
      padding: 1px 6px;
      margin-bottom: 3px;
    }

    /* 木牌上的主要字元：英打用 Fredoka / monospace ≥ 44px，國字用 --f-zh */
    .sc-char {
      font-family: var(--f-zh, 'Noto Sans TC', sans-serif);
      font-size: 46px;
      font-weight: 700;
      color: var(--ink-1, #3B2A20);
      letter-spacing: 0;
    }
    .sc-stage.sc-lang-en .sc-char {
      font-family: 'Fredoka', Consolas, monospace;
      font-size: 48px;
      font-weight: 600;
    }
    .sc-is-peek .sc-char {
      font-size: 28px;
    }
    .sc-stage.sc-lang-en .sc-is-peek .sc-char {
      font-size: 30px;
    }

    /* 空白鍵專屬樣式（寫「空白鍵」三個字＋下方小 ␣ 提示） */
    .sc-sign.sc-space-sign {
      min-width: 112px;
      padding: 0 10px;
    }
    .sc-stage.sc-lang-en .sc-sign.sc-space-sign .sc-char,
    .sc-sign.sc-space-sign .sc-char {
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .sc-space-glyph {
      font-family: 'Fredoka', Consolas, monospace;
      font-size: 15px;
      font-weight: 600;
      color: var(--sky-dk, #1F6B9C);
      margin-top: 2px;
      line-height: 1;
    }
    .sc-is-peek .sc-sign.sc-space-sign {
      min-width: 78px;
    }
    .sc-stage.sc-lang-en .sc-is-peek .sc-sign.sc-space-sign .sc-char,
    .sc-is-peek .sc-sign.sc-space-sign .sc-char {
      font-size: 16px;
    }
    .sc-is-peek .sc-space-glyph {
      font-size: 12px;
      color: var(--ink-3, #74604E);
    }

    /* 木牌下方的迷你倒數條 */
    .sc-timer-track {
      width: 78px;
      height: 8px;
      margin-top: 10px;
      border-radius: 999px;
      background: var(--card-2, #FDF1D8);
      border: 1.5px solid var(--kraft-2, #C9A66B);
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(59, 42, 32, 0.14);
    }
    .sc-timer-fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: var(--leaf, #7CCB6F);
      transform-origin: left center;
    }
    .sc-timer-fill.sc-warn {
      background: var(--peach-dk, #D9531F);
    }
    .sc-timer-fill.sc-danger {
      background: var(--berry, #E5484D);
    }

    /* 小怪獸 SVG 身體容器 */
    .sc-monster-body {
      width: 88px;
      height: 76px;
      transform-origin: center bottom;
      position: relative;
      z-index: 2;
    }
    .sc-monster-body svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* 狀態眼睛／舌頭開關（依 class 切換 SVG 內部群組） */
    .sc-eye-blink,
    .sc-eye-dizzy,
    .sc-tongue {
      display: none;
    }
    .sc-state-miss .sc-eye-normal { display: none; }
    .sc-state-miss .sc-eye-blink { display: block; }
    .sc-state-hit .sc-eye-normal { display: none; }
    .sc-state-hit .sc-eye-dizzy { display: block; }
    .sc-state-steal .sc-tongue { display: block; }

    /* 左下角小狐狸（打字島島主）與紙槌 */
    .sc-fox-wrap {
      position: absolute;
      left: 14px;
      bottom: 10px;
      width: 112px;
      height: 116px;
      z-index: 10;
      pointer-events: none;
      transform-origin: center bottom;
    }
    .sc-fox-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* 特效圖層（星星、+1、橡果、打錯「？」小貼紙） */
    .sc-fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }
    .sc-fx-pop {
      position: absolute;
      font-weight: 900;
      font-size: 20px;
      white-space: nowrap;
      padding: 2px 9px;
      border-radius: 10px;
      border: 2px solid transparent;
      box-shadow: 0 2px 0 rgba(59, 42, 32, 0.14);
      transform: translate(-50%, -50%);
      will-change: transform, opacity;
    }
    .sc-fx-pop.sc-fx-ok {
      background: #E8F7E2;
      border-color: var(--leaf-dk, #2D7A38);
      color: var(--leaf-dk, #2D7A38);
    }
    .sc-fx-pop.sc-fx-steal {
      background: #FFD9D6;
      border-color: var(--berry-dk, #B3262B);
      color: var(--berry-dk, #B3262B);
      font-size: 15px;
    }
    .sc-fx-pop.sc-fx-miss {
      background: var(--butter-soft, #FFF1B8);
      border-color: var(--kraft-2, #C9A66B);
      color: var(--ink-1, #3B2A20);
      font-size: 16px;
    }
    .sc-fx-pop.sc-fx-boss {
      background: var(--butter-soft, #FFF1B8);
      border-color: var(--peach-dk, #D9531F);
      color: var(--peach-dk, #D9531F);
      font-size: 16px;
    }

    .sc-fx-star,
    .sc-fx-acorn {
      position: absolute;
      transform: translate(-50%, -50%);
      will-change: transform, opacity;
    }

    /* 尊重減少動態設定：停用所有非必要過渡 */
    @media (prefers-reduced-motion: reduce) {
      .sc-stage * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head><body>
  <script src="../../assets/typing/passages.js"></script>
  <script src="../../assets/typing/en-items.js"></script>
  <script src="../../assets/js/typing-core.js"></script>
  <script src="../../assets/js/typing-ui.js"></script>
  <script>
    /* =====================================================================
       集中管理本關場景參數（難度、時間、血量、色票）
       ===================================================================== */
    var SCENE_CONFIG = {
      // 各難度土洞數量（橫排置中、依 clientWidth 等分）
      HOLES: { t1: 5, t2: 7, t3: 9 },
      // 怪獸冒頭後的逾時秒數（超過就吐舌頭偷走橡果並扣愛心）
      TIMEOUT_SEC: { t1: 6.0, t2: 4.5, t3: 3.5 },
      // 怪獸大王血量（每打對 1 字扣 1）
      BOSS_HP: { t1: 20, t2: 30, t3: 40 },
      // 大王血量歸零後的投降揮白旗秒數
      BOSS_SURRENDER_SEC: 1.5,
      // 動畫時間與數值上限（皆由 requestAnimationFrame 的 dt 驅動）
      ANIM: {
        MAX_DT: 0.1,
        POP_UP_SEC: 0.22,
        PEEK_UP_SEC: 0.25,
        HIDE_HIT_SEC: 0.26,
        HIDE_STEAL_SEC: 0.62,
        MISS_TILT_SEC: 0.36,
        FOX_SWING_SEC: 0.32,
        POP_TEXT_SEC: 0.72,
        STAR_SEC: 0.56,
        ACORN_SEC: 0.58,
        // 旗幟擺動頻率（Hz）：1.4 次/秒，嚴格低於護眼上限 3 次/秒
        FLAG_WAVE_HZ: 1.4
      },
      // 繪本剪紙風小怪獸柔和色系（不刺眼、低飽和）
      MONSTER_PALETTES: [
        { body: '#8AC98A', belly: '#DDF1D6', cheek: '#F6B1A8', horn: '#5B9A5D' },
        { body: '#88C4DC', belly: '#DCF0F8', cheek: '#F6B1A8', horn: '#4F8EA9' },
        { body: '#F2A98A', belly: '#FCE4D8', cheek: '#E57B7B', horn: '#D97B55' },
        { body: '#C6A8DC', belly: '#EFE4F8', cheek: '#F3A8B8', horn: '#8E6FA8' }
      ],
      // 輪替登場的怪獸大王主題
      BOSS_THEMES: [
        { name: '蓬蓬大王', body: '#8AC98A', crown: '#FFD966', accent: '#2D7A38' },
        { name: '泡泡大王', body: '#88C4DC', crown: '#FF9E7A', accent: '#1F6B9C' },
        { name: '栗子大王', body: '#D99E73', crown: '#FFD966', accent: '#9B582C' },
        { name: '莓果大王', body: '#D98CA8', crown: '#FFF1B8', accent: '#B3262B' }
      ]
    };

    TypingIsland.mount({
      unit: 4,
      title: '鍵盤怪獸冒冒頭',
      subtitle: '怪獸對打・英打入門',
      langs: ['en'],
      homeUrl: '../../index.html',
      scene: function (api) {
        var field = api.field;

        // 偵測 prefers-reduced-motion，並支援動態切換
        var motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
        var reducedMotion = motionQuery ? motionQuery.matches : false;
        if (motionQuery && motionQuery.addEventListener) {
          motionQuery.addEventListener('change', function (e) { reducedMotion = e.matches; });
        }

        // 執行控制（全場景零 setTimeout / setInterval，全由單一 rAF 驅動）
        var running = false;
        var rafId = 0;
        var lastTime = 0;
        var elapsed = 0;

        // 場景 DOM 參考
        var stageEl = null;
        var holesLayerEl = null;
        var fxLayerEl = null;
        var bossAvatarEl = null;
        var bossNameEl = null;
        var bossHpTextEl = null;
        var bossBarFillEl = null;
        var bossSurrenderEl = null;
        var bossFlagGroup = null;
        var bossSurrenderAvatarGroup = null;
        var foxWrapEl = null;
        var foxMalletGroup = null;

        // 洞口資料與尺寸快取
        var holes = [];
        var holeCount = 5;
        var lastFieldW = 0;
        var lastFieldH = 0;

        // 怪獸狀態（目前主怪獸、預備怪獸、以及正在縮回洞的離場怪獸陣列）
        var active = null;   // { key, holeIdx, item, paletteIdx, age, missTimer, el, bodyEl, timerFillEl }
        var peek = null;     // { key, holeIdx, item, paletteIdx, age, el }
        var ghosts = [];     // [{ holeIdx, mode:'hit'|'steal', t, dur, startY, el }]
        var fxList = [];     // [{ type:'pop'|'star'|'acorn', el, t, dur, x, y, vx, vy, tx, ty, rot, vrot }]
        var lastActiveHole = -1;
        var paletteCursor = 0;

        // 小狐狸揮槌動畫計時（0 表示閒置）
        var foxSwingT = 0;

        // 怪獸大王狀態
        var bossIndex = 0;
        var bossMaxHp = 20;
        var bossHp = 20;
        var bossSurrenderT = 0; // > 0 代表正在舉白旗投降中

        /* ---------------- 工具函式 ---------------- */

        function getTier() {
          var t = (api.settings && api.settings.tier) || 't1';
          return SCENE_CONFIG.HOLES[t] ? t : 't1';
        }

        function getTimeoutSec() {
          return SCENE_CONFIG.TIMEOUT_SEC[getTier()];
        }

        function getBossMaxHp() {
          return SCENE_CONFIG.BOSS_HP[getTier()];
        }

        function itemKey(u) {
          return u ? (u.passageIndex + ':' + u.index) : '';
        }

        // 顯示字元統一走 display；空白字元顯示「空白鍵」三個字＋小 ␣ 提示
        function formatDisplay(u) {
          if (!u) return { text: '', isSpace: false };
          var raw = (u.display !== undefined && u.display !== null) ? String(u.display) : '';
          if (raw === ' ' || raw === '\u2423') {
            return { text: '空白鍵', isSpace: true };
          }
          return { text: raw, isSpace: false };
        }

        // 隨機選一個不在排除名單裡的洞（保證不連續同洞、也不撞預備洞）
        function pickHole(excludeList) {
          var candidates = [];
          for (var i = 0; i < holeCount; i++) {
            if (excludeList.indexOf(i) === -1) candidates.push(i);
          }
          if (!candidates.length) {
            for (var j = 0; j < holeCount; j++) {
              if (j !== excludeList[0]) candidates.push(j);
            }
          }
          if (!candidates.length) return 0;
          return candidates[Math.floor(Math.random() * candidates.length)];
        }

          var idx = paletteCursor % SCENE_CONFIG.MONSTER_PALETTES.length;

        // 依當前難度重新建立 5 / 7 / 9 個土洞
        function rebuildHoles() {
          holeCount = SCENE_CONFIG.HOLES[getTier()];
          holesLayerEl.innerHTML = '';
          holes = [];
          for (var i = 0; i < holeCount; i++) {
            var slot = document.createElement('div');
            slot.className = 'sc-hole-slot';
            slot.innerHTML =
              '<div class="sc-hole-back"></div>' +
              '<div class="sc-hole-clip"></div>' +
              '<div class="sc-hole-front">' + buildHoleFrontSVG() + '</div>';
            holesLayerEl.appendChild(slot);
            holes.push({
              index: i,
              slotEl: slot,
              backEl: slot.querySelector('.sc-hole-back'),
              clipEl: slot.querySelector('.sc-hole-clip'),
              frontEl: slot.querySelector('.sc-hole-front'),
              cx: 0
            });
          }
          layout();
        }

        // 用 api.field.clientWidth / clientHeight 動態等分並橫排置中所有土洞（不寫死寬高）
        function layout() {
          if (!stageEl || !holes.length) return;
          var w = field.clientWidth || 1000;
          var h = field.clientHeight || 300;
          lastFieldW = w;
          lastFieldH = h;

          // 同步語言 class（英打套用 Fredoka / monospace）
          var isEn = api.settings && api.settings.lang === 'en';
          stageEl.classList.toggle('sc-lang-en', !!isEn);

          // 左右留白對稱，確保一排土洞橫排置中且左下角小狐狸不擋洞口
          var sideMargin = Math.max(96, Math.min(156, w * 0.115));
          var usableW = Math.max(240, w - sideMargin * 2);
          var step = usableW / holeCount;
          var holeW = Math.max(64, Math.min(108, step * 0.82));
          var clipW = Math.max(holeW + 44, 152);

          // 若場地高度偏低，微調底部邊距讓木牌完全不頂到上方
          var bottomOffset = Math.max(8, Math.min(16, Math.round(h * 0.048)));
          var clipH = Math.max(176, Math.min(208, h - 78));

          for (var i = 0; i < holes.length; i++) {
            var cx = sideMargin + step * (i + 0.5);
            var hl = holes[i];
            hl.cx = cx;
            hl.slotEl.style.left = cx + 'px';
            hl.slotEl.style.width = clipW + 'px';
            hl.slotEl.style.marginLeft = (-clipW / 2) + 'px';
            hl.slotEl.style.bottom = bottomOffset + 'px';

            hl.backEl.style.width = holeW + 'px';
            hl.frontEl.style.width = (holeW + 8) + 'px';
            hl.clipEl.style.width = clipW + 'px';
            hl.clipEl.style.height = clipH + 'px';
          }

          // 左下角小狐狸依寬高柔和縮放，確保窄視窗也不遮擋第一洞
          var foxScale = Math.max(0.72, Math.min(1.0, Math.min(w / 1100, h / 285)));
          foxWrapEl.style.transform = 'scale(' + foxScale.toFixed(3) + ')';
        }

        /* ---------------- 怪獸大王血條與投降更新 ---------------- */

        function renderBossUI() {
          var theme = SCENE_CONFIG.BOSS_THEMES[bossIndex % SCENE_CONFIG.BOSS_THEMES.length];
          var ratio = bossMaxHp > 0 ? Math.max(0, bossHp / bossMaxHp) : 0;
          bossNameEl.textContent = theme.name;
          bossHpTextEl.textContent = Math.max(0, bossHp) + ' / ' + bossMaxHp;
          bossBarFillEl.style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
          bossAvatarEl.innerHTML = buildBossAvatarSVG(theme, bossSurrenderT > 0);
        }

        function triggerBossSurrender() {
          var theme = SCENE_CONFIG.BOSS_THEMES[bossIndex % SCENE_CONFIG.BOSS_THEMES.length];
          bossSurrenderT = SCENE_CONFIG.BOSS_SURRENDER_SEC;
          bossSurrenderAvatarGroup.innerHTML = buildSurrenderSVG(theme);
          bossFlagGroup = bossSurrenderAvatarGroup.querySelector('.sc-flag-group');
          bossSurrenderEl.style.opacity = '1';
          bossSurrenderEl.style.transform = 'translateY(0) scale(1)';
          renderBossUI();
        }

        function finishBossSurrender() {
          bossSurrenderT = 0;
          bossSurrenderEl.style.opacity = '0';
          bossSurrenderEl.style.transform = 'translateY(-6px) scale(0.95)';
          bossIndex = (bossIndex + 1) % SCENE_CONFIG.BOSS_THEMES.length;
          bossMaxHp = getBossMaxHp();
          bossHp = bossMaxHp;
          renderBossUI();
          spawnPopText((field.clientWidth || 1000) - 130, 82, '新大王登場！', 'sc-fx-boss');
        }

          var info = formatDisplay(u);
          var unit = document.createElement('div');
          unit.className = 'sc-monster-unit ' + (isActive ? 'sc-is-active' : 'sc-is-peek');

          var signWrap = document.createElement('div');
          signWrap.className = 'sc-sign-wrap';

          if (!isActive) {
            var tag = document.createElement('div');
            tag.className = 'sc-peek-tag';
            tag.textContent = '下一個';
            signWrap.appendChild(tag);
          }

          var sign = document.createElement('div');
          sign.className = 'sc-sign' + (info.isSpace ? ' sc-space-sign' : '');

          var chSpan = document.createElement('span');
          chSpan.className = 'sc-char';
          chSpan.textContent = info.text;
          sign.appendChild(chSpan);

          if (info.isSpace) {
            var g = document.createElement('span');
            g.className = 'sc-space-glyph';
            g.textContent = '␣';
            sign.appendChild(g);
          }
          signWrap.appendChild(sign);

          var timerFillEl = null;
          if (isActive) {
            var track = document.createElement('div');
            track.className = 'sc-timer-track';
            timerFillEl = document.createElement('div');
            timerFillEl.className = 'sc-timer-fill';
            track.appendChild(timerFillEl);
            signWrap.appendChild(track);
          }

          var body = document.createElement('div');
          body.className = 'sc-monster-body';
          body.innerHTML = buildMonsterSVG(paletteIdx);

          unit.appendChild(signWrap);
          unit.appendChild(body);

          return { el: unit, bodyEl: body, timerFillEl: timerFillEl };
        }

        // 把目前主怪獸轉為離場演出（被打中縮回或偷橡果縮回），不阻塞新怪獸冒出
        function sendActiveToGhost(mode) {
          if (!active) return;
          var old = active;
          active = null;
          old.el.classList.remove('sc-is-active');
          if (mode === 'hit') {
            old.el.classList.add('sc-state-hit');
          } else if (mode === 'steal') {
            old.el.classList.add('sc-state-steal');
          }
          // 離場時隱藏天藍瞄準外框與倒數條，視覺立刻交棒給下一個目標
          var sign = old.el.querySelector('.sc-sign');
          if (sign) sign.style.opacity = '0.4';
          var track = old.el.querySelector('.sc-timer-track');
          if (track) track.style.visibility = 'hidden';

          ghosts.push({
            holeIdx: old.holeIdx,
            mode: mode,
            t: 0,
            dur: mode === 'hit' ? SCENE_CONFIG.ANIM.HIDE_HIT_SEC : SCENE_CONFIG.ANIM.HIDE_STEAL_SEC,
            el: old.el
          });
        }

        function clearPeek() {
          if (peek) {
            peek.el.remove();
            peek = null;
          }
        }

        function clearAllEntities() {
          if (active) { active.el.remove(); active = null; }
          clearPeek();
          while (ghosts.length) ghosts.pop().el.remove();
          while (fxList.length) fxList.pop().el.remove();
          foxSwingT = 0;
          if (foxMalletGroup) foxMalletGroup.style.transform = '';
          if (foxWrapEl) foxWrapEl.style.bottom = '10px';
        }

        // 依 api.upcoming(2) 同步主怪獸與預備怪獸
        function syncTargets(preferHoleIdx, preferPaletteIdx) {
          var list = api.upcoming(2) || [];
          var u0 = list[0] || null;
          var u1 = list[1] || null;

          // 1) 對齊目前主怪獸
          if (!u0) {
            if (active) { active.el.remove(); active = null; }
            clearPeek();
            return;
          }

          var k0 = itemKey(u0);
          if (!active || active.key !== k0) {
            if (active) { active.el.remove(); active = null; }

            var targetHole = (typeof preferHoleIdx === 'number' && preferHoleIdx >= 0 && preferHoleIdx < holeCount && preferHoleIdx !== lastActiveHole)
              ? preferHoleIdx
              : pickHole([lastActiveHole]);
            var pal = (typeof preferPaletteIdx === 'number') ? preferPaletteIdx : nextPaletteIdx();
            var built = createMonsterUnit(u0, true, pal);
            holes[targetHole].clipEl.appendChild(built.el);

            // 初始位置（reduced-motion 採淡入、正常模式從洞裡冒出）
            if (reducedMotion) {
              built.el.style.transform = 'translateY(0px)';
              built.el.style.opacity = '0';
            } else {
              built.el.style.transform = 'translateY(148px)';
              built.el.style.opacity = '1';
            }

            active = {
              key: k0,
              holeIdx: targetHole,
              item: u0,
              paletteIdx: pal,
              age: 0,
              missTimer: 0,
              el: built.el,
              bodyEl: built.bodyEl,
              timerFillEl: built.timerFillEl
            };
            lastActiveHole = targetHole;
          }

          // 2) 對齊旁邊洞的預備怪獸（露半顆頭＋淡淡顯示下一個字母）
          if (!u1) {
            clearPeek();
            return;
          }
          var k1 = itemKey(u1);
          if (!peek || peek.key !== k1 || peek.holeIdx === active.holeIdx) {
            clearPeek();
            var exclude = [active.holeIdx];
            if (ghosts.length) exclude.push(ghosts[ghosts.length - 1].holeIdx);
            var peekHole = pickHole(exclude);
            var peekPal = nextPaletteIdx();
            var pBuilt = createMonsterUnit(u1, false, peekPal);
            holes[peekHole].clipEl.appendChild(pBuilt.el);

            if (reducedMotion) {
              pBuilt.el.style.transform = 'translateY(62px)';
              pBuilt.el.style.opacity = '0';
            } else {
              pBuilt.el.style.transform = 'translateY(130px)';
              pBuilt.el.style.opacity = '0.78';
            }

            peek = {
              key: k1,
              holeIdx: peekHole,
              item: u1,
              paletteIdx: peekPal,
              age: 0,
              el: pBuilt.el
            };
          }
        }

        /* ---------------- 特效產生器（全由 rAF 更新，不用 setTimeout） ---------------- */

        function spawnPopText(x, y, text, cls) {
          var el = document.createElement('div');
          el.className = 'sc-fx-pop ' + cls;
          el.textContent = text;
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          fxLayerEl.appendChild(el);
          fxList.push({
            type: 'pop',
            el: el,
            t: 0,
            dur: SCENE_CONFIG.ANIM.POP_TEXT_SEC,
            x: x,
            y: y,
            vy: reducedMotion ? 0 : -46
          });
        }

        function spawnHitStars(cx, cy) {
          if (reducedMotion) return;
          var colors = ['#FFD966', '#7CCB6F', '#FF9E7A', '#88C4DC'];
          for (var i = 0; i < 5; i++) {
            var el = document.createElement('div');
            el.className = 'sc-fx-star';
            el.innerHTML = buildStarSVG(colors[i % colors.length]);
            fxLayerEl.appendChild(el);
            var angle = (-Math.PI * 0.85) + (i / 4) * (Math.PI * 0.7);
            var speed = 78 + (i % 2) * 32;
            fxList.push({
              type: 'star',
              el: el,
              t: 0,
              dur: SCENE_CONFIG.ANIM.STAR_SEC,
              x: cx,
              y: cy,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 22,
              rot: 0,
              vrot: (i % 2 === 0 ? 1 : -1) * 180
            });
          }
        }

        function spawnStolenAcorn(holeCx, fieldH) {
          var startX = Math.max(80, holeCx - 58);
          var startY = fieldH - 118;
          var targetX = holeCx;
          var targetY = fieldH - 54;

          var el = document.createElement('div');
          el.className = 'sc-fx-acorn';
          el.innerHTML = buildAcornSVG();
          fxLayerEl.appendChild(el);
          fxList.push({
            type: 'acorn',
            el: el,
            t: 0,
            dur: SCENE_CONFIG.ANIM.ACORN_SEC,
            x: startX,
            y: startY,
            tx: targetX,
            ty: targetY
          });
        }

        /* ---------------- 主動畫迴圈（rAF + dt <= 0.1s） ---------------- */

        function tick(now) {
          if (!running) return;
          var dt = Math.min((now - lastTime) / 1000, SCENE_CONFIG.ANIM.MAX_DT);
          if (dt < 0) dt = 0;
          lastTime = now;
          elapsed += dt;

          // 若容器尺寸變動（例如字體或視窗重排），自動重新等分洞位
          if (field.clientWidth && (field.clientWidth !== lastFieldW || field.clientHeight !== lastFieldH)) {
            layout();
          }

          // 1) 更新目前主怪獸（冒出動畫、倒數條、逾時反擊、打錯歪頭）
          if (active) {
            active.age += dt;
            var popDur = SCENE_CONFIG.ANIM.POP_UP_SEC;
            var popP = Math.min(1, active.age / popDur);
            // 平滑緩出曲線
            var easeOut = 1 - Math.pow(1 - popP, 3);

            if (reducedMotion) {
              active.el.style.transform = 'translateY(0px)';
              active.el.style.opacity = popP.toFixed(3);
            } else {
              var bob = popP >= 1 ? Math.sin(elapsed * 4.2) * 2.2 : 0;
              var y = (1 - easeOut) * 148 + bob;
              active.el.style.transform = 'translateY(' + y.toFixed(1) + 'px)';
              active.el.style.opacity = '1';
            }

            // 打錯歪頭眨眼回饋（不晃動全場、reduced-motion 只眨眼不歪頭）
            if (active.missTimer > 0) {
              active.missTimer = Math.max(0, active.missTimer - dt);
              var mp = 1 - (active.missTimer / SCENE_CONFIG.ANIM.MISS_TILT_SEC);
              if (!reducedMotion) {
                var tiltDeg = Math.sin(mp * Math.PI * 2) * 11 * (1 - mp * 0.4);
                active.bodyEl.style.transform = 'rotate(' + tiltDeg.toFixed(1) + 'deg)';
              }
              if (active.missTimer <= 0) {
                active.el.classList.remove('sc-state-miss');
                active.bodyEl.style.transform = '';
              }
            }

            // 更新木牌下方倒數條
            var limit = getTimeoutSec();
            var remainRatio = Math.max(0, 1 - (active.age / limit));
            active.timerFillEl.style.transform = 'scaleX(' + remainRatio.toFixed(4) + ')';
            active.timerFillEl.classList.toggle('sc-warn', remainRatio <= 0.38 && remainRatio > 0.18);
            active.timerFillEl.classList.toggle('sc-danger', remainRatio <= 0.18);

            // 太慢逾時：吐舌頭偷走一顆橡果、扣一顆愛心，同一個字換別的洞重新冒出
            if (active.age >= limit) {
              var stealHole = active.holeIdx;
              var sameItem = active.item;
              var samePal = active.paletteIdx;
              var stealX = holes[stealHole] ? holes[stealHole].cx : (field.clientWidth * 0.5);
              var fh = field.clientHeight || 300;

              sendActiveToGhost('steal');
              spawnStolenAcorn(stealX, fh);
              spawnPopText(stealX, Math.max(82, fh - 178), '✗ 偷走橡果！', 'sc-fx-steal');

              api.loseLife();

              // 若愛心扣完共用程式已暫停，不再生成新怪獸
              if (!running) return;

              // 同一個字換另一個洞重新冒出（避開剛才那個洞與預備洞）
              var excludeHoles = [stealHole];
              if (peek) excludeHoles.push(peek.holeIdx);
              var nextHole = pickHole(excludeHoles);
              lastActiveHole = stealHole;
              syncTargets(nextHole, samePal);
              if (active && sameItem && active.key === itemKey(sameItem)) {
                active.age = 0;
              }
            }
          }

          // 2) 更新預備怪獸（只露出半顆頭與淡淡木牌，不倒數、不反擊）
          if (peek) {
            peek.age += dt;
            var pp = Math.min(1, peek.age / SCENE_CONFIG.ANIM.PEEK_UP_SEC);
            var pEase = 1 - Math.pow(1 - pp, 3);
            if (reducedMotion) {
              peek.el.style.transform = 'translateY(62px)';
              peek.el.style.opacity = (0.78 * pp).toFixed(3);
            } else {
              var py = 130 - pEase * 68;
              peek.el.style.transform = 'translateY(' + py.toFixed(1) + 'px)';
              peek.el.style.opacity = '0.78';
            }
          }

          // 3) 更新離場縮回洞的怪獸
          for (var gi = ghosts.length - 1; gi >= 0; gi--) {
            var g = ghosts[gi];
            g.t += dt;
            var gp = Math.min(1, g.t / g.dur);
            if (reducedMotion) {
              g.el.style.opacity = (1 - gp).toFixed(3);
            } else if (g.mode === 'steal') {
              // 前 45% 停著吐舌頭讓學生看清楚，後 55% 溜回洞裡
              var hideP = gp < 0.45 ? 0 : (gp - 0.45) / 0.55;
              g.el.style.transform = 'translateY(' + (hideP * hideP * 158).toFixed(1) + 'px)';
              g.el.style.opacity = (1 - hideP * 0.7).toFixed(3);
            } else {
              // 打對：咻地快速縮回洞裡
              g.el.style.transform = 'translateY(' + (gp * gp * 162).toFixed(1) + 'px)';
              g.el.style.opacity = (1 - gp * 0.6).toFixed(3);
            }
            if (gp >= 1) {
              g.el.remove();
              ghosts.splice(gi, 1);
            }
          }

          // 4) 更新小狐狸揮紙槌與開心小跳
          if (foxSwingT > 0) {
            foxSwingT = Math.max(0, foxSwingT - dt);
            var fp = 1 - (foxSwingT / SCENE_CONFIG.ANIM.FOX_SWING_SEC);
            if (!reducedMotion) {
              var swing = Math.sin(fp * Math.PI) * 52;
              var jump = Math.sin(fp * Math.PI) * 10;
              if (foxMalletGroup) foxMalletGroup.style.transform = 'rotate(' + swing.toFixed(1) + 'deg)';
              if (foxWrapEl) foxWrapEl.style.bottom = (10 + jump).toFixed(1) + 'px';
            }
            if (foxSwingT <= 0) {
              if (foxMalletGroup) foxMalletGroup.style.transform = '';
              if (foxWrapEl) foxWrapEl.style.bottom = '10px';
            }
          }

          // 5) 更新怪獸大王投降揮白旗（精準 1.5 秒，受 pause 凍結保護）
          if (bossSurrenderT > 0) {
            bossSurrenderT -= dt;
            if (bossFlagGroup && !reducedMotion) {
              var waveAngle = Math.sin(elapsed * Math.PI * 2 * SCENE_CONFIG.ANIM.FLAG_WAVE_HZ) * 16;
              bossFlagGroup.style.transform = 'rotate(' + waveAngle.toFixed(1) + 'deg)';
            }
            if (bossSurrenderT <= 0) {
              finishBossSurrender();
            }
          }

          // 6) 更新星星、橡果、浮字粒子
          for (var fi = fxList.length - 1; fi >= 0; fi--) {
            var fx = fxList[fi];
            fx.t += dt;
            var fp2 = Math.min(1, fx.t / fx.dur);

            if (fx.type === 'pop') {
              fx.y += fx.vy * dt;
              fx.el.style.left = fx.x + 'px';
              fx.el.style.top = fx.y + 'px';
              fx.el.style.opacity = (fp2 < 0.7 ? 1 : (1 - (fp2 - 0.7) / 0.3)).toFixed(3);
            } else if (fx.type === 'star') {
              fx.vy += 170 * dt;
              fx.x += fx.vx * dt;
              fx.y += fx.vy * dt;
              fx.rot += fx.vrot * dt;
              var sc = 1 - fp2 * 0.45;
              fx.el.style.left = fx.x + 'px';
              fx.el.style.top = fx.y + 'px';
              fx.el.style.opacity = (1 - fp2).toFixed(3);
              fx.el.style.transform = 'translate(-50%, -50%) rotate(' + fx.rot.toFixed(0) + 'deg) scale(' + sc.toFixed(2) + ')';
            } else if (fx.type === 'acorn') {
              var ax = fx.x + (fx.tx - fx.x) * fp2;
              var ay = fx.y + (fx.ty - fx.y) * fp2 - (reducedMotion ? 0 : Math.sin(fp2 * Math.PI) * 34);
              fx.el.style.left = ax + 'px';
              fx.el.style.top = ay + 'px';
              fx.el.style.opacity = (fp2 < 0.75 ? 1 : (1 - (fp2 - 0.75) / 0.25)).toFixed(3);
            }

            if (fp2 >= 1) {
              fx.el.remove();
              fxList.splice(fi, 1);
            }
          }

          rafId = requestAnimationFrame(tick);
        }

        /* ---------------- 回傳共用程式生命週期鉤子 ---------------- */
        return {
          // 第一回合開始前呼叫一次：建立場景 DOM
          start: function () {
            ensureStageBuilt();
            bossIndex = 0;
            bossMaxHp = getBossMaxHp();
            bossHp = bossMaxHp;
            bossSurrenderT = 0;
            renderBossUI();
            rebuildHoles();
          },

          // 每回合開始：清空上回合殘留目標、特效與倒數，依難度重建土洞與大王
          roundStart: function () {
            ensureStageBuilt();
            clearAllEntities();
            lastActiveHole = -1;
            bossMaxHp = getBossMaxHp();
            bossHp = bossMaxHp;
            bossSurrenderT = 0;
            bossSurrenderEl.style.opacity = '0';
            bossSurrenderEl.style.transform = 'translateY(-6px) scale(0.95)';
            renderBossUI();
            rebuildHoles();
            syncTargets();
          },

          // 開始／恢復動畫
          resume: function () {
            if (running) return;
            running = true;
            if (stageEl) stageEl.classList.remove('sc-paused');
            lastTime = performance.now();
            rafId = requestAnimationFrame(tick);
          },

          // 暫停：立即停掉 rAF 並凍結所有動畫
          pause: function () {
            running = false;
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = 0;
            }
            if (stageEl) stageEl.classList.add('sc-paused');
          },

          // 整局結束：停掉一切動畫並清空進行中特效
          stop: function () {
            running = false;
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = 0;
            }
            if (stageEl) stageEl.classList.add('sc-paused');
            clearAllEntities();
          },

          // 打對：小狐狸揮紙槌、怪獸冒星星縮回洞、扣大王血、換別的洞冒出下一隻
          hit: function (res) {
            var count = Math.max(1, (res && res.correct) || 1);
            var hitHole = active ? active.holeIdx : lastActiveHole;
            var hitX = (hitHole >= 0 && holes[hitHole]) ? holes[hitHole].cx : (field.clientWidth * 0.5);
            var fh = field.clientHeight || 300;

            // 小狐狸揮紙槌跳一下
            foxSwingT = SCENE_CONFIG.ANIM.FOX_SWING_SEC;

            // 怪獸頭上冒小星星與 ✓ +1，並咻地縮回洞裡
            sendActiveToGhost('hit');
            spawnHitStars(hitX, Math.max(76, fh - 160));
            var combo = (res && res.combo) || 0;
            var label = combo >= 5 ? ('✓ +' + count + ' 連擊!') : ('✓ +' + count);
            spawnPopText(hitX, Math.max(72, fh - 178), label, 'sc-fx-ok');

            // 扣怪獸大王血量（投降動畫期間不重複觸發）
            if (bossSurrenderT <= 0) {
              bossHp = Math.max(0, bossHp - count);
              if (bossHp <= 0) {
                triggerBossSurrender();
              } else {
                renderBossUI();
              }
            }

            // 如果原本預備洞的怪獸剛好就是現在的第一個字，直接由該預備洞冒出（保證不同洞且視覺連貫）
            var nextList = api.upcoming(2) || [];
            var nextFirst = nextList[0] || null;
            var preferHole = -1;
            var preferPal;
            if (peek && nextFirst && peek.key === itemKey(nextFirst) && peek.holeIdx !== hitHole) {
              preferHole = peek.holeIdx;
              preferPal = peek.paletteIdx;
              clearPeek();
            }
            lastActiveHole = hitHole;
            syncTargets(preferHole, preferPal);
          },

          // 打錯：怪獸歪頭眨眼，不扣血、不閃紅全場
          miss: function () {
            if (!active) return;
            active.el.classList.add('sc-state-miss');
            active.missTimer = SCENE_CONFIG.ANIM.MISS_TILT_SEC;
            var hx = holes[active.holeIdx] ? holes[active.holeIdx].cx : (field.clientWidth * 0.5);
            var fh = field.clientHeight || 300;
            spawnPopText(hx + 44, Math.max(78, fh - 154), '？', 'sc-fx-miss');
          },

          // 視窗大小改變：重新計算洞位與比例
          resize: function () {
            layout();
          }
        };
      }
    });
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
</body></html>
