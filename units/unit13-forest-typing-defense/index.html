<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>極速雷射森林戰 - 打字島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@500;600&display=swap">
  <link rel="stylesheet" href="../../assets/css/typing-island.css">
  <style>
    /* 場景容器：完全限制在 api.field 內，所有 class 以 sc- 開頭 */
    .sc-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      user-select: none;
      background: var(--paper, #F7E8CB);
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    }

    /* 暫停保護：雙重保險確保任何過渡都在暫停時靜止 */
    .sc-stage.sc-paused,
    .sc-stage.sc-paused * {
      animation-play-state: paused !important;
      transition: none !important;
    }

    /* 背景層（三層剪紙森林） */
    .sc-bg-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .sc-forest-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 蘑菇田保護線 */
    .sc-guard-line {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 2;
      border-top: 2px dashed rgba(179, 38, 43, 0.42);
      pointer-events: none;
    }
    .sc-guard-tag {
      position: absolute;
      left: 12px;
      top: -24px;
      padding: 1px 9px;
      border-radius: 8px 10px 6px 8px;
      background: var(--card, #FFF8E6);
      border: 1.5px solid var(--kraft-2, #C9A66B);
      color: var(--ink-2, #5E4838);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 0 rgba(59, 42, 32, 0.12);
    }

    /* 蘑菇田層 */
    .sc-mush-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    .sc-mush {
      position: absolute;
      bottom: 4px;
      width: 58px;
      height: 54px;
      margin-left: -29px;
      transform-origin: center bottom;
      filter: drop-shadow(0 2px 0 rgba(59, 42, 32, 0.16));
    }
    .sc-mush .sc-mush-bitten-g { display: none; }
    .sc-mush.sc-mush-bitten .sc-mush-whole { display: none; }
    .sc-mush.sc-mush-bitten .sc-mush-bitten-g { display: inline; }

    /* 光柱與光暈 SVG 層 */
    .sc-fx-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }

    /* 葉子蟲目標層 */
    .sc-target-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    /* 單隻葉子蟲容器（定位點為葉片中心） */
    .sc-bug {
      position: absolute;
      left: 0;
      top: 0;
      width: 88px;
      height: 84px;
      margin-left: -44px;
      margin-top: -42px;
      will-change: transform, opacity;
    }

    /* 從樹冠垂下的蜘蛛絲 */
    .sc-silk {
      position: absolute;
      left: 50%;
      bottom: 76px;
      width: 0;
      margin-left: -1px;
      border-left: 2px dashed rgba(94, 72, 56, 0.45);
      pointer-events: none;
    }

    /* 目前目標的天藍虛線瞄準圈 */
    .sc-bug-aim {
      position: absolute;
      inset: -10px -10px -8px -10px;
      border-radius: 20px 24px 22px 18px;
      border: 3px dashed var(--sky-dk, #1F6B9C);
      opacity: 0;
      pointer-events: none;
    }
    .sc-bug-aim::before,
    .sc-bug-aim::after {
      content: '';
      position: absolute;
      background: var(--sky-dk, #1F6B9C);
      border-radius: 2px;
    }
    .sc-bug-aim::before {
      width: 12px;
      height: 3px;
      left: -8px;
      top: 50%;
      margin-top: -1.5px;
      box-shadow: 108px 0 0 var(--sky-dk, #1F6B9C);
    }
    .sc-bug-aim::after {
      width: 3px;
      height: 12px;
      left: 50%;
      top: -8px;
      margin-left: -1.5px;
      box-shadow: 0 104px 0 var(--sky-dk, #1F6B9C);
    }
    .sc-bug.sc-bug-active .sc-bug-aim {
      opacity: 1;
    }

    /* 葉子蟲探頭的 Q 版小蟲頭 */
    .sc-bug-head {
      position: absolute;
      left: 50%;
      top: -18px;
      width: 44px;
      height: 28px;
      margin-left: -22px;
      z-index: 2;
      filter: drop-shadow(0 2px 0 rgba(59, 42, 32, 0.14));
    }

    /* 葉子蟲背上的剪紙葉片卡片 */
    .sc-bug-leaf {
      position: relative;
      width: 88px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 3px 0 rgba(59, 42, 32, 0.16));
    }
    .sc-leaf-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    /* 非目前目標：樸素米白卡紙葉 */
    .sc-leaf-shape {
      fill: var(--card, #FFF8E6);
      stroke: #8EC67E;
      stroke-width: 2.5;
    }
    .sc-leaf-vein {
      stroke: rgba(142, 198, 126, 0.35);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
    }
    /* 目前目標：淡天藍底（與 --ink-1 對比 11.4:1）＋天藍粗框 */
    .sc-bug.sc-bug-active .sc-leaf-shape {
      fill: var(--sky-soft, #D6EEFB);
      stroke: var(--sky-dk, #1F6B9C);
      stroke-width: 4;
    }
    .sc-bug.sc-bug-active .sc-leaf-vein {
      stroke: rgba(31, 107, 156, 0.2);
    }
    /* 打錯短暫柔紅描邊（不快閃） */
    .sc-bug.sc-bug-miss .sc-leaf-shape {
      fill: #FFE8E5;
      stroke: var(--berry-dk, #B3262B);
      stroke-width: 4;
    }

    /* 葉片上的字：高對比深棕 --ink-1 */
    .sc-bug-char {
      position: relative;
      z-index: 2;
      color: var(--ink-1, #3B2A20);
      font-family: var(--f-zh, 'Noto Sans TC', sans-serif);
      font-weight: 600;
      line-height: 1;
      text-align: center;
      padding-top: 2px;
      font-variant-ligatures: none;
    }
    /* 英打字型：Fredoka / Consolas / monospace，大小寫原樣不轉換 */
    .sc-stage[data-lang="en"] .sc-bug-char {
      font-family: 'Fredoka', Consolas, monospace;
      font-weight: 600;
    }
    .sc-bug-char.sc-is-space {
      color: var(--sky-dk, #1F6B9C);
    }

    /* 打錯小徽章 ✗ */
    .sc-bug-miss-badge {
      position: absolute;
      right: -4px;
      top: -4px;
      z-index: 3;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--berry, #E5484D);
      border: 2px solid var(--card, #FFF8E6);
      color: #FFF8E6;
      font-size: 14px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      box-shadow: 0 2px 0 rgba(59, 42, 32, 0.2);
    }
    .sc-bug.sc-bug-miss .sc-bug-miss-badge {
      opacity: 1;
    }

    /* 頂部剪紙樹冠層（蓋住蜘蛛絲頂端） */
    .sc-canopy-layer {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 46px;
      z-index: 6;
      pointer-events: none;
    }
    .sc-canopy-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 樹上的貓頭鷹與「守得好！」對話氣泡 */
    .sc-owl-wrap {
      position: absolute;
      right: 12px;
      top: 4px;
      width: 82px;
      height: 82px;
      z-index: 7;
      pointer-events: none;
    }
    .sc-owl-svg {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 3px 0 rgba(59, 42, 32, 0.16));
    }
    .sc-owl-awake { display: none; }
    .sc-owl-wrap.sc-owl-cheer .sc-owl-sleep { display: none; }
    .sc-owl-wrap.sc-owl-cheer .sc-owl-awake { display: inline; }

    .sc-owl-bubble {
      position: absolute;
      right: 84px;
      top: 16px;
      white-space: nowrap;
      padding: 6px 13px;
      border-radius: 14px 16px 12px 14px;
      background: var(--card, #FFF8E6);
      border: 2.5px solid var(--kraft-2, #C9A66B);
      color: var(--ink-1, #3B2A20);
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 3px 0 rgba(59, 42, 32, 0.14);
      opacity: 0;
      pointer-events: none;
    }
    .sc-owl-bubble::after {
      content: '';
      position: absolute;
      right: -9px;
      top: 50%;
      margin-top: -6px;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 9px solid var(--kraft-2, #C9A66B);
    }
    .sc-owl-bubble::before {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      margin-top: -4px;
      z-index: 1;
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 7px solid var(--card, #FFF8E6);
    }
    .sc-owl-check {
      color: var(--leaf-dk, #2D7A38);
      margin-right: 4px;
    }

    /* 小狐狸森林守衛 */
    .sc-fox {
      position: absolute;
      left: 0;
      bottom: 2px;
      width: 84px;
      height: 78px;
      margin-left: -42px;
      z-index: 8;
      pointer-events: none;
      will-change: transform;
      filter: drop-shadow(0 3px 0 rgba(59, 42, 32, 0.18));
    }
    .sc-fox-eyes-happy { display: none; }
    .sc-fox.sc-fox-happy .sc-fox-eyes-normal { display: none; }
    .sc-fox.sc-fox-happy .sc-fox-eyes-happy { display: inline; }

    /* 特效層（害羞爬回的蟲、飄落葉片、小星星、+1 浮字） */
    .sc-fx-layer {
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
    }
    .sc-retreat {
      position: absolute;
      left: 0;
      top: 0;
      width: 48px;
      height: 44px;
      margin-left: -24px;
      margin-top: -22px;
      will-change: transform, opacity;
    }
    .sc-retreat-silk {
      position: absolute;
      left: 50%;
      bottom: 34px;
      width: 0;
      margin-left: -1px;
      border-left: 2px dashed rgba(94, 72, 56, 0.42);
    }
    .sc-fall-leaf {
      position: absolute;
      left: 0;
      top: 0;
      width: 56px;
      height: 52px;
      margin-left: -28px;
      margin-top: -26px;
      will-change: transform, opacity;
      filter: drop-shadow(0 2px 0 rgba(59, 42, 32, 0.12));
    }
    .sc-star {
      position: absolute;
      left: 0;
      top: 0;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      margin-top: -11px;
      will-change: transform, opacity;
    }
    .sc-pop-text {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--leaf-dk, #2D7A38);
      text-shadow: 0 2px 0 #FFF8E6, 1px 0 0 #FFF8E6, -1px 0 0 #FFF8E6, 0 -1px 0 #FFF8E6;
      white-space: nowrap;
      will-change: transform, opacity;
    }
    .sc-pop-text.sc-pop-hurt {
      color: var(--berry-dk, #B3262B);
      font-size: 18px;
    }

    @media (prefers-reduced-motion: reduce) {
      .sc-stage,
      .sc-stage * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head><body>
  <script src="../../assets/typing/passages.js"></script>
  <script src="../../assets/typing/en-items.js"></script>
  <script src="../../assets/js/typing-core.js"></script>
  <script src="../../assets/js/typing-ui.js"></script>
  <script>
    TypingIsland.mount({
      unit: 13,
      title: '極速雷射森林戰',
      subtitle: '射擊類・英打',
      langs: ['en'],
      homeUrl: '../../index.html',
      scene: function (api) {
        /* =========================================================
           具名常數集中設定（速度、數量、顏色、時間、車道比例）
           ========================================================= */
        var SCENE_CONFIG = {
          // 依難度調整同時目標數、降落到底線秒數（t1 >= 14s、t2 = 10s、t3 = 7s）、字級（英打 >= 44px）
          TIER: {
            t1: { count: 3, fallSeconds: 15, fontSize: 52 },
            t2: { count: 4, fallSeconds: 10, fontSize: 48 },
            t3: { count: 5, fallSeconds: 7,  fontSize: 44 }
          },
          // 尚未輪到的目標：速度為目前目標的 1/3，且最多前進全程的 1/3
          WAITING_SPEED_RATIO: 1 / 3,
          WAITING_MAX_PROGRESS: 1 / 3,
          // 5 條水平車道比例（右側留給樹上貓頭鷹與對話氣泡，互不遮擋）
          LANE_X_RATIOS: [0.12, 0.29, 0.46, 0.63, 0.80],
          // 動畫時間上限（秒）
          MAX_DT: 0.1,
          // 雷射暖黃光柱持續秒數（0.25 秒，不閃爍）
          BEAM_DURATION: 0.25,
          // 害羞葉子蟲爬回樹冠時間（秒）
          RETREAT_DURATION: 0.48,
          // 葉子飄落時間（秒）
          FALL_LEAF_DURATION: 0.68,
          // 星星與浮動文字時間（秒）
          STAR_DURATION: 0.60,
          POP_DURATION: 0.72,
          // 打錯輕晃與紅框時間（秒；每秒不超過 3 次閃爍，僅單次輕搖）
          MISS_DURATION: 0.42,
          // 小狐狸移動跟隨平滑係數與開心跳躍時間
          FOX_SMOOTH: 11,
          FOX_JUMP_DURATION: 0.34,
          FOX_JUMP_HEIGHT: 15,
          FOX_HAPPY_DURATION: 0.48,
          // 貓頭鷹連擊里程碑與氣泡顯示時間（每 10 連擊顯示 2 秒）
          OWL_COMBO_STEP: 10,
          OWL_SHOW_SECONDS: 2.0,
          // 色票（遵循 system.md 繪本剪紙色票，搭配柔和森林層次）
          COLORS: {
            skyTop: '#F5EED8',
            skyBottom: '#F7E8CB',
            sunFill: '#FFF1B8',
            sunStroke: '#FFD966',
            layerYellow: '#F2E0A6',
            layerYellowStroke: '#E4CC9C',
            layerLightGreen: '#CBE7B7',
            layerLightGreenStroke: '#B1D69B',
            layerGrassGreen: '#9BD287',
            layerGrassStroke: '#7CCB6F',
            groundTop: '#82C771',
            groundBottom: '#6DB65E',
            beamOuterStart: '#FFD966',
            beamOuterEnd: '#FFF1B8',
            beamCore: '#FFF8E6',
            starYellow: '#FFD966',
            starLeaf: '#7CCB6F',
            starPeach: '#FF9E7A',
            mushCaps: ['#F0856B', '#FF9E7A', '#E87A64', '#F59573', '#EB8169']
          }
        };

        var SVG_NS = 'http://www.w3.org/2000/svg';
        var field = api.field;
        var reduceMotionMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;

        // 場景運行狀態
        var mounted = false;
        var running = false;
        var rafId = 0;
        var lastTime = 0;
        var elapsed = 0;

        // 動態量測容器寬高（不寫死）
        var fieldW = 0;
        var fieldH = 0;

        // DOM 節點參照
        var stageEl = null;
        var guardLineEl = null;
        var fxSvgEl = null;
        var beamGroupEl = null;
        var targetLayerEl = null;
        var fxLayerEl = null;
        var mushEls = [];
        var owlWrapEl = null;
        var owlBubbleEl = null;
        var foxEl = null;
        var foxGunEl = null;

        // 互動實體列表（全部由單一 rAF + dt 驅動，pause 時完全停止）
        var items = [];          // 目前畫面上的葉子蟲，嚴格對齊 api.upcoming
        var beams = [];          // 暖黃光柱特效
        var retreats = [];       // 被照到害羞爬回樹上的葉子蟲
        var fallingLeaves = [];  // 飄落中的剪紙葉子
        var particles = [];      // 慶祝小星星與浮動文字

        // 小狐狸與貓頭鷹狀態
        var foxX = 0;
        var foxTargetX = 0;
        var foxJumpTimer = 0;
        var foxHappyTimer = 0;
        var owlTimer = 0;
        var lastOwlMilestone = 0;
        var lastClearedLane = -1;

        /* ---------------------------------------------------------
           工具函式
           --------------------------------------------------------- */
        function isReducedMotion() {
          return !!(reduceMotionMQ && reduceMotionMQ.matches);
        }

        function getTierConfig() {
          var t = (api.settings && api.settings.tier) || 't1';
          return SCENE_CONFIG.TIER[t] || SCENE_CONFIG.TIER.t1;
        }

        // 取得目前顯示文字：國字與英文一律從 display 取值，空白轉成 ␣，大小寫原樣保留
        function formatDisplayChar(itemData) {
          var text = (itemData && typeof itemData.display === 'string') ? itemData.display : '';
          return text === ' ' ? '␣' : text;
        }

        // 量測 api.field 真實尺寸，絕不寫死固定寬高
        function measureField() {
          var w = field.clientWidth;
          var h = field.clientHeight;
          if (w > 0) fieldW = w;
          if (h > 0) fieldH = h;
          if (fieldW <= 0) fieldW = 1000;
          if (fieldH <= 0) fieldH = 300;
        }

        // 依容器高度動態計算垂直軌道參數
        function getVerticalMetrics() {
          var canopyY = Math.max(20, fieldH * 0.09);
          var startY = Math.max(54, fieldH * 0.20);
          var floorY = Math.max(startY + 60, fieldH * 0.82 - 34);
          return {
            canopyY: canopyY,
            startY: startY,
            floorY: floorY,
            travel: floorY - startY,
            foxGunY: Math.max(floorY + 12, fieldH - 52)
          };
        }

        function getLaneX(laneIndex) {
          var ratio = SCENE_CONFIG.LANE_X_RATIOS[laneIndex % SCENE_CONFIG.LANE_X_RATIOS.length];
          return fieldW * ratio;
        }

        // 為新葉子蟲挑選不重複的車道，盡量分散讓小狐狸左右移動
        function pickAvailableLane(usedMap) {
          var free = [];
          var i;
          for (i = 0; i < SCENE_CONFIG.LANE_X_RATIOS.length; i++) {
            if (!usedMap[i]) free.push(i);
          }
          if (free.length === 0) return 0;
          if (free.length > 1 && lastClearedLane >= 0) {
            var filtered = free.filter(function (idx) { return idx !== lastClearedLane; });
            if (filtered.length > 0) free = filtered;
          }
          return free[Math.floor(Math.random() * free.length)];
        }

        function createSvgEl(tag, attrs) {
          var el = document.createElementNS(SVG_NS, tag);
          if (attrs) {
            Object.keys(attrs).forEach(function (k) {
              el.setAttribute(k, attrs[k]);
            });
          }
          return el;
        }

        /* ---------------------------------------------------------
           建立繪本剪紙風靜態場景（全部 inline SVG）
           --------------------------------------------------------- */
        function buildForestBgSvg() {
          var c = SCENE_CONFIG.COLORS;
          return (
            '<svg class="sc-forest-svg" viewBox="0 0 1330 300" preserveAspectRatio="none" aria-hidden="true">' +
              '<defs>' +
                '<linearGradient id="sc-sky-grad" x1="0" y1="0" x2="0" y2="1">' +
                  '<stop offset="0%" stop-color="' + c.skyTop + '"/>' +
                  '<stop offset="100%" stop-color="' + c.skyBottom + '"/>' +
                '</linearGradient>' +
                '<linearGradient id="sc-ground-grad" x1="0" y1="0" x2="0" y2="1">' +
                  '<stop offset="0%" stop-color="' + c.groundTop + '"/>' +
                  '<stop offset="100%" stop-color="' + c.groundBottom + '"/>' +
                '</linearGradient>' +
              '</defs>' +
              // 米色紙底天空
              '<rect x="0" y="0" width="1330" height="300" fill="url(#sc-sky-grad)"/>' +
              // 柔和暖黃剪紙太陽
              '<circle cx="110" cy="68" r="46" fill="' + c.sunFill + '" stroke="' + c.sunStroke + '" stroke-width="3" opacity="0.85"/>' +
              '<circle cx="110" cy="68" r="32" fill="' + c.sunStroke + '" opacity="0.32"/>' +
              // 第一層遠景：暖黃樹叢與剪紙小樹
              '<g opacity="0.95">' +
                '<rect x="216" y="138" width="14" height="58" rx="4" fill="#D4B47C"/>' +

        function buildStageDom() {
          field.innerHTML = '';
          stageEl = document.createElement('div');
          stageEl.className = 'sc-stage';
          stageEl.setAttribute('data-lang', (api.settings && api.settings.lang) || 'en');

          // 1. 三層剪紙森林背景
          var bgLayer = document.createElement('div');
          bgLayer.className = 'sc-bg-layer';
          bgLayer.innerHTML = buildForestBgSvg();
          stageEl.appendChild(bgLayer);

          // 2. 蘑菇田保護線
          guardLineEl = document.createElement('div');
          guardLineEl.className = 'sc-guard-line';
          guardLineEl.innerHTML = '<span class="sc-guard-tag">蘑菇田保護線</span>';
          stageEl.appendChild(guardLineEl);

          // 3. 蘑菇田（對應 5 條車道）
          var mushLayer = document.createElement('div');
          mushLayer.className = 'sc-mush-layer';
          mushEls = [];
          SCENE_CONFIG.LANE_X_RATIOS.forEach(function (_, idx) {
            var m = document.createElement('div');
            m.className = 'sc-mush';
            m.innerHTML = buildMushroomSvg(SCENE_CONFIG.COLORS.mushCaps[idx % SCENE_CONFIG.COLORS.mushCaps.length]);
            mushLayer.appendChild(m);
            mushEls.push(m);
          });
          stageEl.appendChild(mushLayer);

          // 4. 光束 SVG 圖層（暖黃光柱＋漸層定義）
          fxSvgEl = createSvgEl('svg', { class: 'sc-fx-svg', 'aria-hidden': 'true' });
          var defs = createSvgEl('defs');
          var grad = createSvgEl('linearGradient', { id: 'sc-beam-grad', x1: '0', y1: '1', x2: '0', y2: '0' });
          grad.appendChild(createSvgEl('stop', { offset: '0%', 'stop-color': SCENE_CONFIG.COLORS.beamOuterStart, 'stop-opacity': '0.82' }));
          grad.appendChild(createSvgEl('stop', { offset: '100%', 'stop-color': SCENE_CONFIG.COLORS.beamOuterEnd, 'stop-opacity': '0.32' }));
          defs.appendChild(grad);
          fxSvgEl.appendChild(defs);
          beamGroupEl = createSvgEl('g');
          fxSvgEl.appendChild(beamGroupEl);
          stageEl.appendChild(fxSvgEl);

          // 5. 葉子蟲目標層
          targetLayerEl = document.createElement('div');
          targetLayerEl.className = 'sc-target-layer';
          stageEl.appendChild(targetLayerEl);

          // 6. 上方樹冠層
          var canopyLayer = document.createElement('div');
          canopyLayer.className = 'sc-canopy-layer';
          canopyLayer.innerHTML = buildCanopySvg();
          stageEl.appendChild(canopyLayer);

          // 7. 樹上的貓頭鷹與對話氣泡
          owlWrapEl = document.createElement('div');
          owlWrapEl.className = 'sc-owl-wrap';
          owlWrapEl.innerHTML = buildOwlSvg();
          owlBubbleEl = document.createElement('div');
          owlBubbleEl.className = 'sc-owl-bubble';
          owlBubbleEl.innerHTML = '<span class="sc-owl-check">✓</span>守得好！';
          owlWrapEl.appendChild(owlBubbleEl);
          stageEl.appendChild(owlWrapEl);

          // 8. 小狐狸森林守衛
          foxEl = document.createElement('div');
          foxEl.className = 'sc-fox';
          foxEl.innerHTML = buildFoxSvg();
          foxGunEl = foxEl.querySelector('.sc-fox-gun');
          stageEl.appendChild(foxEl);

          // 9. 特效層
          fxLayerEl = document.createElement('div');
          fxLayerEl.className = 'sc-fx-layer';
          stageEl.appendChild(fxLayerEl);

          field.appendChild(stageEl);
        }

          var aim = document.createElement('div');

          aim.setAttribute('aria-hidden', 'true');
          el.appendChild(aim);

          var head = document.createElement('div');
          head.className = 'sc-bug-head';
          head.innerHTML = buildBugHeadSvg();
          el.appendChild(head);

          var leaf = document.createElement('div');
          leaf.className = 'sc-bug-leaf';
          leaf.innerHTML = buildLeafBgSvg();

          var charEl = document.createElement('span');
          charEl.className = 'sc-bug-char';
          var text = formatDisplayChar(u);
          charEl.textContent = text;
          charEl.style.fontSize = fontSize + 'px';
          if (u.display === ' ') charEl.classList.add('sc-is-space');
          leaf.appendChild(charEl);

          var missBadge = document.createElement('span');
          missBadge.className = 'sc-bug-miss-badge';
          missBadge.setAttribute('aria-hidden', 'true');
          missBadge.textContent = '✗';
          leaf.appendChild(missBadge);

          el.appendChild(leaf);
          targetLayerEl.appendChild(el);

          return {
            key: u.passageIndex + ':' + u.index,
            lane: lane,
            progress: initialProgress,
            fadeIn: isReducedMotion() ? 0 : 1,
            missTimer: 0,
            swaySeed: Math.random() * Math.PI * 2,
            el: el,
            silkEl: silk,
            charEl: charEl
          };
        }

        function syncTargets(isFreshRound) {
          var cfg = getTierConfig();
          var want = api.upcoming(cfg.count) || [];
          var usedLanes = {};
          var i;

          if (stageEl) {
            stageEl.setAttribute('data-lang', (api.settings && api.settings.lang) || 'en');
          }

          // 移除多出來的目標
          while (items.length > want.length) {
            var extra = items.pop();
            if (extra && extra.el) extra.el.remove();
          }

          // 先標記既有且對齊的車道
          for (i = 0; i < want.length; i++) {
            var key = want[i].passageIndex + ':' + want[i].index;
            if (items[i] && items[i].key === key) {
              usedLanes[items[i].lane] = true;
            }
          }

          // 逐一對齊或補上新目標
          for (i = 0; i < want.length; i++) {
            var u = want[i];
            var targetKey = u.passageIndex + ':' + u.index;
            var it = items[i];

            if (!it || it.key !== targetKey) {
              if (it && it.el) it.el.remove();
              var lane = pickAvailableLane(usedLanes);
              usedLanes[lane] = true;
              // 剛開局稍微錯落呈現（皆遠小於 1/3），遊戲中補位一律從頂部垂降
              var initProg = isFreshRound ? Math.min(0.14, 0.02 + i * 0.03) : 0;
              it = createBugItem(u, lane, initProg, cfg.fontSize);
              items[i] = it;
            } else {
              // 同步字級與顯示內容（含難度變更時）
              it.charEl.style.fontSize = cfg.fontSize + 'px';
              var displayStr = formatDisplayChar(u);
              if (it.charEl.textContent !== displayStr) {
                it.charEl.textContent = displayStr;
                it.charEl.classList.toggle('sc-is-space', u.display === ' ');
              }
            }

            // 輪到目前要打的目標時，確保它已進入可視區
            if (i === 0 && it.progress < 0.02) {
              it.progress = 0.02;
            }
            it.el.classList.toggle('sc-bug-active', i === 0);
          }

          // 更新小狐狸要追蹤的水平目標
          if (items[0]) {
            foxTargetX = getLaneX(items[0].lane);
            if (isFreshRound || foxX <= 0) {
              foxX = foxTargetX;
            }
          }
        }

        /* ---------------------------------------------------------
           特效生成（皆由主 rAF 迴圈推進，不使用 setTimeout）
           --------------------------------------------------------- */
        // 射出柔和暖黃光柱（0.25 秒，不閃爍）
        function spawnBeam(fromX, fromY, toX, toY) {
          var dx = toX - fromX;
          var dy = toY - fromY;
          var len = Math.sqrt(dx * dx + dy * dy) || 1;
          var nx = -dy / len;
          var ny = dx / len;

          var wStart = 7;
          var wEnd = 22;
          var pts = [
            (fromX + nx * wStart).toFixed(1) + ',' + (fromY + ny * wStart).toFixed(1),
            (fromX - nx * wStart).toFixed(1) + ',' + (fromY - ny * wStart).toFixed(1),
            (toX - nx * wEnd).toFixed(1) + ',' + (toY - ny * wEnd).toFixed(1),
            (toX + nx * wEnd).toFixed(1) + ',' + (toY + ny * wEnd).toFixed(1)
          ].join(' ');

          var g = createSvgEl('g');
          var poly = createSvgEl('polygon', {
            points: pts,
            fill: 'url(#sc-beam-grad)'
          });
          var core = createSvgEl('line', {
            x1: fromX.toFixed(1),
            y1: fromY.toFixed(1),
            x2: toX.toFixed(1),
            y2: toY.toFixed(1),
            stroke: SCENE_CONFIG.COLORS.beamCore,
            'stroke-width': '5',
            'stroke-linecap': 'round',
            opacity: '0.78'
          });
          var glow = createSvgEl('circle', {
            cx: toX.toFixed(1),
            cy: toY.toFixed(1),
            r: '26',
            fill: SCENE_CONFIG.COLORS.beamOuterStart,
            opacity: '0.45'
          });
          g.appendChild(poly);
          g.appendChild(core);
          g.appendChild(glow);
          beamGroupEl.appendChild(g);

          beams.push({
            el: g,
            age: 0,
            duration: SCENE_CONFIG.BEAM_DURATION
          });
        }

        // 害羞葉子蟲沿絲爬回樹冠 ＋ 葉子飄落
        function spawnHitRetreatAndLeaf(x, y, canopyY) {
          var reduced = isReducedMotion();

          // 害羞小蟲沿絲爬回
          var retEl = document.createElement('div');
          retEl.className = 'sc-retreat';
          var silkEl = document.createElement('div');
          silkEl.className = 'sc-retreat-silk';
          retEl.appendChild(silkEl);
          var bugWrap = document.createElement('div');
          bugWrap.innerHTML = buildShyBugSvg();
          retEl.appendChild(bugWrap);
          fxLayerEl.appendChild(retEl);

          retreats.push({
            el: retEl,
            silkEl: silkEl,
            x: x,
            startY: y - 16,
            endY: reduced ? (y - 16) : canopyY,
            canopyY: canopyY,
            age: 0,
            duration: reduced ? 0.25 : SCENE_CONFIG.RETREAT_DURATION,
            reduced: reduced
          });

          // 脫落的剪紙葉子飄落
          var leafEl = document.createElement('div');
          leafEl.className = 'sc-fall-leaf';
          leafEl.innerHTML = buildFallingLeafSvg();
          fxLayerEl.appendChild(leafEl);

          fallingLeaves.push({
            el: leafEl,
            x: x,
            y: y + 4,
            driftDir: Math.random() < 0.5 ? -1 : 1,
            age: 0,
            duration: reduced ? 0.25 : SCENE_CONFIG.FALL_LEAF_DURATION,
            reduced: reduced
          });
        }

        // 慶祝小星星與 +1 浮字（不擋住下一個要打的字）
        function spawnCelebration(x, y, text, isHurt) {
          var reduced = isReducedMotion();

          // 浮動文字（放在目標略上方）
          var popEl = document.createElement('div');
          popEl.className = 'sc-pop-text' + (isHurt ? ' sc-pop-hurt' : '');
          popEl.textContent = text;
          fxLayerEl.appendChild(popEl);

          particles.push({
            kind: 'pop',
            el: popEl,
            x: x,
            y: Math.max(46, y - 38),
            vx: 0,
            vy: reduced ? 0 : -34,
            age: 0,
            duration: reduced ? 0.45 : SCENE_CONFIG.POP_DURATION,
            reduced: reduced
          });

          // 減低動態模式或扣血時不產生飛散粒子
          if (reduced || isHurt) return;

          var starColors = [
            SCENE_CONFIG.COLORS.starYellow,
            SCENE_CONFIG.COLORS.starLeaf,
            SCENE_CONFIG.COLORS.starPeach,
            SCENE_CONFIG.COLORS.starYellow
          ];
          var angles = [-2.55, -1.9, -1.2, -0.6];
          angles.forEach(function (ang, idx) {
            var sEl = document.createElement('div');
            sEl.className = 'sc-star';
            sEl.innerHTML = buildStarSvg(starColors[idx % starColors.length]);
            fxLayerEl.appendChild(sEl);
            var speed = 64 + (idx % 2) * 26;
            particles.push({
              kind: 'star',
              el: sEl,
              x: x,
              y: y - 8,
              vx: Math.cos(ang) * speed,
              vy: Math.sin(ang) * speed,
              rot: (idx - 1.5) * 40,
              age: 0,
              duration: SCENE_CONFIG.STAR_DURATION,
              reduced: false
            });
          });
        }

        // 蘑菇被咬一小口
        function biteMushroom(laneIndex) {
          var mEl = mushEls[laneIndex % mushEls.length];
          if (mEl) {
            mEl.classList.add('sc-mush-bitten');
          }
        }

        function healAllMushrooms() {
          mushEls.forEach(function (mEl) {
            mEl.classList.remove('sc-mush-bitten');
          });
        }

        // 清空上一回合留下的所有目標、特效、計時狀態
        function clearAllDynamicState() {
          items.forEach(function (it) { if (it.el) it.el.remove(); });
          items = [];

          beams.forEach(function (b) { if (b.el) b.el.remove(); });
          beams = [];

          retreats.forEach(function (r) { if (r.el) r.el.remove(); });
          retreats = [];

          fallingLeaves.forEach(function (fl) { if (fl.el) fl.el.remove(); });
          fallingLeaves = [];

          particles.forEach(function (p) { if (p.el) p.el.remove(); });
          particles = [];

          owlTimer = 0;
          lastOwlMilestone = 0;
          lastClearedLane = -1;
          foxJumpTimer = 0;
          foxHappyTimer = 0;

          healAllMushrooms();
          updateOwlVisual();
        }

        /* ---------------------------------------------------------
           畫面繪製與單一 rAF 主迴圈
           --------------------------------------------------------- */
        function updateStaticPositions() {
          var m = getVerticalMetrics();
          if (fxSvgEl) {
            fxSvgEl.setAttribute('viewBox', '0 0 ' + fieldW + ' ' + fieldH);
          }
          if (guardLineEl) {
            guardLineEl.style.top = (m.floorY + 34) + 'px';
          }
          mushEls.forEach(function (mEl, idx) {
            mEl.style.left = getLaneX(idx) + 'px';
          });
        }

        function updateOwlVisual() {
          if (!owlWrapEl || !owlBubbleEl) return;
          var active = owlTimer > 0;
          owlWrapEl.classList.toggle('sc-owl-cheer', active);

          if (!active) {
            owlBubbleEl.style.opacity = '0';
            owlWrapEl.style.transform = 'translate3d(0, 0, 0)';
            return;
          }

          var fade = Math.min(1, owlTimer / 0.25);
          owlBubbleEl.style.opacity = fade.toFixed(2);
          if (isReducedMotion()) {
            owlWrapEl.style.transform = 'translate3d(0, 0, 0)';
          } else {
            var bob = Math.sin((SCENE_CONFIG.OWL_SHOW_SECONDS - owlTimer) * 7) * 3;
            owlWrapEl.style.transform = 'translate3d(0, ' + bob.toFixed(1) + 'px, 0)';
          }
        }

        function renderAll() {
          var m = getVerticalMetrics();
          var reduced = isReducedMotion();
          var i;

          // 1. 繪製葉子蟲與蜘蛛絲
          for (i = 0; i < items.length; i++) {
            var it = items[i];
            var baseX = getLaneX(it.lane);
            var baseY = m.startY + it.progress * m.travel;
            var offsetX = 0;
            var scale = i === 0 ? 1.07 : 0.96;

            if (!reduced) {
              // 等候中的目標到 1/3 停住時輕微隨風晃動
              if (i > 0 && it.progress >= SCENE_CONFIG.WAITING_MAX_PROGRESS - 0.001) {
                offsetX += Math.sin(elapsed * 2.2 + it.swaySeed) * 2.5;
              }
              // 打錯時輕晃兩下（不高頻閃爍）
              if (it.missTimer > 0) {
                var missPhase = (SCENE_CONFIG.MISS_DURATION - it.missTimer) / SCENE_CONFIG.MISS_DURATION;
                offsetX += Math.sin(missPhase * Math.PI * 4) * 6 * (1 - missPhase);
              }
            }

            it.el.classList.toggle('sc-bug-miss', it.missTimer > 0);
            it.el.style.transform = 'translate3d(' + (baseX + offsetX).toFixed(1) + 'px,' + baseY.toFixed(1) + 'px,0) scale(' + scale + ')';
            it.el.style.opacity = it.fadeIn.toFixed(2);

            // 蜘蛛絲從樹冠垂到葉子蟲頂端
            var silkHeight = Math.max(0, (baseY - 40) - m.canopyY);
            it.silkEl.style.height = (silkHeight / scale).toFixed(1) + 'px';
          }

          // 2. 繪製小狐狸與手電筒微傾角度
          if (foxEl) {
            var jumpY = 0;
            if (!reduced && foxJumpTimer > 0) {
              var jp = 1 - (foxJumpTimer / SCENE_CONFIG.FOX_JUMP_DURATION);
              jumpY = -Math.sin(jp * Math.PI) * SCENE_CONFIG.FOX_JUMP_HEIGHT;
            }
            foxEl.style.transform = 'translate3d(' + foxX.toFixed(1) + 'px,' + jumpY.toFixed(1) + 'px,0)';
            foxEl.classList.toggle('sc-fox-happy', foxHappyTimer > 0);

            if (foxGunEl) {
              var tiltDeg = 0;
              if (items[0]) {
                var aimX = getLaneX(items[0].lane);
                var aimY = m.startY + items[0].progress * m.travel;
                var ang = Math.atan2(aimX - foxX, Math.max(40, m.foxGunY - aimY)) * (180 / Math.PI);
                tiltDeg = Math.max(-28, Math.min(28, ang));
              }
              foxGunEl.setAttribute('transform', 'translate(44 58) rotate(' + tiltDeg.toFixed(1) + ')');
            }
          }

          // 3. 繪製貓頭鷹
          updateOwlVisual();
        }

        function tick(now) {
          if (!running) return;

          // 時間差 dt 上限 0.1 秒
          var dt = Math.min(Math.max((now - lastTime) / 1000, 0), SCENE_CONFIG.MAX_DT);
          lastTime = now;
          elapsed += dt;

          // 若容器尺寸變動，即時適應
          if (field.clientWidth > 0 && (field.clientWidth !== fieldW || field.clientHeight !== fieldH)) {
            measureField();
            updateStaticPositions();
          }

          var cfg = getTierConfig();
          var baseRate = 1 / cfg.fallSeconds;
          var reduced = isReducedMotion();
          var m = getVerticalMetrics();
          var i;

          // 更新葉子蟲降落與狀態
          for (i = 0; i < items.length; i++) {
            var it = items[i];
            if (it.fadeIn < 1) {
              it.fadeIn = Math.min(1, it.fadeIn + dt * 4);
            }
            if (it.missTimer > 0) {
              it.missTimer = Math.max(0, it.missTimer - dt);
            }

            if (i === 0) {
              it.progress += baseRate * dt;
              // 目前目標觸碰蘑菇田底線：咬一口蘑菇、扣一顆愛心並重置回頂部
              if (it.progress >= 1) {
                var hitX = getLaneX(it.lane);
                it.progress = 0;
                biteMushroom(it.lane);
                spawnCelebration(hitX, m.floorY, '咬到蘑菇 -1', true);
                api.loseLife();
                // loseLife 可能立即結束該回合並呼叫 pause/stop
                if (!running) return;
              }
            } else {
              // 尚未輪到的目標：速度為目前目標 1/3，且最多前進全程 1/3
              var nextProg = it.progress + baseRate * SCENE_CONFIG.WAITING_SPEED_RATIO * dt;
              it.progress = Math.min(SCENE_CONFIG.WAITING_MAX_PROGRESS, nextProg);
            }
          }

          // 更新小狐狸水平追蹤與跳躍狀態
          if (items[0]) {
            foxTargetX = getLaneX(items[0].lane);
          }
          if (reduced) {
            foxX = foxTargetX;
          } else {
            foxX += (foxTargetX - foxX) * (1 - Math.exp(-SCENE_CONFIG.FOX_SMOOTH * dt));
          }
          if (foxJumpTimer > 0) foxJumpTimer = Math.max(0, foxJumpTimer - dt);
          if (foxHappyTimer > 0) foxHappyTimer = Math.max(0, foxHappyTimer - dt);

          // 更新貓頭鷹 2 秒慶祝倒數
          if (owlTimer > 0) {
            owlTimer = Math.max(0, owlTimer - dt);
          }

          // 更新柔和暖黃光柱（0.25 秒，不閃爍）
          for (i = beams.length - 1; i >= 0; i--) {
            var b = beams[i];
            b.age += dt;
            if (b.age >= b.duration) {
              b.el.remove();
              beams.splice(i, 1);
            } else {
              var bp = b.age / b.duration;
              var bAlpha = bp < 0.55 ? 0.92 : (1 - (bp - 0.55) / 0.45) * 0.92;
              b.el.setAttribute('opacity', Math.max(0, bAlpha).toFixed(2));
            }
          }

          // 更新害羞爬回樹冠的葉子蟲
          for (i = retreats.length - 1; i >= 0; i--) {
            var r = retreats[i];
            r.age += dt;
            if (r.age >= r.duration) {
              r.el.remove();
              retreats.splice(i, 1);
            } else {
              var rp = r.age / r.duration;
              var ease = 1 - Math.pow(1 - rp, 2);
              var ry = r.startY + (r.endY - r.startY) * ease;
              var rx = r.x + (r.reduced ? 0 : Math.sin(rp * Math.PI * 4) * 3);
              var rAlpha = rp > 0.65 ? (1 - (rp - 0.65) / 0.35) : 1;
              r.el.style.transform = 'translate3d(' + rx.toFixed(1) + 'px,' + ry.toFixed(1) + 'px,0)';
              r.el.style.opacity = Math.max(0, rAlpha).toFixed(2);
              r.silkEl.style.height = Math.max(0, ry - 12 - r.canopyY).toFixed(1) + 'px';
            }
          }

          // 更新飄落的剪紙葉子
          for (i = fallingLeaves.length - 1; i >= 0; i--) {
            var fl = fallingLeaves[i];
            fl.age += dt;
            if (fl.age >= fl.duration) {
              fl.el.remove();
              fallingLeaves.splice(i, 1);
            } else {
              var fp = fl.age / fl.duration;
              var lx = fl.x + (fl.reduced ? 0 : Math.sin(fp * Math.PI * 2.2) * 18 * fl.driftDir);
              var ly = fl.y + (fl.reduced ? 0 : fp * 58);
              var lRot = fl.reduced ? 0 : Math.sin(fp * Math.PI * 2.2) * 22 * fl.driftDir;
              var lAlpha = fp < 0.35 ? 1 : 1 - (fp - 0.35) / 0.65;
              fl.el.style.transform = 'translate3d(' + lx.toFixed(1) + 'px,' + ly.toFixed(1) + 'px,0) rotate(' + lRot.toFixed(1) + 'deg)';
              fl.el.style.opacity = Math.max(0, lAlpha).toFixed(2);
            }
          }

          // 更新小星星與浮動文字
          for (i = particles.length - 1; i >= 0; i--) {
            var p = particles[i];
            p.age += dt;
            if (p.age >= p.duration) {
              p.el.remove();
              particles.splice(i, 1);
            } else {
              var pp = p.age / p.duration;
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              if (p.kind === 'star') {
                p.vy += 120 * dt; // 柔和重力弧線
              }
              var pAlpha = pp < 0.45 ? 1 : 1 - (pp - 0.45) / 0.55;
              if (p.kind === 'star') {
                var sScale = 1 - pp * 0.35;
                p.el.style.transform = 'translate3d(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px,0) rotate(' + (p.rot + pp * 90).toFixed(1) + 'deg) scale(' + sScale.toFixed(2) + ')';
              } else {
                p.el.style.transform = 'translate3d(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px,0) translate(-50%,-50%)';
              }
              p.el.style.opacity = Math.max(0, pAlpha).toFixed(2);
            }
          }

          renderAll();
          rafId = requestAnimationFrame(tick);
        }

        function stopLoop() {
          running = false;
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = 0;
          }
          if (stageEl) {
            stageEl.classList.add('sc-paused');
          }
        }

        /* ---------------------------------------------------------
           對接共用核心 TypingIsland 的場景生命週期介面
           --------------------------------------------------------- */
        return {
          start: function () {
            if (!mounted) {
              buildStageDom();
              mounted = true;
            }
            measureField();
            updateStaticPositions();
            foxX = getLaneX(2);
            foxTargetX = foxX;
            renderAll();
          },

          roundStart: function () {
            if (!mounted) {
              buildStageDom();
              mounted = true;
            }
            measureField();
            updateStaticPositions();
            clearAllDynamicState();
            syncTargets(true);
            renderAll();
          },

          resume: function () {
            if (running) return;
            running = true;
            if (stageEl) stageEl.classList.remove('sc-paused');
            lastTime = performance.now();
            rafId = requestAnimationFrame(tick);
          },

          pause: function () {
            stopLoop();
          },

          stop: function () {
            stopLoop();
          },

          hit: function (res) {
            var correctCount = (res && res.correct > 0) ? res.correct : 1;
            var m = getVerticalMetrics();
            var i;

            // 將打對的前 res.correct 個葉子蟲移走並播放光柱與害羞退場
            for (i = 0; i < correctCount && items.length > 0; i++) {
              var hitItem = items.shift();
              var hx = getLaneX(hitItem.lane);
              var hy = m.startY + hitItem.progress * m.travel;
              lastClearedLane = hitItem.lane;

              spawnBeam(foxX, m.foxGunY, hx, hy);
              spawnHitRetreatAndLeaf(hx, hy, m.canopyY);
              if (i === correctCount - 1) {
                spawnCelebration(hx, hy, '✓ +' + correctCount, false);
              }
              if (hitItem.el) hitItem.el.remove();
            }

            // 小狐狸開心跳一下與彎眼回饋
            foxJumpTimer = SCENE_CONFIG.FOX_JUMP_DURATION;
            foxHappyTimer = SCENE_CONFIG.FOX_HAPPY_DURATION;

            // 每 10 連擊：樹上的貓頭鷹睜眼說「守得好！」（2 秒後消失）
            var combo = (res && typeof res.combo === 'number') ? res.combo : api.combo();
            var milestone = Math.floor(combo / SCENE_CONFIG.OWL_COMBO_STEP);
            if (combo >= SCENE_CONFIG.OWL_COMBO_STEP && milestone > lastOwlMilestone) {
              lastOwlMilestone = milestone;
              owlTimer = SCENE_CONFIG.OWL_SHOW_SECONDS;
            }

            // 重新與 api.upcoming 對齊補上新葉子蟲
            syncTargets(false);
            renderAll();
          },

          miss: function () {
            // 連擊中斷後重置貓頭鷹里程碑，讓下次再達 10 連擊可再次鼓勵
            if (api.combo() < SCENE_CONFIG.OWL_COMBO_STEP) {
              lastOwlMilestone = 0;
            }
            if (items[0]) {
              items[0].missTimer = SCENE_CONFIG.MISS_DURATION;
            }
            renderAll();
          },

          resize: function () {
            if (!mounted) return;
            measureField();
            updateStaticPositions();
            if (items[0]) {
              foxTargetX = getLaneX(items[0].lane);
              foxX = foxTargetX;
            }
            renderAll();
          }
        };
      }
    });
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
</body></html>
