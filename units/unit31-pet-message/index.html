<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寵物收到怪訊息 - 小常識島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Baloo+2:wght@700;800&display=swap">
  <link rel="stylesheet" href="../../assets/css/smart-island.css">
  <style>
    /* ===== 場景專屬樣式（全數以 sc- 開頭，不動 .sm- 共用樣式） ===== */
    .sc-stage {
      position: relative;
      width: 1366px;
      height: 591px;
      overflow: hidden;
      color: var(--ink);
      user-select: none;
    }

    /* ----- 左欄：寵物平板聊天 App ----- */
    .sc-tablet {
      position: absolute;
      left: 26px;
      top: 18px;
      width: 470px;
      height: 554px;
      padding: 12px 14px 14px;
      background: #FFF9F2;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }
    .sc-tab-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 28px;
      padding: 0 8px 6px;
      color: var(--ink2);
      font-size: 16px;
      font-weight: 700;
    }
    .sc-tab-time {
      font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
    }
    .sc-tab-cam {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--edge);
      border: 2px solid var(--ink2);
    }
    .sc-tab-icons {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sc-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #FAF3EB;
      border: 3px solid var(--edge);
      border-radius: 20px;
      overflow: hidden;
    }
    .sc-chat-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--lilac);
      border-bottom: 2px solid var(--edge);
    }
    .sc-avatar {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 50%;
      background: #FFF9F2;
      border: 2.5px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .sc-avatar svg {
      width: 40px;
      height: 40px;
      display: block;
    }
    .sc-head-info {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sc-sender {
      font-size: 19px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sc-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
      color: var(--ink);
      border: 2px solid var(--edge);
      background: var(--butter);
    }
    .sc-badge.sc-b-warn {
      background: var(--bad-soft);
      border-color: #E6A99F;
    }
    .sc-badge.sc-b-info {
      background: var(--sky);
      border-color: #A7CBEF;
    }
    .sc-badge.sc-b-soft {
      background: var(--mint);
      border-color: #9AD3B3;
    }
    .sc-badge svg {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
    }

    .sc-chat-body {
      flex: 1;
      padding: 14px 14px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      overflow: hidden;
    }
    .sc-msg-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      animation: sc-pop-in 0.22s ease-out both;
    }
    .sc-msg-row.sc-me {
      align-items: flex-end;
    }
    .sc-msg-meta {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink2);
      padding: 0 6px;
    }
    .sc-msg-bub {
      max-width: 92%;
      padding: 12px 15px;
      border-radius: 18px 18px 18px 6px;
      background: #FFFFFF;
      border: 2.5px solid var(--edge);
      box-shadow: 0 4px 0 rgba(233, 213, 196, 0.55);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--ink);
    }
    .sc-msg-row.sc-me .sc-msg-bub {
      border-radius: 18px 18px 6px 18px;
      background: var(--lilac);
      border-color: #C5B3EE;
    }
    .sc-msg-row.sc-alt .sc-msg-bub {
      background: #FFF9F2;
    }

    /* 聊天訊息內的附件圖卡（僅示意，不可點擊） */
    .sc-attach {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 14px;
      background: #FFF9F2;
      border: 2px dashed var(--ink2);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sc-attach.sc-a-warn {
      background: var(--bad-soft);
      border-color: var(--bad);
    }
    .sc-attach.sc-a-butter {
      background: var(--butter);
      border-color: var(--orange-d);
    }
    .sc-attach.sc-a-sky {
      background: var(--sky);
      border-color: var(--violet);
    }
    .sc-attach-ic {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 12px;
      background: #FFFFFF;
      border: 2px solid var(--edge);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sc-attach-ic svg {
      width: 32px;
      height: 32px;
    }
    .sc-attach-txt {
      min-width: 0;
      flex: 1;
    }
    .sc-attach-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.3;
    }
    .sc-attach-sub {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink2);
      line-height: 1.25;
      word-break: break-all;
    }

    .sc-chat-foot {
      padding: 10px 12px;
      background: #FFF9F2;
      border-top: 2px solid var(--edge);
    }
    .sc-fake-input {
      height: 42px;
      padding: 0 14px;
      border-radius: 999px;
      background: #FAF3EB;
      border: 2px solid var(--edge);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink2);
      white-space: nowrap;
      overflow: hidden;
    }

    /* ----- 中欄：題目卡與 3 張選項卡 ----- */
    .sc-main {
      position: absolute;
      left: 516px;
      top: 18px;
      width: 520px;
      height: 554px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .sc-qcard {
      height: 124px;
      padding: 14px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }
    .sc-qmeta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .sc-lv-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 12px;
      border-radius: 999px;
      background: var(--violet);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }
    .sc-hint-pill {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink2);
      white-space: nowrap;
    }
    .sc-qtext {
      margin: 0;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.38;
      color: var(--ink);
    }

    .sc-opts {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sc-opt {
      flex: 1;
      min-height: 122px;
      width: 100%;
      padding: 14px 20px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      cursor: pointer;
      color: var(--ink);
      font-family: inherit;
      transition: transform 0.18s ease-out, border-color 0.18s ease-out, background-color 0.18s ease-out;
    }
    .sc-opt:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--orange);
    }
    .sc-opt:active:not(:disabled) {
      transform: translateY(2px);
    }
    .sc-opt:focus-visible {
      outline: 4px solid var(--violet);
      outline-offset: 3px;
    }
    .sc-opt:disabled {
      cursor: default;
    }
    .sc-opt-num {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border-radius: 50%;
      background: var(--violet);
      color: #FFFFFF;
      font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
      font-size: 23px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.16);
    }
    .sc-opt-txt {
      flex: 1;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--ink);
    }
    .sc-opt.sc-is-ok {
      background: var(--ok-soft);
      border-color: var(--ok);
    }
    .sc-opt.sc-is-ok .sc-opt-num {
      background: var(--ok);
    }
    .sc-opt.sc-is-bad {
      background: var(--bad-soft);
      border-color: var(--bad);
    }
    .sc-opt.sc-is-bad .sc-opt-num {
      background: var(--bad);
    }
    .sc-opt.sc-dim {
      opacity: 0.62;
    }

    /* ----- 右欄：寵物陪伴區 ----- */
    .sc-petbox {
      position: absolute;
      left: 1054px;
      top: 18px;
      width: 288px;
      height: 554px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 10px;
      box-sizing: border-box;
    }
    .sc-bubble {
      position: relative;
      width: 100%;
      padding: 16px 18px;
      margin-bottom: 22px;
      box-sizing: border-box;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.48;
      color: var(--ink);
      background: #FFF9F2;
    }
    .sc-bubble::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -14px;
      transform: translateX(-50%) rotate(45deg);
      width: 22px;
      height: 22px;
      background: #FFF9F2;
      border-right: 3px solid var(--edge);
      border-bottom: 3px solid var(--edge);
      border-radius: 0 0 6px 0;
    }
    .sc-pet {
      width: 272px;
      height: 272px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sc-pet svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .sc-pet.sc-shake {
      animation: sc-wobble 0.36s ease-out 1;
    }
    .sc-pet-shadow {
      width: 180px;
      height: 20px;
      margin-top: -10px;
      border-radius: 50%;
      background: rgba(59, 35, 80, 0.12);
    }
    .sc-pet-tag {
      margin-top: 10px;
      padding: 6px 16px;
      border-radius: 999px;
      background: var(--butter);
      border: 2.5px solid var(--edge);
      font-size: 16px;
      font-weight: 900;
      color: var(--ink);
      white-space: nowrap;
    }

    @keyframes sc-pop-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes sc-wobble {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-6px); }
      55%  { transform: translateX(6px); }
      80%  { transform: translateX(-3px); }
      100% { transform: translateX(0); }
    }

    /* 護眼與動態減敏：使用者開啟減少動態時關閉所有動畫 */
    @media (prefers-reduced-motion: reduce) {
      .sc-msg-row,
      .sc-pet.sc-shake {
        animation: none !important;
      }
      .sc-opt {
        transition: none !important;
      }
    }
  </style>
</head><body>

      /* 對方頭像 */
      avatars: {

        gift: '<svg viewBox="0 0 40 40" fill="none"><rect x="9" y="16" width="22" height="16" rx="4" fill="#FFF0C4" stroke="#3B2350" stroke-width="2.4"/><rect x="7" y="12" width="26" height="6" rx="2.5" fill="#FF8F3F" stroke="#3B2350" stroke-width="2.4"/><path d="M20 12V32" stroke="#3B2350" stroke-width="2.4"/><path d="M20 12C17 7 13 8.5 14.5 12M20 12C23 7 27 8.5 25.5 12" stroke="#3B2350" stroke-width="2.2" stroke-linecap="round"/></svg>',
        system: '<svg viewBox="0 0 40 40" fill="none"><path d="M20 6L31 10.5V19.5C31 26 26.2 31 20 34C13.8 31 9 26 9 19.5V10.5L20 6Z" fill="#FCE6E1" stroke="#3B2350" stroke-width="2.4" stroke-linejoin="round"/><path d="M20 14V21.5" stroke="#B4372B" stroke-width="2.8" stroke-linecap="round"/><circle cx="20" cy="25.8" r="1.6" fill="#B4372B"/></svg>',
        chain: '<svg viewBox="0 0 40 40" fill="none"><rect x="7" y="11" width="26" height="18" rx="4" fill="#ECE3FA" stroke="#3B2350" stroke-width="2.4"/><path d="M8 13L20 22L32 13" stroke="#3B2350" stroke-width="2.4" stroke-linejoin="round"/><circle cx="20" cy="22" r="3" fill="#FF8F3F" stroke="#3B2350" stroke-width="2"/></svg>',
        friend: '<svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="17" r="7" fill="#FFE1CB" stroke="#3B2350" stroke-width="2.4"/><path d="M10 34C11.5 27.5 28.5 27.5 30 34" fill="#DDF3E6" stroke="#3B2350" stroke-width="2.4" stroke-linecap="round"/><circle cx="17.5" cy="16.5" r="1.2" fill="#3B2350"/><circle cx="22.5" cy="16.5" r="1.2" fill="#3B2350"/><path d="M17.5 20C19 21.4 21 21.4 22.5 20" stroke="#3B2350" stroke-width="2" stroke-linecap="round"/></svg>',
        group: '<svg viewBox="0 0 40 40" fill="none"><circle cx="14" cy="17" r="4.5" fill="#FFE1CB" stroke="#3B2350" stroke-width="2.2"/><circle cx="26" cy="17" r="4.5" fill="#E1EEFB" stroke="#3B2350" stroke-width="2.2"/><path d="M7.5 31C8.5 26 19.5 26 20.5 31" fill="#DDF3E6" stroke="#3B2350" stroke-width="2.2" stroke-linecap="round"/><path d="M19.5 31C20.5 26 31.5 26 32.5 31" fill="#FFF0C4" stroke="#3B2350" stroke-width="2.2" stroke-linecap="round"/></svg>',
        secret: '<svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="17" r="7" fill="#FFE1CB" stroke="#3B2350" stroke-width="2.4"/><path d="M10 34C11.5 27.5 28.5 27.5 30 34" fill="#ECE3FA" stroke="#3B2350" stroke-width="2.4" stroke-linecap="round"/><circle cx="29" cy="28" r="6" fill="#FFF0C4" stroke="#3B2350" stroke-width="2"/><path d="M27.2 28V26.5C27.2 25.5 28 24.8 29 24.8C30 24.8 30.8 25.5 30.8 26.5V28" stroke="#3B2350" stroke-width="1.8"/><rect x="26.5" y="27.8" width="5" height="3.8" rx="1" fill="#FF8F3F" stroke="#3B2350" stroke-width="1.6"/></svg>'
      },

      /* 訊息附件卡片小圖 */
      attach: {
        photo: '<svg viewBox="0 0 32 32" fill="none"><rect x="4" y="9" width="24" height="17" rx="4" fill="#ECE3FA" stroke="#3B2350" stroke-width="2.2"/><path d="M11 9L13 6H19L21 9" stroke="#3B2350" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="17.5" r="4.5" fill="#FFF9F2" stroke="#3B2350" stroke-width="2.2"/></svg>',
        gift: '<svg viewBox="0 0 32 32" fill="none"><rect x="6" y="13" width="20" height="14" rx="3" fill="#FFF0C4" stroke="#3B2350" stroke-width="2.2"/><rect x="4.5" y="9.5" width="23" height="5" rx="2" fill="#FF8F3F" stroke="#3B2350" stroke-width="2.2"/><path d="M16 9.5V27" stroke="#3B2350" stroke-width="2.2"/></svg>',
        coin: '<svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="11" fill="#FFC233" stroke="#3B2350" stroke-width="2.2"/><circle cx="16" cy="16" r="7" fill="#FFF0C4" stroke="#A8670E" stroke-width="1.8"/><path d="M16 11.5V20.5M13.5 14H18.5" stroke="#3B2350" stroke-width="2" stroke-linecap="round"/></svg>',
        link: '<svg viewBox="0 0 32 32" fill="none"><path d="M13 19L19 13" stroke="#B4372B" stroke-width="2.4" stroke-linecap="round"/><path d="M11.5 14.5L9 17C7.3 18.7 7.3 21.3 9 23C10.7 24.7 13.3 24.7 15 23L17.5 20.5" stroke="#3B2350" stroke-width="2.4" stroke-linecap="round"/><path d="M20.5 17.5L23 15C24.7 13.3 24.7 10.7 23 9C21.3 7.3 18.7 7.3 17 9L14.5 11.5" stroke="#3B2350" stroke-width="2.4" stroke-linecap="round"/></svg>',
        chain: '<svg viewBox="0 0 32 32" fill="none"><rect x="5" y="8" width="22" height="16" rx="3.5" fill="#ECE3FA" stroke="#3B2350" stroke-width="2.2"/><path d="M6 10L16 17.5L26 10" stroke="#3B2350" stroke-width="2.2"/><path d="M21 21L26 26M26 21L21 26" stroke="#B4372B" stroke-width="2.4" stroke-linecap="round"/></svg>',
        rumor: '<svg viewBox="0 0 32 32" fill="none"><path d="M7 14H12L23 8V24L12 18H7C5.8 18 5 17.2 5 16C5 14.8 5.8 14 7 14Z" fill="#FFF0C4" stroke="#3B2350" stroke-width="2.2" stroke-linejoin="round"/><path d="M26 13.5C27.5 14.8 27.5 17.2 26 18.5" stroke="#3B2350" stroke-width="2.2" stroke-linecap="round"/></svg>',
        file: '<svg viewBox="0 0 32 32" fill="none"><path d="M8 5H19L24 10V27H8V5Z" fill="#FCE6E1" stroke="#3B2350" stroke-width="2.2" stroke-linejoin="round"/><path d="M16 13V19M13 16.5L16 19.5L19 16.5" stroke="#B4372B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        oops: '<svg viewBox="0 0 32 32" fill="none"><rect x="5" y="6" width="22" height="20" rx="3.5" fill="#E1EEFB" stroke="#3B2350" stroke-width="2.2"/><circle cx="13" cy="13" r="2.5" fill="#FFC233" stroke="#3B2350" stroke-width="1.8"/><path d="M7 22L13 16.5L18 20.5L22 17.5L25 22" stroke="#3B2350" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        secret: '<svg viewBox="0 0 32 32" fill="none"><rect x="7" y="14" width="18" height="13" rx="3.5" fill="#FFF0C4" stroke="#3B2350" stroke-width="2.2"/><path d="M11 14V11C11 8.2 13.2 6 16 6C18.8 6 21 8.2 21 11V14" stroke="#3B2350" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="20.5" r="2" fill="#3B2350"/></svg>'
      }
    };

    /* HTML 字元跳脫，避免寵物名字含特殊符號破壞版面 */
    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* 將台詞裡的 {name} 替換成孩子的寵物名字 */
    function fillPetName(text, petName) {
      return String(text || '').replace(/\{name\}/g, petName || '小雲');
    }

    /* =====================================================================
       三、掛載共用外殼與本關場景邏輯
       ===================================================================== */
    SmartIsland.mount({
      unit: 31,
      title: '寵物收到怪訊息',
      grade: '3–4 年級',
      zhuyin: false,
      howto: '寵物的平板跳出好多訊息，幫牠想想怎麼回應才安全、有禮貌。',
      teach: '辨識可疑訊息、保護個資、網路禮儀｜資E12 了解並遵守資訊倫理與使用資訊科技的相關規範、資E7 使用資訊科技與他人建立良好的互動關係',
      levels: SCENE_CONFIG.LEVELS.map(function (lv) {
        return { name: lv.name, icon: SCENE_CONFIG.LEVEL_ICONS[lv.iconKey] };
      }),

      scene: function (api) {
        var alive = false;   /* 目前場景是否啟用中 */
        var locked = false;  /* 作答後立刻鎖定，防止連點兩次 */
        var runId = 0;       /* 每次 start／stop 遞增，確保舊 Promise 回呼失效 */
        var levelIdx = 0;    /* 目前關卡索引（0 起算） */
        var qIdx = 0;        /* 目前題目索引（0 起算） */
        var review = [];     /* 每題作答回顧 [{ ok, q }] */
        var timers = [];     /* 集中追蹤所有計時器，供 stop() 清理 */

        /* 清理所有計時器、事件監聽並讓未完成的 feedback 失效 */
        function cleanup() {
          alive = false;
          locked = true;
          runId++;
          while (timers.length) {
            clearTimeout(timers.pop());
          }
          api.field.onclick = null;
          document.removeEventListener('keydown', onKeyDown);
        }

        /* 計算本關星星數（依本關規則：5→3、3–4→2、0–2→1） */
        function calcStars(rightCount) {
          if (rightCount >= SCENE_CONFIG.STARS.three) return 3;
          if (rightCount >= SCENE_CONFIG.STARS.two) return 2;
          return 1;
        }

        /* 依標籤色系取用對應的 SVG 小圖示 */
        function getBadgeIcon(tone) {
          if (tone === 'warn') return ICONS.badgeWarn;
          if (tone === 'soft') return ICONS.badgeSoft;
          return ICONS.badgeInfo;
        }

        /* 渲染目前這一題的完整畫面 */
        function renderQuestion() {
          var lv = SCENE_CONFIG.LEVELS[levelIdx];
          var q = lv.questions[qIdx];
          var petInfo = api.pet ? api.pet() : { name: '小雲' };
          var petName = (petInfo && petInfo.name) ? petInfo.name : '小雲';
          var zyClass = api.zy ? ' sm-zy' : '';

          locked = false;
          api.progress(qIdx + 1, lv.questions.length);

          /* 組合聊天泡泡清單 */
          var msgsHtml = q.messages.map(function (m, idx) {
            var rowCls = 'sc-msg-row' +
              (m.from === 'me' ? ' sc-me' : (m.from === 'other2' ? ' sc-alt' : ''));
            var metaHtml = m.name ? '<div class="sc-msg-meta">' + esc(m.name) + '</div>' : '';
            var attachHtml = '';
            if (q.attach && idx === q.messages.length - 1) {
              var aTone = q.attach.tone ? (' sc-a-' + q.attach.tone) : '';
              attachHtml =
                '<div class="sc-attach' + aTone + '">' +
                  '<div class="sc-attach-ic">' + (ICONS.attach[q.attach.type] || ICONS.attach.link) + '</div>' +
                  '<div class="sc-attach-txt">' +
                    '<div class="sc-attach-title">' + esc(q.attach.title) + '</div>' +
                    '<div class="sc-attach-sub">' + esc(q.attach.sub) + '</div>' +
                  '</div>' +
                '</div>';
            }
            return (
              '<div class="' + rowCls + '">' +
                metaHtml +
                '<div class="sc-msg-bub' + zyClass + '">' + esc(m.text) + attachHtml + '</div>' +
              '</div>'
            );
          }).join('');

          /* 組合 3 張選項卡 */
          var optsHtml = q.options.map(function (opt, idx) {
            return (
              '<button type="button" class="clay sc-opt" data-idx="' + idx + '" aria-label="選項 ' + (idx + 1) + '：' + esc(opt.text) + '">' +
                '<span class="sc-opt-num sm-num" aria-hidden="true">' + (idx + 1) + '</span>' +
                '<span class="sc-opt-txt' + zyClass + '">' + esc(opt.text) + '</span>' +
              '</button>'
            );
          }).join('');

          var badgeCls = 'sc-badge sc-b-' + (q.badgeTone || 'info');
          var petLine = fillPetName(q.petLine, petName);

          api.field.innerHTML =
            '<div class="sc-stage">' +
              /* 左欄：寵物平板聊天 App */
              '<section class="clay sc-tablet" aria-label="平板訊息畫面">' +
                '<div class="sc-tab-bar">' +
                  '<span class="sc-tab-time sm-num">' + esc(q.time) + '</span>' +
                  '<span class="sc-tab-cam" aria-hidden="true"></span>' +
                  '<span class="sc-tab-icons" aria-hidden="true">' + ICONS.wifi + ICONS.battery + '</span>' +
                '</div>' +
                '<div class="sc-screen">' +
                  '<div class="sc-chat-head">' +
                    '<div class="sc-avatar" aria-hidden="true">' + (ICONS.avatars[q.avatar] || ICONS.avatars.stranger) + '</div>' +
                    '<div class="sc-head-info">' +
                      '<div class="sc-sender">' + esc(q.sender) + '</div>' +
                      '<div class="' + badgeCls + '">' + getBadgeIcon(q.badgeTone) + '<span>' + esc(q.badge) + '</span></div>' +
                    '</div>' +
                  '</div>' +
                  '<div class="sc-chat-body">' + msgsHtml + '</div>' +
                  '<div class="sc-chat-foot">' +
                    '<div class="sc-fake-input">' + ICONS.inputMsg + '<span>請幫 ' + esc(petName) + ' 從右邊選一個做法</span></div>' +
                  '</div>' +
                '</div>' +
              '</section>' +

              /* 中欄：題目卡與 3 張選項卡 */
              '<section class="sc-main" aria-label="題目與選項">' +
                '<div class="clay sc-qcard">' +
                  '<div class="sc-qmeta">' +
                    '<span class="sc-lv-pill">第 ' + (levelIdx + 1) + ' 關・' + esc(lv.name) + '</span>' +
                    '<span class="sc-hint-pill">點選最安全有禮貌的做法</span>' +
                  '</div>' +
                  '<h2 class="sc-qtext' + zyClass + '">' + esc(q.q) + '</h2>' +
                '</div>' +
                '<div class="sc-opts" role="group" aria-label="回答選項">' + optsHtml + '</div>' +
              '</section>' +

              /* 右欄：寵物陪伴與對話泡泡 */
              '<aside class="sc-petbox" aria-label="寵物夥伴">' +
                '<div class="clay sc-bubble' + zyClass + '">' + esc(petLine) + '</div>' +
                '<div class="sc-pet" id="sc-pet-slot">' + api.petSVG('normal', { q: true }) + '</div>' +
                '<div class="sc-pet-shadow" aria-hidden="true"></div>' +
                '<div class="sc-pet-tag">' + esc(petName) + ' 的平板時間</div>' +
              '</aside>' +
            '</div>';
        }

        /* 處理作答（滑鼠點擊或數字鍵 1–3 皆走這裡） */
        function handleChoice(choiceIdx) {
          if (!alive || locked) return;
          var lv = SCENE_CONFIG.LEVELS[levelIdx];
          var q = lv.questions[qIdx];
          if (choiceIdx < 0 || choiceIdx >= q.options.length) return;

          locked = true;
          var myRun = runId;
          var ok = choiceIdx === q.ans;
          var petInfo = api.pet ? api.pet() : { name: '小雲' };
          var petName = (petInfo && petInfo.name) ? petInfo.name : '小雲';

          /* 立刻鎖定全部選項並呈現 ✓／✗ 視覺狀態 */
          var btns = api.field.querySelectorAll('.sc-opt');
          for (var i = 0; i < btns.length; i++) {
            btns[i].disabled = true;
            var numEl = btns[i].querySelector('.sc-opt-num');
            if (i === choiceIdx) {
              btns[i].classList.add(ok ? 'sc-is-ok' : 'sc-is-bad');
              if (numEl) numEl.textContent = ok ? '✓' : '✗';
            } else {
              btns[i].classList.add('sc-dim');
            }
          }

          /* 更新畫面右側寵物表情，讓孩子先看到寵物反應 */
          var petSlot = api.field.querySelector('#sc-pet-slot');
          if (petSlot) {
            petSlot.innerHTML = ok
              ? api.petSVG('happy', { spark: true })
              : api.petSVG('worried', { sweat: true });
            if (!ok) petSlot.classList.add('sc-shake');
          }

          review.push({ ok: ok, q: q.q });

          /* 稍微停頓 180ms 讓孩子看見選項與寵物表情，再彈出共用回饋卡 */
          var tid = setTimeout(function () {
            if (!alive || myRun !== runId) return;
            api.feedback({
              ok: ok,
              text: ok ? fillPetName(q.praise, petName) : petName + ' 想再想想看！',
              explain: q.explain,
              zyExplain: false
            }).then(function () {
              /* 若中途離開此關，直接結束不執行後續動作 */
              if (!alive || myRun !== runId) return;
              qIdx++;
              if (qIdx < lv.questions.length) {
                renderQuestion();
                return;
              }
              /* 整關完成：計算星星並交給共用結算畫面（寬鬆過關，至少 1 顆星） */
              var right = review.filter(function (r) { return r.ok; }).length;
              var finishData = {
                stars: calcStars(right),
                review: review,
                learned: lv.learned
              };
              if (right < lv.questions.length) {
                finishData.retry = lv.retry;
              }
              api.finish(finishData);
            });
          }, 180);
          timers.push(tid);
        }

        /* 鍵盤快速鍵：按 1、2、3 也能選答，方便電腦教室操作 */
        function onKeyDown(e) {
          if (!alive || locked) return;
          if (e.key === '1' || e.key === '2' || e.key === '3') {
            handleChoice(parseInt(e.key, 10) - 1);
          }
        }

        return {
          start: function (lvIdx) {
            cleanup();
            var idx = typeof lvIdx === 'number' ? lvIdx : (api.levelIndex ? api.levelIndex() : 0);
            if (idx < 0 || idx >= SCENE_CONFIG.LEVELS.length) idx = 0;
            levelIdx = idx;
            qIdx = 0;
            review = [];
            alive = true;
            locked = false;

            api.field.innerHTML = '';
            api.field.onclick = function (e) {
              var btn = e.target.closest('.sc-opt');
              if (!btn || !alive || locked) return;
              handleChoice(parseInt(btn.getAttribute('data-idx'), 10));
            };
            document.addEventListener('keydown', onKeyDown);

            renderQuestion();
          },
          stop: function () {
            cleanup();
          }
        };
      }
    });
  })();
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
