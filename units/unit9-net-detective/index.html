  <link rel="preconnect" href="https://fonts.googleapis.com">

    /* ===== 寵物警察訓練場景樣式（一律以 sc- 開頭，不覆寫 .sm- 樣式） ===== */
    .sc-wrap {
      position: relative;
      width: 1366px;
      height: 591px;
      overflow: hidden;
      font-family: 'Noto Sans TC', sans-serif;
      color: var(--ink);
    }

    /* 左側主任務區：導言條 ＋ 大情境卡 ＋ 安全／危險大按鈕 */
    .sc-main {
      position: absolute;
      left: 34px;
      top: 18px;
      width: 892px;
      height: 554px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 關卡任務導言條 */
    .sc-mission {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 20px;
      background: var(--lilac);
      border: 3px solid var(--edge);
      border-radius: 20px;
      box-shadow: inset 0 2px 0 #fff, 0 4px 0 rgba(59, 35, 80, .08);
      min-height: 54px;
      box-sizing: border-box;
    }
    .sc-lv-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      background: var(--violet);
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sc-mission-text {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.35;
    }

    /* 中央大情境卡（SVG 插圖 ＋ 案件來源標籤 ＋ 情境描述） */
    .sc-case {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 24px 30px;
      background: var(--card);
      box-sizing: border-box;
      position: relative;
    }
    .sc-art-frame {
      width: 286px;
      height: 224px;
      flex-shrink: 0;
      border-radius: 22px;
      background: var(--sky);
      border: 3px solid var(--edge);
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, .85), inset 0 -4px 0 rgba(59, 35, 80, .06);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
    }
    .sc-art-frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sc-case-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      min-width: 0;
    }
    .sc-case-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .sc-source-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      background: var(--butter);
      border: 2px solid #E8C574;
      color: var(--ink);
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
    }
    .sc-case-num {
      font-family: var(--f-num, 'Baloo 2', 'Noto Sans TC', sans-serif);
      font-size: 18px;
      font-weight: 800;
      color: var(--ink2);
      white-space: nowrap;
    }
    .sc-question {
      margin: 0;
      font-size: 27px;
      font-weight: 900;
      line-height: 1.5;
      color: var(--ink);
      letter-spacing: .01em;
    }
    .sc-ask-line {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      color: var(--ink2);
    }

    /* 下方兩個大判斷按鈕（安全 ✓ ／ 危險 ✗，皆 >= 220x80） */
    .sc-choices {
      display: flex;
      gap: 24px;
      height: 98px;
      flex-shrink: 0;
    }
    .sc-choice-btn {
      flex: 1;
      min-width: 240px;
      min-height: 88px;
      border-radius: 22px;
      border: 3px solid var(--edge);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 30px;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
      transition: transform .18s ease-out, box-shadow .18s ease-out, filter .18s ease-out;
      padding: 0 28px;
      box-sizing: border-box;
    }
    .sc-choice-btn svg {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }
    .sc-choice-btn .sc-keyhint {
      font-family: var(--f-num, 'Baloo 2', 'Noto Sans TC', sans-serif);
      font-size: 17px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .72);
      color: var(--ink);
      border: 2px solid rgba(59, 35, 80, .18);
      white-space: nowrap;
    }
    .sc-choice-safe {
      background: var(--ok-soft);
      border-color: var(--ok);
      color: var(--ok);
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, .9), inset 0 -5px 0 rgba(24, 107, 65, .18), 0 7px 0 #186B41, 0 12px 20px rgba(24, 107, 65, .16);
    }
    .sc-choice-danger {
      background: var(--bad-soft);
      border-color: var(--bad);
      color: var(--bad);
      box-shadow: inset 0 3px 0 rgba(255, 255, 255, .9), inset 0 -5px 0 rgba(180, 55, 43, .18), 0 7px 0 #B4372B, 0 12px 20px rgba(180, 55, 43, .16);
    }
    .sc-choice-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.02);
    }
    .sc-choice-btn:active:not(:disabled) {
      transform: translateY(3px);
    }
    .sc-choice-btn:focus-visible,
    .sc-sound-btn:focus-visible {
      outline: 4px solid var(--violet);
      outline-offset: 3px;
    }
    .sc-choice-btn:disabled {
      cursor: default;
      opacity: .72;
    }
    .sc-choice-btn.sc-picked {
      opacity: 1;
      transform: translateY(2px);
    }

    .sc-petzone {
      position: absolute;
      left: 948px;
      top: 16px;
      width: 386px;
      height: 556px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;

    .sc-badge-bar {

      align-items: center;
      gap: 10px;
      padding: 7px 16px 7px 10px;
      border-radius: 999px;
      background: var(--butter);

      box-shadow: inset 0 2px 0 rgba(255, 255, 255, .9), 0 5px 0 rgba(168, 103, 14, .18);
      transition: transform .25s ease-out, box-shadow .25s ease-out;

    .sc-badge-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;

      width: 40px;
      height: 40px;
      display: block;
    }

      font-weight: 900;
      color: var(--ink);

      background: #fff;
      color: var(--violet-d);
      border: 2px solid #D5C5F2;
      white-space: nowrap;
    }

    .sc-badge-bar.sc-glow {
      animation: scBadgeGlow .58s ease-out 1;
    }
    @keyframes scBadgeGlow {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 194, 51, .75); }
      45% { transform: scale(1.08); box-shadow: 0 0 0 14px rgba(255, 194, 51, .35); }
      100% { transform: scale(1); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .9), 0 5px 0 rgba(168, 103, 14, .18); }
    }

    /* 寵物對話泡泡 */
    .sc-bubble {
      width: 356px;
      min-height: 82px;
      padding: 14px 20px;
      box-sizing: border-box;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.42;
      color: var(--ink);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--card);
    }
    .sc-bubble::after {
      content: '';
      position: absolute;
      bottom: -13px;
      left: 50%;
      width: 20px;
      height: 20px;
      background: var(--card);
      border-right: 3px solid var(--edge);
      border-bottom: 3px solid var(--edge);
      transform: translateX(-50%) rotate(45deg);
    }

    /* 寵物本體舞台（290x290 px） */
    .sc-pet-stage {
      width: 290px;
      height: 290px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .sc-pet-stage svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    /* 答錯時輕輕搖一下（單次短動畫） */
    .sc-pet-stage.sc-shake {
      animation: scPetShake .34s ease-in-out 1;
    }
    @keyframes scPetShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px) rotate(-2deg); }
      75% { transform: translateX(7px) rotate(2deg); }
    }

    /* 寵物名牌膠囊 */
    .sc-pet-plate {
      padding: 6px 18px;
      border-radius: 999px;
      background: var(--card);
      border: 3px solid var(--edge);
      font-size: 18px;
      font-weight: 900;
      color: var(--ink);
      white-space: nowrap;
      box-shadow: 0 4px 0 rgba(59, 35, 80, .08);
    }

    /* 右下角音效開關按鈕（預設關閉，>= 44x44px） */
    .sc-sound-btn {
      position: absolute;
      right: 22px;
      bottom: 18px;
      min-width: 52px;
      height: 52px;
      padding: 0 14px;
      border-radius: 18px;
      border: 3px solid var(--edge);
      background: var(--card);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: inset 0 2px 0 #fff, 0 5px 0 #EBD6C5;
      transition: transform .18s ease-out, background .18s ease-out;
    }
    .sc-sound-btn svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }
    .sc-sound-btn[aria-pressed="true"] {
      background: var(--butter);
      border-color: #E5BC63;
    }
    .sc-sound-btn:hover {
      transform: translateY(-2px);
    }
    .sc-sound-btn:active {
      transform: translateY(2px);
    }

    /* 護眼與動態減弱偏好設定 */
    @media (prefers-reduced-motion: reduce) {
      .sc-choice-btn,
      .sc-badge-bar,
      .sc-sound-btn {
        transition: none;
      }
      .sc-badge-bar.sc-glow,
      .sc-pet-stage.sc-shake {
        animation: none;
      }
    }
  </style>

      logout: '<svg viewBox="0 0 260 200" fill="none"><rect x="24" y="20" width="212" height="142" rx="18" fill="#FFF9F2" stroke="#3B2350" stroke-width="4"/><rect x="64" y="42" width="76" height="98" rx="12" fill="#DDF3E6" stroke="#186B41" stroke-width="3.6"/><circle cx="122" cy="92" r="5" fill="#186B41"/><path d="M116 92h74M172 74l20 18-20 18" stroke="#186B41" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 162h52M88 178h84" stroke="#3B2350" stroke-width="5" stroke-linecap="round"/></svg>',

      fakeSupport: '<svg viewBox="0 0 260 200" fill="none"><rect x="24" y="22" width="212" height="156" rx="20" fill="#FFF9F2" stroke="#3B2350" stroke-width="4"/><circle cx="78" cy="92" r="28" fill="#ECE3FA" stroke="#3B2350" stroke-width="3.5"/><path d="M58 66l8-16 12 10 12-10 8 16H58z" fill="#FFF0C4" stroke="#3B2350" stroke-width="2.8" stroke-linejoin="round"/><circle cx="70" cy="90" r="3" fill="#3B2350"/><circle cx="86" cy="90" r="3" fill="#3B2350"/><path d="M70 104h16" stroke="#3B2350" stroke-width="3" stroke-linecap="round"/><rect x="118" y="48" width="98" height="58" rx="14" fill="#FCE6E1" stroke="#B4372B" stroke-width="3.2"/><path d="M167 60v18" stroke="#B4372B" stroke-width="5" stroke-linecap="round"/><circle cx="167" cy="89" r="3.5" fill="#B4372B"/><rect x="118" y="118" width="98" height="36" rx="12" fill="#B4372B" stroke="#3B2350" stroke-width="3"/><rect x="136" y="132" width="62" height="8" rx="4" fill="#fff"/></svg>',

      closeTab: '<svg viewBox="0 0 260 200" fill="none"><rect x="24" y="22" width="184" height="132" rx="16" fill="#FFF9F2" stroke="#3B2350" stroke-width="4"/><rect x="42" y="42" width="110" height="72" rx="12" fill="#FCE6E1" stroke="#B4372B" stroke-width="3"/><rect x="76" y="66" width="116" height="74" rx="12" fill="#FFF0C4" stroke="#3B2350" stroke-width="3"/><circle cx="196" cy="54" r="26" fill="#186B41" stroke="#3B2350" stroke-width="3.6"/><path d="M186 44l20 20M206 44l-20 20" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><rect x="128" y="150" width="108" height="32" rx="16" fill="#DDF3E6" stroke="#186B41" stroke-width="3"/><path d="M148 166l8 8 16-16" stroke="#186B41" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="180" y="162" width="40" height="8" rx="4" fill="#186B41"/></svg>',

      kidShield: '<svg viewBox="0 0 260 200" fill="none"><rect x="34" y="22" width="192" height="156" rx="22" fill="#FFF9F2" stroke="#3B2350" stroke-width="4"/><rect x="50" y="38" width="160" height="124" rx="14" fill="#E1EEFB" stroke="#3B2350" stroke-width="3"/><path d="M130 48l42 15v32c0 25-17 42-42 52-25-10-42-27-42-52V63l42-15z" fill="#DDF3E6" stroke="#186B41" stroke-width="4" stroke-linejoin="round"/><path d="M112 100l13 13 24-26" stroke="#186B41" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    /* =====================================================================
     * 掛載小常識島第 9 關：寵物警察訓練
     * ===================================================================== */
    SmartIsland.mount({
      unit: 9,
      title: '寵物警察訓練',
      grade: '3–4 年級',
      howto: '寵物要考網路小警察！判斷每個情況是安全還是危險。',
      zhuyin: false,
      teach: '判斷網路情境安不安全｜資E12 了解並遵守資訊倫理與使用資訊科技的相關規範',
      levels: SCENE_CONFIG.LEVELS.map(function (lv) {
        return { name: lv.name, icon: lv.icon };
      }),
      scene: function (api) {
        var alive = false;
        var locked = false;
        var levelIdx = 0;
        var qIdx = 0;
        var review = [];
        var timers = [];
        var soundOn = false;
        var audioCtx = null;
        var reducedMotion = false;

        // 檢查系統是否偏好減少動態
        function checkReducedMotion() {
          return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        }

        // 安全註冊計時器，方便 stop() 一併清空
        function later(fn, ms) {
          var id = window.setTimeout(function () {
            timers = timers.filter(function (t) { return t !== id; });
            if (alive) fn();
          }, ms);
          timers.push(id);
          return id;
        }

        // 清空所有計時器
        function clearTimers() {
          for (var k = 0; k < timers.length; k++) {
            window.clearTimeout(timers[k]);
          }
          timers = [];
        }

        // 關閉並釋放 Web Audio Context
        function closeAudio() {
          if (audioCtx) {
            try { audioCtx.close(); } catch (err) {}
            audioCtx = null;
          }
        }

        // 簡單溫和的 Web Audio 提示音（預設關閉，需使用者開啟右下角喇叭）
        function playTone(kind) {
          if (!soundOn) return;
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          try {
            if (!audioCtx) audioCtx = new AC();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            var now = audioCtx.currentTime;
            var notes = kind === 'ok'
              ? [523.25, 659.25, 783.99] // 輕快上揚和弦音
              : kind === 'bad'
                ? [349.23, 293.66]       // 溫和提醒兩音
                : [587.33];              // 開關確認音
            for (var n = 0; n < notes.length; n++) {
              var osc = audioCtx.createOscillator();
              var gain = audioCtx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(notes[n], now + n * 0.08);
              gain.gain.setValueAtTime(0.001, now + n * 0.08);
              gain.gain.linearRampToValueAtTime(0.07, now + n * 0.08 + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.001, now + n * 0.08 + 0.16);
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(now + n * 0.08);
              osc.stop(now + n * 0.08 + 0.18);
            }
          } catch (err) {}
        }

        // 取得目前寵物名稱（安全防呆）
        function getPetName() {
          var p = api.pet && api.pet();
          return (p && p.name) ? p.name : '小雲';
        }

        // 計算目前已答對題數
        function countRight() {
          var c = 0;
          for (var r = 0; r < review.length; r++) {
            if (review[r].ok) c++;
          }
          return c;
        }

        // 繪製目前題目畫面
        function renderQuestion() {
          var lv = SCENE_CONFIG.LEVELS[levelIdx];
          var Q = lv.questions[qIdx];
          var total = lv.questions.length;
          var petName = getPetName();
          locked = false;

          // 通知外殼更新頂欄進度
          api.progress(qIdx + 1, total);

          // 第一題用關卡開場語，其餘題帶入寵物視角
          var bubbleText = qIdx === 0
            ? petName + '戴上警徽囉！' + Q.petSay
            : Q.petSay;

          api.field.innerHTML =
            '<div class="sc-wrap">' +
              '<div class="sc-main">' +
                '<div class="sc-mission">' +
                  '<span class="sc-lv-pill">第 ' + (levelIdx + 1) + ' 關・' + lv.name + '</span>' +
                  '<p class="sc-mission-text">' + lv.intro + '</p>' +
                '</div>' +

                '<div class="clay sc-case">' +
                  '<div class="sc-art-frame">' + (PIC[Q.pic] || '') + '</div>' +
                  '<div class="sc-case-body">' +
                    '<div class="sc-case-meta">' +
                      '<span class="sc-source-chip">' + Q.tag + '</span>' +
                      '<span class="sc-case-num">案件 #' + (qIdx + 1) + ' / ' + total + '</span>' +
                    '</div>' +
                    '<p class="sc-question">' + Q.q + '</p>' +
                    '<p class="sc-ask-line">請幫' + petName + '判斷：這個情況是安全還是危險？</p>' +
                  '</div>' +
                '</div>' +

                '<div class="sc-choices">' +
                  '<button type="button" class="sc-choice-btn sc-choice-safe" data-choice="0" aria-label="安全">' +
                    UI_SVG.safe +
                    '<span>' + Q.options[0].text + ' ✓</span>' +
                    '<span class="sc-keyhint">1</span>' +
                  '</button>' +
                  '<button type="button" class="sc-choice-btn sc-choice-danger" data-choice="1" aria-label="危險">' +
                    UI_SVG.danger +
                    '<span>' + Q.options[1].text + ' ✗</span>' +
                    '<span class="sc-keyhint">2</span>' +
                  '</button>' +
                '</div>' +
              '</div>' +

              '<div class="sc-petzone">' +
                '<div class="sc-badge-bar" id="sc-badge">' +
                  '<span class="sc-badge-icon">' + UI_SVG.badge + '</span>' +
                  '<span class="sc-badge-text">小警察徽章</span>' +
                  '<span class="sc-badge-score" id="sc-score">' + countRight() + ' / ' + total + '</span>' +
                '</div>' +
                '<div class="clay sc-bubble" id="sc-bubble">' + bubbleText + '</div>' +
                '<div class="sc-pet-stage" id="sc-pet">' + api.petSVG('normal', { q: true }) + '</div>' +
                '<div class="sc-pet-plate">實習警探・' + petName + '</div>' +
              '</div>' +

              '<button type="button" class="sc-sound-btn" id="sc-sound" aria-pressed="' + (soundOn ? 'true' : 'false') + '" aria-label="切換提示音效">' +
                (soundOn ? UI_SVG.soundOn : UI_SVG.soundOff) +
                '<span>' + (soundOn ? '音效開' : '音效關') + '</span>' +
              '</button>' +
            '</div>';
        }

        // 更新喇叭按鈕顯示
        function updateSoundButton() {
          var btn = api.field.querySelector('#sc-sound');
          if (!btn) return;
          btn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
          btn.innerHTML = (soundOn ? UI_SVG.soundOn : UI_SVG.soundOff) +
            '<span>' + (soundOn ? '音效開' : '音效關') + '</span>';
        }

        // 處理作答（立即鎖定選項，顯示寵物反應與警徽動畫，再呼叫共用回饋卡）
        function submitChoice(choiceIdx) {
          if (!alive || locked) return;
          locked = true;

          var lv = SCENE_CONFIG.LEVELS[levelIdx];
          var Q = lv.questions[qIdx];
          var total = lv.questions.length;
          var ok = (choiceIdx === Q.ans);
          var petName = getPetName();

          review.push({ ok: ok, q: Q.q });

          // 鎖住所有選項按鈕並標示已選項目
          var btns = api.field.querySelectorAll('.sc-choice-btn');
          for (var b = 0; b < btns.length; b++) {
            btns[b].disabled = true;
            if (Number(btns[b].getAttribute('data-choice')) === choiceIdx) {
              btns[b].classList.add('sc-picked');
            }
          }

          // 更新右側寵物表情、對話與警徽發亮
          var petEl = api.field.querySelector('#sc-pet');
          var bubbleEl = api.field.querySelector('#sc-bubble');
          var badgeEl = api.field.querySelector('#sc-badge');
          var scoreEl = api.field.querySelector('#sc-score');

          if (scoreEl) scoreEl.textContent = countRight() + ' / ' + total;

          if (ok) {
            playTone('ok');
            if (petEl) petEl.innerHTML = api.petSVG('happy', { spark: true });
            if (bubbleEl) bubbleEl.textContent = '太棒了！' + petName + '的警察徽章發亮囉！';
            if (badgeEl && !reducedMotion) {
              badgeEl.classList.remove('sc-glow');
              void badgeEl.offsetWidth;
              badgeEl.classList.add('sc-glow');
            }
          } else {
            playTone('bad');
            if (petEl) {
              petEl.innerHTML = api.petSVG('worried', { sweat: true });
              if (!reducedMotion) {
                petEl.classList.remove('sc-shake');
                void petEl.offsetWidth;
                petEl.classList.add('sc-shake');
              }
            }
            if (bubbleEl) bubbleEl.textContent = '沒關係！' + petName + '陪你一起看懂這題！';
          }

          // 短暫呈現寵物即時反應後跳出共用回饋卡（答錯也能繼續，寬鬆過關）
          var delay = reducedMotion ? 0 : 280;
          later(function () {
            api.feedback({
              ok: ok,
              explain: Q.explain,
              zyExplain: false
            }).then(function () {
              if (!alive) return;
              qIdx++;
              if (qIdx < total) {
                renderQuestion();
                return;
              }
              // 整關完成：依規則計算星星並交給共用結算畫面
              var right = countRight();
              var stars = right >= SCENE_CONFIG.STARS.THREE ? 3
                : right >= SCENE_CONFIG.STARS.TWO ? 2 : 1;
              api.finish({
                stars: stars,
                review: review,
                learned: lv.learned,
                retry: right < total ? '答錯的情境再練習一次，會更有把握喔！' : ''
              });
            });
          }, delay);
        }

        // 點擊事件代理（選項與音效開關）
        function onFieldClick(e) {
          if (!alive) return;
          var soundBtn = e.target.closest('#sc-sound');
          if (soundBtn) {
            soundOn = !soundOn;
            if (!soundOn) {
              closeAudio();
            } else {
              playTone('toggle');
            }
            updateSoundButton();
            return;
          }
          var choiceBtn = e.target.closest('.sc-choice-btn');
          if (choiceBtn && !locked) {
            submitChoice(Number(choiceBtn.getAttribute('data-choice')));
          }
        }

        // 鍵盤快速作答（1 = 安全，2 = 危險），stop() 時會移除監聽
        function onKeyDown(e) {
          if (!alive || locked) return;
          if (e.key === '1') submitChoice(0);
          else if (e.key === '2') submitChoice(1);
        }

        return {
          start: function (lv) {
            // 先清乾淨前一次狀態，確保重複 start 從乾淨狀態開始
            clearTimers();
            closeAudio();
            document.removeEventListener('keydown', onKeyDown);

            alive = true;
            locked = false;
            levelIdx = (typeof lv === 'number' && SCENE_CONFIG.LEVELS[lv]) ? lv : 0;
            qIdx = 0;
            review = [];
            soundOn = false; // 預設關閉音效
            reducedMotion = checkReducedMotion();

            api.field.innerHTML = '';
            api.field.onclick = onFieldClick;
            document.addEventListener('keydown', onKeyDown);

            renderQuestion();
          },
          stop: function () {
            alive = false;
            locked = true;
            clearTimers();
            closeAudio();
            api.field.onclick = null;
            document.removeEventListener('keydown', onKeyDown);
          }
        };
      }
    });
  })();
  </script>
