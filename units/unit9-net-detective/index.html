<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網路小警察 - 看圖判斷壞壞</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; overflow-x: hidden; }
    :root {
        --c: #3b82f6;
        --c-dark: #1e40af;
        --c-light: #93c5fd;
        --c-bg: #eff6ff;
        --good: #16a34a;
        --good-dark: #15803d;
        --bad: #dc2626;
        --bad-dark: #991b1b;
    }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        background:
            radial-gradient(circle at 20% 80%, color-mix(in srgb, var(--c) 20%, transparent) 0%, transparent 50%),
            radial-gradient(circle at 80% 20%, color-mix(in srgb, var(--c) 25%, transparent) 0%, transparent 50%),
            linear-gradient(180deg, #dbeafe 0%, #bfdbfe 60%, #93c5fd 100%);
        color: #1e293b;
        min-height: 100vh;
    }

    .screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .hidden { display: none !important; }

    /* ===== Title ===== */
    .title-emoji {
        font-size: clamp(80px, 14vw, 140px);
        animation: float 2.4s ease-in-out infinite;
        filter: drop-shadow(0 4px 16px color-mix(in srgb, var(--c) 60%, transparent));
    }
    @keyframes float {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
    }
    .title-text {
        font-size: clamp(36px, 6vw, 60px);
        font-weight: 900;
        color: var(--c-dark);
        text-shadow: 3px 3px 0 white, 5px 5px 0 var(--c-light);
        margin: 8px 0 4px;
        text-align: center;
    }
    .subtitle {
        font-size: clamp(18px, 2.4vw, 26px);
        color: var(--c-dark);
        font-weight: 900;
        margin-bottom: 24px;
        text-align: center;
    }

    /* ===== Rule preview (start screen) ===== */
    .rule-card {
        background: white;
        border: 3px solid var(--c);
        border-radius: 20px;
        padding: 18px 22px;
        max-width: 540px;
        margin: 0 auto 24px;
        text-align: center;
        box-shadow: 0 6px 0 var(--c-light);
    }
    .rule-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-size: clamp(28px, 5vw, 40px);
        margin: 8px 0;
    }
    .rule-arrow {
        font-size: clamp(20px, 3vw, 28px);
        color: var(--c);
        font-weight: 900;
    }
    .rule-tag {
        font-size: clamp(28px, 5vw, 42px);
        font-weight: 900;
        padding: 4px 16px;
        border-radius: 999px;
        color: white;
    }
    .rule-tag.good { background: var(--good); }
    .rule-tag.bad { background: var(--bad); }

    /* ===== Big button ===== */
    .big-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(22px, 3vw, 30px);
        font-weight: 900;
        padding: 16px 36px;
        background: linear-gradient(180deg, var(--c-light), var(--c));
        color: white;
        border: none;
        border-radius: 999px;
        box-shadow: 0 5px 0 var(--c-dark);
        cursor: pointer;
        transition: transform 0.1s;
        text-shadow: 2px 2px 0 var(--c-dark);
        margin: 6px;
    }
    .big-btn:hover { transform: translateY(-2px); }
    .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--c-dark); }
    .big-btn.gold {
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        box-shadow: 0 5px 0 #b45309;
        text-shadow: 2px 2px 0 #92400e;
    }
    .big-btn.gold:active { box-shadow: 0 2px 0 #b45309; }
    .big-btn.gray {
        background: linear-gradient(180deg, #94a3b8, #64748b);
        box-shadow: 0 5px 0 #334155;
        text-shadow: 2px 2px 0 #334155;
    }

    /* ===== Game Layout ===== */
    #game-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 12px 20px;
        gap: 14px;
    }
    .game-top {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 720px;
    }
    .info-box {
        background: white;
        padding: 8px 18px;
        border-radius: 999px;
        font-weight: 900;
        font-size: clamp(15px, 1.8vw, 19px);
        color: var(--c-dark);
        border: 3px solid var(--c);
        box-shadow: 0 3px 0 var(--c-light);
    }
    .top-back {
        background: white;
        border: 3px solid var(--c);
        color: var(--c-dark);
        font-family: 'Noto Sans TC', sans-serif;
        font-weight: 900;
        font-size: 16px;
        padding: 6px 18px;
        border-radius: 999px;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 3px 0 var(--c-light);
    }

    /* ===== Icon stage ===== */
    .stage {
        background: white;
        border: 4px solid var(--c);
        border-radius: 28px;
        padding: 28px 24px;
        width: 100%;
        max-width: 540px;
        box-shadow: 0 8px 0 var(--c-light);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
    }
    .icon-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: clamp(12px, 3vw, 28px);
        width: 100%;
        min-height: clamp(90px, 14vh, 130px);
    }
    .big-icon {
        font-size: clamp(56px, 12vw, 88px);
        line-height: 1;
        animation: icon-pop 0.5s ease-out;
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    }
    @keyframes icon-pop {
        from { transform: scale(0.4); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    /* ===== Answer buttons ===== */
    .answer-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        width: 100%;
        max-width: 540px;
    }
    .ans-btn {
        font-family: 'Noto Sans TC', sans-serif;
        border: 4px solid;
        border-radius: 22px;
        padding: 18px 8px 14px;
        font-weight: 900;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        transition: transform 0.1s;
        min-height: 110px;
    }
    .ans-btn:active { transform: translateY(3px); }
    .ans-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .ans-btn .a-icon {
        font-size: clamp(48px, 9vw, 72px);
        line-height: 1;
    }
    .ans-btn .a-label {
        font-size: clamp(28px, 5vw, 36px);
        font-weight: 900;
    }
    .ans-btn.good {
        background: linear-gradient(180deg, #86efac, #22c55e);
        border-color: var(--good-dark);
        box-shadow: 0 6px 0 var(--good-dark);
        color: white;
        text-shadow: 2px 2px 0 var(--good-dark);
    }
    .ans-btn.good:active { box-shadow: 0 2px 0 var(--good-dark); }
    .ans-btn.bad {
        background: linear-gradient(180deg, #fca5a5, #ef4444);
        border-color: var(--bad-dark);
        box-shadow: 0 6px 0 var(--bad-dark);
        color: white;
        text-shadow: 2px 2px 0 var(--bad-dark);
    }
    .ans-btn.bad:active { box-shadow: 0 2px 0 var(--bad-dark); }

    /* ===== Feedback overlay ===== */
    .feedback {
        position: fixed; inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.4);
        z-index: 50;
        pointer-events: none;
        animation: fb-in 0.2s ease-out;
    }
    @keyframes fb-in { from { opacity: 0; } to { opacity: 1; } }
    .feedback-mark {
        font-size: clamp(160px, 30vw, 280px);
        line-height: 1;
        filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
    }
    .feedback-mark.good {
        animation: mark-good 1s ease-out;
    }
    @keyframes mark-good {
        0% { transform: scale(0.2); opacity: 0; }
        40% { transform: scale(1.3); opacity: 1; }
        70% { transform: scale(1) translateY(0); opacity: 1; }
        100% { transform: scale(1) translateY(-40px); opacity: 0; }
    }
    .feedback-mark.bad {
        animation: mark-bad 0.7s ease-out;
    }
    @keyframes mark-bad {
        0% { transform: scale(0.2) rotate(-20deg); opacity: 0; }
        30% { transform: scale(1.3) rotate(10deg); opacity: 1; }
        50% { transform: scale(1) rotate(-8deg); }
        70% { transform: scale(1.05) rotate(6deg); }
        100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    .fb-bonus {
        position: absolute;
        bottom: 28%;
        font-size: clamp(28px, 5vw, 44px);
        font-weight: 900;
        color: #fef9c3;
        text-shadow: 3px 3px 0 var(--good-dark), 5px 5px 0 rgba(0,0,0,0.4);
        animation: bonus-up 1s ease-out;
    }
    @keyframes bonus-up {
        0% { transform: translateY(20px); opacity: 0; }
        50% { transform: translateY(-10px); opacity: 1; }
        100% { transform: translateY(-50px); opacity: 0; }
    }

    /* ===== Correct hint (the right icon flashes) ===== */
    .correct-hint {
        position: fixed; inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.55);
        z-index: 51;
        pointer-events: none;
    }
    .ch-card {
        background: white;
        border: 5px solid var(--c);
        border-radius: 24px;
        padding: 24px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .ch-row {
        display: flex;
        gap: 18px;
        align-items: center;
        justify-content: center;
    }
    .ch-icon {
        font-size: clamp(60px, 10vw, 96px);
        line-height: 1;
    }
    .ch-icon.target {
        animation: ch-flash 0.4s ease-in-out infinite alternate;
        filter: drop-shadow(0 0 16px var(--bad));
    }
    @keyframes ch-flash {
        from { transform: scale(1); filter: drop-shadow(0 0 8px var(--bad)); }
        to { transform: scale(1.25); filter: drop-shadow(0 0 24px var(--bad)) brightness(1.2); }
    }
    .ch-tag {
        font-size: clamp(30px, 5vw, 44px);
        font-weight: 900;
        padding: 6px 22px;
        border-radius: 999px;
        color: white;
        background: var(--bad);
        text-shadow: 2px 2px 0 var(--bad-dark);
    }
    .ch-tag.good {
        background: var(--good);
        text-shadow: 2px 2px 0 var(--good-dark);
    }

    /* ===== Shake on wrong ===== */
    .shake { animation: shake 0.5s; }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-8px); }
        40%, 80% { transform: translateX(8px); }
    }

    /* ===== Banner (level clear) ===== */
    .banner {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.55);
        display: flex; align-items: center; justify-content: center;
        z-index: 100;
        animation: fb-in 0.25s ease-out;
        padding: 20px;
    }
    .banner-card {
        background: white;
        border: 5px solid var(--c);
        padding: 30px 36px;
        border-radius: 26px;
        text-align: center;
        max-width: 90%;
        box-shadow: 0 12px 0 var(--c-light), 0 16px 40px rgba(0,0,0,0.4);
    }
    .banner-trophy { font-size: clamp(60px, 10vw, 92px); line-height: 1; }
    .banner-title {
        font-size: clamp(28px, 4vw, 40px);
        font-weight: 900;
        color: var(--c-dark);
        margin: 10px 0 4px;
    }
    .banner-stars {
        font-size: clamp(36px, 5vw, 52px);
        letter-spacing: 6px;
        margin: 12px 0;
    }
    .banner-actions {
        margin-top: 18px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
    }

    /* ===== Certificate ===== */
    .certificate {
        background: linear-gradient(180deg, #fefce8, #fef3c7);
        border: 6px double #b45309;
        border-radius: 24px;
        padding: 36px 32px;
        text-align: center;
        max-width: 560px;
        position: relative;
        color: var(--c-dark);
        box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    }
    .cert-corner { position: absolute; font-size: 40px; }
    .cert-corner.tl { top: 10px; left: 14px; }
    .cert-corner.tr { top: 10px; right: 14px; }
    .cert-corner.bl { bottom: 10px; left: 14px; }
    .cert-corner.br { bottom: 10px; right: 14px; }
    .cert-trophy { font-size: clamp(64px, 10vw, 96px); line-height: 1; }
    .cert-title { font-size: clamp(30px, 4.4vw, 44px); font-weight: 900; color: var(--c-dark); margin: 10px 0 6px; }
    .cert-body { font-size: clamp(18px, 2.2vw, 22px); color: #312e81; line-height: 1.8; margin: 14px 0; font-weight: 700; }
    .cert-stat {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: center;
        margin: 14px 0;
    }
    .cert-stat .lvl-line {
        display: flex;
        gap: 10px;
        font-size: clamp(16px, 2vw, 20px);
        font-weight: 900;
        color: var(--c-dark);
    }
    .cert-stat .lvl-label {
        min-width: 70px;
        text-align: right;
        color: var(--c);
    }
    .cert-rank { font-size: clamp(24px, 3vw, 34px); font-weight: 900; color: var(--c-dark); margin-top: 14px; }

    /* ===== Print ===== */
    @media print {
        body { background: white; }
        #start-screen, #game-screen, .banner, .feedback, .correct-hint { display: none !important; }
        #end-screen { min-height: auto; padding: 0; }
        #end-screen > div:not(.certificate) { display: none !important; }
        .certificate { box-shadow: none; border-color: #b45309; }
    }

    @media (max-width: 380px) {
        .icon-row { gap: 8px; }
        .ans-btn { padding: 14px 4px 10px; min-height: 96px; }
    }
</style>
</head>
<body>

<!-- ===== Start Screen ===== -->
<div id="start-screen" class="screen">
    <div class="title-emoji">🕵️</div>
    <h1 class="title-text">網路小警察</h1>
    <p class="subtitle">看圖判斷壞壞 🛡️</p>

    <div class="rule-card">
        <div class="rule-row">
            <span>👨</span><span>📚</span><span>⚽</span>
            <span class="rule-arrow">→</span>
            <span class="rule-tag good">✅</span>
        </div>
        <div class="rule-row">
            <span>📨</span><span>💰</span><span>🔗</span>
            <span class="rule-arrow">→</span>
            <span class="rule-tag bad">🚨</span>
        </div>
    </div>

    <button class="big-btn" onclick="startGame()">🚀 開始</button>
    <a href="../../index.html" class="big-btn gray" style="text-decoration:none; display:inline-block;">🏠 回家</a>
</div>

<!-- ===== Game Screen ===== -->
<div id="game-screen" class="hidden">
    <div class="game-top">
        <a href="../../index.html" class="top-back">🏠</a>
        <div class="info-box" id="level-info">第 1 關</div>
        <div class="info-box" id="q-info">1 / 5</div>
        <div class="info-box" id="star-info">⭐ 0</div>
    </div>

    <div class="stage" id="stage">
        <div class="icon-row" id="icon-row"></div>
    </div>

    <div class="answer-row">
        <button class="ans-btn good" id="btn-good" onclick="answer(false)">
            <span class="a-icon">✅</span>
            <span class="a-label">好</span>
        </button>
        <button class="ans-btn bad" id="btn-bad" onclick="answer(true)">
            <span class="a-icon">🚨</span>
            <span class="a-label">壞</span>
        </button>
    </div>
</div>

<!-- ===== End Screen ===== -->
<div id="end-screen" class="screen hidden">
    <div class="certificate">
        <span class="cert-corner tl">🕵️</span>
        <span class="cert-corner tr">🛡️</span>
        <span class="cert-corner bl">⭐</span>
        <span class="cert-corner br">🏅</span>
        <div class="cert-trophy" id="cert-trophy">🏆</div>
        <div class="cert-title">小警察證書</div>
        <div class="cert-body">
            勇敢的小警察<br>
            <strong>看圖通過所有試煉！</strong>
        </div>
        <div class="cert-stat" id="cert-stars"></div>
        <div class="cert-rank" id="cert-rank">🥇 警察</div>
        <div style="margin-top: 14px; font-size: 15px; color: var(--c); font-weight: 700;" id="cert-date"></div>
    </div>
    <div style="margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
        <button class="big-btn" onclick="location.reload()">🔄 再玩</button>
        <button class="big-btn gold" onclick="window.print()">🖨️ 印出</button>
        <a href="../../index.html" class="big-btn gray" style="text-decoration:none; display:inline-block;">🏠 回家</a>
    </div>
</div>

<script>
'use strict';

// ============================================================
// Audio (Web Audio API)
// ============================================================
let audioCtx = null;
function getAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    return audioCtx;
}
function beep(freq, dur, type = 'sine', vol = 0.12) {
    try {
        const ctx = getAudio(); if (!ctx) return;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(vol, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(g).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
    } catch(e) {}
}
const SFX = {
    correct() {
        beep(660, 0.1, 'triangle', 0.12);
        setTimeout(() => beep(880, 0.1, 'triangle', 0.12), 90);
        setTimeout(() => beep(1175, 0.18, 'triangle', 0.12), 180);
    },
    wrong() {
        beep(180, 0.16, 'square', 0.13);
        setTimeout(() => beep(120, 0.22, 'square', 0.13), 150);
    },
    levelClear() {
        const notes = [523, 659, 784];
        notes.forEach((f, i) => setTimeout(() => beep(f, 0.16, 'triangle', 0.12), i * 110));
    },
    finale() {
        const notes = [523, 659, 784, 1047, 1319];
        notes.forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle', 0.13), i * 130));
    },
};

// ============================================================
// Data: danger / safe icon sets
// ============================================================
const DANGER = ['📨','💰','🎰','🔗','🔐','👤','🪟','❌','🤖','📞'];
const SAFE   = ['👨','👩','👴','👵','👨‍🏫','🏫','📚','🎒','⚽','🍎'];

function isDanger(icon) { return DANGER.indexOf(icon) >= 0; }

// ============================================================
// Levels (25 questions across 5 stages)
// ============================================================
const LEVELS = [
    // 第 1 關：明顯混合（純好 / 純壞）
    {
        title: '第 1 關',
        questions: [
            { icons: ['📨','💰','🔗'], danger: true },
            { icons: ['👨','🏫','📚'], danger: false },
            { icons: ['🎰','💰','🔐'], danger: true },
            { icons: ['👩','🍎','⚽'], danger: false },
            { icons: ['📨','👤','🔗'], danger: true },
        ],
    },
    // 第 2 關：3 個中混 1 個壞
    {
        title: '第 2 關',
        questions: [
            { icons: ['👨','📚','💰'], danger: true },
            { icons: ['👵','🍎','🎒'], danger: false },
            { icons: ['🏫','📚','🔗'], danger: true },
            { icons: ['👴','⚽','🍎'], danger: false },
            { icons: ['👩','🎒','🔐'], danger: true },
        ],
    },
    // 第 3 關：相似 emoji（人 vs 陌生人）
    {
        title: '第 3 關',
        questions: [
            { icons: ['👤','📚','🎒'], danger: true },
            { icons: ['👨‍🏫','🏫','📚'], danger: false },
            { icons: ['👴','👩','👨'], danger: false },
            { icons: ['👤','💰','📞'], danger: true },
            { icons: ['👵','👨‍🏫','🍎'], danger: false },
        ],
    },
    // 第 4 關：少見情境（假冒、彈窗、帳號鎖定）
    {
        title: '第 4 關',
        questions: [
            { icons: ['🤖','📚','🏫'], danger: true },
            { icons: ['🪟','💰','🔗'], danger: true },
            { icons: ['👨‍🏫','📚','🎒'], danger: false },
            { icons: ['❌','🔐','📞'], danger: true },
            { icons: ['🍎','⚽','👴'], danger: false },
        ],
    },
    // 第 5 關 BOSS：壓力混合
    {
        title: '第 5 關',
        questions: [
            { icons: ['👨','🤖','📚'], danger: true },
            { icons: ['🎒','🍎','⚽'], danger: false },
            { icons: ['📞','🏫','👨‍🏫'], danger: true },
            { icons: ['👵','👨','👩'], danger: false },
            { icons: ['🪟','❌','🔐'], danger: true },
        ],
    },
];

// ============================================================
// State
// ============================================================
const state = {
    levelIdx: 0,
    qIdx: 0,
    levelCorrect: 0,
    levelStars: [],
    totalStars: 0,
    locked: false,
};

function $(id) { return document.getElementById(id); }

// ============================================================
// Render
// ============================================================
function renderQuestion() {
    const level = LEVELS[state.levelIdx];
    const q = level.questions[state.qIdx];
    const row = $('icon-row');
    row.innerHTML = '';
    q.icons.forEach((ic, i) => {
        const span = document.createElement('span');
        span.className = 'big-icon';
        span.style.animationDelay = (i * 0.08) + 's';
        span.textContent = ic;
        row.appendChild(span);
    });
    $('level-info').textContent = level.title;
    $('q-info').textContent = (state.qIdx + 1) + ' / ' + level.questions.length;
    $('star-info').textContent = '⭐ ' + state.totalStars;
    $('btn-good').disabled = false;
    $('btn-bad').disabled = false;
}

// ============================================================
// Answer flow
// ============================================================
function answer(playerSaysDanger) {
    if (state.locked) return;
    state.locked = true;
    $('btn-good').disabled = true;
    $('btn-bad').disabled = true;

    const level = LEVELS[state.levelIdx];
    const q = level.questions[state.qIdx];
    const correct = (playerSaysDanger === q.danger);

    if (correct) {
        state.levelCorrect++;
        SFX.correct();
        showFeedbackGood();
        setTimeout(advance, 900);
    } else {
        SFX.wrong();
        showFeedbackBad(q);
        setTimeout(advance, 1700);
    }
}

function showFeedbackGood() {
    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.innerHTML = '<div class="feedback-mark good">✅</div><div class="fb-bonus">+1 ⭐</div>';
    document.body.appendChild(fb);
    setTimeout(() => fb.remove(), 900);
}

function showFeedbackBad(q) {
    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.innerHTML = '<div class="feedback-mark bad">❌</div>';
    document.body.appendChild(fb);
    $('stage').classList.add('shake');

    setTimeout(() => {
        fb.remove();
        $('stage').classList.remove('shake');
        const hint = document.createElement('div');
        hint.className = 'correct-hint';
        if (q.danger) {
            const dangerIc = q.icons.find(isDanger) || q.icons[0];
            hint.innerHTML =
                '<div class="ch-card">' +
                  '<div class="ch-row">' +
                    q.icons.map(ic => {
                        const cls = (ic === dangerIc) ? 'ch-icon target' : 'ch-icon';
                        return '<span class="' + cls + '">' + ic + '</span>';
                    }).join('') +
                  '</div>' +
                  '<div class="ch-tag">🚨</div>' +
                '</div>';
        } else {
            hint.innerHTML =
                '<div class="ch-card">' +
                  '<div class="ch-row">' +
                    q.icons.map(ic => '<span class="ch-icon">' + ic + '</span>').join('') +
                  '</div>' +
                  '<div class="ch-tag good">✅</div>' +
                '</div>';
        }
        document.body.appendChild(hint);
        setTimeout(() => hint.remove(), 1200);
    }, 500);
}

function advance() {
    const level = LEVELS[state.levelIdx];
    state.qIdx++;
    state.locked = false;
    if (state.qIdx >= level.questions.length) {
        levelClear();
    } else {
        renderQuestion();
    }
}

// ============================================================
// Level flow
// ============================================================
function calcStars(correctCount, total) {
    if (correctCount >= total) return 3;
    if (correctCount === total - 1) return 2;
    return 1;
}

function levelClear() {
    const level = LEVELS[state.levelIdx];
    const stars = calcStars(state.levelCorrect, level.questions.length);
    state.totalStars += stars;
    state.levelStars[state.levelIdx] = stars;

    const isLast = state.levelIdx >= LEVELS.length - 1;
    if (isLast) SFX.finale(); else SFX.levelClear();

    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.id = 'banner';
    banner.innerHTML =
        '<div class="banner-card">' +
            '<div class="banner-trophy">🎉</div>' +
            '<div class="banner-title">' + level.title + ' 過關</div>' +
            '<div class="banner-stars">' +
                '⭐'.repeat(stars) + '☆'.repeat(3 - stars) +
            '</div>' +
            '<div class="banner-actions">' +
                (isLast
                    ? '<button class="big-btn gold" onclick="finishAll()">🏆 領證</button>'
                    : '<button class="big-btn" onclick="nextLevel()">▶ 下一關</button>') +
            '</div>' +
        '</div>';
    document.body.appendChild(banner);
}

function closeBanner() {
    const b = $('banner');
    if (b) b.remove();
}

function nextLevel() {
    closeBanner();
    state.levelIdx++;
    state.qIdx = 0;
    state.levelCorrect = 0;
    state.locked = false;
    renderQuestion();
}

function finishAll() {
    closeBanner();
    try {
        const prev = parseInt(localStorage.getItem('edtech-unit9-score') || '0', 10);
        if (state.totalStars > prev) localStorage.setItem('edtech-unit9-score', state.totalStars);
    } catch(e) {}

    $('game-screen').classList.add('hidden');
    $('end-screen').classList.remove('hidden');

    let starsHtml = '';
    for (let i = 0; i < LEVELS.length; i++) {
        const s = state.levelStars[i] || 0;
        starsHtml +=
            '<span class="lvl-line">' +
                '<span class="lvl-label">第' + (i + 1) + '關</span>' +
                '⭐'.repeat(s) + '☆'.repeat(3 - s) +
            '</span>';
    }
    $('cert-stars').innerHTML = starsHtml;

    const total = state.totalStars;
    if (total >= 15) {
        $('cert-trophy').textContent = '👑';
        $('cert-rank').textContent = '👑 警察王';
    } else if (total >= 13) {
        $('cert-trophy').textContent = '🥇';
        $('cert-rank').textContent = '🥇 警察';
    } else if (total >= 9) {
        $('cert-trophy').textContent = '🥈';
        $('cert-rank').textContent = '🥈 新人';
    } else {
        $('cert-trophy').textContent = '💪';
        $('cert-rank').textContent = '💪 再來';
    }

    const today = new Date();
    $('cert-date').textContent = (today.getFullYear() - 1911) + ' 年 ' + (today.getMonth() + 1) + ' 月 ' + today.getDate() + ' 日 頒發';
}

// ============================================================
// Flow
// ============================================================
function startGame() {
    state.levelIdx = 0;
    state.qIdx = 0;
    state.levelCorrect = 0;
    state.levelStars = [];
    state.totalStars = 0;
    state.locked = false;
    $('start-screen').classList.add('hidden');
    $('end-screen').classList.add('hidden');
    $('game-screen').classList.remove('hidden');
    renderQuestion();
    getAudio();
}

// ============================================================
// Listeners
// ============================================================
document.addEventListener('keydown', (e) => {
    if (e.key === 'F8') {
        e.preventDefault();
        state.levelStars = [3, 3, 2, 3, 2];
        state.totalStars = 13;
        $('start-screen').classList.add('hidden');
        $('game-screen').classList.add('hidden');
        finishAll();
        return;
    }
});
</script>
</body>
</html>
