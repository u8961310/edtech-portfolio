<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網路小警察 - 學會分辨網路詐騙</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    :root {
        --c: #3b82f6;
        --c-dark: #1d4ed8;
        --c-deep: #1e3a8a;
        --c-light: #dbeafe;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; overflow-x: hidden; }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        background:
            radial-gradient(circle at 20% 20%, #bae6fd88 0%, transparent 55%),
            radial-gradient(circle at 80% 80%, #c7d2fe88 0%, transparent 55%),
            linear-gradient(180deg, #e0f2fe 0%, #dbeafe 50%, #c7d2fe 100%);
        color: var(--c-deep);
        min-height: 100vh;
    }

    .screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .hidden { display: none !important; }

    /* ===== Title ===== */
    .title-emoji {
        font-size: clamp(70px, 13vw, 130px);
        animation: float 2.4s ease-in-out infinite;
        filter: drop-shadow(0 4px 14px var(--c));
    }
    @keyframes float {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
    }
    .title-text {
        font-size: clamp(34px, 5.5vw, 52px);
        font-weight: 900;
        color: var(--c-deep);
        text-shadow: 3px 3px 0 #fff, 5px 5px 0 var(--c);
        margin: 8px 0 4px;
        text-align: center;
    }
    .subtitle {
        font-size: clamp(15px, 2vw, 21px);
        color: var(--c-dark);
        font-weight: 700;
        margin-bottom: 22px;
        text-align: center;
    }
    .intro-card {
        background: rgba(255,255,255,0.85);
        border: 3px solid var(--c);
        border-radius: 18px;
        padding: 16px 22px;
        max-width: 520px;
        margin: 0 auto 22px;
        text-align: left;
        line-height: 1.9;
        font-size: clamp(14px, 1.8vw, 17px);
        color: var(--c-deep);
        box-shadow: 0 6px 0 var(--c-light), 0 8px 20px rgba(59,130,246,0.18);
    }
    .intro-card .tag {
        display: inline-block;
        background: var(--c);
        color: white;
        border-radius: 8px;
        padding: 2px 10px;
        font-weight: 900;
        margin: 0 2px;
    }

    /* ===== Big Button ===== */
    .big-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(20px, 2.6vw, 28px);
        font-weight: 900;
        padding: 14px 32px;
        background: linear-gradient(180deg, #60a5fa, var(--c));
        color: white;
        border: none;
        border-radius: 999px;
        box-shadow: 0 5px 0 var(--c-dark), 0 8px 20px rgba(59,130,246,0.45);
        cursor: pointer;
        transition: transform 0.1s;
        text-shadow: 2px 2px 0 var(--c-deep);
        margin: 6px;
    }
    .big-btn:hover { transform: translateY(-2px); }
    .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--c-dark); }
    .big-btn.gold {
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        box-shadow: 0 5px 0 #b45309;
        text-shadow: 2px 2px 0 #92400e;
    }
    .big-btn.gold:active { box-shadow: 0 2px 0 #b45309; }
    .big-btn.gray {
        background: linear-gradient(180deg, #94a3b8, #64748b);
        box-shadow: 0 5px 0 #334155;
        text-shadow: 2px 2px 0 #1e293b;
    }
    .big-btn.gray:active { box-shadow: 0 2px 0 #334155; }

    /* ===== Game Layout ===== */
    #game-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 14px 20px;
        gap: 12px;
    }
    .game-top {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 600px;
    }
    .info-box {
        background: rgba(255,255,255,0.85);
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 900;
        font-size: clamp(13px, 1.6vw, 17px);
        color: var(--c-deep);
        border: 2px solid var(--c);
        box-shadow: 0 3px 0 var(--c-light);
    }
    .top-back {
        background: transparent;
        border: 2px solid var(--c-dark);
        color: var(--c-dark);
        font-family: 'Noto Sans TC', sans-serif;
        font-weight: 700;
        font-size: 14px;
        padding: 4px 14px;
        border-radius: 999px;
        cursor: pointer;
        text-decoration: none;
    }

    .level-title {
        text-align: center;
        font-size: clamp(16px, 2.2vw, 22px);
        font-weight: 900;
        color: var(--c-deep);
        margin: 4px 0 0;
    }

    /* ===== Message Card ===== */
    .msg-card {
        width: 100%;
        max-width: 560px;
        background: white;
        border-radius: 22px;
        box-shadow: 0 8px 0 var(--c-light), 0 12px 30px rgba(59,130,246,0.25);
        overflow: hidden;
        border: 3px solid var(--c);
        animation: msg-in 0.4s ease-out;
    }
    @keyframes msg-in {
        from { transform: translateY(20px) scale(0.95); opacity: 0; }
        to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .msg-card.flash-good { animation: flash-good 0.6s ease-out; }
    @keyframes flash-good {
        0% { box-shadow: 0 8px 0 var(--c-light), 0 12px 30px rgba(59,130,246,0.25); }
        50% { box-shadow: 0 8px 0 #86efac, 0 0 40px #22c55e; }
        100% { box-shadow: 0 8px 0 var(--c-light), 0 12px 30px rgba(59,130,246,0.25); }
    }
    .msg-card.flash-bad { animation: flash-bad 0.6s ease-out; }
    @keyframes flash-bad {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-12px); }
        40% { transform: translateX(12px); }
        60% { transform: translateX(-8px); }
        80% { transform: translateX(8px); }
    }
    .msg-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 18px;
        background: linear-gradient(90deg, var(--c-light), #eff6ff);
        border-bottom: 2px solid var(--c-light);
    }
    .msg-icon {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        flex-shrink: 0;
        border: 2px solid var(--c);
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .msg-sender {
        font-size: clamp(15px, 2vw, 18px);
        font-weight: 900;
        color: var(--c-deep);
    }
    .msg-time {
        font-size: 12px;
        color: #64748b;
        font-weight: 700;
        margin-top: 2px;
    }
    .msg-body {
        padding: 18px 22px 22px;
        font-size: clamp(15px, 2vw, 18px);
        line-height: 1.7;
        color: #1f2937;
        font-weight: 500;
        min-height: 80px;
    }
    .msg-body .danger-link {
        color: #dc2626;
        text-decoration: underline;
        font-weight: 700;
        word-break: break-all;
    }

    /* ===== Choice buttons ===== */
    .choice-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
        max-width: 560px;
    }
    .choice-btn {
        flex: 1;
        min-width: 200px;
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(17px, 2.2vw, 21px);
        font-weight: 900;
        padding: 16px 18px;
        border-radius: 18px;
        border: 3px solid;
        cursor: pointer;
        transition: transform 0.1s;
        box-shadow: 0 5px 0;
    }
    .choice-btn.safe {
        background: linear-gradient(180deg, #4ade80, #22c55e);
        color: white;
        border-color: #16a34a;
        box-shadow: 0 5px 0 #15803d;
        text-shadow: 2px 2px 0 #14532d;
    }
    .choice-btn.danger {
        background: linear-gradient(180deg, #f87171, #ef4444);
        color: white;
        border-color: #dc2626;
        box-shadow: 0 5px 0 #b91c1c;
        text-shadow: 2px 2px 0 #7f1d1d;
    }
    .choice-btn:hover { transform: translateY(-2px); }
    .choice-btn:active { transform: translateY(3px); }
    .choice-btn.safe:active { box-shadow: 0 2px 0 #15803d; }
    .choice-btn.danger:active { box-shadow: 0 2px 0 #b91c1c; }
    .choice-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ===== Feedback marks ===== */
    .feedback-mark {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        font-size: clamp(120px, 22vw, 220px);
        z-index: 90;
        pointer-events: none;
        animation: mark-pop 1.1s ease-out forwards;
    }
    @keyframes mark-pop {
        0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
        30% { transform: translate(-50%, -50%) scale(1.3) rotate(0deg); opacity: 1; }
        60% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(1.1) rotate(0deg); opacity: 0; }
    }

    /* ===== Explanation overlay ===== */
    .overlay {
        position: fixed; inset: 0;
        background: rgba(15, 23, 42, 0.72);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
        animation: overlay-in 0.25s ease-out;
    }
    @keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
    .overlay-card {
        background: white;
        border-radius: 22px;
        padding: 26px 28px;
        max-width: 460px;
        width: 100%;
        text-align: center;
        box-shadow: 0 14px 40px rgba(0,0,0,0.4);
        border: 4px solid var(--c);
        animation: overlay-pop 0.35s ease-out;
    }
    @keyframes overlay-pop {
        from { transform: scale(0.85) translateY(20px); opacity: 0; }
        to { transform: scale(1) translateY(0); opacity: 1; }
    }
    .overlay-emoji { font-size: 64px; line-height: 1; }
    .overlay-title {
        font-size: clamp(20px, 2.5vw, 26px);
        font-weight: 900;
        color: var(--c-deep);
        margin: 10px 0 12px;
    }
    .overlay-body {
        font-size: clamp(15px, 1.9vw, 18px);
        color: #1f2937;
        line-height: 1.8;
        background: var(--c-light);
        border-radius: 14px;
        padding: 14px 16px;
        font-weight: 500;
        text-align: left;
    }
    .overlay-actions {
        margin-top: 18px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
    }

    /* ===== Banner ===== */
    .banner {
        position: fixed; inset: 0;
        background: rgba(15, 23, 42, 0.7);
        display: flex; align-items: center; justify-content: center;
        z-index: 110;
        animation: overlay-in 0.25s ease-out;
        padding: 20px;
    }
    .banner-card {
        background: linear-gradient(180deg, #fff, var(--c-light));
        border: 4px solid var(--c);
        padding: 26px 32px;
        border-radius: 22px;
        text-align: center;
        max-width: 90%;
        box-shadow: 0 12px 0 var(--c-dark), 0 16px 40px rgba(0,0,0,0.3);
    }
    .banner-trophy { font-size: 64px; line-height: 1; }
    .banner-title {
        font-size: clamp(22px, 3.4vw, 32px);
        font-weight: 900;
        color: var(--c-deep);
        margin: 10px 0 4px;
    }
    .banner-stars {
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: 6px;
        margin: 8px 0;
    }
    .banner-msg {
        color: var(--c-dark);
        font-size: clamp(14px, 1.8vw, 17px);
        font-weight: 700;
        margin: 6px 0 4px;
    }
    .banner-actions {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
    }

    /* ===== Certificate ===== */
    .certificate {
        background: linear-gradient(180deg, #fefce8, #fef3c7);
        border: 6px double var(--c-dark);
        border-radius: 24px;
        padding: 36px 32px;
        text-align: center;
        max-width: 540px;
        position: relative;
        color: var(--c-deep);
        box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    }
    .cert-corner { position: absolute; font-size: 36px; }
    .cert-corner.tl { top: 8px; left: 12px; }
    .cert-corner.tr { top: 8px; right: 12px; }
    .cert-corner.bl { bottom: 8px; left: 12px; }
    .cert-corner.br { bottom: 8px; right: 12px; }
    .cert-title { font-size: clamp(26px, 4vw, 38px); font-weight: 900; color: var(--c-deep); margin-bottom: 8px; }
    .cert-body { font-size: clamp(16px, 2vw, 20px); color: var(--c-dark); line-height: 1.8; margin: 14px 0; }
    .cert-stat {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: center;
        margin: 10px 0;
    }
    .cert-stat .lvl-line {
        display: flex;
        gap: 8px;
        font-size: clamp(14px, 1.7vw, 17px);
        font-weight: 700;
        color: var(--c-deep);
    }
    .cert-stat .lvl-label {
        min-width: 80px;
        text-align: right;
        color: var(--c);
    }
    .cert-rank { font-size: clamp(20px, 2.5vw, 28px); font-weight: 900; color: var(--c-deep); margin-top: 14px; }

    /* ===== Print ===== */
    @media print {
        body { background: white; color: black; }
        #start-screen, #game-screen, .banner, .overlay, .feedback-mark { display: none !important; }
        #end-screen { min-height: auto; padding: 0; }
        #end-screen > div:not(.certificate) { display: none !important; }
        .certificate { box-shadow: none; border-color: var(--c-dark); }
    }

    @media (max-width: 480px) {
        .choice-btn { min-width: 100%; }
    }
</style>
</head>
<body>

<!-- ===== Start Screen ===== -->
<div id="start-screen" class="screen">
    <div class="title-emoji">🕵️</div>
    <h1 class="title-text">網路小警察</h1>

    <div class="intro-card">
        <strong style="color: var(--c-dark); font-size: 1.1em;">🔍 怎麼玩</strong><br>

    <button class="big-btn" onclick="startGame()">🚀 開始辦案</button>

<!-- ===== Game Screen ===== -->
<div id="game-screen" class="hidden">
    <div class="game-top">
        <a href="../../index.html" class="top-back">🏠 首頁</a>

<!-- ===== End Screen ===== -->

        <span class="cert-corner tl">🕵️</span>

        <button class="big-btn gold" onclick="window.print()">🖨️ 列印證書</button>

<script>
'use strict';

// ============================================================
// Audio (Web Audio API)
// ============================================================
let audioCtx = null;
function getAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    return audioCtx;
}
function beep(freq, dur, type = 'square', vol = 0.1) {
    try {
        const ctx = getAudio(); if (!ctx) return;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(vol, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(g).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
    } catch(e) {}
}
const SFX = {
    correct() {
        beep(880, 0.1, 'sine', 0.1);
        setTimeout(() => beep(1320, 0.18, 'sine', 0.1), 90);
    },
    wrong() {
        beep(200, 0.18, 'square', 0.12);
        setTimeout(() => beep(140, 0.22, 'square', 0.12), 160);
    },
    levelClear() {
        const notes = [523, 659, 784];
        notes.forEach((f, i) => setTimeout(() => beep(f, 0.16, 'triangle', 0.11), i * 120));
    },
    finale() {
        const notes = [523, 659, 784, 1047, 1319];
        notes.forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle', 0.12), i * 130));
    },
};

// ============================================================
// Data
// ============================================================
const LEVELS = [
    {
        title: '第1關：明顯的詐騙',
        questions: [
            { sender: '中獎通知', icon: '🎰', msg: '恭喜您中獎一千萬！請點此連結填寫個資領獎', danger: true, explain: '正常公司不會用陌生簡訊通知中獎，要你「點連結填個資」幾乎都是詐騙。' },
            { sender: '媽媽', icon: '👩', msg: '回家路上小心，記得買牛奶', danger: false, explain: '熟人正常的日常訊息，沒有任何要密碼/個資/匯款的要求，是安全的。' },
            { sender: '陌生簡訊', icon: '📨', msg: '您的包裹無法配送，請到 ppt-shop.xyz 確認地址', danger: true, explain: '真的物流公司不會用奇怪網域。可疑網址 ✗、要你填地址 ✗，兩個紅旗就是詐騙。' },
            { sender: '同學小華', icon: '🧒', msg: '今天作業是國數習作 P.10', danger: false, explain: '熟同學的作業提醒，沒有奇怪連結或要密碼，安全。' },
        ],
    },
    {
        title: '第2關：偽裝成熟人',
        questions: [
            { sender: '阿姨', icon: '👩‍🦳', msg: '我手機壞了，用同學手機傳，借我你的銀行密碼匯錢', danger: true, explain: '真的熟人不會用別人的手機問你密碼！這是冒充熟人詐騙，要當面或打電話確認。' },

const TIME_HINTS = ['剛剛', '1 分鐘前', '2 分鐘前', '5 分鐘前', '10 分鐘前', '剛收到'];

// ============================================================
// State
// ============================================================
const state = {
    levelIdx: 0,
    qIdx: 0,
    score: 0,
    wrongCount: 0,
    levelStars: [],
    locked: false,
};

function $(id) { return document.getElementById(id); }

// ============================================================
// Render
// ============================================================
function renderHud() {
    const level = LEVELS[state.levelIdx];
    $('level-info').textContent = `第 ${state.levelIdx + 1} 關`;
    $('score-info').textContent = `⭐ ${state.score}`;
    $('qprog-info').textContent = `題 ${state.qIdx + 1} / ${level.questions.length}`;
    $('level-title').textContent = level.title;
}

function renderQuestion() {
    const level = LEVELS[state.levelIdx];
    const q = level.questions[state.qIdx];
    $('msg-icon').textContent = q.icon;
    $('msg-sender').textContent = q.sender;
    $('msg-time').textContent = TIME_HINTS[Math.floor(Math.random() * TIME_HINTS.length)];

    // Highlight dangerous-looking links/keywords in red underline
    const body = $('msg-body');
    body.innerHTML = renderMsgBody(q.msg);

    // Re-trigger animation
    const card = $('msg-card');
    card.classList.remove('flash-good', 'flash-bad');
    void card.offsetWidth;

    // Enable buttons
    $('btn-safe').disabled = false;
    $('btn-danger').disabled = false;
    state.locked = false;
}

function renderMsgBody(text) {
    // Wrap suspicious-looking links (xxx.xyz / xxx.click / lookalike domains / "點此" / "點我" / "點此連結")
    const linkRe = /([a-zA-Z][a-zA-Z0-9-]*\.(xyz|click|tw|com|net)[a-zA-Z0-9/.-]*)/g;
    let html = text.replace(/[<>&]/g, c => ({'<': '&lt;', '>': '&gt;', '&': '&amp;'}[c]));
    html = html.replace(linkRe, '<span class="danger-link">$1</span>');
    // Highlight phrases
    ['點此連結', '點此', '點我', '立即點此', '輸入密碼', '銀行密碼', '帳號密碼', '密碼'].forEach(phrase => {
        const re = new RegExp(phrase, 'g');
        html = html.replace(re, `<span class="danger-link">${phrase}</span>`);
    });
    return html;
}

// ============================================================
// Game flow
// ============================================================
function answer(playerSaidDanger) {
    if (state.locked) return;
    state.locked = true;
    $('btn-safe').disabled = true;
    $('btn-danger').disabled = true;

    const level = LEVELS[state.levelIdx];
    const q = level.questions[state.qIdx];
    const correct = (playerSaidDanger === q.danger);

    if (correct) {
        SFX.correct();
        $('msg-card').classList.add('flash-good');
        showMark('✓', '#22c55e');
        state.score++;
        renderHud();
        setTimeout(() => {
            state.qIdx++;
            if (state.qIdx >= level.questions.length) {
                levelClear();
            } else {
                renderHud();
                renderQuestion();
            }
        }, 1100);
    } else {
        SFX.wrong();
        $('msg-card').classList.add('flash-bad');
        showMark('✗', '#ef4444');
        state.wrongCount++;
        setTimeout(() => showExplain(q), 700);
    }
}

function showMark(symbol, color) {
    const el = document.createElement('div');
    el.className = 'feedback-mark';
    el.textContent = symbol;
    el.style.color = color;
    el.style.textShadow = `0 0 24px ${color}, 6px 6px 0 white`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1100);
}

function showExplain(q) {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.id = 'explain-overlay';
    const tip = q.danger ? '🚨 這題是詐騙！' : '✅ 這題其實是安全的';
    const emoji = q.danger ? '🚨' : '🛡️';
    overlay.innerHTML = `
        <div class="overlay-card">
            <div class="overlay-emoji">${emoji}</div>
            <div class="overlay-title">${tip}</div>
            <div class="overlay-body">💡 ${q.explain}</div>
            <div class="overlay-actions">
                <button class="big-btn" onclick="closeExplain()">👌 我懂了</button>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);
}

function closeExplain() {
    const o = $('explain-overlay');
    if (o) o.remove();
    // Move to next question (no score for wrong)
    state.qIdx++;
    const level = LEVELS[state.levelIdx];
    if (state.qIdx >= level.questions.length) {
        levelClear();
    } else {
        renderHud();
        renderQuestion();
    }
}

// ============================================================
// Level clear & finale
// ============================================================
function levelClear() {
    SFX.levelClear();
    const level = LEVELS[state.levelIdx];

    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.id = 'banner';
    const isLast = state.levelIdx >= LEVELS.length - 1;
    banner.innerHTML = `
        <div class="banner-card">
            <div class="banner-trophy">🎉</div>
            <div class="banner-title">${level.title} 通關！</div>
            <div class="banner-msg">目前累積 ⭐ ${state.score}</div>
            <div class="banner-actions">
                ${isLast
                    ? '<button class="big-btn gold" onclick="finishAllLevels()">🏆 領取證書</button>'
                    : '<button class="big-btn" onclick="nextLevel()">▶ 下一關</button>'}
            </div>
        </div>
    `;
    document.body.appendChild(banner);
}

function closeBanner() {
    const b = $('banner');
    if (b) b.remove();
}

function nextLevel() {
    closeBanner();
    state.levelIdx++;
    state.qIdx = 0;
    renderHud();
    renderQuestion();
}

function finishAllLevels() {
    closeBanner();
    SFX.finale();
    try {
        const prev = parseInt(localStorage.getItem('edtech-unit9-score') || '0', 10);
        if (state.score > prev) localStorage.setItem('edtech-unit9-score', state.score);
    } catch(e) {}

    $('game-screen').classList.add('hidden');
    $('end-screen').classList.remove('hidden');

    // Total possible questions
    let totalQ = 0;
    LEVELS.forEach(l => { totalQ += l.questions.length; });

    // Star rule (global by wrong count)
    let stars;
    if (state.wrongCount === 0) stars = 3;
    else if (state.wrongCount <= 2) stars = 2;
    else stars = 1;

    // Per-level stat
    let statsHtml = '';
    for (let i = 0; i < LEVELS.length; i++) {
        statsHtml += `<span class="lvl-line"><span class="lvl-label">第${i+1}關</span>✅ 完成</span>`;
    }
    statsHtml += `<span class="lvl-line" style="margin-top:8px;"><span class="lvl-label">總分</span>⭐ ${state.score} / ${totalQ}</span>`;
    statsHtml += `<span class="lvl-line"><span class="lvl-label">星等</span>${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</span>`;
    $('cert-stars').innerHTML = statsHtml;

    // Title rule per spec
    if (state.score >= 15) {
        $('cert-trophy').textContent = '👑';
        $('cert-rank').textContent = '👑 稱號：資安王牌警長';
    } else if (state.score >= 13) {
        $('cert-trophy').textContent = '🥇';
        $('cert-rank').textContent = '🥇 稱號：神探小警察';
    } else if (state.score >= 9) {
        $('cert-trophy').textContent = '🥈';
        $('cert-rank').textContent = '🥈 稱號：警察學徒';
    } else {
        $('cert-trophy').textContent = '💪';
        $('cert-rank').textContent = '💪 稱號：努力訓練中';
    }

    const today = new Date();
    $('cert-date').textContent = `${today.getFullYear() - 1911} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日 頒發`;
}

// ============================================================
// Flow
// ============================================================
function startGame() {
    state.levelIdx = 0;
    state.qIdx = 0;
    state.score = 0;
    state.wrongCount = 0;
    state.levelStars = [];
    state.locked = false;
    $('start-screen').classList.add('hidden');
    $('end-screen').classList.add('hidden');
    $('game-screen').classList.remove('hidden');
    renderHud();
    renderQuestion();
    getAudio();
}

// ============================================================
// Listeners
// ============================================================
document.addEventListener('keydown', (e) => {
    // Dev shortcut: F8 jump to certificate
    if (e.key === 'F8') {
        e.preventDefault();
        state.score = 16;
        state.wrongCount = 0;
        $('start-screen').classList.add('hidden');
        $('game-screen').classList.add('hidden');
        finishAllLevels();
        return;
    }

    if ($('game-screen').classList.contains('hidden')) return;
    if (state.locked) return;

    // Keyboard shortcut: 1 / Y = safe, 2 / N = danger
    if (e.key === '1' || e.key.toLowerCase() === 'y') {
        e.preventDefault();
        answer(false);
    } else if (e.key === '2' || e.key.toLowerCase() === 'n') {
        e.preventDefault();
        answer(true);
    }
});
</script>
