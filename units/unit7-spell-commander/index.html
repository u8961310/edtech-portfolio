<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指令小法師 - 運算思維對戰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; overflow-x: hidden; }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        background:
            radial-gradient(circle at 20% 80%, #c7d2fe55 0%, transparent 50%),
            radial-gradient(circle at 80% 20%, #a5b4fc55 0%, transparent 50%),
            linear-gradient(180deg, #1e1b4b 0%, #312e81 60%, #4338ca 100%);
        color: #f8fafc;
        min-height: 100vh;
    }

    .screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .hidden { display: none !important; }

    /* ===== Title ===== */
    .title-emoji {
        font-size: clamp(80px, 14vw, 140px);
        animation: float 2.4s ease-in-out infinite;
        filter: drop-shadow(0 4px 20px #6366f1aa);
    }
    @keyframes float {
        0%, 100% { transform: translateY(0) rotate(-4deg); }
        50% { transform: translateY(-12px) rotate(4deg); }
    }
    .title-text {
        font-size: clamp(34px, 5.5vw, 52px);
        font-weight: 900;
        color: #fef9c3;
        text-shadow: 4px 4px 0 #312e81, 6px 6px 0 #6366f1aa;
        margin: 8px 0 4px;
        text-align: center;
    }
    .subtitle {
        font-size: clamp(16px, 2vw, 22px);
        color: #c7d2fe;
        font-weight: 700;
        margin-bottom: 24px;
        text-align: center;
    }
    .intro-card {
        background: rgba(255,255,255,0.08);
        border: 2px solid #6366f1;
        border-radius: 18px;
        padding: 16px 20px;
        max-width: 520px;
        margin: 0 auto 24px;
        text-align: left;
        line-height: 1.9;
        font-size: clamp(14px, 1.8vw, 17px);
        color: #e0e7ff;
    }
    .intro-card .kb {
        display: inline-block;
        background: #1e293b;
        border: 1px solid #6366f1;
        border-radius: 6px;
        padding: 2px 8px;
        font-size: 0.9em;
        font-weight: 900;
        color: #fef9c3;
        margin: 0 2px;
    }

    /* ===== Big Button ===== */
    .big-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(20px, 2.6vw, 28px);
        font-weight: 900;
        padding: 14px 32px;
        background: linear-gradient(180deg, #818cf8, #6366f1);
        color: white;
        border: none;
        border-radius: 999px;
        box-shadow: 0 5px 0 #4338ca, 0 8px 20px rgba(99,102,241,0.5);
        cursor: pointer;
        transition: transform 0.1s;
        text-shadow: 2px 2px 0 #312e81;
        margin: 6px;
    }
    .big-btn:hover { transform: translateY(-2px); }
    .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #4338ca; }
    .big-btn.gold {
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        box-shadow: 0 5px 0 #b45309;
        text-shadow: 2px 2px 0 #92400e;
    }
    .big-btn.gold:active { box-shadow: 0 2px 0 #b45309; }
    .big-btn.gray {
        background: linear-gradient(180deg, #64748b, #475569);
        box-shadow: 0 5px 0 #1e293b;
        text-shadow: 2px 2px 0 #1e293b;
    }

    /* ===== Game Layout ===== */
    #game-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 12px 16px;
        gap: 8px;
    }
    .game-top {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 720px;
    }
    .info-box {
        background: rgba(99,102,241,0.25);
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 900;
        font-size: clamp(13px, 1.6vw, 17px);
        color: #fef9c3;
        border: 2px solid #818cf8;
    }
    .top-back {
        background: transparent;
        border: 2px solid #c7d2fe;
        color: #c7d2fe;
        font-family: 'Noto Sans TC', sans-serif;
        font-weight: 700;
        font-size: 14px;
        padding: 4px 14px;
        border-radius: 999px;
        cursor: pointer;
        text-decoration: none;
    }

    /* ===== Arena (battle area) ===== */
    .arena {
        position: relative;
        width: 100%;
        max-width: 720px;
        height: clamp(220px, 38vh, 320px);
        background:
            radial-gradient(ellipse at 50% 90%, #4338ca44, transparent 70%),
            linear-gradient(180deg, #1e1b4b00 0%, #1e1b4b55 100%);
        border-radius: 22px;
        border: 3px solid #6366f1;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 22px;
    }
    .arena::before {
        content: '';
        position: absolute; inset: 0;
        background-image:
            radial-gradient(circle at 10% 30%, #fef9c322 0 2px, transparent 3px),
            radial-gradient(circle at 30% 70%, #fef9c322 0 1.5px, transparent 2.5px),
            radial-gradient(circle at 60% 20%, #fef9c322 0 1.8px, transparent 3px),
            radial-gradient(circle at 85% 60%, #fef9c322 0 2px, transparent 3px);
        pointer-events: none;
    }
    .mage {
        font-size: clamp(70px, 12vw, 110px);
        line-height: 1;
        filter: drop-shadow(0 6px 8px rgba(0,0,0,0.4));
        z-index: 2;
        animation: mage-idle 2s ease-in-out infinite;
    }
    @keyframes mage-idle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
    .mage.casting { animation: mage-cast 0.6s ease-out; }
    @keyframes mage-cast {
        0% { transform: scale(1); }
        30% { transform: scale(1.2) translateY(-12px); }
        60% { transform: scale(1.1) translateY(-6px); }
        100% { transform: scale(1); }
    }

    .monster-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 2;
    }
    .monster {
        font-size: clamp(80px, 14vw, 130px);
        line-height: 1;
        filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
        animation: monster-idle 1.8s ease-in-out infinite;
    }
    @keyframes monster-idle {
        0%, 100% { transform: scale(1) rotate(-3deg); }
        50% { transform: scale(1.05) rotate(3deg); }
    }
    .monster.hit { animation: monster-hit 0.6s ease-out; }
    @keyframes monster-hit {
        0% { transform: translateX(0); filter: brightness(1) drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
        20%, 60% { transform: translateX(-14px) rotate(-8deg); filter: brightness(2.2); }
        40%, 80% { transform: translateX(14px) rotate(8deg); filter: brightness(2.2); }
        100% { transform: translateX(0); filter: brightness(1) drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
    }
    .monster.defeated { animation: monster-defeated 0.9s ease-out forwards; }
    @keyframes monster-defeated {
        0% { transform: scale(1) rotate(0); opacity: 1; }
        40% { transform: scale(1.3) rotate(20deg); opacity: 1; }
        100% { transform: scale(0) rotate(180deg); opacity: 0; }
    }

    /* ===== Spell Sequence (required) ===== */
    .required-row {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        background: rgba(0,0,0,0.45);
        padding: 8px 14px;
        border-radius: 999px;
        border: 2px solid #fef9c3;
        z-index: 3;
    }
    .req-chip {
        font-size: clamp(22px, 3vw, 30px);
        line-height: 1;
        text-shadow: 0 0 8px #fef9c3;
        transition: transform 0.2s;
    }
    .req-chip.match {
        animation: chip-pop 0.3s ease-out;
        color: #4ade80;
    }
    @keyframes chip-pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.4); }
        100% { transform: scale(1); }
    }

    /* HP bar */
    .hp-bar {
        width: 100%;
        max-width: 180px;
        height: 14px;
        background: rgba(255,255,255,0.18);
        border: 2px solid #fef9c3;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 2px;
    }
    .hp-fill {
        height: 100%;
        background: linear-gradient(90deg, #ef4444, #f97316, #fbbf24);
        width: 100%;
        transition: width 0.4s ease-out;
    }

    /* ===== Queue (player input) ===== */
    .queue-box {
        width: 100%;
        max-width: 540px;
        min-height: 56px;
        background: rgba(255,255,255,0.08);
        border: 2px dashed #818cf8;
        border-radius: 16px;
        padding: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
    }
    .queue-empty {
        color: #c7d2fe88;
        font-size: 14px;
        font-weight: 700;
    }
    .q-chip {
        background: #6366f1;
        color: white;
        font-size: clamp(22px, 3vw, 28px);
        padding: 4px 10px;
        border-radius: 12px;
        box-shadow: 0 3px 0 #312e81;
        animation: chip-in 0.2s ease-out;
    }
    @keyframes chip-in {
        from { transform: translateY(-10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
    .q-chip.wrong {
        background: #ef4444;
        box-shadow: 0 3px 0 #991b1b;
        animation: chip-shake 0.4s ease;
    }
    @keyframes chip-shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
    }

    /* ===== Command Panel ===== */
    .panel {
        display: grid;
        grid-template-columns: repeat(3, minmax(80px, 1fr));
        gap: 10px;
        max-width: 360px;
        width: 100%;
    }
    .cmd-btn {
        font-family: 'Noto Sans TC', sans-serif;
        background: linear-gradient(180deg, #4f46e5, #4338ca);
        color: white;
        border: 3px solid #818cf8;
        border-radius: 16px;
        font-size: clamp(28px, 5vw, 40px);
        font-weight: 900;
        padding: 14px 0;
        cursor: pointer;
        box-shadow: 0 4px 0 #312e81;
        transition: transform 0.08s, box-shadow 0.08s;
        position: relative;
    }
    .cmd-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #312e81; }
    .cmd-btn:active, .cmd-btn.flash {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #312e81;
        background: linear-gradient(180deg, #818cf8, #6366f1);
    }
    .cmd-btn .label {
        display: block;
        font-size: 11px;
        font-weight: 900;
        color: #fef9c3;
        margin-top: 4px;
        letter-spacing: 1px;
    }
    .cmd-btn .kb-hint {
        position: absolute;
        top: 4px;
        right: 6px;
        font-size: 10px;
        background: rgba(0,0,0,0.4);
        padding: 1px 6px;
        border-radius: 4px;
        color: #fef9c3;
        font-weight: 900;
    }

    /* ===== Action buttons ===== */
    .action-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 4px;
    }
    .cast-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(18px, 2.4vw, 24px);
        font-weight: 900;
        padding: 12px 26px;
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        color: white;
        border: none;
        border-radius: 999px;
        box-shadow: 0 5px 0 #b45309;
        cursor: pointer;
        text-shadow: 2px 2px 0 #92400e;
    }
    .cast-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b45309; }
    .cast-btn.glow { animation: cast-glow 1s ease-in-out infinite; }
    @keyframes cast-glow {
        0%, 100% { box-shadow: 0 5px 0 #b45309, 0 0 0 #fef9c300; }
        50% { box-shadow: 0 5px 0 #b45309, 0 0 24px #fef9c3aa; }
    }
    .undo-btn, .reset-btn {
        font-family: 'Noto Sans TC', sans-serif;
        background: rgba(255,255,255,0.12);
        color: white;
        border: 2px solid #c7d2fe;
        border-radius: 999px;
        padding: 10px 20px;
        font-size: clamp(14px, 1.8vw, 17px);
        font-weight: 900;
        cursor: pointer;
    }

    /* ===== Magic effect overlay ===== */
    .magic-beam {
        position: absolute;
        top: 50%;
        left: 16%;
        height: 18px;
        width: 0;
        background: linear-gradient(90deg, #fef9c3, #fb923c, #ec4899);
        border-radius: 999px;
        box-shadow: 0 0 20px #fef9c3, 0 0 40px #ec4899;
        transform: translateY(-50%);
        opacity: 0;
        z-index: 1;
    }
    .magic-beam.firing {
        animation: beam-fire 0.5s ease-out;
    }
    @keyframes beam-fire {
        0% { width: 0; opacity: 0; }
        30% { opacity: 1; }
        100% { width: 68%; opacity: 0.9; }
    }

    /* ===== Banner ===== */
    .banner {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.65);
        display: flex; align-items: center; justify-content: center;
        z-index: 100;
        animation: banner-fade 0.25s ease-out;
    }
    @keyframes banner-fade { from { opacity: 0; } to { opacity: 1; } }
    .banner-card {
        background: linear-gradient(180deg, #312e81, #1e1b4b);
        border: 3px solid #6366f1;
        padding: 26px 32px;
        border-radius: 22px;
        text-align: center;
        max-width: 90%;
        box-shadow: 0 12px 0 #1e1b4b, 0 16px 40px rgba(0,0,0,0.5);
    }
    .banner-trophy { font-size: 64px; line-height: 1; }
    .banner-title {
        font-size: clamp(24px, 3.4vw, 34px);
        font-weight: 900;
        color: #fef9c3;
        margin: 10px 0 4px;
    }
    .banner-stars {
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: 6px;
        margin: 8px 0;
    }
    .banner-msg {
        color: #c7d2fe;
        font-size: clamp(14px, 1.8vw, 17px);
        font-weight: 700;
        margin: 6px 0 4px;
    }
    .banner-actions {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
    }

    /* ===== Certificate ===== */
    .certificate {
        background: linear-gradient(180deg, #fefce8, #fef3c7);
        border: 6px double #b45309;
        border-radius: 24px;
        padding: 36px 32px;
        text-align: center;
        max-width: 540px;
        position: relative;
        color: #4338ca;
        box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    }
    .cert-corner { position: absolute; font-size: 36px; }
    .cert-corner.tl { top: 8px; left: 12px; }
    .cert-corner.tr { top: 8px; right: 12px; }
    .cert-corner.bl { bottom: 8px; left: 12px; }
    .cert-corner.br { bottom: 8px; right: 12px; }
    .cert-title { font-size: clamp(28px, 4vw, 40px); font-weight: 900; color: #4338ca; margin-bottom: 8px; }
    .cert-body { font-size: clamp(17px, 2vw, 21px); color: #312e81; line-height: 1.8; margin: 14px 0; }
    .cert-stat {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: center;
        margin: 10px 0;
    }
    .cert-stat .lvl-line {
        display: flex;
        gap: 8px;
        font-size: clamp(15px, 1.8vw, 18px);
        font-weight: 700;
        color: #312e81;
    }
    .cert-stat .lvl-label {
        min-width: 64px;
        text-align: right;
        color: #6366f1;
    }
    .cert-rank { font-size: clamp(20px, 2.5vw, 28px); font-weight: 900; color: #4338ca; margin-top: 14px; }

    /* ===== Print ===== */
    @media print {
        body { background: white; color: black; }
        #start-screen, #game-screen, .banner { display: none !important; }
        #end-screen { min-height: auto; padding: 0; }
        #end-screen > div:not(.certificate) { display: none !important; }
        .certificate { box-shadow: none; border-color: #b45309; }
    }

    /* ===== Tutorial hint (level 1) ===== */
    .hint-text {
        text-align: center;
        color: #fef9c3;
        font-size: clamp(13px, 1.8vw, 16px);
        font-weight: 700;
        background: rgba(0,0,0,0.3);
        padding: 6px 16px;
        border-radius: 999px;
        max-width: 540px;
        margin: 0 auto;
        min-height: 30px;
    }
</style>
</head>
<body>

<!-- ===== Start Screen ===== -->
<div id="start-screen" class="screen">
    <div class="title-emoji">🧙‍♂️</div>
    <h1 class="title-text">指令小法師</h1>
    <p class="subtitle">用咒語打敗森林裡的怪獸吧！</p>

    <div class="intro-card">
        <strong style="color:#fef9c3;">📜 怎麼玩</strong><br>
        1. 怪獸頭上會出現咒語順序 ⬆️ ⬆️ ⚔️<br>
        2. 用滑鼠點 <span class="kb">⬆️⬇️⬅️➡️⚔️🛡️</span> 按鈕<br>
        &nbsp;&nbsp;&nbsp;或用鍵盤<span class="kb">↑↓←→</span><span class="kb">A</span><span class="kb">D</span><br>
        3. 順序對了，按 <span class="kb">SPACE</span> 施法！<br>
        4. 不限時間，慢慢想沒關係 ✨
    </div>

    <button class="big-btn" onclick="startGame()">🚀 開始挑戰</button>
    <a href="../../index.html" class="big-btn gray" style="text-decoration:none; display:inline-block;">🏠 回首頁</a>
</div>

<!-- ===== Game Screen ===== -->
<div id="game-screen" class="hidden">
    <div class="game-top">
        <a href="../../index.html" class="top-back">🏠 首頁</a>
        <div class="info-box" id="level-info">第 1 關</div>
        <div class="info-box" id="star-info">⭐ 0</div>
        <div class="info-box" id="retry-info">重排 0 次</div>
    </div>

    <div class="hint-text" id="hint-text">點下面的按鈕，照怪獸頭上的順序排好</div>

    <div class="arena">
        <div class="magic-beam" id="magic-beam"></div>
        <div class="mage" id="mage">🧙‍♂️</div>
        <div class="monster-wrap">
            <div class="required-row" id="required-row"></div>
            <div class="monster" id="monster">🟢</div>
            <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
        </div>
    </div>

    <div class="queue-box" id="queue-box">
        <span class="queue-empty">（點按鈕排咒語）</span>
    </div>

    <div class="panel">
        <button class="cmd-btn" data-cmd="up">⬆️<span class="kb-hint">↑</span></button>
        <button class="cmd-btn" data-cmd="attack">⚔️<span class="kb-hint">A</span><span class="label">攻擊</span></button>
        <button class="cmd-btn" data-cmd="shield">🛡️<span class="kb-hint">D</span><span class="label">防禦</span></button>
        <button class="cmd-btn" data-cmd="left">⬅️<span class="kb-hint">←</span></button>
        <button class="cmd-btn" data-cmd="down">⬇️<span class="kb-hint">↓</span></button>
        <button class="cmd-btn" data-cmd="right">➡️<span class="kb-hint">→</span></button>
    </div>

    <div class="action-buttons">
        <button class="cast-btn" id="cast-btn" onclick="castSpell()">✨ 施法 (Space)</button>
        <button class="undo-btn" onclick="undoCommand()">↶ 取消一個</button>
        <button class="reset-btn" onclick="resetQueue()">🗑️ 全部清空</button>
    </div>
</div>

<!-- ===== End Screen ===== -->
<div id="end-screen" class="screen hidden">
    <div class="certificate">
        <span class="cert-corner tl">🧙</span>
        <span class="cert-corner tr">✨</span>
        <span class="cert-corner bl">📜</span>
        <span class="cert-corner br">🐉</span>
        <div style="font-size: 64px;" id="cert-trophy">🏆</div>
        <div class="cert-title">魔法師認證書</div>
        <div class="cert-body">
            勇敢的小法師完成了<br>
            <strong>所有咒語的試煉！</strong>
        </div>
        <div class="cert-stat" id="cert-stars"></div>
        <div class="cert-rank" id="cert-rank">🥇 稱號：初階法師</div>
        <div style="margin-top: 14px; font-size: 14px; color: #6366f1;" id="cert-date"></div>
    </div>
    <div style="margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
        <button class="big-btn" onclick="location.reload()">🔄 再玩一次</button>
        <button class="big-btn gold" onclick="window.print()">🖨️ 列印證書</button>
        <a href="../../index.html" class="big-btn gray" style="text-decoration:none; display:inline-block;">🏠 回首頁</a>
    </div>
</div>

<script>
'use strict';

// ============================================================
// Audio (Web Audio API)
// ============================================================
let audioCtx = null;
function getAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    return audioCtx;
}
function beep(freq, dur, type = 'square', vol = 0.1) {
    try {
        const ctx = getAudio(); if (!ctx) return;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(vol, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(g).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
    } catch(e) {}
}
const SFX = {
    click() { beep(540, 0.07, 'square', 0.08); },
    undo() { beep(280, 0.08, 'sine', 0.08); },
    cast() {
        beep(660, 0.1, 'sine', 0.1);
        setTimeout(() => beep(880, 0.1, 'sine', 0.1), 80);
        setTimeout(() => beep(1100, 0.18, 'sine', 0.12), 160);
    },
    hit() {
        beep(220, 0.08, 'sawtooth', 0.14);
        setTimeout(() => beep(160, 0.12, 'sawtooth', 0.12), 80);
    },
    wrong() {
        beep(180, 0.15, 'square', 0.12);
        setTimeout(() => beep(120, 0.2, 'square', 0.12), 140);
    },
    win() {
        beep(660, 0.12, 'triangle', 0.1);
        setTimeout(() => beep(880, 0.12, 'triangle', 0.1), 120);
        setTimeout(() => beep(1100, 0.2, 'triangle', 0.1), 240);
    },
    finale() {
        const notes = [523, 659, 784, 1047];
        notes.forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.12), i * 140));
    },
};

// ============================================================
// Data
// ============================================================
const CMD_EMOJI = {
    up: '⬆️', down: '⬇️', left: '⬅️', right: '➡️',
    attack: '⚔️', shield: '🛡️',
};
const KEY_TO_CMD = {
    'ArrowUp': 'up', 'ArrowDown': 'down', 'ArrowLeft': 'left', 'ArrowRight': 'right',
    'w': 'up', 'W': 'up', 's': 'down', 'S': 'down',
    'a': 'attack', 'A': 'attack', 'd': 'shield', 'D': 'shield',
};

const LEVELS = [
    {
        name: '小史萊姆',
        emoji: '🟢',
        sequence: ['attack'],
        hint: '直接點 ⚔️ 攻擊牠，再按 Space 施法！',
    },
    {
        name: '森林野狼',
        emoji: '🐺',
        sequence: ['up', 'attack'],
        hint: '先 ⬆️ 抬手，再 ⚔️ 攻擊！',
    },
    {
        name: '巨大黑熊',
        emoji: '🐻',
        sequence: ['up', 'right', 'attack'],
        hint: '⬆️ 抬手 → ➡️ 蓄力 → ⚔️ 攻擊',
    },
    {
        name: '山洞巨魔',
        emoji: '👹',
        sequence: ['up', 'up', 'up', 'attack'],
        hint: '連續抬手三次！像是「重複」的咒語',
    },
    {
        name: '熔岩火龍',
        emoji: '🐉',
        sequence: ['shield', 'right', 'up', 'up', 'attack'],
        hint: '先 🛡️ 防禦再反擊，BOSS 戰！',
    },
];

// ============================================================
// State
// ============================================================
const state = {
    levelIdx: 0,
    queue: [],
    casting: false,
    levelRetries: 0,
    levelStars: [],
    totalStars: 0,
};

function $(id) { return document.getElementById(id); }

// ============================================================
// Render
// ============================================================
function renderRequired() {
    const level = LEVELS[state.levelIdx];
    const row = $('required-row');
    row.innerHTML = '';
    level.sequence.forEach((cmd, i) => {
        const chip = document.createElement('span');
        chip.className = 'req-chip';
        chip.id = 'req-' + i;
        chip.textContent = CMD_EMOJI[cmd];
        row.appendChild(chip);
    });
}

function renderQueue() {
    const q = $('queue-box');
    if (state.queue.length === 0) {
        q.innerHTML = '<span class="queue-empty">（點按鈕排咒語）</span>';
    } else {
        q.innerHTML = '';
        state.queue.forEach((cmd) => {
            const chip = document.createElement('div');
            chip.className = 'q-chip';
            chip.textContent = CMD_EMOJI[cmd];
            q.appendChild(chip);
        });
    }
    // Glow cast button when queue length matches required
    const level = LEVELS[state.levelIdx];
    const castBtn = $('cast-btn');
    if (state.queue.length === level.sequence.length) {
        castBtn.classList.add('glow');
    } else {
        castBtn.classList.remove('glow');
    }
}

function renderHud() {
    const level = LEVELS[state.levelIdx];
    $('level-info').textContent = `第 ${state.levelIdx + 1} 關 ${level.emoji} ${level.name}`;
    $('star-info').textContent = `⭐ ${state.totalStars}`;
    $('retry-info').textContent = `重排 ${state.levelRetries} 次`;
    $('hint-text').textContent = level.hint;
    $('monster').textContent = level.emoji;
    $('monster').className = 'monster';
    $('hp-fill').style.width = '100%';
}

// ============================================================
// Input
// ============================================================
function addCommand(cmd) {
    if (state.casting) return;
    const level = LEVELS[state.levelIdx];
    if (state.queue.length >= level.sequence.length) return; // queue full
    state.queue.push(cmd);
    SFX.click();
    renderQueue();
    flashButton(cmd);
}

function flashButton(cmd) {
    const btn = document.querySelector(`.cmd-btn[data-cmd="${cmd}"]`);
    if (!btn) return;
    btn.classList.add('flash');
    setTimeout(() => btn.classList.remove('flash'), 120);
}

function undoCommand() {
    if (state.casting) return;
    if (state.queue.length === 0) return;
    state.queue.pop();
    SFX.undo();
    renderQueue();
}

function resetQueue() {
    if (state.casting) return;
    if (state.queue.length === 0) return;
    state.queue = [];
    SFX.undo();
    renderQueue();
}

// ============================================================
// Cast
// ============================================================
async function castSpell() {
    if (state.casting) return;
    const level = LEVELS[state.levelIdx];
    if (state.queue.length !== level.sequence.length) {
        // Not enough or too many
        SFX.wrong();
        return;
    }

    state.casting = true;
    // Compare command-by-command, highlight matched req-chips
    let allMatch = true;
    for (let i = 0; i < level.sequence.length; i++) {
        const reqChip = $('req-' + i);
        if (state.queue[i] === level.sequence[i]) {
            if (reqChip) reqChip.classList.add('match');
        } else {
            allMatch = false;
            break;
        }
    }

    if (!allMatch) {
        // Mark wrong chips and fail
        document.querySelectorAll('.q-chip').forEach((el, i) => {
            if (state.queue[i] !== level.sequence[i]) el.classList.add('wrong');
        });
        SFX.wrong();
        await sleep(900);
        state.queue = [];
        state.levelRetries++;
        renderQueue();
        renderHud();
        // Reset req-chip highlights
        document.querySelectorAll('.req-chip').forEach(el => el.classList.remove('match'));
        state.casting = false;
        return;
    }

    // All match → cast
    $('mage').classList.add('casting');
    SFX.cast();
    await sleep(400);
    const beam = $('magic-beam');
    beam.classList.remove('firing');
    void beam.offsetWidth;
    beam.classList.add('firing');
    await sleep(450);
    $('mage').classList.remove('casting');

    // Hit monster
    $('monster').classList.add('hit');
    $('hp-fill').style.width = '0%';
    SFX.hit();
    await sleep(700);
    $('monster').classList.remove('hit');
    $('monster').classList.add('defeated');
    await sleep(900);

    levelClear();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============================================================
// Level flow
// ============================================================
function calcStars(retries) {
    if (retries === 0) return 3;
    if (retries <= 2) return 2;
    return 1;
}

function levelClear() {
    const stars = calcStars(state.levelRetries);
    state.totalStars += stars;
    state.levelStars[state.levelIdx] = stars;
    SFX.win();

    const isLast = state.levelIdx >= LEVELS.length - 1;
    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.id = 'banner';
    const retryNote = state.levelRetries === 0
        ? '<div style="font-size: 14px; color: #fef9c3; margin-top: 4px;">一次過關！神之手 ✨</div>'
        : `<div style="font-size: 14px; color: #c7d2fe; margin-top: 4px;">這關重排了 ${state.levelRetries} 次</div>`;
    banner.innerHTML = `
        <div class="banner-card">
            <div class="banner-trophy">🎉</div>
            <div class="banner-title">擊敗 ${LEVELS[state.levelIdx].name}！</div>
            <div class="banner-stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
            <div class="banner-msg">獲得 ${stars} 顆星星</div>
            ${retryNote}
            <div class="banner-actions">
                ${isLast
                    ? '<button class="big-btn gold" onclick="finishAllLevels()">🏆 領取證書</button>'
                    : '<button class="big-btn" onclick="nextLevel()">▶ 下一關</button>'}
            </div>
        </div>
    `;
    document.body.appendChild(banner);
}

function closeBanner() {
    const b = $('banner');
    if (b) b.remove();
}

function nextLevel() {
    closeBanner();
    state.levelIdx++;
    state.queue = [];
    state.levelRetries = 0;
    state.casting = false;
    renderHud();
    renderRequired();
    renderQueue();
}

function finishAllLevels() {
    closeBanner();
    SFX.finale();
    try {
        const prev = parseInt(localStorage.getItem('edtech-unit7-score') || '0', 10);
        if (state.totalStars > prev) localStorage.setItem('edtech-unit7-score', state.totalStars);
    } catch(e) {}

    $('game-screen').classList.add('hidden');
    $('end-screen').classList.remove('hidden');

    const maxStars = LEVELS.length * 3;
    let starsHtml = '';
    for (let i = 0; i < LEVELS.length; i++) {
        const s = state.levelStars[i] || 0;
        starsHtml += `<span class="lvl-line"><span class="lvl-label">第${i+1}關</span>${'⭐'.repeat(s)}${'☆'.repeat(3 - s)}</span>`;
    }
    $('cert-stars').innerHTML = starsHtml;

    if (state.totalStars === maxStars) {
        $('cert-trophy').textContent = '👑';
        $('cert-rank').textContent = '👑 稱號：完美魔法大師';
    } else if (state.totalStars >= maxStars * 0.85) {
        $('cert-trophy').textContent = '🥇';
        $('cert-rank').textContent = '🥇 稱號：魔法大師';
    } else if (state.totalStars >= maxStars * 0.6) {
        $('cert-trophy').textContent = '🥈';
        $('cert-rank').textContent = '🥈 稱號：初階法師';
    } else {
        $('cert-trophy').textContent = '💪';
        $('cert-rank').textContent = '🥉 稱號：努力練習小學徒';
    }

    const today = new Date();
    $('cert-date').textContent = `${today.getFullYear() - 1911} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日 頒發`;
}

// ============================================================
// Flow
// ============================================================
function startGame() {
    state.levelIdx = 0;
    state.queue = [];
    state.casting = false;
    state.levelRetries = 0;
    state.levelStars = [];
    state.totalStars = 0;
    $('start-screen').classList.add('hidden');
    $('end-screen').classList.add('hidden');
    $('game-screen').classList.remove('hidden');
    renderHud();
    renderRequired();
    renderQueue();
    getAudio();
}

// ============================================================
// Listeners
// ============================================================
document.querySelectorAll('.cmd-btn').forEach(btn => {
    btn.addEventListener('click', () => addCommand(btn.dataset.cmd));
});

document.addEventListener('keydown', (e) => {
    // Dev shortcut: F8 jump to certificate
    if (e.key === 'F8') {
        e.preventDefault();
        state.levelStars = [3, 3, 2, 3, 2];
        state.totalStars = 13;
        $('start-screen').classList.add('hidden');
        $('game-screen').classList.add('hidden');
        finishAllLevels();
        return;
    }

    if ($('game-screen').classList.contains('hidden')) return;

    if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        castSpell();
        return;
    }
    if (e.key === 'Backspace') {
        e.preventDefault();
        undoCommand();
        return;
    }
    if (e.key === 'Escape') {
        e.preventDefault();
        resetQueue();
        return;
    }
    const cmd = KEY_TO_CMD[e.key];
    if (cmd) {
        e.preventDefault();
        addCommand(cmd);
    }
});
</script>
</body>
</html>
