<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英打太空特攻 - 打字島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@500;600&display=swap">
  <link rel="stylesheet" href="../../assets/css/typing-island.css">
  <style>
    /* 本關場景樣式：一律以 sc- 開頭，不更動 .ti- 共用樣式 */
    .sc-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      user-select: none;
      pointer-events: none;
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      color: var(--ink-1);
    }

    /* 淡天藍到淡粉紅的繪本剪紙天空（護眼柔和色、無暗底） */
    .sc-sky {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg, #D6EEFB 0%, #EAF6FD 48%, #FFEAE2 82%, #FFDCCB 100%);
    }
    /* 柔和紙張紋理感（微弱點陣） */
    .sc-sky::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.25;
      background-image: radial-gradient(rgba(94, 72, 56, 0.14) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    /* 底部剪紙柔雲帶，增加繪本疊層紙感 */
    .sc-cloud-bank {
      position: absolute;
      left: -2%;
      right: -2%;
      bottom: -8px;
      height: 44px;
      z-index: 2;
      pointer-events: none;
    }

    /* 視差背景層（雲朵與熱氣球） */
    .sc-bg-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
    }
    .sc-cloud,
    .sc-balloon {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
      filter: drop-shadow(0 4px 0 rgba(94, 72, 56, 0.08));
    }

    /* 郵差號前方的柔虛線防線提示 */
    .sc-defense-line {
      position: absolute;
      top: 48px;
      bottom: 18px;
      width: 0;
      border-left: 2.5px dashed rgba(217, 83, 31, 0.36);
      z-index: 3;
    }
    .sc-defense-tag {
      position: absolute;
      left: 6px;
      bottom: 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-3);
      background: rgba(255, 248, 230, 0.85);
      border: 1.5px solid var(--kraft);
      border-radius: 8px 6px 8px 6px;
      padding: 1px 6px;
      white-space: nowrap;
    }

    /* 郵差號小飛碟（載著小狐狸） */
    .sc-ufo-wrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 144px;
      height: 118px;
      margin-left: -72px;
      margin-top: -59px;
      z-index: 4;
      will-change: transform;
      filter: drop-shadow(0 6px 0 rgba(94, 72, 56, 0.14));
    }
    .sc-ufo-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .sc-ufo-tag {
      position: absolute;
      left: 50%;
      bottom: -8px;
      transform: translateX(-50%);
      background: var(--card);
      border: 2px solid var(--kraft-2);
      border-radius: 10px 7px 10px 8px;
      padding: 1px 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-2);
      white-space: nowrap;
      box-shadow: 0 2px 0 rgba(94, 72, 56, 0.12);
    }

    /* 調皮紙飛機圖層與單體 */
    .sc-planes-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
    }
    .sc-plane {
      position: absolute;
      left: 0;
      top: 0;
      width: 124px;
      height: 82px;
      margin-left: -62px;
      margin-top: -41px;
      will-change: transform, opacity;
      z-index: 5;
    }
    .sc-plane.sc-active {
      z-index: 8;
    }
    .sc-plane-svg {
      position: absolute;
      left: 0;
      top: 5px;
      width: 124px;
      height: 72px;
      overflow: visible;
      filter: drop-shadow(0 4px 0 rgba(94, 72, 56, 0.14));
    }
    /* 紙飛機上的字卡：高對比（深棕字 #3B2A20 配米白／淺奶油底 ≥ 11:1） */
    .sc-letter-card {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      min-width: 64px;
      height: 64px;
      padding: 0 8px;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      background: var(--card);
      border: 2.5px solid var(--kraft-2);
      border-radius: 14px 10px 15px 11px;
      box-shadow: 0 3px 0 rgba(94, 72, 56, 0.16);
      color: var(--ink-1);
      font-family: var(--f-zh);
      font-size: 44px;
      font-weight: 600;
      line-height: 1;
      opacity: 0.94;
    }
    /* 英打字型規範：Fredoka / Consolas / monospace，至少 44px */
    .sc-stage.sc-en .sc-letter-card {
      font-family: 'Fredoka', Consolas, monospace;
      font-size: 44px;
    }
    /* 目前要打的那架紙飛機：天藍粗框＋天藍虛線瞄準圈 */
    .sc-plane.sc-active .sc-letter-card {
      min-width: 72px;
      height: 72px;
      background: var(--butter-soft);
      border: 3.5px solid var(--sky-dk);
      outline: 3.5px dashed var(--sky-dk);
      outline-offset: 5px;
      box-shadow: 0 0 0 4px var(--sky-soft), 0 4px 0 rgba(31, 107, 156, 0.22);
      font-size: 48px;
      opacity: 1;
    }
    .sc-stage.sc-en .sc-plane.sc-active .sc-letter-card {
      font-size: 48px;
    }
    /* 空白符號微調顯示，更易辨識 */
    .sc-letter-card.sc-space {
      color: var(--sky-dk);
    }
    /* 打錯時的輕巧提示小標（不整場閃紅） */
    .sc-miss-badge {
      position: absolute;
      top: -14px;
      right: -6px;
      background: #FFD9D6;
      color: var(--berry-dk);
      border: 2px solid var(--berry);
      border-radius: 10px;
      padding: 0 6px;
      font-size: 14px;
      font-weight: 900;
      line-height: 20px;
      box-shadow: 0 2px 0 rgba(179, 38, 43, 0.18);
    }

    /* 特效層（彩色紙球、攤開信紙、星星、+1、掉落信封） */
    .sc-fx-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }
    .sc-ball {
      position: absolute;
      left: 0;
      top: 0;
      width: 24px;
      height: 24px;
      margin-left: -12px;
      margin-top: -12px;
      will-change: transform;
    }
    .sc-letter-fx {
      position: absolute;
      left: 0;
      top: 0;
      width: 56px;
      height: 44px;
      margin-left: -28px;
      margin-top: -22px;
      will-change: transform, opacity;
      filter: drop-shadow(0 3px 0 rgba(94, 72, 56, 0.14));
    }
    .sc-star-fx {
      position: absolute;
      left: 0;
      top: 0;
      width: 18px;
      height: 18px;
      margin-left: -9px;
      margin-top: -9px;
      will-change: transform, opacity;
    }
    .sc-pop-fx {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      padding: 2px 9px;
      border-radius: 12px 9px 12px 10px;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-size: 19px;
      font-weight: 700;
      white-space: nowrap;
      will-change: transform, opacity;
      box-shadow: 0 2px 0 rgba(94, 72, 56, 0.14);
    }
    .sc-pop-ok {
      background: var(--card);
      color: var(--leaf-dk);
      border: 2px solid var(--leaf);
    }
    .sc-pop-hurt {
      background: #FFD9D6;
      color: var(--berry-dk);
      border: 2px solid var(--berry);
    }

    /* 上方「送信進度」紙條 HUD */
    .sc-hud {
      position: absolute;
      top: 8px;
      left: 14px;
      right: 14px;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .sc-mail-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 248, 230, 0.94);
      border: 2px solid var(--kraft-2);
      border-radius: 14px 10px 14px 11px;
      padding: 4px 12px;
      box-shadow: 0 3px 0 rgba(94, 72, 56, 0.12);
      max-width: 100%;
    }
    .sc-mail-title {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-1);
      white-space: nowrap;
    }
    .sc-mail-count {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 17px;
      font-weight: 600;
      color: var(--peach-dk);
      min-width: 48px;
      text-align: right;
      white-space: nowrap;
    }
    .sc-track {
      position: relative;
      width: 148px;
      height: 12px;
      background: var(--card-2);
      border: 1.5px solid var(--kraft-2);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 1;
    }
    .sc-track-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--leaf) 0%, #5FB855 100%);
      border-radius: 6px;
    }
    .sc-track-label {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      white-space: nowrap;
    }
    .sc-badges {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sc-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px 2px 6px;
      border-radius: 10px 8px 10px 8px;
      border: 1.5px solid var(--kraft);
      background: var(--card-2);
      color: var(--ink-3);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0.62;
    }
    .sc-badge.sc-unlocked {
      opacity: 1;
      color: var(--ink-1);
      box-shadow: 0 2px 0 rgba(94, 72, 56, 0.14);
    }
    .sc-badge.sc-b-bronze.sc-unlocked {
      background: #F7DFC8;
      border-color: #B87342;
    }
    .sc-badge.sc-b-silver.sc-unlocked {
      background: #E8F0F5;
      border-color: #6B8596;
    }
    .sc-badge.sc-b-gold.sc-unlocked {
      background: var(--butter-soft);
      border-color: #C98F14;
    }

    /* 徽章升級小提醒（不遮字） */
    .sc-toast {
      background: var(--butter-soft);
      border: 2px solid var(--peach-dk);
      border-radius: 12px 9px 12px 10px;
      padding: 4px 12px;
      font-size: 15px;
      font-weight: 900;
      color: var(--ink-1);
      box-shadow: 0 3px 0 rgba(217, 83, 31, 0.18);
      white-space: nowrap;
      opacity: 0;
    }

    /* 暫停狀態保護：強制停止所有可能過渡 */
    .sc-paused * {
      transition: none !important;
      animation-play-state: paused !important;
    }

    /* 較窄視窗下縮減進度條寬度，確保不擠壓 */
    @media (max-width: 760px) {
      .sc-track { width: 84px; }
      .sc-mail-title span { display: none; }
    }
  </style>
</head><body>
  <script src="../../assets/typing/passages.js"></script>
  <script src="../../assets/typing/en-items.js"></script>
  <script src="../../assets/js/typing-core.js"></script>
  <script src="../../assets/js/typing-ui.js"></script>
  <script>
    // =========================================================================
    // 本關集中設定常數：速度、數量、顏色、版面比例皆集中於此方便調整
    // =========================================================================
    var SCENE_CONFIG = {
      // 同時出現在畫面上的調皮紙飛機數量（依 tier）
      counts: { t1: 3, t2: 4, t3: 5 },
      // 目前要打的紙飛機從右邊飛到郵差號所需的秒數（初階 14 秒、進階 10 秒、高階 7 秒）
      travelSec: { t1: 14, t2: 10, t3: 7 },
      // 尚未輪到的紙飛機速度倍率與最大前進距離（嚴守 1/3 規則，保留至少 2/3 時間）
      queueSpeedRatio: 1 / 3,
      queueMaxProgress: 1 / 3,
      queueGap: 0.1,   // 排隊間距（佔全程比例）：約 100px，飛機加字卡不會互疊
      // 動畫 dt 上限（秒），避免切換分頁回來暴衝
      maxDt: 0.1,
      // 紙飛機上下波浪幅度（px）與頻率（rad/s）
      waveAmp: 7,
      waveFreq: 2.1,
      // 3 條垂直航道比例：拉開到字卡不會互相遮擋（同航道的靠排隊的水平間距錯開）
      lanes: [0.5, 0.04, 0.96],
      // 郵差號位置比例與碰撞距離
      ufoXRatio: 0.145,
      ufoYRatio: 0.56,
      ufoHitOffsetPx: 74,
      spawnMarginRight: 70,
      // 送信進度與郵差徽章（每 20 封升一級：銅 → 銀 → 金）
      badgeStep: 20,
      badges: [
        { id: 'bronze', label: '銅郵差', threshold: 20, cls: 'sc-b-bronze', fill: '#C98A5B', stroke: '#8A5228' },
        { id: 'silver', label: '銀郵差', threshold: 40, cls: 'sc-b-silver', fill: '#B5C7D3', stroke: '#5C7485' },
        { id: 'gold',   label: '金郵差', threshold: 60, cls: 'sc-b-gold',   fill: '#FFD966', stroke: '#B87E0F' }
      ],
      // 彩色紙球與星星配色（取自繪本剪紙柔和色系）
      ballColors: ['#FF9E7A', '#FFD966', '#7CCB6F', '#5BA4D6', '#F49FB0'],
      // 各項視覺回饋時間（秒）
      ballDuration: 0.22,
      letterDuration: 0.95,
      starDuration: 0.55,
      popDuration: 0.78,
      dropLetterDuration: 0.88,
      ufoHopDuration: 0.28,
      ufoShakeDuration: 0.46,   // 約 2.1 次/秒的溫和單次搖晃，遠低於 3 次/秒
      missShakeDuration: 0.44,  // 溫和單次左右輕晃，不閃紅
      missBadgeDuration: 0.65,
      reducedFadeDuration: 0.26,
      toastDuration: 2.0,
      // 視差背景捲動速度（px/秒）
      cloudLayers: [
        { xRatio: 0.16, yRatio: 0.22, scale: 0.82, speed: 12, opacity: 0.78 },
        { xRatio: 0.48, yRatio: 0.18, scale: 1.05, speed: 18, opacity: 0.88 },
        { xRatio: 0.82, yRatio: 0.28, scale: 0.72, speed: 14, opacity: 0.75 },
        { xRatio: 0.34, yRatio: 0.74, scale: 0.90, speed: 22, opacity: 0.82 },
        { xRatio: 0.74, yRatio: 0.78, scale: 1.10, speed: 26, opacity: 0.85 }
      ],
      balloons: [
        { xRatio: 0.30, yRatio: 0.32, scale: 0.88, speed: 8,  bobAmp: 5, bobPhase: 0.2, palette: 0 },
        { xRatio: 0.68, yRatio: 0.26, scale: 0.72, speed: 6,  bobAmp: 4, bobPhase: 2.4, palette: 1 }
      ]
    };

    TypingIsland.mount({
      unit: 11,
      title: '英打太空特攻',
      subtitle: '射擊類・英打',
      langs: ['en'],
      homeUrl: '../../index.html',
      scene: function (api) {
        var field = api.field;
        var reducedQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;

        // 場景執行狀態（全由單一 rAF 驅動，pause/stop 後完全靜止、零計時器）
        var running = false;
        var rafId = 0;
        var lastTime = 0;
        var elapsed = 0;

        // DOM 參照
        var stageEl = null;
        var bgLayerEl = null;
        var defenseLineEl = null;
        var ufoWrapEl = null;
        var foxHappyEl = null;
        var foxSurprisedEl = null;
        var planesLayerEl = null;
        var fxLayerEl = null;
        var mailCountEl = null;
        var trackFillEl = null;
        var trackLabelEl = null;
        var badgeEls = [];
        var toastEl = null;

        // 動態物件陣列
        var bgClouds = [];
        var bgBalloons = [];
        var targets = [];     // 對應 api.upcoming 的紙飛機
        var effects = [];     // 紙球、替身飛機、攤開信紙、星星、+1、掉落信封、淡出目標

        // 郵差號狀態與送信進度
        var ufoState = { x: 180, y: 160, hopT: 0, shakeT: 0 };
        var mailCount = 0;
        var badgeLevel = 0;
        var toastT = 0;
        var lastLaneIndex = -1;
        var colorCursor = 0;

        // ---------------------------------------------------------------------
        // 小工具函式
        // ---------------------------------------------------------------------
        function isReducedMotion() {
          return !!(reducedQuery && reducedQuery.matches);
        }

        function getFieldSize() {
          return {
            w: field.clientWidth || 960,
            h: field.clientHeight || 300
          };
        }

        function getTier() {
          var t = api.settings && api.settings.tier;
          return SCENE_CONFIG.counts[t] ? t : 't1';
        }

        function getTargetCount() {
          return SCENE_CONFIG.counts[getTier()];
        }

        function getTravelSec() {
          return SCENE_CONFIG.travelSec[getTier()];
        }

        function getMetrics() {
          var sz = getFieldSize();
          var ufoX = Math.max(82, Math.min(sz.w * SCENE_CONFIG.ufoXRatio, 210));
          var ufoY = Math.max(108, sz.h * SCENE_CONFIG.ufoYRatio);
          var hitX = ufoX + SCENE_CONFIG.ufoHitOffsetPx;
          var spawnX = Math.max(hitX + 180, sz.w - SCENE_CONFIG.spawnMarginRight);
          // 計算安全垂直區間：避開上方送信進度條與底邊
          var minY = Math.max(84, sz.h * 0.26);
          var maxY = Math.max(minY + 40, sz.h - 46);
          return {
            w: sz.w,
            h: sz.h,
            ufoX: ufoX,
            ufoY: ufoY,
            hitX: hitX,
            spawnX: spawnX,
            minY: minY,
            maxY: maxY
          };
        }

        // 依設計規範與技術約束第 10 條：一律用 display，空白顯示為 ␣，保留大小寫
        function formatDisplayChar(u) {
          var raw = (u && typeof u.display === 'string') ? u.display : '';
          return raw === ' ' ? '␣' : raw;
        }

        // 挑選較不擁擠且與前一架不同的垂直航道
        function pickLane() {
          // 每條航道上「最靠近右邊起點」那架的進度；空航道當作 1（最空）。
          // 新飛機從起點出發，選這個值最大的航道，才不會跟剛出發的飛機疊在一起
          var nearest = SCENE_CONFIG.lanes.map(function () { return 1; });
          targets.forEach(function (t) {
            if (t && t.lane >= 0 && t.lane < nearest.length) nearest[t.lane] = Math.min(nearest[t.lane], t.p);
          });
          var bestLane = 0;
          var bestScore = -999;
          for (var i = 0; i < nearest.length; i++) {
            var score = nearest[i] - (i === lastLaneIndex ? 0.05 : 0);
            if (score > bestScore) {
              bestScore = score;
              bestLane = i;
            }
          }
          lastLaneIndex = bestLane;
          return bestLane;
        }

        // ---------------------------------------------------------------------
        // 繪本剪紙風 Inline SVG 產生器
        // ---------------------------------------------------------------------
        function svgCloud() {
          return '' +
            '<svg width="110" height="52" viewBox="0 0 110 52" aria-hidden="true">' +
              '<path d="M22 44 C10 44 4 36 6 27 C8 19 16 15 24 16 C28 7 40 3 51 8 C59 2 74 4 80 15 C92 14 103 22 103 32 C103 40 95 44 85 44 Z" ' +
                    'fill="#FFF8E6" stroke="#E4CC9C" stroke-width="2" stroke-linejoin="round"/>' +
              '<path d="M18 41 L88 41" stroke="#F3E4C6" stroke-width="4" stroke-linecap="round"/>' +
            '</svg>';
        }

        function svgBalloon(palette) {
          var main = palette === 0 ? '#FF9E7A' : '#7CCB6F';
          var stripe = palette === 0 ? '#FFD966' : '#FFF8E6';
          var accent = palette === 0 ? '#FFF8E6' : '#FFD966';
          return '' +
            '<svg width="56" height="76" viewBox="0 0 56 76" aria-hidden="true">' +
              '<path d="M28 4 C13 4 4 16 6 30 C8 42 18 50 22 54 L34 54 C38 50 48 42 50 30 C52 16 43 4 28 4 Z" ' +
                    'fill="' + main + '" stroke="#5E4838" stroke-width="2" stroke-linejoin="round"/>' +
              '<path d="M28 4 C20 12 18 36 24 54 L32 54 C38 36 36 12 28 4 Z" fill="' + stripe + '" opacity="0.9"/>' +
              '<circle cx="19" cy="20" r="3.5" fill="' + accent + '" opacity="0.85"/>' +
              '<line x1="23" y1="54" x2="22" y2="62" stroke="#74604E" stroke-width="1.6"/>' +
              '<line x1="33" y1="54" x2="34" y2="62" stroke="#74604E" stroke-width="1.6"/>' +

        function initBackgroundProps() {
          bgClouds = [];

          SCENE_CONFIG.cloudLayers.forEach(function (cfg) {

        // ---------------------------------------------------------------------
        // 送信進度與郵差徽章更新
        // ---------------------------------------------------------------------
        function updateMailHud(announceUpgrade) {
          if (!mailCountEl) return;
          mailCountEl.textContent = mailCount + ' 封';

          var step = SCENE_CONFIG.badgeStep;
          var newLevel = 0;
          SCENE_CONFIG.badges.forEach(function (b, idx) {
            var unlocked = mailCount >= b.threshold;
            if (unlocked) newLevel = idx + 1;
            if (badgeEls[idx]) badgeEls[idx].classList.toggle('sc-unlocked', unlocked);
          });

          var maxThreshold = SCENE_CONFIG.badges[SCENE_CONFIG.badges.length - 1].threshold;
          if (mailCount >= maxThreshold) {
            trackFillEl.style.width = '100%';
            trackLabelEl.textContent = '滿級 ★';
          } else {
            var inStep = mailCount % step;
            var pct = Math.min(100, Math.round((inStep / step) * 100));
            trackFillEl.style.width = pct + '%';
            trackLabelEl.textContent = inStep + ' / ' + step;
          }

          if (announceUpgrade && newLevel > badgeLevel) {
            var unlockedBadge = SCENE_CONFIG.badges[newLevel - 1];
            toastEl.textContent = '★ 升級「' + unlockedBadge.label + '徽章」！';
            toastT = SCENE_CONFIG.toastDuration;
            toastEl.style.opacity = '1';
          }
          badgeLevel = newLevel;
        }

        // ---------------------------------------------------------------------
        // 紙飛機目標建立與 upcoming 對齊
        // ---------------------------------------------------------------------
        function createPlaneElement(u, isActive) {
          var el = document.createElement('div');
          el.className = 'sc-plane' + (isActive ? ' sc-active' : '');

          var svgWrap = document.createElement('div');
          svgWrap.className = 'sc-plane-art';
          svgWrap.innerHTML = svgPaperPlane(isActive);
          el.appendChild(svgWrap);

          var card = document.createElement('div');
          var text = formatDisplayChar(u);
          card.className = 'sc-letter-card' + (u.display === ' ' ? ' sc-space' : '');
          card.textContent = text;
          el.appendChild(card);

          planesLayerEl.appendChild(el);
          return { el: el, svgWrap: svgWrap, card: card };
        }

        function setPlaneActiveStyle(target, active) {
          if (target.isActive === active) return;
          target.isActive = active;
          target.el.classList.toggle('sc-active', active);
          target.svgWrap.innerHTML = svgPaperPlane(active);
        }

        function syncTargets(initialRound) {
          if (!stageEl) return;
          stageEl.classList.toggle('sc-en', !!(api.settings && api.settings.lang === 'en'));

          var wantCount = getTargetCount();
          var want = api.upcoming(wantCount) || [];
          var m = getMetrics();
          var reduced = isReducedMotion();

          // 多出來的紙飛機移除
          while (targets.length > want.length) {
            var extra = targets.pop();
            if (extra && extra.el) extra.el.remove();
          }

          // 逐一對齊 upcoming[i]
          for (var i = 0; i < want.length; i++) {
            var u = want[i];
            var key = u.passageIndex + ':' + u.index;
            var it = targets[i];

            if (!it || it.key !== key) {
              if (it && it.el) it.el.remove();
              var parts = createPlaneElement(u, i === 0);
              var lane = pickLane();
              // 剛建立時都在右側起點（p = 0），若是開局初始排隊可稍微錯開於右緣內
              var startP = 0;
              if (initialRound && i > 0) {
                startP = Math.max(0, 0.07 * (want.length - i));   // 開局在水平方向拉開，避免同航道重疊
              }
              it = targets[i] = {
                key: key,
                display: formatDisplayChar(u),
                el: parts.el,
                svgWrap: parts.svgWrap,
                card: parts.card,
                isActive: i === 0,
                lane: lane,
                p: startP,
                x: m.spawnX,
                y: m.minY + SCENE_CONFIG.lanes[lane] * (m.maxY - m.minY),
                wavePhase: (lane * 1.37) + (i * 0.9),
                fadeT: reduced ? 0 : SCENE_CONFIG.reducedFadeDuration,
                missShakeT: 0,
                missBadgeT: 0,
                missBadgeEl: null
              };
            }

            setPlaneActiveStyle(it, i === 0);
          }

          renderPositions(m);
        }

        // ---------------------------------------------------------------------
        // 特效系統（全由 rAF 推動，無任何 setTimeout / CSS keyframe）
        // ---------------------------------------------------------------------
        function clearAllEffects() {
          effects.forEach(function (fx) {
            if (fx.el) fx.el.remove();
          });
          effects = [];
        }

        function spawnHitEffects(oldTarget, popText) {
          var reduced = isReducedMotion();

          if (reduced) {
            // 減少動態模式：目標柔和淡出＋平靜提示字，無粒子與晃動
            var fadeEl = oldTarget.el.cloneNode(true);
            fadeEl.classList.remove('sc-active');
            fxLayerEl.appendChild(fadeEl);
            effects.push({
              type: 'fadeOut',
              el: fadeEl,
              t: 0,
              dur: SCENE_CONFIG.reducedFadeDuration
            });
            spawnPopText(oldTarget.x, Math.max(66, oldTarget.y - 34), popText, 'sc-pop-ok', true);
            return;
          }

          // 1. 保留原位置短暫「紙飛機替身」，等彩色紙球飛到後立刻攤開成信紙
          var ghostEl = oldTarget.el.cloneNode(true);
          ghostEl.classList.remove('sc-active');
          fxLayerEl.appendChild(ghostEl);
          var ghost = {
            type: 'ghost',
            el: ghostEl,
            t: 0,
            dur: SCENE_CONFIG.ballDuration
          };
          effects.push(ghost);

          // 2. 郵差號發射一顆彩色紙球飛向紙飛機
          var ballColor = SCENE_CONFIG.ballColors[colorCursor % SCENE_CONFIG.ballColors.length];
          colorCursor++;
          var ballEl = document.createElement('div');
          ballEl.className = 'sc-ball';
          ballEl.innerHTML = svgPaperBall(ballColor);
          fxLayerEl.appendChild(ballEl);

          effects.push({
            type: 'ball',
            el: ballEl,
            t: 0,
            dur: SCENE_CONFIG.ballDuration,
            x0: ufoState.x + 62,
            y0: ufoState.y + 4,
            x1: oldTarget.x,
            y1: oldTarget.y,
            color: ballColor,
            popText: popText
          });
        }

        function spawnLetterUnfold(x, y, popText) {
          // 攤開的小信紙：飄向天空像收到一封信
          var letterEl = document.createElement('div');
          letterEl.className = 'sc-letter-fx';
          letterEl.innerHTML = svgUnfoldedLetter();
          fxLayerEl.appendChild(letterEl);
          effects.push({
            type: 'letter',
            el: letterEl,
            t: 0,
            dur: SCENE_CONFIG.letterDuration,
            x: x,
            y: y,
            vx: -26,
            vy: -58,
            swayPhase: Math.random() * 6.28
          });

          // 幾顆小星星（柔和點綴、不擋字）
          for (var i = 0; i < 4; i++) {
            var angle = -Math.PI * 0.85 + (i / 3) * (Math.PI * 0.7);
            var spd = 48 + (i % 2) * 22;
            var starEl = document.createElement('div');
            starEl.className = 'sc-star-fx';
            starEl.innerHTML = svgStar(SCENE_CONFIG.ballColors[(colorCursor + i) % SCENE_CONFIG.ballColors.length]);
            fxLayerEl.appendChild(starEl);
            effects.push({
              type: 'star',
              el: starEl,
              t: 0,
              dur: SCENE_CONFIG.starDuration,
              x: x,
              y: y,
              vx: Math.cos(angle) * spd,
              vy: Math.sin(angle) * spd - 16
            });
          }

          // 「✓ +1」鼓勵字標（往上飄開、不擋住下一架紙飛機的字）
          spawnPopText(x, Math.max(66, y - 38), popText, 'sc-pop-ok', false);
        }

        function spawnDroppedEnvelope() {
          var reduced = isReducedMotion();
          var startX = ufoState.x + 12;
          var startY = ufoState.y + 30;

          if (reduced) {
            spawnPopText(ufoState.x + 18, Math.max(68, ufoState.y - 54), '信掉了 -1', 'sc-pop-hurt', true);
            return;
          }

          var el = document.createElement('div');
          el.className = 'sc-letter-fx';
          el.innerHTML = svgDroppedEnvelope();
          fxLayerEl.appendChild(el);
          effects.push({
            type: 'dropLetter',
            el: el,
            t: 0,
            dur: SCENE_CONFIG.dropLetterDuration,
            x: startX,
            y: startY,
            vx: -18,
            vy: 66
          });
          spawnPopText(ufoState.x + 16, Math.max(68, ufoState.y - 54), '掉了一封信', 'sc-pop-hurt', false);
        }

        function spawnPopText(x, y, text, cls, staticFade) {
          var el = document.createElement('div');
          el.className = 'sc-pop-fx ' + cls;
          el.textContent = text;
          fxLayerEl.appendChild(el);
          effects.push({
            type: 'pop',
            el: el,
            t: 0,
            dur: SCENE_CONFIG.popDuration,
            x: x,
            y: y,
            staticFade: !!staticFade
          });
        }

        // ---------------------------------------------------------------------
        // 畫面位置繪製與主動畫迴圈（rAF + dt）
        // ---------------------------------------------------------------------
        function renderPositions(m) {
          var reduced = isReducedMotion();

          // 防線位置
          if (defenseLineEl) {
            defenseLineEl.style.left = Math.round(m.hitX) + 'px';
          }

          // 郵差號位置（含開心跳躍、被撞輕晃與平穩浮動）
          ufoState.x = m.ufoX;
          ufoState.y = m.ufoY;
          var ufoDx = 0;
          var ufoDy = reduced ? 0 : Math.sin(elapsed * 2.2) * 4.5;
          var ufoRot = 0;

          if (!reduced && ufoState.hopT > 0) {
            var hp = 1 - (ufoState.hopT / SCENE_CONFIG.ufoHopDuration);
            ufoDy -= Math.sin(hp * Math.PI) * 14;
            ufoRot = -Math.sin(hp * Math.PI) * 4;
          }
          if (!reduced && ufoState.shakeT > 0) {
            var sp = 1 - (ufoState.shakeT / SCENE_CONFIG.ufoShakeDuration);
            // 單次平滑左右輕晃（低於 3 次/秒）
            ufoDx += Math.sin(sp * Math.PI * 2) * 6 * (1 - sp * 0.4);
            ufoRot += Math.sin(sp * Math.PI * 2) * 4;
          }

          if (ufoWrapEl) {
            ufoWrapEl.style.transform =
              'translate3d(' + (ufoState.x + ufoDx).toFixed(1) + 'px,' +
              (ufoState.y + ufoDy).toFixed(1) + 'px,0) rotate(' + ufoRot.toFixed(1) + 'deg)';
          }

          // 小狐狸表情切換（被撞短暫驚訝，其餘時間開心）
          var surprised = ufoState.shakeT > 0;
          if (foxHappyEl && foxSurprisedEl) {
            foxHappyEl.style.display = surprised ? 'none' : '';
            foxSurprisedEl.style.display = surprised ? '' : 'none';
          }

          // 背景雲朵與熱氣球
          bgClouds.forEach(function (c) {
            var cy = m.h * c.yRatio;
            c.el.style.transform =
              'translate3d(' + c.x.toFixed(1) + 'px,' + cy.toFixed(1) + 'px,0) scale(' + c.scale + ')';
          });
          bgBalloons.forEach(function (b) {
            var bob = reduced ? 0 : Math.sin(elapsed * 1.4 + b.bobPhase) * b.bobAmp;
            var by = m.h * b.yRatio + bob;
            b.el.style.transform =
              'translate3d(' + b.x.toFixed(1) + 'px,' + by.toFixed(1) + 'px,0) scale(' + b.scale + ')';
          });

          // 調皮紙飛機位置
          var spanX = m.spawnX - m.hitX;
          targets.forEach(function (it) {
            var baseX = m.spawnX - it.p * spanX;
            var baseY = m.minY + SCENE_CONFIG.lanes[it.lane] * (m.maxY - m.minY);
            var waveY = reduced ? 0 : Math.sin(elapsed * SCENE_CONFIG.waveFreq + it.wavePhase) * SCENE_CONFIG.waveAmp;
            var missDx = 0;
            if (!reduced && it.missShakeT > 0) {
              var mp = 1 - (it.missShakeT / SCENE_CONFIG.missShakeDuration);
              missDx = Math.sin(mp * Math.PI * 2) * 6;
            }

            it.x = baseX + missDx;
            it.y = baseY + waveY;
            it.el.style.transform = 'translate3d(' + it.x.toFixed(1) + 'px,' + it.y.toFixed(1) + 'px,0)';

            if (reduced && it.fadeT < SCENE_CONFIG.reducedFadeDuration) {
              it.el.style.opacity = String(Math.min(1, it.fadeT / SCENE_CONFIG.reducedFadeDuration));
            } else {
              it.el.style.opacity = '1';
            }
          });
        }

        function updateEffects(dt) {
          for (var i = effects.length - 1; i >= 0; i--) {
            var fx = effects[i];
            fx.t += dt;
            var p = Math.min(1, fx.t / fx.dur);

            if (fx.type === 'ball') {
              // 拋物線微微上揚飛向紙飛機
              var bx = fx.x0 + (fx.x1 - fx.x0) * p;
              var by = fx.y0 + (fx.y1 - fx.y0) * p - Math.sin(p * Math.PI) * 26;
              var rot = p * 300;
              fx.el.style.transform = 'translate3d(' + bx.toFixed(1) + 'px,' + by.toFixed(1) + 'px,0) rotate(' + rot.toFixed(0) + 'deg)';
              if (p >= 1) {
                fx.el.remove();
                effects.splice(i, 1);
                spawnLetterUnfold(fx.x1, fx.y1, fx.popText);
              }
            } else if (fx.type === 'ghost') {
              if (p >= 1) {
                fx.el.remove();
                effects.splice(i, 1);
              }
            } else if (fx.type === 'letter') {
              var lx = fx.x + fx.vx * fx.t + Math.sin(fx.t * 5 + fx.swayPhase) * 10;
              var ly = fx.y + fx.vy * fx.t;
              var lScale = p < 0.25 ? (0.65 + (p / 0.25) * 0.4) : 1.05;
              var lRot = Math.sin(fx.t * 4.5 + fx.swayPhase) * 12;
              var lOp = p > 0.6 ? Math.max(0, 1 - (p - 0.6) / 0.4) : 1;
              fx.el.style.transform =
                'translate3d(' + lx.toFixed(1) + 'px,' + ly.toFixed(1) + 'px,0) scale(' + lScale.toFixed(2) + ') rotate(' + lRot.toFixed(1) + 'deg)';
              fx.el.style.opacity = lOp.toFixed(2);
              if (p >= 1) {
                fx.el.remove();
                effects.splice(i, 1);
              }
            } else if (fx.type === 'star') {
              var sx = fx.x + fx.vx * fx.t;
              var sy = fx.y + fx.vy * fx.t + 40 * fx.t * fx.t;
              fx.el.style.transform =
                'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0) scale(' + (1 - p * 0.35).toFixed(2) + ')';
              fx.el.style.opacity = String(Math.max(0, 1 - p));
              if (p >= 1) {
                fx.el.remove();
                effects.splice(i, 1);
              }
            } else if (fx.type === 'dropLetter') {
              var dx = fx.x + fx.vx * fx.t + Math.sin(fx.t * 6) * 6;
              var dy = fx.y + fx.vy * fx.t + 36 * fx.t * fx.t;
              var dRot = -18 + p * 40;
              fx.el.style.transform =
                'translate3d(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px,0) rotate(' + dRot.toFixed(1) + 'deg)';
              fx.el.style.opacity = String(Math.max(0, 1 - p * 0.95));
              if (p >= 1) {
                fx.el.remove();
                effects.splice(i, 1);
              }
            } else if (fx.type === 'pop') {
              var py = fx.staticFade ? fx.y : (fx.y - p * 28);
              fx.el.style.transform = 'translate3d(' + fx.x.toFixed(1) + 'px,' + py.toFixed(1) + 'px,0) translate(-50%,-50%)';
              fx.el.style.opacity = String(p > 0.55 ? Math.max(0, 1 - (p - 0.55) / 0.45) : 1);
              if (p >= 1) {
                fx.el.remove();
                effects.splice(i, 1);
              }
            } else if (fx.type === 'fadeOut') {
              fx.el.style.opacity = String(Math.max(0, 1 - p));
              if (p >= 1) {
                fx.el.remove();
                effects.splice(i, 1);
              }
            }
          }
        }

        function step(now) {
          if (!running) return;
          var dt = Math.min(Math.max((now - lastTime) / 1000, 0), SCENE_CONFIG.maxDt);
          lastTime = now;
          elapsed += dt;

          var m = getMetrics();
          var reduced = isReducedMotion();

          // 1. 背景雲朵與熱氣球視差向左捲動（表現郵差號往右飛）
          if (!reduced) {
            bgClouds.forEach(function (c) {
              c.x -= c.speed * dt;
              if (c.x < -140) c.x = m.w + 40;
            });
            bgBalloons.forEach(function (b) {
              b.x -= b.speed * dt;
              if (b.x < -80) b.x = m.w + 60;
            });
          }

          // 2. 更新郵差號回饋計時與徽章升級小提醒
          if (ufoState.hopT > 0) ufoState.hopT = Math.max(0, ufoState.hopT - dt);
          if (ufoState.shakeT > 0) ufoState.shakeT = Math.max(0, ufoState.shakeT - dt);
          if (toastT > 0) {
            toastT = Math.max(0, toastT - dt);
            if (toastEl) {
              toastEl.style.opacity = toastT < 0.35 ? String(toastT / 0.35) : '1';
            }
          }

          // 3. 更新每架紙飛機進度（目前目標全速，其餘遵守 1/3 速度與 1/3 上限）
          var activeRate = 1 / getTravelSec();
          var queueRate = activeRate * SCENE_CONFIG.queueSpeedRatio;
          var collided = false;

          for (var i = 0; i < targets.length; i++) {
            var it = targets[i];
            if (it.fadeT < SCENE_CONFIG.reducedFadeDuration) {
              it.fadeT = Math.min(SCENE_CONFIG.reducedFadeDuration, it.fadeT + dt);
            }
            if (it.missShakeT > 0) it.missShakeT = Math.max(0, it.missShakeT - dt);
            if (it.missBadgeT > 0) {
              it.missBadgeT = Math.max(0, it.missBadgeT - dt);
              if (it.missBadgeT <= 0 && it.missBadgeEl) {
                it.missBadgeEl.remove();
                it.missBadgeEl = null;
              }
            }

            if (i === 0) {
              it.p += activeRate * dt;
              if (it.p >= 1) {
                // 紙飛機碰到郵差號：回到右邊重新飛（字不變），郵差號晃動掉信並扣愛心
                it.p = 0;
                it.fadeT = reduced ? 0 : SCENE_CONFIG.reducedFadeDuration;
                it.wavePhase += 1.4;
                collided = true;
              }
            } else {
              // 尚未輪到的紙飛機只在右半 1/3 區間排隊等候，彼此錯開不重疊
              var cap = Math.max(0.05, SCENE_CONFIG.queueMaxProgress - (i - 1) * SCENE_CONFIG.queueGap);
              if (it.p < cap) {
                it.p = Math.min(cap, it.p + queueRate * dt);
              }
            }
          }

          // 4. 更新特效與畫面繪製
          updateEffects(dt);
          renderPositions(m);

          // 5. 若有碰撞，觸發視覺與扣血（api.loseLife 可能同步呼叫 pause/stop，故之後要再檢查 running）
          if (collided) {
            ufoState.shakeT = SCENE_CONFIG.ufoShakeDuration;
            spawnDroppedEnvelope();
            api.loseLife();
          }

          if (running) {
            rafId = requestAnimationFrame(step);
          }
        }

        // ---------------------------------------------------------------------
        // 回傳給共用程式的場景生命週期介面
        // ---------------------------------------------------------------------
        return {
          start: function () {
            mailCount = 0;
            badgeLevel = 0;
            toastT = 0;
            buildSceneDom();
            updateMailHud(false);
          },

          roundStart: function (n) {
            // 第一回合開始時重置送信進度；其餘回合清空殘留紙飛機與特效並承接進度
            if (n === 1) {
              mailCount = 0;
              badgeLevel = 0;
              toastT = 0;
              if (toastEl) toastEl.style.opacity = '0';
              updateMailHud(false);
            }
            targets.forEach(function (it) {
              if (it.el) it.el.remove();
            });
            targets = [];
            clearAllEffects();
            ufoState.hopT = 0;
            ufoState.shakeT = 0;
            lastLaneIndex = -1;
            syncTargets(true);
          },

          resume: function () {
            if (running) return;
            running = true;
            if (stageEl) stageEl.classList.remove('sc-paused');
            lastTime = performance.now();
            rafId = requestAnimationFrame(step);
          },

          pause: function () {
            running = false;
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = 0;
            }
            if (stageEl) stageEl.classList.add('sc-paused');
          },

          stop: function () {
            running = false;
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = 0;
            }
            if (stageEl) stageEl.classList.add('sc-paused');
          },

          hit: function (res) {
            var correct = Math.max(1, (res && res.correct) || 1);
            mailCount += correct;
            updateMailHud(true);

            // 郵差號開心跳一下
            if (!isReducedMotion()) {
              ufoState.hopT = SCENE_CONFIG.ufoHopDuration;
            }

            // 移除被打中的前 res.correct 架紙飛機，並觸發彩色紙球＋攤開信紙特效
            var popLabel = '✓ +' + correct;
            for (var i = 0; i < correct && targets.length > 0; i++) {
              var hitTarget = targets.shift();
              spawnHitEffects(hitTarget, i === 0 ? popLabel : '✓');
              if (hitTarget.el) hitTarget.el.remove();
            }

            // 立即對齊 upcoming 補上新紙飛機並高亮下一架
            syncTargets(false);
          },

          miss: function () {
            var curTarget = targets[0];
            if (!curTarget) return;
            // 不閃紅、不滿版閃爍：只在目標紙飛機上輕晃一次並亮出溫和 ✗ 小標
            if (!isReducedMotion()) {
              curTarget.missShakeT = SCENE_CONFIG.missShakeDuration;
            }
            curTarget.missBadgeT = SCENE_CONFIG.missBadgeDuration;
            if (!curTarget.missBadgeEl) {
              var badge = document.createElement('div');
              badge.className = 'sc-miss-badge';
              badge.textContent = '✗';
              curTarget.card.appendChild(badge);
              curTarget.missBadgeEl = badge;
            }
          },

          resize: function () {
            if (!stageEl) return;
            var m = getMetrics();
            // 視窗縮放時確保背景物件留在合理範圍內並重算全部座標
            bgClouds.forEach(function (c) {
              if (c.x > m.w + 80) c.x = c.x % m.w;
            });
            bgBalloons.forEach(function (b) {
              if (b.x > m.w + 80) b.x = b.x % m.w;
            });
            renderPositions(m);
          }
        };
      }
    });
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
</body></html>
