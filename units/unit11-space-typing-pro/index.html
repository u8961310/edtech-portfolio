<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英打太空特攻 - 選時間打外星人</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    :root {
        --c: #6366f1;
        --c-light: #a5b4fc;
        --c-dark: #4338ca;
        --c-deep: #1e1b4b;
        --gold: #fde047;
        --gold-deep: #b45309;
        --hit: #4ade80;
        --miss: #ef4444;
        --info: #93c5fd;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        background: #000;
        color: #fff;
    }

    /* ===== Deep Space Background ===== */
    #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
            radial-gradient(ellipse at 20% 0%, rgba(99,102,241,0.35) 0%, transparent 50%),
            radial-gradient(ellipse at 80% 100%, rgba(139,92,246,0.25) 0%, transparent 50%),
            linear-gradient(180deg, #1e1b4b 0%, #0c0a4a 40%, #000 100%);
    }
    .stars, .stars2, .stars3 {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }
    .stars {
        background-image:
            radial-gradient(1px 1px at 12% 8%, #fff, transparent),
            radial-gradient(1px 1px at 23% 51%, #fff, transparent),
            radial-gradient(1px 1px at 37% 73%, #fff, transparent),
            radial-gradient(2px 2px at 48% 21%, #fff, transparent),
            radial-gradient(1px 1px at 64% 89%, var(--gold), transparent),
            radial-gradient(1px 1px at 76% 13%, #fff, transparent),
            radial-gradient(2px 2px at 89% 64%, var(--c-light), transparent),
            radial-gradient(1px 1px at 5% 95%, #fff, transparent),
            radial-gradient(1px 1px at 95% 33%, #fff, transparent),
            radial-gradient(2px 2px at 55% 5%, #fff, transparent);
        animation: stars-drift 80s linear infinite;
        opacity: 0.85;
    }
    .stars2 {
        background-image:
            radial-gradient(1px 1px at 17% 27%, #fff, transparent),
            radial-gradient(1px 1px at 43% 47%, #fff, transparent),
            radial-gradient(2px 2px at 71% 31%, var(--c-light), transparent),
            radial-gradient(1px 1px at 84% 82%, #fff, transparent),
            radial-gradient(1px 1px at 11% 71%, var(--gold), transparent),
            radial-gradient(1px 1px at 29% 14%, #fff, transparent);
        animation: stars-drift 120s linear infinite;
        opacity: 0.6;
    }
    .stars3 {
        background-image:
            radial-gradient(2px 2px at 32% 38%, #fff, transparent),
            radial-gradient(1px 1px at 68% 62%, #fff, transparent),
            radial-gradient(2px 2px at 51% 90%, var(--c-light), transparent);
        animation: stars-drift 40s linear infinite;
        opacity: 0.9;
    }
    @keyframes stars-drift {
        from { transform: translateY(0); }
        to { transform: translateY(-60px); }
    }
    .nebula {
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.4;
        pointer-events: none;
    }
    .nebula.n1 { top: 10%; left: 70%; background: var(--c); animation: nebula-float 25s ease-in-out infinite; }
    .nebula.n2 { bottom: 15%; left: 5%; background: #ec4899; animation: nebula-float 35s ease-in-out infinite reverse; }
    @keyframes nebula-float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(40px, -30px) scale(1.2); }
    }

    /* ===== Screens ===== */
    .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 50;
    }
    .hidden { display: none !important; }

    /* ===== Home Button ===== */
    .home-btn {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 100;
        background: rgba(30,27,75,0.7);
        border: 2px solid var(--c-light);
        color: white;
        font-size: 22px;
        padding: 8px 16px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 900;
        backdrop-filter: blur(8px);
        transition: transform 0.1s;
    }
    .home-btn:hover { transform: scale(1.08); }
    .home-btn:active { transform: scale(0.95); }

    /* ===== Title ===== */
    .title-emoji {
        font-size: clamp(70px, 13vw, 130px);
        animation: float 3s ease-in-out infinite;
        text-shadow: 0 0 40px rgba(99,102,241,0.7);
        margin-bottom: 4px;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0) rotate(-5deg); }
        50% { transform: translateY(-18px) rotate(5deg); }
    }
    .title-text {
        font-size: clamp(40px, 7vw, 68px);
        font-weight: 900;
        color: var(--gold);
        text-shadow: 0 0 25px rgba(253,224,71,0.5), 4px 4px 0 var(--c-dark);
        margin: 8px 0 4px;
        text-align: center;
        letter-spacing: 2px;
    }
    .subtitle {
        font-size: clamp(15px, 2vw, 20px);
        color: var(--c-light);
        font-weight: 700;
        margin-bottom: 24px;
        text-align: center;
    }

    /* ===== Time Buttons ===== */
    .time-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 900px;
        margin-bottom: 20px;
    }
    .time-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(20px, 2.5vw, 26px);
        font-weight: 900;
        padding: 22px 32px;
        background: linear-gradient(180deg, var(--c-light), var(--c));
        color: white;
        border: 3px solid var(--c-light);
        border-radius: 20px;
        box-shadow: 0 6px 0 var(--c-dark), 0 0 30px rgba(99,102,241,0.4);
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s;
        text-shadow: 2px 2px 0 var(--c-deep);
        min-width: 130px;
    }
    .time-btn:hover { transform: translateY(-3px); box-shadow: 0 9px 0 var(--c-dark), 0 0 40px rgba(99,102,241,0.5); }
    .time-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--c-dark); }
    .time-btn .icon { font-size: 1.4em; display: block; margin-bottom: 4px; }
    .time-btn .label { font-size: 1em; }

    /* ===== Best Score Display ===== */
    .best-info {
        margin-top: 16px;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .best-chip {
        background: rgba(99,102,241,0.2);
        border: 2px solid var(--c);
        padding: 10px 20px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 16px;
        color: var(--c-light);
    }
    .best-chip strong { color: var(--gold); font-size: 1.2em; }

    /* ===== HUD ===== */
    #hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 12px 16px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        gap: 8px;
        font-size: clamp(14px, 2vw, 20px);
        font-weight: 900;
        z-index: 40;
        pointer-events: none;
        flex-wrap: wrap;
    }
    .hud-box {
        background: rgba(30,27,75,0.7);
        border: 2px solid var(--c-light);
        padding: 6px 14px;
        border-radius: 999px;
        backdrop-filter: blur(8px);
        color: #fef3c7;
        text-shadow: 1px 1px 0 #000;
        white-space: nowrap;
    }
    .hud-box.warning {
        background: rgba(220,38,38,0.7);
        border-color: #fca5a5;
        animation: pulse 0.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .hud-box.combo { color: var(--gold); }

    /* ===== Game Area ===== */
    #game-area {
        position: absolute;
        inset: 0;
        overflow: hidden;
        cursor: crosshair;
    }
    .ground-line {
        position: absolute;
        bottom: 70px;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--miss), transparent);
        opacity: 0.5;
        z-index: 5;
        box-shadow: 0 0 10px var(--miss);
    }
    .turret {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        font-size: clamp(60px, 10vw, 90px);
        z-index: 6;
        filter: drop-shadow(0 -4px 12px rgba(99,102,241,0.6));
    }

    /* ===== Alien ===== */
    .alien {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
        will-change: top;
    }
    .alien-body {
        font-size: clamp(44px, 6vw, 64px);
        filter: drop-shadow(0 0 10px rgba(167,139,250,0.6));
        animation: alien-bob 1.5s ease-in-out infinite;
    }
    @keyframes alien-bob {
        0%, 100% { transform: translateY(0) rotate(-4deg); }
        50% { transform: translateY(-4px) rotate(4deg); }
    }
    .alien-word {
        font-family: 'Press Start 2P', monospace;
        background: rgba(0,0,0,0.75);
        border: 3px solid var(--c-light);
        border-radius: 8px;
        padding: 6px 12px;
        margin-top: 4px;
        font-size: clamp(14px, 1.8vw, 20px);
        font-weight: 900;
        letter-spacing: 3px;
        color: #fff;
        text-shadow: 2px 2px 0 #000;
        white-space: nowrap;
        box-shadow: 0 3px 0 var(--c-dark);
    }
    .alien.active .alien-word {
        border-color: var(--gold);
        box-shadow: 0 0 20px var(--gold), 0 3px 0 var(--gold-deep);
        animation: lock-pulse 0.8s ease-in-out infinite;
    }
    .alien.active .alien-body {
        filter: drop-shadow(0 0 18px var(--gold));
    }
    @keyframes lock-pulse {
        0%, 100% { box-shadow: 0 0 20px var(--gold), 0 3px 0 var(--gold-deep); }
        50% { box-shadow: 0 0 35px var(--gold), 0 3px 0 var(--gold-deep); }
    }
    .alien-word .typed { color: var(--hit); text-shadow: 0 0 8px #22c55e, 2px 2px 0 #000; }
    .alien-word .pending { color: #fff; }
    .alien-word .next { color: var(--gold); animation: next-blink 0.6s ease-in-out infinite; }
    @keyframes next-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
    }
    .alien.dying {
        animation: alien-die 0.5s ease-out forwards;
        pointer-events: none;
    }
    @keyframes alien-die {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        50% { transform: translate(-50%, -50%) scale(1.6); opacity: 1; filter: brightness(3); }
        100% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    }
    .alien.missing {
        animation: alien-crash 0.5s ease-out forwards;
        pointer-events: none;
    }
    @keyframes alien-crash {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        50% { transform: translate(-50%, -50%) scale(1.3) rotate(20deg); filter: brightness(2) hue-rotate(-30deg); }
        100% { transform: translate(-50%, 30%) scale(0.2) rotate(60deg); opacity: 0; }
    }

    /* ===== Laser ===== */
    .laser {
        position: absolute;
        width: 6px;
        background: linear-gradient(180deg, transparent, var(--gold) 20%, #fbbf24 50%, var(--gold) 80%, transparent);
        transform-origin: bottom center;
        z-index: 8;
        filter: drop-shadow(0 0 8px var(--gold));
        pointer-events: none;
        animation: laser-flash 0.18s ease-out forwards;
    }
    @keyframes laser-flash {
        0% { opacity: 1; }
        100% { opacity: 0; }
    }

    /* ===== Particles ===== */
    .particle {
        position: absolute;
        font-size: 20px;
        pointer-events: none;
        animation: particle-pop 0.8s ease-out forwards;
        z-index: 15;
    }
    @keyframes particle-pop {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(0.3) translate(var(--dx), var(--dy)); opacity: 0; }
    }
    .score-popup {
        position: absolute;
        font-size: clamp(18px, 2.4vw, 28px);
        font-weight: 900;
        color: var(--gold);
        text-shadow: 3px 3px 0 var(--gold-deep), 0 0 10px rgba(0,0,0,0.5);
        pointer-events: none;
        animation: score-rise 0.9s ease-out forwards;
        z-index: 20;
        transform: translate(-50%, -50%);
        font-family: 'Press Start 2P', monospace;
    }
    @keyframes score-rise {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
        20% { transform: translate(-50%, -80%) scale(1.2); opacity: 1; }
        100% { transform: translate(-50%, -180%) scale(1); opacity: 0; }
    }

    /* ===== Stage label (changes with difficulty) ===== */
    .stage-banner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(36px, 6vw, 64px);
        font-weight: 900;
        color: var(--gold);
        text-shadow: 4px 4px 0 var(--gold-deep), 0 0 30px rgba(253,224,71,0.6);
        z-index: 70;
        pointer-events: none;
        animation: stage-anim 2.2s ease-out forwards;
        text-align: center;
        white-space: nowrap;
        font-family: 'Press Start 2P', monospace;
        letter-spacing: 4px;
    }
    @keyframes stage-anim {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
        25% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
    }

    /* ===== Damage Overlay ===== */
    .danger-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at bottom center, rgba(239,68,68,0.4) 0%, transparent 60%);
        opacity: 0;
        z-index: 4;
    }
    .danger-overlay.flash { animation: danger-flash 0.5s ease-out; }
    @keyframes danger-flash {
        0% { opacity: 0; }
        50% { opacity: 1; }
        100% { opacity: 0; }
    }

    /* ===== Pause Overlay ===== */
    .pause-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 200;
    }
    .pause-emoji { font-size: clamp(80px, 14vw, 140px); animation: float 2s ease-in-out infinite; }
    .pause-text { font-size: clamp(28px, 4vw, 48px); font-weight: 900; color: var(--gold); }

    .big-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(20px, 2.5vw, 28px);
        font-weight: 900;
        padding: 16px 36px;
        background: linear-gradient(180deg, var(--c-light), var(--c));
        color: white;
        border: 3px solid var(--c-light);
        border-radius: 999px;
        box-shadow: 0 6px 0 var(--c-dark);
        cursor: pointer;
        transition: transform 0.1s;
        text-shadow: 2px 2px 0 var(--c-deep);
        margin: 6px;
    }
    .big-btn:hover { transform: translateY(-2px); }
    .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--c-dark); }
    .big-btn.gold {
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        border-color: var(--gold);
        box-shadow: 0 6px 0 var(--gold-deep);
        text-shadow: 2px 2px 0 #92400e;
    }
    .big-btn.gold:active { box-shadow: 0 2px 0 var(--gold-deep); }
    .big-btn.gray {
        background: linear-gradient(180deg, #64748b, #475569);
        border-color: #94a3b8;
        box-shadow: 0 6px 0 #334155;
        text-shadow: 2px 2px 0 #1e293b;
    }
    .big-btn.gray:active { box-shadow: 0 2px 0 #334155; }

    /* ===== Countdown Animation (3-2-1) ===== */
    .countdown {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(120px, 24vw, 240px);
        font-weight: 900;
        color: var(--gold);
        text-shadow: 6px 6px 0 var(--gold-deep), 0 0 60px rgba(253,224,71,0.7);
        z-index: 80;
        pointer-events: none;
        font-family: 'Press Start 2P', monospace;
        animation: countdown-pop 1s ease-out forwards;
    }
    @keyframes countdown-pop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
        20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
    }

    /* ===== Certificate ===== */
    #end-screen { overflow-y: auto; }
    .certificate {
        background: linear-gradient(135deg, var(--c-deep) 0%, #0c0a4a 100%);
        border: 6px solid var(--gold);
        border-radius: 24px;
        padding: 28px 36px;
        max-width: 620px;
        text-align: center;
        box-shadow: 0 0 60px rgba(251,191,36,0.4);
        position: relative;
        color: #fef3c7;
    }
    .cert-corner { position: absolute; font-size: 36px; }
    .cert-corner.tl { top: 8px; left: 12px; }
    .cert-corner.tr { top: 8px; right: 12px; }
    .cert-corner.bl { bottom: 8px; left: 12px; }
    .cert-corner.br { bottom: 8px; right: 12px; }
    .cert-title { font-size: clamp(26px, 4vw, 36px); font-weight: 900; color: var(--gold); margin: 8px 0; text-shadow: 3px 3px 0 var(--c-deep); }
    .cert-body { font-size: clamp(16px, 2vw, 20px); color: var(--c-light); line-height: 1.7; margin: 12px 0; }
    .cert-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 12px;
        margin: 16px 0;
    }
    .cert-stat-box {
        background: rgba(99,102,241,0.2);
        border: 2px solid var(--c-light);
        border-radius: 12px;
        padding: 10px;
    }
    .cert-stat-label { font-size: clamp(12px, 1.4vw, 14px); color: var(--c-light); margin-bottom: 4px; }
    .cert-stat-value { font-size: clamp(22px, 3vw, 30px); font-weight: 900; color: var(--gold); font-family: 'Press Start 2P', monospace; }
    .cert-rank { font-size: clamp(22px, 3vw, 32px); font-weight: 900; color: var(--gold); margin-top: 14px; }

    @media print {
        body * { visibility: hidden; }
        body { background: white; }
        #end-screen .certificate, #end-screen .certificate * { visibility: visible; }
        #end-screen .certificate {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            background: white; color: var(--c-deep); border-color: var(--c-deep);
            box-shadow: none;
        }
        #end-screen .cert-title, #end-screen .cert-rank { color: var(--gold-deep); text-shadow: none; }
        #end-screen .cert-body, #end-screen .cert-stat-label { color: var(--c-deep); }
        #end-screen .cert-stat-value { color: var(--gold-deep); }
        #end-screen .cert-stat-box { background: white; border-color: var(--c-deep); }
    }
</style>
</head>
<body>

<div id="app">
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>
    <div class="nebula n1"></div>
    <div class="nebula n2"></div>
    <div class="danger-overlay" id="danger-overlay"></div>

    <!-- ===== Start Screen ===== -->
    <div id="start-screen" class="screen">
        <button class="home-btn" onclick="goHome()">🏠</button>
        <div class="title-emoji">🚀⌨️</div>
        <h1 class="title-text">英打太空特攻</h1>
        <p class="subtitle">⏱ 選時間 → 👽 打外星人</p>
        <div class="time-row" id="time-row">
            <button class="time-btn" data-secs="30"><span class="icon">⏱</span><span class="label">30 秒</span></button>
            <button class="time-btn" data-secs="300"><span class="icon">⏱</span><span class="label">5 分</span></button>
            <button class="time-btn" data-secs="600"><span class="icon">⏱</span><span class="label">10 分</span></button>
            <button class="time-btn" data-secs="900"><span class="icon">⏱</span><span class="label">15 分</span></button>
            <button class="time-btn" data-secs="1200"><span class="icon">⏱</span><span class="label">20 分</span></button>
        </div>
        <div class="best-info" id="best-info"></div>
    </div>

    <!-- ===== Game Screen ===== -->
    <div id="game-screen" class="hidden">
        <div id="hud">
            <div class="hud-box" id="hud-time">⏱ 0:00</div>
            <div class="hud-box" id="hud-score">🎯 0</div>
            <div class="hud-box combo" id="hud-combo">⚡ x1.0</div>
            <div class="hud-box" id="hud-acc">💯 100%</div>
            <div class="hud-box" id="hud-lives">❤️❤️❤️</div>
        </div>
        <div id="game-area">
            <div class="ground-line"></div>
            <div class="turret" id="turret">🛰️</div>
        </div>
    </div>

    <!-- ===== End Screen ===== -->
    <div id="end-screen" class="screen hidden">
        <button class="home-btn" onclick="goHome()">🏠</button>
        <div class="certificate">
            <span class="cert-corner tl">⭐</span>
            <span class="cert-corner tr">⭐</span>
            <span class="cert-corner bl">⭐</span>
            <span class="cert-corner br">⭐</span>
            <div style="font-size: 60px;" id="cert-trophy">🏆</div>
            <div class="cert-title" id="cert-title">英打太空特攻證書</div>
            <div class="cert-body">
                恭喜完成 <strong id="cert-duration">5</strong> 分鐘的太空訓練！
            </div>
            <div class="cert-stats">
                <div class="cert-stat-box">
                    <div class="cert-stat-label">🎯 總分</div>
                    <div class="cert-stat-value" id="cert-score">0</div>
                </div>
                <div class="cert-stat-box">
                    <div class="cert-stat-label">⌨️ WPM</div>
                    <div class="cert-stat-value" id="cert-wpm">0</div>
                </div>
                <div class="cert-stat-box">
                    <div class="cert-stat-label">🔥 最高連擊</div>
                    <div class="cert-stat-value" id="cert-combo">0</div>
                </div>
                <div class="cert-stat-box">
                    <div class="cert-stat-label">💯 命中率</div>
                    <div class="cert-stat-value" id="cert-acc">100%</div>
                </div>
            </div>
            <div class="cert-rank" id="cert-rank">💪 訓練中</div>
            <div style="margin-top: 12px; font-size: 13px; color: var(--c-light);" id="cert-date"></div>
        </div>
        <div style="margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
            <button class="big-btn gold" onclick="backToStart()">🔄 再玩一次</button>
            <button class="big-btn" onclick="window.print()">🖨️ 列印證書</button>
            <button class="big-btn gray" onclick="goHome()">🏠 回首頁</button>
        </div>
    </div>
</div>

<script>
'use strict';

// ============================================================
// Audio
// ============================================================
let audioCtx = null;
function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}
function beep(freq, duration, type = 'square', volume = 0.12) {
    try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
    } catch (e) {}
}
function sweep(fromFreq, toFreq, duration, type = 'sawtooth', volume = 0.1) {
    try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(fromFreq, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(toFreq, ctx.currentTime + duration);
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
    } catch (e) {}
}
const SFX = {
    type: () => beep(950, 0.04, 'square', 0.07),
    laser: () => sweep(1400, 400, 0.12, 'sawtooth', 0.1),
    boom: () => { sweep(800, 100, 0.2, 'sawtooth', 0.13); setTimeout(() => beep(180, 0.15, 'sawtooth', 0.1), 60); },
    miss: () => beep(140, 0.08, 'sawtooth', 0.06),
    crash: () => { beep(200, 0.4, 'sawtooth', 0.18); setTimeout(() => beep(150, 0.3, 'sawtooth', 0.13), 100); },
    warn: () => beep(880, 0.08, 'sine', 0.1),
    tick: () => beep(660, 0.05, 'sine', 0.12),
    stageUp: () => [523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'sine', 0.1), i * 70)),
    win: () => [523, 659, 784, 1047, 1319, 1047, 1568].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'sine', 0.11), i * 110)),
    lose: () => [400, 320, 240, 160].forEach((f, i) => setTimeout(() => beep(f, 0.25, 'sawtooth', 0.13), i * 180)),
    pause: () => beep(440, 0.1, 'sine', 0.1),
};

// ============================================================
// Word Pools (4 stages of difficulty)
// ============================================================
const WORD_POOLS = {
    letters: 'abcdefghijklmnopqrstuvwxyz'.split(''),
    short: [
        'cat','dog','sun','hat','run','jump','top','red','box','toy',
        'car','bag','egg','bee','sky','bus','fox','pig','cup','fun',
        'big','sit','hop','log','mud','ant','owl','net','jam','ice',
        'map','pen','key','arm','leg','eye','ear','sea','bed','fly',
        'tea','pie','cow','hen','rat','bat','wet','dry','old','new'
    ],
    medium: [
        'happy','school','learn','smile','dream','study','green','table',
        'water','sleep','plant','candy','music','dance','funny','laugh',
        'pizza','sugar','cloud','grass','horse','tiger','panda','train',
        'house','phone','snake','beach','watch','color','paint','brush',
        'sword','magic','space','robot','knife','ocean','river','mouse',
        'sunny','rainy','quiet','quick','sharp','small','round','heavy'
    ],
    sentences: [
        'the cat','i am ok','good job','let us go','run fast',
        'jump high','look up','stay calm','go home','well done',
        'see you','have fun','my dog','i like it','sit down',
        'be brave','dont cry','say hi','great day','keep cool',
        'right now','hold on','take care','no way','high five',
        'over here','step up','catch it','wake up','watch out',
        'oh my god','here we go','one more time','almost there',
        'do your best','never give up','keep going','i love you'
    ]
};
const ALIEN_EMOJIS = ['👾','👽','🛸','👻','🤖','😈','💀','🎃'];

// ============================================================
// State
// ============================================================
const state = {
    duration: 0,
    remaining: 0,
    score: 0,
    combo: 0,
    maxCombo: 0,
    multiplier: 1.0,
    correctChars: 0,
    totalKeys: 0,
    typedChars: 0,
    lives: 3,
    aliens: [],
    playing: false,
    paused: false,
    spawnTimer: null,
    tickTimer: null,
    rafId: null,
    elapsed: 0,
    lastWarnSec: -1,
    lastSpawnTime: 0,
};

// ============================================================
// Helpers
// ============================================================
const $ = (id) => document.getElementById(id);
const gameArea = () => $('game-area');

function fmtTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${sec.toString().padStart(2, '0')}`;
}

function progressRatio() {
    return state.duration > 0 ? state.elapsed / state.duration : 0;
}

function currentStage() {
    const p = progressRatio();
    if (p < 0.20) return { idx: 0, pool: 'letters', label: '🔤 字母', minScore: 1 };
    if (p < 0.50) return { idx: 1, pool: 'short', label: '📖 短單字', minScore: 5 };
    if (p < 0.80) return { idx: 2, pool: 'medium', label: '📚 中單字', minScore: 10 };
    return { idx: 3, pool: 'sentences', label: '💬 句子', minScore: 20 };
}

function maxConcurrentAliens() {
    const p = progressRatio();
    if (p < 0.20) return 3;
    if (p < 0.50) return 4;
    if (p < 0.80) return 5;
    return 5;
}

function spawnInterval() {
    // ms — shorter intervals as game progresses, but longer when words are longer
    const stage = currentStage().idx;
    const base = [1800, 2200, 2600, 3000][stage];
    return base + Math.random() * 600;
}

function fallSpeed() {
    // px per ms
    const p = progressRatio();
    return 0.035 + p * 0.04; // 0.035 → 0.075
}

function loadBest() {
    try {
        const bestScore = parseInt(localStorage.getItem('edtech-unit11-best-score') || '0', 10);
        const bestWpm = parseInt(localStorage.getItem('edtech-unit11-best-wpm') || '0', 10);
        return { bestScore, bestWpm };
    } catch (e) { return { bestScore: 0, bestWpm: 0 }; }
}

function saveBest(score, wpm) {
    try {
        const { bestScore, bestWpm } = loadBest();
        if (score > bestScore) localStorage.setItem('edtech-unit11-best-score', score);
        if (wpm > bestWpm) localStorage.setItem('edtech-unit11-best-wpm', wpm);
    } catch (e) {}
}

function renderBestInfo() {
    const { bestScore, bestWpm } = loadBest();
    if (bestScore === 0 && bestWpm === 0) {
        $('best-info').innerHTML = '<div class="best-chip">🆕 新挑戰者</div>';
    } else {
        $('best-info').innerHTML = `
            <div class="best-chip">🏆 最高分 <strong>${bestScore}</strong></div>
            <div class="best-chip">⚡ 最快 WPM <strong>${bestWpm}</strong></div>
        `;
    }
}

function particles(x, y, emojis, count = 8) {
    for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
        const dist = 70 + Math.random() * 50;
        p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        gameArea().appendChild(p);
        setTimeout(() => p.remove(), 800);
    }
}

function scorePopup(x, y, text) {
    const d = document.createElement('div');
    d.className = 'score-popup';
    d.textContent = text;
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    gameArea().appendChild(d);
    setTimeout(() => d.remove(), 900);
}

function showStageBanner(text) {
    const b = document.createElement('div');
    b.className = 'stage-banner';
    b.textContent = text;
    gameArea().appendChild(b);
    setTimeout(() => b.remove(), 2200);
}

function showCountdown(n) {
    return new Promise(resolve => {
        let cur = n;
        const tick = () => {
            const d = document.createElement('div');
            d.className = 'countdown';
            d.textContent = cur > 0 ? cur : 'GO!';
            gameArea().appendChild(d);
            SFX.warn();
            setTimeout(() => d.remove(), 1000);
            cur--;
            if (cur >= -1) setTimeout(tick, 800);
            else resolve();
        };
        tick();
    });
}

function updateHud() {
    $('hud-time').textContent = '⏱ ' + fmtTime(state.remaining);
    $('hud-score').textContent = '🎯 ' + state.score;
    $('hud-combo').textContent = `⚡ x${state.multiplier.toFixed(1)} (${state.combo})`;
    const acc = state.totalKeys > 0 ? Math.round((state.correctChars / state.totalKeys) * 100) : 100;
    $('hud-acc').textContent = '💯 ' + acc + '%';
    $('hud-lives').textContent = '❤️'.repeat(state.lives) + '🖤'.repeat(3 - state.lives);

    if (state.remaining <= 10) $('hud-time').classList.add('warning');
    else $('hud-time').classList.remove('warning');
    if (state.lives === 1) $('hud-lives').classList.add('warning');
    else $('hud-lives').classList.remove('warning');
}

// ============================================================
// Aliens
// ============================================================
function pickWord() {
    const stage = currentStage();
    const pool = WORD_POOLS[stage.pool];
    return pool[Math.floor(Math.random() * pool.length)];
}

function spawnAlien() {
    if (!state.playing || state.paused) return;
    if (state.aliens.filter(a => !a.dying).length >= maxConcurrentAliens()) return;

    let word = pickWord();
    // Avoid duplicate words on screen
    let tries = 0;
    while (state.aliens.some(a => !a.dying && a.word === word.toLowerCase()) && tries < 5) {
        word = pickWord();
        tries++;
    }
    word = word.toLowerCase();

    // Avoid first letter collision with another active alien's next-expected letter
    const usedFirstLetters = new Set(
        state.aliens.filter(a => !a.dying && a.typed.length === 0).map(a => a.word[0])
    );
    if (usedFirstLetters.has(word[0])) {
        tries = 0;
        while (usedFirstLetters.has(word[0]) && tries < 5) {
            word = pickWord().toLowerCase();
            tries++;
        }
    }

    const margin = 100;
    const x = margin + Math.random() * Math.max(1, window.innerWidth - margin * 2);
    const y = -60;
    const emoji = ALIEN_EMOJIS[Math.floor(Math.random() * ALIEN_EMOJIS.length)];

    const el = document.createElement('div');
    el.className = 'alien';
    el.innerHTML = `<div class="alien-body">${emoji}</div><div class="alien-word"></div>`;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    gameArea().appendChild(el);

    const alien = {
        el,
        word,
        typed: '',
        x, y,
        speed: fallSpeed() * (0.85 + Math.random() * 0.3),
        wordEl: el.querySelector('.alien-word'),
        dying: false,
    };
    state.aliens.push(alien);
    renderAlienWord(alien);
    refreshActive();
}

function renderAlienWord(alien) {
    const typed = alien.typed;
    const word = alien.word;
    let html = '';
    for (let i = 0; i < word.length; i++) {
        const ch = word[i] === ' ' ? ' ' : word[i].toUpperCase();
        if (i < typed.length) html += `<span class="typed">${ch}</span>`;
        else if (i === typed.length) html += `<span class="next">${ch}</span>`;
        else html += `<span class="pending">${ch}</span>`;
    }
    alien.wordEl.innerHTML = html;
}

function refreshActive() {
    // Pick lowest matching alien based on currently-typed prefix among all
    // Default active = lowest non-dying with empty typed (or active stays sticky if any has typed already)
    const alive = state.aliens.filter(a => !a.dying);
    if (alive.length === 0) return;
    // Sticky: if any alien has typed > 0, keep it active
    const sticky = alive.find(a => a.typed.length > 0);
    let lowest = sticky || alive[0];
    if (!sticky) alive.forEach(a => { if (a.y > lowest.y) lowest = a; });
    state.aliens.forEach(a => a.el.classList.toggle('active', a === lowest && !a.dying));
}

// ============================================================
// Main Loop
// ============================================================
let lastFrame = 0;
function loop(timestamp) {
    if (!state.playing) return;
    if (state.paused) {
        lastFrame = timestamp;
        state.rafId = requestAnimationFrame(loop);
        return;
    }
    const dt = lastFrame ? Math.min(timestamp - lastFrame, 50) : 16;
    lastFrame = timestamp;

    const earthLine = window.innerHeight - 75;

    state.aliens.forEach(a => {
        if (a.dying) return;
        a.y += a.speed * dt;
        a.el.style.top = a.y + 'px';

        if (a.y >= earthLine) {
            a.dying = true;
            alienCrashed(a);
        }
    });

    // Spawn check (in addition to interval timer for adaptive density)
    state.rafId = requestAnimationFrame(loop);
}

function alienCrashed(alien) {
    alien.el.classList.add('missing');
    state.aliens = state.aliens.filter(a => a !== alien);
    state.combo = 0;
    state.multiplier = 1.0;
    state.lives--;
    SFX.crash();
    const overlay = $('danger-overlay');
    overlay.classList.remove('flash');
    void overlay.offsetWidth;
    overlay.classList.add('flash');
    setTimeout(() => alien.el.remove(), 500);
    updateHud();
    refreshActive();
    if (state.lives <= 0) {
        endGame();
    }
}

// ============================================================
// Key Input
// ============================================================
function handleKey(e) {
    // Pause via Esc
    if (e.key === 'Escape') {
        if (state.playing) {
            e.preventDefault();
            togglePause();
        }
        return;
    }
    // F8 dev jump to end
    if (e.key === 'F8' && state.playing) {
        e.preventDefault();
        endGame();
        return;
    }
    if (!state.playing || state.paused) return;
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.key.length !== 1) return;
    const key = e.key.toLowerCase();
    // Accept a-z and space
    if (!/^[a-z ]$/.test(key)) return;
    e.preventDefault();

    state.totalKeys++;

    // Find best matching alien: one whose next expected char matches `key`
    // Prefer alien with non-empty typed (sticky), then lowest-on-screen
    const alive = state.aliens.filter(a => !a.dying);
    if (alive.length === 0) {
        SFX.miss();
        state.combo = 0;
        state.multiplier = 1.0;
        updateHud();
        return;
    }
    const matches = alive.filter(a => a.word[a.typed.length] === key);
    if (matches.length === 0) {
        SFX.miss();
        state.combo = 0;
        state.multiplier = 1.0;
        // Brief red flash on lowest alien
        let lowest = alive[0];
        alive.forEach(a => { if (a.y > lowest.y) lowest = a; });
        lowest.el.style.filter = 'brightness(1.5) hue-rotate(-30deg)';
        setTimeout(() => lowest.el.style.filter = '', 120);
        updateHud();
        return;
    }
    // Prefer one already in-progress
    let target = matches.find(a => a.typed.length > 0);
    if (!target) {
        target = matches[0];
        matches.forEach(a => { if (a.y > target.y) target = a; });
    }
    state.correctChars++;
    state.typedChars++;
    target.typed += key;
    state.combo++;
    if (state.combo > state.maxCombo) state.maxCombo = state.combo;
    // Multiplier: every 5 combos +0.1, max 2.0
    state.multiplier = Math.min(2.0, 1.0 + Math.floor(state.combo / 5) * 0.1);
    SFX.type();
    renderAlienWord(target);
    fireLaser(target);
    if (target.typed.length >= target.word.length) {
        killAlien(target);
    } else {
        refreshActive();
        updateHud();
    }
}

function fireLaser(target) {
    const turret = $('turret');
    const tr = turret.getBoundingClientRect();
    const ax = target.x;
    const ay = target.y;
    const startX = tr.left + tr.width / 2;
    const startY = tr.top + tr.height / 2;
    const dx = ax - startX;
    const dy = ay - startY;
    const length = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;

    const laser = document.createElement('div');
    laser.className = 'laser';
    laser.style.left = startX + 'px';
    laser.style.top = (startY - length) + 'px';
    laser.style.height = length + 'px';
    laser.style.transform = `rotate(${angle}deg)`;
    laser.style.transformOrigin = `center ${length}px`;
    gameArea().appendChild(laser);
    SFX.laser();
    setTimeout(() => laser.remove(), 200);
}

function killAlien(alien) {
    alien.dying = true;
    alien.el.classList.add('dying');
    state.aliens = state.aliens.filter(a => a !== alien);
    SFX.boom();
    particles(alien.x, alien.y, ['💥','✨','⭐','🌟'], 12);

    // Score by word length
    const len = alien.word.replace(/\s/g, '').length;
    let base;
    if (alien.word.includes(' ')) base = 20;
    else if (len <= 1) base = 1;
    else if (len <= 4) base = 5;
    else base = 10;
    const bonus = Math.round(base * state.multiplier);
    state.score += bonus;
    scorePopup(alien.x, alien.y, `+${bonus}`);
    setTimeout(() => alien.el.remove(), 500);
    updateHud();
    refreshActive();
}

// ============================================================
// Pause
// ============================================================
function togglePause() {
    if (state.paused) {
        resumeGame();
    } else {
        pauseGame();
    }
}

function pauseGame() {
    if (!state.playing || state.paused) return;
    state.paused = true;
    SFX.pause();
    clearInterval(state.spawnTimer);
    clearInterval(state.tickTimer);
    const overlay = document.createElement('div');
    overlay.className = 'pause-overlay';
    overlay.id = 'pause-overlay';
    overlay.innerHTML = `
        <div class="pause-emoji">⏸️</div>
        <div class="pause-text">暫停中</div>
        <button class="big-btn gold" id="resume-btn">▶️ 繼續</button>
        <button class="big-btn gray" id="quit-btn">🏠 回首頁</button>
    `;
    document.body.appendChild(overlay);
    $('resume-btn').onclick = resumeGame;
    $('quit-btn').onclick = goHome;
}

function resumeGame() {
    if (!state.paused) return;
    state.paused = false;
    SFX.pause();
    const o = $('pause-overlay');
    if (o) o.remove();
    state.spawnTimer = setInterval(() => spawnAlien(), spawnInterval());
    startTickTimer();
}

// ============================================================
// Tick (per-second timer)
// ============================================================
function startTickTimer() {
    clearInterval(state.tickTimer);
    state.tickTimer = setInterval(() => {
        if (!state.playing || state.paused) return;
        state.elapsed++;
        state.remaining = Math.max(0, state.duration - state.elapsed);

        // Stage change detection
        const stageNow = currentStage();
        if (state.lastStageIdx !== undefined && state.lastStageIdx !== stageNow.idx) {
            showStageBanner(stageNow.label);
            SFX.stageUp();
            // Refresh spawn interval
            clearInterval(state.spawnTimer);
            state.spawnTimer = setInterval(() => spawnAlien(), spawnInterval());
        }
        state.lastStageIdx = stageNow.idx;

        // Warning sounds
        if (state.remaining <= 3 && state.remaining > 0 && state.lastWarnSec !== state.remaining) {
            SFX.tick();
            state.lastWarnSec = state.remaining;
        } else if (state.remaining === 10) {
            SFX.warn();
        }

        updateHud();

        if (state.remaining <= 0) {
            endGame();
        }
    }, 1000);
}

// ============================================================
// Start / End
// ============================================================
function startGameWithDuration(seconds) {
    state.duration = seconds;
    state.remaining = seconds;
    state.elapsed = 0;
    state.score = 0;
    state.combo = 0;
    state.maxCombo = 0;
    state.multiplier = 1.0;
    state.correctChars = 0;
    state.totalKeys = 0;
    state.typedChars = 0;
    state.lives = 3;
    state.aliens = [];
    state.lastStageIdx = undefined;
    state.lastWarnSec = -1;

    $('start-screen').classList.add('hidden');
    $('game-screen').classList.remove('hidden');
    $('end-screen').classList.add('hidden');
    getAudio();

    // Clear any leftover alien DOM
    gameArea().querySelectorAll('.alien').forEach(el => el.remove());

    updateHud();

    // 3-2-1 countdown then start
    showCountdown(3).then(() => {
        state.playing = true;
        state.paused = false;
        const stage = currentStage();
        showStageBanner(stage.label);
        state.lastStageIdx = stage.idx;

        state.spawnTimer = setInterval(() => spawnAlien(), spawnInterval());
        // Spawn first alien immediately
        setTimeout(spawnAlien, 200);

        startTickTimer();

        lastFrame = 0;
        state.rafId = requestAnimationFrame(loop);
    });
}

function endGame() {
    state.playing = false;
    state.paused = false;
    clearInterval(state.spawnTimer);
    clearInterval(state.tickTimer);
    cancelAnimationFrame(state.rafId);
    const po = $('pause-overlay');
    if (po) po.remove();

    // Remove aliens
    setTimeout(() => {
        state.aliens.forEach(a => { if (a.el) a.el.remove(); });
        state.aliens = [];
    }, 100);

    // Calculate WPM
    const elapsedMin = Math.max(state.elapsed, 1) / 60;
    const wpm = Math.round((state.correctChars / 5) / elapsedMin);
    const acc = state.totalKeys > 0 ? Math.round((state.correctChars / state.totalKeys) * 100) : 100;

    saveBest(state.score, wpm);

    $('game-screen').classList.add('hidden');
    $('end-screen').classList.remove('hidden');

    const durMin = state.duration < 60 ? `${state.duration} 秒` : `${Math.round(state.duration / 60)} 分`;
    $('cert-duration').textContent = durMin;
    $('cert-score').textContent = state.score;
    $('cert-wpm').textContent = wpm;
    $('cert-combo').textContent = state.maxCombo;
    $('cert-acc').textContent = acc + '%';

    const today = new Date();
    $('cert-date').textContent = `${today.getFullYear() - 1911} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日 頒發`;

    let rank, trophy, title;
    if (wpm >= 40) {
        rank = '👑 太空艦長'; trophy = '👑'; title = '英打太空特攻 · 最高榮譽';
        SFX.win();
    } else if (wpm >= 25) {
        rank = '🥇 戰機飛行員'; trophy = '🥇'; title = '英打太空特攻 · 金牌';
        SFX.win();
    } else if (wpm >= 15) {
        rank = '🥈 太空新兵'; trophy = '🥈'; title = '英打太空特攻 · 銀牌';
        SFX.stageUp();
    } else {
        rank = '💪 訓練中'; trophy = '💪'; title = '英打太空特攻 · 努力獎';
        SFX.lose();
    }
    $('cert-trophy').textContent = trophy;
    $('cert-title').textContent = title;
    $('cert-rank').textContent = rank;
}

function backToStart() {
    $('end-screen').classList.add('hidden');
    $('game-screen').classList.add('hidden');
    $('start-screen').classList.remove('hidden');
    renderBestInfo();
}

function goHome() {
    // Confirm-less return — directly navigate to portfolio root
    location.href = '../../index.html';
}

// ============================================================
// Init
// ============================================================
function init() {
    renderBestInfo();
    // Time buttons
    document.querySelectorAll('.time-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const secs = parseInt(btn.dataset.secs, 10);
            startGameWithDuration(secs);
        });
    });
    // Global key listener
    document.addEventListener('keydown', handleKey);
    // Resize: keep aliens within bounds
    window.addEventListener('resize', () => {
        state.aliens.forEach(a => {
            if (a.x > window.innerWidth - 80) {
                a.x = window.innerWidth - 80;
                a.el.style.left = a.x + 'px';
            }
        });
    });
}

init();
</script>
</body>
</html>
