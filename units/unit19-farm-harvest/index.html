<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拔蔬菜 - 滑鼠島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="../../assets/css/mouse-island.css">
  <style>
    /* 場景樣式：class 一律 sc- 開頭 */
    .sc-bg { position: absolute; inset: 0; overflow: hidden; background: #BFE1EA; user-select: none; -webkit-user-select: none; }
    .sc-sun { position: absolute; left: 78px; top: 24px; width: 76px; height: 76px; pointer-events: none; }
    .sc-cloud { position: absolute; pointer-events: none; opacity: .92; }
    .sc-cloud-1 { left: 250px; top: 22px; width: 132px; height: 52px; animation: sc-drift 28s linear infinite; }
    .sc-cloud-2 { left: 820px; top: 18px; width: 112px; height: 46px; animation: sc-drift 36s linear infinite reverse; }
    .sc-hills { position: absolute; left: 0; right: 0; top: 96px; height: 64px; pointer-events: none; }
    .sc-fence { position: absolute; left: 0; right: 0; top: 114px; height: 42px; pointer-events: none; }
    .sc-soil { position: absolute; left: 0; right: 0; top: 146px; bottom: 0; background: #E9D2A0; border-top: 6px solid #9A5F36; }
    .sc-field-bed {
      position: absolute; left: 32px; top: 26px; width: 920px; bottom: 26px;
      border-radius: 28px; background: #C8915A; border: 4px solid #6E4125;
      box-shadow: inset 0 8px 0 rgba(110, 65, 37, .18);
      overflow: hidden;
    }
    .sc-furrow {
      position: absolute; left: -12px; right: -12px; height: 46px;
      background: #B47843; border-top: 3px solid #9A5F36; border-bottom: 3px solid #9A5F36;
      opacity: .72; pointer-events: none;
    }
    .sc-furrow-1 { top: 44px; }
    .sc-furrow-2 { top: 150px; }
    .sc-furrow-3 { top: 256px; }
    .sc-grass-pad {
      position: absolute; right: 26px; top: 26px; width: 356px; bottom: 26px;
      border-radius: 28px; background: #F6E7BE; border: 4px dashed #B9794A;
      pointer-events: none;
    }

    /* 右上角計數 */
    .sc-count {
      position: absolute; right: 24px; top: 14px; z-index: 40;
      padding: 6px 18px; background: #FFF8E4; color: #33261B;
      border: 3px solid #9A5F36; border-radius: 16px;
      font-size: 22px; font-weight: 900; line-height: 1.3;
      box-shadow: 0 3px 0 rgba(110, 65, 37, .25);
      pointer-events: none;
    }

    /* 土坑 */
    .sc-hole { position: absolute; pointer-events: none; z-index: 10; }
    .sc-hole svg { width: 100%; height: 100%; display: block; }

    /* 蔬菜目標 */
    .sc-veg {
      position: absolute; z-index: 22; cursor: grab;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .sc-veg.sc-grab { cursor: grabbing; z-index: 65; }
    .sc-veg.sc-done { pointer-events: none; opacity: 0; transition: opacity .2s; }
    .sc-veg-clip {
      position: relative; width: 100%; height: 100%;
      overflow: hidden;
    }
    .sc-veg:not(.sc-buried) .sc-veg-clip { overflow: visible; }
    .sc-veg-inner {
      width: 100%; height: 100%;
      transform-origin: 50% 85%;
      will-change: transform;
    }
    .sc-veg-inner svg { width: 100%; height: 100%; display: block; overflow: visible; }
    /* 埋在土裡：往下沉，只露出葉子與一點頂部 */
    .sc-veg.sc-buried .sc-veg-clip {
      height: 62%;
    }
    .sc-veg.sc-buried .sc-veg-inner {
      transform: translateY(28%);
      transition: transform .18s ease-out;
    }
    .sc-veg.sc-buried.sc-grab .sc-veg-inner { transition: none; }
    /* 前景小土丘：只在埋著時蓋住底部 */
    .sc-front-soil {
      position: absolute; left: -6%; right: -6%; top: 52%; height: 34%;
      pointer-events: none; z-index: 3;
      transition: opacity .15s;
    }
    .sc-front-soil svg { width: 100%; height: 100%; display: block; }
    .sc-veg:not(.sc-buried) .sc-front-soil { opacity: 0; }

    /* 蔬菜表情切換 */
    .sc-veg .sc-face-happy,
    .sc-veg .sc-face-oops { display: none; }
    .sc-veg.sc-pulled .sc-face-normal { display: none; }
    .sc-veg.sc-pulled .sc-face-happy { display: inline; }
    .sc-veg.sc-oops .sc-face-normal,
    .sc-veg.sc-oops .sc-face-happy { display: none; }
    .sc-veg.sc-oops .sc-face-oops { display: inline; }

    /* 金蘿蔔󠇡（彩虹目標）光暈＋深木外圈，脈動頻率 0.6Hz（≤ 3Hz） */
    .sc-veg.sc-gold::before {
      content: ""; position: absolute; inset: -10px; border-radius: 50%;
      border: 4px dashed #6E4125;
      background: radial-gradient(circle, rgba(242, 177, 52, .45) 0%, rgba(242, 177, 52, 0) 70%);
      pointer-events: none;
      animation: sc-gold-pulse 1.6s ease-in-out infinite;
    }

    /* 失手反應動畫：放錯籃跳出來搖頭、沒拔好彈回去 */
    .sc-veg.sc-returning { transition: left .36s cubic-bezier(.22, 1.25, .45, 1), top .36s cubic-bezier(.22, 1.25, .45, 1); }
    .sc-veg.sc-shake-head .sc-veg-inner { animation: sc-headshake .55s ease-in-out; }

    /* 菜籃 */
    .sc-basket {
      position: absolute; z-index: 16;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      transition: transform .18s ease-out;
      pointer-events: auto;
    }
    .sc-basket.sc-basket-over { transform: scale(1.07); }
    .sc-basket.sc-basket-over .sc-basket-frame { filter: drop-shadow(0 0 10px #F2B134); }
    .sc-basket.sc-basket-bounce { animation: sc-bounce .42s cubic-bezier(.34, 1.56, .64, 1); }
    .sc-basket-frame { position: relative; width: 100%; height: 100%; }
    .sc-basket-back { position: absolute; inset: 0; z-index: 1; }
    .sc-basket-back svg, .sc-basket-front svg { width: 100%; height: 100%; display: block; }
    .sc-basket-items {
      position: absolute; left: 10%; right: 10%; bottom: 44%; height: 54%;
      z-index: 2; display: flex; align-items: flex-end; justify-content: center; gap: 2px;
      pointer-events: none;
    }
    .sc-in-basket {
      width: 56px; height: 64px; flex: 0 0 auto; margin: 0 -8px;
      transform-origin: 50% 90%;
      animation: sc-drop-in .35s cubic-bezier(.34, 1.45, .64, 1);
    }
    .sc-in-basket svg { width: 100%; height: 100%; display: block; }
    .sc-in-basket.sc-dance { animation: sc-veg-dance .65s ease-in-out infinite; }
    .sc-basket-front { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .sc-basket-tag {
      position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%);
      z-index: 4; display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; background: #FFF8E4; color: #33261B;
      border: 3px solid #6E4125; border-radius: 12px;
      font-size: 19px; font-weight: 900; line-height: 1.2;
      box-shadow: 0 2px 0 rgba(110, 65, 37, .28);
      pointer-events: none; white-space: nowrap;
    }
    .sc-basket-tag-icon { width: 32px; height: 32px; flex: 0 0 auto; }
    .sc-basket-tag-icon svg { width: 100%; height: 100%; display: block; }
    .sc-basket-s3 .sc-basket-tag { font-size: 17px; padding: 3px 10px; bottom: 9%; }
    .sc-basket-s3 .sc-basket-tag-icon { width: 28px; height: 28px; }
    .sc-basket-s3 .sc-in-basket { width: 44px; height: 50px; margin: 0 -6px; }

    /* 特效：拔出土塊與入籃星星 */
    .sc-fx { position: absolute; pointer-events: none; z-index: 70; }
    .sc-dirt-dot {
      position: absolute; width: 14px; height: 10px; border-radius: 50%;
      background: #6E4125; border: 2px solid #33261B;
      animation: sc-dirt-fly .48s ease-out forwards;
    }
    .sc-pop-ring {
      position: absolute; left: -34px; top: -34px; width: 68px; height: 68px;
      border-radius: 50%; border: 4px dashed #F2B134;
      animation: sc-ring-out .42s ease-out forwards;
    }
    .sc-star {
      position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px;
      animation: sc-star-fly .65s ease-out forwards;
    }
    .sc-star svg { width: 100%; height: 100%; display: block; }

    /* 第三段干擾物：田邊散步的小烏鴉 */
    .sc-crow {
      position: absolute; width: 82px; height: 70px; z-index: 18;
      pointer-events: auto;
    }
    .sc-crow-inner { width: 100%; height: 100%; transition: transform .15s; }
    .sc-crow-inner svg { width: 100%; height: 100%; display: block; }
    .sc-crow.sc-crow-flip .sc-crow-inner { transform: scaleX(-1); }
    .sc-crow.sc-crow-flap { animation: sc-crow-hop .38s ease-out; }

    @keyframes sc-drift { from { transform: translateX(0); } to { transform: translateX(60px); } }
    @keyframes sc-gold-pulse { 0%, 100% { transform: scale(.96); opacity: .75; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes sc-bounce {
      0% { transform: scale(1, 1); }
      35% { transform: scale(1.12, .88); }
      70% { transform: scale(.95, 1.06); }
      100% { transform: scale(1, 1); }
    }
    @keyframes sc-drop-in {
      0% { transform: translateY(-48px) scale(.8); opacity: .4; }
      70% { transform: translateY(6px) scale(1.06, .92); opacity: 1; }
      100% { transform: translateY(0) scale(1, 1); opacity: 1; }
    }
    @keyframes sc-veg-dance {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-12px) rotate(6deg); }
    }
    @keyframes sc-headshake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-16deg) translateY(-10px); }
      45% { transform: rotate(16deg) translateY(-10px); }
      70% { transform: rotate(-12deg) translateY(-6px); }
    }
    @keyframes sc-dirt-fly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; }
    }
    @keyframes sc-ring-out {
      0% { transform: scale(.4); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    @keyframes sc-star-fly {
      0% { transform: translate(0, 0) scale(.5) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(90deg); opacity: 0; }
    }
    @keyframes sc-crow-hop {
      0%, 100% { transform: translateY(0); }
      45% { transform: translateY(-18px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .sc-cloud-1, .sc-cloud-2, .sc-veg.sc-gold::before,
      .sc-in-basket, .sc-in-basket.sc-dance, .sc-basket.sc-basket-bounce,
      .sc-veg.sc-shake-head .sc-veg-inner, .sc-crow.sc-crow-flap,
      .sc-dirt-dot, .sc-pop-ring, .sc-star {
        animation: none !important;
      }
      .sc-veg.sc-returning, .sc-veg.sc-buried .sc-veg-inner, .sc-basket {
        transition: none !important;
      }
    }
  </style>

          };
          el.style.left = (obj.x - obj.w / 2) + 'px';
          el.style.top = (obj.y - obj.h / 2) + 'px';
          api.field.appendChild(el);
          crow = obj;
          return obj;
        }

        // ── 建立蔬菜與拔拉邏輯 ──
        function placeVeg(v, cx, cy) {
          v.el.style.left = (cx - v.size / 2) + 'px';
          v.el.style.top = (cy - v.size / 2) + 'px';
        }

        function resizeVeg(v, newSize) {
          // 限制大小確保絕不進入左下角寄寄區（x < 560 且 y > 400）
          var maxAllowed = 260;
          if (v.x - newSize / 2 < 560 && v.y + newSize / 2 > 396) {
            newSize = Math.min(newSize, Math.max(80, (396 - v.y) * 2));
          }
          v.size = Math.min(maxAllowed, Math.round(newSize));
          v.el.style.width = v.size + 'px';
          v.el.style.height = v.size + 'px';
          placeVeg(v, v.x, v.y);
          var hw = Math.round(v.size * 0.88);
          var hh = Math.round(v.size * 0.34);
          v.hole.style.width = hw + 'px';
          v.hole.style.height = hh + 'px';
          v.hole.style.left = (v.x - hw / 2) + 'px';
          v.hole.style.top = (v.y + v.size * 0.08) + 'px';
        }

        function spawnVeg(opts) {
          var hole = document.createElement('div');
          hole.className = 'sc-hole';
          hole.innerHTML = HOLE_SVG;
          api.field.appendChild(hole);

          var el = document.createElement('div');
          el.className = 'sc-veg sc-buried' + (opts.type === 'gold' ? ' sc-gold' : '');
          el.innerHTML =
            '<div class="sc-veg-clip"><div class="sc-veg-inner">' + sceneVegSvg(opts.type) + '</div></div>' +
            '<div class="sc-front-soil">' + FRONT_SOIL_SVG + '</div>';
          api.field.appendChild(el);

          var v = {
            type: opts.type,
            el: el,
            inner: el.querySelector('.sc-veg-inner'),
            hole: hole,
            x: opts.x,
            y: opts.y,
            baseSize: opts.baseSize,
            size: opts.size,
            pulled: false,
            done: false
          };
          resizeVeg(v, opts.size);
          vegs.push(v);

          var targetEls = baskets.map(function (b) { return b.el; });
          if (crow) targetEls.push(crow.el);

          function resetToHole(withOops) {
            v.pulled = false;
            el.classList.remove('sc-grab', 'sc-pulled');
            el.classList.add('sc-buried', 'sc-returning');
            v.inner.style.transform = '';
            placeVeg(v, v.x, v.y);
            if (withOops) {
              el.classList.add('sc-oops', 'sc-shake-head');
              api.later(function () {
                el.classList.remove('sc-oops', 'sc-shake-head', 'sc-returning');
              }, 580);
            } else {
              api.later(function () { el.classList.remove('sc-returning'); }, 400);
            }
          }

          var off = api.on(el, 'drag', {
            start: function () {
              if (v.done || stageEnding) return;
              v.pulled = false;
              el.classList.remove('sc-returning', 'sc-oops', 'sc-shake-head');
              el.classList.add('sc-grab');
              v.inner.style.transform = 'translateY(24%) scale(1.04, 0.96)';
            },
            move: function (pos, dx, dy) {
              if (v.done || stageEnding) return;
              var ddx = dx || 0;
              var ddy = dy || 0;
              var th = pullThreshold();

              if (!v.pulled) {
                var pullUp = Math.max(0, -ddy);
                var dist = Math.hypot(ddx, ddy);
                var ratio = Math.min(1, Math.max(pullUp, dist * 0.72) / th);
                var sx = 1 - ratio * 0.16;
                var sy = 1 + ratio * 0.42;
                var tilt = Math.max(-14, Math.min(14, ddx * 0.16));
                var liftPct = 28 - ratio * 28;
                v.inner.style.transform =
                  'translateY(' + liftPct.toFixed(1) + '%) rotate(' + tilt.toFixed(1) + 'deg) scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ')';

                // 拉超過門檻（80px，assist 時 40px）啵一聲拔出來
                if (pullUp >= th || dist >= th * 1.18) {
                  v.pulled = true;
                  el.classList.remove('sc-buried');
                  el.classList.add('sc-pulled');
                  v.inner.style.transform = 'scale(1.06)';
                  api.sfx('pop');
                  spawnDirt(v.x, v.y + v.size * 0.1);
                  placeVeg(v, v.x + ddx, v.y + ddy);
                  highlightNearBasket(v.x + ddx, v.y + ddy);
                }
              } else {
                var nx = v.x + ddx;
                var ny = v.y + ddy;
                placeVeg(v, nx, ny);
                highlightNearBasket(nx, ny);
              }
            },
            drop: function (pos, target) {
              if (v.done || stageEnding) return;
              clearBasketHover();
              el.classList.remove('sc-grab');

              // 還沒拔出來就放手：彈回土裡、晃一晃
              if (!v.pulled) {
                resetToHole(false);
                api.sfx('boing');
                api.wob(el);
                api.miss();
                return;
              }

              // 第三段拖到小烏鴉身上：無效果、不算失手
              if (crow && target === crow.el) {
                crow.el.classList.remove('sc-crow-flap');
                void crow.el.offsetWidth;
                crow.el.classList.add('sc-crow-flap');
                resetToHole(false);
                return;
              }

              // 找放進哪一個菜籃
              var hitBasket = null;
              for (var i = 0; i < baskets.length; i++) {
                if (baskets[i].el === target) { hitBasket = baskets[i]; break; }
              }

              // 放在菜籃以外的地方：咚掉回原位、晃一晃
              if (!hitBasket) {
                resetToHole(false);
                api.sfx('boing');
                api.wob(el);
                api.miss();
                return;
              }

              // 放進錯的菜籃（第三段）：從籃子裡跳出來搖頭回原位
              if (!basketAccepts(hitBasket, v.type)) {
                placeVeg(v, hitBasket.x, hitBasket.y - hitBasket.h * 0.25);
                el.classList.add('sc-oops', 'sc-shake-head');
                api.sfx('giggle');
                api.wob(hitBasket.el);
                api.miss();
                api.later(function () {
                  if (!v.done) resetToHole(true);
                }, 260);
                return;
              }

              // 放進對的菜籃！
              v.done = true;
              api.glow(el, false);
              el.classList.add('sc-done');

              // 蔬菜跳進籃子裡露臉＋籃子彈一下＋星星
              var inEl = document.createElement('div');
              inEl.className = 'sc-in-basket';
              inEl.innerHTML = sceneVegSvg(v.type);
              var faceN = inEl.querySelector('.sc-face-normal');
              var faceH = inEl.querySelector('.sc-face-happy');
              if (faceN) faceN.style.display = 'none';
              if (faceH) faceH.style.display = 'inline';
              hitBasket.el.querySelector('.sc-basket-items').appendChild(inEl);

              hitBasket.el.classList.remove('sc-basket-bounce');
              void hitBasket.el.offsetWidth;
              hitBasket.el.classList.add('sc-basket-bounce');
              spawnStars(hitBasket.x, hitBasket.y - hitBasket.h * 0.3);

              api.collect(v.type);
              api.hit();
              doneCount++;
              updateCount();

              onVegHarvested();
            },
            tap: function () {
              if (v.done || stageEnding) return;
              el.classList.remove('sc-grab');
              v.inner.style.transform = '';
              api.sfx('giggle');
              api.wob(el);
              api.miss();
            }
          }, { follow: false, targets: targetEls });

          offs.push(off);
          return v;
        }

        function onVegHarvested() {
          if (stageIdx === 0) {
            stageEnding = true;
            api.later(function () { api.stageDone(); }, 550);
          } else if (stageIdx === 1) {
            stage2Idx++;
            if (doneCount >= total) {
              stageEnding = true;
              api.later(function () { api.stageDone(); }, 550);
            } else {
              api.later(function () { spawnStage2Next(); }, 360);
            }
          } else if (stageIdx === 2) {
            if (doneCount >= total) {
              stageEnding = true;
              // 菜籃裡的蔬菜一起跳舞
              var allIn = api.field.querySelectorAll('.sc-in-basket');
              for (var i = 0; i < allIn.length; i++) {
                allIn[i].classList.add('sc-dance');
                allIn[i].style.animationDelay = (i * 0.12) + 's';
              }
              api.sfx('ok');
              api.say('電腦上搬檔案，也是這樣拖！');
              api.later(function () { api.stageDone(); }, 3000);
            }
          }
        }

        // ── 第二段：一次出一棵（涵蓋多種普通菜＋偶爾戴帽蘿蔔󠇡） ──
        var S2_SPOTS = [
          { x: 250, y: 265 },
          { x: 470, y: 280 },
          { x: 685, y: 405 },
          { x: 360, y: 255 }
        ];

        function buildStage2Queue() {
          var got = api.collected() || [];
          var normals = ['radish', 'potato', 'onion', 'tomato', 'pumpkin', 'carrot'];
          // 優先把還沒收集過的普通菜排前面，幫助收集圖鑑
          normals.sort(function (a, b) {
            var ga = got.indexOf(a) === -1 ? 0 : 1;
            var gb = got.indexOf(b) === -1 ? 0 : 1;
            return ga - gb || (Math.random() - 0.5);
          });
          var picks = normals.slice(0, 4);
          // 偶爾出現戴帽蘿蔔󠇡小驚喜
          if (Math.random() < (got.indexOf('hat') === -1 ? 0.55 : 0.25)) {
            picks[Math.floor(Math.random() * 4)] = 'hat';
          }
          // 座標洗牌
          var spots = S2_SPOTS.slice().sort(function () { return Math.random() - 0.5; });
          stage2Queue = picks.map(function (t, idx) {
            return { type: t, x: spots[idx].x, y: spots[idx].y };
          });
          stage2Idx = 0;
        }

        function spawnStage2Next() {
          if (stage2Idx >= stage2Queue.length) return;
          var item = stage2Queue[stage2Idx];
          var cfg = api.cfg();
          var k = assisted ? Math.max(cfg.size, 1.35) : cfg.size;
          spawnVeg({
            type: item.type,
            x: item.x,
            y: item.y,
            baseSize: 180,
            size: 180 * k
          });
        }

        // ── 第三段：5 棵同時種在田裡（紅蘿蔔󠇡/戴帽、番茄、南瓜＋每 4 棵一次金蘿蔔󠇡） ──
        var S3_SPOTS = [
          { x: 215, y: 245 },
          { x: 445, y: 235 },
          { x: 675, y: 240 },
          { x: 665, y: 415 },
          { x: 855, y: 365 }
        ];

        function buildStage3Types() {
          var got = api.collected() || [];
          var list = ['carrot', 'tomato', 'pumpkin'];
          var extras = ['carrot', 'tomato', 'pumpkin'];
          while (list.length < 5) {
            list.push(extras[Math.floor(Math.random() * extras.length)]);
          }
          // 偶爾把其中一棵紅蘿蔔󠇡變成戴帽蘿蔔󠇡（算紅蘿蔔󠇡籃）
          var cIdx = list.indexOf('carrot');
          if (cIdx !== -1 && Math.random() < (got.indexOf('hat') === -1 ? 0.7 : 0.35)) {
            list[cIdx] = 'hat';
          }
          // 打亂順序後，依 goldCounter 約每 4 棵出現一次金蘿蔔󠇡（彩虹目標）
          list.sort(function () { return Math.random() - 0.5; });
          for (var i = 0; i < list.length; i++) {
            goldCounter++;
            if (goldCounter % 4 === 0) {
              list[i] = 'gold';
            }
          }
          return list;
        }

        // ── 主動畫迴圈（第二段移動菜籃、第三段田邊小烏鴉） ──
        function startLoop() {
          var last = performance.now();
          (function tick(now) {
            var dt = Math.min(0.05, (now - last) / 1000);
            last = now;

            if (!reducedMotion && !stageEnding) {
              baskets.forEach(function (b) {
                if (!b.vx) return;
                b.x += b.vx * dt;
                if (b.x < b.minX) { b.x = b.minX; b.vx = Math.abs(b.vx); }
                if (b.x > b.maxX) { b.x = b.maxX; b.vx = -Math.abs(b.vx); }
                b.el.style.left = (b.x - b.w / 2) + 'px';
              });

              if (crow && crow.vx) {
                crow.x += crow.vx * dt;
                if (crow.x < crow.minX) {
                  crow.x = crow.minX;
                  crow.vx = Math.abs(crow.vx);
                  crow.el.classList.remove('sc-crow-flip');
                } else if (crow.x > crow.maxX) {
                  crow.x = crow.maxX;
                  crow.vx = -Math.abs(crow.vx);
                  crow.el.classList.add('sc-crow-flip');
                }
                crow.el.style.left = (crow.x - crow.w / 2) + 'px';
              }
            }
            raf = requestAnimationFrame(tick);
          })(last);
        }

        function activeVeg() {
          for (var i = 0; i < vegs.length; i++) {
            if (!vegs[i].done) return vegs[i];
          }
          return null;
        }

        return {
          start: function (stage, cfg) {
            clear();
            stageIdx = stage;
            doneCount = 0;
            assisted = !!cfg.assist;
            api.field.innerHTML = BG_HTML;

            if (stage === 0) {
              // 第一段「看我示範」：1 棵大紅蘿蔔󠇡（220px）＋大菜籃（220px），乾淨無干擾
              total = 1;
              updateCount();
              var b0 = makeBasket({ x: 1065, y: 300, w: 224, h: 174, label: '菜籃' });
              var v0 = spawnVeg({
                type: 'carrot',
                x: 640,
                y: 265,
                baseSize: 220,
                size: 220 * cfg.size
              });
              api.glow(v0.el, true);
              api.demo(v0.el, 'drag', { to: b0.el });

            } else if (stage === 1) {
              // 第二段「自己來」：4 棵一次一棵（180px，使用者試玩前放大），右邊菜籃慢慢左右移動
              total = 4;
              updateCount();
              var speed = (assisted || reducedMotion) ? 0 : 56 * cfg.speed;
              makeBasket({
                x: 1070, y: 315, w: 196, h: 152,
                minX: 965, maxX: 1185, vx: speed,
                label: '菜籃'
              });
              buildStage2Queue();
              spawnStage2Next();

            } else {
              // 第三段「小挑戰」：5 棵同時種在田裡（120px 乘 cfg.size）＋3 個分類菜籃＋田邊小烏鴉
              total = 5;
              updateCount();
              makeBasket({ x: 1155, y: 248, w: 256, h: 118, stage3: true, icon: 'carrot',  label: '紅蘿蔔󠇡籃', accept: ['carrot', 'hat'] });
              makeBasket({ x: 1155, y: 372, w: 256, h: 118, stage3: true, icon: 'tomato',  label: '番茄籃',   accept: ['tomato'] });
              makeBasket({ x: 1155, y: 496, w: 256, h: 118, stage3: true, icon: 'pumpkin', label: '南瓜籃',   accept: ['pumpkin'] });
              makeCrow(cfg);

              var types = buildStage3Types();
              var spots = S3_SPOTS.slice().sort(function () { return Math.random() - 0.5; });
              for (var i = 0; i < 5; i++) {
                spawnVeg({
                  type: types[i],
                  x: spots[i].x,
                  y: spots[i].y,
                  baseSize: 120,
                  size: 120 * cfg.size
                });
              }
            }

            if (assisted) this.assist();
            startLoop();
          },

          hint: function (level) {
            var v = activeVeg();
            if (!v) return;
            vegs.forEach(function (item) { api.glow(item.el, false); });
            api.glow(v.el, true);
            if (level === 2) {
              var b = getRightBasket(v);
              if (b) api.demo(v.el, 'drag', { to: b.el });
            }
          },

          assist: function () {
            assisted = true;
            var k = Math.max(api.cfg().size, 1.35);
            // 蔬菜放大、門檻在 pullThreshold() 自動降為 40px
            vegs.forEach(function (v) {
              if (!v.done) resizeVeg(v, v.baseSize * k);
            });
            // 菜籃停止移動並放大
            baskets.forEach(function (b) {
              b.vx = 0;
              resizeBasket(b, stageIdx === 2 ? 1.12 : 1.2);
            });
            var v = activeVeg();
            if (v) api.glow(v.el, true);
          },

          stop: clear
        };
      }
    });
  })();
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
</body></html>
