      height: 94px;

      z-index: 0;
    }
    .sc-desk-prop {

      bottom: 8px;

      height: 68px;

      padding: 0;
      z-index: 1;
    }
    .sc-chat-head {
      height: 68px;
      padding: 0 18px;
      background: var(--lilac);
      border-bottom: 3px solid var(--edge);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .sc-ai-id {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .sc-ai-ava {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
    }
    .sc-ai-title {
      font-size: 20px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.2;
      white-space: nowrap;
    }
    .sc-scene-pill {
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--card);
      border: 2px solid var(--edge);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink2);
      white-space: nowrap;
    }

    .sc-chat-body {
      flex: 1;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;

      font-weight: 700;
      line-height: 1.45;
      color: var(--ink);

    .sc-msg {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-width: 92%;
    }
    .sc-msg-pet {
      align-self: flex-end;
      align-items: flex-end;
    }
    .sc-msg-ai {
      align-self: flex-start;
      align-items: flex-start;
    }
    .sc-msg-who {
      font-size: 16px;
      font-weight: 900;
      color: var(--ink2);
      padding: 0 6px;

    .sc-msg-pet .sc-msg-who {
      color: var(--violet);
    }
    .sc-msg-box {
      padding: 13px 16px;
      border-radius: 20px;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--ink);
      border: 2.5px solid var(--edge);

    .sc-msg-pet .sc-msg-box {
      background: var(--lilac);
      border-bottom-right-radius: 6px;
    }
    .sc-msg-ai .sc-msg-box {
      background: var(--sky);
      border-bottom-left-radius: 6px;
    }
    .sc-chat-foot {

      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink2);
      flex-shrink: 0;

    .sc-send-ic {
      width: 28px;
      height: 28px;
      flex-shrink: 0;

    .sc-quiz {
      position: absolute;
      left: 512px;
      top: 18px;

      flex-direction: column;

      z-index: 1;

      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card);

      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: var(--violet);

      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      white-space: nowrap;

    .sc-q-text {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.42;
      color: var(--ink);

      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;

    .sc-opt {
      flex: 1;
      min-height: 120px;
      width: 100%;
      padding: 12px 18px;
      display: flex;
      align-items: center;

      color: var(--ink);
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.18s ease-out, border-color 0.18s ease-out, background-color 0.18s ease-out;

    .sc-opt:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--violet);
    }
    .sc-opt:active:not(:disabled) {
      transform: translateY(2px);
    }
    .sc-opt:focus-visible {
      outline: 4px solid var(--violet);
      outline-offset: 3px;
    }
    .sc-opt:disabled {
      cursor: default;
    }
    .sc-tag {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--violet);
      color: #fff;
      font: 800 22px var(--f-num, 'Baloo 2', 'Noto Sans TC', sans-serif);

      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      white-space: nowrap;

    .sc-opt-ic {

      height: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;

      height: 48px;
    }
    .sc-opt-txt {
      flex: 1;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.42;
      color: var(--ink);
    }

    .sc-opt.sc-opt-ok {
      background: var(--ok-soft);
      border-color: var(--ok);
    }
    .sc-opt.sc-opt-ok .sc-tag {
      background: var(--ok);
    }
    .sc-opt.sc-opt-bad {
      background: var(--bad-soft);
      border-color: var(--bad);
    }
    .sc-opt.sc-opt-bad .sc-tag {
      background: var(--bad);
    }
    .sc-opt.sc-opt-dim {
      opacity: 0.58;
    }

    .sc-petbox {
      position: absolute;
      left: 1056px;
      top: 18px;
      width: 286px;
      height: 544px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 1;

    .sc-bubble {
      position: relative;
      width: 280px;
      padding: 14px 18px;
      margin-bottom: 16px;
      background: var(--card);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.48;
      color: var(--ink);
    }
    .sc-bubble::before {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -17px;
      transform: translateX(-50%);
      border-width: 17px 14px 0 14px;
      border-style: solid;
      border-color: var(--edge) transparent transparent transparent;
    }
    .sc-bubble::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -12px;
      transform: translateX(-50%);
      border-width: 14px 11px 0 11px;
      border-style: solid;
      border-color: var(--card) transparent transparent transparent;
    }
    .sc-pet {
      width: 276px;
      height: 276px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sc-pet svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .sc-pet-plate {
      margin-top: 2px;
      padding: 6px 18px;
      border-radius: 999px;
      background: var(--butter);
      border: 2.5px solid var(--edge);
      font-size: 17px;
      font-weight: 900;
      color: var(--ink);
      white-space: nowrap;
      box-shadow: 0 3px 0 rgba(59, 35, 80, 0.1);

    /* 單次回饋瞬間動畫（不連續閃爍） */
    .sc-pop {
      animation: scPop 0.22s ease-out;
    }
    .sc-wiggle {
      animation: scWiggle 0.32s ease-out;
    }
    @keyframes scPop {
      0% { transform: scale(0.96); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes scWiggle {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .sc-opt, .sc-pop, .sc-wiggle {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>

      play: '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="16" fill="#ECE3FA" stroke="#3B2350" stroke-width="2.8"/><path d="M20 16l13 8-13 8V16z" fill="#6A45C9" stroke="#3B2350" stroke-width="2.4" stroke-linejoin="round"/></svg>',
      friends: '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="17" cy="18" r="5" fill="#FFE1CB" stroke="#3B2350" stroke-width="2.6"/><circle cx="31" cy="18" r="5" fill="#FFF0C4" stroke="#3B2350" stroke-width="2.6"/><path d="M9 35c0-5 3.6-8 8-8s8 3 8 8M23 35c0-5 3.6-8 8-8s8 3 8 8" fill="#ECE3FA" stroke="#3B2350" stroke-width="2.6" stroke-linecap="round"/></svg>',
      home: '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M9 23l15-12 15 12" stroke="#3B2350" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 21v16h22V21" fill="#FFE1CB" stroke="#3B2350" stroke-width="2.8" stroke-linejoin="round"/><rect x="20" y="27" width="8" height="10" rx="1.5" fill="#FFF9F2" stroke="#3B2350" stroke-width="2.4"/></svg>',
      shield: '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 8l13 5v10c0 9-5.8 14.5-13 17-7.2-2.5-13-8-13-17V13l13-5z" fill="#DDF3E6" stroke="#3B2350" stroke-width="2.8" stroke-linejoin="round"/><path d="M18 24l4 4 8-8" stroke="#186B41" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      photo: '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="8" y="14" width="32" height="23" rx="5" fill="#E1EEFB" stroke="#3B2350" stroke-width="2.8"/><path d="M17 14l2.5-4h9L31 14" stroke="#3B2350" stroke-width="2.6" stroke-linejoin="round"/><circle cx="24" cy="25.5" r="6" fill="#FFF9F2" stroke="#3B2350" stroke-width="2.6"/></svg>',
      lock: '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="12" y="21" width="24" height="18" rx="5" fill="#FFF0C4" stroke="#3B2350" stroke-width="2.8"/><path d="M17 21v-5a7 7 0 0 1 14 0v5" stroke="#3B2350" stroke-width="2.8" stroke-linecap="round"/><circle cx="24" cy="30" r="2.6" fill="#3B2350"/></svg>',
      trash: '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M12 15h24M19 15v-4h10v4" stroke="#3B2350" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 15l2 23h14l2-23" fill="#FCE6E1" stroke="#3B2350" stroke-width="2.8" stroke-linejoin="round"/><path d="M21 21v11M27 21v11" stroke="#B4372B" stroke-width="2.4" stroke-linecap="round"/></svg>'
    };

    // 文字跳脫與寵物名稱替換工具
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function fmt(text, petName) {
      return esc(text).replace(/\{pet\}/g, esc(petName));
    }

    // ===== 3. 掛載至小常識島共用外殼 =====
    SmartIsland.mount({
      unit: 32,
      title: '寵物的 AI 作業',
      grade: '3–4 年級',
      zhuyin: false,
      howto: '寵物想請 AI 幫忙寫作業，哪些用法可以、哪些要小心？',
      teach: '合宜使用生成式 AI：誠實、查證、保護個資｜資E12 了解並遵守資訊倫理與使用資訊科技的相關規範、資E2 使用資訊科技解決生活中簡單的問題',
      levels: SCENE_CONFIG.LEVELS.map(function (lv, idx) {
        return { name: lv.name, icon: SCENE_CONFIG.LEVEL_ICONS[idx] };
      }),

      scene: function (api) {
        var alive = false;
        var runId = 0;        // 避免舊的 feedback Promise 在切換關卡後誤觸發
        var locked = false;   // 作答後立即鎖定選項，防止連點
        var qIndex = 0;
        var review = [];
        var curLevel = null;

        function getPetName() {
          var p = api.pet ? api.pet() : null;
          return (p && p.name) ? p.name : '小雲';
        }

        // 渲染目前這一題的書桌場景
        function renderQuestion() {
          var Q = curLevel.questions[qIndex];
          var total = curLevel.questions.length;
          var petName = getPetName();

          locked = false;
          api.progress(qIndex + 1, total);

          // 第 1 題顯示關卡開場故事，其餘題目顯示簡短步驟提示
          var stripText = qIndex === 0
            ? fmt(curLevel.intro, petName)
            : esc(curLevel.name) + '・第 ' + (qIndex + 1) + ' 題對話情境';

          var optsHtml = Q.options.map(function (opt, idx) {
            var iconSvg = PIC[opt.pic] || PIC.bulb;
            return (
              '<button type="button" class="clay sc-opt" data-idx="' + idx + '" aria-label="選項 ' + (idx + 1) + '：' + esc(opt.text) + '">' +
                '<span class="sc-tag">' + (idx + 1) + '</span>' +
                '<span class="sc-opt-ic">' + iconSvg + '</span>' +
                '<span class="sc-opt-txt">' + esc(opt.text) + '</span>' +
              '</button>'
            );
          }).join('');

          api.field.innerHTML =
            '<div class="sc-stage">' +
              '<div class="sc-desk" aria-hidden="true">' + DESK_CUP_SVG + '</div>' +

              // 左側：寵物與 AI 小幫手的對話視窗
              '<section class="clay sc-chat sc-pop" aria-label="AI 小幫手對話視窗">' +
                '<div class="sc-chat-head">' +
                  '<div class="sc-ai-id">' +
                    '<div class="sc-ai-ava">' + AI_AVATAR_SVG + '</div>' +
                    '<div class="sc-ai-title">AI 小幫手</div>' +
                  '</div>' +
                  '<span class="sc-scene-pill">' + esc(Q.sceneTag) + '</span>' +
                '</div>' +
                '<div class="sc-chat-body">' +
                  '<div class="sc-story-strip">' + stripText + '</div>' +
                  '<div class="sc-msg sc-msg-pet">' +
                    '<span class="sc-msg-who">' + esc(petName) + '</span>' +
                    '<div class="sc-msg-box">' + fmt(Q.petMsg, petName) + '</div>' +
                  '</div>' +
                  '<div class="sc-msg sc-msg-ai">' +
                    '<span class="sc-msg-who">AI 小幫手</span>' +
                    '<div class="sc-msg-box">' + fmt(Q.aiMsg, petName) + '</div>' +
                  '</div>' +
                '</div>' +
                '<div class="sc-chat-foot" aria-hidden="true">' +
                  '<span>請在右邊幫 ' + esc(petName) + ' 選出最好的做法</span>' +
                  SEND_ICON_SVG +
                '</div>' +
              '</section>' +

              // 中間：題目卡與三個選項卡
              '<section class="sc-quiz sc-pop" aria-label="題目與選項">' +
                '<div class="clay sc-q">' +
                  '<span class="sc-q-badge">Q' + (qIndex + 1) + '</span>' +
                  '<p class="sc-q-text">' + esc(Q.q) + '</p>' +
                '</div>' +
                '<div class="sc-opts">' + optsHtml + '</div>' +
              '</section>' +

              // 右側：寵物陪伴與思考泡泡
              '<aside class="sc-petbox" aria-label="寵物陪伴區">' +
                '<div class="clay sc-bubble" id="scBubble">' + fmt(Q.bubble, petName) + '</div>' +
                '<div class="sc-pet" id="scPet">' + api.petSVG('normal', { q: true }) + '</div>' +
                '<div class="sc-pet-plate">' + esc(petName) + '的書桌</div>' +
              '</aside>' +
            '</div>';
        }

        // 處理作答（支援滑鼠點選與鍵盤 1/2/3）
        function chooseOption(idx) {
          if (!alive || locked) return;
          var Q = curLevel.questions[qIndex];
          if (idx < 0 || idx >= Q.options.length) return;

          locked = true;
          var myRun = runId;
          var ok = idx === Q.ans;
          var petName = getPetName();

          // 更新按鈕外觀並全部鎖定
          var btns = api.field.querySelectorAll('.sc-opt');
          for (var j = 0; j < btns.length; j++) {
            btns[j].disabled = true;
            var tag = btns[j].querySelector('.sc-tag');
            if (j === idx) {
              btns[j].classList.add(ok ? 'sc-opt-ok' : 'sc-opt-bad');
              if (tag) tag.textContent = ok ? '✓' : '✗';
            } else {
              btns[j].classList.add('sc-opt-dim');
            }
          }

          // 即時切換寵物表情與台詞（不閃爍，僅單次反應）
          var petEl = api.field.querySelector('#scPet');
          var bubbleEl = api.field.querySelector('#scBubble');
          if (petEl) {
            petEl.innerHTML = ok
              ? api.petSVG('happy', { spark: true })
              : api.petSVG('worried', { sweat: true });
            petEl.classList.remove('sc-pop', 'sc-wiggle');
            petEl.classList.add(ok ? 'sc-pop' : 'sc-wiggle');
          }
          if (bubbleEl) {
            bubbleEl.textContent = ok
              ? '太好了！謝謝你幫' + petName + '做對選擇！'
              : '唔⋯⋯原來要注意這件事，我們來看看！';
          }

          review.push({ ok: ok, q: Q.q });

          // 寬鬆過關：不論對錯皆可按「下一題」繼續
          api.feedback({
            ok: ok,
            text: ok ? Q.okText : '差一點點，一起看看正確觀念吧！',
            explain: Q.explain,
            zyExplain: false
          }).then(function () {
            if (!alive || myRun !== runId) return;
            qIndex++;
            if (qIndex < curLevel.questions.length) {
              renderQuestion();
              return;
            }
            var right = review.filter(function (r) { return r.ok; }).length;
            var stars = right >= SCENE_CONFIG.STAR_RULES.three
              ? 3
              : right >= SCENE_CONFIG.STAR_RULES.two ? 2 : 1;

            api.finish({
              stars: stars,
              review: review,
              learned: curLevel.learned,
              retry: right < curLevel.questions.length ? curLevel.retry : ''
            });
          });
        }

        function onFieldClick(e) {
          var btn = e.target.closest('.sc-opt');
          if (!btn || !alive || locked) return;
          var idx = parseInt(btn.getAttribute('data-idx'), 10);
          if (!isNaN(idx)) chooseOption(idx);
        }

        function onKeyDown(e) {
          if (!alive || locked) return;
          if (e.key === '1' || e.key === '2' || e.key === '3') {
            chooseOption(parseInt(e.key, 10) - 1);
          }
        }

        function cleanup() {
          alive = false;
          locked = true;
          runId++;
          api.field.removeEventListener('click', onFieldClick);
          document.removeEventListener('keydown', onKeyDown);
        }

        return {
          start: function (levelIndex) {
            cleanup();
            alive = true;
            qIndex = 0;
            review = [];
            curLevel = SCENE_CONFIG.LEVELS[levelIndex] || SCENE_CONFIG.LEVELS[0];
            api.field.innerHTML = '';
            api.field.addEventListener('click', onFieldClick);
            document.addEventListener('keydown', onKeyDown);
            renderQuestion();
          },
          stop: function () {
            cleanup();
          }
        };
      }
    });
  })();
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
</body></html>
