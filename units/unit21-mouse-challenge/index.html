<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>滑鼠勇士 - 滑鼠島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="../../assets/css/mouse-island.css">
  <style>
    /* 場景樣式：class 一律 sc- 開頭 */
    .sc-floor {
      position: absolute; inset: 0; z-index: 1;
      background:
        linear-gradient(180deg, #EFE1BA 0 74px, #D7B98A 74px 86px, transparent 86px),
        repeating-linear-gradient(180deg, #F6E7BE 0 64px, #EEDBA9 64px 66px, #F3E2B5 66px 128px, #E9D5A0 128px 130px);
    }
    .sc-sunbeam {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse 680px 340px at 66% 18%, rgba(255, 248, 228, .55), transparent 72%);
    }
    .sc-mat {
      position: absolute; z-index: 2; pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 44%, #E8704F 0 58%, #C2432A 58% 76%, #FFF8E4 76% 88%, #9A5F36 88% 100%);
      border: 4px solid #6E4125;
      box-shadow: 0 8px 0 rgba(110, 65, 37, .22);
    }

    /* 冰冰滑滑大盤子（第三段，避開左下寄寄區 x<560, y>400） */
    .sc-tray {
      position: absolute; left: 580px; top: 96px; width: 740px; height: 448px;
      z-index: 3; pointer-events: none; border-radius: 42px;
      background:
        radial-gradient(ellipse 320px 110px at 30% 24%, rgba(255, 255, 255, .65), transparent 70%),
        radial-gradient(ellipse 220px 90px at 78% 76%, rgba(255, 255, 255, .45), transparent 70%),
        linear-gradient(155deg, #D9EFF5 0%, #BFE1EA 58%, #A5D3E0 100%);
      border: 8px solid #236F96;
      box-shadow: inset 0 0 0 6px #FFF8E4, 0 10px 0 rgba(35, 111, 150, .25);
    }
    .sc-tray::before {
      content: ""; position: absolute; left: 32px; top: 24px; width: 150px; height: 18px;
      border-radius: 12px; background: rgba(255, 255, 255, .55); transform: rotate(-6deg);
    }
    .sc-tray::after {
      content: ""; position: absolute; right: 44px; bottom: 28px; width: 96px; height: 12px;
      border-radius: 12px; background: rgba(255, 255, 255, .45); transform: rotate(-6deg);
    }

    /* 貓咪 */
    .sc-cat {
      position: absolute; z-index: 8; cursor: pointer;
      transition: width .28s ease, height .28s ease, margin .28s ease;
    }
    .sc-cat svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .sc-cat .sc-face-awake,
    .sc-cat .sc-face-eat,
    .sc-cat .sc-face-huh,
    .sc-cat .sc-face-bleh,
    .sc-cat .sc-zzz { display: none; }

    .sc-cat[data-mood="sleep"] .sc-face-sleep { display: block; }
    .sc-cat[data-mood="sleep"] .sc-zzz { display: block; }
    .sc-cat[data-mood="awake"] .sc-face-awake { display: block; }
    .sc-cat[data-mood="awake"] .sc-face-sleep { display: none; }
    .sc-cat[data-mood="eat"] .sc-face-eat { display: block; }
    .sc-cat[data-mood="eat"] .sc-face-sleep { display: none; }
    .sc-cat[data-mood="huh"] .sc-face-huh { display: block; }
    .sc-cat[data-mood="huh"] .sc-face-sleep { display: none; }
    .sc-cat[data-mood="bleh"] .sc-face-bleh { display: block; }
    .sc-cat[data-mood="bleh"] .sc-face-sleep { display: none; }

    .sc-cat-head { transform-origin: 130px 108px; transition: transform .16s ease-out; }
    .sc-cat[data-mood="huh"] .sc-cat-head { transform: rotate(-11deg); }
    .sc-cat[data-mood="eat"] .sc-cat-body { animation: sc-munch .42s ease-in-out 2; transform-origin: 130px 185px; }
    .sc-cat[data-mood="sleep"] .sc-cat-body { animation: sc-breathe 2.4s ease-in-out infinite; transform-origin: 130px 210px; }
    .sc-cat.sc-stretch .sc-cat-body { animation: sc-stretch .55s ease-out; transform-origin: 130px 215px; }
    .sc-cat.sc-eager .sc-cat-body { animation: sc-hop .5s ease-in-out 2; transform-origin: 130px 220px; }

    .sc-ear-l { transform-origin: 86px 68px; }
    .sc-ear-r { transform-origin: 174px 68px; }
    .sc-cat.sc-ear-twitch .sc-ear-l { animation: sc-twitch-l .38s ease-in-out; }
    .sc-cat.sc-ear-twitch .sc-ear-r { animation: sc-twitch-r .38s ease-in-out; }

    .sc-cat-paw { transform-origin: 174px 168px; }
    .sc-cat.sc-paw-wave .sc-cat-paw { animation: sc-paw .6s ease-in-out; }

    .sc-cat-tail { transform-origin: 204px 190px; animation: sc-tail 2.2s ease-in-out infinite; }
    .sc-zzz-1 { animation: sc-zzz 2.1s ease-in-out infinite; }
    .sc-zzz-2 { animation: sc-zzz 2.1s ease-in-out .7s infinite; }
    .sc-zzz-3 { animation: sc-zzz 2.1s ease-in-out 1.4s infinite; }

    /* 貓咪對話小泡泡 */
    .sc-bubble {
      position: absolute; z-index: 25; pointer-events: none;
      padding: 6px 16px; border-radius: 18px;
      background: #FFF8E4; border: 3px solid #6E4125; color: #33261B;
      font-size: 24px; font-weight: 900; line-height: 1.25; white-space: nowrap;
      box-shadow: 0 4px 0 rgba(110, 65, 37, .22);
      transform: translate(-50%, -100%);
      animation: sc-pop-in .22s ease-out;
    }
    .sc-bubble::after {
      content: ""; position: absolute; left: 50%; bottom: -10px;
      width: 14px; height: 14px; margin-left: -7px;
      background: #FFF8E4; border-right: 3px solid #6E4125; border-bottom: 3px solid #6E4125;
      transform: rotate(45deg);
    }

    /* 點心目標（永遠最突出：羊皮紙底＋深木實線框） */
    .sc-snack {
      position: absolute; z-index: 20; cursor: pointer; border-radius: 50%;
      background: #FFF8E4; border: 4px solid #6E4125;
      box-shadow: 0 6px 0 rgba(110, 65, 37, .26), 0 0 0 3px rgba(255, 248, 228, .85);
      display: flex; align-items: center; justify-content: center;
      padding: 10px; box-sizing: border-box;
      transition: width .25s ease, height .25s ease, margin .25s ease;
    }
    .sc-snack svg { width: 100%; height: 100%; display: block; pointer-events: none; }
    .sc-snack.sc-bowl {
      border-radius: 32px; padding: 12px;
      background: radial-gradient(circle at 50% 42%, #FFF8E4 62%, #F6E7BE 100%);
      border: 5px solid #6E4125;
    }
    .sc-snack.sc-rainbow {
      border-color: #C2432A;
      background: radial-gradient(circle at 50% 45%, #FFF8E4 54%, #FBE6A2 100%);
      box-shadow: 0 0 0 4px #F2B134, 0 0 0 7px #6E4125, 0 8px 18px rgba(242, 177, 52, .55);
      animation: sc-rb-pulse 1.2s ease-in-out infinite;
    }
    .sc-snack.sc-flying {
      pointer-events: none; z-index: 28;
      transition: left .36s cubic-bezier(.3, .8, .4, 1), top .36s cubic-bezier(.3, .8, .4, 1), transform .36s ease-in, opacity .36s ease-in;
      transform: scale(.32); opacity: 0;
    }

    /* 第三段干擾物：魚骨頭（無托盤底，不搶點心視覺） */
    .sc-bone {
      position: absolute; z-index: 15; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: .92;
    }
    .sc-bone svg { width: 100%; height: 100%; display: block; pointer-events: none; }
    .sc-bone.sc-gone { opacity: 0; pointer-events: none; transition: opacity .35s; }

    /* 愛心與星星特效 */
    .sc-fx {
      position: absolute; z-index: 30; pointer-events: none;
      width: 44px; height: 44px; margin: -22px 0 0 -22px;
      animation: sc-float-up .85s ease-out forwards;
    }
    .sc-fx svg { width: 100%; height: 100%; display: block; }

    /* 右上角計數 */
    .sc-count {
      position: absolute; right: 24px; top: 14px; z-index: 24;
      padding: 6px 18px; background: #FFF8E4; border: 3px solid #B9794A;
      border-radius: 14px; color: #33261B; font-size: 22px; font-weight: 700;
      box-shadow: 0 3px 0 rgba(110, 65, 37, .2);
      white-space: nowrap;
    }

    @keyframes sc-breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.035); } }
    @keyframes sc-stretch { 0% { transform: scale(1, 1); } 45% { transform: scale(1.12, .9); } 100% { transform: scale(1, 1); } }
    @keyframes sc-munch { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.05, .95); } }
    @keyframes sc-hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes sc-twitch-l { 0%, 100% { transform: rotate(0); } 45% { transform: rotate(-14deg); } }
    @keyframes sc-twitch-r { 0%, 100% { transform: rotate(0); } 45% { transform: rotate(14deg); } }
    @keyframes sc-paw { 0%, 100% { transform: rotate(0); } 45% { transform: rotate(-28deg); } }
    @keyframes sc-tail { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }
    @keyframes sc-zzz {
      0% { opacity: 0; transform: translate(0, 8px) scale(.7); }
      35% { opacity: 1; }
      100% { opacity: 0; transform: translate(14px, -24px) scale(1.08); }
    }
    @keyframes sc-pop-in { 0% { transform: translate(-50%, -85%) scale(.75); opacity: 0; } 100% { transform: translate(-50%, -100%) scale(1); opacity: 1; } }
    @keyframes sc-float-up { 0% { opacity: 0; transform: translateY(8px) scale(.6); } 25% { opacity: 1; transform: translateY(-10px) scale(1.08); } 100% { opacity: 0; transform: translateY(-58px) scale(.95); } }
    @keyframes sc-rb-pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.1); } }

    @media (prefers-reduced-motion: reduce) {
      .sc-cat .sc-cat-body, .sc-cat-tail, .sc-zzz-1, .sc-zzz-2, .sc-zzz-3,
      .sc-cat.sc-stretch .sc-cat-body, .sc-cat.sc-eager .sc-cat-body,
      .sc-cat.sc-ear-twitch .sc-ear-l, .sc-cat.sc-ear-twitch .sc-ear-r,
      .sc-cat.sc-paw-wave .sc-cat-paw, .sc-snack.sc-rainbow { animation: none !important; }
      .sc-snack.sc-flying { transition: opacity .15s !important; transform: none !important; }
      .sc-fx { animation: none !important; opacity: 1; }
    }
  </style>

                  api.sfx('boing');
                  setMood('bleh', 950);
                }
              }));
            })(bEl);
          }

          startLoop();
          scheduleCatIdle(runId);
        }

        function startLoop() {
          if (raf) cancelAnimationFrame(raf);
          var last = performance.now();
          (function loop(now) {
            var dt = Math.min(0.05, (now - last) / 1000);
            last = now;

            for (var i = 0; i < movers.length; i++) {
              var m = movers[i];
              if (!m.vx && !m.vy) continue;
              m.x += m.vx * dt;
              m.y += m.vy * dt;
              if (m.x < m.minX) { m.x = m.minX; m.vx = Math.abs(m.vx); }
              else if (m.x > m.maxX) { m.x = m.maxX; m.vx = -Math.abs(m.vx); }
              if (m.y < m.minY) { m.y = m.minY; m.vy = Math.abs(m.vy); }
              else if (m.y > m.maxY) { m.y = m.maxY; m.vy = -Math.abs(m.vy); }
            }

            /* 第三段簡單彈性分開，避免物件彼此重疊擋住點擊 */
            if (stage === 2 && movers.length > 1) {
              for (var a = 0; a < movers.length; a++) {
                for (var b = a + 1; b < movers.length; b++) {
                  var m1 = movers[a], m2 = movers[b];
                  var dx = m2.x - m1.x, dy = m2.y - m1.y;
                  var dist = Math.hypot(dx, dy);
                  var minDist = m1.r + m2.r;
                  if (dist > 0.01 && dist < minDist) {
                    var nx = dx / dist, ny = dy / dist;
                    var push = (minDist - dist) * 0.52;
                    m1.x = Math.max(m1.minX, Math.min(m1.maxX, m1.x - nx * push));
                    m1.y = Math.max(m1.minY, Math.min(m1.maxY, m1.y - ny * push));
                    m2.x = Math.max(m2.minX, Math.min(m2.maxX, m2.x + nx * push));
                    m2.y = Math.max(m2.minY, Math.min(m2.maxY, m2.y + ny * push));
                    var tvx = m1.vx, tvy = m1.vy;
                    m1.vx = m2.vx; m1.vy = m2.vy;
                    m2.vx = tvx; m2.vy = tvy;
                  }
                }
              }
            }

            for (var k = 0; k < movers.length; k++) {
              var mv = movers[k];
              mv.el.style.left = Math.round(mv.x) + 'px';
              mv.el.style.top = Math.round(mv.y) + 'px';
              if (mv.item) { mv.item.x = mv.x; mv.item.y = mv.y; }
            }

            raf = requestAnimationFrame(loop);
          })(last);
        }

        function handleFloorMiss() {
          if (finishing) return;
          api.sfx('giggle');
          if (catAwake) {
            setMood('huh', 900);
            showBubble('喵？', 900);
          } else if (catEl) {
            api.wob(catEl);
          }
          var t = getCurrentTarget();
          if (t && t !== catEl) api.wob(t);
          api.miss();
        }

        return {
          start: function (s, cfg) {
            clear();
            stage = s;
            doneCount = 0;

            api.field.innerHTML =
              '<div class="sc-floor"></div>' +
              '<div class="sc-sunbeam"></div>' +
              '<div class="sc-count mi-zy"></div>';

            /* 地板空白處獨立圖層，不會收到點心、貓咪、魚骨頭冒泡 */
            var floor = api.field.querySelector('.sc-floor');
            offs.push(api.on(floor, 'click', {
              ok: handleFloorMiss,
              wrong: handleFloorMiss
            }));

            document.addEventListener('pointermove', onPointerMove);

            if (s === 0) startStage0(cfg);
            else if (s === 1) startStage1(cfg);
            else startStage2(cfg);
          },

          hint: function (level) {
            var target = getCurrentTarget();
            if (!target) return;
            api.glow(target, true);
            if (level === 2) {
              var kind = (stage === 0 && !catAwake) ? 'point' : 'click';
              /* 第三段重播示範時暫停目標滑動 1.2 秒，讓手指示範精準對準點心 */
              var paused = null;
              if (stage === 2) {
                for (var i = 0; i < movers.length; i++) {
                  if (movers[i].el === target) {
                    paused = { m: movers[i], vx: movers[i].vx, vy: movers[i].vy };
                    movers[i].vx = 0;
                    movers[i].vy = 0;
                    break;
                  }
                }
              }
              api.demo(target, kind);
              if (paused && !assisted) {
                var myRun = runId;
                api.later(function () {
                  if (myRun === runId && !assisted) {
                    paused.m.vx = paused.vx;
                    paused.m.vy = paused.vy;
                  }
                }, 1200);
              }
            }
          },

          assist: function () {
            assisted = true;
            movers.forEach(function (m) { m.vx = 0; m.vy = 0; });
            if (stage === 0 && !catAwake && catEl) {
              var bigCat = Math.round(260 * 1.4);
              setBox(catEl, catPos.x, catPos.y, bigCat, bigCat);
              return;
            }
            activeSnacks.forEach(function (item) {
              var sz = Math.round(item.base * 1.4);
              setBox(item.el, item.x, item.y, sz, sz);
            });
          },

          stop: clear
        };
      }
    });
  })();
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
