<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中文打字冒險王 - 打字島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@500;600&display=swap">
  <link rel="stylesheet" href="../../assets/css/typing-island.css">
  <style>
    /* 場景專屬樣式：全部以 sc- 開頭，不動 .ti- 或全域樣式 */
    .sc-root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      user-select: none;
      background: var(--paper);
      color: var(--ink-1);
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    }

    /* 暫停時凍結所有過渡效果，確保畫面完全靜止 */
    .sc-root.sc-paused,
    .sc-root.sc-paused * {
      transition: none !important;
      animation-play-state: paused !important;
    }

    /* 背景層：繪本剪紙森林小路 */
    .sc-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 上方左右雙方狀態列（中間留空給怪獸對話框） */
    .sc-hud {
      position: absolute;
      top: 8px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 6;
    }

    .sc-card {
      background: var(--card);
      border: 2px solid var(--kraft-2);
      border-radius: 14px 10px 16px 8px;
      box-shadow: 0 3px 0 var(--kraft), 0 5px 10px rgba(59, 42, 32, 0.08);
      padding: 6px 12px;
    }

    /* 左上：小狐狸勇者血條 */
    .sc-hero-hud {
      min-width: 190px;
      max-width: 31%;
    }

    .sc-hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sc-hud-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink-1);
      white-space: nowrap;
    }

    .sc-hud-sub {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-3);
      font-family: 'Fredoka', 'Bahnschrift', sans-serif;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .sc-hearts {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }

    .sc-heart {
      width: 22px;
      height: 22px;
      display: block;
    }

    /* 右上：怪獸血條＋反擊倒數條 */
    .sc-mon-hud {
      width: 268px;
      max-width: 32%;
    }

    .sc-bar-track {
      position: relative;
      height: 14px;
      margin-top: 4px;
      background: var(--card-2);
      border: 2px solid var(--kraft-2);
      border-radius: 9px 6px 9px 7px;
      overflow: hidden;
    }

    .sc-hp-fill {
      height: 100%;
      width: 100%;
      background: var(--berry);
      border-radius: 6px;
      transform-origin: left center;
    }

    /* 反擊倒數小進度條 */
    .sc-atk-wrap {
      margin-top: 6px;
      padding-top: 5px;
      border-top: 1px dashed var(--kraft-2);
    }

    .sc-atk-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .sc-atk-sec {
      font-family: 'Fredoka', 'Bahnschrift', sans-serif;
      font-variant-numeric: tabular-nums;
      color: var(--ink-1);
    }

    .sc-atk-track {
      height: 8px;
      margin-top: 3px;
      background: var(--card-2);
      border: 1.5px solid var(--kraft-2);
      border-radius: 6px;
      overflow: hidden;
    }

    .sc-atk-fill {
      height: 100%;
      width: 0%;
      background: var(--leaf);
      border-radius: 4px;
    }

    .sc-atk-fill.sc-warn {
      background: var(--peach-dk);
    }

    /* 連擊增傷小牌子（連擊 >= 10 顯示） */
    .sc-boost-badge {
      position: absolute;
      top: -12px;
      left: -14px;
      background: var(--butter);
      border: 2px solid var(--peach-dk);
      border-radius: 10px 6px 10px 8px;
      box-shadow: 0 2px 0 var(--kraft-2);
      padding: 2px 9px;
      font-size: 14px;
      font-weight: 900;
      color: var(--ink-1);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85) rotate(-4deg);
    }

    .sc-boost-badge.sc-show {
      opacity: 1;
      transform: scale(1) rotate(-4deg);
    }

    /* 怪獸頭上的目標字對話框（天藍粗框＋天藍虛線瞄準圈） */
    .sc-bubble-wrap {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 5;
      pointer-events: none;
      transform-origin: center top;
    }

    .sc-bubble {
      position: relative;
      min-width: 174px;
      background: var(--card);
      border: 3px solid var(--sky-dk);
      outline: 3px dashed var(--sky-dk);
      outline-offset: 4px;
      border-radius: 16px 12px 18px 10px;
      box-shadow: 0 5px 0 var(--kraft), 0 8px 14px rgba(59, 42, 32, 0.12);
      padding: 8px 18px 6px;
      text-align: center;
    }

    .sc-bubble.sc-miss {
      border-color: var(--berry-dk);
      outline-color: var(--berry);
      background: #FFF3F0;
    }

    /* 對話框指向怪獸的小紙尖角 */
    .sc-bubble-tail {
      position: absolute;
      right: -15px;
      bottom: 24px;
      width: 18px;
      height: 18px;
      overflow: visible;
    }

    /* 錯誤 ✗ 小徽章（同時以符號回饋，不整片閃紅） */
    .sc-miss-tag {
      position: absolute;
      top: -12px;
      right: -10px;
      background: #FFD9D6;
      border: 2px solid var(--berry-dk);
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 14px;
      font-weight: 900;
      color: var(--berry-dk);
      opacity: 0;
    }

    .sc-miss-tag.sc-show {
      opacity: 1;
    }

    /* 目前要打的大字：>= 64px，含注音字型 var(--f-zh)，深色字配淺米紙底對比 > 12:1 */
    .sc-word-cur {
      font-family: var(--f-zh);
      font-size: 68px;
      line-height: 1.12;
      min-height: 76px;
      color: var(--ink-1);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
    }

    .sc-root.sc-en .sc-word-cur,
    .sc-root.sc-en .sc-word-next-ch {
      font-family: Consolas, monospace;
    }

    /* 下面小字顯示下一個字 */
    .sc-word-next {
      margin-top: 4px;
      padding-top: 4px;
      border-top: 2px dashed var(--kraft);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-2);
    }

    .sc-word-next-ch {
      font-family: var(--f-zh);
      font-size: 24px;
      line-height: 1.1;
      color: var(--ink-1);
      background: var(--card-2);
      border: 1.5px solid var(--kraft-2);
      border-radius: 8px 6px 8px 6px;
      padding: 1px 8px;
      min-width: 34px;
    }

    /* 角色層與特效層 */
    .sc-stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .sc-actor {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: center bottom;
      will-change: transform, opacity;
    }

    .sc-hero {
      width: 146px;
      height: 152px;
      margin-left: -73px;
      margin-top: -152px;
    }

    .sc-monster {
      width: 154px;
      height: 156px;
      margin-left: -77px;
      margin-top: -156px;
    }

    .sc-slash {
      position: absolute;
      left: 0;
      top: 0;
      width: 110px;
      height: 110px;
      margin-left: -55px;
      margin-top: -55px;
      opacity: 0;
      pointer-events: none;
      z-index: 4;
    }

    /* 粒子與浮動文字層（位置避開對話框，不擋住要打的字） */
    .sc-fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 7;
      overflow: hidden;
    }

    .sc-pop {
      position: absolute;
      left: 0;
      top: 0;
      font-weight: 900;
      font-size: 20px;
      line-height: 1.1;
      white-space: nowrap;
      background: var(--card);
      border: 2px solid var(--kraft-2);
      border-radius: 10px 7px 10px 8px;
      padding: 3px 9px;
      box-shadow: 0 2px 0 var(--kraft);
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-variant-numeric: tabular-nums;
      will-change: transform, opacity;
    }

    .sc-particle {
      position: absolute;
      left: 0;
      top: 0;
      width: 24px;
      height: 24px;
      margin-left: -12px;
      margin-top: -12px;
      will-change: transform, opacity;
    }

    /* 護眼／減少動態模式：關閉任何殘餘過渡 */
    @media (prefers-reduced-motion: reduce) {
      .sc-root,
      .sc-root * {
        transition: none !important;
      }
    }
  </style>
</head><body>
  <script src="../../assets/typing/passages.js"></script>
  <script src="../../assets/typing/en-items.js"></script>
  <script src="../../assets/js/typing-core.js"></script>
  <script src="../../assets/js/typing-ui.js"></script>
  <script>
    /* =========================================================================
       場景具名常數設定：集中管理血量、反擊秒數、動畫時長、比例與色票
       ========================================================================= */
    var SCENE_CONFIG = {
      // 怪獸血量（依 tier：初階 12、進階 18、高階 24）
      monsterHp: { t1: 12, t2: 18, t3: 24 },
      // 怪獸反擊倒數秒數（依 tier：初階 9 秒、進階 7 秒、高階 5 秒）
      attackSeconds: { t1: 9, t2: 7, t3: 5 },
      // 剩餘低於幾秒時反擊條改為警示橘紅（不閃爍）
      attackWarnSeconds: 2.2,
      // 連擊增傷設定（連擊 10 以上傷害 ×1.5）
      comboBoostAt: 10,
      comboBoostMult: 1.5,
      // 勇者愛心預設格數（實際血量從 api.lives() 讀取）
      defaultMaxLives: 5,
      // rAF 時間差上限（秒）
      dtCap: 0.1,
      // 各動作持續時間（秒），全部由單一 rAF 主迴圈以 dt 驅動
      heroSlashDur: 0.32,
      heroHurtDur: 0.36,
      monsterHurtDur: 0.34,
      monsterTauntDur: 0.72,
      monsterAttackDur: 0.44,
      monsterDefeatDur: 0.68,
      monsterSpawnDur: 0.38,
      bubbleShakeDur: 0.36,
      popDur: 0.75,
      // 粒子數量（prefers-reduced-motion 時自動為 0）
      hitStarCount: 6,
      defeatLeafCount: 9,
      // 場景相對比例（依 api.field clientWidth / clientHeight 動態計算）
      layout: {
        heroXRatio: 0.20,
        monsterXRatio: 0.80,
        bubbleXRatio: 0.50,
        bubbleTopRatio: 0.05,
        groundYRatio: 0.89,
        baseHeight: 300
      },
      // 繪本剪紙色票（對應 system.md）
      colors: {
        heartFull: '#E5484D',
        heartStroke: '#B3262B',
        heartEmpty: '#FDF1D8',
        heartEmptyStroke: '#C9A66B',
        starFill: '#FFD966',
        starStroke: '#C9A66B',
        hitText: '#2D7A38',
        boostText: '#D9531F',
        hurtText: '#B3262B',
        leafPalette: ['#7CCB6F', '#A7D98B', '#FFD966', '#FF9E7A']
      },
      // 三種輪流登場的森林怪獸
      monsters: [
        { id: 'mushroom', name: '蘑菇怪' },
        { id: 'acorn',    name: '橡果怪' },
        { id: 'cloud',    name: '雲朵怪' }
      ]
    };

    TypingIsland.mount({
      unit: 1,
      title: '中文打字冒險王',
      subtitle: '怪獸對打・中打',
      langs: ['zh'],
      homeUrl: '../../index.html',
      scene: function (api) {
        var field = api.field;
        var reducedMotionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;

        // 動畫與執行狀態（不使用任何 setTimeout / setInterval）
        var rafId = 0;
        var running = false;
        var lastTime = 0;
        var clock = 0;

        // 遊戲狀態
        var monsterIndex = 0;
        var monsterMaxHp = SCENE_CONFIG.monsterHp.t1;
        var monsterHp = monsterMaxHp;
        var monsterState = 'idle'; // 'idle' | 'hurt' | 'taunt' | 'attack' | 'defeat' | 'spawn'
        var monsterTimer = 0;

        var heroState = 'idle';    // 'idle' | 'slash' | 'hurt'
        var heroTimer = 0;

        var attackElapsed = 0;
        var attackLimit = SCENE_CONFIG.attackSeconds.t1;
        var bubbleShakeTimer = 0;
        var hasActiveWord = false;
        var lastLives = SCENE_CONFIG.defaultMaxLives;
        var maxLivesSeen = SCENE_CONFIG.defaultMaxLives;

        // 動態粒子與浮字清單（由單一 rAF 更新與回收）
        var particles = [];
        var pops = [];

        // 動態量測後的幾何資料
        var geom = { w: 1200, h: 300, scale: 1, heroX: 240, monX: 960, groundY: 267, bubbleX: 600, bubbleY: 14 };

        // DOM 節點參考
        var els = {};

        /* -------------------------------------------------------------------
           工具函式
           ------------------------------------------------------------------- */
        function isReducedMotion() {
          return !!(reducedMotionQuery && reducedMotionQuery.matches);
        }

        function getTier() {
          var t = api.settings && api.settings.tier;
          return SCENE_CONFIG.monsterHp[t] ? t : 't1';
        }

        function formatDisplay(item) {
          if (!item || item.display == null) return '';
          return item.display === ' ' ? '␣' : item.display;
        }

        function formatHp(val) {
          // 小一小二看不懂小數：顯示時無條件進位成整數（內部仍保留 ×1.5 傷害）
          return String(Math.ceil(Math.max(0, val) - 1e-9));
        }

        function clamp(v, lo, hi) {
          return v < lo ? lo : (v > hi ? hi : v);
        }

        /* -------------------------------------------------------------------
           SVG 繪本剪紙圖形產生器（背景、愛心、小狐狸勇者、三種森林怪獸）
           ------------------------------------------------------------------- */
        function buildForestBgSvg() {
          return (
            '<svg class="sc-bg" viewBox="0 0 1330 300" preserveAspectRatio="none" aria-hidden="true">' +
              '<defs>' +
                '<linearGradient id="scSkyGrad" x1="0" y1="0" x2="0" y2="1">' +
                  '<stop offset="0%" stop-color="#D6EEFB"/>' +
                  '<stop offset="68%" stop-color="#EAF6FD"/>' +
                  '<stop offset="100%" stop-color="#F7E8CB"/>' +
                '</linearGradient>' +
                '<linearGradient id="scPathGrad" x1="0" y1="0" x2="0" y2="1">' +
                  '<stop offset="0%" stop-color="#F2E2BF"/>' +
                  '<stop offset="100%" stop-color="#E4CC9C"/>' +
                '</linearGradient>' +
              '</defs>' +
              // 溫暖紙感天空
              '<rect width="1330" height="300" fill="url(#scSkyGrad)"/>' +
              // 剪紙柔雲（淡米色）
              '<g class="sc-clouds" opacity="0.88">' +
                '<path d="M110 68 C110 52 132 48 144 56 C154 42 184 44 192 60 C206 60 214 70 208 80 L108 80 C100 76 102 68 110 68 Z" fill="#FFF8E6" stroke="#E4CC9C" stroke-width="2"/>' +
                '<path d="M1080 54 C1080 40 1100 36 1112 44 C1124 30 1154 34 1160 48 C1176 48 1184 58 1176 68 L1076 68 C1068 64 1072 54 1080 54 Z" fill="#FFF8E6" stroke="#E4CC9C" stroke-width="2"/>' +
              '</g>' +
              // 遠山剪紙層 1
              '<path d="M0 218 Q180 130 390 198 Q620 122 860 194 Q1090 128 1330 188 L1330 300 L0 300 Z" fill="#CDE5BD" stroke="#A6C992" stroke-width="2"/>' +
              // 近坡剪紙層 2
              '<path d="M0 232 Q250 186 520 226 Q830 182 1120 222 Q1240 208 1330 222 L1330 300 L0 300 Z" fill="#B2D99B" stroke="#8CB876" stroke-width="2"/>' +
              // 左側剪紙小樹
              '<g>' +
                '<rect x="52" y="182" width="16" height="58" rx="6" fill="#A67748" stroke="#5E4838" stroke-width="2"/>' +
                '<circle cx="60" cy="164" r="34" fill="#7CCB6F" stroke="#538F4C" stroke-width="2.5"/>' +
                '<circle cx="42" cy="176" r="22" fill="#92D686" stroke="#538F4C" stroke-width="2"/>' +
                '<circle cx="80" cy="178" r="20" fill="#6BBF5E" stroke="#538F4C" stroke-width="2"/>' +
                '<rect x="132" y="198" width="12" height="40" rx="5" fill="#A67748" stroke="#5E4838" stroke-width="2"/>' +
                '<circle cx="138" cy="186" r="24" fill="#92D686" stroke="#538F4C" stroke-width="2"/>' +
              '</g>' +
              // 右側剪紙小樹
              '<g>' +
                '<rect x="1244" y="176" width="18" height="62" rx="6" fill="#A67748" stroke="#5E4838" stroke-width="2"/>' +
                '<circle cx="1253" cy="158" r="36" fill="#7CCB6F" stroke="#538F4C" stroke-width="2.5"/>' +
                '<circle cx="1230" cy="172" r="22" fill="#92D686" stroke="#538F4C" stroke-width="2"/>' +
                '<rect x="1174" y="196" width="12" height="42" rx="5" fill="#A67748" stroke="#5E4838" stroke-width="2"/>' +
                '<circle cx="1180" cy="184" r="24" fill="#6BBF5E" stroke="#538F4C" stroke-width="2"/>' +
              '</g>' +
              // 森林小路（牛皮紙色土路）
              '<path d="M0 246 Q360 228 670 244 Q980 258 1330 238 L1330 300 L0 300 Z" fill="url(#scPathGrad)" stroke="#C9A66B" stroke-width="3"/>' +
              // 小路上的點綴圓石與草葉
              '<ellipse cx="420" cy="272" rx="14" ry="5" fill="#DFC391"/>' +
              '<ellipse cx="640" cy="264" rx="18" ry="6" fill="#DFC391"/>' +
              '<ellipse cx="870" cy="276" rx="12" ry="4" fill="#DFC391"/>' +
              // 可愛剪紙野花（小點綴）
              '<g>' +
                '<circle cx="182" cy="238" r="5" fill="#FFD966" stroke="#C9A66B" stroke-width="1.5"/>' +
                '<circle cx="182" cy="238" r="2" fill="#D9531F"/>' +
                '<circle cx="510" cy="234" r="5" fill="#FFF8E6" stroke="#C9A66B" stroke-width="1.5"/>' +
                '<circle cx="510" cy="234" r="2" fill="#FFD966"/>' +
                '<circle cx="1136" cy="236" r="5" fill="#FFDCCB" stroke="#D9531F" stroke-width="1.5"/>' +
                '<circle cx="1136" cy="236" r="2" fill="#FFD966"/>' +
              '</g>' +
            '</svg>'
          );
        }

        function buildHeartSvg(filled) {
          var fill = filled ? SCENE_CONFIG.colors.heartFull : SCENE_CONFIG.colors.heartEmpty;
          var stroke = filled ? SCENE_CONFIG.colors.heartStroke : SCENE_CONFIG.colors.heartEmptyStroke;
          return (
            '<svg class="sc-heart" viewBox="0 0 28 28" aria-hidden="true">' +
              '<path d="M14 24.2 C14 24.2 3.5 17.6 3.5 10.4 C3.5 6.8 6.3 4.2 9.6 4.2 C11.7 4.2 13.2 5.3 14 6.8 C14.8 5.3 16.3 4.2 18.4 4.2 C21.7 4.2 24.5 6.8 24.5 10.4 C24.5 17.6 14 24.2 14 24.2 Z" ' +
                'fill="' + fill + '" stroke="' + stroke + '" stroke-width="2.2" stroke-linejoin="round"/>' +
              (filled ? '<path d="M8 9.2 C8.5 7.8 9.8 7.2 11 7.6" stroke="#FFF8E6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>' : '') +
            '</svg>'
          );
        }

        function buildHeroSvg() {
          // Q 版小狐狸勇者：戴折紙頭盔＋草綠小披風＋拿木劍
          return (
            '<svg viewBox="0 0 160 165" width="100%" height="100%" aria-label="小狐狸勇者">' +
              // 落地紙片陰影
              '<ellipse cx="74" cy="154" rx="44" ry="8" fill="rgba(59,42,32,0.16)"/>' +
              // 蓬鬆狐狸大尾巴
              '<g class="sc-hero-tail" style="transform-origin: 44px 120px;">' +
                '<path d="M46 126 C14 128 6 98 20 82 C30 70 46 84 52 104 Z" fill="#E98249" stroke="#3B2A20" stroke-width="3" stroke-linejoin="round"/>' +
                '<path d="M20 82 C26 75 34 79 38 89 C30 92 22 92 17 89 C17 86 18 84 20 82 Z" fill="#FFF8E6" stroke="#3B2A20" stroke-width="2" stroke-linejoin="round"/>' +
              '</g>' +
              // 草綠勇者小披風
              '<path d="M52 104 L30 138 L66 134 Z" fill="#7CCB6F" stroke="#2D7A38" stroke-width="2.5" stroke-linejoin="round"/>' +
              // 圓滾滾身體與小腳

        /* -------------------------------------------------------------------

        /* -------------------------------------------------------------------
           動態量測 api.field 寬高（不寫死任何容器像素）
           ------------------------------------------------------------------- */
        function measure() {
          var w = field.clientWidth || 1000;
          var h = field.clientHeight || 300;
          var s = clamp(h / SCENE_CONFIG.layout.baseHeight, 0.72, 1.25);

          geom.w = w;
          geom.h = h;
          geom.scale = s;
          geom.heroX = w * SCENE_CONFIG.layout.heroXRatio;
          geom.monX = w * SCENE_CONFIG.layout.monsterXRatio;
          geom.groundY = h * SCENE_CONFIG.layout.groundYRatio;
          geom.bubbleX = w * SCENE_CONFIG.layout.bubbleXRatio;
          geom.bubbleY = Math.max(8, h * SCENE_CONFIG.layout.bubbleTopRatio);

          applyTransforms();
        }

        /* -------------------------------------------------------------------
           UI 狀態渲染（血條、連擊、對話框目標字、怪獸切換）
           ------------------------------------------------------------------- */
        function renderLives() {
          var lives = typeof api.lives === 'function' ? api.lives() : SCENE_CONFIG.defaultMaxLives;
          if (lives > maxLivesSeen) maxLivesSeen = lives;
          lastLives = lives;

          var total = Math.max(SCENE_CONFIG.defaultMaxLives, maxLivesSeen);
          var html = '';
          for (var i = 0; i < total; i++) {
            html += buildHeartSvg(i < lives);
          }
          els.hearts.innerHTML = html;
          els.heroLivesTxt.textContent = lives + ' / ' + total;
        }

        function renderMonsterHp() {
          var info = SCENE_CONFIG.monsters[monsterIndex % SCENE_CONFIG.monsters.length];
          var ratio = monsterMaxHp > 0 ? clamp(monsterHp / monsterMaxHp, 0, 1) : 0;
          els.monName.textContent = info.name;
          els.monHpTxt.textContent = 'HP ' + formatHp(monsterHp) + ' / ' + monsterMaxHp;
          els.hpFill.style.transform = 'scaleX(' + ratio.toFixed(4) + ')';
        }

        function renderAttackBar() {
          var remain = Math.max(0, attackLimit - attackElapsed);
          var pct = attackLimit > 0 ? clamp((attackElapsed / attackLimit) * 100, 0, 100) : 0;
          els.atkSec.textContent = remain.toFixed(1) + ' 秒';
          els.atkFill.style.width = pct.toFixed(1) + '%';
          els.atkFill.classList.toggle('sc-warn', remain <= SCENE_CONFIG.attackWarnSeconds && hasActiveWord);
        }

        function renderComboBadge(comboVal) {
          var c = typeof comboVal === 'number' ? comboVal : (typeof api.combo === 'function' ? api.combo() : 0);
          els.boostBadge.classList.toggle('sc-show', c >= SCENE_CONFIG.comboBoostAt);
        }

        function setMonsterFace(mode) {
          var n = els.monster.querySelector('.sc-mon-face-normal');
          var h = els.monster.querySelector('.sc-mon-face-hurt');
          var t = els.monster.querySelector('.sc-mon-face-taunt');
          if (!n || !h || !t) return;
          n.style.display = mode === 'normal' ? '' : 'none';
          h.style.display = mode === 'hurt' ? '' : 'none';
          t.style.display = mode === 'taunt' ? '' : 'none';
        }

        function setHeroFace(hurt) {
          els.heroFaceOk.style.display = hurt ? 'none' : '';
          els.heroFaceHurt.style.display = hurt ? '' : 'none';
        }

        function mountMonsterVisual() {
          var info = SCENE_CONFIG.monsters[monsterIndex % SCENE_CONFIG.monsters.length];
          els.monster.innerHTML = buildMonsterSvg(info.id);
          setMonsterFace('normal');
          renderMonsterHp();
        }

        function syncWords() {
          var isEn = api.settings && api.settings.lang === 'en';
          els.root.classList.toggle('sc-en', !!isEn);

          var list = typeof api.upcoming === 'function' ? (api.upcoming(2) || []) : [];
          var cur = list[0] || (typeof api.current === 'function' ? api.current() : null);
          var next = list[1] || null;

          if (cur && cur.display != null) {
            hasActiveWord = true;
            // 一律使用 display 顯示，確保破音字選擇器與字型正確呈現
            els.wordCur.textContent = formatDisplay(cur);
            if (next && next.display != null) {
              els.wordNextCh.textContent = formatDisplay(next);
              els.wordNextWrap.style.visibility = 'visible';
            } else {
              els.wordNextCh.textContent = '終點';
              els.wordNextWrap.style.visibility = 'visible';
            }
          } else {
            hasActiveWord = false;
            els.wordCur.textContent = '✓';
            els.wordNextWrap.style.visibility = 'hidden';
          }
        }

        /* -------------------------------------------------------------------
           特效生成（由 rAF 迴圈推進，不使用任何 setTimeout）
           ------------------------------------------------------------------- */
        function clearFx() {
          particles.forEach(function (p) { p.el.remove(); });
          pops.forEach(function (p) { p.el.remove(); });
          particles = [];
          pops = [];
        }

        function spawnPop(text, x, y, color) {
          var el = document.createElement('div');
          el.className = 'sc-pop';
          el.textContent = text;
          el.style.color = color;
          els.fx.appendChild(el);
          pops.push({
            el: el,
            x: x,
            y: y,
            age: 0,
            life: SCENE_CONFIG.popDur
          });
          updatePopTransform(pops[pops.length - 1]);
        }

        function spawnBurst(kind, cx, cy, count) {
          if (isReducedMotion()) return;
          for (var i = 0; i < count; i++) {
            var el = document.createElement('div');
            el.className = 'sc-particle';
            if (kind === 'leaf') {
              var c = SCENE_CONFIG.colors.leafPalette[i % SCENE_CONFIG.colors.leafPalette.length];
              el.innerHTML = buildLeafSvg(c);
            } else {
              el.innerHTML = buildStarSvg();
            }
            els.fx.appendChild(el);

            var angle = (-Math.PI * 0.85) + (Math.PI * 0.7) * (count > 1 ? i / (count - 1) : 0.5) + (Math.random() - 0.5) * 0.35;
            var speed = (kind === 'leaf' ? 95 : 130) + Math.random() * 80;
            particles.push({
              el: el,
              kind: kind,
              x: cx + (Math.random() - 0.5) * 24,
              y: cy + (Math.random() - 0.5) * 20,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - (kind === 'leaf' ? 50 : 30),
              rot: Math.random() * 360,
              vrot: (Math.random() - 0.5) * 320,
              age: 0,
              life: kind === 'leaf' ? 0.85 : 0.55
            });
          }
        }

        function updatePopTransform(p) {
          var t = clamp(p.age / p.life, 0, 1);
          var dy = isReducedMotion() ? 0 : (-34 * (1 - Math.pow(1 - t, 2)));
          var op = t < 0.7 ? 1 : (1 - (t - 0.7) / 0.3);
          p.el.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + (p.y + dy).toFixed(1) + 'px) translateX(-50%)';
          p.el.style.opacity = op.toFixed(3);
        }

        /* -------------------------------------------------------------------
           切換下一隻怪獸
           ------------------------------------------------------------------- */
        function spawnNextMonster() {
          var tier = getTier();
          monsterIndex = (monsterIndex + 1) % SCENE_CONFIG.monsters.length;
          monsterMaxHp = SCENE_CONFIG.monsterHp[tier];
          monsterHp = monsterMaxHp;
          monsterState = 'spawn';
          monsterTimer = SCENE_CONFIG.monsterSpawnDur;
          attackElapsed = 0;
          mountMonsterVisual();
          renderAttackBar();
        }

        /* -------------------------------------------------------------------
           依照目前狀態計算所有角色與對話框位置（每幀呼叫）
           ------------------------------------------------------------------- */
        function applyTransforms() {
          var rm = isReducedMotion();
          var s = geom.scale;

          // 1. 小狐狸勇者動作
          var hx = geom.heroX;
          var hy = geom.groundY;
          var hRot = 0;
          var hOp = 1;
          var armRot = 0;
          var tailRot = rm ? 0 : Math.sin(clock * 3.8) * 7;
          var slashOp = 0;
          var slashScale = s;

          if (heroState === 'slash') {
            var sp = 1 - clamp(heroTimer / SCENE_CONFIG.heroSlashDur, 0, 1);
            var lunge = Math.sin(sp * Math.PI);
            if (!rm) {
              hx += lunge * Math.min(72, geom.w * 0.08);
              hy -= lunge * 16 * s;
              armRot = -35 + Math.sin(sp * Math.PI) * 105;
            }
            slashOp = sp < 0.75 ? Math.sin((sp / 0.75) * Math.PI) : 0;
            slashScale = s * (0.85 + sp * 0.35);
          } else if (heroState === 'hurt') {
            var hp = 1 - clamp(heroTimer / SCENE_CONFIG.heroHurtDur, 0, 1);
            if (rm) {
              hOp = 0.65 + 0.35 * hp;
            } else {
              hx -= Math.sin(hp * Math.PI) * 22 * s;
              hRot = -Math.sin(hp * Math.PI) * 9;
            }
          } else if (!rm) {
            // 輕柔繪本呼吸感
            hy += Math.sin(clock * 2.6) * 2.5 * s;
          }

          els.hero.style.transform =
            'translate(' + hx.toFixed(1) + 'px,' + hy.toFixed(1) + 'px) scale(' + s.toFixed(3) + ') rotate(' + hRot.toFixed(1) + 'deg)';
          els.hero.style.opacity = hOp.toFixed(3);
          els.heroArm.style.transform = 'rotate(' + armRot.toFixed(1) + 'deg)';
          els.heroTail.style.transform = 'rotate(' + tailRot.toFixed(1) + 'deg)';

          // 劍氣畫在勇者與怪獸身體之間（低於對話框，絕不擋字）
          var slashX = geom.heroX + (geom.monX - geom.heroX) * 0.56;
          var slashY = geom.groundY - 68 * s;
          els.slash.style.transform =
            'translate(' + slashX.toFixed(1) + 'px,' + slashY.toFixed(1) + 'px) scale(' + slashScale.toFixed(3) + ')';
          els.slash.style.opacity = (rm ? 0 : slashOp).toFixed(3);

          // 2. 森林怪獸動作
          var mx = geom.monX;
          var my = geom.groundY;
          var mRot = 0;
          var mScaleX = s;
          var mScaleY = s;
          var mOp = 1;

          if (monsterState === 'hurt') {
            var mp = 1 - clamp(monsterTimer / SCENE_CONFIG.monsterHurtDur, 0, 1);
            if (rm) {
              mOp = 0.65 + 0.35 * mp;
            } else {
              var knock = Math.sin(mp * Math.PI);
              mx += knock * 28 * s;
              my -= knock * 8 * s;
              mRot = knock * 10;
            }
          } else if (monsterState === 'taunt') {
            var tp = 1 - clamp(monsterTimer / SCENE_CONFIG.monsterTauntDur, 0, 1);
            if (!rm) {
              // 俏皮左右扭一下（頻率約 2Hz，溫和可愛）
              mRot = Math.sin(tp * Math.PI * 2) * 7;
              mScaleX = s * (1 + Math.sin(tp * Math.PI) * 0.06);
            }
          } else if (monsterState === 'attack') {
            var ap = 1 - clamp(monsterTimer / SCENE_CONFIG.monsterAttackDur, 0, 1);
            if (rm) {
              mOp = 0.72 + 0.28 * ap;
            } else {
              // 怪獸往前衝撞小勇者一下再彈回
              var dash = Math.sin(ap * Math.PI);
              mx -= dash * (geom.monX - geom.heroX) * 0.68;
              my -= Math.sin(ap * Math.PI) * 18 * s;
              mRot = -dash * 12;
            }
          } else if (monsterState === 'defeat') {
            var dp = 1 - clamp(monsterTimer / SCENE_CONFIG.monsterDefeatDur, 0, 1);
            mOp = 1 - dp;
            if (!rm) {
              my -= dp * 26 * s;
              mScaleX = s * (1 - dp * 0.45);
              mScaleY = s * (1 - dp * 0.45);
              mRot = dp * 18;
            }
          } else if (monsterState === 'spawn') {
            var np = 1 - clamp(monsterTimer / SCENE_CONFIG.monsterSpawnDur, 0, 1);
            mOp = np;
            if (!rm) {
              mx += (1 - np) * 70 * s;
              my -= Math.sin(np * Math.PI) * 32 * s;
            }
          } else if (!rm) {
            my += Math.sin(clock * 2.2 + 1.2) * 3 * s;
          }

          els.monster.style.transform =
            'translate(' + mx.toFixed(1) + 'px,' + my.toFixed(1) + 'px) scale(' + mScaleX.toFixed(3) + ',' + mScaleY.toFixed(3) + ') rotate(' + mRot.toFixed(1) + 'deg)';
          els.monster.style.opacity = clamp(mOp, 0, 1).toFixed(3);

          // 3. 目標字對話框位置與打錯輕晃（reduced-motion 不晃動）
          var bx = geom.bubbleX;
          var by = geom.bubbleY;
          if (bubbleShakeTimer > 0 && !rm) {
            var bp = 1 - clamp(bubbleShakeTimer / SCENE_CONFIG.bubbleShakeDur, 0, 1);
            // 僅晃動 1.5 週期（約 2 次/秒，低於每秒 3 次上限）
            bx += Math.sin(bp * Math.PI * 3) * 8 * (1 - bp);
          }
          els.bubbleWrap.style.transform =
            'translate(' + bx.toFixed(1) + 'px,' + by.toFixed(1) + 'px) translateX(-50%)';
        }

        /* -------------------------------------------------------------------
           唯一主迴圈（requestAnimationFrame，dt 上限 0.1 秒）
           ------------------------------------------------------------------- */
        function frame(now) {
          if (!running) return;
          var dt = Math.min(Math.max(now - lastTime, 0), SCENE_CONFIG.dtCap * 1000) / 1000;
          lastTime = now;
          clock += dt;

          // 更新勇者動作計時
          if (heroTimer > 0) {
            heroTimer -= dt;
            if (heroTimer <= 0) {
              heroTimer = 0;
              heroState = 'idle';
              setHeroFace(false);
            }
          }

          // 更新怪獸動作計時
          if (monsterTimer > 0) {
            monsterTimer -= dt;
            if (monsterTimer <= 0) {
              monsterTimer = 0;
              if (monsterState === 'defeat') {
                spawnNextMonster();
              } else {
                monsterState = 'idle';
                setMonsterFace('normal');
              }
            }
          }

          // 更新對話框打錯提示計時
          if (bubbleShakeTimer > 0) {
            bubbleShakeTimer -= dt;
            if (bubbleShakeTimer <= 0) {
              bubbleShakeTimer = 0;
              els.bubble.classList.remove('sc-miss');
              els.missTag.classList.remove('sc-show');
            }
          }

          // 更新怪獸反擊倒數（僅在有字且怪獸非擊敗／進場過場時推進）
          if (hasActiveWord && monsterState !== 'defeat' && monsterState !== 'spawn') {
            attackElapsed += dt;
            if (attackElapsed >= attackLimit) {
              attackElapsed = 0;
              monsterState = 'attack';
              monsterTimer = SCENE_CONFIG.monsterAttackDur;
              setMonsterFace('normal');
              heroState = 'hurt';
              heroTimer = SCENE_CONFIG.heroHurtDur;
              setHeroFace(true);
              spawnPop('哎呀！-1 ❤', geom.heroX, geom.groundY - 148 * geom.scale, SCENE_CONFIG.colors.hurtText);
              renderAttackBar();

              // 怪獸反擊扣一顆愛心
              api.loseLife();
              renderLives();
              // 若扣完最後一顆愛心導致共用程式立即呼叫 pause/stop，不再排下一幀
              if (!running) return;
            } else {
              renderAttackBar();
            }
          }

          // 更新星星／葉子粒子
          for (var i = particles.length - 1; i >= 0; i--) {
            var pt = particles[i];
            pt.age += dt;
            if (pt.age >= pt.life) {
              pt.el.remove();
              particles.splice(i, 1);
              continue;
            }
            var t = pt.age / pt.life;
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            // 葉子緩慢飄落並左右搖曳；星星受輕重力
            if (pt.kind === 'leaf') {
              pt.vy += 120 * dt;
              pt.x += Math.sin(pt.age * 7 + i) * 28 * dt;
            } else {
              pt.vy += 240 * dt;
            }
            pt.rot += pt.vrot * dt;
            pt.el.style.transform =
              'translate(' + pt.x.toFixed(1) + 'px,' + pt.y.toFixed(1) + 'px) rotate(' + pt.rot.toFixed(1) + 'deg) scale(' + (1 - t * 0.35).toFixed(2) + ')';
            pt.el.style.opacity = (1 - t).toFixed(3);
          }

          // 更新浮字
          for (var j = pops.length - 1; j >= 0; j--) {
            var pop = pops[j];
            pop.age += dt;
            if (pop.age >= pop.life) {
              pop.el.remove();
              pops.splice(j, 1);
              continue;
            }
            updatePopTransform(pop);
          }

          applyTransforms();
          if (running) {
            rafId = requestAnimationFrame(frame);
          }
        }

        /* -------------------------------------------------------------------
           重置回合狀態
           ------------------------------------------------------------------- */
        function resetRound() {
          var tier = getTier();
          clearFx();
          clock = 0;
          monsterIndex = 0;
          monsterMaxHp = SCENE_CONFIG.monsterHp[tier];
          monsterHp = monsterMaxHp;
          monsterState = 'idle';
          monsterTimer = 0;
          heroState = 'idle';
          heroTimer = 0;
          attackLimit = SCENE_CONFIG.attackSeconds[tier];
          attackElapsed = 0;
          bubbleShakeTimer = 0;
          maxLivesSeen = Math.max(SCENE_CONFIG.defaultMaxLives, typeof api.lives === 'function' ? api.lives() : SCENE_CONFIG.defaultMaxLives);

          els.bubble.classList.remove('sc-miss');
          els.missTag.classList.remove('sc-show');
          setHeroFace(false);
          mountMonsterVisual();
          renderLives();
          renderAttackBar();
          renderComboBadge(0);
          syncWords();
          measure();
        }

        function stopLoop() {
          running = false;
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = 0;
          }
          if (els.root) {
            els.root.classList.add('sc-paused');
          }
        }

        /* -------------------------------------------------------------------
           回傳給 TypingIsland 共用程式呼叫的生命週期物件
           ------------------------------------------------------------------- */
        return {
          start: function () {
            buildDom();
            resetRound();
          },

          roundStart: function () {
            if (!els.root) buildDom();
            resetRound();
          },

          resume: function () {
            if (!els.root) return;
            els.root.classList.remove('sc-paused');
            if (running) return;
            running = true;
            lastTime = performance.now();
            rafId = requestAnimationFrame(frame);
          },

          pause: function () {
            stopLoop();
          },

          stop: function () {
            stopLoop();
            clearFx();
          },

          hit: function (res) {
            // 若前隻怪獸還在變葉子飄走，立刻迎出下一隻承接這次攻擊
            if (monsterState === 'defeat') {
              spawnNextMonster();
            }

            // 清除錯誤狀態並重置反擊倒數
            bubbleShakeTimer = 0;
            els.bubble.classList.remove('sc-miss');
            els.missTag.classList.remove('sc-show');
            attackElapsed = 0;
            renderAttackBar();

            // 計算連擊與傷害（連擊 10 以上 ×1.5）
            var combo = (res && typeof res.combo === 'number') ? res.combo : (typeof api.combo === 'function' ? api.combo() : 0);
            var baseDmg = (res && res.correct > 0) ? res.correct : 1;
            var boosted = combo >= SCENE_CONFIG.comboBoostAt;
            var dmg = Math.round(baseDmg * (boosted ? SCENE_CONFIG.comboBoostMult : 1) * 10) / 10;

            renderComboBadge(combo);

            // 小狐狸揮劍
            heroState = 'slash';
            heroTimer = SCENE_CONFIG.heroSlashDur;
            setHeroFace(false);

            // 扣減怪獸血量
            monsterHp = Math.max(0, Math.round((monsterHp - dmg) * 10) / 10);
            renderMonsterHp();

            // 在怪獸右側偏上顯示回饋（避開中間對話框，不擋住要打的字）
            var fxX = geom.monX;
            var fxY = geom.groundY - 125 * geom.scale;
            var popLabel = boosted ? ('✓ -' + formatHp(dmg) + ' ×1.5') : ('✓ -' + formatHp(dmg));
            spawnPop(popLabel, fxX, fxY - 18, boosted ? SCENE_CONFIG.colors.boostText : SCENE_CONFIG.colors.hitText);
            spawnBurst('star', fxX - 18 * geom.scale, fxY + 25 * geom.scale, SCENE_CONFIG.hitStarCount);

            if (monsterHp <= 0) {
              // 怪獸 HP 歸零：變成小葉子飄走，過場後換下一隻
              var defeatedInfo = SCENE_CONFIG.monsters[monsterIndex % SCENE_CONFIG.monsters.length];
              monsterState = 'defeat';
              monsterTimer = SCENE_CONFIG.monsterDefeatDur;
              setMonsterFace('hurt');
              spawnBurst('leaf', fxX, fxY + 35 * geom.scale, SCENE_CONFIG.defeatLeafCount);
              spawnPop('打敗' + defeatedInfo.name + '！', fxX, fxY - 50, SCENE_CONFIG.colors.hitText);
            } else {
              monsterState = 'hurt';
              monsterTimer = SCENE_CONFIG.monsterHurtDur;
              setMonsterFace('hurt');
            }

            // 與共用程式的 upcoming 同步（打對的字已移走，更新成下一個目標字）
            syncWords();
            renderLives();
            applyTransforms();
          },

          miss: function () {
            // 打錯不扣血、不重置反擊倒數；只讓怪獸做鬼臉、對話框輕晃與顯示 ✗ 標籤
            renderComboBadge(0);
            bubbleShakeTimer = SCENE_CONFIG.bubbleShakeDur;
            els.bubble.classList.add('sc-miss');
            els.missTag.classList.add('sc-show');

            if (monsterState === 'idle' || monsterState === 'taunt') {
              monsterState = 'taunt';
              monsterTimer = SCENE_CONFIG.monsterTauntDur;
              setMonsterFace('taunt');
            }
            applyTransforms();
          },

          resize: function () {
            if (!els.root) return;
            measure();
          }
        };
      }
    });
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
</body></html>
