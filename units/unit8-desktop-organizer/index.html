<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面整理大師 - 學會把檔案放到對的資料夾</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<script defer src="../../assets/fullscreen.js"></script>
<style>
    :root {
        --c: #eab308;
        --c-dark: #ca8a04;
        --c-deep: #a16207;
        --ink: #78350f;
        --ink-soft: #92400e;
        --paper: #fffbeb;
        --paper-2: #fef3c7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        background:
            radial-gradient(circle at 20% 15%, #fef9c388 0%, transparent 55%),
            radial-gradient(circle at 80% 85%, #fde68a88 0%, transparent 55%),
            linear-gradient(180deg, #fffbeb 0%, #fef3c7 60%, #fde68a 100%);
        color: var(--ink);
        min-height: 100vh;
    }
    .screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .hidden { display: none !important; }

    /* ===== Title ===== */
    .title-emoji {
        font-size: clamp(80px, 14vw, 140px);
        animation: float 2.6s ease-in-out infinite;
        filter: drop-shadow(0 6px 16px #eab30866);
    }
    @keyframes float {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(-10px) rotate(3deg); }
    }
    .title-text {
        font-size: clamp(34px, 5.5vw, 52px);
        font-weight: 900;
        color: var(--ink);
        text-shadow: 3px 3px 0 var(--c), 5px 5px 0 #fde68a;
        margin: 8px 0 4px;
        text-align: center;
    }
    .subtitle {
        font-size: clamp(16px, 2vw, 22px);
        color: var(--ink-soft);
        font-weight: 700;
        margin-bottom: 24px;
        text-align: center;
    }
    .intro-card {
        background: rgba(255,255,255,0.7);
        border: 2px solid var(--c);
        border-radius: 18px;
        padding: 16px 20px;
        max-width: 540px;
        margin: 0 auto 24px;
        text-align: left;
        line-height: 1.9;
        font-size: clamp(14px, 1.8vw, 17px);
        color: var(--ink);
        box-shadow: 0 6px 18px rgba(202,138,4,0.18);
    }
    .intro-card strong { color: var(--c-deep); }
    .intro-card .pill {
        display: inline-block;
        background: var(--paper-2);
        border: 1px solid var(--c);
        border-radius: 8px;
        padding: 2px 8px;
        font-size: 0.95em;
        font-weight: 900;
        color: var(--ink);
        margin: 0 2px;
    }

    /* ===== Big Button ===== */
    .big-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(20px, 2.6vw, 28px);
        font-weight: 900;
        padding: 14px 32px;
        background: linear-gradient(180deg, #fde047, var(--c));
        color: var(--ink);
        border: none;
        border-radius: 999px;
        box-shadow: 0 5px 0 var(--c-dark), 0 8px 20px rgba(202,138,4,0.35);
        cursor: pointer;
        transition: transform 0.1s;
        text-shadow: 1px 1px 0 #fef9c3;
        margin: 6px;
    }
    .big-btn:hover { transform: translateY(-2px); }
    .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--c-dark); }
    .big-btn.gold {
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        box-shadow: 0 5px 0 #b45309;
        color: white;
        text-shadow: 2px 2px 0 #92400e;
    }
    .big-btn.gold:active { box-shadow: 0 2px 0 #b45309; }
    .big-btn.gray {
        background: linear-gradient(180deg, #e7e5e4, #d6d3d1);
        color: var(--ink);
        box-shadow: 0 5px 0 #a8a29e;
        text-shadow: none;
    }
    .big-btn.gray:active { box-shadow: 0 2px 0 #a8a29e; }

    /* ===== Game Screen ===== */
    #game-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 12px 16px;
        gap: 10px;
    }
    .game-top {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 1000px;
    }
    .info-box {
        background: rgba(255,255,255,0.85);
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 900;
        font-size: clamp(13px, 1.6vw, 17px);
        color: var(--ink);
        border: 2px solid var(--c);
    }
    .top-back {
        background: transparent;
        border: 2px solid var(--c-dark);
        color: var(--c-deep);
        font-family: 'Noto Sans TC', sans-serif;
        font-weight: 700;
        font-size: 14px;
        padding: 4px 14px;
        border-radius: 999px;
        cursor: pointer;
        text-decoration: none;
    }
    .level-title {
        text-align: center;
        font-size: clamp(15px, 2vw, 19px);
        font-weight: 900;
        color: var(--ink-soft);
        background: rgba(255,255,255,0.65);
        padding: 6px 18px;
        border-radius: 999px;
        border: 2px dashed var(--c);
    }

    /* ===== Workspace ===== */
    .workspace {
        width: 100%;
        max-width: 1100px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
    }
    @media (min-width: 720px) {
        .workspace { grid-template-columns: 1.6fr 1fr; }
    }

    .desktop {
        position: relative;
        background:
            repeating-linear-gradient(45deg, rgba(255,255,255,0.4) 0 2px, transparent 2px 14px),
            linear-gradient(180deg, #fef9c3 0%, #fde68a 100%);
        border: 3px solid var(--c);
        border-radius: 22px;
        padding: 18px;
        min-height: clamp(320px, 56vh, 540px);
        box-shadow: inset 0 0 0 4px #fffbeb, 0 8px 20px rgba(202,138,4,0.18);
        overflow: hidden;
    }
    .desktop-label {
        position: absolute;
        top: 8px;
        left: 14px;
        font-weight: 900;
        color: var(--c-deep);
        font-size: 13px;
        background: rgba(255,255,255,0.7);
        padding: 2px 10px;
        border-radius: 999px;
        border: 1px solid var(--c);
        letter-spacing: 1px;
    }

    .file-icon {
        position: absolute;
        width: 78px;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: grab;
        touch-action: none;
        transition: transform 0.2s, box-shadow 0.2s;
        z-index: 5;
    }
    .file-icon:hover { transform: scale(1.06); }
    .file-icon.dragging {
        cursor: grabbing;
        z-index: 100;
        transition: none;
        filter: drop-shadow(0 8px 16px rgba(120,53,15,0.35));
    }
    .file-icon.dragging .file-emoji { transform: scale(1.1); }
    .file-icon .file-emoji {
        font-size: 46px;
        line-height: 1;
        filter: drop-shadow(0 3px 4px rgba(120,53,15,0.25));
        transition: transform 0.15s;
    }
    .file-icon .file-name {
        margin-top: 2px;
        font-size: 11px;
        font-weight: 900;
        color: var(--ink);
        background: rgba(255,255,255,0.92);
        padding: 2px 6px;
        border-radius: 6px;
        border: 1px solid var(--c);
        max-width: 78px;
        text-align: center;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
    }
    .file-icon.shake { animation: shake 0.5s ease; }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        15% { transform: translateX(-10px) rotate(-6deg); }
        30% { transform: translateX(10px) rotate(6deg); }
        45% { transform: translateX(-8px) rotate(-4deg); }
        60% { transform: translateX(8px) rotate(4deg); }
        80% { transform: translateX(-3px) rotate(-2deg); }
    }
    .file-icon.shake .file-name {
        background: #fecaca;
        border-color: #ef4444;
        color: #991b1b;
    }
    .file-icon.flying {
        transition: transform 0.55s cubic-bezier(0.5, -0.2, 0.7, 1.3), opacity 0.55s;
        pointer-events: none;
        z-index: 80;
    }

    /* ===== Folder Panel ===== */
    .folder-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 10px;
        background: rgba(255,255,255,0.45);
        border: 2px dashed var(--c-dark);
        border-radius: 22px;
    }
    .folder {
        position: relative;
        background: linear-gradient(180deg, #fffbeb, #fef3c7);
        border: 3px solid var(--c);
        border-radius: 16px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
        box-shadow: 0 4px 0 var(--c-dark);
    }
    .folder.hover {
        transform: translateY(-3px) scale(1.03);
        background: linear-gradient(180deg, #fde047, #fbbf24);
        box-shadow: 0 7px 0 var(--c-dark), 0 0 24px #fde68a;
    }
    .folder.received {
        animation: folder-pop 0.45s ease-out;
    }
    @keyframes folder-pop {
        0% { transform: scale(1); }
        40% { transform: scale(1.08); background: #bef264; }
        100% { transform: scale(1); }
    }
    .folder .folder-emoji {
        font-size: 42px;
        line-height: 1;
        filter: drop-shadow(0 2px 3px rgba(120,53,15,0.25));
    }
    .folder .folder-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    .folder .folder-name {
        font-size: clamp(15px, 1.9vw, 18px);
        font-weight: 900;
        color: var(--ink);
    }
    .folder .folder-count {
        font-size: 12px;
        color: var(--c-deep);
        font-weight: 700;
    }

    /* ===== Banner ===== */
    .banner {
        position: fixed; inset: 0;
        background: rgba(120,53,15,0.55);
        display: flex; align-items: center; justify-content: center;
        z-index: 200;
        animation: banner-fade 0.25s ease-out;
    }
    @keyframes banner-fade { from { opacity: 0; } to { opacity: 1; } }
    .banner-card {
        background: linear-gradient(180deg, #fffbeb, #fef3c7);
        border: 3px solid var(--c);
        padding: 26px 32px;
        border-radius: 22px;
        text-align: center;
        max-width: 90%;
        box-shadow: 0 12px 0 var(--c-dark), 0 16px 40px rgba(120,53,15,0.4);
        color: var(--ink);
    }
    .banner-trophy { font-size: 64px; line-height: 1; }
    .banner-title {
        font-size: clamp(24px, 3.4vw, 34px);
        font-weight: 900;
        color: var(--ink);
        margin: 10px 0 4px;
    }
    .banner-stars {
        font-size: clamp(28px, 4vw, 40px);
        letter-spacing: 6px;
        margin: 8px 0;
    }
    .banner-msg {
        color: var(--ink-soft);
        font-size: clamp(14px, 1.8vw, 17px);
        font-weight: 700;
        margin: 6px 0 4px;
    }
    .banner-actions {
        margin-top: 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
    }

    /* ===== Certificate ===== */
    .certificate {
        background: linear-gradient(180deg, #fffbeb, #fef3c7);
        border: 6px double var(--c-deep);
        border-radius: 24px;
        padding: 36px 32px;
        text-align: center;
        max-width: 540px;
        position: relative;
        color: var(--ink);
        box-shadow: 0 16px 40px rgba(120,53,15,0.25);
    }
    .cert-corner { position: absolute; font-size: 36px; }
    .cert-corner.tl { top: 8px; left: 12px; }
    .cert-corner.tr { top: 8px; right: 12px; }
    .cert-corner.bl { bottom: 8px; left: 12px; }
    .cert-corner.br { bottom: 8px; right: 12px; }
    .cert-title { font-size: clamp(28px, 4vw, 40px); font-weight: 900; color: var(--ink); margin-bottom: 8px; }
    .cert-body { font-size: clamp(17px, 2vw, 21px); color: var(--ink-soft); line-height: 1.8; margin: 14px 0; }
    .cert-stat {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: center;
        margin: 10px 0;
    }
    .cert-stat .lvl-line {
        display: flex;
        gap: 8px;
        font-size: clamp(15px, 1.8vw, 18px);
        font-weight: 700;
        color: var(--ink-soft);
    }
    .cert-stat .lvl-label {
        min-width: 64px;
        text-align: right;
        color: var(--c-deep);
    }
    .cert-rank { font-size: clamp(20px, 2.5vw, 28px); font-weight: 900; color: var(--ink); margin-top: 14px; }

    /* ===== Print ===== */
    @media print {
        body { background: white; color: black; }
        #start-screen, #game-screen, .banner { display: none !important; }
        #end-screen { min-height: auto; padding: 0; }
        #end-screen > div:not(.certificate) { display: none !important; }
        .certificate { box-shadow: none; border-color: var(--c-deep); }
    }

    /* ===== Hint ===== */
    .hint-text {
        text-align: center;
        color: var(--ink-soft);
        font-size: clamp(13px, 1.8vw, 16px);
        font-weight: 700;
        background: rgba(255,255,255,0.7);
        padding: 6px 16px;
        border-radius: 999px;
        max-width: 540px;
        margin: 0 auto;
        border: 1px dashed var(--c-dark);
    }
</style>

// ============================================================
// Audio (Web Audio API)
// ============================================================
let audioCtx = null;
function getAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    return audioCtx;
}
function beep(freq, dur, type = 'square', vol = 0.1) {
    try {
        const ctx = getAudio(); if (!ctx) return;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(vol, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(g).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
    } catch(e) {}
}
const SFX = {
    click() { beep(520, 0.06, 'square', 0.07); },
    pick() { beep(680, 0.08, 'sine', 0.08); },
    correct() {
        beep(660, 0.1, 'sine', 0.1);
        setTimeout(() => beep(880, 0.12, 'sine', 0.1), 90);
        setTimeout(() => beep(1100, 0.16, 'sine', 0.1), 180);
    },
    wrong() {
        beep(220, 0.12, 'square', 0.12);
        setTimeout(() => beep(160, 0.18, 'square', 0.12), 120);
    },
    clear() {
        const notes = [523, 659, 784, 988, 1175];
        notes.forEach((f, i) => setTimeout(() => beep(f, 0.14, 'triangle', 0.1), i * 110));
    },
    finale() {
        const notes = [523, 659, 784, 1047, 1319, 1568];
        notes.forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle', 0.12), i * 130));
    },
};

// ============================================================
// State
// ============================================================
const state = {
    levelIdx: 0,
    fileNodes: [],          // active file DOM nodes
    folderRects: {},        // folder bounding rects cache (refreshed on use)
    folderCounts: {},       // received counts per folder id
    levelErrors: 0,
    levelStars: [],
    totalStars: 0,
    drag: null,             // { node, file, offsetX, offsetY, originX, originY }
};

function $(id) { return document.getElementById(id); }

// ============================================================
// Layout helpers
// ============================================================
function getDesktop() { return $('desktop'); }

function randomPositions(count, desktopRect) {
    // Place file icons in a soft jittered grid so they don't overlap
    const pad = 20;
    const labelH = 36; // reserve space under the "📺 桌面" label
    const iconW = 78;
    const iconH = 78;
    const usableW = Math.max(100, desktopRect.width - pad * 2);
    const usableH = Math.max(100, desktopRect.height - pad * 2 - labelH);
    const cols = Math.max(2, Math.floor(usableW / (iconW + 12)));
    const rows = Math.max(2, Math.ceil(count / cols));
    const cellW = usableW / cols;
    const cellH = Math.min(iconH + 18, usableH / rows);
    const positions = [];
    for (let i = 0; i < count; i++) {
        const r = Math.floor(i / cols);
        const c = i % cols;
        const baseX = pad + c * cellW + (cellW - iconW) / 2;
        const baseY = pad + labelH + r * cellH + (cellH - iconH) / 2;
        const jitterX = (Math.random() - 0.5) * 10;
        const jitterY = (Math.random() - 0.5) * 8;
        positions.push({
            x: Math.max(pad, Math.min(desktopRect.width - iconW - pad, baseX + jitterX)),
            y: Math.max(pad + labelH, Math.min(desktopRect.height - iconH - pad, baseY + jitterY)),
        });
    }
    // Shuffle so visual order != logical order
    for (let i = positions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [positions[i], positions[j]] = [positions[j], positions[i]];
    }
    return positions;
}

// ============================================================
// Render
// ============================================================
function renderLevel() {
    const level = LEVELS[state.levelIdx];
    $('level-info').textContent = `第 ${state.levelIdx + 1} 關`;
    $('level-title').textContent = level.title;
    $('hint-text').textContent = level.hint;
    $('star-info').textContent = `⭐ ${state.totalStars}`;
    $('error-info').textContent = `❌ ${state.levelErrors}`;

    // Folders
    const fp = $('folder-panel');
    fp.innerHTML = '';
    state.folderCounts = {};
    level.folders.forEach(f => {
        state.folderCounts[f.id] = 0;
        const div = document.createElement('div');
        div.className = 'folder';
        div.dataset.folder = f.id;
        div.innerHTML = `
            <div class="folder-emoji">${f.emoji}</div>
            <div class="folder-info">
                <div class="folder-name">${f.name}</div>
                <div class="folder-count" id="count-${f.id}">已收 0 個</div>
            </div>
        `;
        fp.appendChild(div);
    });

    // Files
    const desktop = getDesktop();
    // Clear old files but keep label
    [...desktop.querySelectorAll('.file-icon')].forEach(n => n.remove());
    state.fileNodes = [];

    // Wait one frame so desktop has correct size, then place
    requestAnimationFrame(() => {
        const rect = desktop.getBoundingClientRect();
        const positions = randomPositions(level.files.length, rect);
        level.files.forEach((file, i) => {
            const node = document.createElement('div');
            node.className = 'file-icon';
            const pos = positions[i];
            node.style.left = pos.x + 'px';
            node.style.top = pos.y + 'px';
            node.dataset.target = file.target;
            node.innerHTML = `
                <div class="file-emoji">${file.emoji}</div>
                <div class="file-name">${file.name}</div>
            `;
            attachDragHandlers(node, file);
            desktop.appendChild(node);
            state.fileNodes.push(node);
        });
    });
}

function updateFolderCount(folderId) {
    const el = $('count-' + folderId);
    if (el) el.textContent = `已收 ${state.folderCounts[folderId]} 個`;
}

// ============================================================
// Drag (Pointer Events)
// ============================================================
function attachDragHandlers(node, file) {
    node.addEventListener('pointerdown', (e) => onPointerDown(e, node, file));
}

function onPointerDown(e, node, file) {
    if (state.drag) return;
    e.preventDefault();
    try { node.setPointerCapture(e.pointerId); } catch(_) {}
    const rect = node.getBoundingClientRect();
    const offsetX = e.clientX - rect.left;
    const offsetY = e.clientY - rect.top;
    const originX = parseFloat(node.style.left) || 0;
    const originY = parseFloat(node.style.top) || 0;

    state.drag = {
        node, file, offsetX, offsetY, originX, originY,
        pointerId: e.pointerId,
    };
    node.classList.add('dragging');
    // Make icon not capture elementFromPoint so we can detect folder under cursor
    node.style.pointerEvents = 'none';
    SFX.pick();

    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
    document.addEventListener('pointercancel', onPointerUp);
}

function onPointerMove(e) {
    if (!state.drag) return;
    e.preventDefault();
    const desktop = getDesktop();
    const deskRect = desktop.getBoundingClientRect();
    // Move file icon — position is relative to desktop container.
    // Allow it to roam visually outside (using fixed-ish trick): we keep absolute inside desktop,
    // but compute coords relative to desktop's top-left.
    const x = e.clientX - deskRect.left - state.drag.offsetX;
    const y = e.clientY - deskRect.top - state.drag.offsetY;
    state.drag.node.style.left = x + 'px';
    state.drag.node.style.top = y + 'px';

    // Highlight folder under cursor
    const folderEl = getFolderAtPoint(e.clientX, e.clientY);
    document.querySelectorAll('.folder').forEach(f => {
        if (f === folderEl) f.classList.add('hover');
        else f.classList.remove('hover');
    });
}

function getFolderAtPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    return el.closest('.folder');
}

function onPointerUp(e) {
    if (!state.drag) return;
    const drag = state.drag;
    document.removeEventListener('pointermove', onPointerMove);
    document.removeEventListener('pointerup', onPointerUp);
    document.removeEventListener('pointercancel', onPointerUp);

    const folderEl = getFolderAtPoint(e.clientX, e.clientY);
    document.querySelectorAll('.folder').forEach(f => f.classList.remove('hover'));

    drag.node.classList.remove('dragging');
    drag.node.style.pointerEvents = '';

    state.drag = null;

    if (folderEl) {
        const folderId = folderEl.dataset.folder;
        if (folderId === drag.file.target) {
            handleCorrect(drag.node, drag.file, folderEl);
        } else {
            handleWrong(drag.node, drag.originX, drag.originY);
        }
    } else {
        // Dropped on nothing — return to origin
        returnToOrigin(drag.node, drag.originX, drag.originY);
    }
}

function returnToOrigin(node, x, y) {
    node.style.transition = 'left 0.3s ease, top 0.3s ease';
    node.style.left = x + 'px';
    node.style.top = y + 'px';
    setTimeout(() => { node.style.transition = ''; }, 320);
}

function handleWrong(node, originX, originY) {
    SFX.wrong();
    state.levelErrors++;
    $('error-info').textContent = `❌ ${state.levelErrors}`;
    node.classList.add('shake');
    returnToOrigin(node, originX, originY);
    setTimeout(() => node.classList.remove('shake'), 520);
}

function handleCorrect(node, file, folderEl) {
    SFX.correct();
    const folderId = folderEl.dataset.folder;
    state.folderCounts[folderId]++;
    updateFolderCount(folderId);
    folderEl.classList.add('received');
    setTimeout(() => folderEl.classList.remove('received'), 460);

    // Fly the file icon toward folder
    const deskRect = getDesktop().getBoundingClientRect();
    const folderRect = folderEl.getBoundingClientRect();
    const nodeRect = node.getBoundingClientRect();
    const dx = (folderRect.left + folderRect.width / 2) - (nodeRect.left + nodeRect.width / 2);
    const dy = (folderRect.top + folderRect.height / 2) - (nodeRect.top + nodeRect.height / 2);

    node.classList.add('flying');
    // Combine translate (delta) and scale + fade
    node.style.transform = `translate(${dx}px, ${dy}px) scale(0.2) rotate(20deg)`;
    node.style.opacity = '0';

    setTimeout(() => {
        node.remove();
        state.fileNodes = state.fileNodes.filter(n => n !== node);
        checkLevelComplete();
    }, 560);
}

// ============================================================
// Level flow
// ============================================================
function checkLevelComplete() {
    if (state.fileNodes.length > 0) return;
    levelClear();
}

function calcStars(errors) {
    if (errors === 0) return 3;
    if (errors <= 2) return 2;
    return 1;
}

function levelClear() {
    const stars = calcStars(state.levelErrors);
    state.totalStars += stars;
    state.levelStars[state.levelIdx] = stars;
    SFX.clear();

    const isLast = state.levelIdx >= LEVELS.length - 1;
    const errNote = state.levelErrors === 0
        ? '<div style="font-size: 14px; color: var(--c-deep); margin-top: 4px;">完美整理！沒有放錯 ✨</div>'
        : `<div style="font-size: 14px; color: var(--ink-soft); margin-top: 4px;">這關放錯了 ${state.levelErrors} 次</div>`;

    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.id = 'banner';
    banner.innerHTML = `
        <div class="banner-card">
            <div class="banner-trophy">🎉</div>
            <div class="banner-title">${LEVELS[state.levelIdx].title} 整理完成！</div>
            <div class="banner-stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
            <div class="banner-msg">獲得 ${stars} 顆星星</div>
            ${errNote}
            <div class="banner-actions">
                ${isLast
                    ? '<button class="big-btn gold" onclick="finishAllLevels()">🏆 領取證書</button>'
                    : '<button class="big-btn" onclick="nextLevel()">▶ 下一關</button>'}
            </div>
        </div>
    `;
    document.body.appendChild(banner);
}

function closeBanner() {
    const b = $('banner');
    if (b) b.remove();
}

function nextLevel() {
    closeBanner();
    state.levelIdx++;
    state.levelErrors = 0;
    renderLevel();
}

function finishAllLevels() {
    closeBanner();
    SFX.finale();
    try {
        const prev = parseInt(localStorage.getItem('edtech-unit8-score') || '0', 10);
        if (state.totalStars > prev) localStorage.setItem('edtech-unit8-score', state.totalStars);
    } catch(e) {}

    $('game-screen').classList.add('hidden');
    $('end-screen').classList.remove('hidden');

    const maxStars = LEVELS.length * 3;
    let starsHtml = '';
    for (let i = 0; i < LEVELS.length; i++) {
        const s = state.levelStars[i] || 0;
        starsHtml += `<span class="lvl-line"><span class="lvl-label">第${i+1}關</span>${'⭐'.repeat(s)}${'☆'.repeat(3 - s)}</span>`;
    }
    $('cert-stars').innerHTML = starsHtml;

    if (state.totalStars >= maxStars) {
        $('cert-trophy').textContent = '👑';
        $('cert-rank').textContent = '👑 稱號：桌面整理大宗師';
    } else if (state.totalStars >= 13) {
        $('cert-trophy').textContent = '🥇';
        $('cert-rank').textContent = '🥇 稱號：整潔小達人';
    } else if (state.totalStars >= 9) {
        $('cert-trophy').textContent = '🥈';
        $('cert-rank').textContent = '🥈 稱號：整理小幫手';
    } else {
        $('cert-trophy').textContent = '💪';
        $('cert-rank').textContent = '💪 稱號：努力整理中';
    }

    const today = new Date();
    $('cert-date').textContent = `${today.getFullYear() - 1911} 年 ${today.getMonth() + 1} 月 ${today.getDate()} 日 頒發`;
}

// ============================================================
// Flow
// ============================================================
function startGame() {
    state.levelIdx = 0;
    state.fileNodes = [];
    state.folderCounts = {};
    state.levelErrors = 0;
    state.levelStars = [];
    state.totalStars = 0;
    $('start-screen').classList.add('hidden');
    $('end-screen').classList.add('hidden');
    $('game-screen').classList.remove('hidden');
    renderLevel();
    getAudio();
}

// Re-layout on resize so files don't get stranded
let resizeTimer = null;
window.addEventListener('resize', () => {
    if ($('game-screen').classList.contains('hidden')) return;
    if (state.fileNodes.length === 0) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        // Re-distribute remaining files within new desktop bounds
        const desktop = getDesktop();
        const rect = desktop.getBoundingClientRect();
        const positions = randomPositions(state.fileNodes.length, rect);
        state.fileNodes.forEach((node, i) => {
            const pos = positions[i];
            node.style.left = pos.x + 'px';
            node.style.top = pos.y + 'px';
        });
    }, 180);
});

// Dev shortcut: F8 jump straight to certificate
document.addEventListener('keydown', (e) => {
    if (e.key === 'F8') {
        e.preventDefault();
        state.levelStars = [3, 3, 2, 3, 2];
        state.totalStars = 13;
        $('start-screen').classList.add('hidden');
        $('game-screen').classList.add('hidden');
        finishAllLevels();
    }
});

// Expose for inline onclick
window.startGame = startGame;
window.nextLevel = nextLevel;
window.finishAllLevels = finishAllLevels;
</script>
