<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寵物房間大整理 - 小常識島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Baloo+2:wght@700;800&display=swap">
  <link rel="stylesheet" href="../../assets/css/smart-island.css">
  <style>
    /* ===== 本關場景樣式（一律以 sc- 開頭，不覆蓋共用 .sm- 樣式） ===== */

    /* 左側：寵物房間的黏土電腦螢幕 */
    .sc-monitor {
      position: absolute;
      left: 24px;
      top: 14px;
      width: 976px;
      height: 562px;
      padding: 12px;
      background: var(--card);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box;
    }

    /* 螢幕頂部工作列：顯示關卡任務與剩餘檔案數 */
    .sc-topbar {
      height: 52px;
      padding: 0 16px;
      border-radius: 16px;
      background: var(--lilac);
      border: 2px solid #D9CBF2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .sc-dots {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .sc-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid var(--ink);
    }
    .sc-dot-a { background: var(--orange); }
    .sc-dot-b { background: #FFD45A; }
    .sc-dot-c { background: #6CD098; }

    .sc-task {
      flex: 1;
      margin: 0;
      color: var(--ink);
      font-size: 21px;
      font-weight: 900;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sc-remain {
      flex-shrink: 0;
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--card);
      border: 2px solid #D3C3EE;
      color: var(--ink);
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sc-remain .sm-num {
      font-size: 22px;
      color: var(--violet);
    }

    /* 電腦桌面區域（上方散落檔案＋下方資料夾列） */
    .sc-desk {
      position: relative;
      flex: 1;
      border-radius: 18px;
      background: linear-gradient(180deg, #E5F1FC 0%, #F1ECFA 64%, #FBF2E6 64%, #F8EAD8 100%);
      border: 3px solid #D6CEE8;
      box-shadow: inset 0 4px 10px rgba(59, 35, 80, .06);
      overflow: hidden;
    }

    /* 桌面分隔線與角落裝飾（低彩度不干擾視線） */
    .sc-desk-line {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 306px;
      height: 3px;
      border-radius: 2px;
      background: rgba(106, 69, 201, .16);
      pointer-events: none;
    }

    /* 散落檔案圖層 */
    .sc-files-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 940px;
      height: 464px;
      pointer-events: none;
    }

    /* 單一可拖曳檔案卡（≥ 44px，實測 134×90px） */
    .sc-file {
      position: absolute;
      width: 134px;
      height: 90px;
      padding: 5px 6px 4px;
      border-radius: 18px;
      background: var(--card);
      border: 3px solid var(--edge);
      box-shadow: 0 5px 0 #E5D0BE, 0 8px 14px rgba(59, 35, 80, .12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      pointer-events: auto;
      box-sizing: border-box;
      z-index: 10;
      transition: transform .16s ease-out, box-shadow .16s ease-out, border-color .16s ease-out;
    }
    .sc-file:hover {
      transform: translateY(-3px);
      border-color: var(--violet);
    }
    .sc-file:focus-visible {
      outline: 4px solid var(--violet);
      outline-offset: 3px;
    }
    .sc-file.is-selected {
      border-color: var(--violet);
      background: #F6F1FF;
      box-shadow: 0 0 0 4px rgba(106, 69, 201, .22), 0 6px 0 #C8B5EE;
      transform: translateY(-4px) scale(1.03);
      z-index: 25;
    }
    .sc-file.is-drag {
      cursor: grabbing;
      border-color: var(--orange);
      box-shadow: 0 14px 24px rgba(59, 35, 80, .24);
      transform: scale(1.08) rotate(-2deg);
      transition: none;
      z-index: 50;
    }
    .sc-file.is-returning {
      transition: left .28s cubic-bezier(.22, 1.28, .36, 1), top .28s cubic-bezier(.22, 1.28, .36, 1), transform .24s ease-out;
      z-index: 35;
    }
    .sc-file.is-wrong {
      border-color: var(--bad);
      background: var(--bad-soft);
    }
    .sc-file.is-flying {
      transition: left .26s ease-in, top .26s ease-in, transform .26s ease-in, opacity .26s ease-in;
      transform: scale(.25);
      opacity: 0;
      pointer-events: none;
      z-index: 45;
    }
    .sc-file.is-done {
      display: none;
    }
    .sc-file-ico {
      width: 54px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .sc-file-ico svg {
      width: 54px;
      height: 50px;
      display: block;
    }
    .sc-file-name {
      color: var(--ink);
      font-size: 17px;
      font-weight: 900;
      line-height: 1.15;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 桌面下方：資料夾停泊區 */
    .sc-dock {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 156px;
      padding: 6px 14px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-sizing: border-box;
      z-index: 5;
    }

    /* 單一資料夾目標區（2 個\u{E01E1}時 280×142px，4 個\u{E01E1}時 216×142px，皆 ≥ 140px） */
    .sc-folder {
      position: relative;
      width: 216px;
      height: 142px;
      padding: 8px 10px 6px;
      border-radius: 22px;
      background: var(--card);
      border: 3px solid var(--edge);
      box-shadow: inset 0 3px 0 #fff, inset 0 -5px 0 rgba(233, 213, 196, .55), 0 6px 0 #E5D0BE;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      color: var(--ink);
      box-sizing: border-box;
      transition: transform .16s ease-out, border-color .16s ease-out, background-color .16s ease-out;
    }
    .sc-dock.is-two .sc-folder {
      width: 280px;
    }
    .sc-folder:hover {
      transform: translateY(-2px);
      border-color: var(--violet);
    }
    .sc-folder:focus-visible {
      outline: 4px solid var(--violet);
      outline-offset: 3px;
    }
    .sc-folder.is-over {
      transform: translateY(-5px) scale(1.04);
      border-color: var(--violet);
      background: var(--lilac);
      box-shadow: 0 0 0 4px rgba(106, 69, 201, .24), 0 8px 0 #C8B5EE;
    }
    .sc-folder.is-ok {
      border-color: var(--ok);
      background: var(--ok-soft);
      animation: sc-pop .28s ease-out;
    }
    .sc-folder.is-shake {
      border-color: var(--bad);
      background: var(--bad-soft);
      animation: sc-shake .32s ease-in-out;
    }
    .sc-folder-ico {
      width: 74px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .sc-folder-ico svg {
      width: 74px;
      height: 62px;
      display: block;
    }
    .sc-folder-label {
      color: var(--ink);
      font-size: 22px;
      font-weight: 900;
      line-height: 1.25;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 資料夾右上角：已放入數量徽章 */
    .sc-fcount {
      position: absolute;
      top: 8px;
      right: 10px;
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--lilac);
      border: 2px solid #C8B5EE;
      color: var(--ink);
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      pointer-events: none;
    }
    .sc-fcount.has-items {
      background: var(--violet);
      border-color: var(--violet-d);
      color: #fff;
    }

    /* 放對時浮起的 +1 ✓ 提示 */
    .sc-plus {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 3px 12px;
      border-radius: 999px;
      background: var(--ok);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
      pointer-events: none;
      animation: sc-float .65s ease-out forwards;
    }

    /* 右側：寵物陪伴區（泡泡＋280px 寵物＋狀態卡） */
    .sc-petbox {
      position: absolute;
      left: 1018px;
      top: 14px;
      width: 324px;
      height: 562px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
    }

    /* 寵物對話泡泡 */
    .sc-bubble {
      position: relative;
      width: 100%;
      min-height: 132px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      box-sizing: border-box;
      transition: background-color .18s ease-out, border-color .18s ease-out;
    }
    .sc-bubble::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -14px;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      background: inherit;
      border-right: 3px solid var(--edge);
      border-bottom: 3px solid var(--edge);
      transform: rotate(45deg);
    }
    .sc-bubble.is-ok {
      background: var(--ok-soft);
      border-color: var(--ok);
    }
    .sc-bubble.is-ok::after {
      border-right-color: var(--ok);
      border-bottom-color: var(--ok);
    }
    .sc-bubble.is-bad {
      background: var(--bad-soft);
      border-color: var(--bad);
    }
    .sc-bubble.is-bad::after {
      border-right-color: var(--bad);
      border-bottom-color: var(--bad);
    }

    .sc-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 12px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
    }
    .sc-badge-ok {
      background: var(--ok);
      color: #fff;
    }
    .sc-badge-bad {
      background: var(--bad);
      color: #fff;
    }
    .sc-badge-tip {
      background: var(--butter);
      color: var(--ink);
      border: 2px solid #E5C87A;
    }

    .sc-speech {
      margin: 0;
      color: var(--ink);
      font-size: 20px;
      font-weight: 900;
      line-height: 1.5;
    }

    /* 寵物本體舞台（280×280px，表情清楚） */
    .sc-pet-stage {
      position: relative;
      width: 284px;
      height: 292px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sc-pet-rug {
      position: absolute;
      bottom: 8px;
      width: 230px;
      height: 36px;
      border-radius: 50%;
      background: rgba(106, 69, 201, .12);
    }
    .sc-pet {
      position: relative;
      width: 280px;
      height: 280px;
      z-index: 2;
    }
    .sc-pet svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .sc-pet.is-hop {
      animation: sc-hop .34s ease-out;
    }
    .sc-pet.is-wiggle {
      animation: sc-shake .34s ease-in-out;
    }

    /* 右下角：簡潔進度與操作提示卡 */
    .sc-status {
      width: 100%;
      padding: 12px 16px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-sizing: border-box;
    }
    .sc-status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 19px;
      font-weight: 900;
      white-space: nowrap;
    }
    .sc-status-row .sm-num {
      font-size: 24px;
      color: var(--violet);
    }
    .sc-hint-mini {
      color: var(--ink2);
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* 單次回饋動畫（不連續閃爍） */
    @keyframes sc-pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    @keyframes sc-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      65% { transform: translateX(7px); }
    }
    @keyframes sc-hop {
      0%, 100% { transform: translateY(0); }
      45% { transform: translateY(-12px); }
    }
    @keyframes sc-float {
      0% { opacity: 0; transform: translate(-50%, 6px) scale(.85); }
      25% { opacity: 1; transform: translate(-50%, -6px) scale(1.06); }
      100% { opacity: 0; transform: translate(-50%, -26px) scale(1); }
    }

    /* 尊重系統減少動態偏好 */
    @media (prefers-reduced-motion: reduce) {
      .sc-file, .sc-folder, .sc-bubble, .sc-pet, .sc-plus {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head><body>

    /* =====================================================================
     *  掛載至小常識島共用外殼（mount 欄位依本關設定一字不改）
     * ===================================================================== */
    SmartIsland.mount({
      unit: 8,
      title: '寵物房間大整理',
      grade: '1–4 年級',
      howto: '寵物的桌面好亂！把檔案拖進對的資料夾。',
      zhuyin: true,
      teach: '依檔案類型（圖示）分類整理｜資E8 認識基本的數位資源整理方法',
      levels: SCENE_CONFIG.LEVELS.map(function (lv, idx) {
        return { name: lv.name, icon: LEVEL_ICONS[idx] };
      }),

      scene: function (api) {
        var alive = false;        // 關卡是否進行中
        var timers = [];          // 所有待清理的 setTimeout
        var lvData = null;        // 目前關卡設定
        var items = [];           // 目前關卡檔案執行狀態
        var folderCounts = {};    // 各資料夾已放入數量
        var placedCount = 0;      // 已放好數量
        var mistakes = 0;         // 本關放錯次數
        var praiseIdx = 0;        // 稱讚句輪播索引
        var selectedId = null;    // 點選模式目前選中的檔案編號
        var drag = null;          // 目前拖曳狀態

        // 場景內常用 DOM 參考
        var deskEl = null;
        var filesLayerEl = null;
        var dockEl = null;
        var bubbleEl = null;
        var petEl = null;
        var remainNumEl = null;
        var doneNumEl = null;

        // 安全排程：離開關卡時會統一取消
        function later(fn, ms) {
          var id = setTimeout(function () {
            timers = timers.filter(function (t) { return t !== id; });
            if (alive) fn();
          }, ms);
          timers.push(id);
          return id;
        }

        // 清掉所有排程
        function clearTimers() {
          for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
          timers = [];
        }

        // 取得寵物名稱（沒領養時外殼預設為訪客名字）
        function petName() {
          var p = api.pet ? api.pet() : null;
          return (p && p.name) ? p.name : '小雲';
        }

        // 套入寵物名稱到台詞
        function formatSpeech(tpl) {
          return tpl.replace(/\{pet\}/g, petName());
        }

        // 更新寵物表情與對話泡泡（mood: happy / normal / worried / surprised）
        function setPetState(mood, opts, textHtml, tone, animClass) {
          if (!petEl || !bubbleEl) return;
          petEl.innerHTML = api.petSVG(mood, opts || {});
          petEl.classList.remove('is-hop', 'is-wiggle');
          if (animClass) {
            void petEl.offsetWidth;
            petEl.classList.add(animClass);
          }

          bubbleEl.classList.remove('is-ok', 'is-bad');
          var badgeHtml = '';
          if (tone === 'ok') {
            bubbleEl.classList.add('is-ok');
            badgeHtml = '<span class="sc-badge sc-badge-ok">✓ 放對了</span>';
          } else if (tone === 'bad') {
            bubbleEl.classList.add('is-bad');
            badgeHtml = '<span class="sc-badge sc-badge-bad">✗ 再看圖示</span>';
          } else {
            badgeHtml = '<span class="sc-badge sc-badge-tip">' + petName() + '說</span>';
          }

          var zyCls = api.zy ? ' sm-zy' : '';
          bubbleEl.innerHTML = badgeHtml + '<p class="sc-speech' + zyCls + '">' + textHtml + '</p>';
        }

        // 清除點選狀態
        function clearSelection() {
          if (selectedId === null) return;
          var prev = items[selectedId];
          if (prev && prev.el) prev.el.classList.remove('is-selected');
          selectedId = null;
        }

        // 選取指定檔案（提供低年級點選輔助）
        function selectItem(idx) {
          var st = items[idx];
          if (!st || st.placed) return;
          if (selectedId === idx) {
            clearSelection();
            setPetState('normal', { q: true }, formatSpeech(lvData.intro), 'tip');
            return;
          }
          clearSelection();
          selectedId = idx;
          st.el.classList.add('is-selected');
          setPetState('normal', { q: true }, '要放進哪一格？<br>點資料夾就能放喔！', 'tip');
        }

        // 取得指標下對應的資料夾節點（加 10px 寬容邊界，更好放置）
        function hitFolder(clientX, clientY) {
          if (!dockEl) return null;
          var list = dockEl.querySelectorAll('.sc-folder');
          var pad = 10;
          for (var i = 0; i < list.length; i++) {
            var r = list[i].getBoundingClientRect();
            if (clientX >= r.left - pad && clientX <= r.right + pad &&
                clientY >= r.top - pad && clientY <= r.bottom + pad) {
              return list[i];
            }
          }
          return null;
        }

        // 清除所有資料夾的懸停高亮
        function clearFolderHover() {
          if (!dockEl) return;
          var list = dockEl.querySelectorAll('.sc-folder.is-over');
          for (var i = 0; i < list.length; i++) list[i].classList.remove('is-over');
        }

        // 將檔案平順彈回原本桌面座標
        function bounceBack(st, markWrong) {
          st.el.classList.remove('is-drag', 'is-selected');
          st.el.classList.add('is-returning');
          if (markWrong) st.el.classList.add('is-wrong');
          st.el.style.left = st.origX + 'px';
          st.el.style.top = st.origY + 'px';
          later(function () {
            if (!st.el) return;
            st.el.classList.remove('is-returning', 'is-wrong');
          }, 360);
        }

        // 計算資料夾中心在桌面邏輯座標中的位置（供飛入動畫使用）
        function folderCenterInDesk(folderEl) {
          var dr = deskEl.getBoundingClientRect();
          var fr = folderEl.getBoundingClientRect();
          var sx = dr.width / SCENE_CONFIG.DESK_W;
          var sy = dr.height / SCENE_CONFIG.DESK_H;
          return {
            x: (fr.left + fr.width / 2 - dr.left) / sx - 67,
            y: (fr.top + fr.height / 2 - dr.top) / sy - 45
          };
        }

        // 嘗試將檔案放進某個資料夾（拖曳放下與點選放入共用）
        function attemptDrop(st, folderEl) {
          if (!alive || !st || st.placed || !folderEl) return;
          var targetKey = folderEl.getAttribute('data-folder');
          var ok = (targetKey === st.data.type);

          if (ok) {
            // 放對了！
            st.placed = true;
            clearSelection();
            placedCount++;
            folderCounts[targetKey] = (folderCounts[targetKey] || 0) + 1;

            // 檔案飛進資料夾動畫
            var dst = folderCenterInDesk(folderEl);
            st.el.classList.remove('is-drag', 'is-selected', 'is-returning', 'is-wrong');
            st.el.classList.add('is-flying');
            st.el.style.left = dst.x + 'px';
            st.el.style.top = dst.y + 'px';
            later(function () {
              if (st.el) st.el.classList.add('is-done');
            }, 280);

            // 更新資料夾計數＋彈出 +1 ✓
            var countEl = folderEl.querySelector('.sc-fcount');
            if (countEl) {
              countEl.textContent = String(folderCounts[targetKey]);
              countEl.classList.add('has-items');
            }
            folderEl.classList.remove('is-ok', 'is-shake');
            void folderEl.offsetWidth;
            folderEl.classList.add('is-ok');
            var plus = document.createElement('span');
            plus.className = 'sc-plus';
            plus.textContent = '+1 ✓';
            folderEl.appendChild(plus);
            later(function () {
              folderEl.classList.remove('is-ok');
              if (plus.parentNode) plus.parentNode.removeChild(plus);
            }, 680);

            // 更新頂欄進度與桌面計數
            var total = items.length;
            api.progress(Math.min(placedCount + 1, total), total);   // 11-21 Claude 改：顯示「正在放第幾個」，不要出現第 0 題
            if (remainNumEl) remainNumEl.textContent = String(total - placedCount);
            if (doneNumEl) doneNumEl.textContent = String(placedCount);

            // 寵物開心稱讚
            if (placedCount === total) {
              setPetState('happy', { spark: true }, '全部整理完畢！<br>桌面變好整齊！', 'ok', 'is-hop');
              later(finishLevel, 720);
            } else if (total - placedCount === 1) {
              setPetState('happy', { spark: true }, '剩最後一個\u{E01E1}，加油！', 'ok', 'is-hop');
            } else {
              var msg = SCENE_CONFIG.PRAISE[praiseIdx % SCENE_CONFIG.PRAISE.length];
              praiseIdx++;
              setPetState('happy', { spark: true }, msg, 'ok', 'is-hop');
            }
          } else {
            // 放錯了：不扣命、不重來，檔案彈回並給一句正確觀念
            mistakes++;
            st.everWrong = true;
            bounceBack(st, true);

            folderEl.classList.remove('is-ok', 'is-shake');
            void folderEl.offsetWidth;
            folderEl.classList.add('is-shake');
            later(function () {
              folderEl.classList.remove('is-shake');
            }, 360);

            var expGroup = SCENE_CONFIG.EXPLAIN[st.data.type];
            var tipHtml = st.data.trap ? expGroup.trap : expGroup.normal;
            setPetState('worried', { sweat: true }, tipHtml, 'bad', 'is-wiggle');
          }
        }

        // 整關整理完成，結算星星與每題回顧
        function finishLevel() {
          if (!alive) return;
          var stars = mistakes <= SCENE_CONFIG.STARS.THREE_MAX_WRONG ? 3
                    : mistakes <= SCENE_CONFIG.STARS.TWO_MAX_WRONG   ? 2 : 1;
          var review = items.map(function (st) {
            return { ok: !st.everWrong, q: st.data.q };
          });
          api.finish({
            stars: stars,
            review: review,
            learned: lvData.learned,
            retry: mistakes > 0 ? '看清楚檔案圖示，再多試幾次喔！' : ''
          });
        }

        /* ----- Pointer Events 拖曳處理（支援舞台等比縮放換算） ----- */
        function onFilePointerDown(e) {
          if (!alive) return;
          if (e.button && e.button !== 0) return;
          var fileEl = e.currentTarget;
          var idx = Number(fileEl.getAttribute('data-idx'));
          var st = items[idx];
          if (!st || st.placed) return;

          e.preventDefault();
          var dr = deskEl.getBoundingClientRect();
          var sx = dr.width / SCENE_CONFIG.DESK_W;
          var sy = dr.height / SCENE_CONFIG.DESK_H;
          var px = (e.clientX - dr.left) / sx;
          var py = (e.clientY - dr.top) / sy;
          var curX = parseFloat(fileEl.style.left) || st.origX;
          var curY = parseFloat(fileEl.style.top) || st.origY;

          drag = {
            idx: idx,
            st: st,
            pointerId: e.pointerId,
            startClientX: e.clientX,
            startClientY: e.clientY,
            offX: px - curX,
            offY: py - curY,
            moved: false
          };

          try { fileEl.setPointerCapture(e.pointerId); } catch (err) {}
        }

        function onFilePointerMove(e) {
          if (!alive || !drag || e.pointerId !== drag.pointerId) return;
          var dx = e.clientX - drag.startClientX;
          var dy = e.clientY - drag.startClientY;

          // 超過 6px 才進入拖曳模式（小於 6px 視為點選輔助）
          if (!drag.moved) {
            if (dx * dx + dy * dy < 36) return;
            drag.moved = true;
            clearSelection();
            drag.st.el.classList.remove('is-returning', 'is-wrong');
            drag.st.el.classList.add('is-drag');
            setPetState('normal', { q: true }, '要放進哪一格？', 'tip');
          }

          var dr = deskEl.getBoundingClientRect();
          var sx = dr.width / SCENE_CONFIG.DESK_W;
          var sy = dr.height / SCENE_CONFIG.DESK_H;
          var nx = (e.clientX - dr.left) / sx - drag.offX;
          var ny = (e.clientY - dr.top) / sy - drag.offY;

          // 限制在桌面範圍內，避免拖出畫面外
          nx = Math.max(-10, Math.min(SCENE_CONFIG.DESK_W - 124, nx));
          ny = Math.max(-10, Math.min(SCENE_CONFIG.DESK_H - 70, ny));
          drag.st.el.style.left = nx + 'px';
          drag.st.el.style.top = ny + 'px';

          clearFolderHover();
          var over = hitFolder(e.clientX, e.clientY);
          if (over) over.classList.add('is-over');
        }

        function onFilePointerUp(e) {
          if (!drag || e.pointerId !== drag.pointerId) return;
          var cur = drag;
          drag = null;

          try { cur.st.el.releasePointerCapture(e.pointerId); } catch (err) {}
          clearFolderHover();
          if (!alive) return;

          if (!cur.moved) {
            // 輕點檔案：切換選取，方便孩子改用點資料夾放入
            selectItem(cur.idx);
            return;
          }

          var targetFolder = hitFolder(e.clientX, e.clientY);
          if (targetFolder) {
            attemptDrop(cur.st, targetFolder);
          } else {
            // 掉在桌面空白處不算錯，溫柔彈回原位
            bounceBack(cur.st, false);
            setPetState('normal', { q: true }, formatSpeech(lvData.intro), 'tip');
          }
        }

        function onFileKeyDown(e) {
          if (!alive) return;
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            var idx = Number(e.currentTarget.getAttribute('data-idx'));
            selectItem(idx);
          }
        }

        // 點選資料夾（搭配點選檔案使用）
        function onFolderClick(e) {
          if (!alive || selectedId === null) return;
          var folderEl = e.currentTarget;
          attemptDrop(items[selectedId], folderEl);
        }

        // 建立整個遊戲場景畫面
        function render() {
          var zyCls = api.zy ? ' sm-zy' : '';
          var total = lvData.items.length;
          var twoCls = lvData.folders.length === 2 ? ' is-two' : '';

          var foldersHtml = lvData.folders.map(function (fkey) {
            var f = SCENE_CONFIG.FOLDERS[fkey];
            return (
              '<button type="button" class="sc-folder" data-folder="' + f.key + '" aria-label="' + f.label + '">' +
                '<span class="sc-fcount sm-num">0</span>' +
                '<div class="sc-folder-ico">' + FOLDER_SVGS[f.key] + '</div>' +
                '<span class="sc-folder-label' + zyCls + '">' + f.label + '</span>' +
              '</button>'
            );
          }).join('');

          var filesHtml = lvData.items.map(function (it, idx) {
            return (
              '<div class="sc-file" role="button" tabindex="0" data-idx="' + idx + '" ' +
                   'style="left:' + it.x + 'px;top:' + it.y + 'px" aria-label="檔案：' + it.q + '">' +
                '<div class="sc-file-ico">' + FILE_SVGS[it.pic] + '</div>' +
                '<span class="sc-file-name">' + it.q + '</span>' +
              '</div>'
            );
          }).join('');

          api.field.innerHTML =
            '<div class="clay sc-monitor">' +
              '<div class="sc-topbar">' +
                '<div class="sc-dots" aria-hidden="true">' +
                  '<span class="sc-dot sc-dot-a"></span>' +
                  '<span class="sc-dot sc-dot-b"></span>' +
                  '<span class="sc-dot sc-dot-c"></span>' +
                '</div>' +
                '<p class="sc-task' + zyCls + '">' + lvData.task + '</p>' +
                '<div class="sc-remain">' +
                  '<span>剩下</span><span class="sm-num" id="sc-remain-num">' + total + '</span><span>個\u{E01E1}</span>' +
                '</div>' +
              '</div>' +
              '<div class="sc-desk">' +
                '<div class="sc-desk-line" aria-hidden="true"></div>' +
                '<div class="sc-dock' + twoCls + '">' + foldersHtml + '</div>' +
                '<div class="sc-files-layer">' + filesHtml + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="sc-petbox">' +
              '<div class="clay sc-bubble"></div>' +
              '<div class="sc-pet-stage">' +
                '<div class="sc-pet-rug" aria-hidden="true"></div>' +
                '<div class="sc-pet"></div>' +
              '</div>' +
              '<div class="clay sc-status">' +
                '<div class="sc-status-row">' +
                  '<span>已放好</span>' +
                  '<span class="sm-num" id="sc-done-num">0</span>' +
                  '<span>／</span>' +
                  '<span class="sm-num">' + total + '</span>' +
                '</div>' +
                '<div class="sc-hint-mini">拖曳檔案進資料夾，也可點選放入</div>' +
              '</div>' +
            '</div>';

          // 綁定 DOM 參考與事件
          deskEl = api.field.querySelector('.sc-desk');
          filesLayerEl = api.field.querySelector('.sc-files-layer');
          dockEl = api.field.querySelector('.sc-dock');
          bubbleEl = api.field.querySelector('.sc-bubble');
          petEl = api.field.querySelector('.sc-pet');
          remainNumEl = api.field.querySelector('#sc-remain-num');
          doneNumEl = api.field.querySelector('#sc-done-num');

          var fileNodes = filesLayerEl.querySelectorAll('.sc-file');
          items = lvData.items.map(function (it, idx) {
            var el = fileNodes[idx];
            el.addEventListener('pointerdown', onFilePointerDown);
            el.addEventListener('pointermove', onFilePointerMove);
            el.addEventListener('pointerup', onFilePointerUp);
            el.addEventListener('pointercancel', onFilePointerUp);
            el.addEventListener('keydown', onFileKeyDown);
            return {
              data: it,
              el: el,
              origX: it.x,
              origY: it.y,
              placed: false,
              everWrong: false
            };
          });

          var folderNodes = dockEl.querySelectorAll('.sc-folder');
          for (var i = 0; i < folderNodes.length; i++) {
            folderNodes[i].addEventListener('click', onFolderClick);
          }

          // 開場寵物情境帶入（ARCS-A 注意）
          setPetState('normal', { q: true }, formatSpeech(lvData.intro), 'tip');
        }

        // 停止場景並清乾淨所有資源
        function stopScene() {
          alive = false;
          clearTimers();
          drag = null;
          selectedId = null;
          items = [];
          folderCounts = {};
          deskEl = filesLayerEl = dockEl = bubbleEl = petEl = remainNumEl = doneNumEl = null;
          api.field.innerHTML = '';
        }

        return {
          start: function (levelIndex) {
            stopScene();
            var idx = (typeof levelIndex === 'number' && SCENE_CONFIG.LEVELS[levelIndex]) ? levelIndex : 0;
            lvData = SCENE_CONFIG.LEVELS[idx];
            alive = true;
            placedCount = 0;
            mistakes = 0;
            praiseIdx = 0;
            folderCounts = {};
            api.progress(1, lvData.items.length);
            render();
          },
          stop: function () {
            stopScene();
          }
        };
      }
    });
  })();
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
</body></html>
