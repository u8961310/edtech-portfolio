    .sc-stage {
      position: relative;
      width: 1366px;
      height: 591px;
      overflow: hidden;
      user-select: none;
    }

    /* 題目卡（第 1、2 關） */
    .sc-q {
      position: absolute;
      left: 32px;
      top: 22px;
      width: 910px;
      height: 116px;
      padding: 0 26px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-sizing: border-box;
    }
    .sc-q-num {
      flex: 0 0 auto;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--violet);
      color: #fff;
      font: 800 26px/54px var(--f-num);
      text-align: center;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .18);
    }
    .sc-q-text {
      margin: 0;
      font-size: 36px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.3;
      white-space: nowrap;
    }

    /* 第 3 關題目卡（配合上方時間軸縮緊高度） */
    .sc-q-compact {
      top: 192px;
      height: 92px;
    }
    .sc-q-compact .sc-q-text {
      font-size: 33px;
    }

    /* 第 3 關：寵物的一天時間軸卡片 */
    .sc-timeline {
      position: absolute;
      left: 32px;
      top: 16px;
      width: 910px;
      height: 160px;
      padding: 14px 20px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .sc-slot {
      flex: 1;
      height: 126px;
      border-radius: 20px;
      background: var(--bg);
      border: 3px solid var(--edge);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 8px;
      box-sizing: border-box;
      position: relative;
    }
    .sc-slot-focus {
      background: var(--butter);
      border-color: var(--orange);
      box-shadow: 0 6px 0 rgba(255, 143, 63, .28);
      transform: translateY(-3px);
    }
    .sc-slot-time {
      font-size: 16px;
      font-weight: 900;
      color: var(--ink2);
      background: #fff;
      border: 2px solid var(--edge);
      border-radius: 999px;
      padding: 1px 12px;
      line-height: 1.45;
      white-space: nowrap;
    }
    .sc-slot-focus .sc-slot-time {
      background: var(--orange);
      border-color: var(--orange-d);
      color: var(--ink);
    }
    .sc-slot-ic {
      width: 52px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sc-slot-ic svg {
      width: 100%;
      height: 100%;
    }
    .sc-slot-act {
      font-size: 20px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.3;
      white-space: nowrap;
    }
    .sc-arrow {
      flex: 0 0 22px;
      width: 22px;
      height: 22px;
      opacity: .75;
    }

    /* 選項列（3 選 1，第 1、2 關） */
    .sc-opts {
      position: absolute;
      left: 32px;
      top: 158px;
      width: 910px;
      height: 400px;
      display: flex;
      gap: 20px;
    }
    /* 第 3 關選項列 */
    .sc-opts-t {
      top: 302px;
      height: 258px;
    }

    /* 3 選 1 圖文選項卡（每張 290×400 或 290×258，皆大於 200×160） */
    .sc-opt {
      flex: 1;
      height: 100%;
      position: relative;
      padding: 18px 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      cursor: pointer;
      color: var(--ink);
      box-sizing: border-box;
      transition: transform .18s ease-out, border-color .18s ease-out, background-color .18s ease-out;
    }
    .sc-opt:hover:not(:disabled) {
      transform: translateY(-4px);
      border-color: var(--orange);
    }
    .sc-opt:active:not(:disabled) {
      transform: translateY(2px);
    }
    .sc-opt:focus-visible {
      outline: 4px solid var(--violet);
      outline-offset: 3px;
    }
    .sc-opt:disabled {
      cursor: default;
    }
    .sc-opt-tag {
      position: absolute;
      left: 14px;
      top: 14px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--violet);
      color: #fff;
      font: 800 22px/44px var(--f-num);
      text-align: center;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18);
    }
    .sc-opt-pic {
      width: 244px;
      height: 214px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sc-opt-pic svg {
      width: 100%;
      height: 100%;
    }
    .sc-opts-t .sc-opt {
      padding: 14px 10px 12px;
      gap: 8px;
    }
    .sc-opts-t .sc-opt-pic {
      width: 196px;
      height: 146px;
    }
    .sc-opt-txt {
      font-size: 24px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.35;
      text-align: center;
      white-space: nowrap;
    }

    /* 第 3 關 2 選 1 超大判斷按鈕（好／不好） */
    .sc-yn {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;
      color: var(--ink);
      padding: 20px;
      box-sizing: border-box;
      transition: transform .18s ease-out, border-color .18s ease-out, background-color .18s ease-out;
    }
    .sc-yn:hover:not(:disabled) {
      transform: translateY(-4px);
    }
    .sc-yn:active:not(:disabled) {
      transform: translateY(2px);
    }
    .sc-yn:focus-visible {
      outline: 4px solid var(--violet);
      outline-offset: 3px;
    }
    .sc-yn:disabled {
      cursor: default;
    }
    .sc-yn-good:hover:not(:disabled) {
      border-color: var(--ok);
      background: var(--ok-soft);
    }
    .sc-yn-bad:hover:not(:disabled) {
      border-color: var(--bad);
      background: var(--bad-soft);
    }
    .sc-yn-badge {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid transparent;
    }
    .sc-yn-good .sc-yn-badge {
      background: var(--ok-soft);
      border-color: var(--ok);
    }
    .sc-yn-bad .sc-yn-badge {
      background: var(--bad-soft);
      border-color: var(--bad);
    }
    .sc-yn-badge svg {
      width: 56px;
      height: 56px;
    }
    .sc-yn-txt {
      font-size: 36px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.3;
      white-space: nowrap;
    }

    /* 作答瞬間回饋樣式（僅短暫提示，不連續閃爍） */
    .sc-picked-ok {
      border-color: var(--ok) !important;
      background: var(--ok-soft) !important;
      animation: sc-pop .26s ease-out;
    }
    .sc-picked-bad {
      border-color: var(--bad) !important;
      background: var(--bad-soft) !important;
      animation: sc-shake .28s ease-out;
    }
    @keyframes sc-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    @keyframes sc-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .sc-petbox {
      position: absolute;
      left: 970px;
      top: 22px;
      width: 364px;
      height: 536px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      box-sizing: border-box;
    }
    .sc-level-chip {
      position: absolute;
      top: 0;
      right: 4px;
      background: var(--lilac);
      border: 3px solid var(--edge);
      color: var(--ink);
      font-size: 18px;
      font-weight: 900;
      padding: 6px 16px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .sc-bubble {
      position: relative;
      max-width: 356px;
      padding: 14px 20px;
      font-size: 24px;
      font-weight: 900;
      color: var(--ink);
      text-align: center;
      line-height: 1.35;
      white-space: nowrap;
    }
    .sc-bubble::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -14px;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 14px solid var(--edge);
    }
    .sc-bubble::before {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -10px;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 11px solid var(--card);
      z-index: 1;
    }
    .sc-pet {
      width: 292px;
      height: 292px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sc-pet svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .sc-pet-name {
      padding: 6px 22px;
      border-radius: 999px;
      background: var(--card);
      border: 3px solid var(--edge);
      font-size: 20px;
      font-weight: 900;
      color: var(--ink);
      white-space: nowrap;
      box-shadow: 0 4px 0 var(--edge);
    }

    /* 護眼與動態偏好設定 */
    @media (prefers-reduced-motion: reduce) {
      .sc-opt, .sc-yn, .sc-picked-ok, .sc-picked-bad {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>

      tlNightTab: '<svg viewBox="0 0 52 46" fill="none">' +
        '<path d="M14 8a10 10 0 1 0 9 14 8 8 0 1 1-9-14z" fill="#FFD65E" ' + S3 + '/>' +
        '<rect x="24" y="14" width="22" height="26" rx="4" fill="#6A45C9" ' + S3 + '/>' +
        '<rect x="28" y="18" width="14" height="18" rx="1.5" fill="#9BE3FF"/>' +
      '</svg>',

      tlTabOk: '<svg viewBox="0 0 52 46" fill="none">' +
        '<rect x="12" y="8" width="28" height="30" rx="5" fill="#6A45C9" ' + S3 + '/>' +
        '<rect x="16" y="12" width="20" height="22" rx="2" fill="#E1EEFB"/>' +
      '</svg>',

      tlQ: '<svg viewBox="0 0 52 46" fill="none">' +
        '<circle cx="26" cy="23" r="16" fill="#FF8F3F" ' + S3 + '/>' +
        '<text x="26" y="31" text-anchor="middle" font-size="24" font-weight="900" fill="#3B2350">?</text>' +
      '</svg>',

      // 通用圖示：箭頭、✓、✗
      arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="#5C4870" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
      check: '<svg viewBox="0 0 56 56" fill="none" stroke="#186B41" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 29l11 11 21-24"/></svg>',
      cross: '<svg viewBox="0 0 56 56" fill="none" stroke="#B4372B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16l24 24M40 16L16 40"/></svg>'
    };

    /* =====================================================================
       3. 掛載共用外殼與場景主邏輯
       ===================================================================== */
    SmartIsland.mount({
      unit: 30,
      title: '寵物作息表',
      grade: '1–2 年級',
      zhuyin: true,
      howto: '幫寵物排好一天，用平板也要愛護眼睛！',
      teach: '健康使用 3C：坐姿、護眼、作息｜資E11 建立康健的數位使用習慣與態度',
      levels: SCENE_CONFIG.LEVELS.map(function (lv, idx) {
        return { name: lv.name, icon: SCENE_CONFIG.LEVEL_ICONS[idx] };
      }),

      scene: function (api) {
        var alive = false;
        var runId = 0;       // 防止舊的 async 回呼跨關干擾
        var lvIdx = 0;
        var qIdx = 0;
        var locked = false;
        var review = [];
        var timers = [];

        // 註冊可統一清除的計時器
        function addTimer(fn, ms) {
          var id = setTimeout(function () {
            timers = timers.filter(function (t) { return t !== id; });
            fn();
          }, ms);
          timers.push(id);
          return id;
        }

        function clearTimers() {
          for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
          timers = [];
        }

        // 把台詞中的 {pet} 替換成孩子的寵物名字
        function formatBubble(tpl) {
          var petInfo = api.pet();
          var petName = (petInfo && petInfo.name) ? petInfo.name : '小雲';
          return tpl.replace(/\{pet\}/g, petName);
        }

        // 依答對數換算星星數（5→3、3–4→2、0–2→1）
        function calcStars(rightCount) {
          if (rightCount >= SCENE_CONFIG.STARS.three) return 3;
          if (rightCount >= SCENE_CONFIG.STARS.two) return 2;
          return 1;
        }

        // 繪製第 3 關時間軸 HTML
        function renderTimeline(slots) {
          var zyCls = api.zy ? ' sm-zy' : '';
          var html = '<div class="clay sc-timeline" aria-label="寵物的一天時間表">';
          for (var i = 0; i < slots.length; i++) {
            var sl = slots[i];
            if (i > 0) html += '<span class="sc-arrow" aria-hidden="true">' + PIC.arrow + '</span>';
            html += '<div class="sc-slot' + (sl.focus ? ' sc-slot-focus' : '') + '">' +
              '<span class="sc-slot-time' + zyCls + '">' + sl.time + '</span>' +
              '<div class="sc-slot-ic" aria-hidden="true">' + (PIC[sl.ic] || '') + '</div>' +
              '<span class="sc-slot-act' + zyCls + '">' + sl.act + '</span>' +
            '</div>';
          }
          html += '</div>';
          return html;
        }

        // 繪製選項區 HTML（支援 3 選 1 圖文卡 與 2 選 1 好／不好按鈕）
        function renderOptions(qObj, isTimeline) {
          var zyCls = api.zy ? ' sm-zy' : '';
          var wrapCls = 'sc-opts' + (isTimeline ? ' sc-opts-t' : '');

          if (qObj.kind === 'yn') {
            return '<div class="' + wrapCls + '">' +
              qObj.options.map(function (opt, idx) {
                var isGood = idx === 0;
                return '<button type="button" class="clay sc-yn ' + (isGood ? 'sc-yn-good' : 'sc-yn-bad') + '" data-idx="' + idx + '">' +
                  '<span class="sc-yn-badge" aria-hidden="true">' + (isGood ? PIC.check : PIC.cross) + '</span>' +
                  '<span class="sc-yn-txt' + zyCls + '">' + opt.text + '</span>' +
                '</button>';
              }).join('') +
            '</div>';
          }

          return '<div class="' + wrapCls + '">' +
            qObj.options.map(function (opt, idx) {
              return '<button type="button" class="clay sc-opt" data-idx="' + idx + '">' +
                '<span class="sc-opt-tag">' + (idx + 1) + '</span>' +
                '<div class="sc-opt-pic" aria-hidden="true">' + (PIC[opt.pic] || '') + '</div>' +
                '<span class="sc-opt-txt' + zyCls + '">' + opt.text + '</span>' +
              '</button>';
            }).join('') +
          '</div>';
        }

        // 出目前這一題
        function renderQuestion() {
          if (!alive) return;
          var level = SCENE_CONFIG.LEVELS[lvIdx];
          var qObj = level.questions[qIdx];
          var zyCls = api.zy ? ' sm-zy' : '';
          var isTimeline = level.mode === 'timeline';
          var petInfo = api.pet();
          var petName = (petInfo && petInfo.name) ? petInfo.name : '小雲';

          locked = false;
          api.progress(qIdx + 1, level.questions.length);

          api.field.innerHTML =
            '<div class="sc-stage">' +
              (isTimeline ? renderTimeline(qObj.timeline) : '') +
              '<div class="clay sc-q' + (isTimeline ? ' sc-q-compact' : '') + '">' +
                '<span class="sc-q-num" aria-hidden="true">' + (qIdx + 1) + '</span>' +
                '<p class="sc-q-text' + zyCls + '">' + qObj.q + '</p>' +
              '</div>' +
              renderOptions(qObj, isTimeline) +
              '<div class="sc-petbox">' +
                '<div class="sc-level-chip">' + level.name + '</div>' +
                '<div class="clay sc-bubble' + zyCls + '">' + formatBubble(qObj.bubble) + '</div>' +
                '<div class="sc-pet" id="sc-pet-slot">' + api.petSVG('normal', { q: true }) + '</div>' +
                '<div class="sc-pet-name' + zyCls + '">' + petName + '</div>' +
              '</div>' +
            '</div>';
        }

        // 處理作答點擊（寬鬆過關：對錯皆往前進入下一題）
        function handlePick(e) {
          if (!alive || locked) return;
          var btn = e.target.closest('.sc-opt, .sc-yn');
          if (!btn || !api.field.contains(btn)) return;

          locked = true;
          var myRun = runId;
          var picked = parseInt(btn.getAttribute('data-idx'), 10);
          var level = SCENE_CONFIG.LEVELS[lvIdx];
          var qObj = level.questions[qIdx];
          var ok = picked === qObj.ans;

          // 立刻鎖定所有選項避免連點兩次
          var allBtns = api.field.querySelectorAll('.sc-opt, .sc-yn');
          for (var i = 0; i < allBtns.length; i++) allBtns[i].disabled = true;

          // 視覺回饋：卡片高亮＋右側寵物表情切換
          btn.classList.add(ok ? 'sc-picked-ok' : 'sc-picked-bad');
          var petSlot = api.field.querySelector('#sc-pet-slot');
          if (petSlot) {
            petSlot.innerHTML = ok
              ? api.petSVG('happy', { spark: true })
              : api.petSVG('worried', { sweat: true });
          }

          review.push({ ok: ok, q: qObj.q });

          // 短暫呈現寵物表情後叫出共用回饋卡
          addTimer(function () {
            if (!alive || myRun !== runId) return;
            api.feedback({
              ok: ok,
              explain: ok ? qObj.praise : qObj.explain,
              zyExplain: true
            }).then(function () {
              if (!alive || myRun !== runId) return;
              qIdx++;
              if (qIdx < level.questions.length) {
                renderQuestion();
                return;
              }
              var right = review.filter(function (r) { return r.ok; }).length;
              api.finish({
                stars: calcStars(right),
                review: review,
                learned: level.learned,
                retry: right < level.questions.length ? level.retry : ''
              });
            });
          }, 260);
        }

        return {
          start: function (levelIndex) {
            clearTimers();
            runId++;
            alive = true;
            lvIdx = (typeof levelIndex === 'number' && SCENE_CONFIG.LEVELS[levelIndex]) ? levelIndex : 0;
            qIdx = 0;
            locked = false;
            review = [];
            api.field.innerHTML = '';
            api.field.onclick = handlePick;
            renderQuestion();
          },
          stop: function () {
            alive = false;
            runId++;
            locked = true;
            clearTimers();
            api.field.onclick = null;
          }
        };
      }
    });
  })();
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
</body></html>
