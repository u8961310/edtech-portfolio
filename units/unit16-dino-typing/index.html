    <style>
        body {
            font-family: 'Quicksand', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #111827 0%, #311042 100%);
            overflow-x: hidden;
        }

        /* 跑酷舞台背景滾動動畫 */
        .scrolling-bg {
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: bottom;
            animation: scrollBg 25s linear infinite;
        }
        @keyframes scrollBg {
            0% { background-position-x: 0px; }
            100% { background-position-x: -1200px; }
        }

        /* 恐龍動畫 */
        .dino-run {
            animation: dinoBob 0.4s infinite alternate;
        }
        @keyframes dinoBob {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-6px) rotate(2deg); }
        }
        .dino-jump {
            animation: dinoJump 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes dinoJump {
            0% { transform: translateY(0px) scaleY(0.9); }
            40% { transform: translateY(-110px) rotate(-10deg) scaleY(1.1); }
            70% { transform: translateY(-110px) rotate(-5deg); }
            100% { transform: translateY(0px) scaleY(1); }
        }
        .dino-hurt {
            animation: dinoHurt 0.5s ease-out;
        }
        @keyframes dinoHurt {
            0% { transform: translateX(0px) rotate(0deg); filter: cubic-bezier(0.1, 0.8, 0.3, 1) invert(30%) sepia(80%) saturate(500%) hue-rotate(350deg); }
            20% { transform: translateX(-20px) rotate(-15deg); }
            40% { transform: translateX(10px) rotate(10deg); }
            60% { transform: translateX(-10px) rotate(-5deg); }
            100% { transform: translateX(0px) rotate(0deg); filter: none; }
        }

        /* 彩虹無敵狀態狂暴效果 */
        .rainbow-fever {
            animation: feverRainbow 0.5s linear infinite alternate, dinoBob 0.2s infinite alternate;
            filter: drop-shadow(0 0 15px #f43f5e) drop-shadow(0 0 25px #eab308);
        }
        @keyframes feverRainbow {
            0% { border-color: #f43f5e; }
            50% { border-color: #eab308; }
            100% { border-color: #3b82f6; }
        }

        /* 火球法術軌跡 */
        .fireball {
            animation: spin 0.3s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* 鍵盤指法色彩 */
        .finger-l-pinky { background-color: #ffe4e6; border-color: #fda4af; color: #9f1239; }
        .finger-l-ring { background-color: #ffedd5; border-color: #fed7aa; color: #9a3412; }
        .finger-l-middle { background-color: #fef9c3; border-color: #fef08a; color: #854d0e; }
        .finger-l-index { background-color: #dcfce7; border-color: #bbf7d0; color: #166534; }
        .finger-r-index { background-color: #e0f2fe; border-color: #bae6fd; color: #075985; }
        .finger-r-middle { background-color: #e0e7ff; border-color: #c7d2fe; color: #3730a3; }
        .finger-r-ring { background-color: #f3e8ff; border-color: #e9d5ff; color: #6b21a8; }
        .finger-r-pinky { background-color: #fae8ff; border-color: #f5d0fe; color: #86198f; }
        .finger-thumb { background-color: #f1f5f9; border-color: #e2e8f0; color: #475569; }

        /* 提示按鍵發光 */

            stroke: #f59e0b !important;
            filter: drop-shadow(0px 0px 10px #fbbf24);

    <script>
        // 音效系統 (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let soundEnabled = true;

        function playSound(freq, type, duration, volume = 0.15) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (err) {
                console.log("Audio feedback pending user action.", err);
            }
        }

        const audioBank = {
            jump: () => { playSound(220, 'sine', 0.1); setTimeout(() => playSound(440, 'sine', 0.2), 60); },
            shoot: () => { playSound(680, 'triangle', 0.15); playSound(380, 'sawtooth', 0.1, 0.08); },
            eat: () => { playSound(800, 'sine', 0.08); setTimeout(() => playSound(1200, 'sine', 0.1), 50); },
            hit: () => { playSound(150, 'sawtooth', 0.3, 0.2); },
            fever: () => { 
                playSound(523, 'triangle', 0.2);
                setTimeout(() => playSound(659, 'triangle', 0.2), 150);
                setTimeout(() => playSound(784, 'triangle', 0.4), 300);
            }
        };

        function speakText(text, lang = 'zh-TW') {
            if (!soundEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 鍵盤佈局定義與分區數據
        const keyboardData = [
            [
                { key: '1', zh: 'ㄅ', finger: 'finger-l-pinky', hand: 'finger-l-pinky' },
                { key: '2', zh: 'ㄉ', finger: 'finger-l-ring', hand: 'finger-l-ring' },
                { key: '3', zh: 'ˇ', finger: 'finger-l-middle', hand: 'finger-l-middle' },
                { key: '4', zh: 'ˋ', finger: 'finger-l-index', hand: 'finger-l-index' },
                { key: '5', zh: 'ㄓ', finger: 'finger-l-index', hand: 'finger-l-index' },
                { key: '6', zh: 'ˊ', finger: 'finger-r-index', hand: 'finger-r-index' },
                { key: '7', zh: '˙', finger: 'finger-r-index', hand: 'finger-r-index' },
                { key: '8', zh: 'ㄚ', finger: 'finger-r-middle', hand: 'finger-r-middle' },
                { key: '9', zh: 'ㄞ', finger: 'finger-r-ring', hand: 'finger-r-ring' },
                { key: '0', zh: 'ㄢ', finger: 'finger-r-pinky', hand: 'finger-r-pinky' },
                { key: '-', zh: 'ㄦ', finger: 'finger-r-pinky', hand: 'finger-r-pinky' }
            ],
            [
                { key: 'Q', zh: 'ㄆ', finger: 'finger-l-pinky', hand: 'finger-l-pinky' },
                { key: 'W', zh: 'ㄊ', finger: 'finger-l-ring', hand: 'finger-l-ring' },
                { key: 'E', zh: 'ㄍ', finger: 'finger-l-middle', hand: 'finger-l-middle' },
                { key: 'R', zh: 'ㄐ', finger: 'finger-l-index', hand: 'finger-l-index' },
                { key: 'T', zh: 'ㄔ', finger: 'finger-l-index', hand: 'finger-l-index' },
                { key: 'Y', zh: 'ㄗ', finger: 'finger-r-index', hand: 'finger-r-index' },
                { key: 'U', zh: 'ㄧ', finger: 'finger-r-index', hand: 'finger-r-index' },
                { key: 'I', zh: 'ㄛ', finger: 'finger-r-middle', hand: 'finger-r-middle' },
                { key: 'O', zh: 'ㄟ', finger: 'finger-r-ring', hand: 'finger-r-ring' },
                { key: 'P', zh: 'ㄣ', finger: 'finger-r-pinky', hand: 'finger-r-pinky' }
            ],
            [
                { key: 'A', zh: 'ㄇ', finger: 'finger-l-pinky', hand: 'finger-l-pinky' },
                { key: 'S', zh: 'ㄋ', finger: 'finger-l-ring', hand: 'finger-l-ring' },
                { key: 'D', zh: 'ㄎ', finger: 'finger-l-middle', hand: 'finger-l-middle' },
                { key: 'F', zh: 'ㄑ', finger: 'finger-l-index', hand: 'finger-l-index' },
                { key: 'G', zh: 'ㄕ', finger: 'finger-l-index', hand: 'finger-l-index' },
                { key: 'H', zh: 'ㄘ', finger: 'finger-r-index', hand: 'finger-r-index' },
                { key: 'J', zh: 'ㄨ', finger: 'finger-r-index', hand: 'finger-r-index' },
                { key: 'K', zh: 'ㄜ', finger: 'finger-r-middle', hand: 'finger-r-middle' },
                { key: 'L', zh: 'ㄠ', finger: 'finger-r-ring', hand: 'finger-r-ring' },
                { key: ';', zh: 'ㄤ', finger: 'finger-r-pinky', hand: 'finger-r-pinky' }
            ],
            [
                { key: 'Z', zh: 'ㄈ', finger: 'finger-l-pinky', hand: 'finger-l-pinky' },
                { key: 'X', zh: 'ㄌ', finger: 'finger-l-ring', hand: 'finger-l-ring' },
                { key: 'C', zh: 'ㄏ', finger: 'finger-l-middle', hand: 'finger-l-middle' },
                { key: 'V', zh: 'ㄒ', finger: 'finger-l-index', hand: 'finger-l-index' },
                { key: 'B', zh: 'ㄖ', finger: 'finger-l-index', hand: 'finger-l-index' },
                { key: 'N', zh: 'ㄙ', finger: 'finger-r-index', hand: 'finger-r-index' },
                { key: 'M', zh: 'ㄩ', finger: 'finger-r-index', hand: 'finger-r-index' },
                { key: ',', zh: 'ㄝ', finger: 'finger-r-middle', hand: 'finger-r-middle' },
                { key: '.', zh: 'ㄡ', finger: 'finger-r-ring', hand: 'finger-r-ring' },
                { key: '/', zh: 'ㄥ', finger: 'finger-r-pinky', hand: 'finger-r-pinky' }
            ]
        ];

        const keyMapDict = {};
        const zhuyinToEngDict = {};

        // 渲染底下的發光虛擬鍵盤
        function renderKeyboard() {
            for (let r = 0; r < 4; r++) {
                const rowEl = document.getElementById(`keyboard-row-${r + 1}`);
                rowEl.innerHTML = '';
                keyboardData[r].forEach(btn => {
                    const keyDiv = document.createElement('div');
                    keyDiv.id = `key-dom-${btn.key}`;
                    keyDiv.className = `key ${btn.finger} w-8 h-9 md:w-11 md:h-10 rounded-lg flex flex-col items-center justify-center font-bold border-2 shadow-md transition-all duration-150 cursor-pointer text-xs`;
                    
                    rowEl.appendChild(keyDiv);
                    keyMapDict[btn.key] = keyDiv;
                    zhuyinToEngDict[btn.zh] = btn.key;
                });
            }
            updateKeyboardLabels();
        }

        let appConfig = {
            lang: 'ZH', 
            difficulty: 'easy',
            unlockedSkins: ['trex'],
            currentSkin: 'trex'
        };

        const skins = {
            trex: { emoji: '🦖', name: '霸王綠龍', cost: 0 },
            tricera: { emoji: '🦕', name: '粉紅三角龍', cost: 30 },
            stego: { emoji: '🐉', name: '星際機械龍', cost: 80 }
        };

        let gameState = {
            score: 0,
            combo: 0,
            shields: 3,
            isActive: false,
            feverVal: 0,      // 0 到 100
            isFever: false,
            feverTimer: null,
            spawnTimer: null,
            animationFrameId: null,
            items: [],        // 當前舞台的所有元素
            gameSpeed: 4,     // 跑酷橫向速度
            lastSpawnTime: 0
        };

        // 依語言與鍵盤配置更新鍵盤貼紙
        function updateKeyboardLabels() {
            for (let r = 0; r < 4; r++) {
                keyboardData[r].forEach(btn => {
                    const el = keyMapDict[btn.key];
                    if (el) {
                        if (appConfig.lang === 'ZH') {
                            el.innerHTML = `
                                <span class="text-slate-400 text-[8px] leading-none">${btn.key}</span>
                                <span class="text-base font-black leading-none mt-0.5">${btn.zh}</span>
                            `;
                        } else {
                            el.innerHTML = `
                                <span class="text-base font-black leading-none">${btn.key}</span>
                                <span class="text-slate-400 text-[8px] leading-none mt-0.5">${btn.zh}</span>
                            `;
                        }
                    }
                });
            }
        }

        function changeLanguage(lang) {
            appConfig.lang = lang;
            updateKeyboardLabels();
            clearFingerGuides();
            updateTargetGuide();
        }

        function setDifficulty(diff) {
            appConfig.difficulty = diff;
            ['easy', 'medium', 'hard'].forEach(d => {
                document.getElementById(`diff-${d}`).className = d === diff ? 
                    'px-4 py-2 bg-emerald-600 border border-emerald-400 text-white font-bold rounded-xl text-xs transition' : 
                    'px-4 py-2 bg-slate-700 text-slate-400 rounded-xl text-xs transition';
            });
        }

        // 皮膚商城交互
        function selectSkin(skinId) {
            if (skinId === 'tricera' && !appConfig.unlockedSkins.includes('tricera')) {
                if (gameState.score >= 30) {
                    gameState.score -= 30;
                    appConfig.unlockedSkins.push('tricera');
                    document.getElementById('score').innerText = gameState.score;
                    document.getElementById('skin-tricera').querySelector('span:last-child').innerHTML = '<span class="text-emerald-400">已擁有</span>';
                    document.getElementById('skin-tricera').classList.remove('opacity-70');
                } else {
                    alert("不夠金幣解鎖粉紅三角龍喔！快去冒險跑酷賺取吧！✨");
                    return;
                }
            }
            if (skinId === 'stego' && !appConfig.unlockedSkins.includes('stego')) {
                if (gameState.score >= 80) {
                    gameState.score -= 80;
                    appConfig.unlockedSkins.push('stego');
                    document.getElementById('score').innerText = gameState.score;
                    document.getElementById('skin-stego').querySelector('span:last-child').innerHTML = '<span class="text-emerald-400">已擁有</span>';
                    document.getElementById('skin-stego').classList.remove('opacity-70');
                } else {
                    alert("不夠金幣解鎖星際機械龍喔！快去挑戰狂暴模式吧！✨");
                    return;
                }
            }

            appConfig.currentSkin = skinId;
            document.getElementById('dino-character').innerText = skins[skinId].emoji;

            // 切換邊框高亮
            ['trex', 'tricera', 'stego'].forEach(s => {
                const btn = document.getElementById(`skin-${s}`);
                if (s === skinId) {
                    btn.classList.add('border-emerald-400', 'scale-105', 'bg-emerald-900/60');
                } else {
                    btn.classList.remove('border-emerald-400', 'scale-105', 'bg-emerald-900/60');
                    btn.classList.add('border-transparent');
                }
            });
        }

        function clearFingerGuides() {
            Object.values(keyMapDict).forEach(el => el.classList.remove('key-active-highlight'));
            document.getElementById('key-space').classList.remove('key-active-highlight');
            document.querySelectorAll('svg path').forEach(path => path.classList.remove('finger-glow'));
        }

        // 高亮提示下一個打擊按鍵與手指
        function highlightFinger(char) {
            clearFingerGuides();
            if (!char) return;

            let physicalKey = char.toUpperCase();
            if (appConfig.lang === 'ZH' && zhuyinToEngDict[char]) {
                physicalKey = zhuyinToEngDict[char];
            }

            const keyDom = keyMapDict[physicalKey];
            if (keyDom) {
                keyDom.classList.add('key-active-highlight');
                
                if (document.getElementById('toggle-finger-guide').checked) {
                    // 尋找關聯手指
                    let fingerId = null;
                    for (let r = 0; r < 4; r++) {
                        const match = keyboardData[r].find(btn => btn.key === physicalKey);
                        if (match) {
                            fingerId = match.hand;
                            break;
                        }
                    }
                    if (fingerId) {
                        const path = document.getElementById(fingerId);
                        if (path) path.classList.add('finger-glow');
                    }
                }
            }
        }

        function startAdventure() {
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('adventure-stage').classList.remove('hidden');
            document.getElementById('btn-back').classList.remove('hidden');

            gameState.isActive = true;
            gameState.shields = 3;
            gameState.feverVal = 0;
            gameState.isFever = false;
            gameState.items = [];
            gameState.combo = 0;
            
            // 根據難度設定初始速度
            gameState.gameSpeed = appConfig.difficulty === 'easy' ? 3.5 : appConfig.difficulty === 'medium' ? 5.5 : 7.5;
            
            updateShieldDisplay();
            updateScoreUI();
            
            document.getElementById('dino-character').innerText = skins[appConfig.currentSkin].emoji;
            document.getElementById('dino-character').className = "text-7xl md:text-8xl dino-run select-none drop-shadow-lg";

            // 清除舞台
            document.getElementById('stage-items').innerHTML = '';
            document.getElementById('fx-layer').innerHTML = '';

            // 開始定時生成怪物/障礙與水果金幣
            gameState.lastSpawnTime = Date.now();
            
            // 執行主遊戲動畫幀
            if (gameState.animationFrameId) cancelAnimationFrame(gameState.animationFrameId);
            gameLoop();
        }

        function updateShieldDisplay() {
            let hStr = '';
            for (let i = 0; i < gameState.shields; i++) {
                hStr += '❤️ ';
            }
            if (gameState.shields === 0) hStr = '💀 虛弱';
            document.getElementById('heart-container').innerText = hStr;
        }

        function updateScoreUI() {
            document.getElementById('score').innerText = gameState.score;
            document.getElementById('fever-gauge').style.width = `${gameState.feverVal}%`;

            if (gameState.combo > 2) {
                document.getElementById('combo-container').classList.remove('hidden');
                document.getElementById('combo').innerText = gameState.combo;
            } else {
                document.getElementById('combo-container').classList.add('hidden');
            }
        }

        // 隨機選字
        function getRandomTargetChar() {
            if (appConfig.lang === 'ZH') {
                const list = 'ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ';
                return list[Math.floor(Math.random() * list.length)];
            } else {
                const list = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                return list[Math.floor(Math.random() * list.length)];
            }
        }

        const OBSTACLE_EMOJIS = ['🌵', '🌋', '👾', '🕷️', '🦇'];
        const FOOD_EMOJIS = ['🍓', '🍏', '🍌', '🍒', '🌟', '🍩'];

        function spawnItem() {
            if (!gameState.isActive) return;
            
            const isObstacle = Math.random() < 0.6; // 60% 機率是怪獸/障礙物，40% 是好吃的食物
            const char = getRandomTargetChar();
            const emoji = isObstacle ? OBSTACLE_EMOJIS[Math.floor(Math.random() * OBSTACLE_EMOJIS.length)] : FOOD_EMOJIS[Math.floor(Math.random() * FOOD_EMOJIS.length)];

            // 隨機高度：地面(跳躍避開) 或 空中(噴火球/高跳)
            const isAir = isObstacle ? (Math.random() < 0.5) : (Math.random() < 0.7);
            const bottomVal = isAir ? (90 + Math.random() * 50) : 64; // 像素單位

            const itemObj = {
                id: 'item-' + Date.now() + Math.floor(Math.random()*100),
                char: char,
                emoji: emoji,
                isObstacle: isObstacle,
                isAir: isAir,
                x: 900, // 初始位於舞台最右側
                bottom: bottomVal,
                dom: null,
                cleared: false
            };

            // 建立 DOM
            const div = document.createElement('div');
            div.id = itemObj.id;
            div.className = "absolute flex flex-col items-center justify-center transition-transform pointer-events-none";
            div.style.bottom = `${itemObj.bottom}px`;
            div.style.left = `${itemObj.x}px`;

            // 超亮眼圓泡泡文字標籤，讓一二年級小朋友一眼看清
            const labelBorder = isObstacle ? 'border-red-500 bg-red-950/90 text-red-200' : 'border-amber-400 bg-amber-950/90 text-amber-200';
            div.innerHTML = `
                <div class="relative flex items-center justify-center mb-1">
                    <span class="text-4xl md:text-5xl select-none filter drop-shadow-md">${emoji}</span>
                </div>
                <div class="px-2.5 py-0.5 rounded-full border-2 ${labelBorder} text-lg font-black font-['Fredoka_One'] shadow-lg tracking-wider animate-pulse">
                    ${char}
                </div>
            `;

            document.getElementById('stage-items').appendChild(div);
            itemObj.dom = div;
            gameState.items.push(itemObj);

            // 當生成新元素時，若當前需要指引，立即引導
            updateTargetGuide();
        }

        function gameLoop() {
            if (!gameState.isActive) return;

            const now = Date.now();
            // 每隔特定時間生成一隻，難度越高、生得越頻繁
            const spawnInterval = appConfig.difficulty === 'easy' ? 3200 : appConfig.difficulty === 'medium' ? 2400 : 1600;
            if (now - gameState.lastSpawnTime > spawnInterval) {
                spawnItem();
                gameState.lastSpawnTime = now;
            }

            const dinoEl = document.getElementById('dino-container');
            const dinoWidth = dinoEl.offsetWidth;
            const dinoX = 48; // 固定在左邊
            
            // 逐一更新物件位置
            for (let i = gameState.items.length - 1; i >= 0; i--) {
                const item = gameState.items[i];
                item.x -= gameState.gameSpeed;
                
                if (item.dom) {
                    item.dom.style.left = `${item.x}px`;
                }

                // 碰撞判定 (當物體滾動到恐龍的身前 48px ~ 130px 範圍時)
                if (!item.cleared && item.x < (dinoX + 60) && item.x > dinoX) {
                    // 若是障礙物且恐龍沒有在跳躍(地面的障礙) or 恐龍來不及消滅空中的
                    let hit = false;
                    
                    if (item.isObstacle) {
                        if (!item.isAir) {
                            // 地面障礙：如果恐龍此時沒有進行 jump 動畫，則被撞擊
                            const characterEl = document.getElementById('dino-character');
                            if (!characterEl.classList.contains('dino-jump')) {
                                hit = true;
                            }
                        } else {
                            // 空中怪物沒被打掉直接撞擊
                            hit = true;
                        }
                    }

                    if (hit) {
                        triggerDinoHurt();
                        item.cleared = true;
                        removeStageItem(item);
                    }
                }

                // 超出左邊界 (沒打到而成功跳過，或食物沒吃到)
                if (item.x < -100) {
                    if (item.isObstacle && !item.cleared) {
                        // 成功避開障礙物：微幅加分
                        gameState.score += 5;
                        updateScoreUI();
                    }
                    removeStageItem(item);
                    gameState.items.splice(i, 1);
                    updateTargetGuide();
                }
            }

            gameState.animationFrameId = requestAnimationFrame(gameLoop);
        }

        function removeStageItem(item) {
            if (item.dom && item.dom.parentNode) {
                item.dom.parentNode.removeChild(item.dom);
            }
        }

        // 當恐龍撞到障礙物受傷
        function triggerDinoHurt() {
            if (gameState.isFever) return; // 狂暴模式下無敵

            audioBank.hit();
            gameState.shields--;
            gameState.combo = 0;
            updateShieldDisplay();
            updateScoreUI();

            const characterEl = document.getElementById('dino-character');
            characterEl.className = "text-7xl md:text-8xl dino-hurt select-none";
            
            // 閃爍護盾提示受傷
            const shieldEl = document.getElementById('dino-shield');
            shieldEl.className = "absolute inset-0 border-4 border-red-500 rounded-full animate-ping opacity-100";

            setTimeout(() => {
                if (gameState.isActive) {
                    characterEl.className = "text-7xl md:text-8xl dino-run select-none";
                    shieldEl.className = "absolute inset-0 border-4 border-cyan-400 rounded-full animate-ping opacity-0";
                }
            }, 600);

            // 若護盾扣完，不執行 Game Over 以免打擊低年級孩子，改為彈出可愛的「補給愛心」並稍微降低積分
            if (gameState.shields <= 0) {
                gameState.shields = 3;
                gameState.score = Math.max(0, gameState.score - 10);
                updateShieldDisplay();
                updateScoreUI();
                createNotification("💡 沒關係！恐龍護盾已重新裝填！加油！", "rgba(14, 165, 233, 0.95)");
            }
        }

        // 取得距離恐龍最近且未被清除的物體作為當前主要輸入目標
        function updateTargetGuide() {
            const activeItems = gameState.items.filter(item => !item.cleared);
            if (activeItems.length > 0) {
                // 最左邊(最近)的為第一目標
                const target = activeItems[0];
                highlightFinger(target.char);
            } else {
                clearFingerGuides();
            }
        }

        // 訊息氣泡通知
        function createNotification(msg, bgColor = "rgba(16, 185, 129, 0.95)") {
            const stage = document.getElementById('fx-layer');
            const alertBox = document.createElement('div');
            alertBox.className = "absolute top-16 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-xl text-sm font-bold text-white z-40 shadow-xl transition-all duration-300";
            alertBox.style.backgroundColor = bgColor;
            alertBox.innerText = msg;
            stage.appendChild(alertBox);
            
            setTimeout(() => {
                alertBox.style.opacity = '0';
                setTimeout(() => alertBox.remove(), 400);
            }, 2000);
        }

        // 當打對按鍵時的超級反饋！
        function triggerActionOnSuccess(item) {
            item.cleared = true;
            gameState.score += 10;
            gameState.combo++;
            
            // 累積狂暴能量
            if (!gameState.isFever) {
                gameState.feverVal = Math.min(100, gameState.feverVal + 10);
                if (gameState.feverVal >= 100) {
                    triggerFeverMode();
                }
            }

            updateScoreUI();
            
            // 播放該字發音 (中文或英文)
            speakText(item.char, appConfig.lang === 'ZH' ? 'zh-TW' : 'en-US');

            const dinoEl = document.getElementById('dino-container');
            const charEl = document.getElementById('dino-character');

            if (item.isObstacle) {
                if (!item.isAir) {
                    // 1. 地面障礙：恐龍華麗一躍！
                    audioBank.jump();
                    charEl.className = "text-7xl md:text-8xl dino-jump select-none";
                    createJumpCloud(dinoEl.offsetLeft + 40, dinoEl.offsetTop + 80);
                    
                    setTimeout(() => {
                        if (gameState.isActive && !gameState.isFever) {
                            charEl.className = "text-7xl md:text-8xl dino-run select-none";
                        }
                    }, 600);
                } else {
                    // 2. 空中怪獸：恐龍吐大火球射擊！
                    audioBank.shoot();
                    createFireballEffect(dinoEl.offsetLeft + 80, dinoEl.offsetTop + 40, item.x, item.bottom);
                }

                // 怪物爆炸特效
                setTimeout(() => {
                    createExplosion(item.x + 30, item.bottom + 30, "💥");
                    removeStageItem(item);
                }, item.isAir ? 250 : 0);

            } else {
                // 3. 吃到美味水果食物：舌頭特效與吞嚥
                audioBank.eat();
                createExplosion(item.x + 30, item.bottom + 30, "✨");
                createFloatingScore(item.x, item.bottom, "Yum! +10 🪙");
                removeStageItem(item);
            }

            // 更新下一個導引
            setTimeout(updateTargetGuide, 50);
        }

        // 浮動文字特效
        function createFloatingScore(x, bottom, text) {
            const stage = document.getElementById('fx-layer');
            const el = document.createElement('div');
            el.className = "absolute font-black text-amber-300 text-lg drop-shadow-md transition-all pointer-events-none";
            el.style.left = `${x}px`;
            el.style.bottom = `${bottom + 40}px`;
            el.innerText = text;
            stage.appendChild(el);

            el.animate([
                { transform: 'translateY(0px)', opacity: 1 },
                { transform: 'translateY(-60px)', opacity: 0 }
            ], { duration: 800, easing: 'ease-out' }).onfinish = () => el.remove();
        }

        // 跳躍落塵雲煙
        function createJumpCloud(x, top) {
            const stage = document.getElementById('fx-layer');
            for (let i = 0; i < 4; i++) {
                const cloud = document.createElement('div');
                cloud.className = "absolute bg-slate-100/40 rounded-full w-4 h-4 pointer-events-none";
                cloud.style.left = `${x + (i - 1.5) * 15}px`;
                cloud.style.top = `${top}px`;
                stage.appendChild(cloud);

                cloud.animate([
                    { transform: 'scale(0.8)', opacity: 0.8 },
                    { transform: 'scale(2.5) translateY(10px)', opacity: 0 }
                ], { duration: 500 }).onfinish = () => cloud.remove();
            }
        }

        // 火球射擊動畫
        function createFireballEffect(startX, startY, endX, endBottom) {
            const stage = document.getElementById('fx-layer');
            const ball = document.createElement('div');
            ball.className = "absolute text-3xl fireball pointer-events-none select-none z-30";
            ball.innerText = "🔥";
            ball.style.left = `${startX}px`;
            ball.style.top = `${startY}px`;
            stage.appendChild(ball);

            // 計算目標高度
            const stageHeight = document.getElementById('adventure-stage').offsetHeight;
            const targetTop = stageHeight - endBottom - 48;

            ball.animate([
                { left: `${startX}px`, top: `${startY}px` },
                { left: `${endX}px`, top: `${targetTop}px` }
            ], { duration: 250, easing: 'linear' }).onfinish = () => ball.remove();
        }

        // 爆炸粒子
        function createExplosion(x, bottom, emoji) {
            const stage = document.getElementById('fx-layer');
            const stageHeight = document.getElementById('adventure-stage').offsetHeight;
            const targetTop = stageHeight - bottom - 40;

            for (let i = 0; i < 8; i++) {
                const star = document.createElement('div');
                star.className = "absolute text-xl pointer-events-none select-none";
                star.innerText = emoji === "💥" ? "🔥" : "⭐";
                star.style.left = `${x}px`;
                star.style.top = `${targetTop}px`;
                stage.appendChild(star);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 80 + 20;

                star.animate([
                    { transform: 'translate(0, 0) scale(1.2)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(0)`, opacity: 0 }
                ], { duration: 500, easing: 'ease-out' }).onfinish = () => star.remove();
            }
        }

        // 進入狂暴彩虹狂歡模式！
        function triggerFeverMode() {
            if (gameState.isFever) return;
            gameState.isFever = true;
            audioBank.fever();

            document.getElementById('fever-banner').classList.remove('hidden');
            const characterEl = document.getElementById('dino-character');
            characterEl.className = "text-8xl dino-run rainbow-fever select-none";

            createNotification("🌈 進入狂暴彩虹時間！小恐龍無敵啦！", "rgba(244, 63, 94, 0.95)");

            // 速度提升，召喚大量滿地金幣
            gameState.gameSpeed *= 1.8;

            let coinSpawnCounter = 0;
            const intervalId = setInterval(() => {
                if (!gameState.isActive || !gameState.isFever) {
                    clearInterval(intervalId);
                    return;
                }
                // 生成金幣食物
                const char = getRandomTargetChar();
                const itemObj = {
                    id: 'fever-coin-' + Date.now(),
                    char: char,
                    emoji: "🪙",
                    isObstacle: false,
                    isAir: Math.random() < 0.5,
                    x: 900,
                    bottom: 80 + Math.random() * 80,
                    dom: null,
                    cleared: false
                };

                const div = document.createElement('div');
                div.className = "absolute flex flex-col items-center justify-center pointer-events-none z-30";
                div.style.bottom = `${itemObj.bottom}px`;
                div.style.left = `${itemObj.x}px`;
                div.innerHTML = `
                    <span class="text-4xl animate-bounce select-none">🪙</span>
                    <div class="px-2 py-0.5 rounded-full border-2 border-yellow-400 bg-yellow-950/90 text-yellow-300 text-xs font-black">${char}</div>
                `;
                document.getElementById('stage-items').appendChild(div);
                itemObj.dom = div;
                gameState.items.push(itemObj);

                updateTargetGuide();
                coinSpawnCounter++;
                if (coinSpawnCounter > 12) clearInterval(intervalId);
            }, 400);

            // 8 秒後解除狂暴
            setTimeout(() => {
                gameState.isFever = false;
                gameState.feverVal = 0;
                gameState.gameSpeed /= 1.8;
                document.getElementById('fever-banner').classList.add('hidden');
                if (gameState.isActive) {
                    characterEl.className = "text-7xl md:text-8xl dino-run select-none";
                }
                updateScoreUI();
                updateTargetGuide();
            }, 8000);
        }

        // 實體鍵盤事件攔截
        window.addEventListener('keydown', (e) => {
            if (!gameState.isActive) return;
            
            let pressedKey = e.key.toUpperCase();
            if (e.key.length !== 1) return; // 略過 Shift/Control 等

            let targetChar = pressedKey;
            
            // 注音佈局轉譯判定
            if (appConfig.lang === 'ZH') {
                const physicalObj = keyboardData.flat().find(btn => btn.key.toUpperCase() === pressedKey);
                if (physicalObj) {
                    targetChar = physicalObj.zh; // 例如把 Q 對應到 ㄆ
                }
            }

            // 視覺鍵盤高亮效果
            const keyDom = keyMapDict[pressedKey];
            if (keyDom) {
                keyDom.classList.add('scale-90', 'brightness-125');
                setTimeout(() => keyDom.classList.remove('scale-90', 'brightness-125'), 100);
            }

            // 比對是否擊中距離最近的項目
            const activeItems = gameState.items.filter(item => !item.cleared);
            if (activeItems.length > 0) {
                const target = activeItems[0];
                if (target.char.toUpperCase() === targetChar.toUpperCase()) {
                    triggerActionOnSuccess(target);
                } else {
                    // 打錯字
                    audioBank.hit();
                    gameState.combo = 0;
                    updateScoreUI();
                }
            }
        });

        // 返回大廳
        function backToLobby() {
            gameState.isActive = false;
            if (gameState.animationFrameId) cancelAnimationFrame(gameState.animationFrameId);
            
            document.getElementById('adventure-stage').classList.add('hidden');
            document.getElementById('btn-back').classList.add('hidden');
            document.getElementById('lobby').classList.remove('hidden');
            document.getElementById('combo-container').classList.add('hidden');
            
            clearFingerGuides();
        }

        // 初始化
        window.onload = function() {
            renderKeyboard();
            // 音訊交互保護解除
            document.body.addEventListener('click', () => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }, { once: true });
        };
    </script>
</body>
</html>
