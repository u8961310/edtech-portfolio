<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>恐龍打字大冒險 - 打字島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@500;600&display=swap">
  <link rel="stylesheet" href="../../assets/css/typing-island.css">
  <style>
    /* 只放場景樣式，所有 class 一律以 sc- 開頭，不動 .ti- 樣式 */
    .sc-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      user-select: none;
      background: linear-gradient(180deg, var(--sky-soft) 0%, #EAF6FC 64%, #D9EFC9 64%, #C1E3AE 100%);
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      color: var(--ink-1);
    }

    /* 細微紙張顆粒紋理，增添繪本剪紙觸感（非純白、不刺眼） */
    .sc-paper-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image: radial-gradient(rgba(94, 72, 56, 0.16) 1px, transparent 1px);
      background-size: 16px 16px;
      z-index: 1;
    }

    /* 視差背景三層：雲、遠山、矮樹（移動由 rAF 控制，暫停時完全靜止） */
    .sc-parallax-layer {
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .sc-layer-clouds {
      top: 0;
      height: 58%;
      z-index: 2;
    }
    .sc-layer-hills {
      bottom: 24%;
      height: 46%;
      z-index: 3;
    }
    .sc-layer-bushes {
      bottom: 18%;
      height: 28%;
      z-index: 4;
    }
    .sc-parallax-track {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      will-change: transform;
    }
    .sc-parallax-tile {
      flex: 0 0 900px;
      width: 900px;
      height: 100%;
      display: block;
    }

    /* 剪紙草原與泥土小路 */
    .sc-ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 24%;
      min-height: 54px;
      background: #B8DF9E;
      border-top: 3px solid #96C67A;
      z-index: 5;
      pointer-events: none;
    }
    .sc-road {
      position: absolute;
      left: -12px;
      right: -12px;
      top: 16%;
      bottom: 14%;
      background: var(--paper);
      border-top: 3px solid var(--kraft);
      border-bottom: 4px solid var(--kraft-2);
      border-radius: 14px 10px 16px 8px;
      box-shadow: inset 0 4px 0 rgba(255, 248, 230, 0.7), 0 3px 0 rgba(59, 42, 32, 0.08);
    }
    .sc-road-dashes {
      position: absolute;
      left: 0;
      right: 0;
      top: 48%;
      height: 4px;
      background: repeating-linear-gradient(
        90deg,
        rgba(201, 166, 107, 0.55) 0 18px,
        transparent 18px 42px
      );
    }

    /* 恐龍面前的防線標記（怪獸撞到會扣愛心） */
    .sc-guard-line {
      position: absolute;
      bottom: 8%;
      height: 44%;
      width: 0;
      border-left: 3px dashed var(--peach-dk);
      opacity: 0.65;
      z-index: 6;
      pointer-events: none;
    }
    .sc-guard-post {
      position: absolute;
      left: -8px;
      bottom: -4px;
      width: 14px;
      height: 24px;
      background: var(--kraft-2);
      border: 2px solid var(--ink-2);
      border-radius: 5px 5px 3px 3px;
      box-shadow: 0 2px 0 rgba(59, 42, 32, 0.16);
    }

    /* 上方冒險進度路線圖 */
    .sc-roadmap {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: min(94%, 760px);
      height: 36px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 2px solid var(--kraft);
      border-radius: 12px 16px 10px 14px;
      box-shadow: 0 3px 0 var(--kraft), 0 5px 10px rgba(59, 42, 32, 0.09);
      z-index: 20;
      pointer-events: none;
    }
    .sc-rm-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-2);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sc-rm-track {
      position: relative;
      flex: 1;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
    }
    .sc-rm-rail {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 50%;
      height: 4px;
      margin-top: -2px;
      background: var(--kraft);
      border-radius: 4px;
    }
    .sc-rm-rail-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: var(--leaf);
      border-radius: 4px;
    }
    .sc-rm-dot {
      position: relative;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--card-2);
      border: 2px solid var(--kraft-2);
      z-index: 2;
    }
    .sc-rm-dot.sc-passed {
      background: var(--leaf);
      border-color: var(--leaf-dk);
    }
    .sc-rm-dot.sc-station {
      width: 14px;
      height: 14px;
      background: var(--butter);
      border: 2px solid var(--peach-dk);
    }
    .sc-rm-mini-dino {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 24px;
      height: 22px;
      margin-left: -12px;
      margin-top: -13px;
      z-index: 4;
      will-change: left;
    }
    .sc-rm-stats {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-1);
      font-variant-numeric: tabular-nums;
    }
    .sc-rm-flag-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      background: var(--butter-soft);
      border: 1.5px solid var(--kraft-2);
      border-radius: 8px 10px 8px 10px;
      color: var(--ink-1);
    }
    .sc-rm-toast {
      position: absolute;
      top: 42px;
      right: 12px;
      padding: 3px 10px;
      background: var(--leaf);
      color: var(--card);
      border: 2px solid var(--leaf-dk);
      border-radius: 10px 14px 10px 12px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 3px 0 rgba(45, 122, 56, 0.25);
      opacity: 0;
      pointer-events: none;
    }

    /* 主角：左邊的小恐龍 */
    .sc-dino-wrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 124px;
      height: 108px;
      z-index: 12;
      pointer-events: none;
      will-change: transform;
    }
    .sc-dino-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 4px 0 rgba(59, 42, 32, 0.14));
    }
    .sc-dino-face { display: none; }
    .sc-dino-wrap.sc-mood-normal .sc-face-normal { display: block; }
    .sc-dino-wrap.sc-mood-happy .sc-face-happy { display: block; }
    .sc-dino-wrap.sc-mood-hurt .sc-face-hurt { display: block; }
    .sc-tail-swoosh {
      opacity: 0;
    }

    /* 怪獸容器層、小花層、特效粒子層 */
    .sc-flowers-layer,
    .sc-monsters-layer,
    .sc-fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .sc-flowers-layer { z-index: 8; }
    .sc-monsters-layer { z-index: 11; }
    .sc-fx-layer { z-index: 16; }

    /* 單隻石頭怪與頭上舉的字卡 */
    .sc-monster {
      position: absolute;
      left: 0;
      top: 0;
      width: 96px;
      height: 144px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      will-change: transform, opacity;
    }

    /* 最前面那隻石頭怪的天藍虛線瞄準圈與指示標籤 */
    .sc-aim-ring {
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: 108px;
      height: 152px;
      margin-left: -54px;
      border-radius: 26px 30px 24px 28px;
      border: 3.5px dashed var(--sky-dk);
      background: rgba(214, 238, 251, 0.24);
      opacity: 0;
      pointer-events: none;
    }
    .sc-monster.sc-lead .sc-aim-ring {
      opacity: 1;
    }
    .sc-aim-tag {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid var(--sky-dk);
      opacity: 0;
    }
    .sc-monster.sc-lead .sc-aim-tag {
      opacity: 1;
    }

    /* 石頭怪頭上舉著的字卡（深色字配淺色底，對比度 > 11:1） */
    .sc-card {
      position: relative;
      min-width: 66px;
      height: 64px;
      padding: 0 8px;
      margin-bottom: -8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      color: var(--ink-1);
      border: 3px solid var(--kraft-2);
      border-radius: 10px 14px 12px 10px;
      box-shadow: 0 4px 0 var(--kraft), 0 6px 10px rgba(59, 42, 32, 0.14);
      font-family: var(--f-zh);
      font-size: 44px;
      font-weight: 700;
      line-height: 1;
      z-index: 3;
      box-sizing: border-box;
    }
    /* 英打模式：Fredoka / Consolas 等寬，至少 44px，不轉換大小寫 */
    .sc-stage.sc-lang-en .sc-card {
      font-family: 'Fredoka', Consolas, monospace;
      font-size: 46px;
      font-weight: 600;
    }
    .sc-card.sc-space-char {
      color: var(--sky-dk);
    }
    .sc-monster.sc-lead .sc-card {
      background: var(--sky-soft);
      border: 3.5px solid var(--sky-dk);
      box-shadow: 0 4px 0 rgba(31, 107, 156, 0.35), 0 6px 12px rgba(31, 107, 156, 0.18);
    }
    .sc-monster.sc-queue .sc-card {
      background: var(--card-2);
      border-color: var(--kraft-2);
    }

    /* 石頭怪身體 SVG */
    .sc-rock-svg {
      width: 82px;
      height: 78px;
      overflow: visible;
      z-index: 2;
      filter: drop-shadow(0 3px 0 rgba(59, 42, 32, 0.15));
    }
    .sc-rock-face-tease { display: none; }
    .sc-monster.sc-teasing .sc-rock-face-normal { display: none; }
    .sc-monster.sc-teasing .sc-rock-face-tease { display: block; }

    /* 打錯時的可愛小提示氣泡（不閃紅全畫面） */
    .sc-miss-bubble {
      position: absolute;
      right: -24px;
      top: 46px;
      padding: 2px 7px;
      background: #FFD9D6;
      color: var(--berry-dk);
      border: 2px solid var(--berry);
      border-radius: 10px 12px 10px 4px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      z-index: 5;
      box-shadow: 0 2px 0 rgba(179, 38, 43, 0.2);
    }
    .sc-monster.sc-teasing .sc-miss-bubble {
      opacity: 1;
    }

    /* 彈飛小石子、落地小花、打對飄字與星星 */
    .sc-pebble {
      position: absolute;
      left: 0;
      top: 0;
      width: 16px;
      height: 14px;
      margin-left: -8px;
      margin-top: -7px;
      will-change: transform, opacity;
    }
    .sc-flower {
      position: absolute;
      left: 0;
      top: 0;
      width: 28px;
      height: 30px;
      margin-left: -14px;
      margin-top: -26px;
      will-change: transform, opacity;
    }
    .sc-pop {
      position: absolute;
      left: 0;
      top: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 10px 12px 10px 12px;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
      will-change: transform, opacity;
    }
    .sc-pop-hit {
      background: var(--card);
      color: var(--leaf-dk);
      border: 2px solid var(--leaf);
      box-shadow: 0 3px 0 rgba(45, 122, 56, 0.2);
    }
    .sc-pop-bonk {
      background: var(--peach-soft);
      color: var(--berry-dk);
      border: 2px solid var(--berry);
      box-shadow: 0 3px 0 rgba(179, 38, 43, 0.2);
    }

    /* 減少動態偏好：確保完全無多餘過渡與晃動 */
    @media (prefers-reduced-motion: reduce) {
      .sc-stage * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head><body>
  <script src="../../assets/typing/passages.js"></script>
  <script src="../../assets/typing/en-items.js"></script>
  <script src="../../assets/js/typing-core.js"></script>
  <script src="../../assets/js/typing-ui.js"></script>
  <script>
    /* =========================================================================
       場景具名設定常數 SCENE_CONFIG（集中管理速度、數量、顏色、物理與動畫秒數）
       ========================================================================= */
    var SCENE_CONFIG = {
      // 同時顯示在畫面上的石頭怪數量（初階 3、進階 4、高階 5）
      TARGET_COUNT: { t1: 3, t2: 4, t3: 5 },

      // 最前面石頭怪從隊伍前端（進度 1/3）走到恐龍面前（進度 1）的秒數
      // 對應全程（0 -> 1）為 18 / 12 / 9 秒，符合「初階 >= 14 秒、進階 >= 10 秒、高階 >= 7 秒」
      // 且從隊伍前端開走剛好是本關設定的 12 / 8 / 6 秒
      LEAD_TRAVEL_SEC: { t1: 12, t2: 8, t3: 6 },

      // 隊伍前端起點（占全程 1/3，排隊中的怪獸最多只能前進到這裡以前，保留 >= 2/3 時間）
      QUEUE_FRONT_PROGRESS: 1 / 3,

      // 還沒輪到的石頭怪跟隨速度倍率（約目前目標的 1/3）
      QUEUE_SPEED_RATIO: 1 / 3,
      // 排在畫面外（進度 < 0）的石頭怪走進畫面的速度（每秒占全程比例），避免輪到時還看不到
      OFFSCREEN_ENTRY_SPEED: 0.25,

      // rAF 時間差上限（毫秒），避免切回分頁瞬間暴衝
      MAX_DT_MS: 100,

      // 三層剪紙背景視差捲動速度（每秒像素）
      PARALLAX_SPEED: {
        clouds: 9,
        hills: 20,
        bushes: 36
      },
      PARALLAX_TILE_W: 900,

      // 冒險進度路線圖：每幾字到達一個休息站並插旗
      STATION_STEPS: 15,

      // 各回饋動畫持續時間（秒）
      DINO_WHIP_SEC: 0.42,
      DINO_HURT_SEC: 0.65,
      MONSTER_TEASE_SEC: 0.78,
      FLAG_TOAST_SEC: 1.8,
      POP_LIFE_SEC: 0.85,
      FLOWER_STAY_SEC: 2.4,
      FLOWER_FADE_SEC: 0.45,
      REDUCED_FADE_SEC: 0.25,

      // 小石子彈飛與落地變小花參數
      PEBBLE_COUNT: 4,
      PEBBLE_GRAVITY: 760,
      MAX_FLOWERS: 14,

      // 小花色票（完全取自設計規範 system.md）
      FLOWER_COLORS: [
        { petal: '#FF9E7A', center: '#FFD966', stroke: '#D9531F' },
        { petal: '#FFD966', center: '#FF9E7A', stroke: '#C9A66B' },
        { petal: '#D6EEFB', center: '#FFD966', stroke: '#1F6B9C' },
        { petal: '#FFF8E6', center: '#FF9E7A', stroke: '#7CCB6F' }
      ]
    };

    TypingIsland.mount({
      unit: 16,
      title: '恐龍打字大冒險',
      subtitle: '怪獸對打・英打',
      langs: ['en'],
      homeUrl: '../../index.html',
      scene: function (api) {
        var field = api.field;

        // 執行狀態（所有動畫與計時皆由單一 rAF 驅動，pause 時 100% 靜止）
        var mounted = false;
        var running = false;
        var rafId = 0;
        var lastTime = 0;
        var elapsed = 0;

        // 系統「減少動態效果」偏好
        var motionMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
        var reducedMotion = motionMQ ? motionMQ.matches : false;

        // 畫面幾何資訊（每次量測 field.clientWidth / clientHeight，絕不寫死）
        var metrics = {
          w: 1330,
          h: 300,
          groundY: 256,
          dinoX: 110,
          hitX: 220,
          rightX: 1250,
          trackSpan: 1030,
          scale: 1
        };

        // DOM 參照
        var stageEl = null;
        var cloudTrackEl = null;
        var hillTrackEl = null;
        var bushTrackEl = null;
        var guardLineEl = null;
        var dinoWrapEl = null;
        var dinoTailEl = null;
        var tailSwooshEl = null;
        var flowersLayerEl = null;
        var monstersLayerEl = null;
        var fxLayerEl = null;

        // 冒險進度 DOM 與狀態
        var rmFillEl = null;
        var rmMiniDinoEl = null;
        var rmStepTextEl = null;
        var rmFlagCountEl = null;
        var rmToastEl = null;
        var rmDots = [];
        var totalHits = 0;
        var flagCount = 0;
        var flagToastTimer = 0;

        // 視差偏移量
        var parallax = { clouds: 0, hills: 0, bushes: 0 };

        // 恐龍動作狀態
        var dinoState = {
          whipTimer: 0,
          hurtTimer: 0
        };

        // 場上實體陣列
        var monsters = [];
        var pebbles = [];
        var flowers = [];
        var pops = [];
        var fadingMonsters = [];

        /* ---------------------------------------------------------------------
           工具函式
           --------------------------------------------------------------------- */
        function getTier() {
          var t = api.settings && api.settings.tier;
          return SCENE_CONFIG.TARGET_COUNT[t] ? t : 't1';
        }

        function getTargetCount() {
          return SCENE_CONFIG.TARGET_COUNT[getTier()];
        }

        // 顯示字元：一律取 display（保留破音字選擇器），空白顯示成 ␣，不轉換大小寫
        function formatDisplay(item) {
          var raw = (item && item.display != null) ? String(item.display) : '';
          return raw === ' ' ? '␣' : raw;
        }

        function makeKey(item) {
          return item.passageIndex + ':' + item.index + ':' + item.display;
        }

        // 計算排隊怪獸間的最小進度間隔，避免卡片重疊
        function getMinGapProgress() {
          var count = getTargetCount();
          var waitingCount = Math.max(1, count - 1);
          // 理想卡片間距至少 76px，但也確保全部排隊怪獸落在 0 ~ QUEUE_FRONT_PROGRESS 範圍內
          var idealGapP = 82 / Math.max(240, metrics.trackSpan);
          var maxAllowedGapP = (SCENE_CONFIG.QUEUE_FRONT_PROGRESS - 0.01) / waitingCount;
          return Math.min(idealGapP, maxAllowedGapP);
        }

        // 第 idx 隻排隊怪獸（idx >= 1）最多可前進到的進度上限（絕不超過 1/3）
        function getSlotCapProgress(idx) {
          if (idx <= 0) return 1;
          var gapP = getMinGapProgress();
          return Math.max(0, SCENE_CONFIG.QUEUE_FRONT_PROGRESS - idx * gapP);
        }

        // 將正規化進度 p（0 = 右側隊尾起點，1 = 恐龍面前防線）換算為畫面 X 座標
        function progressToX(p) {
          return metrics.rightX - p * metrics.trackSpan;
        }

        // 動態量測 api.field 大小（不寫死寬高）
        function measureField() {
          var w = field.clientWidth || 960;
          var h = field.clientHeight || 300;
          var scale = Math.max(0.76, Math.min(1, h / 285));
          var dinoW = 124 * scale;
          var dinoX = Math.max(24, Math.min(w * 0.075, 110));
          var hitX = dinoX + dinoW + Math.max(16, w * 0.025);
          var rightX = Math.max(hitX + 260, w - Math.max(54, 58 * scale));
          var groundY = h - Math.max(22, Math.round(h * 0.13));

          metrics.w = w;
          metrics.h = h;
          metrics.scale = scale;
          metrics.dinoX = dinoX;
          metrics.hitX = hitX;
          metrics.rightX = rightX;
          metrics.trackSpan = Math.max(240, rightX - hitX);
          metrics.groundY = groundY;

          if (guardLineEl) {
            guardLineEl.style.left = Math.round(hitX - 36 * scale) + 'px';
          }
          if (stageEl) {
            stageEl.classList.toggle('sc-lang-en', !!(api.settings && api.settings.lang === 'en'));
          }
        }

        /* ---------------------------------------------------------------------
           SVG 繪本剪紙美術產生器（無外部圖片）
           --------------------------------------------------------------------- */
        function createCloudsSVG() {
          return (
            '<svg class="sc-parallax-tile" viewBox="0 0 900 170" preserveAspectRatio="none" aria-hidden="true">' +
              '<g fill="#FFF8E6" stroke="#E4CC9C" stroke-width="2.5">' +

        /* ---------------------------------------------------------------------
           建立場景骨架（僅於 start() 執行一次）
           --------------------------------------------------------------------- */
        function buildSceneDOM() {
          if (mounted) return;
          mounted = true;

          field.innerHTML = '';

          stageEl = document.createElement('div');
          stageEl.className = 'sc-stage';

          // 紙張質感
          var grain = document.createElement('div');
          grain.className = 'sc-paper-grain';
          stageEl.appendChild(grain);

          // 三層視差背景（每層 3 張 900px 拼接，寬螢幕也無接縫）
          function makeParallaxLayer(cls, svgHtml) {
            var layer = document.createElement('div');
            layer.className = 'sc-parallax-layer ' + cls;
            var track = document.createElement('div');
            track.className = 'sc-parallax-track';
            track.innerHTML = svgHtml + svgHtml + svgHtml;
            layer.appendChild(track);
            stageEl.appendChild(layer);
            return track;
          }
          cloudTrackEl = makeParallaxLayer('sc-layer-clouds', createCloudsSVG());
          hillTrackEl = makeParallaxLayer('sc-layer-hills', createHillsSVG());
          bushTrackEl = makeParallaxLayer('sc-layer-bushes', createBushesSVG());

          // 草原與小路
          var ground = document.createElement('div');
          ground.className = 'sc-ground';
          ground.innerHTML = '<div class="sc-road"><div class="sc-road-dashes"></div></div>';
          stageEl.appendChild(ground);

          // 恐龍防線
          guardLineEl = document.createElement('div');
          guardLineEl.className = 'sc-guard-line';
          guardLineEl.innerHTML = '<div class="sc-guard-post"></div>';
          stageEl.appendChild(guardLineEl);

          // 落地小花層、石頭怪層、小恐龍、粒子飄字層
          flowersLayerEl = document.createElement('div');
          flowersLayerEl.className = 'sc-flowers-layer';
          stageEl.appendChild(flowersLayerEl);

          monstersLayerEl = document.createElement('div');
          monstersLayerEl.className = 'sc-monsters-layer';
          stageEl.appendChild(monstersLayerEl);

          dinoWrapEl = document.createElement('div');
          dinoWrapEl.className = 'sc-dino-wrap sc-mood-normal';
          dinoWrapEl.innerHTML = createDinoSVG();
          dinoTailEl = dinoWrapEl.querySelector('.sc-dino-tail');
          tailSwooshEl = dinoWrapEl.querySelector('.sc-tail-swoosh');
          stageEl.appendChild(dinoWrapEl);

          fxLayerEl = document.createElement('div');
          fxLayerEl.className = 'sc-fx-layer';
          stageEl.appendChild(fxLayerEl);

          // 上方冒險進度路線圖
          var roadmap = document.createElement('div');
          roadmap.className = 'sc-roadmap';

          var rmTitle = document.createElement('div');
          rmTitle.className = 'sc-rm-title';
          rmTitle.textContent = '冒險路線';
          roadmap.appendChild(rmTitle);

          var rmTrack = document.createElement('div');
          rmTrack.className = 'sc-rm-track';

          var rmRail = document.createElement('div');
          rmRail.className = 'sc-rm-rail';
          rmFillEl = document.createElement('div');
          rmFillEl.className = 'sc-rm-rail-fill';
          rmRail.appendChild(rmFillEl);
          rmTrack.appendChild(rmRail);

          rmDots = [];
          for (var s = 0; s <= SCENE_CONFIG.STATION_STEPS; s++) {
            var dot = document.createElement('div');
            dot.className = 'sc-rm-dot' + (s === SCENE_CONFIG.STATION_STEPS ? ' sc-station' : '');
            rmTrack.appendChild(dot);
            rmDots.push(dot);

          rmMiniDinoEl = document.createElement('div');
          rmMiniDinoEl.className = 'sc-rm-mini-dino';

          rmTrack.appendChild(rmMiniDinoEl);
          roadmap.appendChild(rmTrack);

          var rmStats = document.createElement('div');
          rmStats.className = 'sc-rm-stats';
          rmStepTextEl = document.createElement('span');
          rmStepTextEl.textContent = '0/' + SCENE_CONFIG.STATION_STEPS;

          var flagBadge = document.createElement('span');
          flagBadge.className = 'sc-rm-flag-badge';
          flagBadge.innerHTML =
            '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">' +
              '<line x1="3" y1="2" x2="3" y2="15" stroke="#5E4838" stroke-width="2" stroke-linecap="round"/>' +
              '<path d="M4 3 L14 6 L4 10 Z" fill="#FF9E7A" stroke="#D9531F" stroke-width="1.3" stroke-linejoin="round"/>' +
            '</svg>';
          rmFlagCountEl = document.createElement('span');
          rmFlagCountEl.textContent = '0';
          flagBadge.appendChild(rmFlagCountEl);

          rmStats.appendChild(rmStepTextEl);
          rmStats.appendChild(flagBadge);
          roadmap.appendChild(rmStats);

          rmToastEl = document.createElement('div');
          rmToastEl.className = 'sc-rm-toast';
          rmToastEl.textContent = '到達休息站・插旗！';

          // 監聽 prefers-reduced-motion 即時變化
          if (motionMQ && motionMQ.addEventListener) {
            motionMQ.addEventListener('change', function (e) {
              reducedMotion = e.matches;
              renderAll();
            });
          }

        /* ---------------------------------------------------------------------
           冒險進度路線圖更新
           --------------------------------------------------------------------- */
        function updateRoadmapUI() {
          if (!rmFillEl) return;
          var steps = SCENE_CONFIG.STATION_STEPS;
          var rem = totalHits % steps;
          var stepInLeg = totalHits === 0 ? 0 : (rem === 0 ? steps : rem);
          var pct = (stepInLeg / steps) * 100;

          rmFillEl.style.width = pct + '%';
          rmMiniDinoEl.style.left = pct + '%';
          rmStepTextEl.textContent = stepInLeg + '/' + steps;
          rmFlagCountEl.textContent = String(flagCount);

          for (var i = 0; i < rmDots.length; i++) {
            rmDots[i].classList.toggle('sc-passed', i > 0 && i <= stepInLeg);
          }
        }

        /* ---------------------------------------------------------------------
           石頭怪建立與同步（與 api.upcoming 嚴格對齊）
           --------------------------------------------------------------------- */
        function createMonsterEntity(item, initialP) {
          var el = document.createElement('div');
          el.className = 'sc-monster';

          var ring = document.createElement('div');
          ring.className = 'sc-aim-ring';
          el.appendChild(ring);

          var tag = document.createElement('div');
          tag.className = 'sc-aim-tag';
          el.appendChild(tag);

          var card = document.createElement('div');
          card.className = 'sc-card';
          var text = formatDisplay(item);
          card.textContent = text;
          if (text === '␣') card.classList.add('sc-space-char');
          el.appendChild(card);

          var bubble = document.createElement('div');
          bubble.className = 'sc-miss-bubble';
          bubble.textContent = '✗ 略略~';
          el.appendChild(bubble);

          var rockWrap = document.createElement('div');
          rockWrap.innerHTML = createRockMonsterSVG();
          var rockSvg = rockWrap.firstChild;
          el.appendChild(rockSvg);

          monstersLayerEl.appendChild(el);

          return {
            key: makeKey(item),
            el: el,
            cardEl: card,
            footLEl: rockSvg.querySelector('.sc-rock-foot-l'),
            footREl: rockSvg.querySelector('.sc-rock-foot-r'),
            p: initialP,
            phase: Math.random() * Math.PI * 2,
            teaseTimer: 0,
            fadeIn: reducedMotion ? 0 : 1
          };
        }

        function syncMonsters() {
          var want = api.upcoming(getTargetCount()) || [];

          // 刪掉多出來的怪獸
          while (monsters.length > want.length) {
            var extra = monsters.pop();
            extra.el.remove();
          }

          for (var i = 0; i < want.length; i++) {
            var u = want[i];
            var expectedKey = makeKey(u);
            var m = monsters[i];

            if (!m || m.key !== expectedKey) {
              if (m) m.el.remove();
              // 第 0 隻從隊伍前端起點（1/3）出發，後面排隊的怪獸依序排在後方
              var spawnP;
              if (i === 0) {
                spawnP = SCENE_CONFIG.QUEUE_FRONT_PROGRESS;
              } else {
                var cap = getSlotCapProgress(i);
                var prevP = monsters[i - 1] ? monsters[i - 1].p : SCENE_CONFIG.QUEUE_FRONT_PROGRESS;
                // 不夾在 0：打得快時前一隻還在右邊緣，夾 0 會全部疊在同一點；允許排在畫面外，依序走進來
                spawnP = Math.min(cap, prevP - getMinGapProgress());
              }
              m = createMonsterEntity(u, spawnP);
              monsters[i] = m;
            }

            // 標記目前目標（天藍虛線圈）與排隊怪獸（樸素風格）
            m.el.classList.toggle('sc-lead', i === 0);
            m.el.classList.toggle('sc-queue', i > 0);
          }

          renderMonsters();
        }

        /* ---------------------------------------------------------------------
           特效生成（小石子彈飛、落地變小花、+1 星星飄字、被撞提示）
           --------------------------------------------------------------------- */
        function spawnFlower(x, y) {
          // 限制場上同時最多花朵數，避免久玩 DOM 累積
          while (flowers.length >= SCENE_CONFIG.MAX_FLOWERS) {
            var oldest = flowers.shift();
            oldest.el.remove();
          }
          var palette = SCENE_CONFIG.FLOWER_COLORS[Math.floor(Math.random() * SCENE_CONFIG.FLOWER_COLORS.length)];
          var el = document.createElement('div');
          el.className = 'sc-flower';
          el.innerHTML = createFlowerSVG(palette);
          flowersLayerEl.appendChild(el);

          flowers.push({
            el: el,
            x: x,
            y: y,
            age: 0,
            totalLife: SCENE_CONFIG.FLOWER_STAY_SEC + SCENE_CONFIG.FLOWER_FADE_SEC
          });
        }

        function spawnDefeatEffect(x, y) {
          if (reducedMotion) {
            // 減少動態模式：原地柔和淡入一朵小花，不彈飛粒子
            spawnFlower(x, metrics.groundY + 4);
            return;
          }

          // 石頭怪化成數顆小石子彈飛，落地後變成小花
          for (var i = 0; i < SCENE_CONFIG.PEBBLE_COUNT; i++) {
            var el = document.createElement('div');
            el.className = 'sc-pebble';
            el.innerHTML = createPebbleSVG();
            fxLayerEl.appendChild(el);

            var spread = (i - (SCENE_CONFIG.PEBBLE_COUNT - 1) / 2);
            pebbles.push({
              el: el,
              x: x + spread * 8,
              y: y - 34,
              vx: 95 + spread * 55 + (Math.random() * 30 - 15),
              vy: -(210 + Math.random() * 110),
              rot: Math.random() * 360,
              vrot: (Math.random() > 0.5 ? 1 : -1) * (240 + Math.random() * 200),
              landY: metrics.groundY + (Math.random() * 10 - 3)
            });
          }
        }

        function spawnPop(text, x, y, type) {
          var el = document.createElement('div');
          el.className = 'sc-pop ' + (type === 'bonk' ? 'sc-pop-bonk' : 'sc-pop-hit');
          el.textContent = text;
          fxLayerEl.appendChild(el);

          pops.push({
            el: el,
            x: x,
            y: y,
            age: 0,
            life: SCENE_CONFIG.POP_LIFE_SEC
          });
        }

        function clearAllDynamicEntities() {
          monsters.forEach(function (m) { m.el.remove(); });
          monsters = [];

          fadingMonsters.forEach(function (fm) { fm.el.remove(); });
          fadingMonsters = [];

          pebbles.forEach(function (p) { p.el.remove(); });
          pebbles = [];

          flowers.forEach(function (f) { f.el.remove(); });
          flowers = [];

          pops.forEach(function (p) { p.el.remove(); });
          pops = [];

          dinoState.whipTimer = 0;
          dinoState.hurtTimer = 0;
          flagToastTimer = 0;
          if (rmToastEl) rmToastEl.style.opacity = '0';
        }

        /* ---------------------------------------------------------------------
           畫面渲染（恐龍、怪獸、視差、特效）
           --------------------------------------------------------------------- */
        function renderParallax() {
          if (!cloudTrackEl) return;
          cloudTrackEl.style.transform = 'translate3d(' + (-parallax.clouds).toFixed(1) + 'px, 0, 0)';
          hillTrackEl.style.transform = 'translate3d(' + (-parallax.hills).toFixed(1) + 'px, 0, 0)';
          bushTrackEl.style.transform = 'translate3d(' + (-parallax.bushes).toFixed(1) + 'px, 0, 0)';
        }

        function renderDino() {
          if (!dinoWrapEl) return;
          var s = metrics.scale;
          var baseX = metrics.dinoX;
          var baseY = metrics.groundY - 98 * s;

          var offsetX = 0;
          var offsetY = 0;
          var tailDeg = 0;
          var swooshOpacity = 0;
          var mood = 'sc-mood-normal';

          if (dinoState.hurtTimer > 0) {
            mood = 'sc-mood-hurt';
            if (!reducedMotion) {
              var hp = dinoState.hurtTimer / SCENE_CONFIG.DINO_HURT_SEC;
              // 輕微後退與低頻輕晃（不超過 3 次/秒）
              offsetX = -10 * Math.sin(hp * Math.PI);
              offsetY = Math.sin(hp * Math.PI * 2) * 3;
            }
          } else if (dinoState.whipTimer > 0) {
            mood = 'sc-mood-happy';
            if (!reducedMotion) {
              var wp = 1 - dinoState.whipTimer / SCENE_CONFIG.DINO_WHIP_SEC;
              // 開心跳一下＋大力甩尾
              offsetY = -Math.sin(wp * Math.PI) * 16;
              offsetX = Math.sin(wp * Math.PI) * 8;
              tailDeg = Math.sin(wp * Math.PI * 2) * 38;
              swooshOpacity = wp < 0.75 ? Math.sin((wp / 0.75) * Math.PI) : 0;
            }
          } else if (!reducedMotion) {
            // 柔和待機呼吸與尾巴慢擺
            offsetY = Math.sin(elapsed * 3.0) * 2.5;
            tailDeg = Math.sin(elapsed * 2.6) * 7;
          }

          dinoWrapEl.className = 'sc-dino-wrap ' + mood;
          dinoWrapEl.style.transform =
            'translate3d(' + (baseX + offsetX).toFixed(1) + 'px, ' + (baseY + offsetY).toFixed(1) + 'px, 0) scale(' + s.toFixed(3) + ')';
          dinoWrapEl.style.transformOrigin = 'left top';

          if (dinoTailEl) {
            dinoTailEl.setAttribute('transform', 'rotate(' + tailDeg.toFixed(1) + ' 44 72)');
          }
          if (tailSwooshEl) {
            tailSwooshEl.style.opacity = swooshOpacity.toFixed(2);
          }
        }

        function renderMonsters() {
          var s = metrics.scale;
          for (var i = 0; i < monsters.length; i++) {
            var m = monsters[i];
            var x = progressToX(m.p);
            var itemScale = (i === 0 ? 1 : 0.92) * s;
            var y = metrics.groundY - 138 * itemScale;

            var bobY = 0;
            var shakeX = 0;
            var tiltDeg = 0;

            if (!reducedMotion) {
              var walkSpeed = i === 0 ? 6.5 : 3.2;
              var walkWave = Math.sin(elapsed * walkSpeed + m.phase);
              bobY = -Math.abs(walkWave) * (i === 0 ? 5.5 : 2.5);
              tiltDeg = walkWave * (i === 0 ? 3.2 : 1.5);

              if (m.teaseTimer > 0) {
                // 打錯時輕輕搖頭晃動（頻率約 2.5Hz <= 3次/秒）
                var tp = m.teaseTimer / SCENE_CONFIG.MONSTER_TEASE_SEC;
                shakeX = Math.sin(tp * Math.PI * 4) * 5;
              }

              // 小腳交替步伐
              var footShift = walkWave * 3.5;
              if (m.footLEl) m.footLEl.setAttribute('transform', 'translate(' + footShift.toFixed(1) + ' 0)');
              if (m.footREl) m.footREl.setAttribute('transform', 'translate(' + (-footShift).toFixed(1) + ' 0)');
            }

            m.el.classList.toggle('sc-teasing', m.teaseTimer > 0);
            m.el.style.zIndex = String(20 - i);
            m.el.style.opacity = m.fadeIn.toFixed(2);
            m.el.style.transform =
              'translate3d(' + (x - 48 * itemScale + shakeX).toFixed(1) + 'px, ' + (y + bobY).toFixed(1) + 'px, 0) ' +
              'scale(' + itemScale.toFixed(3) + ') rotate(' + tiltDeg.toFixed(1) + 'deg)';
            m.el.style.transformOrigin = 'center bottom';
          }
        }

        function renderFX() {
          for (var i = 0; i < pebbles.length; i++) {
            var p = pebbles[i];
            p.el.style.transform =
              'translate3d(' + p.x.toFixed(1) + 'px, ' + p.y.toFixed(1) + 'px, 0) rotate(' + p.rot.toFixed(1) + 'deg)';
          }

          for (var j = 0; j < flowers.length; j++) {
            var f = flowers[j];
            var bloom = reducedMotion ? Math.min(1, f.age / 0.25) : Math.min(1, f.age / 0.22);
            var scale = reducedMotion ? 1 : (0.3 + 0.7 * bloom);
            var alpha = 1;
            if (reducedMotion && f.age < 0.25) {
              alpha = f.age / 0.25;
            } else if (f.age > SCENE_CONFIG.FLOWER_STAY_SEC) {
              alpha = Math.max(0, 1 - (f.age - SCENE_CONFIG.FLOWER_STAY_SEC) / SCENE_CONFIG.FLOWER_FADE_SEC);
            }
            f.el.style.opacity = alpha.toFixed(2);
            f.el.style.transform =
              'translate3d(' + f.x.toFixed(1) + 'px, ' + f.y.toFixed(1) + 'px, 0) scale(' + scale.toFixed(2) + ')';
          }

          for (var k = 0; k < pops.length; k++) {
            var pop = pops[k];
            var ratio = pop.age / pop.life;
            var dy = reducedMotion ? 0 : (-34 * ratio);
            var opacity = ratio < 0.2 ? (ratio / 0.2) : Math.max(0, 1 - (ratio - 0.2) / 0.8);
            pop.el.style.opacity = opacity.toFixed(2);
            pop.el.style.transform =
              'translate3d(' + (pop.x - 28).toFixed(1) + 'px, ' + (pop.y + dy).toFixed(1) + 'px, 0)';
          }

          for (var m = 0; m < fadingMonsters.length; m++) {
            var fm = fadingMonsters[m];
            var fa = Math.max(0, 1 - fm.age / SCENE_CONFIG.REDUCED_FADE_SEC);
            fm.el.style.opacity = fa.toFixed(2);
          }

          if (rmToastEl) {
            if (flagToastTimer > 0) {
              var ta = flagToastTimer < 0.3 ? flagToastTimer / 0.3 : 1;
              rmToastEl.style.opacity = ta.toFixed(2);
            } else {
              rmToastEl.style.opacity = '0';
            }
          }
        }

        function renderAll() {
          renderParallax();
          renderDino();
          renderMonsters();
          renderFX();
        }

        /* ---------------------------------------------------------------------
           單一物理與動畫更新核心（嚴格使用時間差 dt）
           --------------------------------------------------------------------- */
        function tick(dt) {
          elapsed += dt;

          // 1. 三層紙片背景緩慢視差捲動（reduced-motion 靜止）
          if (!reducedMotion) {
            var tileW = SCENE_CONFIG.PARALLAX_TILE_W;
            parallax.clouds = (parallax.clouds + SCENE_CONFIG.PARALLAX_SPEED.clouds * dt) % tileW;
            parallax.hills = (parallax.hills + SCENE_CONFIG.PARALLAX_SPEED.hills * dt) % tileW;
            parallax.bushes = (parallax.bushes + SCENE_CONFIG.PARALLAX_SPEED.bushes * dt) % tileW;
          }

          // 2. 更新角色與提示倒數計時器
          if (dinoState.whipTimer > 0) dinoState.whipTimer = Math.max(0, dinoState.whipTimer - dt);
          if (dinoState.hurtTimer > 0) dinoState.hurtTimer = Math.max(0, dinoState.hurtTimer - dt);
          if (flagToastTimer > 0) flagToastTimer = Math.max(0, flagToastTimer - dt);

          // 3. 更新石頭怪前進速度（遵守第 6、9 條與本關規則）
          var leadTravelSec = SCENE_CONFIG.LEAD_TRAVEL_SEC[getTier()];
          var leadDistance = 1 - SCENE_CONFIG.QUEUE_FRONT_PROGRESS; // 2/3 全程
          var leadSpeed = leadDistance / leadTravelSec;             // 每秒進度增量
          var queueSpeed = leadSpeed * SCENE_CONFIG.QUEUE_SPEED_RATIO;
          var minGapP = getMinGapProgress();

          for (var i = 0; i < monsters.length; i++) {
            var m = monsters[i];

            if (m.fadeIn < 1) {
              m.fadeIn = Math.min(1, m.fadeIn + dt / SCENE_CONFIG.REDUCED_FADE_SEC);
            }
            if (m.teaseTimer > 0) {
              m.teaseTimer = Math.max(0, m.teaseTimer - dt);
            }

            if (i === 0) {
              // 最前面那隻朝小恐龍前進
              m.p += (m.p < 0.02 ? Math.max(leadSpeed, SCENE_CONFIG.OFFSCREEN_ENTRY_SPEED) : leadSpeed) * dt;   // 還在畫面外就快速走進來

              // 走到恐龍面前：撞恐龍一下（> < 眼）、扣愛心、退回隊伍最前面起點重走（字不變）
              if (m.p >= 1) {
                dinoState.hurtTimer = SCENE_CONFIG.DINO_HURT_SEC;
                spawnPop('碰！', metrics.hitX - 10, metrics.groundY - 105 * metrics.scale, 'bonk');
                m.p = SCENE_CONFIG.QUEUE_FRONT_PROGRESS;
                m.teaseTimer = 0;
                api.loseLife();
              }
            } else {
              // 排隊中的石頭怪慢慢跟，最多只前進到各自排隊上限（不超過全程 1/3）
              var cap = getSlotCapProgress(i);
              var behindPrevCap = monsters[i - 1].p - minGapP;
              var limit = Math.min(cap, behindPrevCap);
              if (m.p < limit) {
                m.p = Math.min(limit, m.p + (m.p < 0.02 ? Math.max(queueSpeed, SCENE_CONFIG.OFFSCREEN_ENTRY_SPEED) : queueSpeed) * dt);
              }
            }
          }

          // 4. 更新彈飛小石子，落地時綻放成小花
          for (var pIdx = pebbles.length - 1; pIdx >= 0; pIdx--) {
            var pb = pebbles[pIdx];
            pb.vy += SCENE_CONFIG.PEBBLE_GRAVITY * dt;
            pb.x += pb.vx * dt;
            pb.y += pb.vy * dt;
            pb.rot += pb.vrot * dt;

            if (pb.y >= pb.landY) {
              var flowerX = Math.max(metrics.hitX + 20, Math.min(metrics.w - 24, pb.x));
              spawnFlower(flowerX, pb.landY);
              pb.el.remove();
              pebbles.splice(pIdx, 1);
            }
          }

          // 5. 更新路邊小花壽命
          for (var fIdx = flowers.length - 1; fIdx >= 0; fIdx--) {
            var fl = flowers[fIdx];
            fl.age += dt;
            if (fl.age >= fl.totalLife) {
              fl.el.remove();
              flowers.splice(fIdx, 1);
            }
          }

          // 6. 更新飄浮文字與星星
          for (var popIdx = pops.length - 1; popIdx >= 0; popIdx--) {
            var pop = pops[popIdx];
            pop.age += dt;
            if (pop.age >= pop.life) {
              pop.el.remove();
              pops.splice(popIdx, 1);
            }
          }

          // 7. 更新 reduced-motion 淡出中的怪獸
          for (var fmIdx = fadingMonsters.length - 1; fmIdx >= 0; fmIdx--) {
            var fm = fadingMonsters[fmIdx];
            fm.age += dt;
            if (fm.age >= SCENE_CONFIG.REDUCED_FADE_SEC) {
              fm.el.remove();
              fadingMonsters.splice(fmIdx, 1);
            }
          }

          renderAll();
        }

        function frame(now) {
          if (!running) return;
          var dt = Math.min(Math.max(now - lastTime, 0), SCENE_CONFIG.MAX_DT_MS) / 1000;
          lastTime = now;
          tick(dt);
          if (running) {
            rafId = requestAnimationFrame(frame);
          }
        }

        function stopLoop() {
          running = false;
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = 0;
          }
        }

        /* ---------------------------------------------------------------------
           回傳給共用核心的場景控制物件
           --------------------------------------------------------------------- */
        return {
          start: function () {
            buildSceneDOM();
            measureField();
            updateRoadmapUI();
            renderAll();
          },

          roundStart: function (roundNo) {
            if (!mounted) buildSceneDOM();
            measureField();
            clearAllDynamicEntities();

            // 第 1 回合開局時歸零冒險進度，後續回合累計插旗更有成就感
            if (!roundNo || roundNo <= 1) {
              totalHits = 0;
              flagCount = 0;
            }
            updateRoadmapUI();
            syncMonsters();
            renderAll();
          },

          resume: function () {
            if (running) return;
            running = true;
            lastTime = performance.now();
            rafId = requestAnimationFrame(frame);
          },

          pause: function () {
            // 停掉 rAF；場內無任何 setTimeout / setInterval / CSS 動畫，達成完全靜止
            stopLoop();
          },

          stop: function () {
            stopLoop();
          },

          hit: function (res) {
            var count = (res && res.correct > 0) ? res.correct : 1;
            var combo = (res && res.combo) ? res.combo : api.combo();

            // 小恐龍開心甩尾
            dinoState.hurtTimer = 0;
            dinoState.whipTimer = SCENE_CONFIG.DINO_WHIP_SEC;

            // 移除前面打對的石頭怪，化成小石子彈飛並落地變小花
            for (var i = 0; i < count && monsters.length > 0; i++) {
              var defeated = monsters.shift();
              var mx = progressToX(defeated.p);
              var my = metrics.groundY;

              if (reducedMotion) {
                // 減少動態模式：原本怪獸柔和淡出，再長小花
                defeated.el.classList.remove('sc-lead');
                fadingMonsters.push({ el: defeated.el, age: 0 });
              } else {
                defeated.el.remove();
              }

              spawnDefeatEffect(mx, my);

              if (i === 0) {
                var popText = combo >= 3 ? ('★ ✓ +' + count + ' 連擊 ' + combo) : ('★ ✓ +' + count);
                // 顯示在略高處，不擋住下一隻要打的字卡
                spawnPop(popText, mx, Math.max(52, my - 154 * metrics.scale), 'hit');
              }
            }

            // 更新上方冒險進度：每打對 1 字前進 1 格，每 15 字到休息站插旗
            var prevFlags = Math.floor(totalHits / SCENE_CONFIG.STATION_STEPS);
            totalHits += count;
            var newFlags = Math.floor(totalHits / SCENE_CONFIG.STATION_STEPS);
            if (newFlags > prevFlags) {
              flagCount = newFlags;
              flagToastTimer = SCENE_CONFIG.FLAG_TOAST_SEC;
              if (rmToastEl) {
                rmToastEl.textContent = '第 ' + flagCount + ' 座休息站插旗！';
              }
            }
            updateRoadmapUI();

            // 依 api.upcoming 補上新的石頭怪並立刻重繪
            syncMonsters();
            renderAll();
          },

          miss: function () {
            // 最前面的石頭怪做鬼臉吐舌頭，不扣血、不閃紅全畫面
            if (monsters[0]) {
              monsters[0].teaseTimer = SCENE_CONFIG.MONSTER_TEASE_SEC;
              renderMonsters();
            }
          },

          resize: function () {
            if (!mounted) return;
            measureField();
            renderAll();
          }
        };
      }
    });
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
</body></html>
