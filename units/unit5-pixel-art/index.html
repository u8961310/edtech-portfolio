<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素藝術小畫家 - 一年級創作</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; overflow-x: hidden; }
    body {
        font-family: 'Noto Sans TC', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        background: linear-gradient(180deg, #fef9c3 0%, #fde68a 100%);
        color: #78350f;
        min-height: 100vh;
        touch-action: none;
    }

    .screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .hidden { display: none !important; }

    /* ===== Title ===== */
    .title-emoji {
        font-size: clamp(80px, 14vw, 140px);
        animation: bounce 1.6s ease-in-out infinite;
    }
    @keyframes bounce {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(-18px) rotate(3deg); }
    }
    .title-text {
        font-size: clamp(34px, 5.5vw, 52px);
        font-weight: 900;
        text-shadow: 4px 4px 0 #fff, 6px 6px 0 #92400e44;
        margin: 8px 0 4px;
        text-align: center;
    }
    .subtitle {
        font-size: clamp(16px, 2vw, 22px);
        color: #92400e;
        font-weight: 700;
        margin-bottom: 24px;
        text-align: center;
    }

    /* ===== Big Button ===== */
    .big-btn {
        font-family: 'Noto Sans TC', sans-serif;
        font-size: clamp(20px, 2.6vw, 28px);
        font-weight: 900;
        padding: 14px 32px;
        background: linear-gradient(180deg, #fbbf24, #f59e0b);
        color: white;
        border: none;
        border-radius: 999px;
        box-shadow: 0 5px 0 #b45309, 0 8px 16px rgba(0,0,0,0.15);
        cursor: pointer;
        transition: transform 0.1s;
        text-shadow: 2px 2px 0 #92400e;
        margin: 6px;
    }
    .big-btn:hover { transform: translateY(-2px); }
    .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b45309; }
    .big-btn.secondary {
        background: linear-gradient(180deg, #60a5fa, #3b82f6);
        box-shadow: 0 5px 0 #1d4ed8;
        text-shadow: 2px 2px 0 #1e40af;
    }
    .big-btn.green {
        background: linear-gradient(180deg, #4ade80, #16a34a);
        box-shadow: 0 5px 0 #15803d;
        text-shadow: 2px 2px 0 #14532d;
    }
    .big-btn.gray {
        background: linear-gradient(180deg, #d1d5db, #9ca3af);
        box-shadow: 0 5px 0 #4b5563;
        text-shadow: 2px 2px 0 #4b5563;
    }

    /* ===== Mode Cards ===== */
    .mode-grid {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 16px 0;
    }
    .mode-card {
        background: white;
        border: 4px solid #fbbf24;
        border-radius: 24px;
        padding: 24px 28px;
        cursor: pointer;
        text-align: center;
        min-width: 200px;
        transition: transform 0.15s;
        box-shadow: 0 6px 0 #f59e0b;
    }
    .mode-card:hover { transform: translateY(-4px); }
    .mode-card:active { transform: translateY(2px); box-shadow: 0 4px 0 #f59e0b; }
    .mode-card .mode-emoji { font-size: 56px; margin-bottom: 6px; }
    .mode-card .mode-name { font-size: 22px; font-weight: 900; color: #78350f; }
    .mode-card .mode-desc { font-size: 14px; color: #92400e; margin-top: 4px; }

    /* ===== Template Picker ===== */
    .template-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 16px;
        max-width: 720px;
        width: 100%;
        margin: 12px 0;
    }
    .template-card {
        background: white;
        border: 3px solid #fbbf24;
        border-radius: 16px;
        padding: 12px;
        cursor: pointer;
        text-align: center;
        transition: transform 0.15s;
        box-shadow: 0 4px 0 #f59e0b;
    }
    .template-card:hover { transform: translateY(-3px); }
    .template-card:active { transform: translateY(2px); box-shadow: 0 2px 0 #f59e0b; }
    .template-card .preview {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 0;
        aspect-ratio: 1 / 1;
        margin-bottom: 8px;
        border: 2px solid #d1d5db;
    }
    .template-card .preview div {
        background: var(--c, transparent);
    }
    .template-card .tname { font-weight: 900; font-size: 16px; color: #78350f; }

    /* ===== Game Layout ===== */
    #game-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 14px 24px;
        gap: 12px;
    }
    .game-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 720px;
        gap: 12px;
        flex-wrap: wrap;
    }
    .top-info {
        background: rgba(255,255,255,0.85);
        padding: 8px 16px;
        border-radius: 999px;
        font-weight: 900;
        font-size: clamp(16px, 2vw, 20px);
        color: #78350f;
    }
    .reference-card {
        display: flex;
        align-items: center;
        gap: 10px;
        background: white;
        border: 3px solid #fbbf24;
        border-radius: 16px;
        padding: 8px 14px;
    }
    .reference-card .preview {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        width: 96px;
        height: 96px;
        border: 1px solid #d1d5db;
    }
    .reference-card .preview div {
        background: var(--c, transparent);
    }
    .reference-card .ref-name {
        font-weight: 900;
        font-size: 16px;
        color: #78350f;
    }

    /* ===== Canvas Grid ===== */
    .canvas-wrap {
        background: white;
        border: 4px solid #78350f;
        border-radius: 12px;
        padding: 4px;
        box-shadow: 0 8px 0 #fbbf24, 0 12px 16px rgba(0,0,0,0.15);
    }
    #canvas {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        grid-template-rows: repeat(12, 1fr);
        gap: 1px;
        width: min(72vw, 56vh, 540px);
        aspect-ratio: 1 / 1;
        background: #d1d5db;
    }
    .cell {
        background: white;
        cursor: crosshair;
        transition: background 0.05s;
        touch-action: none;
    }
    .cell:hover { box-shadow: inset 0 0 0 2px rgba(0,0,0,0.2); }

    /* ===== Tool Bar ===== */
    .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: center;
        background: white;
        padding: 12px 16px;
        border-radius: 16px;
        border: 3px solid #fbbf24;
        box-shadow: 0 4px 0 #f59e0b;
        max-width: 720px;
    }
    .color-btn {
        width: clamp(36px, 6vw, 48px);
        height: clamp(36px, 6vw, 48px);
        border-radius: 50%;
        border: 3px solid #78350f;
        cursor: pointer;
        transition: transform 0.1s;
        position: relative;
    }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn.active {
        transform: scale(1.2);
        box-shadow: 0 0 0 3px #fde047, 0 0 12px rgba(253,224,71,0.8);
    }
    .tool-btn {
        font-family: 'Noto Sans TC', sans-serif;
        background: linear-gradient(180deg, #e5e7eb, #9ca3af);
        border: 3px solid #4b5563;
        color: #1f2937;
        font-weight: 900;
        font-size: clamp(14px, 1.8vw, 18px);
        padding: 8px 16px;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 3px 0 #4b5563;
        transition: transform 0.1s;
    }
    .tool-btn:hover { transform: translateY(-1px); }
    .tool-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #4b5563; }
    .tool-btn.active {
        background: linear-gradient(180deg, #fde047, #fbbf24);
        border-color: #b45309;
        box-shadow: 0 3px 0 #b45309;
    }
    .tool-btn.danger {
        background: linear-gradient(180deg, #fca5a5, #ef4444);
        border-color: #991b1b;
        color: white;
        box-shadow: 0 3px 0 #991b1b;
    }

    /* ===== Action Buttons (below toolbar) ===== */
    .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 4px;
    }

    /* ===== Result Banner ===== */
    .result-banner {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 80;
        animation: fade-in 0.3s ease-out;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .result-card {
        background: linear-gradient(135deg, #fef3c7, #fde68a);
        border: 8px solid #f59e0b;
        border-radius: 24px;
        padding: 28px 40px;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 16px 32px rgba(0,0,0,0.3);
    }
    .result-trophy { font-size: clamp(64px, 12vw, 96px); }
    .result-title { font-size: clamp(28px, 4vw, 40px); font-weight: 900; color: #92400e; margin: 6px 0; }
    .result-score {
        font-size: clamp(48px, 7vw, 72px);
        font-weight: 900;
        color: #b91c1c;
        text-shadow: 3px 3px 0 #fff;
    }
    .result-rank { font-size: clamp(20px, 2.6vw, 26px); font-weight: 900; color: #7c2d12; margin: 8px 0; }
    .result-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    /* ===== Free-mode save dialog ===== */
    .save-banner {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 80;
    }
</style>
</head>
<body>
<a href="../../index.html" class="kogao-home-btn" style="position:fixed;top:10px;left:10px;z-index:99999;background:rgba(255,255,255,.92);border:2px solid #f59e0b;color:#b45309;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.15)">🏠 首頁</a>

<!-- ===== Start Screen ===== -->
<div id="start-screen" class="screen">
    <div class="title-emoji">🎨🖼️</div>
    <h1 class="title-text">像素藝術小畫家</h1>
    <p class="subtitle">一格一格塗顏色，畫出你的作品！</p>

    <div class="mode-grid">
        <div class="mode-card" onclick="enterTemplateMode()">
            <div class="mode-emoji">📋</div>
            <div class="mode-name">照範本</div>
            <div class="mode-desc">挑一個圖案開始塗</div>
        </div>
        <div class="mode-card" onclick="enterFreeMode()">
            <div class="mode-emoji">🎨</div>
            <div class="mode-name">自由創作</div>
            <div class="mode-desc">空白畫布隨便畫</div>
        </div>
    </div>
</div>

<!-- ===== Template Picker ===== -->
<div id="template-screen" class="screen hidden">
    <h1 class="title-text" style="font-size: clamp(28px, 4vw, 40px);">📋 選一個圖案</h1>
    <div class="template-grid" id="template-grid"></div>
    <button class="big-btn gray" onclick="backToStart()">← 返回</button>
</div>

<!-- ===== Game Screen ===== -->
<div id="game-screen" class="hidden">
    <div class="game-top">
        <div class="top-info" id="top-mode">🎨 自由創作</div>
        <div class="reference-card hidden" id="reference-card">
            <div class="preview" id="reference-preview"></div>
            <div class="ref-name" id="reference-name">範本</div>
        </div>
    </div>

    <div class="canvas-wrap">
        <div id="canvas"></div>
    </div>

    <div class="toolbar" id="toolbar"></div>

    <div class="actions">
        <button class="tool-btn danger" onclick="clearCanvas()">🗑️ 清空</button>
        <button class="big-btn green hidden" id="check-btn" onclick="checkResult()">✅ 完成！比對</button>
        <button class="big-btn secondary" onclick="backToStart()">← 返回</button>
    </div>
</div>

<script>
'use strict';

// ============================================================
// Constants
// ============================================================
const SIZE = 12;
const COLORS = [
    null,           // 0 = blank/white
    '#ef4444',      // 1 red
    '#f97316',      // 2 orange
    '#fbbf24',      // 3 yellow
    '#22c55e',      // 4 green
    '#3b82f6',      // 5 blue
    '#a855f7',      // 6 purple
    '#ec4899',      // 7 pink
    '#92400e',      // 8 brown
    '#1f2937',      // 9 black
];

const TEMPLATES = [
    {
        name: '愛心',
        emoji: '❤️',
        pixels: [
            '............',
            '............',
            '.11..11.....',
            '11111111....',
            '111111111...',
            '.11111111...',
            '..1111111...',
            '...11111....',
            '....111.....',
            '.....1......',
            '............',
            '............',
        ],
    },
    {
        name: '星星',
        emoji: '⭐',
        pixels: [
            '............',
            '......3.....',
            '.....333....',
            '....33333...',
            '..333333333.',
            '.3333333333.',
            '..33333333..',
            '...333333...',
            '..3333.333..',
            '..333...33..',
            '.33......3..',
            '............',
        ],
    },
    {
        name: '蘋果',
        emoji: '🍎',
        pixels: [
            '............',
            '.....88.....',
            '.....4......',
            '...11..11...',
            '..11111111..',
            '.1111111111.',
            '.1111111111.',
            '.1111111111.',
            '.1111111111.',
            '..11111111..',
            '...111111...',
            '............',
        ],
    },
    {
        name: '小魚',
        emoji: '🐟',
        pixels: [
            '............',
            '............',
            '............',
            '.....5......',
            '...5555.....',
            '.555555559..',
            '5555555599..',
            '.555555559..',
            '...5555.....',
            '.....5......',
            '............',
            '............',
        ],
    },
    {
        name: '小樹',
        emoji: '🌳',
        pixels: [
            '............',
            '......4.....',
            '.....444....',
            '....44444...',
            '...4444444..',
            '..444444444.',
            '.44444444444',
            '...4444444..',
            '......8.....',
            '......8.....',
            '......8.....',
            '............',
        ],
    },
    {
        name: '小屋',
        emoji: '🏠',
        pixels: [
            '............',
            '......1.....',
            '.....111....',
            '....11111...',
            '...1111111..',
            '..111111111.',
            '.88888888888',
            '.88333888888',
            '.88333888888',
            '.88888888888',
            '.88888888888',
            '............',
        ],
    },
];

// ============================================================
// State
// ============================================================
const state = {
    mode: 'free',       // 'free' | 'template'
    template: null,     // current template object
    color: 1,           // current color index (1-9) or 0 for eraser
    canvas: new Array(SIZE * SIZE).fill(0),
    painting: false,
};

const $ = (id) => document.getElementById(id);

// ============================================================
// Build canvas
// ============================================================
function buildCanvas() {
    const c = $('canvas');
    c.innerHTML = '';
    for (let i = 0; i < SIZE * SIZE; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.idx = i;
        c.appendChild(cell);
    }
}

function paintCellByIdx(idx) {
    if (idx < 0 || idx >= SIZE * SIZE) return;
    state.canvas[idx] = state.color;
    const cell = $('canvas').children[idx];
    cell.style.background = state.color === 0 ? 'white' : COLORS[state.color];
}

function clearCanvas() {
    state.canvas.fill(0);
    [...$('canvas').children].forEach(cell => cell.style.background = 'white');
}

// ============================================================
// Toolbar
// ============================================================
function buildToolbar() {
    const tb = $('toolbar');
    tb.innerHTML = '';
    // Eraser
    const eraser = document.createElement('button');
    eraser.className = 'tool-btn';
    eraser.id = 'eraser-btn';
    eraser.textContent = '🩹 橡皮擦';
    eraser.onclick = () => selectColor(0);
    tb.appendChild(eraser);

    // Color buttons (1-9)
    for (let i = 1; i < COLORS.length; i++) {
        const btn = document.createElement('button');
        btn.className = 'color-btn';
        btn.style.backgroundColor = COLORS[i];
        btn.dataset.color = i;
        btn.onclick = () => selectColor(i);
        btn.title = '顏色 ' + i;
        tb.appendChild(btn);
    }
    selectColor(1);
}

function selectColor(idx) {
    state.color = idx;
    [...$('toolbar').children].forEach(el => el.classList.remove('active'));
    if (idx === 0) {
        $('eraser-btn').classList.add('active');
    } else {
        const btn = $('toolbar').querySelector(`[data-color="${idx}"]`);
        if (btn) btn.classList.add('active');
    }
}

// ============================================================
// Templates
// ============================================================
function templatePixelAt(template, idx) {
    const r = Math.floor(idx / SIZE);
    const c = idx % SIZE;
    const ch = template.pixels[r][c];
    return ch === '.' ? 0 : parseInt(ch, 10);
}

function buildTemplatePicker() {
    const grid = $('template-grid');
    grid.innerHTML = '';
    TEMPLATES.forEach((t, i) => {
        const card = document.createElement('div');
        card.className = 'template-card';
        card.onclick = () => startTemplate(i);

        const preview = document.createElement('div');
        preview.className = 'preview';
        for (let p = 0; p < SIZE * SIZE; p++) {
            const cell = document.createElement('div');
            const c = templatePixelAt(t, p);
            cell.style.setProperty('--c', c === 0 ? 'white' : COLORS[c]);
            preview.appendChild(cell);
        }
        card.appendChild(preview);

        const name = document.createElement('div');
        name.className = 'tname';
        name.textContent = `${t.emoji} ${t.name}`;
        card.appendChild(name);

        grid.appendChild(card);
    });
}

function renderReference(template) {
    const refCard = $('reference-card');
    const preview = $('reference-preview');
    const nameEl = $('reference-name');
    refCard.classList.remove('hidden');
    preview.innerHTML = '';
    for (let p = 0; p < SIZE * SIZE; p++) {
        const c = templatePixelAt(template, p);
        const cell = document.createElement('div');
        cell.style.setProperty('--c', c === 0 ? 'white' : COLORS[c]);
        preview.appendChild(cell);
    }
    nameEl.textContent = `${template.emoji} ${template.name}`;
}

// ============================================================
// Mode flow
// ============================================================
function enterTemplateMode() {
    $('start-screen').classList.add('hidden');
    $('template-screen').classList.remove('hidden');
    buildTemplatePicker();
}

function enterFreeMode() {
    state.mode = 'free';
    state.template = null;
    $('start-screen').classList.add('hidden');
    $('template-screen').classList.add('hidden');
    $('game-screen').classList.remove('hidden');
    $('top-mode').textContent = '🎨 自由創作';
    $('reference-card').classList.add('hidden');
    $('check-btn').classList.add('hidden');
    buildCanvas();
    buildToolbar();
    clearCanvas();
}

function startTemplate(index) {
    state.mode = 'template';
    state.template = TEMPLATES[index];
    $('template-screen').classList.add('hidden');
    $('start-screen').classList.add('hidden');
    $('game-screen').classList.remove('hidden');
    $('top-mode').textContent = `📋 範本：${state.template.emoji} ${state.template.name}`;
    $('check-btn').classList.remove('hidden');
    renderReference(state.template);
    buildCanvas();
    buildToolbar();
    clearCanvas();
}

function backToStart() {
    $('game-screen').classList.add('hidden');
    $('template-screen').classList.add('hidden');
    $('start-screen').classList.remove('hidden');
    closeResult();
}

// ============================================================
// Check result (template mode)
// ============================================================
function checkResult() {
    if (state.mode !== 'template' || !state.template) return;
    let match = 0;
    for (let i = 0; i < SIZE * SIZE; i++) {
        const want = templatePixelAt(state.template, i);
        const got = state.canvas[i];
        if (want === got) match++;
    }
    const pct = Math.round((match / (SIZE * SIZE)) * 100);

    try {
        const prev = parseInt(localStorage.getItem('edtech-unit5-score') || '0', 10);
        if (pct > prev) localStorage.setItem('edtech-unit5-score', pct);
    } catch (e) { /* localStorage unavailable */ }

    let trophy = '💪', rank = '🥉 多多練習就會越來越棒！';
    if (pct === 100) { trophy = '👑'; rank = '🏆 完美！神級小畫家'; }
    else if (pct >= 85) { trophy = '🥇'; rank = '🥇 太棒了！畫家小能手'; }
    else if (pct >= 70) { trophy = '🥈'; rank = '🥈 不錯喔！繼續加油'; }
    else if (pct >= 50) { trophy = '🥉'; rank = '🥉 加油！再細心一點'; }

    showResult(trophy, `${state.template.emoji} ${state.template.name}`, pct, rank);
}

function showResult(trophy, name, score, rank) {
    const banner = document.createElement('div');
    banner.className = 'result-banner';
    banner.id = 'result-banner';
    banner.innerHTML = `
        <div class="result-card">
            <div class="result-trophy">${trophy}</div>
            <div class="result-title">${name}</div>
            <div class="result-score">${score}%</div>
            <div class="result-rank">${rank}</div>
            <div class="result-actions">
                <button class="big-btn green" onclick="closeResult()">🔄 繼續修改</button>
                <button class="big-btn secondary" onclick="backToStart()">📋 換一張</button>
            </div>
        </div>
    `;
    document.body.appendChild(banner);
}

function closeResult() {
    const b = $('result-banner');
    if (b) b.remove();
}

// ============================================================
// Pointer painting (mouse + touch)
// ============================================================
function setupCanvasPainting() {
    const canvas = $('canvas');
    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (e.target.classList.contains('cell')) {
            state.painting = true;
            paintCellByIdx(parseInt(e.target.dataset.idx, 10));
            canvas.setPointerCapture(e.pointerId);
        }
    });
    canvas.addEventListener('pointermove', (e) => {
        if (!state.painting) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        if (el && el.classList.contains('cell')) {
            paintCellByIdx(parseInt(el.dataset.idx, 10));
        }
    });
    canvas.addEventListener('pointerup', () => state.painting = false);
    canvas.addEventListener('pointercancel', () => state.painting = false);
    canvas.addEventListener('pointerleave', () => state.painting = false);
}

// Setup once after DOM ready
setupCanvasPainting();
</script>
