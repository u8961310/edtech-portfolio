<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小兔勇者 - 滑鼠島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="../../assets/css/mouse-island.css">
  <style>
    /* 場景樣式：class 一律 sc- 開頭 */
    .sc-stage {
      position: absolute; inset: 0; overflow: hidden;
      user-select: none; -webkit-user-select: none;
      color: #33261B;
    }
    .sc-bg { position: absolute; inset: 0; pointer-events: none; }
    .sc-bg svg { width: 100%; height: 100%; display: block; }

    /* 右上角資訊列：場景名 + 計數 + 愛心 */
    .sc-hud {
      position: absolute; right: 20px; top: 14px; z-index: 25;
      display: flex; align-items: center; gap: 10px;
      pointer-events: none;
    }
    .sc-stage-tag {
      padding: 6px 16px; border-radius: 14px;
      background: #236F96; color: #FFF8E4;
      border: 2px solid #6E4125;
      font-size: 20px; font-weight: 700;
      box-shadow: 0 3px 0 rgba(51, 38, 27, 0.22);
    }
    .sc-stage-tag.is-forest { background: #2F7A49; }
    .sc-stage-tag.is-cave { background: #9A5F36; }
    .sc-stage-tag.is-castle { background: #236F96; }
    .sc-count {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 16px; border-radius: 14px;
      background: #FFF8E4; color: #33261B;
      border: 2px solid #B9794A;
      font-size: 22px; font-weight: 900;
      box-shadow: 0 3px 0 rgba(110, 65, 37, 0.2);
    }
    .sc-hearts {
      display: inline-flex; align-items: center; gap: 3px;
    }
    .sc-heart { width: 22px; height: 22px; display: block; transition: transform .25s, opacity .25s; }
    .sc-heart.is-off { opacity: 0.22; transform: scale(0.8); }

    /* 上方中間：招式卡 */
    .sc-card-wrap {
      position: absolute; left: 50%; top: 10px; z-index: 24;
      transform: translateX(-50%);
      perspective: 800px;
    }
    .sc-card {
      display: flex; align-items: center; gap: 14px;
      min-width: 310px; height: 84px; padding: 8px 22px 8px 14px;
      background: #FFF8E4; border: 3px solid #6E4125; border-radius: 20px;
      box-shadow: 0 5px 0 #9A5F36, 0 8px 16px rgba(51, 38, 27, 0.16);
      transform-style: preserve-3d;
    }
    .sc-card.is-flip { animation: scCardFlip 0.44s ease-out; }
    @keyframes scCardFlip {
      0% { transform: rotateY(-90deg) scale(0.86); opacity: 0.4; }
      60% { transform: rotateY(10deg) scale(1.04); opacity: 1; }
      100% { transform: rotateY(0deg) scale(1); opacity: 1; }
    }
    .sc-card-icon {
      width: 62px; height: 62px; flex-shrink: 0;
      border-radius: 14px; border: 2px solid #6E4125;
      display: flex; align-items: center; justify-content: center;
      background: #F6E7BE;
    }
    .sc-card-icon svg { width: 52px; height: 52px; display: block; }
    .sc-card-info { display: flex; flex-direction: column; gap: 4px; }
    .sc-card-name {
      font-size: 26px; font-weight: 900; line-height: 1.15; color: #33261B;
    }
    .sc-card-act {
      display: inline-block; align-self: flex-start;
      padding: 2px 12px; border-radius: 999px;
      font-size: 18px; font-weight: 700; line-height: 1.2;
      color: #FFF8E4;
    }
    .sc-card.sk-point .sc-card-act { background: #F2B134; color: #33261B; border: 1.5px solid #6E4125; }
    .sc-card.sk-click .sc-card-act { background: #C2432A; }
    .sc-card.sk-dblclick .sc-card-act { background: #236F96; }
    .sc-card.sk-drag .sc-card-act { background: #2F7A49; }

    /* 右下方：小兔勇者 */
    .sc-rabbit {
      position: absolute; right: 44px; bottom: 24px; z-index: 18;
      width: 176px; height: 196px;
      transform-origin: center bottom;
      transition: transform 0.2s;
    }
    .sc-rabbit svg { width: 100%; height: 100%; display: block; }
    .sc-rabbit.is-act { animation: scRabbitAct 0.42s ease-out; }
    @keyframes scRabbitAct {
      0% { transform: translate(0, 0) scale(1); }
      35% { transform: translate(-24px, -16px) rotate(-8deg) scale(1.06); }
      100% { transform: translate(0, 0) scale(1); }
    }
    .sc-rabbit.is-cheer { animation: scBounce 0.9s ease-in-out infinite; }
    @keyframes scBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    /* 小兔喊招式飄字 */
    .sc-shout {
      position: absolute; right: 165px; bottom: 188px; z-index: 26;
      padding: 6px 18px; border-radius: 16px;
      background: #F2B134; color: #33261B;
      border: 3px solid #6E4125;
      font-size: 24px; font-weight: 900;
      box-shadow: 0 4px 0 rgba(110, 65, 37, 0.35);
      pointer-events: none;
      animation: scShoutUp 0.85s ease-out forwards;
    }
    @keyframes scShoutUp {
      0% { transform: translateY(10px) scale(0.75); opacity: 0; }
      22% { transform: translateY(-8px) scale(1.08); opacity: 1; }
      75% { transform: translateY(-28px) scale(1); opacity: 1; }
      100% { transform: translateY(-48px) scale(0.95); opacity: 0; }
    }

    /* 怪物目標 */
    .sc-monster {
      position: absolute; z-index: 15;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 0.2s ease-out, opacity 0.3s;
    }
    .sc-monster-body {
      width: 100%; height: 100%; position: relative;
      transform-origin: center center;
    }
    .sc-monster-body svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .sc-face-silly, .sc-face-happy { display: none; }
    .sc-monster.is-silly .sc-face-norm { display: none; }
    .sc-monster.is-silly .sc-face-silly { display: inline; }
    .sc-monster.is-happy .sc-face-norm,
    .sc-monster.is-happy .sc-face-silly { display: none; }
    .sc-monster.is-happy .sc-face-happy { display: inline; }

    /* 怪物被打中：打噴嚏/轉圈變朋友 */
    .sc-monster.is-hit-spin .sc-monster-body { animation: scSpinFriend 0.72s ease-out forwards; }
    @keyframes scSpinFriend {
      0% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.16, 0.86) rotate(-14deg); }
      65% { transform: scale(1.06) rotate(360deg) translateY(-26px); }
      100% { transform: scale(0.9) rotate(360deg) translateY(-16px); opacity: 0.95; }
    }
    .sc-monster.is-first-tap .sc-monster-body { animation: scTapBump 0.24s ease-out; }
    @keyframes scTapBump {
      0% { transform: scale(1); }
      45% { transform: scale(1.12, 0.9); }
      100% { transform: scale(1); }
    }

    /* 指指光：草叢／暗處遮罩與探照燈 */
    .sc-hide-mask {
      position: absolute; inset: -6%; pointer-events: none;
      transition: transform 0.35s ease-out, opacity 0.35s;
    }
    .sc-hide-mask svg { width: 100%; height: 100%; display: block; }
    .sc-monster.is-revealed .sc-hide-mask {
      transform: translateY(34px) scale(0.7); opacity: 0;
    }
    .sc-lamp-glow {
      position: absolute; inset: -16%; border-radius: 50%;
      pointer-events: none; opacity: 0;
      background: radial-gradient(circle, rgba(242, 177, 52, 0.52) 0%, rgba(255, 248, 228, 0.25) 55%, transparent 72%);
      border: 4px dashed #6E4125;
      transition: opacity 0.2s, transform 0.2s;
      transform: scale(0.86);
    }
    .sc-monster.is-point-mode:hover .sc-lamp-glow,
    .sc-monster.is-revealed .sc-lamp-glow {
      opacity: 1; transform: scale(1);
    }

    /* 拖拖盾模式：怪物身上的瞄準圈 */
    .sc-drop-ring {
      position: absolute; inset: -14%; border-radius: 50%;
      border: 5px dashed #2F7A49;
      background: rgba(242, 177, 52, 0.14);
      pointer-events: none; opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
    }
    .sc-monster.is-drop-ready .sc-drop-ring { opacity: 1; }
    .sc-monster.is-drop-active .sc-drop-ring {
      opacity: 1; transform: scale(1.08);
      border-color: #C2432A; background: rgba(242, 177, 52, 0.28);
    }

    /* 魔王專屬帽子與動作 */
    .sc-boss-hat {
      transform-origin: 110px 72px;
      transform: rotate(var(--hat-rot, -6deg));
      transition: transform 0.35s cubic-bezier(.34, 1.56, .64, 1);
    }
    .sc-monster.is-sneeze .sc-monster-body { animation: scBossSneeze 0.56s ease-out; }
    @keyframes scBossSneeze {
      0% { transform: scale(1) translateY(0); }
      28% { transform: scale(0.92, 1.12) translateY(-14px) rotate(-6deg); }
      55% { transform: scale(1.18, 0.84) translateY(10px) rotate(8deg); }
      100% { transform: scale(1) translateY(0) rotate(0deg); }
    }
    .sc-monster.is-bow .sc-monster-body { animation: scBossBow 0.9s ease-in-out forwards; }
    @keyframes scBossBow {
      0% { transform: translateY(0) rotate(0deg); }
      45% { transform: translateY(14px) scale(1.04, 0.92) rotate(12deg); }
      100% { transform: translateY(6px) scale(1) rotate(0deg); }
    }
    .sc-monster.is-bow .sc-boss-hat {
      transform: translate(62px, 84px) rotate(42deg) scale(0.86);
    }

    /* 拖拖盾的盾牌 */
    .sc-shield {
      position: absolute; left: 990px; top: 438px; z-index: 20;
      width: 118px; height: 126px; margin: -63px 0 0 -59px;
      cursor: grab; touch-action: none;
      transition: opacity 0.22s;
    }
    .sc-shield:active { cursor: grabbing; }
    .sc-shield svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 5px 0 rgba(110, 65, 37, 0.3)); }
    .sc-shield.is-gone { opacity: 0; pointer-events: none; }

    /* 第三段：彩虹泡󠇡泡󠇡怪 */
    .sc-rainbow {
      position: absolute; z-index: 21;
      width: 96px; height: 96px; margin: -48px 0 0 -48px;
      cursor: pointer;
    }
    .sc-rainbow svg { width: 100%; height: 100%; display: block; }
    .sc-rainbow.is-caught {
      pointer-events: none;
      animation: scPopStar 0.55s ease-out forwards;
    }
    @keyframes scPopStar {
      0% { transform: scale(1); opacity: 1; }
      40% { transform: scale(1.35) rotate(24deg); opacity: 1; }
      100% { transform: scale(0.3) translateY(-60px); opacity: 0; }
    }

    /* 第三段：小火球干擾物（點到無效果、不算失手） */
    .sc-decoy {
      position: absolute; z-index: 14;
      width: 56px; height: 56px; margin: -28px 0 0 -28px;
      cursor: default;
    }
    .sc-decoy svg { width: 100%; height: 100%; display: block; }

    /* 攻擊／搞笑／變朋友特效 */
    .sc-fx {
      position: absolute; z-index: 23; pointer-events: none;
      transform: translate(-50%, -50%);
      animation: scFxPop 0.65s ease-out forwards;
    }
    .sc-fx svg { width: 100%; height: 100%; display: block; }
    @keyframes scFxPop {
      0% { transform: translate(-50%, -50%) scale(0.45); opacity: 0; }
      30% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.42) translateY(-20px); opacity: 0; }
    }

    /* 最後歡呼：怪物朋友群（放在 x >= 580 避開左下寄寄區） */
    .sc-friends {
      position: absolute; left: 576px; right: 224px; bottom: 26px; height: 132px; z-index: 19;
      display: flex; align-items: flex-end; justify-content: center; gap: 12px;
      pointer-events: none;
    }
    .sc-friend {
      width: 74px; height: 74px; flex-shrink: 0;
      animation: scFriendHop 1.05s ease-in-out infinite;
    }
    .sc-friend:nth-child(2n) { animation-delay: 0.22s; }
    .sc-friend:nth-child(3n) { animation-delay: 0.44s; }
    .sc-friend svg { width: 100%; height: 100%; display: block; }
    @keyframes scFriendHop {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-16px) rotate(4deg); }
    }

    /* 小兔勇者證書（置中偏上：y 82~386，完全避開左下寄寄區 y > 400） */
    .sc-cert {
      position: absolute; left: 50%; top: 80px; z-index: 30;
      transform: translateX(-50%);
      width: 560px; padding: 22px 28px 24px;
      background: #FFF8E4;
      border: 5px solid #9A5F36;
      border-radius: 26px;
      box-shadow: 0 0 0 4px #F2B134, 0 12px 28px rgba(51, 38, 27, 0.28);
      text-align: center;
      animation: scCertIn 0.45s cubic-bezier(.22, 1.25, .45, 1) forwards;
    }
    @keyframes scCertIn {
      0% { transform: translateX(-50%) scale(0.75) translateY(-18px); opacity: 0; }
      100% { transform: translateX(-50%) scale(1) translateY(0); opacity: 1; }
    }
    .sc-cert-badge { width: 68px; height: 68px; margin: 0 auto 6px; }
    .sc-cert-badge svg { width: 100%; height: 100%; display: block; }
    .sc-cert-title {
      font-size: 32px; font-weight: 900; color: #33261B;
      margin: 0 0 10px; line-height: 1.25;
    }
    .sc-cert-desc {
      font-size: 22px; font-weight: 700; color: #6B5A48;
      margin: 0 0 18px; line-height: 1.45;
    }
    .sc-cert-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 220px; height: 60px; padding: 0 32px;
      background: #2F7A49; color: #FFF8E4;
      border: 3px solid #6E4125; border-radius: 16px;
      font-size: 24px; font-weight: 900;
      box-shadow: 0 4px 0 #6E4125;
      cursor: pointer;
    }
    .sc-cert-btn:hover { filter: brightness(1.06); }
    .sc-cert-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #6E4125; }

    /* 尊重減少動態偏好 */
    @media (prefers-reduced-motion: reduce) {
      .sc-card.is-flip,
      .sc-rabbit.is-act,
      .sc-rabbit.is-cheer,
      .sc-shout,
      .sc-monster.is-hit-spin .sc-monster-body,
      .sc-monster.is-first-tap .sc-monster-body,
      .sc-monster.is-sneeze .sc-monster-body,
      .sc-monster.is-bow .sc-monster-body,
      .sc-rainbow.is-caught,
      .sc-fx,
      .sc-friend,
      .sc-cert {
        animation: none !important;
      }
      .sc-monster, .sc-hide-mask, .sc-lamp-glow, .sc-drop-ring, .sc-boss-hat, .sc-heart {
        transition: none !important;
      }
    }
  </style>
</head><body>

            monsterEl.classList.add('is-silly');
            api.later(function () {
              if (monsterEl) monsterEl.classList.remove('is-silly');
            }, 680);
          }
          api.miss();
        }

        // 移除盾牌
        function removeShield() {
          if (shieldEl && shieldEl.parentNode) shieldEl.parentNode.removeChild(shieldEl);
          shieldEl = null;
        }

        // 掛載目前目標與招式卡對應的單一偵測（一律透過 api.on）
        function bindCurrentSkill() {
          clearTargetOffs();
          removeShield();
          if (!monsterEl) return;

          // 清除上次招式的附加視覺狀態
          monsterEl.classList.remove('is-point-mode', 'is-revealed', 'is-drop-ready', 'is-drop-active');
          var oldMask = monsterEl.querySelector('.sc-hide-mask');
          if (oldMask) oldMask.parentNode.removeChild(oldMask);
          var oldLamp = monsterEl.querySelector('.sc-lamp-glow');
          if (oldLamp) oldLamp.parentNode.removeChild(oldLamp);
          var oldRing = monsterEl.querySelector('.sc-drop-ring');
          if (oldRing) oldRing.parentNode.removeChild(oldRing);

          api.glow(monsterEl, false);

          if (currentSkill === 'point') {
            monsterEl.classList.add('is-point-mode');
            var lamp = document.createElement('div');
            lamp.className = 'sc-lamp-glow';
            monsterEl.appendChild(lamp);

            var mask = document.createElement('div');
            mask.className = 'sc-hide-mask';
            mask.innerHTML = stage === 2 ? CLOAK_MASK_SVG : BUSH_MASK_SVG;
            monsterEl.appendChild(mask);

            targetOffs.push(api.on(monsterEl, 'point', {
              ok: function () {
                if (busy) return;
                monsterEl.classList.add('is-revealed');
                onTargetHit();
              },
              leave: function () {}
            }, { dwell: 500 }));
          } else if (currentSkill === 'click') {
            targetOffs.push(api.on(monsterEl, 'click', {
              ok: function () {
                if (busy) return;
                onTargetHit();
              },
              wrong: function () {
                triggerMiss();
              }
            }));
          } else if (currentSkill === 'dblclick') {
            targetOffs.push(api.on(monsterEl, 'dblclick', {
              first: function () {
                if (busy || !monsterEl) return;
                api.sfx('pop');
                monsterEl.classList.remove('is-first-tap');
                void monsterEl.offsetWidth;
                monsterEl.classList.add('is-first-tap');
              },
              ok: function () {
                if (busy) return;
                onTargetHit();
              },
              single: function () {
                triggerMiss();
              }
            }));
          } else if (currentSkill === 'drag') {
            monsterEl.classList.add('is-drop-ready');
            var ring = document.createElement('div');
            ring.className = 'sc-drop-ring';
            monsterEl.appendChild(ring);

            shieldEl = document.createElement('div');
            shieldEl.className = 'sc-shield';
            shieldEl.innerHTML = SHIELD_SVG;
            stageEl.appendChild(shieldEl);

            targetOffs.push(api.on(shieldEl, 'drag', {
              start: function () {
                dragSlow = 0.35;
                if (monsterEl) monsterEl.classList.add('is-drop-active');
                api.sfx('pop');
              },
              move: function () {},
              drop: function (pos, target) {
                dragSlow = 1;
                if (monsterEl) monsterEl.classList.remove('is-drop-active');
                if (busy) return;
                if (target === monsterEl) {
                  if (shieldEl) shieldEl.classList.add('is-gone');
                  spawnFx(mob.x, mob.y, FX_SHIELD_SVG, 160);
                  onTargetHit();
                } else {
                  triggerMiss(shieldEl);
                }
              },
              tap: function () {
                dragSlow = 1;
                if (monsterEl) monsterEl.classList.remove('is-drop-active');
                triggerMiss(shieldEl);
              }
            }, { targets: [monsterEl] }));
          }
        }

        // 重播目前招式的發光／示範
        function runHintDemo(withDemo) {
          if (certBtnEl) {
            api.glow(certBtnEl, true);
            if (withDemo) api.demo(certBtnEl, 'click');
            return;
          }
          if (!monsterEl) return;
          if (currentSkill === 'drag' && shieldEl) {
            api.glow(shieldEl, true);
            if (withDemo) api.demo(shieldEl, 'drag', { to: monsterEl });
          } else {
            api.glow(monsterEl, true);
            if (withDemo) api.demo(monsterEl, SKILLS[currentSkill].demo);
          }
        }

        // 生成普通怪物（第一、二段）
        function spawnNormalMonster() {
          busy = false;
          if (monsterEl && monsterEl.parentNode) monsterEl.parentNode.removeChild(monsterEl);
          monsterEl = null;

          var cfg = api.cfg();
          var sk = skillQueue[stepIdx];
          if (assistOn && sk === 'dblclick') sk = 'click';
          currentMonsterKey = monsterQueue[stepIdx];

          renderSkillCard(sk);
          updateHud();

          var baseSize = stage === 0 ? 200 : 138;
          mob.baseSize = baseSize;

          if (stage === 0) {
            // 第一段：中間偏上、不動，乾淨清楚
            mob.x = 683;
            mob.y = 262;
            mob.baseY = 262;
            mob.vx = 0;
            mob.active = false;
          } else {
            // 第二段：安全區慢慢飄（絕不進左下寄寄區 x < 560 && y > 400）
            mob.minX = 250;
            mob.maxX = 830;
            mob.x = 300 + Math.random() * 480;
            mob.baseY = 236 + Math.random() * 46;
            mob.y = mob.baseY;
            mob.phase = Math.random() * Math.PI * 2;
            var dir = Math.random() < 0.5 ? -1 : 1;
            mob.vx = (assistOn || reducedMotion) ? 0 : dir * 48 * (cfg.speed || 1);
            mob.active = true;
          }

          monsterEl = document.createElement('div');
          monsterEl.className = 'sc-monster';
          monsterEl.style.width = baseSize + 'px';
          monsterEl.style.height = baseSize + 'px';
          monsterEl.innerHTML = '<div class="sc-monster-body">' + MONSTER_SVGS[currentMonsterKey] + '</div>';
          stageEl.appendChild(monsterEl);
          applyMonsterTransform();

          bindCurrentSkill();

          // 第一段每隻出現時先 glow＋demo 該招式
          if (stage === 0) {
            api.later(function () {
              if (!busy && monsterEl) runHintDemo(true);
            }, 260);
          }
        }

        // 生成第三段魔王與干擾小火球
        function spawnBoss() {
          busy = false;
          bossHp = 6;
          hatTilt = -6;
          rainbowShown = false;

          var cfg = api.cfg();
          var sk = skillQueue[0];
          if (assistOn && sk === 'dblclick') sk = 'click';
          renderSkillCard(sk);
          updateHud();

          mob.baseSize = 210;
          mob.minX = 290;
          mob.maxX = 860;
          mob.x = 620;
          mob.baseY = 248;
          mob.y = 248;
          mob.phase = 0;
          mob.vx = (assistOn || reducedMotion) ? 0 : 86 * (cfg.speed || 1);
          mob.active = true;

          monsterEl = document.createElement('div');
          monsterEl.className = 'sc-monster sc-boss';
          monsterEl.style.width = mob.baseSize + 'px';
          monsterEl.style.height = mob.baseSize + 'px';
          monsterEl.style.setProperty('--hat-rot', hatTilt + 'deg');
          monsterEl.innerHTML = '<div class="sc-monster-body">' + BOSS_SVG + '</div>';
          stageEl.appendChild(monsterEl);
          applyMonsterTransform();

          // 2 顆小火球干擾物（點到無效果、不算失手）
          for (var i = 0; i < 2; i++) {
            var d = document.createElement('div');
            d.className = 'sc-decoy';
            d.innerHTML = FIREBALL_SVG;
            stageEl.appendChild(d);
            decoys.push({ el: d, angle: i * Math.PI, rx: 145, ry: 44 });
          }

          bindCurrentSkill();
        }

        // 第三段中途飛過的彩虹泡󠇡泡󠇡怪（按一下即可收集並 hit）
        function spawnRainbow() {
          if (rainbowShown || !stageEl) return;
          rainbowShown = true;

          var cfg = api.cfg();
          rainbowEl = document.createElement('div');
          rainbowEl.className = 'sc-rainbow';
          rainbowEl.innerHTML = RAINBOW_SVG;

          var rScale = Math.max(0.85, cfg.size || 1);
          rainbowMob.x = reducedMotion ? 320 : 140;
          rainbowMob.y = 178;
          rainbowMob.vx = reducedMotion ? 0 : 108 * (cfg.speed || 1);
          rainbowMob.active = true;

          rainbowEl.style.left = rainbowMob.x + 'px';
          rainbowEl.style.top = rainbowMob.y + 'px';
          rainbowEl.style.transform = 'scale(' + rScale + ')';
          stageEl.appendChild(rainbowEl);

          var rbOff = api.on(rainbowEl, 'click', {
            ok: function () {
              if (!rainbowEl || rainbowEl.classList.contains('is-caught')) return;
              rainbowMob.active = false;
              rainbowEl.classList.add('is-caught');
              api.sfx('gem');
              spawnFx(rainbowMob.x, rainbowMob.y, FX_STAR_SVG, 110);
              api.collect('rainbow');
              if (stageFriends.indexOf('rainbow') === -1) stageFriends.push('rainbow');
              api.hit();
              rbOff();
              api.later(function () {
                if (rainbowEl && rainbowEl.parentNode) rainbowEl.parentNode.removeChild(rainbowEl);
                rainbowEl = null;
              }, 580);
            }
          });
          offs.push(rbOff);

          // 若開啟減少動態，停留 6.5 秒後淡出
          if (reducedMotion) {
            api.later(function () {
              if (rainbowEl && !rainbowEl.classList.contains('is-caught')) {
                rainbowMob.active = false;
                if (rainbowEl.parentNode) rainbowEl.parentNode.removeChild(rainbowEl);
                rainbowEl = null;
                rbOff();
              }
            }, 6500);
          }
        }

        // 打中目標後的反應
        function onTargetHit() {
          busy = true;
          clearTargetOffs();
          if (monsterEl) api.glow(monsterEl, false);
          if (shieldEl) api.glow(shieldEl, false);

          playRabbitAct(currentSkill);
          api.sfx('ok');
          spawnFx(mob.x, mob.y - 10, FX_STAR_SVG, 130);

          if (stage < 2) {
            // 第一、二段：怪物打噴嚏/轉圈變朋友 → 收集＋hit
            api.hit();
            api.collect(currentMonsterKey);
            if (stageFriends.indexOf(currentMonsterKey) === -1) stageFriends.push(currentMonsterKey);

            if (monsterEl) {
              monsterEl.classList.add('is-happy', 'is-hit-spin');
            }
            api.later(function () {
              removeShield();
              stepIdx++;
              if (stepIdx >= STAGE_META[stage].total) {
                api.stageDone();
              } else {
                spawnNormalMonster();
              }
            }, reducedMotion ? 360 : 760);
          } else {
            // 第三段：魔王愛心 -1，打噴嚏、帽子越來越歪
            bossHp--;
            api.hit();
            updateHud();

            var tilts = [14, -20, 28, -34, 42, 52];
            hatTilt = tilts[Math.min(5, 6 - bossHp - 1)] || 36;
            if (monsterEl) {
              monsterEl.style.setProperty('--hat-rot', hatTilt + 'deg');
              monsterEl.classList.remove('is-sneeze');
              void monsterEl.offsetWidth;
              monsterEl.classList.add('is-sneeze');
            }

            // 第 3 次打中後（約第 4 個目標時機）派出彩虹泡󠇡泡󠇡怪飛過
            if (bossHp === 3 && !rainbowShown) {
              api.later(spawnRainbow, 450);
            }

            if (bossHp > 0) {
              api.later(function () {
                removeShield();
                stepIdx++;
                var nextSk = skillQueue[stepIdx % skillQueue.length];
                if (assistOn && nextSk === 'dblclick') nextSk = 'click';
                renderSkillCard(nextSk);
                busy = false;
                bindCurrentSkill();
              }, reducedMotion ? 320 : 620);
            } else {
              // 最後一顆愛心打掉：魔王投降鞠躬變朋友 → 怪物朋友歡呼＋證書
              onBossDefeated();
            }
          }
        }

        // 打敗魔王：摘帽鞠躬、大家歡呼、出示小兔勇者證書
        function onBossDefeated() {
          mob.active = false;
          removeShield();
          decoys.forEach(function (d) { if (d.el.parentNode) d.el.parentNode.removeChild(d.el); });
          decoys = [];
          if (cardWrap) cardWrap.innerHTML = '';

          api.sfx('gem');
          api.collect('boss');

          if (monsterEl) {
            monsterEl.classList.remove('is-point-mode', 'is-drop-ready', 'is-drop-active', 'is-sneeze');
            monsterEl.classList.add('is-happy', 'is-bow');
            // 把變朋友的魔王移到右上方稍作展示再加入朋友歡呼
            mob.x = 1130;
            mob.y = 225;
            applyMonsterTransform();
          }
          if (rabbitEl) rabbitEl.classList.add('is-cheer');

          // 大家一起出來歡呼（已收集的怪物朋友，最多排 7 隻）
          var allFriends = (api.collected() || []).slice();
          stageFriends.forEach(function (k) { if (allFriends.indexOf(k) === -1) allFriends.push(k); });
          if (allFriends.indexOf('boss') === -1) allFriends.push('boss');
          if (allFriends.length < 4) {
            NORMAL_KEYS.forEach(function (k) { if (allFriends.length < 4 && allFriends.indexOf(k) === -1) allFriends.push(k); });
          }

          var friendsRow = document.createElement('div');
          friendsRow.className = 'sc-friends';
          allFriends.slice(0, 7).forEach(function (k) {
            if (!DEX_SVGS[k]) return;
            var item = document.createElement('div');
            item.className = 'sc-friend';
            item.innerHTML = DEX_SVGS[k];
            friendsRow.appendChild(item);
          });
          stageEl.appendChild(friendsRow);

          // 顯示「小兔勇者證書」卡，點了「收下證書」才 stageDone
          api.later(function () {
            var cert = document.createElement('div');
            cert.className = 'sc-cert';
            cert.innerHTML =
              '<div class="sc-cert-badge">' + CERT_BADGE_SVG + '</div>' +
              '<h2 class="sc-cert-title mi-zy">小兔勇者證書</h2>' +
              '<p class="sc-cert-desc mi-zy">你學會指向、單擊、雙擊、拖拉</p>' +
              '<button type="button" class="sc-cert-btn mi-zy">收下證書</button>';
            stageEl.appendChild(cert);

            certBtnEl = cert.querySelector('.sc-cert-btn');
            offs.push(api.on(certBtnEl, 'click', {
              ok: function () {
                if (!certBtnEl) return;
                api.glow(certBtnEl, false);
                certBtnEl = null;
                api.sfx('gem');
                api.say('你會用滑鼠玩電腦了！');   // 連回真的電腦（11-22 萌典核過）
                api.later(function () { api.stageDone(); }, 2600);
              }
            }));
          }, reducedMotion ? 200 : 650);
        }

        // 動畫主迴圈（移動怪物、魔王、干擾火球與彩虹泡󠇡泡󠇡怪）
        function startLoop() {
          var last = performance.now();
          (function loop(now) {
            var dt = Math.min(0.05, (now - last) / 1000);
            last = now;

            if (mob.active && monsterEl && !busy) {
              mob.x += mob.vx * dragSlow * dt;
              if (mob.x < mob.minX) { mob.x = mob.minX; mob.vx = Math.abs(mob.vx); }
              if (mob.x > mob.maxX) { mob.x = mob.maxX; mob.vx = -Math.abs(mob.vx); }
              if (!reducedMotion && mob.vx !== 0) {
                mob.phase += dt * 2.2;
                mob.y = mob.baseY + Math.sin(mob.phase) * (stage === 1 ? 16 : 10);
              }
              applyMonsterTransform();
            }

            // 第三段小火球干擾物繞魔王飄動（確保不進入寄寄區 y > 400）
            if (stage === 2 && decoys.length && monsterEl) {
              decoys.forEach(function (d) {
                if (!reducedMotion) d.angle += dt * 1.45;
                var fx = mob.x + Math.cos(d.angle) * d.rx;
                var fy = Math.min(350, Math.max(135, mob.y + Math.sin(d.angle) * d.ry));
                d.el.style.left = fx + 'px';
                d.el.style.top = fy + 'px';
              });
            }

            // 彩虹泡󠇡泡󠇡怪橫越上方安全區
            if (rainbowMob.active && rainbowEl) {
              rainbowMob.x += rainbowMob.vx * dt;
              var ry = rainbowMob.y + (reducedMotion ? 0 : Math.sin(now / 360) * 14);
              rainbowEl.style.left = rainbowMob.x + 'px';
              rainbowEl.style.top = ry + 'px';
              if (rainbowMob.x > 1280) {
                rainbowMob.active = false;
                if (rainbowEl.parentNode) rainbowEl.parentNode.removeChild(rainbowEl);
                rainbowEl = null;
              }
            }

            raf = requestAnimationFrame(loop);
          })(last);
        }

        return {
          start: function (stg, cfg) {
            clearAll();
            stage = stg;
            stepIdx = 0;
            assistOn = !!(cfg && cfg.assist);
            stageFriends = [];

            var meta = STAGE_META[stage];
            api.field.innerHTML =
              '<div class="sc-stage">' +
                '<div class="sc-bg">' + BG_SVGS[stage] + '</div>' +
                '<div class="sc-hud">' +
                  '<div class="sc-stage-tag ' + meta.cls + ' mi-zy">' + meta.name + '</div>' +
                  '<div class="sc-count"></div>' +
                '</div>' +
                '<div class="sc-card-wrap"></div>' +
                '<div class="sc-rabbit">' + RABBIT_SVG + '</div>' +
              '</div>';

            stageEl = api.field.querySelector('.sc-stage');
            cardWrap = api.field.querySelector('.sc-card-wrap');
            countEl = api.field.querySelector('.sc-count');
            rabbitEl = api.field.querySelector('.sc-rabbit');

            // 準備該段的招式與怪物序列
            if (stage === 0) {
              skillQueue = ['point', 'click', 'dblclick', 'drag'];
              monsterQueue = buildMonsterQueue(4);
            } else if (stage === 1) {
              skillQueue = buildSkillList(5);
              monsterQueue = buildMonsterQueue(5);
            } else {
              skillQueue = buildSkillList(6);
            }

            // 戰場空白處點擊偵測（沒按到目標、或在拖拖盾時直接點怪物 → 失手搞笑反應；干擾物點到無效果）
            offs.push(api.on(api.field, 'click', {
              ok: function (pos, e) {
                if (busy || certBtnEl) return;
                var t = e.target;
                if (t.closest('.sc-decoy, .sc-rainbow, .sc-card, .sc-hud, .sc-rabbit, .sc-cert')) return;
                if (currentSkill === 'drag') {
                  // 拖拖盾時點盾牌由 drag.tap 處理；直接點怪物或空白處都算用錯招
                  if (t.closest('.sc-shield')) return;
                  triggerMiss(shieldEl);
                  return;
                }
                // 其他招式點到怪物交給怪物本身偵測（指指光不因誤點怪物判錯）
                if (t.closest('.sc-monster')) return;
                triggerMiss();
              }
            }));

            if (stage < 2) {
              spawnNormalMonster();
            } else {
              spawnBoss();
            }
            startLoop();
          },

          hint: function (level) {
            if (busy && !certBtnEl) return;
            runHintDemo(level === 2);
          },

          assist: function () {
            assistOn = true;
            // 停止移動、放大目標
            mob.vx = 0;
            applyMonsterTransform();
            // 雙擊拳卡在 assist 時改成點點拳
            if (currentSkill === 'dblclick' && monsterEl && !busy) {
              renderSkillCard('click');
              bindCurrentSkill();
            }
            runHintDemo(false);
          },

          stop: clearAll
        };
      }
    });
  })();
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
</body></html>
