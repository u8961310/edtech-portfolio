<!doctype html><html lang="zh-Hant"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>魔法字彈極速覺醒 - 打字島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Fredoka:wght@500;600&display=swap">
  <link rel="stylesheet" href="../../assets/css/typing-island.css">
  <style>
    /* ============================================================
       魔法字彈極速覺醒 — 繪本剪紙風場景樣式（全部以 sc- 開頭）
       ============================================================ */
    .sc-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background: linear-gradient(180deg, var(--sky-soft) 0%, #EAF5FB 42%, var(--card) 80%, var(--paper) 100%);
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    }

    /* 暫停時凍結所有 CSS 動畫與過渡，確保場景完全靜止 */
    .sc-stage.sc-paused,
    .sc-stage.sc-paused * {
      animation-play-state: paused !important;
      transition: none !important;
    }

    /* 繪本暖紙微紋理（不搶前景字） */
    .sc-paper-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(94, 72, 56, 0.045) 1px, transparent 1px),
        radial-gradient(rgba(201, 166, 107, 0.06) 1px, transparent 1px);
      background-size: 22px 22px, 31px 31px;
      background-position: 0 0, 11px 13px;
    }

    /* 遠景剪紙層：魔法學院尖塔、雲朵、星星貼紙 */
    .sc-bg-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .sc-bg-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 頂端兩側三角彩旗（柔和微風輕擺，週期 6 秒，遠低於 3Hz） */
    .sc-bunting-left,
    .sc-bunting-right {
      position: absolute;
      top: -2px;
      width: 24%;
      max-width: 300px;
      min-width: 150px;
      height: 54px;
      pointer-events: none;
      transform-origin: top center;
      animation: sc-bunting-sway 6s ease-in-out infinite alternate;
    }
    .sc-bunting-left { left: -4px; }
    .sc-bunting-right { right: -4px; animation-delay: -2.2s; }

    @keyframes sc-bunting-sway {
      from { transform: rotate(-1.1deg); }
      to   { transform: rotate(1.1deg); }
    }

    /* 魔力覺醒狀態小紙貼紙徽章（放在左上彩旗下，不擋泡泡） */
    .sc-awaken-badge {
      position: absolute;
      left: 14px;
      bottom: 10px;   /* 放欄杆區：上方是泡泡掉落區，放上面會蓋住要打的字 */
      z-index: 16;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 10px 14px 12px 8px;
      background: var(--butter-soft);
      border: 2px solid var(--kraft-2);
      color: var(--ink-1);
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 3px 0 rgba(94, 72, 56, 0.16);
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .sc-stage.sc-awakened .sc-awaken-badge {
      opacity: 1;
      transform: translateY(0);
    }
    .sc-awaken-bar {
      width: 48px;
      height: 7px;
      border-radius: 99px;
      background: rgba(94, 72, 56, 0.16);
      overflow: hidden;
    }
    .sc-awaken-bar-fill {
      height: 100%;
      width: 100%;
      background: var(--peach-dk);
      border-radius: 99px;
      transform-origin: left center;
    }

    /* 陽台欄杆（底線＝扣愛心線） */
    .sc-balcony {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      pointer-events: none;
    }
    .sc-rail-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      border-top: 3px dashed var(--berry-dk);
    }
    .sc-rail-tag {
      position: absolute;
      right: 14px;
      top: -27px;
      padding: 2px 10px;
      border-radius: 8px 10px 6px 8px;
      background: rgba(255, 248, 230, 0.92);
      border: 1.5px solid var(--kraft-2);
      color: var(--berry-dk);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 0 rgba(94, 72, 56, 0.1);
      white-space: nowrap;
    }
    .sc-rail-top {
      position: absolute;
      left: 0;
      right: 0;
      top: 2px;
      height: 11px;
      background: var(--kraft);
      border-top: 2px solid var(--ink-2);
      border-bottom: 2px solid var(--ink-2);
      box-shadow: inset 0 2px 0 rgba(255, 248, 230, 0.55);
    }
    .sc-rail-body {
      position: absolute;
      left: 0;
      right: 0;
      top: 13px;
      bottom: 0;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 34px,
          var(--kraft) 34px,
          var(--kraft) 46px,
          var(--kraft-2) 46px,
          var(--kraft-2) 49px,
          transparent 49px,
          transparent 66px
        ),
        linear-gradient(180deg, rgba(247, 232, 203, 0.82) 0%, var(--card-2) 60%, var(--kraft) 100%);
      border-bottom: 4px solid var(--kraft-2);
    }

    /* 欄杆上的可愛墨漬層（回合結束清除） */
    .sc-splat-layer {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
    }
    .sc-splat {
      position: absolute;
      width: 46px;
      height: 30px;
      margin-left: -23px;
      margin-top: -10px;
      pointer-events: none;
    }

    /* 小狐狸魔法師（z-index 低於泡泡，絕不遮擋字） */
    .sc-fox-wrap {
      position: absolute;
      left: 0;
      bottom: 2px;
      width: 98px;
      height: 102px;
      margin-left: -49px;
      z-index: 6;
      pointer-events: none;
      will-change: transform;
    }
    .sc-fox-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    /* 帽子柔和光暈：覺醒時平順亮起，無高頻閃爍 */
    .sc-hat-glow {
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .sc-stage.sc-awakened .sc-hat-glow {
      opacity: 0.92;
      animation: sc-glow-breathe 2.6s ease-in-out infinite alternate;
    }
    @keyframes sc-glow-breathe {
      from { opacity: 0.65; }
      to   { opacity: 0.95; }
    }

    /* 小狐狸覺醒對話框（「魔力覺醒！」顯示 2 秒） */
    .sc-fox-speech {
      position: absolute;
      bottom: 62px;
      left: 84px;
      z-index: 15;
      padding: 5px 12px;
      border-radius: 12px 14px 14px 4px;
      background: var(--butter-soft);
      border: 2.5px solid var(--ink-1);
      color: var(--ink-1);
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 3px 0 rgba(59, 42, 32, 0.16);
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
    }
    .sc-fox-speech.sc-speech-left {
      left: auto;
      right: 84px;
      border-radius: 14px 12px 4px 14px;
    }
    .sc-fox-speech.sc-speech-show {
      opacity: 1;
      transform: scale(1);
    }

    /* 調皮墨水泡泡層 */
    .sc-bubble-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    /* 單顆墨水泡泡：高明度粉嫩柔和底＋深咖啡字（對比 > 10:1） */
    .sc-bubble {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 52% 48% 50% 50% / 50% 52% 48% 50%;
      border: 3px solid var(--kraft-2);
      background: rgba(255, 248, 230, 0.92);
      box-shadow:
        inset -6px -8px 0 rgba(201, 166, 107, 0.14),
        inset 4px 5px 0 rgba(255, 255, 255, 0.85),
        0 4px 0 rgba(94, 72, 56, 0.14);
      color: var(--ink-1);
      opacity: 0.88;
      will-change: transform, opacity;
    }

    /* 泡泡反光高光點（繪本水彩質感） */
    .sc-bubble::before {
      content: '';
      position: absolute;
      left: 16%;
      top: 11%;
      width: 18px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.82);
      transform: rotate(-24deg);
      pointer-events: none;
    }
    .sc-bubble::after {
      content: '';
      position: absolute;
      left: 11%;
      top: 24%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.78);
      pointer-events: none;
    }

    /* 柔和泡泡色盤（皆為極淺柔和底，保證深色字對比 ≥ 10:1） */
    .sc-bubble-tone-0 { background: rgba(230, 245, 253, 0.94); border-color: #7BB4D6; }
    .sc-bubble-tone-1 { background: rgba(255, 238, 226, 0.94); border-color: #E3A080; }
    .sc-bubble-tone-2 { background: rgba(232, 247, 228, 0.94); border-color: #8BC480; }
    .sc-bubble-tone-3 { background: rgba(255, 246, 209, 0.94); border-color: #D9B75E; }
    .sc-bubble-tone-4 { background: rgba(244, 236, 252, 0.94); border-color: #B49BD4; }

    /* 目前要打的目標：天藍粗框＋天藍虛線瞄準圈，最清晰顯眼 */
    .sc-bubble.sc-bubble-active {
      z-index: 12;
      opacity: 1;
      background: var(--card);
      border: 4px solid var(--sky-dk);
      outline: 3.5px dashed var(--sky-dk);
      outline-offset: 6px;
      box-shadow:
        inset 0 -6px 0 rgba(31, 107, 156, 0.1),
        0 6px 0 rgba(31, 107, 156, 0.18);
    }

    /* 覺醒期間第二個泡泡的暖金預告樣式（純視覺提示下一個，對比 > 11:1） */
    .sc-bubble.sc-bubble-gold {
      z-index: 11;
      opacity: 0.98;
      background: var(--butter-soft);
      border: 3.5px solid #C88A1E;
      box-shadow:
        0 0 0 4px rgba(255, 217, 102, 0.55),
        0 5px 0 rgba(168, 114, 24, 0.22);
    }
    .sc-gold-tag {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 1px 8px;
      border-radius: 99px;
      background: var(--butter);
      border: 1.5px solid var(--ink-1);
      color: var(--ink-1);
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.3;
      white-space: nowrap;
      display: none;
    }
    .sc-bubble.sc-bubble-gold .sc-gold-tag {
      display: block;
    }

    /* 打錯時的溫和標示（紅框＋✗ 徽章，不閃整場） */
    .sc-bubble.sc-bubble-miss {
      border-color: var(--berry-dk);
      background: #FFF0EE;
      outline-color: var(--berry);
    }
    .sc-miss-badge {
      position: absolute;
      top: -12px;
      right: -10px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--berry);
      border: 2px solid var(--card);
      color: #FFFFFF;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-size: 16px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 0 rgba(179, 38, 43, 0.35);
    }
    .sc-bubble.sc-bubble-miss .sc-miss-badge {
      display: flex;
    }

    /* 泡泡內的字：中打 var(--f-zh) ≥ 48px；英打 Fredoka/Consolas ≥ 44px */
    .sc-bubble-char {
      display: inline-block;
      line-height: 1;
      color: var(--ink-1);
      white-space: nowrap;
      text-align: center;
      pointer-events: none;
    }
    .sc-stage[data-sc-lang="zh"] .sc-bubble-char {
      font-family: var(--f-zh);
      font-weight: 400;
    }
    .sc-stage[data-sc-lang="zh"][data-sc-tier="t1"] .sc-bubble-char { font-size: 54px; }
    .sc-stage[data-sc-lang="zh"][data-sc-tier="t2"] .sc-bubble-char { font-size: 50px; }
    .sc-stage[data-sc-lang="zh"][data-sc-tier="t3"] .sc-bubble-char { font-size: 48px; }

    .sc-stage[data-sc-lang="en"] .sc-bubble-char {
      font-family: 'Fredoka', Consolas, monospace;
      font-weight: 600;
      text-transform: none;
    }
    .sc-stage[data-sc-lang="en"][data-sc-tier="t1"] .sc-bubble-char { font-size: 50px; }
    .sc-stage[data-sc-lang="en"][data-sc-tier="t2"] .sc-bubble-char { font-size: 48px; }
    .sc-stage[data-sc-lang="en"][data-sc-tier="t3"] .sc-bubble-char { font-size: 46px; }

    /* 特效層：星星字彈、花瓣星星粒子、+1 飄字（皆不擋泡泡互動） */
    .sc-fx-layer {
      position: absolute;
      inset: 0;
      z-index: 14;
      pointer-events: none;
    }
    .sc-shot {
      position: absolute;
      left: 0;
      top: 0;
      width: 26px;
      height: 26px;
      margin-left: -13px;
      margin-top: -13px;
      will-change: transform;
    }
    .sc-particle {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      will-change: transform, opacity;
    }
    .sc-pop-text {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      padding: 2px 9px;
      border-radius: 99px;
      background: rgba(255, 248, 230, 0.94);
      border: 2px solid var(--leaf-dk);
      color: var(--leaf-dk);
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-size: 19px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 2px 0 rgba(45, 122, 56, 0.18);
      pointer-events: none;
    }

    /* 尊重使用者「減少動態效果」偏好設定 */
    @media (prefers-reduced-motion: reduce) {
      .sc-bunting-left,
      .sc-bunting-right,
      .sc-stage.sc-awakened .sc-hat-glow {
        animation: none !important;
      }
      .sc-awaken-badge,
      .sc-hat-glow {
        transition: none !important;
      }
    }
  </style>
</head><body>
  <script src="../../assets/typing/passages.js"></script>
  <script src="../../assets/typing/en-items.js"></script>
  <script src="../../assets/js/typing-core.js"></script>
  <script src="../../assets/js/typing-ui.js"></script>
  <script>
    /* ============================================================
       本關設定與集中常數 SCENE_CONFIG
       ============================================================ */
    var SCENE_CONFIG = {
      // 依難度（tier）設定同畫面目標數量：初階 3、進階 4、高階 5
      bubbleCount: { t1: 3, t2: 4, t3: 5 },
      // 目標從頂端飄到陽台欄杆線所需秒數：初階 >= 14 秒、進階 10 秒、高階 7 秒
      fallSeconds: { t1: 15, t2: 10, t3: 7 },
      // 泡泡外觀尺寸（寬 × 高，px），確保容納 48px 以上國字＋注音或 44px 以上英數
      bubbleSize: {
        t1: { w: 108, h: 94 },
        t2: { w: 102, h: 90 },
        t3: { w: 98, h: 86 }
      },
      // 尚未輪到的目標速度比例與最大前進距離（最多前進全程 1/3）
      waitingSpeedRatio: 1 / 3,
      waitingMaxProgress: 1 / 3,
      // 單幀時間差上限（秒），避免切分頁回來大跳躍
      maxDt: 0.1,
      // 陽台欄杆高度佔場景高度比例與最小值
      railHeightRatio: 0.23,
      railMinHeight: 58,
      railMaxHeight: 80,
      // 覺醒機制：每 10 連擊觸發，持續 6 秒，台詞顯示 2 秒
      awakenEveryCombo: 10,
      awakenDuration: 6.0,
      awakenSpeechDuration: 2.0,
      // 特效與回饋時間（秒）
      shotDuration: 0.22,
      goldArcDuration: 0.26,
      popTextDuration: 0.72,
      missEffectDuration: 0.50,    // 0.5 秒內僅做 1 次柔緩左右來回（2 次/秒，低於 3 次/秒上限）
      foxJumpDuration: 0.30,
      foxMoveSpeed: 9.5,           // 小狐狸跟隨目標的平滑速度係數
      maxSplats: 8,                // 欄杆上最多保留的墨漬數量
      // 泡泡柔和色盤數量（對應 CSS .sc-bubble-tone-0..4）
      bubbleToneCount: 5,
      // 花瓣與星星粒子色票（取自 system.md 色票）
      particleColors: ['#FF9E7A', '#FFD966', '#7CCB6F', '#1F6B9C', '#E4CC9C'],
      // 墨漬可愛深色（取自 system.md 深色系）
      splatColors: ['#3B2A20', '#1F6B9C', '#5E4838']
    };

    TypingIsland.mount({
      unit: 14,
      title: '魔法字彈極速覺醒',
      subtitle: '射擊類・中打／英打',
      langs: ['zh', 'en'],
      homeUrl: '../../index.html',
      scene: function (api) {
        var field = api.field;
        var initialized = false;
        var running = false;
        var rafId = 0;
        var lastTime = 0;
        var clock = 0;             // 場景累積運行時間（暫停時停止）

        // 場景容器參考
        var stageEl = null;
        var balconyEl = null;
        var splatLayer = null;
        var bubbleLayer = null;
        var fxLayer = null;
        var foxWrap = null;
        var foxSpeech = null;
        var awakenBarFill = null;

        // 動態尺寸快取（透過 api.field.clientWidth/Height 計算，不寫死）
        var metrics = { w: 960, h: 300, railY: 230, railH: 70 };

        // 遊戲物件狀態
        var bubbles = [];          // 與 api.upcoming(n) 一一對齊的泡泡清單
        var ghosts = [];           // 打中後等待星彈撞擊或淡出的殘影泡泡
        var shots = [];            // 飛向目標的星星字彈（含覺醒金光弧線）
        var particles = [];        // 爆破小花瓣、小星星、星彈尾跡
        var popTexts = [];         // +1 漂浮文字
        var splats = [];           // 陽台欄杆上的墨漬 DOM
        var toneCursor = 0;        // 泡泡色盤輪替索引

        // 小狐狸魔法師狀態
        var fox = {
          x: 480,
          targetX: 480,
          jumpTimer: 0,
          oopsTimer: 0
        };

        // 魔力覺醒狀態
        var awakenRemain = 0;      // 剩餘覺醒秒數（0 表示未覺醒）
        var speechRemain = 0;      // 「魔力覺醒！」台詞剩餘秒數

        // 偵測 prefers-reduced-motion
        var reduceMotionMQ = (typeof window !== 'undefined' && window.matchMedia)
          ? window.matchMedia('(prefers-reduced-motion: reduce)')
          : null;
        function isReducedMotion() {
          return !!(reduceMotionMQ && reduceMotionMQ.matches);
        }

        // 取得目前難度與語言設定
        function getTier() {
          var t = api.settings && api.settings.tier;
          return (t === 't1' || t === 't2' || t === 't3') ? t : 't1';
        }
        function getLang() {
          return (api.settings && api.settings.lang === 'en') ? 'en' : 'zh';
        }
        function getTargetCount() {
          return SCENE_CONFIG.bubbleCount[getTier()];
        }
        function getBubbleDim() {
          return SCENE_CONFIG.bubbleSize[getTier()];
        }
        function getFallSeconds() {
          return SCENE_CONFIG.fallSeconds[getTier()];
        }

        // 顯示字元：一律使用 display（含破音字 IVS）；空白轉為 ␣；英打保留原始大小寫
        function formatDisplay(item) {
          var d = (item && typeof item.display === 'string') ? item.display : '';
          return d === ' ' ? '␣' : d;
        }

        // 量測 api.field 實際尺寸並更新陽台位置
        function measure() {
          var w = field.clientWidth || 960;
          var h = field.clientHeight || 300;
          var railH = Math.round(h * SCENE_CONFIG.railHeightRatio);
          railH = Math.max(SCENE_CONFIG.railMinHeight, Math.min(SCENE_CONFIG.railMaxHeight, railH));
          metrics.w = w;
          metrics.h = h;
          metrics.railH = railH;
          metrics.railY = h - railH;
          if (balconyEl) {
            balconyEl.style.height = railH + 'px';
          }
          if (stageEl) {
            stageEl.setAttribute('data-sc-lang', getLang());
            stageEl.setAttribute('data-sc-tier', getTier());
          }
        }

        // 計算每個水平槽位（lane）的中心 x 座標，確保同畫面泡泡均勻不重疊
        function laneToX(lane, totalLanes) {
          var dim = getBubbleDim();
          var margin = Math.max(dim.w * 0.5 + 18, metrics.w * 0.11);
          var usable = Math.max(40, metrics.w - margin * 2);
          if (totalLanes <= 1) return metrics.w * 0.5;
          return margin + (usable * lane) / (totalLanes - 1);
        }

        // 計算垂直進度 progress（0..1）對應的泡泡中心 y 座標
        function progressToY(progress) {
          var dim = getBubbleDim();
          var halfH = dim.h * 0.5;
          var startY = halfH + 10;
          var endY = metrics.railY - halfH + 3;
          var travel = Math.max(48, endY - startY);
          return startY + travel * progress;
        }

        // 為新泡泡挑選未被佔用的水平槽位
        function pickFreeLane(totalLanes, usedLanes, lastLane) {
          var free = [];
          for (var i = 0; i < totalLanes; i++) {
            if (!usedLanes[i]) free.push(i);
          }
          if (!free.length) return 0;
          // 優先避開與剛消失槽位相同的鄰近位置，讓畫面更錯落活潑
          if (free.length > 1 && typeof lastLane === 'number') {
            free.sort(function (a, b) {
              return Math.abs(b - lastLane) - Math.abs(a - lastLane);
            });
          }
          return free[0];
        }

        // 建立單顆調皮墨水泡泡 DOM
        function createBubbleEl(text, toneIdx) {
          var el = document.createElement('div');
          el.className = 'sc-bubble sc-bubble-tone-' + toneIdx;
          el.innerHTML =
            '<span class="sc-gold-tag">★ 下一個</span>' +
            '<span class="sc-miss-badge">✗</span>' +
            '<span class="sc-bubble-char"></span>';
          el.querySelector('.sc-bubble-char').textContent = text;
          bubbleLayer.appendChild(el);
          return el;
        }

        // 對齊畫面泡泡與 api.upcoming(count)
        function syncBubbles(lastRemovedLane) {
          if (!initialized) return;
          measure();
          var count = getTargetCount();
          var want = api.upcoming(count) || [];
          var dim = getBubbleDim();

          // 移掉多餘的舊泡泡
          while (bubbles.length > want.length) {
            var extra = bubbles.pop();
            if (extra && extra.el) extra.el.remove();
          }

          // 先記錄目前仍留在場上的泡泡已佔用哪些水平槽位
          var usedLanes = {};
          for (var j = 0; j < want.length; j++) {
            var ex = bubbles[j];
            var keyCheck = want[j].passageIndex + ':' + want[j].index;
            if (ex && ex.key === keyCheck) {
              if (ex.lane >= count) ex.lane = j % count;
              usedLanes[ex.lane] = true;
            }
          }

          // 逐一對齊或新建泡泡
          for (var i = 0; i < want.length; i++) {
            var u = want[i];
            var key = u.passageIndex + ':' + u.index;
            var item = bubbles[i];

            if (!item || item.key !== key) {
              if (item && item.el) item.el.remove();
              var toneIdx = toneCursor % SCENE_CONFIG.bubbleToneCount;
              toneCursor++;
              var lane = pickFreeLane(count, usedLanes, lastRemovedLane);
              usedLanes[lane] = true;
              var el = createBubbleEl(formatDisplay(u), toneIdx);
              item = bubbles[i] = {
                key: key,
                el: el,
                lane: lane,
                toneIdx: toneIdx,
                progress: 0,
                swayPhase: (toneCursor * 1.37) % (Math.PI * 2),
                spawnFade: 0,
                missTimer: 0,
                goldHint: false
              };
            }

            // 輪到目前要打的目標時，取消金色預告樣式，改由天藍瞄準圈凸顯
            if (i === 0) {
              item.goldHint = false;
            }

            // 套用對應難度的泡泡大小
            item.el.style.width = dim.w + 'px';
            item.el.style.height = dim.h + 'px';
            item.el.style.marginLeft = (-dim.w * 0.5) + 'px';
            item.el.style.marginTop = (-dim.h * 0.5) + 'px';
            item.el.classList.toggle('sc-bubble-active', i === 0);
            item.el.classList.toggle('sc-bubble-gold', i === 1 && item.goldHint && awakenRemain > 0);
          }

          // 小狐狸瞄準目前第一個目標的正下方，若沒有目標則回到中央
          if (bubbles.length > 0) {
            fox.targetX = laneToX(bubbles[0].lane, count);
          } else {
            fox.targetX = metrics.w * 0.5;
          }
          renderAll();
        }

        // 取得小狐狸魔杖星星尖端在場景中的座標
        function getWandTip() {
          return {
            x: fox.x + 38,
            y: metrics.h - 68
          };
        }

        // 在陽台欄杆上留下一小灘可愛墨漬（下一回合清除）
        function addRailSplat(x) {
          if (!splatLayer) return;
          var color = SCENE_CONFIG.splatColors[splats.length % SCENE_CONFIG.splatColors.length];
          var el = document.createElement('div');
          el.className = 'sc-splat';
          el.style.left = Math.max(28, Math.min(metrics.w - 28, x)) + 'px';
          el.style.top = (metrics.railY + 4) + 'px';
          el.innerHTML =
            '<svg viewBox="0 0 56 36" width="46" height="30" aria-hidden="true">' +
              '<path d="M6 16 C4 8 15 5 22 9 C27 3 38 4 41 11 C50 10 53 20 45 23 C42 29 33 28 29 24 C24 31 12 29 12 22 C7 22 6 19 6 16 Z" fill="' + color + '" opacity="0.86"/>' +
              '<circle cx="23" cy="15" r="2.2" fill="#FFF8E6"/>' +
              '<circle cx="33" cy="15" r="2.2" fill="#FFF8E6"/>' +
              '<circle cx="23.5" cy="15" r="1" fill="#3B2A20"/>' +
              '<circle cx="33.5" cy="15" r="1" fill="#3B2A20"/>' +
            '</svg>';
          splatLayer.appendChild(el);
          splats.push(el);
          while (splats.length > SCENE_CONFIG.maxSplats) {
            var oldest = splats.shift();
            if (oldest) oldest.remove();
          }
        }

        // 建立爆破花瓣與小星星粒子（reduced-motion 時跳過）
        function spawnBurst(x, y, isGold) {
          if (isReducedMotion() || !fxLayer) return;
          var total = isGold ? 6 : 9;
          for (var i = 0; i < total; i++) {
            var angle = (Math.PI * 2 * i) / total + (Math.random() * 0.4 - 0.2);
            var speed = (isGold ? 48 : 74) + Math.random() * 58;
            var isStar = (i % 2 === 0);
            var color = isGold
              ? (i % 2 === 0 ? '#FFD966' : '#FFF1B8')
              : SCENE_CONFIG.particleColors[i % SCENE_CONFIG.particleColors.length];
            var el = document.createElement('div');
            el.className = 'sc-particle';
            if (isStar) {
              el.innerHTML =
                '<svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true">' +
                  '<polygon points="10,1 12.6,7 19,7.5 14,11.8 15.5,18 10,14.6 4.5,18 6,11.8 1,7.5 7.4,7" fill="' + color + '" stroke="#3B2A20" stroke-width="1.2" stroke-linejoin="round"/>' +
                '</svg>';
            } else {
              // 繪本剪紙小花瓣
              el.innerHTML =
                '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">' +
                  '<path d="M8 1 C12 4 14 9 8 15 C2 9 4 4 8 1 Z" fill="' + color + '" stroke="#FFF8E6" stroke-width="1.2"/>' +
                '</svg>';
            }
            fxLayer.appendChild(el);
            particles.push({
              el: el,
              x: x,
              y: y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 22,
              gravity: 130,
              rot: Math.random() * 360,
              vrot: (Math.random() - 0.5) * 260,
              age: 0,
              life: 0.45 + Math.random() * 0.25,
              scale: 0.85 + Math.random() * 0.3
            });
          }
        }

        // 建立星星字彈的小尾巴微粒
        function spawnTrailDot(x, y, isGold) {
          if (isReducedMotion() || !fxLayer) return;
          var el = document.createElement('div');
          el.className = 'sc-particle';
          var fill = isGold ? '#FFD966' : '#FFF1B8';

        // 飄出打對的開心回饋文字（例如 ✓ +1），不擋目前要打的字
        function spawnPopText(x, y, label) {
          if (!fxLayer) return;
          var el = document.createElement('div');
          el.className = 'sc-pop-text';
          el.textContent = label;
          fxLayer.appendChild(el);

        // 發射星星字彈（或覺醒期間飛向第二個泡泡的金光弧線）
        function spawnShot(sx, sy, tx, ty, opts) {
          if (!fxLayer) return;
          var isGoldArc = !!(opts && opts.isGoldArc);
          var onArrive = opts && opts.onArrive;

          if (isReducedMotion()) {
            if (onArrive) onArrive();
            return;
          }

          var el = document.createElement('div');
          el.className = 'sc-shot';
          var starColor = isGoldArc ? '#FFD966' : '#FFF1B8';
          var strokeColor = isGoldArc ? '#C88A1E' : '#1F6B9C';
          el.innerHTML =
            '<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true">' +
              '<polygon points="14,2 17.6,10 26,10.8 19.6,16.6 21.5,25 14,20.5 6.5,25 8.4,16.6 2,10.8 10.4,10" fill="' + starColor + '" stroke="' + strokeColor + '" stroke-width="2" stroke-linejoin="round"/>' +
            '</svg>';
          fxLayer.appendChild(el);

          shots.push({
            el: el,
            sx: sx,
            sy: sy,
            tx: tx,
            ty: ty,
            arcLift: isGoldArc ? 38 : 20,
            age: 0,
            life: isGoldArc ? SCENE_CONFIG.goldArcDuration : SCENE_CONFIG.shotDuration,
            trailAccum: 0,
            isGoldArc: isGoldArc,
            onArrive: onArrive
          });
        }

        // 清空所有回合動態元素（泡泡、粒子、星彈、墨漬、覺醒計時）
        function clearDynamicObjects() {
          bubbles.forEach(function (b) { if (b.el) b.el.remove(); });
          ghosts.forEach(function (g) { if (g.el) g.el.remove(); });
          shots.forEach(function (s) { if (s.el) s.el.remove(); });
          particles.forEach(function (p) { if (p.el) p.el.remove(); });
          popTexts.forEach(function (t) { if (t.el) t.el.remove(); });
          splats.forEach(function (sp) { sp.remove(); });
          bubbles = [];
          ghosts = [];
          shots = [];
          particles = [];
          popTexts = [];
          splats = [];
          awakenRemain = 0;
          speechRemain = 0;
          fox.jumpTimer = 0;
          fox.oopsTimer = 0;
          updateAwakenUI();
        }

        // 更新覺醒光暈、徽章進度條與小狐狸台詞顯示
        function updateAwakenUI() {
          if (!stageEl) return;
          var active = awakenRemain > 0;
          stageEl.classList.toggle('sc-awakened', active);
          if (awakenBarFill) {
            var ratio = active ? Math.max(0, Math.min(1, awakenRemain / SCENE_CONFIG.awakenDuration)) : 0;
            awakenBarFill.style.transform = 'scaleX(' + ratio.toFixed(3) + ')';
          }
          if (foxSpeech) {
            foxSpeech.classList.toggle('sc-speech-show', speechRemain > 0);
            // 小狐狸靠右半邊時，對話框改放左側以免超出畫框
            foxSpeech.classList.toggle('sc-speech-left', fox.x > metrics.w * 0.65);
          }
        }

        // 將目前所有物件狀態渲染到 DOM
        function renderAll() {
          if (!initialized) return;
          var count = getTargetCount();
          var reduced = isReducedMotion();

          // 1. 渲染調皮墨水泡泡
          for (var i = 0; i < bubbles.length; i++) {
            var b = bubbles[i];
            var baseX = laneToX(b.lane, count);
            var baseY = progressToY(b.progress);
            // 輕柔微浮（reduced-motion 時停用）
            var swayX = reduced ? 0 : Math.sin(clock * 1.4 + b.swayPhase) * 4.5;
            var missOffsetX = 0;
            if (b.missTimer > 0) {
              if (!reduced) {
                // 0.5 秒內柔和左右來回 1 次（2 次/秒，符合護眼規範）
                var mt = b.missTimer / SCENE_CONFIG.missEffectDuration;
                missOffsetX = Math.sin(mt * Math.PI * 2) * 7;
              }
              b.el.classList.add('sc-bubble-miss');
            } else {
              b.el.classList.remove('sc-bubble-miss');
            }

            var scale = (i === 0) ? 1.04 : 0.96;
            b.x = baseX + swayX + missOffsetX;
            b.y = baseY;
            b.el.style.transform = 'translate(' + b.x.toFixed(1) + 'px,' + b.y.toFixed(1) + 'px) scale(' + scale + ')';
            var baseOpacity = (i === 0) ? 1 : (b.goldHint && awakenRemain > 0 ? 0.98 : 0.88);
            var fade = Math.min(1, b.spawnFade);
            b.el.style.opacity = (baseOpacity * fade).toFixed(3);
            b.el.classList.toggle('sc-bubble-gold', i === 1 && b.goldHint && awakenRemain > 0);
          }

          // 2. 渲染等待擊破或淡出的殘影泡泡
          for (var g = 0; g < ghosts.length; g++) {
            var gh = ghosts[g];
            var gRatio = Math.max(0, 1 - gh.age / gh.life);
            var gScale = reduced ? 1 : (1 + (1 - gRatio) * 0.14);
            gh.el.style.transform = 'translate(' + gh.x.toFixed(1) + 'px,' + gh.y.toFixed(1) + 'px) scale(' + gScale.toFixed(3) + ')';
            gh.el.style.opacity = gRatio.toFixed(3);
          }

          // 3. 渲染小狐狸魔法師位置與跳躍／微驚訝表情
          if (foxWrap) {
            var jumpY = 0;
            var tiltDeg = 0;
            if (!reduced && fox.jumpTimer > 0) {
              var jt = fox.jumpTimer / SCENE_CONFIG.foxJumpDuration;
              jumpY = -Math.sin(jt * Math.PI) * 14;
            } else if (!reduced && fox.oopsTimer > 0) {
              var ot = fox.oopsTimer / SCENE_CONFIG.missEffectDuration;
              tiltDeg = Math.sin(ot * Math.PI * 2) * 5;
            }
            foxWrap.style.transform =
              'translate(' + fox.x.toFixed(1) + 'px,' + jumpY.toFixed(1) + 'px) rotate(' + tiltDeg.toFixed(2) + 'deg)';
          }

          updateAwakenUI();
        }

        // 主動畫迴圈（唯一計時來源，以時間差 dt 運算，dt 上限 0.1 秒）
        function tick(now) {
          if (!running) return;
          var dt = (now - lastTime) / 1000;
          lastTime = now;
          if (dt < 0) dt = 0;
          if (dt > SCENE_CONFIG.maxDt) dt = SCENE_CONFIG.maxDt;

          clock += dt;
          var reduced = isReducedMotion();
          var fallSec = getFallSeconds();

          // 1. 更新覺醒倒數與台詞倒數
          if (awakenRemain > 0) {
            awakenRemain = Math.max(0, awakenRemain - dt);
            if (awakenRemain === 0) {
              // 覺醒結束時清除所有泡泡金色提示
              for (var k = 0; k < bubbles.length; k++) bubbles[k].goldHint = false;
            }
          }
          if (speechRemain > 0) {
            speechRemain = Math.max(0, speechRemain - dt);
          }

          // 2. 更新小狐狸平滑水平滑動與小動作計時
          if (reduced) {
            fox.x = fox.targetX;
          } else {
            var lerp = 1 - Math.exp(-SCENE_CONFIG.foxMoveSpeed * dt);
            fox.x += (fox.targetX - fox.x) * lerp;
          }
          if (fox.jumpTimer > 0) fox.jumpTimer = Math.max(0, fox.jumpTimer - dt);
          if (fox.oopsTimer > 0) fox.oopsTimer = Math.max(0, fox.oopsTimer - dt);

          // 3. 更新泡泡飄落（未輪到的目標速度為 1/3，且最多前進全程 1/3）
          var hitRail = false;
          var railHitX = 0;
          for (var i = 0; i < bubbles.length; i++) {
            var b = bubbles[i];
            if (b.spawnFade < 1) {
              b.spawnFade = Math.min(1, b.spawnFade + dt * 4.5);
            }
            if (b.missTimer > 0) {
              b.missTimer = Math.max(0, b.missTimer - dt);
            }

            if (i === 0) {
              b.progress += dt / fallSec;
              if (b.progress >= 1) {
                // 觸碰陽台欄杆線：記下位置並重置到頂端重新飄落
                hitRail = true;
                railHitX = laneToX(b.lane, getTargetCount());
                b.progress = 0;
                b.spawnFade = 0;
                b.missTimer = 0;
              }
            } else {
              // 還沒輪到的目標：速度約 1/3，最多停在全程 1/3 處等待
              if (b.progress < SCENE_CONFIG.waitingMaxProgress) {
                b.progress = Math.min(
                  SCENE_CONFIG.waitingMaxProgress,
                  b.progress + (dt / fallSec) * SCENE_CONFIG.waitingSpeedRatio
                );
              }
            }
          }

          // 若目前目標落到陽台欄杆線，留墨漬並扣一顆愛心
          if (hitRail) {
            addRailSplat(railHitX);
            fox.oopsTimer = SCENE_CONFIG.missEffectDuration;
            api.loseLife();
            // 若愛心歸零導致共用程式立刻呼叫 pause()/stop()，中止本幀後續更新
            if (!running) return;
          }

          // 4. 更新殘影泡泡
          for (var g = ghosts.length - 1; g >= 0; g--) {
            ghosts[g].age += dt;
            if (ghosts[g].age >= ghosts[g].life) {
              ghosts[g].el.remove();
              ghosts.splice(g, 1);
            }
          }

          // 5. 更新星星字彈與尾跡
          for (var s = shots.length - 1; s >= 0; s--) {
            var sh = shots[s];
            sh.age += dt;
            var t = Math.min(1, sh.age / sh.life);
            // 二次貝茲微弧線，讓星彈軌跡活潑靈動
            var mx = (sh.sx + sh.tx) * 0.5;
            var my = Math.min(sh.sy, sh.ty) - sh.arcLift;
            var inv = 1 - t;
            var x = inv * inv * sh.sx + 2 * inv * t * mx + t * t * sh.tx;
            var y = inv * inv * sh.sy + 2 * inv * t * my + t * t * sh.ty;

            sh.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + (t * 360).toFixed(0) + 'deg)';
            sh.trailAccum += dt;
            if (sh.trailAccum >= 0.032) {
              sh.trailAccum = 0;
              spawnTrailDot(x, y, sh.isGoldArc);
            }

            if (t >= 1) {
              sh.el.remove();
              shots.splice(s, 1);
              if (sh.onArrive) sh.onArrive();
            }
          }

          // 6. 更新花瓣與星星粒子
          for (var p = particles.length - 1; p >= 0; p--) {
            var pt = particles[p];
            pt.age += dt;
            if (pt.age >= pt.life) {
              pt.el.remove();
              particles.splice(p, 1);
              continue;
            }
            pt.vy += pt.gravity * dt;
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            pt.rot += pt.vrot * dt;
            var alpha = Math.max(0, 1 - pt.age / pt.life);
            pt.el.style.transform =
              'translate(' + pt.x.toFixed(1) + 'px,' + pt.y.toFixed(1) + 'px) rotate(' + pt.rot.toFixed(0) + 'deg) scale(' + (pt.scale * (0.5 + alpha * 0.5)).toFixed(2) + ')';
            pt.el.style.opacity = alpha.toFixed(3);
          }

          // 7. 更新 +1 飄字
          for (var m = popTexts.length - 1; m >= 0; m--) {
            var pop = popTexts[m];
            pop.age += dt;
            if (pop.age >= pop.life) {
              pop.el.remove();
              popTexts.splice(m, 1);
              continue;
            }
            var pr = pop.age / pop.life;
            var dy = reduced ? 0 : (-34 * pr);
            pop.el.style.left = pop.x.toFixed(1) + 'px';
            pop.el.style.top = (pop.y + dy).toFixed(1) + 'px';
            pop.el.style.opacity = Math.max(0, 1 - pr * pr).toFixed(3);
          }

          renderAll();
          if (running) {
            rafId = requestAnimationFrame(tick);
          }
        }

        // 回傳共用程式所需的生命週期介面
        return {
          // 第一回合開始前呼叫一次：建立場景元素
          start: function () {
            if (!initialized) {
              buildSceneDOM();
            }
            measure();
            fox.x = metrics.w * 0.5;
            fox.targetX = metrics.w * 0.5;
            renderAll();
          },

          // 每回合開始：清空上一回合所有目標、粒子、墨漬、覺醒狀態，重新對齊 upcoming
          roundStart: function () {
            if (!initialized) {
              buildSceneDOM();
            }
            measure();
            clearDynamicObjects();
            fox.x = metrics.w * 0.5;
            fox.targetX = metrics.w * 0.5;
            syncBubbles();
            // 回合開始直接讓小狐狸對齊第一顆目標
            fox.x = fox.targetX;
            renderAll();
          },

          // 開始動／恢復動畫
          resume: function () {
            if (!initialized) return;
            measure();
            if (stageEl) stageEl.classList.remove('sc-paused');
            if (running) return;
            running = true;
            lastTime = performance.now();
            rafId = requestAnimationFrame(tick);
          },

          // 暫停：停掉 rAF 與所有 CSS 動畫，場景完全靜止
          pause: function () {
            running = false;
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = 0;
            }
            if (stageEl) stageEl.classList.add('sc-paused');
          },

          // 整局結束：停掉一切動畫
          stop: function () {
            running = false;
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = 0;
            }
            if (stageEl) stageEl.classList.add('sc-paused');
          },

          // 打對：魔杖射出星星字彈、泡泡爆成花瓣星星、每 10 連擊觸發魔力覺醒
          hit: function (res) {
            if (!initialized) return;
            var correct = (res && typeof res.correct === 'number' && res.correct > 0) ? res.correct : 1;
            var combo = (res && typeof res.combo === 'number') ? res.combo : api.combo();
            var prevCombo = Math.max(0, combo - correct);
            var count = getTargetCount();
            var wand = getWandTip();
            var hitPositions = [];
            var lastRemovedLane;

            // 先移走前面 res.correct 個已打對的泡泡，並保留原位殘影等星彈擊破
            for (var i = 0; i < correct && bubbles.length > 0; i++) {
              var target = bubbles.shift();
              lastRemovedLane = target.lane;
              var tx = (typeof target.x === 'number') ? target.x : laneToX(target.lane, count);
              var ty = (typeof target.y === 'number') ? target.y : progressToY(target.progress);
              hitPositions.push({ x: tx, y: ty });

              // 移至殘影列表，待星彈飛抵時爆破
              target.el.classList.remove('sc-bubble-active', 'sc-bubble-miss', 'sc-bubble-gold');
              ghosts.push({
                el: target.el,
                x: tx,
                y: ty,
                age: 0,
                life: isReducedMotion() ? 0.24 : SCENE_CONFIG.shotDuration
              });

              (function (bx, by, idx) {
                spawnShot(wand.x, wand.y, bx, by, {
                  onArrive: function () {
                    spawnBurst(bx, by, false);
                    if (idx === 0) {
                      spawnPopText(bx, by - 12, '✓ +' + correct);
                    }
                  }
                });
              })(tx, ty, i);
            }

            // 小狐狸開心跳一下
            fox.jumpTimer = SCENE_CONFIG.foxJumpDuration;

            // 連擊每跨過 10 的倍數觸發「魔力覺醒！」（6 秒覺醒、2 秒台詞）
            if (combo > 0 && Math.floor(combo / SCENE_CONFIG.awakenEveryCombo) > Math.floor(prevCombo / SCENE_CONFIG.awakenEveryCombo)) {
              awakenRemain = SCENE_CONFIG.awakenDuration;
              speechRemain = SCENE_CONFIG.awakenSpeechDuration;
            }

            // 重新對齊剩餘目標並從 upcoming 補齊新泡泡
            syncBubbles(lastRemovedLane);

            // 覺醒期間（6 秒）打對時，星彈分出一道金光把「第二個」泡泡染成金色提示下一個（純視覺）
            if (awakenRemain > 0 && bubbles.length >= 2) {
              var nextTarget = bubbles[1];
              var origin = hitPositions.length ? hitPositions[hitPositions.length - 1] : wand;
              var nx = laneToX(nextTarget.lane, getTargetCount());
              var ny = progressToY(nextTarget.progress);
              spawnShot(origin.x, origin.y, nx, ny, {
                isGoldArc: true,
                onArrive: function () {
                  if (awakenRemain > 0 && bubbles[1] === nextTarget) {
                    nextTarget.goldHint = true;
                    spawnBurst(nx, ny, true);
                    renderAll();
                  }
                }
              });
            }

            updateAwakenUI();
          },

          // 打錯：目前目標輕輕晃動並顯示溫和紅框與 ✗ 徽章，不閃紅整個場景
          miss: function () {
            if (!initialized) return;
            if (bubbles[0]) {
              bubbles[0].missTimer = SCENE_CONFIG.missEffectDuration;
            }
            fox.oopsTimer = SCENE_CONFIG.missEffectDuration;
            renderAll();
          },

          // 視窗大小改變：重新量測容器並重算位置
          resize: function () {
            if (!initialized) return;
            measure();
            if (bubbles.length > 0) {
              fox.targetX = laneToX(bubbles[0].lane, getTargetCount());
              if (!running) fox.x = fox.targetX;
            } else {
              fox.targetX = metrics.w * 0.5;
              if (!running) fox.x = fox.targetX;
            }
            renderAll();
          }
        };
      }
    });
  </script>
  <script defer src="../../assets/js/beacon.js"></script>
</body></html>
