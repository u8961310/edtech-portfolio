<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;position:relative;
       background:#F7E8CB radial-gradient(circle,#e9d4a8 1.6px,transparent 1.8px) 0 0/26px 26px;
       font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;color:#3B2A20;-webkit-font-smoothing:antialiased}
  .map{position:absolute;right:-40px;top:20px;width:760px;height:590px;border-radius:28px;overflow:hidden;
       border:6px solid #FFF8E6;box-shadow:0 0 0 3px #C9A66B,0 10px 0 rgba(201,166,107,.55)}
  .map img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;transform:scale(1.15)}
  .txt{position:absolute;left:56px;top:70px;width:470px}
  .tag{display:inline-block;background:#FFF1B8;border:2px solid #C9A66B;border-radius:999px;
       padding:6px 16px;font-size:22px;font-weight:700;color:#5E4838}
  h1{font-size:66px;font-weight:900;line-height:1.12;margin-top:20px}
  h1 em{font-style:normal;color:#D9531F}
  p{font-size:27px;font-weight:700;color:#5E4838;margin-top:18px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
  .chips span{background:#FFF8E6;border:3px solid #E4CC9C;border-radius:14px;padding:6px 14px;font-size:22px;font-weight:800}
  .free{position:absolute;left:56px;bottom:46px;background:#1F6B9C;color:#fff;border-radius:16px;
        padding:12px 22px;font-size:25px;font-weight:900}
</style>
</head>
<body>
  <div class="map"><img src="home.png" alt=""></div>
  <div class="txt">
    <span class="tag">🏝️ 國小資訊課教材</span>
    <h1>學習<em>樂園島</em></h1>
    <p>滑鼠、打字、運算思維、畫畫<br>點一座島，就進關卡</p>
    <div class="chips"><span>⌨️ 打字島 8 關</span><span>⚔️ 連線對戰</span><span>🎒 1–6 年級</span></div>
  </div>
  <div class="free">🆓 免費・免登入・打開就能玩</div>
</body>
</html>
