<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>造訪來源報表</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #eef2f6; --paper: #ffffff; --ink: #1f2937; --muted: #475569;
    --navy: #0c2d4e; --head: #1e3a5f; --head-line: #0f2440;
    --line: #c5ced8; --stripe: #f7f9fb; --input: #8696ab;
    --accent: #1e40af; --warn: #b45309; --bad: #b91c1c;
    --total: #e8eef5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; color: var(--navy); }
  .meta { color: var(--muted); font-size: 13px; }
  .tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--head); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; background: var(--paper); color: var(--head); padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--head); }
  .seg button[aria-pressed="true"] { background: var(--head); color: #fff; }
  .btn2 { border: 1px solid var(--input); background: var(--paper); color: var(--ink); padding: 5px 12px; border-radius: 4px; font: inherit; font-size: 14px; cursor: pointer; }
  .btn { border: 0; background: var(--head); color: #fff; padding: 8px 18px; border-radius: 4px; font: inherit; font-size: 15px; cursor: pointer; }

  .summary { display: grid; grid-template-columns: 1.6fr repeat(5, 1fr); background: var(--paper); border: 1px solid var(--line); border-right: 0; border-bottom: 0; margin-bottom: 20px; }
  .summary > div { padding: 10px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .summary .k { font-size: 13px; color: var(--muted); }
  .summary .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .summary .v small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .summary .period .v { font-size: 16px; padding-top: 3px; }

  section { background: var(--paper); border: 1px solid var(--line); margin-bottom: 20px; }
  section > h2 { margin: 0; background: var(--navy); color: #fff; font-size: 15px; font-weight: 700; padding: 8px 14px; }
  section > h2 small { font-size: 13px; font-weight: 400; margin-left: 10px; color: #dbe4f0; }
  .note { padding: 8px 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid2 section { margin-bottom: 0; }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
  th + th, td + td { border-left: 1px solid var(--line); }
  thead th { background: var(--head); color: #fff; font-size: 14px; font-weight: 600; border-bottom: 3px solid var(--head-line); border-left-color: #3b5577; white-space: nowrap; }
  tbody tr:nth-child(even) td { background: var(--stripe); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.date { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td .sub { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr.zero td { color: var(--muted); }
  tfoot td { background: var(--total); border-top: 2px solid var(--head); font-weight: 700; }
  .empty { padding: 18px 14px; color: var(--muted); }
  .bad { color: var(--bad); }

  /* 圖表（配色經 dataviz 驗證腳本：CVD ΔE 9.2、正常視覺 27.6；綠色對比 2.82 → 下方有數字表當替代） */
  .viz { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --grid: #e2e8f0; --axis: #475569; }
  .chart { padding: 12px 14px 4px; position: relative; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart svg text { font-size: 12px; fill: var(--axis); font-variant-numeric: tabular-nums; }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover, .chart .hit.on { fill: rgba(30, 58, 95, .06); }
  .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(15, 36, 64, .15); padding: 6px 10px; font-size: 13px; line-height: 1.6; white-space: nowrap; z-index: 5; }
  .tip b { display: block; font-size: 13px; }
  .tip .row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .share { display: flex; height: 28px; gap: 2px; margin: 4px 0 6px; }
  .share > div { min-width: 2px; border-radius: 4px; }
  .share-lbl { display: flex; gap: 2px; font-size: 13px; color: var(--ink); margin-bottom: 8px; }
  .share-lbl > div { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  td.bar { padding-right: 14px; }
  td.bar span { display: block; height: 8px; border-radius: 0 4px 4px 0; background: var(--s1); margin-top: 7px; min-width: 2px; }

  /* 來過的學校：橫向長條（前 N 名）＋收合的完整明細表 */
  .hbar { padding: 12px 14px 8px; position: relative; }
  .hbar .r { display: grid; grid-template-columns: 2.2em minmax(0, 32%) 1fr 5.5em; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 3px; }
  .hbar .r:hover, .hbar .r:focus { background: rgba(30, 58, 95, .06); outline: none; }
  .hbar .rk { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hbar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .tr { height: 14px; }
  .hbar .tr span { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar .v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hbar .v small { color: var(--muted); font-size: 12px; margin-left: 2px; }
  .hbar .more { font-size: 13px; color: var(--muted); padding: 6px 4px 0; }
  details.all > summary { padding: 8px 14px; cursor: pointer; color: var(--accent); border-top: 1px solid var(--line); font-size: 14px; }
  details.all[open] > summary { border-bottom: 1px solid var(--line); }

  /* 登入 */
  .login { max-width: 420px; margin: 12vh auto 0; background: var(--paper); border: 1px solid var(--line); }
  .login h2 { margin: 0; background: var(--navy); color: #fff; font-size: 16px; padding: 10px 16px; }
  .login form { padding: 18px 16px; display: grid; gap: 12px; }
  .login label { font-weight: 700; font-size: 14px; }
  .login input { width: 100%; padding: 8px 10px; border: 1px solid var(--input); border-radius: 4px; font: inherit; }
  .login .err { color: var(--bad); font-size: 14px; min-height: 1.2em; margin: 0; }
  .login .hint { color: var(--muted); font-size: 13px; margin: 0; }

  @media (max-width: 760px) {
    .summary { grid-template-columns: 1fr 1fr; }
    .summary .period, .summary > div:last-child { grid-column: 1 / -1; }
    .grid2 { grid-template-columns: 1fr; gap: 20px; }
    .hide-sm { display: none; }
    /* 窄螢幕：藏欄後固定欄寬會錯位，改自動配寬 */
    table { table-layout: auto; }
    col { width: auto !important; }
    td.bar { width: 28%; }
    .hbar .r { grid-template-columns: 1.8em minmax(0, 42%) 1fr 4.8em; gap: 6px; }
    th, td { padding: 7px 8px; }
    thead th { white-space: normal; }
    td.trunc { white-space: normal; overflow: visible; }
    td .sub { white-space: normal; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="loginView" class="login" hidden>
    <h2>造訪來源報表</h2>
    <form id="loginForm" autocomplete="off">
      <label for="tok">查詢 token</label>
      <input id="tok" type="password" required spellcheck="false">
      <p class="hint">存在這台瀏覽器，下次不用再輸入。</p>
      <p class="err" id="loginErr"></p>
      <div><button class="btn" type="submit">登入</button></div>
    </form>
  </div>

  <div id="reportView" class="viz" hidden>
    <header class="top">
      <div>
        <h1>造訪來源報表</h1>
        <div class="meta" id="updated"></div>
      </div>
      <div class="tools">
        <div class="seg" role="group" aria-label="期間">
          <button data-range="7" aria-pressed="false">近 7 天</button>
          <button data-range="30" aria-pressed="true">近 30 天</button>
          <button data-range="all" aria-pressed="false">全部</button>
        </div>
        <button class="btn2" id="reload">重新整理</button>
        <button class="btn2" id="logout">登出</button>
      </div>
    </header>

    <div class="summary" id="summary"></div>

    <section>
      <h2>來過的學校<small id="orgsSub">依裝置人日排名</small></h2>
      <div id="orgs"></div>
      <div class="note">裝置人日＝同一天同一台裝置算一次（2026-11-19 起才有裝置資料，之前只來過的學校為 0，改依訪客人日排在後面）。</div>
    </section>

    <section>
      <h2>每日造訪</h2>
      <div id="trend" class="chart"></div>
      <div id="daily"></div>
      <div class="note">只列有人來的日子；各欄為當天訪客數。「裝置」依瀏覽器隨機編號計算（2026-11-19 起），電腦教室有還原卡時每次開機會算成新裝置。</div>
    </section>

    <div class="grid2">
      <section>
        <h2>熱門頁面</h2>
        <div id="paths"></div>
      </section>
      <section>
        <h2>來源分布</h2>
        <div id="srcbar" class="chart"></div>
        <div id="sources"></div>
      </section>
    </div>
  </div>

</div>
<script>
(function () {
  var KEY = 'edtech-analytics-token';
  var RANGE_KEY = 'edtech-analytics-range';
  var NAMES = {
    'unit1-typing-adventure': '中文打字冒險王',
    'unit2-mouse-adventure': '小兔勇者大冒險',
    'unit3-space-typing': '太空打字防衛戰',
    'unit4-whack-keyboard': '鍵盤打地鼠',
    'unit5-pixel-art': '像素藝術小畫家',
    'unit6-turtle-commander': '烏龜小指揮官',
    'unit7-spell-commander': '指令小法師',
    'unit8-desktop-organizer': '桌面整理大師',
    'unit9-net-detective': '網路小警察',
    'unit10-classifier-captain': '分類大隊長',
    'unit11-space-typing-pro': '英打太空特攻',
    'unit12-space-typing-zh': '中打太空特攻',
    'unit13-forest-typing-defense': '極速雷射森林戰',
    'unit14-magic-word-bullet': '魔法字彈極速覺醒',
    'unit15-computational-thinking': '運算思維挑戰營',
    'unit16-dino-typing': '恐龍打字大冒險',
    'unit17-pet-treasure-coding': '程式小勇士：萌寵尋寶',
    'unit18-magic-paint': '魔法簡約畫畫屋',
    'unit19-farm-harvest': '快樂農場：蔬菜拔拔樂',
    'unit20-sock-matching': '瘋狂襪子配對線',
    'unit21-mouse-challenge': '滑鼠小勇士大冒險',
    // 多頁單元：「資料夾/檔名」優先，查不到才用資料夾名
    'unit22-xmas-workshop': '聖誕工坊：地圖',
    'unit22-xmas-workshop/index.html': '聖誕工坊：地圖',
    'unit22-xmas-workshop/rescue.html': '聖誕工坊：主線四關',
    'unit22-xmas-workshop/draw.html': '聖誕工坊：畫畫屋',
    'unit22-xmas-workshop/catch.html': '聖誕工坊：接禮物',
    'unit22-xmas-workshop/memory.html': '聖誕工坊：翻牌配對',
    'unit22-xmas-workshop/tree.html': '聖誕工坊：裝飾聖誕樹',
    'unit22-xmas-workshop/snowman.html': '聖誕工坊：堆雪人',
    'unit23-typing-duel': '打字擂台',
    'unit23-typing-duel/index.html': '打字擂台'
  };
  var PAGES = {
    '': '首頁（學習樂園島）', 'index.html': '首頁（學習樂園島）',
    'list.html': '清單頁', 'portfolio.html': '老師作品集', 'island-3d.html': '3D 島',
    'board/': '資訊大富翁：森林', 'board/index.html': '資訊大富翁：森林',
    'board/ocean.html': '資訊大富翁：海洋'
  };
  var SOURCE = { school: '學校（查得到單位）', tanet_unknown: '學術網路（查不到單位）', other: '其他網路' };
  // 固定順序上色：學校＝1、學術網路＝2、其他＝3（顏色跟著來源走，不跟排名走）
  var SERIES = [
    { k: 'school', name: '學校', c: 'var(--s1)' },
    { k: 'tanet_unknown', name: '學術網路', c: 'var(--s2)' },
    { k: 'other', name: '其他網路', c: 'var(--s3)' }
  ];
  var lastData = null;

  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var fmt = function (n) { return Number(n || 0).toLocaleString('zh-TW'); };
  var token = store.get(KEY);
  var range = store.get(RANGE_KEY) || '30';

  function pageName(path) {
    var p = String(path || '').replace(/^\/edtech-portfolio\//, '').replace(/^\//, '');
    var m = p.match(/^units\/([^/]+)\/?([^/?#]*)/);
    if (m) return NAMES[m[1] + '/' + m[2]] || NAMES[m[1]] || m[1];
    return PAGES[p] || p || '首頁（學習樂園島）';
  }

  function showLogin(msg) {
    $('reportView').hidden = true;
    $('loginView').hidden = false;
    $('loginErr').textContent = msg || '';
    $('tok').focus();
  }

  function load() {
    $('loginView').hidden = true;
    $('reportView').hidden = false;
    document.querySelectorAll('.seg button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.range === range));
    });
    $('updated').textContent = '載入中…';
    fetch('/stats?range=' + encodeURIComponent(range), { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) { store.del(KEY); token = null; showLogin('token 不正確，請重新輸入。'); return null; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) { if (d) render(d); })
      .catch(function (e) { $('updated').innerHTML = '<span class="bad">載入失敗：' + esc(e.message) + '</span>'; });
  }

  function table(cols, rows, foot) {
    if (!rows.length) return '<div class="empty">這段期間沒有資料</div>';
    var h = '<table><colgroup>' + cols.map(function (c) { return '<col style="width:' + c.w + '">'; }).join('') + '</colgroup><thead><tr>' +
      cols.map(function (c) { return '<th class="' + (c.num ? 'num ' : '') + (c.sm ? 'hide-sm' : '') + '">' + c.t + '</th>'; }).join('') +
      '</tr></thead><tbody>' + rows.join('') + '</tbody>';
    if (foot) h += '<tfoot>' + foot + '</tfoot>';
    return h + '</table>';
  }

  function legend() {
    return '<div class="legend">' + SERIES.map(function (s) {
      return '<span><i style="background:' + s.c + '"></i>' + s.name + '</span>';
    }).join('') + '</div>';
  }

  function addDays(iso, n) {
    return new Date(new Date(iso + 'T00:00:00Z').getTime() + n * 86400000).toISOString().slice(0, 10);
  }

  // 每日訪客：堆疊直條（學校／學術網路／其他），滑過看當天明細
  function drawTrend(d) {
    var el = $('trend');
    var rows = d.daily || [];
    if (!rows.length) { el.innerHTML = ''; return; }
    var byDay = {}; rows.forEach(function (r) { byDay[r.day] = r; });
    var to = d.range.to;
    var n = d.range.days || Math.min(120, Math.round((new Date(to) - new Date(d.range.from)) / 86400000) + 1);
    var days = [];
    for (var i = n - 1; i >= 0; i--) {
      var day = addDays(to, -i);
      days.push(byDay[day] || { day: day, school: 0, tanet_unknown: 0, other: 0, visitors: 0, pages: 0 });
    }

    var W = Math.max(280, el.clientWidth - 28), H = 200, L = 30, R = 6, T = 10, B = 26;
    var pw = W - L - R, ph = H - T - B;
    var max = Math.max.apply(null, days.map(function (r) { return r.school + r.tanet_unknown + r.other; }));
    var step = max <= 5 ? 1 : Math.ceil(max / 4 / Math.pow(10, Math.floor(Math.log10(max / 4)))) * Math.pow(10, Math.floor(Math.log10(max / 4)));
    var top = Math.max(step, Math.ceil(max / step) * step);
    var y = function (v) { return T + ph - v / top * ph; };
    var band = pw / days.length, bw = Math.max(2, Math.min(24, band * 0.62));

    var svg = '';
    for (var t = 0; t <= top; t += step) {
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="' + (t ? 'var(--grid)' : '#94a3b8') + '"/>' +
        '<text x="' + (L - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + t + '</text>';
    }
    var every = Math.ceil(days.length / Math.max(2, Math.floor(pw / 64)));
    days.forEach(function (r, i) {
      var cx = L + band * i + band / 2, x = cx - bw / 2, base = y(0), segs = [];
      SERIES.forEach(function (s) { if (r[s.k]) segs.push({ s: s, v: r[s.k] }); });
      segs.forEach(function (g, j) {
        var h = g.v / top * ph - (j < segs.length - 1 ? 2 : 0); // 段與段之間留 2px 空隙
        var y1 = base - h;
        if (j === segs.length - 1) { // 最上面一段：頂端 4px 圓角、底部方角
          var rr = Math.min(4, h, bw / 2);
          svg += '<path fill="' + g.s.c + '" d="M' + x + ',' + base + 'V' + (y1 + rr) + 'Q' + x + ',' + y1 + ' ' + (x + rr) + ',' + y1 +
            'H' + (x + bw - rr) + 'Q' + (x + bw) + ',' + y1 + ' ' + (x + bw) + ',' + (y1 + rr) + 'V' + base + 'Z"/>';
        } else {
          svg += '<rect fill="' + g.s.c + '" x="' + x + '" y="' + y1 + '" width="' + bw + '" height="' + h + '"/>';
        }
        base -= g.v / top * ph;
      });
      if ((days.length - 1 - i) % every === 0) {
        svg += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + r.day.slice(5).replace('-', '/') + '</text>';
      }
      svg += '<rect class="hit" data-i="' + i + '" x="' + (L + band * i) + '" y="' + T + '" width="' + band + '" height="' + ph + '"/>';
    });

    el.innerHTML = legend() + '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="每日訪客數，依來源堆疊">' + svg + '</svg><div class="tip" hidden></div>';
    var tip = el.querySelector('.tip'), wk = ['日', '一', '二', '三', '四', '五', '六'];
    el.querySelectorAll('.hit').forEach(function (h) {
      h.addEventListener('mouseenter', function () {
        var r = days[+h.dataset.i];
        tip.innerHTML = '<b>' + r.day + '（' + wk[new Date(r.day + 'T00:00:00Z').getUTCDay()] + '）</b>' +
          SERIES.map(function (s) { return '<div class="row"><span><i style="background:' + s.c + '"></i>' + s.name + '</span><span>' + fmt(r[s.k]) + '</span></div>'; }).join('') +
          '<div class="row"><span>合計訪客</span><span>' + fmt(r.visitors) + '</span></div>';
        tip.hidden = false;
        var box = el.getBoundingClientRect(), hb = h.getBoundingClientRect();
        var left = hb.left - box.left + hb.width / 2 + 10;
        if (left + tip.offsetWidth > box.width - 4) left = hb.left - box.left + hb.width / 2 - tip.offsetWidth - 10;
        tip.style.left = left + 'px'; tip.style.top = '30px';
      });
      h.addEventListener('mouseleave', function () { tip.hidden = true; });
    });
  }

  // 來源占比：一條分段橫條，下方標名稱與百分比
  function drawShare(srcs) {
    var el = $('srcbar');
    var total = srcs.reduce(function (a, r) { return a + r.n; }, 0);
    if (!total) { el.innerHTML = ''; return; }
    var parts = SERIES.map(function (s) {
      var r = srcs.filter(function (x) { return x.source_type === s.k; })[0];
      return { s: s, n: r ? r.n : 0 };
    }).filter(function (p) { return p.n; });
    el.innerHTML = legend() +
      '<div class="share" role="img" aria-label="來源占比">' + parts.map(function (p) {
        return '<div title="' + p.s.name + ' ' + fmt(p.n) + '（' + Math.round(p.n / total * 100) + '%）" style="flex:' + p.n + ';background:' + p.s.c + '"></div>';
      }).join('') + '</div>' +
      '<div class="share-lbl">' + parts.map(function (p) {
        return '<div style="flex:' + p.n + '">' + Math.round(p.n / total * 100) + '%</div>';
      }).join('') + '</div>';
  }

  // 來過的學校：前 ORG_TOP 名畫橫向長條（裝置人日，0 起算），其餘合計一行；完整明細表收進 <details>
  var ORG_TOP = 10;
  function drawOrgs(orgs, ranks, tableHtml) {
    var el = $('orgs'), SUB = '依裝置人日排名';
    if (!orgs.length) { el.innerHTML = tableHtml; $('orgsSub').textContent = SUB; return; }
    var top = orgs.slice(0, ORG_TOP), rest = orgs.slice(ORG_TOP);
    var max = Math.max.apply(null, top.map(function (o) { return o.device_days; })) || 1;
    $('orgsSub').textContent = orgs.length > ORG_TOP ? '前 ' + ORG_TOP + ' 名，' + SUB : SUB;
    var restSum = rest.reduce(function (a, o) { return a + o.device_days; }, 0);
    el.innerHTML = '<div class="hbar" role="img" aria-label="來過的學校，依裝置人日排名的橫向長條圖">' +
      top.map(function (o, i) {
        return '<div class="r" tabindex="0" data-i="' + i + '"><span class="rk">' + ranks[i] + '</span>' +
          '<span class="nm">' + esc(o.org_name || '（未知）') + '</span>' +
          '<span class="tr">' + (o.device_days ? '<span style="width:' + (o.device_days / max * 100).toFixed(1) + '%"></span>' : '') + '</span>' +
          '<span class="v">' + fmt(o.device_days) + '<small>人日</small></span></div>';
      }).join('') +
      (rest.length ? '<div class="more">其餘 ' + fmt(rest.length) + ' 所合計 ' + fmt(restSum) + ' 裝置人日</div>' : '') +
      '<div class="tip" hidden></div></div>' +
      '<details class="all"><summary>看全部 ' + fmt(orgs.length) + ' 所明細表</summary>' + tableHtml + '</details>';
    var box = el.querySelector('.hbar'), tip = box.querySelector('.tip');
    function show(r) {
      var o = top[+r.dataset.i];
      tip.innerHTML = '<b>' + esc(o.org_name || '（未知）') + '</b>' +
        '<div class="row"><span>網域</span><span>' + esc(o.ptr_domain || '—') + '</span></div>' +
        '<div class="row"><span>裝置人日</span><span>' + fmt(o.device_days) + '</span></div>' +
        '<div class="row"><span>訪客人日</span><span>' + fmt(o.visitors) + '</span></div>' +
        '<div class="row"><span>來訪天數</span><span>' + fmt(o.days) + '</span></div>' +
        '<div class="row"><span>裝置</span><span>' + fmt(o.devices) + '</span></div>' +
        '<div class="row"><span>瀏覽頁數</span><span>' + fmt(o.pages) + '</span></div>' +
        '<div class="row"><span>首次／最近</span><span>' + esc(o.first_seen) + '／' + esc(o.last_seen) + '</span></div>';
      tip.hidden = false;
      var bb = box.getBoundingClientRect(), rb = r.getBoundingClientRect();
      var topPx = rb.bottom - bb.top + 4;
      if (topPx + tip.offsetHeight > bb.height + 40) topPx = rb.top - bb.top - tip.offsetHeight - 4;
      tip.style.left = Math.max(4, Math.min(bb.width - tip.offsetWidth - 4, rb.width * 0.3)) + 'px';
      tip.style.top = topPx + 'px';
    }
    box.querySelectorAll('.r').forEach(function (r) {
      r.addEventListener('mouseenter', function () { show(r); });
      r.addEventListener('focus', function () { show(r); });
      r.addEventListener('mouseleave', function () { tip.hidden = true; });
      r.addEventListener('blur', function () { tip.hidden = true; });
    });
  }

  function render(d) {
    lastData = d;
    var s = d.summary || {};
    var now = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false });
    $('updated').textContent = '更新時間 ' + now;

    var period = d.range.from ? (d.range.from + ' ～ ' + d.range.to) : '尚無資料';
    var hr = d.hit_rate.rate == null ? '—' : Math.round(d.hit_rate.rate * 100) + '<small>%</small>';
    $('summary').innerHTML =
      '<div class="period"><div class="k">統計期間</div><div class="v">' + esc(period) + '</div></div>' +
      '<div><div class="k">學校數</div><div class="v">' + fmt(s.schools) + '<small>所</small></div></div>' +
      '<div><div class="k" title="同一天同一位訪客算一次">訪客人日</div><div class="v">' + fmt(s.visitors) + '<small>人日</small></div></div>' +
      '<div><div class="k" title="' + esc(s.devices_since ? '依瀏覽器隨機編號計算，' + s.devices_since + ' 起才有資料' : '依瀏覽器隨機編號計算，尚無資料') +
        '">不重複裝置</div><div class="v">' + fmt(s.devices) + '<small>台</small></div></div>' +
      '<div><div class="k" title="同一位訪客同一天看同一頁只算一次">瀏覽頁數</div><div class="v">' + fmt(s.pages) + '<small>頁</small></div></div>' +
      '<div><div class="k" title="學術網路來源中，查得到單位名稱的比例">單位辨識率</div><div class="v">' + hr + '</div></div>';

    // 來過的學校：依裝置人日排名（同一天同一台裝置算一次）；裝置人日相同再比訪客人日，兩者都相同才同名次
    //   device_key 2026-11-19 起才有，之前只來過的學校裝置人日為 0，排在後面、靠訪客人日分先後
    var orgs = (d.orgs || []).map(function (o) { o.device_days = o.device_days || 0; return o; }).sort(function (a, b) {
      return (b.device_days - a.device_days) || (b.visitors - a.visitors) || (b.pages - a.pages) ||
        String(b.last_seen).localeCompare(String(a.last_seen));
    });
    var same = function (i) { return i > 0 && orgs[i].device_days === orgs[i - 1].device_days && orgs[i].visitors === orgs[i - 1].visitors; };
    var rank = 0, ranks = orgs.map(function (o, i) { if (!same(i)) rank = i + 1; return rank; });
    var orgTable = table([
      { t: '名次', w: '6%', num: true }, { t: '學校／單位', w: '22%' }, { t: '網域', w: '14%', sm: true },
      { t: '來訪天數', w: '9%', num: true, sm: true }, { t: '裝置人日', w: '10%', num: true },
      { t: '訪客人日', w: '9%', num: true, sm: true }, { t: '裝置', w: '7%', num: true, sm: true },
      { t: '瀏覽頁數', w: '9%', num: true, sm: true }, { t: '最近來訪', w: '14%' }
    ], orgs.map(function (o, i) {
      return '<tr><td class="num">' + ranks[i] + '</td>' +
        '<td class="trunc" title="' + esc(o.org_name) + '">' + esc(o.org_name || '（未知）') +
        '<span class="sub">首次 ' + esc(o.first_seen) + '</span></td>' +
        '<td class="trunc hide-sm">' + esc(o.ptr_domain || '—') + '</td>' +
        '<td class="num hide-sm">' + fmt(o.days) + '</td><td class="num">' + fmt(o.device_days) + '</td>' +
        '<td class="num hide-sm">' + fmt(o.visitors) + '</td><td class="num hide-sm">' + fmt(o.devices) + '</td>' +
        '<td class="num hide-sm">' + fmt(o.pages) + '</td><td class="date">' + esc(o.last_seen) + '</td></tr>';
    }));
    drawOrgs(orgs, ranks, orgTable);

    // 每日造訪：只列有人來的日子（伺服器只回有資料的日期）
    var daily = (d.daily || []).slice();
    var wk = ['日', '一', '二', '三', '四', '五', '六'];
    var tot = { school: 0, tanet_unknown: 0, other: 0, visitors: 0, pages: 0 };
    var drows = daily.map(function (r) {
      Object.keys(tot).forEach(function (k) { tot[k] += r[k] || 0; });
      var w = wk[new Date(r.day + 'T00:00:00Z').getUTCDay()];
      return '<tr class="' + (r.visitors ? '' : 'zero') + '"><td class="date">' + esc(r.day) + '（' + w + '）</td>' +
        '<td class="num">' + fmt(r.school) + '</td><td class="num hide-sm">' + fmt(r.tanet_unknown) + '</td>' +
        '<td class="num hide-sm">' + fmt(r.other) + '</td><td class="num">' + fmt(r.visitors) + '</td>' +
        '<td class="num">' + fmt(r.devices) + '</td><td class="num hide-sm">' + fmt(r.pages) + '</td></tr>';
    });
    // 裝置的合計不能逐日相加（同一台會重複算），改用整段期間的不重複數
    $('daily').innerHTML = table([
      { t: '日期', w: '20%' }, { t: '學校', w: '12%', num: true }, { t: '學術網路', w: '14%', num: true, sm: true },
      { t: '其他網路', w: '14%', num: true, sm: true }, { t: '訪客', w: '12%', num: true }, { t: '裝置', w: '12%', num: true },
      { t: '瀏覽頁數', w: '16%', num: true, sm: true }
    ], drows, drows.length ? '<tr><td>合計</td><td class="num">' + fmt(tot.school) + '</td><td class="num hide-sm">' +
      fmt(tot.tanet_unknown) + '</td><td class="num hide-sm">' + fmt(tot.other) + '</td><td class="num">' + fmt(tot.visitors) +
      '</td><td class="num" title="整段期間不重複">' + fmt(s.devices) + '</td><td class="num hide-sm">' + fmt(tot.pages) + '</td></tr>' : '');

    // 熱門頁面：同一關的不同網址（有沒有 index.html）合併
    var merged = {};
    (d.paths || []).forEach(function (p) {
      var n = pageName(p.path);
      merged[n] = merged[n] || { name: n, n: 0, visitors: 0, devices: 0 };
      merged[n].n += p.n; merged[n].visitors += p.visitors; merged[n].devices += p.devices || 0;
    });
    var plist = Object.keys(merged).map(function (k) { return merged[k]; }).sort(function (a, b) { return b.n - a.n; });
    var pmax = plist.length ? plist[0].n : 1;
    $('paths').innerHTML = table([{ t: '頁面', w: '40%' }, { t: '', w: '18%' }, { t: '瀏覽', w: '14%', num: true },
      { t: '訪客', w: '14%', num: true }, { t: '裝置', w: '14%', num: true }],
      plist.map(function (p) {
        return '<tr><td class="trunc" title="' + esc(p.name) + '">' + esc(p.name) + '</td>' +
          '<td class="bar"><span style="width:' + (p.n / pmax * 100) + '%"></span></td><td class="num">' + fmt(p.n) +
          '</td><td class="num">' + fmt(p.visitors) + '</td><td class="num">' + fmt(p.devices) + '</td></tr>';
      }));

    drawTrend(d);

    // 來源分布
    var order = SERIES.map(function (s) { return s.k; });
    var srcs = (d.sources || []).slice().sort(function (a, b) {
      var ia = order.indexOf(a.source_type), ib = order.indexOf(b.source_type);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    drawShare(srcs);
    var all = srcs.reduce(function (a, r) { return a + r.n; }, 0);
    $('sources').innerHTML = table([{ t: '來源', w: '52%' }, { t: '瀏覽', w: '24%', num: true }, { t: '占比', w: '24%', num: true }],
      srcs.map(function (r) {
        return '<tr><td>' + esc(SOURCE[r.source_type] || r.source_type) + '</td><td class="num">' + fmt(r.n) +
          '</td><td class="num">' + (all ? Math.round(r.n / all * 100) : 0) + '%</td></tr>';
      })) + (srcs.length ? '<div class="note">學校＝TANet 查得到單位名稱；學術網路＝屬 TANet 但查不到單位。</div>' : '');
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    token = $('tok').value.trim();
    if (!token) return;
    store.set(KEY, token);
    $('tok').value = '';
    load();
  });
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () { range = b.dataset.range; store.set(RANGE_KEY, range); load(); });
  });
  $('reload').addEventListener('click', load);
  var rt;
  addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { if (lastData && !$('reportView').hidden) drawTrend(lastData); }, 150);
  });
  $('logout').addEventListener('click', function () { store.del(KEY); token = null; showLogin(''); });

  if (token) load(); else showLogin('');
})();
</script>
</body>
</html>
